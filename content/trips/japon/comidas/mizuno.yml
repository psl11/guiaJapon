body: >-
  Abierta en **1945**, entre las ruinas, y con **Bib Gourmand** desde hace años. Es la casa que todo el mundo cita en Dōtonbori y, contra toda expectativa de una calle tan turística, se lo merece: compran en el mercado de [Kuromon](#kuromon) —el pescado al pescadero, la carne al carnicero, los encurtidos al encurtidor— y lo cocinan delante de vosotros en la plancha de la barra.


  El truco de la casa es **ligar la masa con ñame rallado** en lugar de con harina, que da una textura mucho más aérea. Hay cola siempre; va rápida porque la gente come y se va.
