body: >-
  **Repetir a sabiendas.** Ya se durmió aquí en un viaje anterior y el motivo de volver es uno: el
  **Sky Spa**, el baño de la última planta, semiabierto al cielo, con sauna. Un *ōfuro* de hotel con
  vistas y sin salir del edificio, que después de trece horas de avión y ocho husos es la mejor
  herramienta que hay contra el jet lag: subir la temperatura del cuerpo y dejarla caer es de las pocas
  cosas que adelantan el reloj de verdad.


  **La logística sale mejor de lo esperado para estas dos noches.** Desde Narita hay **un solo tren**:
  el **Keisei Access Express** enlaza con la línea Asakusa y llega **directo a Shimbashi** en unos 70
  minutos por ~¥1.400 — más barato que el Skyliner y sin arrastrar la maleta por ningún transbordo. Y
  para el día de [Yokohama](#solo-3-yokohama), Shimbashi es la mejor base de Tokio: **Tōkaidō directo,
  veinticinco minutos**, bastante mejor que desde el norte de la ciudad.


  Lo que se paga a cambio es el día 2: los museos que abren gratis el festivo están en **Ueno**, a doce
  minutos de Yamanote. Nada grave.
