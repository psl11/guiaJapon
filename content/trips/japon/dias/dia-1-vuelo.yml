eyebrow: El plan · Día 1 · vie 6 nov
title: Hasta Tokio, *ocho husos* al este
dek: >-
  Un día que en realidad empieza el jueves. Se sale de Madrid la tarde anterior, se aterriza en
  Tokio a las **19:50** del viernes y se llega hecho polvo — eso es lo normal y no pasa nada. El plan de
  hoy es corto a propósito: hotel, cenar cerca, diez minutos de calle y a dormir.
blocks:
  - block: El vuelo
    time: "la noche anterior y todo el día"
    title: Ocho horas de ventaja, y la cuenta que sorprende
    body: >-
      Japón va **ocho horas por delante** de España en noviembre, y eso hace que la aritmética
      engañe. Los billetes del grupo lo demuestran: **salen de Madrid el jueves 5 a las 16:40**, no el
      6, porque el trayecto —Air China, con casi cinco horas de escala en Pekín— se come un día
      entero. Aterrizan en **Haneda a las 19:50 del viernes 6**. Ver [los vuelos](#vuelos).

      Quien compre todavía tiene ahí el aviso: **para llegar el 6 por la tarde hay que salir el 5**.
      Un vuelo que despegue el viernes por la mañana aterriza el sábado y corre el itinerario un día.

      La consecuencia de volar al este es que **el día se come a sí mismo**: se despega de noche, se
      cruza el amanecer en algún punto sobre Asia y se llega con el calendario intacto pero con el
      cuerpo ocho husos por detrás. Y de ahí sale el efecto que sí importa: **mañana os vais a
      despertar a las cinco sin despertador**. En cualquier otro viaje eso es un fastidio; en este es
      un regalo, como se verá el día 2.
    window:
      label: Qué se puede controlar en el avión, y qué no
      body: >-
        Poco, y conviene ser realista. **Las comidas no las decidís vosotros**: llegan cuando la
        tripulación las saca, normalmente al despegar de cada tramo y una hora antes de aterrizar. Lo
        único que está en vuestra mano es **si os las coméis**.

        Con eso, tres cosas que sí funcionan: **poner el reloj en hora japonesa al despegar**, para
        dejar de calcular; **dormir en el tramo que corresponda a la noche japonesa** aunque sea de
        día en la cabina, e ignorar la bandeja si cae en esa franja —se puede pedir que la guarden—;
        y **no dormir las dos últimas horas**, que es cuando entra la tentación.

        Y una expectativa honesta: **vais a llegar cansados igual**. De Madrid a Haneda son
        **diecinueve horas de puerta a puerta** contando la escala, y el reloj biológico solo arregla
        una parte. Lo bueno es que hoy no
        hay que hacer nada.
  - block: Llegada
    time: "19:50"
    title: Del aeropuerto a Akihabara
    body: >-
      Trámite de entrada, dinero y datos —los tres primeros movimientos— y al hotel. El grupo llega a
      **Haneda**, que juega a favor: está dentro de la ciudad y son unos **cuarenta minutos** al
      centro, frente a la hora y media larga de Narita. Aun así, contando cola de inmigración,
      maletas y trayecto, **de la puerta del avión a la del hotel se va a las nueve y media o las
      diez de la noche**. Del aeropuerto se llega con un solo transbordo: **monorraíl hasta
      Hamamatsuchō y la Yamanote hacia el norte**, o el Keikyū hasta Shinagawa y la misma Yamanote.
      La agenda de hoy es esta y no hay más: dejar las maletas en [**Akihabara**](#akihabara), que es
      la base de estos cinco primeros días, y salir a cenar algo cerca.
    window:
      label: Por qué no forzar la primera noche
      body: >-
        Es tentador salir a por el primer bol de [ramen](#ramen) a las once, pero conviene saber una
        cosa del barrio: **Akihabara cierra pronto**. Es un distrito de tiendas y a las diez la calle
        está vacía y las persianas bajadas — que es justo lo que interesa esta noche, aunque
        sorprenda si llegabais esperando neones a todo volumen. Dos direcciones seguras a esa hora:
        los callejones de [**Kanda**](https://www.google.com/maps/search/?api=1&query=Kanda%20Station%20Tokyo), una parada al sur, con
        izakayas bajo las vías abiertas hasta tarde; o el [konbini](#konbini) de la esquina, que la
        primera noche no es rendirse sino sentido común.

        Y ahí parar. Mañana el cuerpo os va a levantar de madrugada queráis o no, y **la primera
        mañana es la mejor de las cinco**: Sensō-ji vacío al amanecer solo funciona si os habéis
        acostado. Ya habrá noches — quedan veinte.
  - block: Noche
    time: "primera noche"
    title: Diez minutos de Akihabara
    dim: true
    body: >-
      Si después de cenar queda cuerpo —y puede que no—, que sea el paseo corto: **bajar a
      Chūō-dōri y mirar arriba**. Ocho plantas de fachada tapadas de carteles, personajes de anime
      del tamaño de un edificio y el zumbido de los salones recreativos, que son de lo poco que
      sigue abierto. Para tres de vosotros es la primera imagen de Japón, y esta sirve tan bien como
      cualquiera: no se parece a nada que hayáis visto en Europa. **Quince minutos bastan**, y si no
      da el cuerpo, tampoco pasa nada: mañana a las seis la ciudad sigue ahí.
alt:
  label: Si te desmarcas
  body: >-
    Si tu vuelo llega antes que el suyo —y con billete propio es probable— tienes una espera que
    aprovechar sin salir del aeropuerto: la **Terminal 3 de Haneda** tiene en la cuarta planta una
    **réplica de una calle de Edo**, con puestos y farolillos, y una **terraza al aire libre** desde
    la que se ven despegar los aviones. Veinte minutos, y a los otros tres les va a hacer más gracia
    de la que parece cuando lleguéis juntos otro día.

    Y si al final vuelas por **Narita**: con el hotel donde está, el que gana es el **Skyliner** de
    Keisei —cuarenta minutos hasta Ueno o Nippori y dos o tres paradas de Yamanote hasta la puerta—,
    más rápido y más barato que el Narita Express, que encima obliga a cambiar en Tokio.
