body: >-
  Una *izakaya* de pescado a cinco minutos de la salida oeste de Shinjuku, que compra directamente a
  cofradías de pescadores y hace el bonito *tataki* quemándolo con paja a la vista. Es la respuesta
  de quien la recomienda a una pregunta concreta: dónde cenar en Shinjuku sin caer en una trampa
  para turistas.


  Conviene decir lo que es: **una cadena**, con sedes en Akihabara, Shinagawa y varias más. Aquí eso
  no es un defecto sino justamente lo que la hace útil — el pescado es bueno, los precios están a la
  vista y nadie sale a la calle a pescar clientes, que es el filtro que importa en esta zona.


  Encaja en la noche del día 9, que ya termina en [los callejones de Shinjuku](#shinjuku). Es la
  alternativa con mesa a picar de barra en barra.
