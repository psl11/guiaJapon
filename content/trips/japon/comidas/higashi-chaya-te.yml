  **Matcha con un dulce de temporada**, y si os cruzáis con ello, el **helado con pan de oro** — hortera, célebre y bastante bueno.
body: >-
  Kanazawa se considera **la tercera ciudad del dulce japonés** después de Kioto y Matsue, y por la misma razón que las otras dos: donde hubo té de ceremonia con dinero detrás, hubo confiteros. El clan Maeda gastó tres siglos en cultura en lugar de en ejército, y esto es una de las cosas que quedaron.


  El barrio de **Higashi Chaya** son dos calles de casas de madera de dos plantas con celosías, las antiguas casas de geishas, y varias son hoy salones de té. Es de los pocos sitios de Japón donde el edificio en el que os tomáis el matcha es tan interesante como el matcha.
