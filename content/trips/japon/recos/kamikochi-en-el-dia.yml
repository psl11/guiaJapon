title: Kamikōchi en el día, y la noche de Hirayu
area: Matsumoto → el valle → Hirayu → Takayama · 9 y 10 nov
status: pendiente
note: "Una cama en Hirayu y un autobús desde Matsumoto"
body: >-
  **La noche dentro del valle no pudo ser.** Kamikōchi tiene una docena escasa de alojamientos, todos
  estacionales, sus reservas abren en enero y las últimas noches de la temporada se venden con meses
  de antelación: cuando se preguntó, estaban vendidas. No fue un descuido, es la aritmética del sitio
  — el porqué entero está en [dormir en el valle](#dormir-en-kamikochi).


  Lo que se hace en su lugar: **el valle entero en una jornada** —se entra desde Matsumoto por la
  mañana y se recorre de punta a punta, que las sendas son llanas y noviembre da once horas de luz—
  y **se duerme al otro lado del túnel, en Hirayu Onsen**, a veinticinco minutos en autobús. Al día
  siguiente, sin prisa, se baja a [Takayama](#takayama).


  **Hirayu es lo único del tramo que hay que reservar, y no se parece al problema anterior.** Es un
  pueblo termal abierto todo el año, con varias posadas —el **Hirayukan** y el **Okuhida Onsen
  Yamano Hotel** son los dos nombres que se repiten—, casi todas con media pensión y *rotenburo* al
  aire libre. No son doce camas estacionales: es un sitio donde se puede dormir en noviembre sin
  hazañas.


  Y esa cama compra algo concreto, más allá de no tener que correr: **el número de veces que se entra
  al agua**. Bajando de paso cabe un baño; durmiendo caben tres —antes de cenar, después y al
  amanecer— y de propina desaparece la trampa de horarios de la bajada, porque **el último autobús
  de Kamikōchi llega a Hirayu justo después de que salga el último a Takayama**. Quien intente
  encadenarlos se queda tirado; quien duerma allí, ni se entera.


  Dos avisos que quedan. **Los autobuses directos de Matsumoto al valle se llenan** y se compran
  online. Y **los horarios de noviembre no son los de temporada alta**: confirmadlos en la terminal
  el día que subáis, porque quedarse dentro del valle sí que no es una opción.
