blocks:
  - block: Mañana
    time: "10:00–13:00"
    title: Ikebukuro, todo en un barrio
    body: >-
      Las compras grandes se hacen hoy y en un solo sitio: **Ikebukuro**, el único barrio grande de
      Tokio por el que el viaje no ha pasado. Lo tiene todo sin cruzar la ciudad: dos grandes almacenes
      con sus *depachika* a ambos lados de la estación, drugstores y tiendas de cien yenes alrededor, y
      al este la zona de manga y anime. Lo que ya se compró por el camino, comprado está: hoy es para
      los regalos y para lo que no se quiso cargar.
    window:
      label: El tax-free, que este año cambia
      body: >-
        Recordad el pasaporte: hay exención de IVA en compras de **más de ¥5.000 en un mismo día y
        una misma tienda**. Japón tiene aprobado pasar en noviembre de 2026 del descuento en tienda
        al reembolso en el aeropuerto. Comprobadlo al llegar — está en [la ficha de dinero](#dinero).
    ver:
      - ficha: ikebukuro
        nota: Por qué el Tōbu está al oeste y el Seibu al este, y los jardines de la tarde.
      - nombre: Tōbu Ikebukuro
        maps: Tobu Department Store Ikebukuro
        nota: Gran almacén al oeste de la estación. Su *depachika* es para té, dulces y encurtidos envasados.
        lat: 35.7297846
        lon: 139.7103398
      - nombre: Seibu Ikebukuro
        maps: Seibu Ikebukuro Main Store
        nota: El otro gran almacén, al este, pegado a la estación.
        lat: 35.7288741
        lon: 139.7116292
      - reco: alba-drugstores
        nota: Los KitKat y dulces de regalo, a mitad de precio en una drugstore que en el konbini.
      - reco: alba-bolsa-3coins
        nota: Una bolsa grande y barata para lo que ya no cabe. Sin confirmar en catálogo.
  - block: Mediodía
    time: "13:00–15:00"
    title: El Don Quijote, y lo que falte
    body: >-
      Después de comer, la otra mitad de la lista: el Don Quijote para lo absurdo y barato, y el lado
      este si alguien busca manga o figuras. A las tres se cierra la compra; la tarde es de los
      jardines.
    ver:
      - nombre: Don Quijote Ikebukuro
        maps: Don Quijote Ikebukuro
        nota: Todo lo imposible de regalar en cuatro plantas, abierto hasta muy tarde.
        lat: 35.7329942
        lon: 139.7116581
      - nombre: Sunshine City
        maps: Sunshine City Ikebukuro
        nota: El centro comercial grande del lado este, con la zona de manga y anime de camino.
        lat: 35.7288478
        lon: 139.7195458
      - nombre: Pokémon Center Mega Tokyo
        maps: Pokemon Center Mega Tokyo
        nota: El más grande de Japón, en la 2.ª planta de Sunshine City. En domingo se llena; si es prioridad, a las 10:00.
        lat: 35.7288944
        lon: 139.7191826
      - nombre: Pikachu Sweets
        maps: Pikachu Sweets by Pokemon Cafe Ikebukuro
        nota: El mostrador del Pokémon Café dentro de la misma tienda. Bebidas y dulces sin reserva.
    comer:
      - comida: sen-ikebukuro
        nota: "*Tsukemen* de caldo concentrado en una barra con jazz, en el barrio que es su cuna."
      - comida: "nakiryu"
        nota: "El *tantanmen* que fue estrella Michelin, a una parada en Ōtsuka. El domingo, hasta las 15:00."
  - block: Tarde
    time: "15:00–18:00"
    title: El momiji, que ahora sí
    body: >-
      Y aquí está el regalo de haber vuelto. **El pico de la hoja roja en Tokio va del 20 de noviembre
      al 5 de diciembre**, así que estos días caen justo dentro. Los dos jardines de la lista nacional
      quedan de camino a casa: primero Rikugi-en, a tres paradas de Yamanote, y luego Koishikawa
      Kōrakuen. Los dos hacen iluminación nocturna en temporada.
    ver:
      - ficha: momiji
        nota: El calendario de la hoja roja, y por qué la ciudad se guardó para el final.
      - nombre: Rikugi-en
        maps: Rikugien Garden Tokyo
        nota: Diseñado en 1702 para reproducir ochenta y ocho escenas de poemas clásicos.
        lat: 35.7333998
        lon: 139.7463046
      - nombre: Koishikawa Kōrakuen
        maps: Koishikawa Korakuen Garden Tokyo
        nota: El otro jardín de la lista nacional del momiji, también con iluminación nocturna.
        lat: 35.7053631
        lon: 139.7491508
    comer:
      - comida: unagi-hashimoto
        nota: Anguila de Edo desde 1835, a un cuarto de hora andando del Kōrakuen. Con reserva.
  - block: Noche
    time: "noche"
    title: La cena que no se improvisa
    body: >-
      Quedan cuatro noches y es buen momento para gastar una en algo reservado. O en copas: el New
      York Bar del Park Hyatt, que es el de *Lost in Translation*, con jazz en directo — ver
      [la sección de salir](#new-york-bar).
    comer:
      - comida: toufuya-ukai
        nota: "*Kaiseki* de tofu al pie de la Torre de Tokio, en una fábrica de sake trasladada. Reservad ya."
      - comida: bar-benfiddich
        nota: En Nishi-Shinjuku, a un paseo del Park Hyatt. Nueve asientos y plantas majadas en mortero.
      - comida: sg-club
        nota: En Shibuya, dos bares en uno. El mejor cuando no todos queréis lo mismo.
alt:
  label: Si te desmarcas
  body: >-
    Un domingo es el mejor día para **[Jinbōchō](#jimbocho)**… salvo que muchas de sus ciento treinta
    librerías de viejo cierran precisamente en domingo. Comprobadlo. La alternativa segura es
    Nakano Broadway, cuatro plantas de manga, figuras y relojes de segunda mano al oeste de
    [Shinjuku](#shinjuku), que es lo que era Akihabara antes de volverse turístico.
