queEs: >-
  La **cocina de los monasterios zen**: enteramente vegetal, construida sobre caldo de *kombu* (alga) y de shiitake seco en lugar del *dashi* de bonito que sostiene el resto de la cocina japonesa. Excluye además el **ajo y la cebolla**, que el budismo consideraba estimulantes. Se sirve en bandejas lacadas, con muchos platos pequeños y todo a la vez.
historia: >-
  La trajeron de China los monjes **Dōgen y Eisai en el siglo XIII**, junto con el zen y con el té. Dōgen escribió además el *Tenzo Kyōkun*, «instrucciones para el cocinero del monasterio», que es probablemente el primer tratado del mundo que trata **cocinar como una práctica espiritual** y no como un oficio menor. De aquí salieron el tofu, el *yuba*, el seitán y buena parte de la técnica que luego heredó el *kaiseki*.
dondeMejor: "Kioto y el monte Kōya · dentro de los templos, casi siempre solo a mediodía"
picante: "—"
veg: "**100% vegetariano, y casi siempre vegano** — es la única cocina japonesa tradicional de la que uno se puede fiar sin preguntar nada"
body: >-
  Es la respuesta a la pregunta difícil de este viaje. En Japón un vegetariano pasa el día preguntando por el caldo; aquí **no hay nada que preguntar**, y además no está comiendo una versión recortada de otra cosa: la *shōjin* es una de las cocinas más refinadas del país por derecho propio.


  La ironía es que la técnica que hoy hace posible la alta cocina japonesa —el trabajo de la soja, el uso del alga para el umami, la estacionalidad estricta— salió de una cocina que **renunciaba a la carne por principio**. Kioto es su capital, y allí hay tres sitios de nivel muy distinto: [Shigetsu](#shigetsu) dentro del Tenryū-ji, [Izusen](#izusen-daijiin) en Daitoku-ji y [Ajiro](#ajiro), con estrella Michelin.
