body: >-
  Su nombre entero es Yopu no Ō Butashioyaki, «el rey del cerdo a la sal de Yopu», y hace una sola
  cosa: panceta a la plancha, a la coreana. La carne es Iwachū, un cerdo de marca de Iwate, madurada
  catorce días y cortada gruesa.


  Está en la guía por la mesa. Tiene tres plantas y reserva por internet, y en una noche en la que los
  cuatro no cabéis juntos en ninguna barra de Shinjuku, es lo que permite cenar sentados.
