quePedir: >-
  Un ***umeboshi*** y un ***kombu***, que son los dos que definen la casa, y **sopa de miso solo si preguntáis por el dashi**.
body: >-
  La **onigiri más antigua de Tokio** —abierta en 1954— y una de las pocas de su oficio con **Bib Gourmand**. Aquí el arroz se moldea a mano y **de uno en uno**, delante de vosotros, con una presión que parece descuidada y no lo es: la bola tiene que sostenerse hasta el último bocado y deshacerse al morderla. Nada más. No hay cocina.


  Es el mejor primer desayuno posible del viaje por una razón de calendario: el día 2 os vais a despertar a las cinco, vais a estar en el [Sensō-ji](#sensoji) al amanecer y a las siete y media tendréis un hambre rara. Esto abre temprano, está a la vuelta y cuesta lo que un café en España.
