slug: dia-14-osaka
navLabel: "Día 14 · Fushimi y Osaka"
trip: japon
order: 14
eyebrow: El plan · Día 14 · jue 19 nov
title: Osaka, la ciudad que *se arruina comiendo*
dek: >-
  El día empieza todavía en Kioto y de madrugada, en los diez mil torii de
  [**Fushimi Inari**](#fushimi-inari) — que a las siete es otro sitio distinto del que sale en las
  fotos. Después, media hora de tren y el contrario exacto de [Kioto](#kioto): sin patrimonio que
  defender, sin contención y con una palabra propia para definirse. Comer de pie y mirar carteles.
blocks:
  - block: Amanecer
    time: "06:45–08:45"
    title: Los diez mil torii, antes de que llegue nadie
    body: >-
      **[Fushimi Inari](#fushimi-inari) es el sitio más visitado de Kioto y el único que se puede
      tener vacío**, porque no es un templo con horario: es una montaña con un santuario, **abierta
      las veinticuatro horas y gratis**. A las siete de la mañana los túneles de torii están
      literalmente para vosotros; a las once son una cola en fila india.

      Está a **cinco minutos de la estación de Kioto** por la línea JR Nara —bajando en *Inari*, que
      deja en la puerta— y por eso encaja hoy y no otro día: es el único que sale hacia el sur.
      Subid al menos hasta el **mirador de Yotsutsuji**, a media montaña y unos cuarenta minutos: es
      donde se acaba el gentío incluso a mala hora y desde donde se ve Kioto entera.
    window:
      label: Hasta dónde subir, y por qué no hasta arriba
      body: >-
        La cima está a dos horas y media ida y vuelta y **no tiene vistas**: el bosque se cierra. Lo
        que hay arriba es el santuario interior y muchísimos torii pequeños, y es una caminata
        bonita, pero hoy hay un día entero por delante. **Yotsutsuji es el punto de rendimiento
        decreciente** — de ahí para arriba se repite el paisaje. Bajad por el ramal de la derecha,
        que pasa por el estanque y por los santuarios pequeños donde la gente deja torii en
        miniatura.
  - block: Mañana
    time: "09:30–12:00"
    title: El castillo, y lo que no es
    body: >-
      Se empieza por lo que más lejos queda. Y con una expectativa ajustada: **la torre del castillo
      es una reconstrucción de hormigón de 1931, con ascensor y museo dentro**. Lo que merece el
      paseo es lo de fuera — el parque, el foso y las **murallas de bloques de más de cien toneladas**
      que llegaron por mar desde otras provincias. Media hora larga y a otra cosa. El porqué, en
      [la ficha de Osaka](#osaka).
    window:
      label: Por qué a primera hora
      body: >-
        Porque es lo único de hoy con horario y con cola, y porque el resto del día no lo tiene: **la
        Osaka que importa es la de la tarde y la noche**, cuando se encienden los carteles. Hacer esto
        al revés deja el castillo cerrado y [Dōtonbori](https://www.google.com/maps/search/?api=1&query=Dotonbori%20Osaka) a mediodía, que es cuando peor está.
  - block: Mediodía
    time: "12:00–15:00"
    title: Kuromon, y por qué esta ciudad come así
    body: >-
      El **mercado de Kuromon** es la despensa de Osaka: pescado, vieiras a la brasa, fruta cortada,
      *takoyaki*. Se come de puesto en puesto y de pie, que es exactamente la forma local.

      Se come de puesto en puesto y de pie, que es la forma local — y no es una costumbre suelta:
      viene de que esta fue durante siglos **la despensa de Japón**, y eso está contado en su ficha.
  - block: Tarde
    time: "15:00–17:30"
    title: Shinsekai y la torre
    body: >-
      Un barrio que se construyó en **1912 imitando a la vez París y Coney Island** y que hoy es un
      caos de neón, ***kushikatsu*** y la torre [**Tsūtenkaku**](https://www.google.com/maps/search/?api=1&query=Tsutenkaku%20Osaka). Aquí está la regla más seria de
      Osaka: en el kushikatsu **el cuenco de salsa es comunitario y está terminantemente prohibido
      mojar dos veces**. Hay carteles.
  - block: Noche
    time: "18:00–22:00"
    title: Dōtonbori, con los carteles encendidos
    body: >-
      El canal con el frente de fachadas cubierto de neones y esculturas gigantes. Aquí solo hay que
      hacer tres cosas: **fotografiarse imitando al [Glico Running Man](https://www.google.com/maps/search/?api=1&query=Glico%20Running%20Man%20Dotonbori)
      desde el puente Ebisubashi**, que es tradición local y no trampa de turista; **echarle agua al
      Buda cubierto de musgo** del callejón de [Hōzen-ji](https://www.google.com/maps/search/?api=1&query=Hozenji%20Yokocho%20Osaka),
      que es el ritual del sitio; y cenar de pie.

      De cenar: [takoyaki](#takoyaki) y [okonomiyaki](#okonomiyaki), que aquí se hace mezclándolo todo
      antes de echarlo a la plancha. El resto lo cuenta [la ficha de Osaka](#osaka).
    window:
      label: Un aviso de los locales
      body: >-
        Lo bueno está tanto en los callejones de detrás como en el canal. **Los restaurantes con la
        fachada más espectacular de [Dōtonbori](https://www.google.com/maps/search/?api=1&query=Dotonbori%20Osaka) suelen ser los más caros y los peores**: el cartel de
        seis metros lo paga alguien.
alt:
  label: Si te desmarcas
  body: >-
    **La alternativa fuerte de hoy es cambiar Osaka por [Nara](#nara)**, y hoy encaja mejor que
    nunca por un detalle de horarios: **de Fushimi Inari sale un tren directo a Nara** por la misma
    línea JR, cuarenta y cinco minutos, sin volver a Kioto. Es decir, se puede hacer amanecer en los
    torii, mañana entera en Nara y volver a dormir a Kioto — un día completo sin repetir trayecto.

    Nara es la capital anterior,
    con el **Gran Buda de Tōdai-ji** —quince metros de bronce fundidos en el 752, en uno de los
    edificios de madera más grandes del mundo— y **mil doscientos ciervos sueltos** que son mensajeros
    de los dioses y que se inclinan para pedir galletas. Es un cambio de tema completo respecto a
    Kioto: si Kioto es la capital de la corte y del refinamiento, **Nara es la del budismo de Estado
    del siglo VIII**, la que cuenta [el acto primero](#acto-1-kami-y-corte). Quien vaya buscando el
    hilo histórico del viaje encontrará aquí el capítulo que falta.

    Y si se prefiere Osaka pero con otra cosa dentro: el
    [**Umeda Sky Building**](https://www.google.com/maps/search/?api=1&query=Umeda%20Sky%20Building%20Osaka), dos torres unidas arriba por un observatorio flotante con escaleras
    mecánicas al aire.
