title: La tarjeta IC, y por qué no hace falta más
area: Tokio y todo el tramo
note: "Suica o Pasmo · el metro NO es JR"
body: >-
  Lo primero al llegar: una **tarjeta IC** —**Suica** o **Pasmo**, da igual cuál—. Es una tarjeta
  recargable que vale para **metro, trenes JR y privados, muchos autobuses**, taquillas de
  consigna y para pagar en el konbini. Se recarga en cualquier máquina y se acabaron los billetes
  sueltos. También se puede llevar en el móvil.


  El detalle que confunde a todo el mundo: **el metro de Tokio no es JR**. Son dos redes distintas
  (Tokyo Metro y Toei, más las privadas), y ningún pase de JR las cubre. Con la IC card eso da
  exactamente igual, porque pasa por todos los tornos.


  Para las distancias largas del tramo —Kamakura, Matsumoto— se compran **billetes sueltos**, con
  asiento reservado en el Azusa. Ver la ficha de inversión del **JR Pass**: en este viaje no sale a
  cuenta.
