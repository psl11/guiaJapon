slug: dia-19-nikko
navLabel: "Día 19 · Nikkō"
trip: japon
order: 19
eyebrow: El plan · Día 19 · mar 24 nov
title: Nikkō, el mausoleo *más recargado* de un país que odia recargar
dek: >-
  Dos horas al norte y el contrario exacto de todo lo demás: donde Japón presume de madera sin
  pintar, aquí hay laca, oro y quinientas tallas policromadas. No es mal gusto — es una operación
  política que sigue funcionando cuatrocientos años después.
blocks:
  - block: Mañana
    time: "07:00–09:30"
    title: El Spacia desde Asakusa
    body: >-
      El **Tōbu Limited Express** sale de Asakusa y llega en unas dos horas con asiento reservado.
      Es más cómodo y más barato que la vía JR, que obliga a ir a Utsunomiya en Shinkansen y cambiar.
      Conviene sacarlo la víspera. Ver [Nikkō](#nikko).
    window:
      label: Hoy sí importa el día de la semana
      body: >-
        **Ayer fue festivo**, así que los museos que cierran los lunes **han trasladado su cierre a
        hoy, martes**. Da igual para Nikkō —los santuarios no cierran— pero es una razón más para que
        el plan de hoy sea este y no un día de museos en Tokio.
  - block: Mediodía
    time: "09:30–13:00"
    title: Convertir a un hombre en dios
    body: >-
      Cuatro cosas, y cada una tiene truco:

      - **El Yōmeimon.** Quinientas tallas en una sola puerta. La llaman «la puerta del atardecer»
      porque uno se queda mirándola hasta que anochece.
      - **El pilar del revés.** Está así a propósito. La perfección invita a la decadencia, así que el
      edificio se deja incompleto adrede.
      - **Los tres monos.** No son una obra suelta: son el segundo de **ocho paneles** sobre las edades
      de la vida, y representan la infancia.
      - **El gato dormido.** Al otro lado del panel hay gorriones. El gato duerme y los pájaros juegan
      sin miedo: la paz de los Tokugawa, tallada en veinte centímetros.
  - block: Tarde
    time: "13:00–16:00"
    title: El bosque, y una decisión honesta
    body: >-
      Detrás del santuario, la carretera de [**Irohazaka**](https://www.google.com/maps/search/?api=1&query=Irohazaka%20Winding%20Road%20Nikko)
      trepa en zigzag hasta el **lago Chūzenji** y la cascada de [**Kegon**](https://www.google.com/maps/search/?api=1&query=Kegon%20Falls%20Nikko).
      Son cincuenta minutos de autobús desde la estación, y de ahí sale la decisión de la tarde.

      Y aquí hay que ser honesto: **la parte alta de Nikkō tiene su momiji a finales de octubre**, así
      que a estas alturas de noviembre el color de arriba ya ha pasado. Abajo, en la zona del
      santuario, queda algo. Si el día va justo, el santuario vale por sí solo y la montaña puede
      dejarse.
  - block: Noche
    time: "noche"
    title: Vuelta con el último Spacia
    body: >-
      Se vuelve a Asakusa, que es el barrio de la primera mañana del viaje. Cerrar aquí, después de veinte
      días, en la misma estación desde la que se salió al amanecer del día 2, tiene su cosa. Y a diez
      minutos está la calle de las croquetas y los bares al aire libre de [**Hoppy-dōri**](https://www.google.com/maps/search/?api=1&query=Hoppy%20Street%20Asakusa%20Tokyo).
alt:
  label: Si te desmarcas
  body: >-
    En Nikkō, saltarse el [Tōshōgū](https://www.google.com/maps/search/?api=1&query=Nikko%20Toshogu%20Shrine) —herejía— y hacer el [**Rinnō-ji**](https://www.google.com/maps/search/?api=1&query=Rinnoji%20Temple%20Nikko) y el **Futarasan**, más antiguos,
    mucho más sobrios y sin nadie; o el paseo por la garganta de Kanmangafuchi, donde hay
    setenta estatuas de Jizō alineadas junto al río de las que se dice que nunca sale la misma
    cuenta dos veces. Y si el grupo prefiere no salir de Tokio: el martes es buen día para
    [Kamakura](#kamakura-zen) por segunda vez, o para el Museo Ghibli si se sacó entrada.
