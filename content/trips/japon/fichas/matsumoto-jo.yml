epithet: >-
  De los mil y pico castillos que tuvo Japón, solo doce conservan su torre original: el resto ardió y
  se rehízo en hormigón. Este es uno de los doce, es Tesoro Nacional, y su torre de cinco plantas es
  la más antigua del país.
sections:
  - heading: Por qué solo quedan doce
    body: |
      Japón llegó a tener más de mil fortalezas. Se las cargó, por este orden: una **ley de 1615**
      que ordenó un solo castillo por provincia y la demolición del resto; la **abolición del sistema
      feudal en 1873**, que mandó derribar casi todos los que quedaban por inútiles y por caros; y
      finalmente los **bombardeos de 1945**. De aquel millar sobreviven **doce torres del homenaje
      originales**, y en los años cincuenta y sesenta se levantaron decenas de réplicas en hormigón
      armado, con ascensor y vitrinas dentro.

      Matsumoto es uno de los doce auténticos. Su torre principal se levantó hacia **1594**, es la
      **más antigua de cinco plantas** que se conserva, y es **Tesoro Nacional** — la categoría más
      alta del patrimonio japonés, por encima de «bien cultural importante».
  - heading: Un castillo de llanura, y negro
    body: |
      La mayoría de los castillos japoneses se plantaron en una colina. Este no: es un
      ***hirajiro***, un castillo **de llanura**, y compensa la falta de altura con **tres fosos
      concéntricos** y un laberinto de recintos. El resultado es la mejor postal de castillo del
      país, porque se refleja entero en el agua con los **Alpes japoneses** al fondo.

      Lo llaman **Karasu-jō**, el castillo cuervo, por el negro de su laca. Y tiene un añadido que
      lo delata: el **Tsukimi-yagura**, la «torreta para contemplar la luna», una galería abierta con
      barandilla bermellón pegada al costado. Se construyó hacia 1630, ya **en tiempos de paz**, para
      ver la luna llena reflejada en el foso — una terraza de placer atornillada a una máquina de
      guerra. Las dos épocas de Japón en el mismo edificio.
  - heading: Se sube con las rodillas
    body: |
      Por dentro no hay concesiones y eso es lo bueno. Se entra **descalzo**, con los zapatos en una
      bolsa, y se suben seis niveles por **escaleras de madera casi verticales**, algunas con
      peldaños de cerca de sesenta centímetros y pendientes de más de 55 grados. No es mal diseño:
      **es la defensa**. Un atacante con armadura por esas escaleras es un blanco parado.

      Por el camino se ven las ***sama***, las troneras: **cuadradas o rectangulares para arcabuz,
      triangulares para arco**, abiertas a la altura del pecho. Y en la última planta, las vigas
      originales del XVI y una ventana desde la que, con día claro, se ven las montañas a las que
      subiréis pasado mañana.
curiosidades:
  - >-
    De los más de mil castillos que tuvo Japón, **solo doce conservan la torre original**: los demás
    los tiró una ley de 1615, la abolición feudal de 1873 o las bombas de 1945. Casi todos los
    castillos «japoneses» que salen en las fotos son réplicas de hormigón de los años sesenta.
  - >-
    El **Tsukimi-yagura** —la torreta para contemplar la luna, con su barandilla bermellón— se añadió
    hacia 1630, **ya en tiempos de paz**: una terraza de recreo pegada a una fortaleza. Las dos
    épocas de Japón en el mismo edificio.
  - >-
    Las escaleras interiores tienen peldaños de casi **sesenta centímetros** y más de **55 grados** de
    inclinación. No es un defecto: un atacante con armadura subiendo por ahí es un blanco inmóvil.
