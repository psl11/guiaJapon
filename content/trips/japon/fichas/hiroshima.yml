epithet: >-
  El 6 de agosto de 1945 a las 8:15 desapareció una ciudad. Lo que se visita hoy no es un
  cementerio: es una ciudad de un millón doscientos mil habitantes, ruidosa y con muy buena comida,
  que decidió conservar una sola ruina en el centro y construirlo todo lo demás de nuevo. Esa
  decisión —qué guardar y qué rehacer— es el verdadero monumento.
sections:
  - heading: La cúpula
    body: |
      El **Genbaku Dome** era el Palacio de Promoción Industrial de la prefectura, obra del arquitecto
      checo **Jan Letzel**, inaugurado en **1915**. La bomba estalló a unos **seiscientos metros de
      altura y a ciento cincuenta metros de allí**: casi verticalmente encima. Por eso el edificio se
      mantuvo en pie cuando todo lo demás cayó — la onda expansiva le llegó **desde arriba**, y los
      muros aguantaron mientras el techo y todo el interior desaparecían. Todos los que estaban
      dentro murieron.

      En los años cincuenta hubo un debate real sobre demolerlo: mucha gente no quería verlo. Se
      decidió conservarlo tal cual, con las mismas grietas, y desde entonces solo se refuerza — no se
      restaura. Es Patrimonio de la Humanidad desde **1996**.
  - heading: El parque, y quién lo diseñó
    body: |
      El **Parque Memorial de la Paz** se construyó sobre el barrio de Nakajima, el más animado de la
      ciudad antes de la bomba y el que quedó exactamente bajo el hipocentro. El proyecto lo ganó en
      **1949**, con treinta y cinco años, un arquitecto entonces desconocido: **Kenzō Tange**. Fue su
      primera obra importante — quince años después firmaría el gimnasio olímpico de Yoyogi que se
      ve en Tokio, ver el [acto 6](#acto-6-ceniza-y-milagro).

      Su idea es de una sencillez brutal: **un eje**. El museo, el cenotafio y la cúpula están
      alineados, de modo que **desde el cenotafio, el arco enmarca la llama y la cúpula al fondo**.
      Hay que ponerse en el sitio exacto para verlo, y es el momento del parque.

      Dentro del arco están los nombres de todos los muertos identificados por la bomba, incluidos
      los que fueron muriendo después. La lista **se sigue actualizando cada agosto**. El epitafio
      —«descansad en paz, no repetiremos el error»— no tiene sujeto en japonés, y esa ausencia
      deliberada de culpable ha dado ochenta años de discusión: quién es el que no repetirá el error.

      La **Llama de la Paz** lleva encendida desde 1964 y **está previsto apagarla** el día en que
      desaparezca la última arma nuclear del planeta.
  - heading: El museo, y Sadako
    body: |
      El **Museo Memorial de la Paz** se renovó por completo en 2019 y hoy apenas usa texto: son
      objetos y testimonios. Es **duro** —un triciclo, un uniforme escolar, la sombra de una persona
      impresa en unos escalones de granito, relatos en primera persona— y está hecho sin
      sensacionalismo y sin señalar culpables. Se sale en silencio. Hora y media larga, y conviene
      no encadenarlo con nada.

      Fuera está el **Monumento a los Niños**, por **Sadako Sasaki**, que tenía dos años el día de la
      bomba y desarrolló leucemia a los once. Se propuso doblar mil grullas de papel siguiendo la
      creencia de que quien lo consigue recibe un deseo. Murió en 1955. Al monumento llegan cada año
      **millones de grullas** de colegios de todo el mundo, y se exponen en vitrinas alrededor.

      Otro detalle que se pasa por alto: por la ciudad hay unos **ciento setenta árboles
      supervivientes** —*hibakujumoku*—, sauces, cánforas y ginkgos que rebrotaron el año siguiente
      cuando se decía que allí no crecería nada en setenta y cinco años. Están señalizados con una
      placa.
  - heading: La otra Hiroshima
    body: |
      No conviene irse sin ver que es una ciudad **normal y muy viva**:

      - El ***okonomiyaki* de Hiroshima**, que es otro plato distinto al de [Osaka](#osaka): aquí **no se
        mezcla**, se monta en capas —masa fina, montaña de col, panceta, **fideos** *yakisoba*, huevo
        a la plancha— y sale una torre. En [**Okonomi-mura**](https://www.google.com/maps/search/?api=1&query=Okonomimura%20Hiroshima), un edificio con más de veinte puestos
        apilados en varias plantas, se come de pie en la plancha.
      - Las **ostras**: la bahía de Hiroshima produce el **60 % de las de Japón**, y noviembre es
        justo el arranque de la temporada.
      - [**Shukkei-en**](https://www.google.com/maps/search/?api=1&query=Shukkeien%20Garden%20Hiroshima), un jardín de 1620 arrasado por la bomba y replantado, con un ginkgo
        superviviente dentro.
      - El **tranvía**, que funciona desde 1912. Varios de los vagones que circulan hoy son
        **supervivientes de 1945**: volvieron a dar servicio tres días después de la bomba.

      Llegar: **Shinkansen desde Osaka, 1 h 25**; desde [Kioto](#kioto), unas 2 h. Lo razonable es **una
      noche**, para hacer el parque un día y [Miyajima](#miyajima) al siguiente.
curiosidades:
  - >-
    La cúpula sigue en pie **porque la bomba estalló casi encima**: la onda llegó desde arriba y los
    muros aguantaron. Se debatió demolerla en los años cincuenta y se decidió **conservarla sin
    restaurar** — solo se refuerza.
  - >-
    El parque lo diseñó **Kenzō Tange en 1949**, a los treinta y cinco años y sin obra previa: el
    museo, el cenotafio y la cúpula están **alineados en un eje**, de modo que el arco enmarca la
    llama y la ruina. Fue el trabajo que lanzó su carrera.
  - >-
    La **Llama de la Paz** lleva encendida desde 1964 y **se apagará el día en que desaparezca la
    última arma nuclear del mundo**. Y el epitafio del cenotafio **no tiene sujeto** en japonés:
    ochenta años después se sigue discutiendo quién es el que no repetirá el error.
