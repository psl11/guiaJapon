body: >-
  No es una librería: son **unas ciento treinta**, apiñadas en unas pocas manzanas, con los cajones
  de saldo sacados a la acera y el interior apilado hasta el techo. Es la mayor concentración de
  libros de segunda mano del mundo, y existe porque aquí se fundaron las universidades de Tokio en
  la era Meiji — los estudiantes revendían, y las tiendas se quedaron.


  Detalle que se nota al pasear: **casi todos los escaparates miran al norte**. No es casualidad. La
  calle principal corre de este a oeste y los libreros se instalaron en la acera sur para que **el
  sol nunca dé de lleno en el papel**. Cien años de decisiones comerciales tomadas contra la luz.


  La mayoría del fondo es en japonés, pero hay especialistas: **Kitazawa Shoten** lleva libro antiguo
  en inglés en una sala con escalera de madera y balaustrada que parece otra ciudad; **Ohya Shobō**
  vende grabados *ukiyo-e* originales y mapas de Edo por menos de lo que cuesta una reproducción
  enmarcada en casa; y hay tiendas monográficas de cine, de teatro y de fotografía. Para un
  fotógrafo, la de libros de fotografía japonesa es una trampa cara.


  Aviso: **el domingo es el peor día** —muchas cierran— y a cambio hay un festival del libro usado a
  finales de octubre que llena la calle de puestos.
