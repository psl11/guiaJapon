body: >-
  Abrió en julio de 2023 y es la tienda de Disk Union dedicada solo a las canciones de anime y a la
  música de videojuegos, en CD y en vinilo, nuevo y usado: más de diez mil títulos solo de
  videojuegos. Es el **plan B de *Cowboy Bebop***: si en [Tower Vinyl](#tower-vinyl-shibuya) ya no
  quedan las ediciones de 2023, aquí es donde aparecen de segunda mano.


  Está a tres minutos de la estación de Shinjuku-sanchōme y a cinco de la puerta Shinjuku del
  jardín, así que se mira al bajar del metro. El horario no está confirmado: la tienda hermana del
  mismo edificio abre a las 12:00 entre semana.
