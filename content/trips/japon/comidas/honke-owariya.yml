quePedir: >-
  El ***hōrai soba***: cinco pisos de fideo frío con ocho guarniciones aparte que uno va combinando. Es el plato de la casa desde hace generaciones.
body: >-
  **Abrieron en 1465** —treinta años antes de que Colón llegara a América— vendiendo dulces, y acabaron haciendo soba para los monjes de los templos vecinos. Han sido proveedores de la casa imperial. Es, con bastante margen, **el restaurante más antiguo que vais a pisar en este viaje**.


  Y sin embargo no es caro ni ceremonioso: se hace cola en la calle, se come en un edificio de madera con jardín pequeño y se sale por quince euros. El *hōrai soba* llega en una torre de cinco cajitas lacadas y tiene algo de juego.
