blocks:
  - block: Amanecer
    time: "06:30–09:00"
    title: El baño de la mañana, y bajar
    body: >-
      En un ryokan el baño de antes del desayuno es la mitad del asunto: el agua está más caliente
      que el aire, sale vapor, y el bosque de la ladera amanece con escarcha. **Los onsen abren de
      madrugada precisamente para esto.** Después, el desayuno japonés de la casa —arroz, pescado,
      encurtidos, sopa de miso— y a la terminal, que está en el mismo pueblo.


      Una hora de autobús hasta [Takayama](#takayama), bajando el valle del río. Se llega a media
      mañana, y las maletas grandes llegan al hotel esa misma mañana.
    window:
      label: Lo que se gana durmiendo aquí
      body: >-
        Ayer se podía haber seguido hasta Takayama con el último autobús y ahorrarse una cama. No se
        hace por esto: **el baño de la noche, el de después de cenar y el del amanecer son tres, y de
        paso solo cabe uno**. Lo que aquí se compra no es el sitio, es el número de veces que se
        entra al agua.
    ver:
      - nombre: Salto de Hirayu
        maps: Hirayu Otaki Falls
        nota: "Sesenta y cuatro metros de caída, a veinte o treinta minutos andando de la terminal. Antes del desayuno, si se madruga."
  - block: Mañana
    time: "10:00–12:30"
    title: Sanmachi, las bolas de cedro y el Jinya
    body: >-
      Tres calles de casas de comerciantes intactas, con canales de agua a los lados: se andan en una
      hora larga. El juego es **mirar hacia arriba**, a las bolas de ramas de cedro que cuelgan sobre
      las puertas.


      A esta hora ya han llegado los autobuses de día desde Nagoya y Kanazawa, así que Sanmachi va
      llena. **No es un problema, es un aplazamiento**: mañana al amanecer el pueblo vuelve a ser de
      los suyos y esa es la hora que se ha reservado para los mercados.


      Hay **seis destilerías en tres calles** y casi todas dejan catar, pero con dos basta y un vasito
      en cada una: Kawashiri, la más tradicional, y Funasaka, la grande. No hace falta reservar ni
      tour: se entra, se cata y se compra si gusta.


      Antes de comer, a cinco minutos, el **Takayama Jinya**: la visita que casi nadie hace y la que
      mejor se recuerda. Entrad.
    window:
      label: Cómo se cata sin acabar el día torcido
      body: >-
        Las destilerías abren de **10:00 a 16:00** y muchas cierran el catado a media tarde. Casi
        todas cobran unos ¥300 por una tanda de tres o cuatro vasitos, y algunas regalan el vaso
        de cerámica. Empezad por las secas y subid hacia las dulces, no al revés — y con dos
        casas hay de sobra: el sake de Hida ronda los 16 grados y queda el resto del día.
    ver:
      - ficha: takayama
        nota: Los carpinteros que pagaban el tributo, y qué dice el color de la bola de cedro.
      - nombre: Sanmachi Suji
        maps: Sanmachi Suji Takayama
        nota: Tres calles de Edo sin bombardear. Distrito protegido, con seis destilerías que dejan catar.
        lat: 36.14169
        lon: 137.259514
      - nombre: Bodega Kawashiri
        maps: "川尻酒造場 高山市上二之町68"
        nota: "Casa de 1839, cata de pie en vasitos finos (~¥500 tres sakes). Su especialidad, el sake envejecido."
        lat: 36.142124
        lon: 137.260422
      - nombre: Bodega Funasaka
        maps: "舩坂酒造店 高山市上三之町105"
        nota: "La grande de Sanmachi. Cata con fichas: vaso ¥100, y tres fichas por ¥300."
        lat: 36.140747
        lon: 137.259735
      - nombre: Takayama Jinya
        maps: Takayama Jinya
        nota: La única oficina de gobierno de Edo que queda en Japón, con su sala de interrogatorios.
        lat: 36.1396918
        lon: 137.2576178
    comer:
      - comida: hida-kotte-ushi
        elegido: true
        nota: Para picar de paso, el buey en *nigiri* sobre galleta de arroz. Solo efectivo.
  - block: Mediodía
    time: "12:30–13:45"
    title: Buey de Hida, en la calle
    body: >-
      El **wagyū de esta prefectura** no pide restaurante caro: en las calles del casco viejo lo
      venden a la brasa en brocheta, en croqueta o dentro de un panecillo al vapor, por unos pocos
      euros. Se come de pie, con la sake de las destilerías de al lado.
    comer:
      - comida: hida-gyu
        elegido: true
        nota: La brocheta de los puestos de Sanmachi, o sentados, el *hōba-yaki* sobre hoja de magnolia.
  - block: Tarde
    time: "14:00–17:00"
    title: Hida-Furukawa, el Takayama sin autobuses
    body: >-
      Quince minutos de tren al norte está **Hida-Furukawa**, el pueblo que
      [Japonismo](https://japonismo.com/blog/excursion-bici-hida-furukawa-takayama) recomienda como
      excursión desde Takayama y que hace poca gente. Es la misma arquitectura sin los autobuses: el
      canal Seto, con un millar de carpas delante de almacenes de paredes blancas, casas de sake y
      una tienda de velas hechas a mano desde hace más de 240 años.


      Se empieza por la Matsuri Kaikan, que cierra a las cinco: las carrozas del festival del pueblo
      y sus autómatas, lo mismo que en Takayama se ve en el Yatai Kaikan. Después, el canal y el
      casco. Y para terminar, los sitios de *Your Name*, que están en
      [vuestras películas](#peliculas-del-grupo): el santuario Keta Wakamiya, la biblioteca y la
      estación donde se baja Taki, que es también la de la vuelta.
    window:
      label: Por qué esto y no la ladera de los templos
      body: >-
        La tarde de Takayama era el Yatai Kaikan y la caminata de Higashiyama, y siguen en la
        alternativa del día. Se cambió porque *Your Name* está en vuestra lista y porque Furukawa
        tiene lo que Takayama pierde a media mañana: la calma. **Las carpas siguen en el canal
        hasta finales de noviembre**; luego las mudan a un estanque, porque en invierno el canal sirve
        para echar la nieve. En 2024 fue el día 30.
    ver:
      - nombre: "Hida-Furukawa, el canal Seto"
        maps: "Seto River Hida Furukawa"
        nota: "Un millar de carpas entre almacenes de paredes blancas, a cinco minutos de la estación."
      - nombre: "Hida Furukawa Matsuri Kaikan"
        maps: "Hida Furukawa Matsuri Kaikan"
        nota: "Las carrozas del festival y sus autómatas. ¥700; en noviembre, de 9:00 a 17:00."
      - nombre: "Santuario Keta Wakamiya"
        maps: "Keta Wakamiya Shrine Hida Furukawa"
        nota: "El santuario de *Your Name*, y el del festival de Furukawa."
      - nombre: "Velas Mishima"
        maps: "三嶋和ろうそく店 飛騨古川"
        nota: "Velas japonesas hechas a mano desde hace más de 240 años, con el taller a la vista."
      - nombre: "Estación de Hida-Furukawa"
        maps: "Hida-Furukawa Station"
        nota: "Donde se baja Taki buscando a Mitsuha. Es también la de la vuelta."
  - block: Noche
    time: "noche"
    title: Cuando se van los autobuses
    body: >-
      A partir de las cinco de la tarde el pueblo se vacía de golpe y **es cuando mejor está**: las
      farolas encendidas sobre los canales, las casas cerradas y nadie por la calle. Es la razón de
      dormir aquí en vez de pasar de largo. Cenad *[soba](#soba)* de trigo sarraceno de la zona, o
      en una barra de sushi a cuatro minutos del hotel.


      Y poned el despertador: **mañana los mercados abren a las seis** y el autobús a
      [Shirakawa-gō](#shirakawa-go) sale a las ocho y media.
    comer:
      - comida: otafuku-takayama
        elegido: true
        nota: Barra de sushi y *kappō* en la calle de tabernas. Solo cenas desde las 17:30; el martes abre. Reserva el hotel.
      - comida: maruaki-takayama
        nota: El buey de Hida sentados y a la parrilla, en casa de una carnicería. La recomienda Japonismo.
alt:
  label: Si te desmarcas
  body: >-
    Si preferís quedaros en Takayama, la tarde que había: las carrozas del festival en el
    [**Yatai Kaikan**](https://www.google.com/maps/search/?api=1&query=Takayama%20Matsuri%20Yatai%20Kaikan),
    dentro del recinto del Sakurayama Hachimangū, y para cerrar, el Higashiyama Walking Course por
    la ladera este: hora y media entre una docena de templos hasta las ruinas del castillo, casi en
    solitario.


    [**Hida no Sato**](https://www.google.com/maps/search/?api=1&query=Hida%20no%20Sato%20Takayama), el pueblo-museo al aire libre a las afueras: treinta granjas de tejado de paja
    traídas de toda la región y remontadas, incluidas varias *gasshō-zukuri* como las de
    [Shirakawa-gō](#shirakawa-go). Si el tiempo estropea el plan de mañana, esto lo salva. Y para andar de verdad, el
    **sendero del castillo de Matsukura** sube en media hora desde Hida no Sato hasta las ruinas,
    a 857 metros, desde las que se ve el valle entero.

