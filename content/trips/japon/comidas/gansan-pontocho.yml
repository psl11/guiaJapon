body: >-
  Yakiniku de **ternera de Matsusaka** —una de las tres grandes del país, junto a la de Kobe y la de
  Ōmi— en Pontochō, con reservados que dan al río Kamo. Son treinta y seis plazas y admiten grupos
  grandes en privado.


  Cae exactamente donde ya termina el día 12, que cierra la jornada de Arashiyama y el pabellón
  dorado **en Pontochō**. Abre solo de cinco a once de la noche, con última comanda a las diez, así
  que es cena y nada más.


  Hay que reservar, y los reservados al río se van pronto: es de las cosas que se deciden desde
  España, no llegando. La cena de este día es de las pocas del viaje que admite un sitio caro sin
  desviarse un metro del plan.
