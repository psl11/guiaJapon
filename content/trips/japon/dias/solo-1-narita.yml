blocks:
  - block: Mañana
    time: "10:20–11:30"
    title: Narita T1, y la primera decisión
    body: >-
      El **LX 160** —con número de ANA, avión de SWISS— para en la **T1**, la de Star Alliance. Entre
      desembarcar, inmigración y equipaje se va **una hora larga**. Antes de salir de la terminal, la
      **tarjeta IC** y, si la vas a usar, la **eSIM** activada. La maleta, a una consigna de la estación
      de Narita ciudad: vas a andar dos horas.
    window:
      label: Por qué no ir directo a Tokio
      body: >-
        Porque hoy no da para Tokio. Has dormido a trozos en trece horas de avión y el hotel no te da
        la habitación hasta las tres. Narita ciudad está a **diez minutos** en dirección contraria,
        tiene el templo más importante del este de Japón y **no cierra**.
    ver:
      - reco: alba-welcome-suica
        nota: "La tarjeta IC sin fianza: tú vuelas desde Narita, que no devuelve el depósito."
  - block: Mediodía
    time: "~12:00"
    title: La calle de las anguilas
    body: >-
      De la estación al templo hay **unos diez minutos** por la **omotesandō**, la calle de
      peregrinación: casas bajas de madera, tiendas de encurtidos y, sobre todo, **anguila**, que los
      peregrinos comían del río Tone. Los cocineros la abren **en la calle, delante del local**, con
      un punzón y un cuchillo, como hace trescientos años.

      El primer plato del viaje es un **unadon**: anguila a la brasa con salsa dulce sobre arroz.
    window:
      label: Ventana óptima
      body: >-
        Justo a la hora de comer, que es cuando abren anguila en la puerta. A media tarde el espectáculo
        se acaba, y muchos locales cierran porque viven del mediodía.
    ver:
      - nombre: Kawatoyo
        maps: Kawatoyo Honten Narita
        nota: La casa de referencia del *unadon*, en mitad de la cuesta. Se hace cola, pero va rápida.
        lat: 35.7834275
        lon: 140.3166959
  - block: Tarde
    time: "~13:30–16:30"
    title: Narita-san Shinshō-ji
    body: >-
      El templo es de **940** y uno de los grandes del budismo Shingon: pagoda de tres pisos de 1712,
      sala principal y un parque detrás que casi nadie cruza.

      Lo que hay que ver es el **goma**, el rito del fuego, varias veces al día: los monjes queman
      tablillas con peticiones mientras suena el taiko. Se entra sin pagar, descalzo, y se sienta uno.
      Dura media hora larga, con calor, humo y tambor; al terminar, la gente pasa bolsos y carteras
      por el humo.
    window:
      label: Por qué hoy y no otro día
      body: >-
        Porque es lunes y **un templo no cierra en lunes**. Y porque estás aquí una sola vez: cuando
        vuelvas al aeropuerto el sábado 14 será a las nueve de la mañana con un vuelo a las 12:10.
    ver:
      - nombre: Narita-san Shinshō-ji
        maps: Naritasan Shinshoji Temple
        nota: Pagoda de tres pisos de 1712 y el rito del fuego, gratis, varias veces al día.
        lat: 35.7860497
        lon: 140.3182925
      - nombre: Parque de Narita-san
        maps: Naritasan Park
        nota: Ciento sesenta y cinco mil metros cuadrados de estanques y bosque detrás del templo.
        lat: 35.7865667
        lon: 140.3207770
  - block: Noche
    time: "18:00 en adelante"
    title: Shimbashi, el Sky Spa y a dormir
    body: >-
      Hasta **Shimbashi**, check-in en el [Candeo](#candeo-shimbashi) y —esto es lo importante hoy—
      **al Sky Spa de la última planta**. Después, cena corta cerca del hotel y a la cama pronto:
      mañana es festivo y el plan empieza temprano.
    dim: true
    window:
      label: El truco contra el jet lag
      body: >-
        Ocho husos al este es la dirección mala. Lo que mejor funciona es **no dormir de día, cenar
        pronto, meterse en agua caliente y acostarse a la hora local**: subir la temperatura corporal y
        dejarla caer después es de las pocas cosas que adelantan el reloj de verdad.
