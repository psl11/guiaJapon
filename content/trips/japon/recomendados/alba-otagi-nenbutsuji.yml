body: >-
  Mil doscientas figuras de piedra de los *rakan* —los discípulos del Buda— cubriendo la ladera, cada
  una con una cara distinta. Lo extraordinario es quién las hizo: **no las talló un escultor sino
  aficionados llegados de todo Japón** durante la restauración del templo en los años ochenta, bajo la
  dirección del monje y escultor Kōchō Nishimura. Hay figuras con raqueta de tenis, con cámara de
  fotos, riéndose a carcajadas. Cuesta quinientos yenes.


  Este templo es la razón por la que el itinerario cambió. Cierra los miércoles, y el día de
  Arashiyama era miércoles; su vecino [Adashino](#alba-adashino-nenbutsuji), a quinientos metros,
  cierra miércoles **y** sábados. **Los dos templos de esa calle cerraban justo el día que se pasaba
  por allí.** Al intercambiar el este y el oeste de Kioto —que no rompía ningún otro horario— los dos
  se abrieron de golpe.


  Está al final de Saga-Toriimoto, al pie del monte Atago, unos veinticinco minutos andando cuesta
  arriba desde donde termina la villa Ōkōchi Sansō. Se sube parando en Adashino, en el Giō-ji y en el
  Jōjakkō-ji, que abren todos los días.
