body: |
  El *maid café* nació en Akihabara a principios de los dos mil: camareras vestidas de criada que
  reciben al cliente como a su amo al volver a casa, cantan, hacen juegos y le echan a la comida un
  conjuro, *moe moe kyun*, para que sepa mejor. Maidreamin es una cadena con una veintena de
  locales, varios en este barrio, y su sede principal abre todos los días.

  - **¥880 por persona y hora**, más una consumición obligada por cabeza.
  - **La foto con las camareras se paga aparte.** Con el móvil, a ellas no se les hace.

  Pablo fue y se lo pasó en grande. Es para ir sabiendo a lo que se va, entrar en el juego y
  reírse, y una hora basta.
