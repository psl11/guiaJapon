slug: dia-12-kioto-este
navLabel: "Día 12 · Higashiyama"
trip: japon
order: 12
eyebrow: El plan · Día 12 · mar 17 nov
title: La ladera este, donde Kioto *sigue pareciendo Kioto*
dek: >-
  El día de las postales, y el único que exige madrugar de verdad. Un templo colgado sobre un
  barranco, dos cuestas empedradas y un barrio de casas de té — con diez mil personas más si se
  llega tarde.
blocks:
  - block: Amanecer
    time: "06:00–08:00"
    title: Kiyomizu-dera al abrir
    body: >-
      **Kiyomizu-dera abre a las 6:00**, y es de los poquísimos templos de Japón que lo hacen: a esa
      hora se puede estar solo en la plataforma. Dos cosas que hacer estando allí — asomarse al borde
      del tablado, que vuela trece metros sobre la ladera, y bajar a la cascada **Otowa** a beber de
      **uno solo** de sus tres canales. Beber de los tres anula el favor, y hay cola de japoneses que
      lo saben. Todo lo demás, en [Higashiyama](#higashiyama).
    window:
      label: Ventana óptima
      body: >-
        Este es **el mejor consejo de todo Kioto** y casi nadie lo sigue: entre las 10:00 y las 17:00
        las cuestas se andan en fila india. A las siete de la mañana son otra ciudad, con las tiendas
        cerradas y la luz entrando de lado entre las casas de madera. Merece la pena renunciar a una
        hora de sueño.
  - block: Mañana
    time: "08:00–11:30"
    title: Sannenzaka, Ninenzaka y la pagoda
    body: >-
      Se baja de Kiyomizu por las dos cuestas empedradas
      —[Sannenzaka](https://www.google.com/maps/search/?api=1&query=Sannenzaka%20Kyoto) y Ninenzaka—
      con la **pagoda de Yasaka** asomando al fondo, que es el plano que todo el mundo tiene en la
      cabeza. Se anda despacio y se mira hacia dentro de las tiendas, que son de cerámica y de té y
      no de imanes.

      Y **pisad con cuidado**: la superstición local dice que tropezar en ellas trae tres o dos años
      de mala suerte, según la cuesta. Venden amuletos para arreglarlo en la propia calle, que es un
      modelo de negocio redondo.

      A media mañana, un café en el [**% Arabica**](#arabica-higashiyama) con la pagoda en el
      ventanal: hay cola siempre y avanza en diez minutos.
  - block: Mediodía
    time: "11:30–14:00"
    title: Kōdai-ji y el camino hacia el norte
    body: >-
      La ladera sigue hacia arriba y pierde gente con cada manzana. [**Kōdai-ji**](https://www.google.com/maps/search/?api=1&query=Kodaiji%20Temple%20Kyoto), el templo que la
      viuda de Hideyoshi levantó en su memoria, tiene un jardín seco y **aperturas nocturnas en
      otoño** de las mejores de la ciudad — apuntadlo para esta noche. Y [**Chion-in**](https://www.google.com/maps/search/?api=1&query=Chion-in%20Temple%20Kyoto) merece la parada por su
      puerta y su campana, las dos desmesuradas por motivos que cuenta [la ficha](#higashiyama).
  - block: Tarde
    time: "14:00–17:00"
    title: Gion, y qué es y qué no es una geisha
    body: >-
      Al norte queda **Gion**, y basta con dos calles: [**Hanamikōji**](https://www.google.com/maps/search/?api=1&query=Hanamikoji%20Gion%20Kyoto),
      la de las casas de té con celosía, y el canal de **Shirakawa**, que es la más bonita y la que
      menos gente hace. El momento es **al encender los faroles**, no antes.

      Un aviso para no hacer el ridículo: casi todas las «maiko» que se ven de día por aquí son
      **turistas disfrazadas** en estudios de alquiler. Las profesionales van de un compromiso a otro
      y no posan. El vocabulario y el porqué, en [la ficha de Higashiyama](#higashiyama).
    window:
      label: Una norma que se multa
      body: >-
        Hay **callejuelas privadas cerradas al turismo y con multa**, señalizadas en la entrada. La
        regla del barrio, que vale para todo Japón: **no se persigue, no se toca y no se fotografía
        de cerca sin permiso**.
  - block: Noche
    time: "noche"
    title: El raitoappu
    body: >-
      En temporada de otoño varios templos de esta ladera **iluminan el jardín hasta las 21:00**: se
      llaman ***raitoappu***, cuestan un poco más que la entrada normal y son de las mejores cosas
      que se pueden hacer en Kioto. [**Kōdai-ji**](https://www.google.com/maps/search/?api=1&query=Kodaiji%20Temple%20Kyoto) y **Shōren-in** son los dos de aquí. La lista y las
      fechas exactas las publica cada templo en octubre: hay que mirarlas al llegar.
alt:
  label: Si te desmarcas
  body: >-
    El **[Camino del Filósofo](https://www.google.com/maps/search/?api=1&query=Philosopher%20Path%20Kyoto)**,
    hecho **al revés que todo el mundo**: de norte a sur y a última hora, cuando la marea va en la
    otra dirección y no queda casi nadie. Son dos kilómetros junto a un canal, con un templo en cada
    extremo — cuáles y por qué, en [Higashiyama](#higashiyama).
    norte en tren, dos pueblos de montaña unidos por un sendero de una hora con un onsen al final.
