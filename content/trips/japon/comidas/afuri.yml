body: >-
  El ramen que convence a quien cree que el ramen le pesa. Frente al *tonkotsu* denso y graso, Afuri
  hace un **caldo claro de sal con yuzu**, cítrico y ligero, con el pollo chamuscado al soplete por
  encima. Se pide en la máquina de la entrada y se cena en quince minutos.


  Dos razones para que esté aquí: hay sedes por medio Tokio —incluida [**Harajuku**](#harajuku), en plena ruta del
  día 3— y **tiene opción vegana de verdad**, cosa muy poco común en un mundo donde hasta el caldo
  «vegetal» suele llevar bonito.
