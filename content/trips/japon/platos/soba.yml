queEs: >-
  Fideo de **trigo sarraceno**, gris y con carácter, que se come frío con salsa aparte
  (***zaru soba***) o caliente en caldo (*kake*). El frío es el bueno: se moja la punta en el
  *tsuyu* con cebolleta y wasabi, y se sorbe.
historia: >-
  El sarraceno crece donde el arroz no —en frío y en altura—, y por eso la soba es **comida de
  montaña**: Nagano, la prefectura de Matsumoto, es la tierra clásica del país. En Edo se convirtió
  además en comida rápida urbana, y de ahí queda la costumbre de comerla de pie en los andenes.
dondeMejor: >-
  **Nagano y Matsumoto**, sin discusión: la *shinshū soba* es una denominación en sí misma. Buscad
  el *jūwari*, el 100 % sarraceno, sin trigo de apoyo.
picante: "—"
body: >-
  Detalle que sorprende: al final, en la soba fría, os traerán una tetera con el ***sobayu***, el
  agua turbia de cocer los fideos. Se echa en lo que queda de salsa y se bebe como un caldo. No es
  opcional en el rito local, y está bueno.
