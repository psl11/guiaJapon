body: >-
  La coctelería de Osaka en **Asia's 50 Best Bars**, en Kitashinchi, que es el barrio donde bebe la Osaka que trabaja en oficinas y no el turista de Dōtonbori. Técnica seria y sin la solemnidad de Ginza — que es, en general, la diferencia entre Osaka y Tokio.


  Solo tiene sentido si os quedáis a dormir o si el tren a Kioto se coge tarde. Si no, es apunte para otro viaje.
