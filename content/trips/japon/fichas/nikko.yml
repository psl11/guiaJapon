title: Nikkō, el mausoleo más recargado de un país que odia recargar
image:
  src: img/fichas/nikko.webp
  alt: "Detalle dorado y policromado de las tallas del santuario Tōshōgū de Nikkō."
  credit: "Pablo Sánchez"
epithet: >-
  Japón presume de sobriedad: madera sin pintar, líneas limpias, vacío. Y luego está Nikkō, donde el
  clan que gobernó el país durante dos siglos y medio enterró a su fundador bajo capas de laca,
  oro y quinientas tallas policromadas. No es una excepción de mal gusto: es una declaración
  política, y funciona todavía.
sections:
  - heading: Convertir a un hombre en dios
    body: |
      **Tokugawa Ieyasu**, el shōgun que unificó Japón y lo cerró al mundo, murió en **1616** y pidió
      ser enterrado en Nikkō, en la montaña, al norte de Edo — la dirección desde la que, según la
      geomancia, había que blindar la capital, la misma lógica de [Ueno](#ueno). Un año después fue
      **deificado**: pasó a ser **Tōshō-Daigongen**, «la gran encarnación que ilumina el este», un
      kami con santuario propio.

      El mausoleo original era discreto. Lo que se visita hoy lo mandó rehacer su nieto **Iemitsu**
      en **1636**, y la cifra da la medida de la intención: unos **quince mil artesanos** trabajando
      poco más de **un año y medio**, con dinero suficiente para dejar sin recursos a los daimyō a
      los que se «invitó» a contribuir. Ese era medio propósito: **arruinar a los señores rivales**
      mientras se les obligaba a financiar la divinización del enemigo.

      Hay un refrán japonés que resume el efecto que buscaba:
      ***Nikkō wo minakereba kekkō to iu na*** — «no digas *espléndido* hasta que hayas visto Nikkō».
  - heading: Lo que hay que mirar de cerca
    body: |
      - El ***Yōmeimon***, la puerta principal: más de **quinientas tallas** de sabios chinos,
        dragones, leones y flores, en oro y policromía. Se la apoda ***higurashi-no-mon***, «la
        puerta del atardecer», porque se puede pasar el día entero mirándola hasta que se hace de
        noche. Salió de una restauración de cuatro años en **2017** y los colores están recién
        recuperados.
      - **El pilar invertido.** Uno de los doce pilares de la puerta tiene el dibujo **puesto del
        revés a propósito**. La explicación que se da allí es de una elegancia total: **la perfección
        invita a la decadencia**, así que se introduce un defecto deliberado para que el edificio
        siga «incompleto» y no empiece a decaer.
      - **Los tres monos.** *Mizaru, kikazaru, iwazaru* —no ver, no oír, no decir— están tallados en
        el **establo sagrado**, en un panel que forma parte de una **serie de ocho escenas** sobre el
        ciclo de la vida de una persona. Los tres monos famosos son solo **la infancia**: la
        educación del niño. Los otros siete se los salta todo el mundo.
      - **El gato dormido** (*nemuri-neko*), atribuido al escultor legendario **Hidari Jingorō**: una
        talla minúscula sobre una puerta, y la clave está detrás — al otro lado del mismo panel hay
        **gorriones**. El gato duerme y los gorriones juegan sin miedo: es la imagen de la paz que
        trajeron los Tokugawa. Tras él arrancan los **207 escalones** que suben a la tumba de Ieyasu,
        que es —esta sí— una urna de bronce sobria en un claro de cedros.
      - Y el conjunto está dentro de un **bosque de criptomerias** plantado en el siglo XVII por un
        señor que no podía permitirse un regalo caro: **donó doscientos mil árboles**. Todavía hay
        una avenida de treinta y cinco kilómetros, la alameda más larga del mundo.
  - heading: La montaña, y por qué justo en noviembre
    body: |
      Nikkō no es solo el santuario. Detrás sube la carretera de [**Irohazaka**](https://www.google.com/maps/search/?api=1&query=Irohazaka%20Winding%20Road%20Nikko), dos rampas de
      **cuarenta y ocho curvas de horquilla** —una por cada sílaba del viejo silabario japonés, de
      ahí el nombre— hasta el **lago Chūzenji** y la cascada de [**Kegon**](https://www.google.com/maps/search/?api=1&query=Kegon%20Falls%20Nikko), noventa y siete metros de
      caída con un ascensor que baja al pie.

      Y este es el argumento que hace de Nikkō la excursión que mejor encaja con estas fechas
      concretas: en la lista nacional de mejores lugares para el momiji, **Nikkō aparece tres veces
      entre los veinte primeros** —la cascada Ryūzu, Irohazaka y el distrito de Yumoto—. Pero sobre
      todo: **el color baja por la ladera** y aquí empieza mucho antes. Arriba, en el lago Chūzenji y en
      [Irohazaka](https://www.google.com/maps/search/?api=1&query=Irohazaka%20Winding%20Road%20Nikko) —a mil doscientos metros—, el pico es de **mediados a finales de octubre**; abajo, en
      la zona del [Tōshōgū](https://www.google.com/maps/search/?api=1&query=Nikko%20Toshogu%20Shrine), cae en **la primera quincena de noviembre**, mientras que [Kioto](#kioto) no llega a
      su punto hasta la segunda. Es decir: **cuando el grupo aterrice, Nikkō tendrá el color que**
      **Kioto todavía no tiene** — y para entonces la parte alta ya lo habrá pasado. Ver la [ficha del momiji](#momiji).

      Aviso honesto de la misma moneda: es tan sabido que en esas fechas **Irohazaka se colapsa**, con
      atascos de horas los fines de semana. Entre semana y con el primer tren, funciona.
  - heading: Cómo se hace en el día
    body: |
      Desde **Asakusa**, el **Tōbu Limited Express** (*Spacia X* / *[Kegon](https://www.google.com/maps/search/?api=1&query=Kegon%20Falls%20Nikko)*) llega en unas **2 horas**
      y con reserva de asiento; es la vía cómoda y la que usa casi todo el mundo. Con JR hay que ir a
      Utsunomiya en Shinkansen y cambiar, y sale parecido en tiempo y más caro.

      Del andén de Nikkō al santuario hay autobús o veinticinco minutos a pie cuesta arriba, pasando
      por el [**Shinkyō**](https://www.google.com/maps/search/?api=1&query=Shinkyo%20Bridge%20Nikko), el puente lacado de rojo que marcaba la entrada al recinto sagrado y por el que
      **solo podían cruzar el shōgun y los peregrinos imperiales**. Su leyenda explica por qué está
      justo ahí: cuando el monje **Shōdō Shōnin** llegó a Nikkō en el siglo VIII no pudo vadear el
      río, y **dos serpientes se enroscaron formando un puente** para que pasara, desapareciendo
      después. No hace falta pagar la entrada para cruzarlo: se ve entero desde la carretera.

      **Todo Nikkō es Patrimonio de la Humanidad desde 1999**, y el conjunto incluye además el templo
      [**Rinnō-ji**](https://www.google.com/maps/search/?api=1&query=Rinnoji%20Temple%20Nikko) y el santuario **Futarasan**, más antiguos y muchísimo más tranquilos. Se hace en
      el día con el primer tren, pero **el lago y las cascadas piden quedarse a dormir**.
curiosidades:
  - >-
    Uno de los pilares del **Yōmeimon** está **colocado del revés a propósito**: la creencia es que
    **la perfección invita a la decadencia**, así que se deja un defecto deliberado para que el
    edificio siga incompleto.
  - >-
    Los **tres monos** —no ver, no oír, no decir— son solo **el segundo de ocho paneles** sobre las
    edades de la vida tallados en el establo sagrado. Representan **la infancia**. Casi nadie mira
    los otros siete.
  - >-
    **Nikkō tiene el momiji tres semanas antes que Kioto**, porque el color baja por la ladera: a
    primeros de noviembre la zona del [Tōshōgū](https://www.google.com/maps/search/?api=1&query=Nikko%20Toshogu%20Shrine) está en su punto. Tres de los veinte mejores lugares
    del país para las hojas de otoño están aquí — y los tres, en esta montaña.
