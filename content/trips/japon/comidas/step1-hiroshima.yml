body: >-
  Un bar internacional en Nagarekawa, la zona de noche de Hiroshima, abierto desde 2017. Mezcla
  ritmos latinos y música actual y está pensado para que se junten locales y gente de fuera, que es
  exactamente lo que suele faltar en una ciudad donde casi todos los bares son diminutos y de
  clientela fija.


  **Abre de ocho de la tarde a cinco de la mañana, todos los días.** El día 15 se duerme en
  [Hiroshima](#hiroshima) y es la única noche del viaje en esa ciudad, así que si alguien quiere
  salir después de cenar, esto está abierto cuando ya no lo está casi nada.


  Teléfono 082-241-3901, tercera planta. En Japón los bares en altura son la norma y no una rareza:
  el cartel de la calle es lo único que se ve.
