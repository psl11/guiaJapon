title: Diez vinilos para traerse de Japón
area: Tokio · el miércoles 4 en Shibuya y el viernes 6 de paso
note: "Lo que tiene gracia comprar allí · con su *obi* · y en cabina en el avión"
body: |-
  Comprar vinilos en Japón tiene sentido por dos cosas. La primera es la **edición japonesa**: el
  disco con su ***obi***, la faja de papel con el título en japonés que abraza la funda, y que fuera
  de Japón vale buena parte del precio. La segunda es la segunda mano, porque aquí los discos se
  cuidan y se venden en buen estado. Lo nuevo, en cambio, no es una ganga: la reedición de 2023 de
  *For You* costó ¥4.400, unos 26 €.

  El plan es [el miércoles 4 por la noche en Shibuya](#solo-3-ginza), entre
  [Tower Vinyl](#tower-vinyl-shibuya) y [HMV record shop](#hmv-record-shop-shibuya). El viernes 6
  caen de paso la tienda de jazz de [Disk Union en Ochanomizu](#disk-union-jazztokyo) y su tienda
  de anime en Shinjuku.

  **Los diez**

  1. **Seatbelts, *Tank! Gold* (2023).** El que tiene gracia traer de Japón. Por los veinticinco
     años de *Cowboy Bebop*, Flying Dog, el sello japonés de la serie, sacó tres recopilatorios
     elegidos y montados por Yoko Kanno. Este es el doble, en vinilo negro, con la funda en lámina
     dorada y su *obi*, y empieza con *Tank!*. Si no queda, los otros dos del mismo día: *The Real
     Folk Blues Legends*, doble, y *Songs for the Cosmic Sofa*. Esos dos los ha sacado también Milan
     fuera de Japón, así que lo que compensa aquí es la edición japonesa. La caja de once discos, con
     los siete álbumes y maxisingles de la serie, es japonesa y salió a ¥35.750.
  2. **Miles Davis, *Miles in Tokyo* (1964).** De su primera gira por Japón, el 14 de julio de 1964,
     con Sam Rivers al tenor: el único disco de ese quinteto antes de que llegara Wayne Shorter.
     CBS/Sony lo editó en 1969 solo para Japón, y en Estados Unidos no salió hasta 2005, en CD. La
     edición japonesa es la original.
  3. **Sonny Clark, *Cool Struttin'* (1958).** El disco de jazz que adoptó Japón. Entre 1991 y 2009
     vendió aquí 179.000 copias, frente a 38.000 en Estados Unidos, y más que *Blue Train* de
     Coltrane. Las ediciones japonesas de Blue Note abundan y están cuidadas.
  4. **Tsuyoshi Yamamoto Trio, *Midnight Sugar* (1974).** Trío de piano grabado en Tokio en una sola
     sesión, el 1 de marzo de 1974, para Three Blind Mice, el sello japonés de los setenta que buscan
     los audiófilos. Fuera se encuentra sobre todo en reediciones de audiófilo, caras; aquí, con
     suerte, aparece la original.
  5. **Ryo Fukui, *Scenery* (1976).** Trío de piano de Sapporo, el primer disco de Fukui y hoy uno
     de los más venerados del jazz japonés. El original cuesta mucho; la reedición de 2018 de We
     Release Jazz sale de las cintas originales y es la compra sensata.
  6. **The Beatles, en edición japonesa.** Tocaron en el Budokan en 1966, y en Japón los editaba
     Odeon, de Toshiba, que en los primeros años los prensó en vinilo rojo: el *akaban* (赤盤).
     *Abbey Road* (AP-8815) también tuvo tirada roja. Con el *obi* de la primera edición el precio
     se dispara; las ediciones negras posteriores, con su *obi*, son la compra razonable.
  7. **Deep Purple, *Made in Japan* (1972).** Se grabó para el mercado japonés, en Osaka y en el
     Budokan, del 15 al 17 de agosto de 1972, y salió aquí el 8 de diciembre, dos semanas antes que
     en el Reino Unido. Acabó siendo uno de los grandes directos del rock.
  8. **Cheap Trick, *At Budokan* (1978).** También pensado solo para Japón: salió el 8 de octubre de
     1978, y fueron las importaciones las que obligaron a editarlo en Estados Unidos en febrero de
     1979. La primera edición japonesa, con su *obi*, es la buena.
  9. **Tatsuro Yamashita, *For You* (1982).** El disco del *city pop*, el pop urbano japonés de los
     ochenta, con la portada de Eizin Suzuki. El original se encuentra de segunda mano. La reedición
     de 2023, en 180 gramos, llegó al número 4 de ventas en Japón.
  10. **Ryuichi Sakamoto, *Merry Christmas Mr. Lawrence* (1983).** La banda sonora de la película de
      Nagisa Ōshima en la que Sakamoto actuaba junto a Bowie, y que le dio el BAFTA. Su tema
      principal tiene versión cantada, *Forbidden Colours*, con David Sylvian.

  **El que no: Expedition 33.** La banda sonora de *Clair Obscur*, de Lorien Testard, la edita Laced
  Records, un sello británico: el doble LP salió a £36 y la caja de seis discos a £115, con envíos
  desde febrero de 2026. No tiene edición japonesa, así que en Tokio sería un importado y más caro.
  Se pide desde casa.

  **Al comprar**

  - **El *obi*, entero.** Sin él, una edición japonesa pierde buena parte de lo que vale.
  - **El estado va por separado**: 盤 es el disco y ジャケ, la funda. Mira las dos notas.
  - **El martes 3 es el día del disco japonés** (レコードの日): a medianoche salen ediciones
    limitadas en vinilo. El miércoles todavía queda algo en las estanterías.
  - **El *tax-free***, desde el 1 de noviembre, se paga entero y se devuelve en la aduana de salida,
    como el reloj del miércoles. Pregunta en caja: las tiendas pequeñas no siempre lo hacen.
  - **La vuelta a casa.** Compras el 4 y vuelas el 14, con los Alpes por medio. Mándalos por
    [takkyūbin](#takkyubin) al [Candeo Roppongi](#candeo-roppongi), donde duermes desde el 12
    —avisa al hotel de que llega un paquete—, y en el avión, en cabina y de pie. En la maleta
    facturada se doblan o se parten.
