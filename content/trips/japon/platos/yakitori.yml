title: Yakitori
image:
  src: img/platos/yakitori.webp
  alt: "Callejón nocturno de Tokio con farolillos, faroles de calle y letreros luminosos verticales."
  credit: "Pablo Sánchez"
queEs: >-
  Brochetas de pollo a la brasa de carbón, pieza a pieza y por partes: muslo (*momo*), piel (*kawa*),
  cartílago, corazón, alita, y la albóndiga *tsukune*. Se pide ***tare*** (glaseado de soja dulce) o
  ***shio*** (solo sal) — y con un buen pollo, siempre sal.
historia: >-
  Como el [tonkatsu](#tonkatsu), es hijo del fin de la prohibición budista de comer carne. Se hizo popular en la
  posguerra en los puestos de las estaciones, con las partes que nadie quería. Hoy hay yakitoriyas
  con estrella Michelin que sirven doce partes distintas del mismo animal.
dondeMejor: >-
  En un callejón con humo y taburetes: [**Omoide Yokochō**](https://www.google.com/maps/search/?api=1&query=Omoide%20Yokocho%20Shinjuku%20Tokyo), junto a la estación de [Shinjuku](#shinjuku), es el
  sitio arquetípico. Barras de seis plazas, brasa a la vista y ropa que huele a carbón al salir.
picante: "—"
veg: >-
  Hay brochetas de verdura (*yasai*) —shiitake, pimiento, cebolleta, espárrago— en casi todas las
  cartas, y suelen estar tan buenas como las de pollo.
body: >-
  Se acompaña de cerveza fría, siempre. Y un aviso para un grupo de cuatro: en estos callejones las
  barras son de **seis taburetes** — o entráis justos, o os repartís en dos locales y quedáis fuera.
