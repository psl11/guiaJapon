title: Mandar las maletas por delante
area: Tres envíos, y uno de ellos con trampa
note: "takkyūbin · unos pocos miles de ¥ por bulto"
body: >-
  El servicio que hace viable este itinerario. El ***takkyūbin*** es mensajería de equipaje de hotel
  a hotel: se entrega la maleta en recepción, se rellena un formulario y **al día siguiente está en
  el destino**. Cuesta unos pocos miles de yenes por bulto y es de una fiabilidad que no existe en
  Europa.


  Aquí se usa **tres veces**, y las tres por el mismo motivo: hay un tramo por delante donde la
  maleta grande no es incómoda, es inviable.


  1. **Tokio → Takayama**, el domingo 8 por la mañana. Es el importante. El lunes se sube a
     [Kamikōchi](#kamikochi), donde no hay coches ni ascensores y las sendas se hacen con mochila, y
     se duerme esa misma noche en [Takayama](#takayama). O sea: **la maleta tiene que llegar antes
     que vosotros**, y vosotros llegáis a las seis y media de la tarde. Se pide en recepción **la
     noche del sábado**, no el domingo por la mañana.
  2. **Kanazawa → Tokio**, el jueves 12.
  3. **Tokio → Kioto**, el domingo 15, y de vuelta el sábado 21.


  **Y ojo con la dirección, que es donde se falla.** En Tokio se duerme en dos hoteles distintos:
  [Akihabara](#akihabara) en la ida y la escala, y [Shinjuku](#shinjuku) las cinco últimas noches. La
  maleta que se manda desde Kansai de vuelta a Tokio va **al segundo**, no al primero. Escrito parece
  obvio; rellenando el albarán en piloto automático con la reserva vieja delante, menos.


  **Confirmad el plazo del primero.** De Tokio a Hida no siempre es de un día —a zonas de montaña
  puede ser de dos—, y ese envío no admite retraso porque llegáis de noche y sin nada. Preguntadlo en
  recepción al hacer el *check-in* del viernes, que es cuando todavía hay margen para mandarlo un día
  antes.
