body: >-
  Wagyu a la plancha en la calle Nishikikōji, a un paso del mercado de
  [**Nishiki**](https://www.google.com/maps/search/?api=1&query=Nishiki%20Market%20Kyoto) y a cinco
  minutos de Karasuma. Abre **seguido de once de la mañana a nueve de la noche**, con última comanda
  a las ocho, que en Kioto es una rareza útil: casi todo parte el servicio.


  Y aquí el aviso que importa: **cierra los lunes**, y el lunes 16 es justo el día de llegada, que es
  cuando el plan pasa por Nishiki. Así que este sitio no es para el día 11 aunque la geografía
  invite; es para el 13, que anda por el centro-este, o para cualquier hueco de los otros dos.


  Si el lunes cae festivo cierran el martes en su lugar. El 16 de noviembre de 2026 no es festivo, así
  que el cierre es el lunes y punto.
