body: >-
  Una barra de sushi y *kappō* en Suehiromachi, la calle de tabernas de Takayama, a **doscientos
  cincuenta metros del hotel**: cuatro minutos andando. El pescado no es de aquí —Takayama está en
  mitad de las montañas, a tres horas de la costa más cercana— y precisamente por eso el género se
  elige cada mañana en el mercado y la carta cambia a diario.


  Encaja en el día 5 por una razón de horario más que de gusto: **abre solo por la noche, de 17:30 a
  medianoche, y cierra los domingos**. El día 5 es martes, así que está abierto, y ese día
  [Takayama](#takayama) se vacía a las cinco de la tarde y no queda nada más que hacer. Que sea cena
  y solo cena deja de ser un problema y pasa a ser el plan.


  Dos correcciones a lo que se cuenta de él, porque conviene ir con la expectativa ajustada. No es un
  local de ocho plazas: son **treinta y cinco**, quince abajo y veinte arriba. Y en Tabelog tiene un
  3,07 con diecisiete reseñas, que en la escala japonesa —donde un 3,5 ya es notable— es correcto sin
  más, no un hallazgo. Quien lo recomienda lo llama la mejor comida de su viaje; es una opinión, y
  vale lo que valen las opiniones.


  Reservar no es opcional en una barra de este tamaño, y el camino corto es pedírselo al hotel: el
  teléfono es el 0577-33-0625 y allí no dan por hecho que se hable inglés.
