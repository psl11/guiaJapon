body: >-
  Es la cama que elige el día de [Nikkō](#dia-19-nikko). El tren sale de la estación Tōbu de
  Asakusa, a cuatro minutos andando de la puerta, y el madrugón del martes se queda en bajar a la
  calle. Ningún otro hotel de Tokio lo pone más fácil.


  El día del [Fuji](#dia-18-fuji) tampoco se sufre. La **Toei Asakusa** sale a dos minutos y sus
  trenes hacia Haneda o Misakiguchi llegan a Shinagawa sin transbordo, en unos veinticinco minutos.
  La misma línea resuelve el jueves del vuelo: **directa a Haneda**, con las maletas y sin cambiar
  de andén.


  Lo que se paga es la distancia al resto de la semana. Tsukiji, Ginza y el jardín de Hamarikyū
  quedan a veinte minutos de metro, no andando. Y es un APA: habitaciones de las más pequeñas de
  Tokio, algo que se nota más en cinco noches seguidas que en una.
