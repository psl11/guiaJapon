eyebrow: En solitario · mié 4 nov
title: Una casa de 1919, un ramen de seis asientos y la estación *encendida*
dek: >-
  Hoy el día es con tu familia, y se arma alrededor de una mesa en Ginza a la una, que es la hora a
  la que pueden. Por la mañana, Daikanyama y la casa Asakura; por la tarde, el museo que te
  recomiendan, a quince minutos andando del restaurante, y la azotea desde la que se ve la estación
  de Tokio al anochecer. De noche, vinilos en Shibuya. Antes de nada, la mudanza.
