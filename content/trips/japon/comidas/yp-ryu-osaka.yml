quePedir: "El *Hana no Kaidan Mori*, la **«escalera de flores»**: los cortes de wagyu montados en cascada."
body: >-
  Yakiniku de wagyu en un sótano de Sōemonchō, la calle que corre paralela al canal de
  [Dōtonbori](#osaka). Su plato de foto es el *Hana no Kaidan Mori*, una escalera de cortes
  crudos montada en cascada, y su lema —«yakiniku que no te sienta mal»— apunta a lo que hacen: menos
  grasa, más corte fino.


  Abre en dos turnos, de 11:30 a 14:30 y de 17:00 a 23:00. **La noche encaja sola con el día 14**,
  que termina precisamente ahí, en Dōtonbori con los carteles encendidos; el turno de mediodía choca
  con Kuromon, que ocupa de doce a tres.


  Un aviso sobre lo que circula: el vídeo promete un menú de mediodía de wagyu por 1.500 yenes
  limitado a quince comensales al día. **No he podido confirmarlo en ninguna fuente de la casa**, y
  lo que sí aparece publicado es el surtido de siete mil. Si alguien va buscando la ganga de los
  quince cubiertos, que pregunte antes de contar con ella.
