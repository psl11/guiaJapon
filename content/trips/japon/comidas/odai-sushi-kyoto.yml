body: >-
  Una casa familiar convertida en barra de sushi en una calle residencial de Saga. **No hay cartel
  fuera ni carta dentro**: el cocinero sirve lo que ha comprado esa mañana, pieza a pieza, y se come
  en silencio. El *omakase* cuesta cuatro mil yenes, que para lo que es resulta poco.


  Está en Ukyō, o sea en el lado oeste de la ciudad, camino de [Arashiyama](#arashiyama) — el mismo
  lado que ahora recorre el día 12. Eso lo pone a tiro sin desviarse.


  Dos correcciones al vídeo que lo trae: **son siete asientos, no diez**, y aunque se puede entrar
  sin reserva, con cuatro personas eso es jugársela. Y **solo aceptan efectivo**. Al ser una casa en
  un barrio de vecinos, la norma no escrita es la obvia: no montar ruido en la calle.
