nota: "Reserva doble con cancelación gratuita: compite con el APA Asakusa Kaminarimon."
body: >-
  Es la cama que elige el día del [Fuji](#dia-18-fuji). **Takarachō**, a cuatro minutos, está en la
  Toei Asakusa, y sus trenes hacia Haneda o Misakiguchi dejan en Shinagawa en unos doce minutos, sin
  transbordo. Google propone ir andando a Tokio Estación, un cuarto de hora, pero la estación es tan
  grande que el andén del Shinkansen queda bastante más lejos que la entrada.


  [Nikkō](#dia-19-nikko) queda a un solo tren: la línea Ginza desde **Kyōbashi**, a tres minutos,
  termina en Asakusa en unos quince. El jueves del vuelo, la Toei Asakusa sigue **directa hasta
  Haneda**, igual que desde el APA.


  Lo que gana frente al otro es el resto de la semana. El [día 20](#dia-20-tsukiji-ginza) —Tsukiji,
  [Ginza](#ginza), Hamarikyū— se hace andando desde la puerta, y la mitad del día de compras también.
  Lo que pierde es el madrugón de Nikkō: son quince minutos de metro donde el APA tiene cuatro andando.
