title: Mandar las maletas por delante
area: Tres envíos, y uno de ellos con trampa
note: "takkyūbin · unos pocos miles de ¥ por bulto"
body: >-
  El servicio que hace viable este itinerario. El ***takkyūbin*** es mensajería de equipaje de hotel
  a hotel: se entrega la maleta en recepción, se rellena un formulario y **al día siguiente está en
  el destino**. Cuesta unos pocos miles de yenes por bulto y es de una fiabilidad que no existe en
  Europa.


  Aquí se usa **tres veces**, y las tres por el mismo motivo: hay un tramo por delante donde la
  maleta grande no es incómoda, es inviable.


  1. **Matsumoto → Takayama**, el domingo 8 por la tarde. Es el importante. El lunes se sube a
     [Kamikōchi](#kamikochi), donde no hay coches ni ascensores y las sendas se hacen con mochila, y
     se duerme en Hirayu Onsen. El martes por la mañana se baja a [Takayama](#takayama), y ahí
     tiene que estar la maleta. Hasta Matsumoto viaja con vosotros —son dos trenes—, y así solo se
     pasa sin ella un día y una noche.
  2. **Kanazawa → Tokio**, el jueves 12.
  3. **Tokio → Kioto**, el lunes 16 por la mañana, y de vuelta el sábado 21.


  **Y ojo con la dirección, que es donde se falla.** En Tokio se duerme en **tres hoteles distintos**:
  [Akihabara](#akihabara) las dos noches de la llegada, [Roppongi](#roppongi) las cuatro de la escala
  y un tercero las cinco últimas, en Asakusa o en Ginza según la reserva que se quede. La maleta que sale de Kanazawa va a la segunda dirección
  y la que vuelve de Kansai a la tercera. Escrito parece obvio; rellenando el albarán en piloto
  automático con la reserva vieja delante, menos.


  **Con quién se manda el de Matsumoto.** Las dos opciones cuestan prácticamente lo mismo, así que
  manda el tamaño de la maleta y la tienda que quede más cerca:


  - **Yamato (Kuroneko), que es la recomendada.** Es la que gestionan los hoteles, la de todas las
    guías y la que admiten 7-Eleven y FamilyMart, y deja elegir franja de entrega. De Nagano a Gifu,
    una maleta mediana —hasta 160 cm sumando largo, ancho y fondo, y 25 kg— cuesta **¥3.020**. Una
    grande, ¥3.680 hasta 180 cm y ¥4.470 hasta 200. Llevándola vosotros a la tienda, ¥100 menos.

  - **Japan Post (Yu-Pack)**, en Lawson y en correos: ¥3.000 la de 160 cm y ¥3.680 la de 170, que
    es su máximo. Solo compensa si lo único que hay cerca es un Lawson, y una maleta grande no cabe.


  **Confirmad el plazo del primero.** De Matsumoto a Takayama hay una prefectura de distancia y lo
  normal es que llegue al día siguiente, pero Hida es zona de montaña. Pedid entrega el martes por
  la mañana (*gozen-chū*) y comprobadlo con los dos códigos postales en el buscador de plazos de
  Yamato antes de salir de España. Si saliera a dos días, hay que mandarla desde Tokio el sábado,
  como se planeó al principio.
