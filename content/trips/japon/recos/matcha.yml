title: El matcha, dónde comprarlo y cuál para qué
area: Tokio, antes del 14 · y Kioto para los que siguen
note: "Ippodo · una lata por persona y tienda"
body: |
  **Lo primero, porque cambia el plan: hay escasez.** Desde 2025 la hoja con la que se hace el
  matcha (*tencha*) no llega para la demanda, y las casas buenas **limitan la venta a una lata por
  persona**. Ippodo lo aplica en Tokio, y a principios de 2026 las tiendas de té de Ueno seguían
  igual. No es para alarmarse —en Kioto hay más existencias—, pero sí para no dejarlo al último día
  y para repartir las compras entre tiendas.

  **Dos matchas distintos, para dos usos distintos:**

  - **Para tomar solo, batido con agua (el «ceremonial»).** La referencia es **Ippodo**, casa de
    Kioto desde 1717. El **Sayaka** es el equilibrado y el más vendido; el **Ummon**, el de arriba
    de la gama. En Japón cuesta bastante menos que fuera: en su tienda de EE. UU. la lata de 40 g de
    Sayaka va a 50 dólares, y en su web japonesa el Ummon de 20 g estaba en ¥4.320.
  - **Para latte con leche y hielo.** No hace falta el caro: la leche tapa los matices finos y lo
    que se busca es un amargor que aguante. **El Ikuyo de Ippodo** es el que la propia casa recomienda
    para latte, y viene en bolsa de 100 g. Y el de supermercado que ya conoces sigue siendo buena
    compra: el **matcha de Ito En (お〜いお茶 抹茶)**, 30 g por unos ¥864 de precio de referencia. En
    cualquier supermercado, el que pone 「お点前用」 suele ir de ¥120 a ¥300 los diez gramos.

  **Y los precios de Ippodo van a cambiar justo cuando estéis allí.** La casa anunció el 1 de
  septiembre de 2026 una revisión de precios y de formatos para octubre y noviembre, la segunda en un
  año, por la cosecha de 2026. Las cifras de arriba son de antes: contad con pagar algo más.

  **Dónde, si eres el que se va el 14.** Las dos tiendas de Ippodo en Tokio caen en días tuyos:

  - **Ippodo Aoyama**, la tienda grande, abierta en agosto de 2025: segunda planta del 4-23-6 de
    Minami-Aoyama, a ocho minutos de la salida A5 de Omotesandō, hacia el Museo Nezu. **De 10:00 a
    18:00, cierra los lunes.** Tiene salón de té con reserva. Encaja **el martes 3**, en
    [la tarde de Omotesandō](#solo-2-yabusame), y **el sábado 14 con el grupo**, en
    [el Harajuku del día 9](#dia-9-yamanote): ahí compráis los cuatro, una lata cada uno.
  - **Ippodo Shin-Marunouchi**, en el sótano del edificio Shin-Marunouchi, pegado a la estación de
    Tokio. **De 11:00 a 21:00** (domingos y festivos, hasta las 20:00). Encaja **la tarde libre del
    viernes 6** —está enfrente del Intermediatheque— y [la vuelta de Kamakura](#dia-8-kamakura) si
    se cena en la estación.

  **Y para los tres que siguen:** la casa madre de Ippodo está en Teramachi-Nijō, en Kioto, a diez
  minutos al norte de la calle por la que se pasa el [día 11](#dia-11-tokio-kioto). Es la tienda con
  más existencias de todas.

  Un apunte de conservación: el matcha se oxida rápido. Lata cerrada, en la nevera al llegar, y
  abierta se gasta en un mes.
