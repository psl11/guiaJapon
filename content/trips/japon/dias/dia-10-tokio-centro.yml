eyebrow: El plan · Día 10 · dom 15 nov
title: El agujero en medio de la ciudad, y *una tumba que nadie mueve*
dek: >-
  Primer día de los tres solos, y el único del viaje que se pasa entero en el centro exacto de Tokio.
  Que resulta ser un vacío: ciento quince hectáreas de bosque con foso a las que casi no se entra, y
  alrededor el distrito financiero más caro del país construido sobre lo que fue un castillo.
