eyebrow: En solitario · mié 4 nov
title: Libros viejos, el santuario de Akihabara y jazz *en la planta 52*
dek: >-
  Hoy el día sale de lo que te ha recomendado tu familia: Kanda y sus librerías de viejo, Kagurazaka
  de noche y, para acabar, el jazz del Park Hyatt. Por medio, el paseo con más fotos de la semana,
  de Ochanomizu al Kanda Myōjin con la última luz. La mudanza se deja para el final de la tarde.
