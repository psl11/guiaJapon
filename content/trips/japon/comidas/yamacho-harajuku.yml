body: >-
  Un *[udon](#udon)* servido hirviendo en cazuela de barro, con caldo a elegir entre soja y miso, por
  mil yenes. La casa es de 1979 y la matriz está en Odawara, así que esto no es una franquicia
  moderna sino una sede de una casa vieja de provincias metida en un sótano de Sendagaya.


  Está a cinco minutos de la estación de Kitasandō, o sea en el borde norte del Harajuku que recorre
  el día 9. La pega es la ventana: **abre solo a mediodía, de 11:30 a 15:00 con última comanda a las
  14:30, y cierra los domingos.** El día 9 es sábado, así que entra; el día 17, que es domingo, no.


  Es la tercera casa de fideos que Alba trae del mismo kilómetro cuadrado, con Menchirashi a
  cuatrocientos metros. Entre las dos, la diferencia no es la calidad sino la cola: esta la tiene, y
  la otra la tiene siempre.
