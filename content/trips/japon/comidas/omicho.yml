quePedir: >-
  Para quien coma pescado, un ***kaisendon*** —cuenco de arroz cubierto de sashimi— y una **ostra abierta al momento**. Para el resto, *korokke* y fruta de Ishikawa.
body: >-
  Doscientos puestos bajo techo desde el siglo XVIII, cuando el clan Maeda montó aquí el mercado de la ciudad. Kanazawa da al mar del Japón y en **noviembre se abre la veda del cangrejo de las nieves**, que es el gran acontecimiento gastronómico del año en esta costa: lo veréis por todas partes con su etiqueta amarilla.


  Un aviso de horario que sí importa: **los mostradores de *donburi* revientan de 11:30 a 13:30** y muchos cierran cuando se acaba el género. A las nueve de la mañana se ve el mercado trabajando; a la una se ve la cola.
