blocks:
  - block: Mañana
    time: "10:00–13:00"
    title: Cada cosa tiene su barrio
    body: >-
      La regla de Tokio es que **lo específico se compra en el sitio específico**, no en un centro
      comercial. Según lo que se busque:

      - **Cuchillos y cocina** → Kappabashi, que el [día 2](#dia-2-shitamachi) se cruzó de paso. Es la
        mejor compra posible del viaje si alguien cocina.
      - **Papelería y escritura** → el Itōya de Ginza.
      - **Electrónica, manga y figuras** → [Akihabara](#akihabara).
      - **Segunda mano de marca** → [**Shimokitazawa**](https://www.google.com/maps/search/?api=1&query=Shimokitazawa%20Tokyo) y [**Nakameguro**](https://www.google.com/maps/search/?api=1&query=Nakameguro%20Tokyo).
      - **Té, dulces y comida buena** → el ***depachika*** de cualquier gran almacén, en [Ginza](#ginza).
    window:
      label: El tax-free, que este año cambia
      body: >-
        Recordad el pasaporte: hay exención de IVA en compras de **más de ¥5.000 en un mismo día y
        una misma tienda**. Japón tiene aprobado pasar en noviembre de 2026 del descuento en tienda
        al reembolso en el aeropuerto. Comprobadlo al llegar — está en [la ficha de dinero](#dinero).
    ver:
      - nombre: Kappabashi
        maps: Kappabashi Kitchen Town Tokyo
        nota: Acero forjado, moldes, vajilla y comida de plástico. Hoy sí, con cartera.
        lat: 35.7142517
        lon: 139.7888894
      - nombre: Itōya
        maps: Ginza Itoya
        nota: Doce plantas dedicadas solo a papel, plumas y cuadernos.
        lat: 35.6729570
        lon: 139.7674251
      - reco: alba-drugstores
        nota: Los KitKat y dulces de regalo, a mitad de precio en una drugstore que en el konbini.
      - reco: alba-bolsa-3coins
        nota: Una bolsa grande y barata para lo que ya no cabe. Sin confirmar en catálogo.
    comer:
      - comida: cafe-de-lambre
        nota: Si la mañana acaba en Ginza. Café de grano envejecido en un *kissaten* de 1948.
  - block: Mediodía
    time: "13:00–15:00"
    title: Que sea domingo juega a favor
    body: >-
      Dos cosas pasan solo hoy. **Harajuku en domingo es el fenómeno**, no una calle comercial: en el
      Jingū-bashi se concentran los disfraces, y junto a la entrada de Yoyogi-kōen bailan las bandas
      de rockabilly con tupé que llevan cuarenta años en el mismo sitio.

      Y **el lago del parque de Ueno y las calles de Ginza se peatonalizan** los domingos por la
      tarde: la avenida principal, sin coches, con sillas en mitad de la calzada.
    ver:
      - ficha: harajuku
        nota: Por qué el domingo, y lo que no sale en las listas a cien metros de Takeshita.
      - nombre: Jingū-bashi
        maps: Jingubashi Harajuku Tokyo
        nota: El puente entre la estación y Meiji Jingū. Los disfraces se juntan aquí.
        lat: 35.6697179
        lon: 139.7024123
      - reco: alba-donki-escondido
        nota: A una parada, en Shibuya. La sede anexa del MEGA Don Quijote, sin la marea.
    comer:
      - comida: henrys-burger-harajuku
        nota: Hamburguesa de wagyu entre Harajuku y Omotesandō. Abre todos los días, de once a ocho.
      - comida: menchirashi-harajuku
        nota: El udon carbonara de la Cat Street, por unos seis euros.
      - comida: sushi-origami-yakatabune
        nota: El capricho. Sushi en un barco de la bahía, comida solo domingos. Cambia el mediodía entero.
  - block: Tarde
    time: "15:00–18:00"
    title: El momiji, que ahora sí
    body: >-
      Y aquí está el regalo de haber vuelto. **El pico de la hoja roja en Tokio va del 20 de noviembre
      al 5 de diciembre**, así que estos días caen justo dentro. Los dos jardines de la lista nacional
      están a media hora, y los dos hacen iluminación nocturna en temporada.
    ver:
      - ficha: momiji
        nota: El calendario de la hoja roja, y por qué la ciudad se guardó para el final.
      - nombre: Rikugi-en
        maps: Rikugien Garden Tokyo
        nota: Diseñado en 1702 para reproducir ochenta y ocho escenas de poemas clásicos.
        lat: 35.7333998
        lon: 139.7463046
      - nombre: Koishikawa Kōrakuen
        maps: Koishikawa Korakuen Garden Tokyo
        nota: El otro jardín de la lista nacional del momiji, también con iluminación nocturna.
        lat: 35.7053631
        lon: 139.7491508
    comer:
      - comida: unagi-hashimoto
        nota: Anguila de Edo desde 1835, a un cuarto de hora andando del Kōrakuen. Con reserva.
  - block: Noche
    time: "noche"
    title: La cena que no se improvisa
    body: >-
      Quedan cuatro noches y es buen momento para gastar una en algo reservado. O en copas: el New
      York Bar del Park Hyatt, que es el de *Lost in Translation*, con jazz en directo — ver
      [la sección de salir](#new-york-bar).
    comer:
      - comida: toufuya-ukai
        nota: "*Kaiseki* de tofu al pie de la Torre de Tokio, en una fábrica de sake trasladada. Reservad ya."
      - comida: bar-benfiddich
        nota: En Nishi-Shinjuku, a un paseo del Park Hyatt. Nueve asientos y plantas majadas en mortero.
      - comida: sg-club
        nota: En Shibuya, dos bares en uno. El mejor cuando no todos queréis lo mismo.
alt:
  label: Si te desmarcas
  body: >-
    Un domingo es el mejor día para **[Jinbōchō](#jimbocho)**… salvo que muchas de sus ciento treinta
    librerías de viejo cierran precisamente en domingo. Comprobadlo. La alternativa segura es
    Nakano Broadway, cuatro plantas de manga, figuras y relojes de segunda mano al oeste de
    [Shinjuku](#shinjuku), que es lo que era Akihabara antes de volverse turístico.
