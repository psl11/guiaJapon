body: >-
  Si el [New York Bar](#new-york-bar) es el jazz como escenografía, esto es el jazz como oficio. El **Pit Inn** lleva
  desde los años sesenta en un sótano de [Shinjuku](#shinjuku) y por su escenario ha salido buena parte de lo que
  ha dado el jazz japonés — es, literalmente, el sitio donde muchos empezaron. No hay vistas, no hay
  cóctel de autor y no hay dónde mirar que no sea el escenario. Es de las pocas salas de Tokio donde
  la gente **escucha en silencio**.


  Contexto que le da sabor: en la posguerra Shinjuku era el barrio de escritores, estudiantes y
  radicales, y su vida pasaba justamente en los bares de jazz y las cafeterías. De aquel mundo sale
  también **Murakami**, que antes de escribir **regentó un bar de jazz** en Kokubunji, al oeste de la
  ciudad — el mismo oficio que le da a más de uno de sus personajes.


  El **pase de tarde es la ganga**: cuesta la mitad, suele ser de músicos jóvenes y se sale a tiempo
  de cenar. Programación en su web, que se actualiza cada mes.
