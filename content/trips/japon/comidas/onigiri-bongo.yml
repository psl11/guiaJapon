body: >-
  Una barra de *onigiri* abierta en 1960 en Ōtsuka, en la que las bolas se hacen delante y de una en
  una, con arroz Koshihikari y más de cincuenta rellenos a elegir. Salen mucho más grandes de lo que
  cabe esperar: casi todo el mundo pide tres y casi nadie los termina.


  Y ahora lo que hay que decir antes de que nadie coja el Yamanote hasta allí: **la cola va de dos a
  cinco horas**. No es la cola de un sitio de moda, es la que tiene todos los días. Abre de 11:30 a
  medianoche y cierra los domingos, así que de los días de Tokio de este viaje se cae el 17, que es
  domingo, y el 20 pasa entero por Ginza y Tsukiji, en la otra punta de la línea.


  La conclusión honesta es que **no le encuentro hueco**, y va en la guía por eso mismo, no a pesar
  de eso: para que quien lo vea circular por vídeo sepa lo que cuesta de verdad. Si alguien quiere
  onigiri de barra hecho al momento, [Yadoroku](#onigiri-yadoroku) está en Asakusa, es de 1954 y es
  la casa más antigua del gremio en Tokio.
