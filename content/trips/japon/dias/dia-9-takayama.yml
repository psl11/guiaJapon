slug: dia-9-takayama
navLabel: "Día 9 · Takayama"
trip: japon
order: 9
eyebrow: El plan · Día 9 · sáb 14 nov
title: Takayama, el pueblo que pagó *en carpinteros*
dek: >-
  Primer día sin hacer maletas desde Tokio. Un pueblo de montaña con tres calles de casas de madera
  negra intactas, dos mercados que abren al amanecer y la mejor historia fiscal de Japón. Y por la
  noche, el sitio vacío.
blocks:
  - block: Amanecer
    time: "06:30–08:30"
    title: Los mercados de la mañana
    body: >-
      Takayama tiene **dos mercados matinales** y llevan celebrándose desde el periodo Edo: el de
      Miyagawa, en la orilla del río, y el de Jinya-mae, frente a la antigua oficina de
      gobierno. Abren sobre las 6:00 o las 7:00 y recogen a mediodía. No son mercados para
      turistas: se venden encurtidos, verdura de montaña, manzanas de Hida, flores y *mitarashi
      dango* —bolitas de arroz a la brasa con salsa de soja— que se comen andando. Ver
      [Takayama](#takayama).
    window:
      label: Ventana óptima
      body: >-
        Es la única hora en que este pueblo es de los suyos. A las diez llegan los autobuses de día
        desde Nagoya y [Kanazawa](#kanazawa), y hasta las cuatro de la tarde Sanmachi es una fila india. **El
        contraste entre las siete y las once de la mañana no lo tiene ningún otro sitio del viaje.**
  - block: Mañana
    time: "08:30–12:00"
    title: Sanmachi y las bolas de cedro
    body: >-
      Tres calles de casas de comerciantes intactas, con canales de agua a los lados: se andan en una
      hora larga. El juego es **mirar hacia arriba**, porque sobre varias puertas cuelga una bola de
      ramas de cedro y su color dice si la sake de esa casa ya está lista — el porqué, en
      [la ficha de Takayama](#takayama).

      Hay **seis destilerías en tres calles** y casi todas dejan catar. Id de menos a más, que son
      pequeñas y se acumula.
    window:
      label: Cómo se cata sin acabar el día torcido
      body: >-
        Las destilerías abren de **10:00 a 16:00** y muchas cierran el catado a media tarde. Casi
        todas cobran unos ¥300 por una tanda de tres o cuatro vasitos, y algunas regalan el vaso
        de cerámica. Empezad por las secas y subid hacia las dulces, no al revés — y con tres
        casas hay de sobra: son seis en tres calles y el sake de Hida ronda los 16 grados.
  - block: Mediodía
    time: "12:00–14:00"
    title: Buey de Hida, en la calle
    body: >-
      El **wagyū de esta prefectura** es de los mejores del país y aquí no hace falta un restaurante
      caro para probarlo: en las calles del casco viejo lo venden a la brasa en brocheta, en
      croqueta o dentro de un panecillo al vapor, por unos pocos euros. Se come de pie. Y para
      acompañar, la sake de las destilerías de al lado, que sale del agua de deshielo de estas
      montañas.
  - block: Tarde
    time: "14:00–17:00"
    title: Las carrozas, y la ladera de los templos
    body: >-
      Dos paradas y una caminata. El **Yatai Kaikan** guarda varias de las carrozas del festival, que
      cae en abril y octubre y no vais a ver de otra manera: doce metros de laca y oro con
      autómatas de cuerda del siglo XVIII que todavía funcionan.

      Y a cinco minutos, el [**Takayama Jinya**](https://www.google.com/maps/search/?api=1&query=Takayama%20Jinya),
      que es la visita que casi nadie hace y la que mejor se recuerda. **Entrad**: lo que hay dentro y
      por qué este edificio no existe en ningún otro sitio de Japón está en
      [la ficha de Takayama](#takayama).

      Para cerrar la tarde, el **Higashiyama Walking Course**: hora y media señalizada por la ladera
      este entre una docena de templos y las ruinas del castillo, prácticamente en solitario.
  - block: Noche
    time: "noche"
    title: Cuando se van los autobuses
    body: >-
      A partir de las cinco de la tarde el pueblo se vacía de golpe y **es cuando mejor está**: las
      farolas encendidas sobre los canales, las casas cerradas y nadie por la calle. Es la razón de
      dormir aquí en vez de pasar de largo. Cenad *[soba](#soba)* de trigo sarraceno de la zona, o *hōba
      miso* —miso a la brasa sobre una hoja de magnolio, que es el plato de esta montaña.
alt:
  label: Si te desmarcas
  body: >-
    [**Hida no Sato**](https://www.google.com/maps/search/?api=1&query=Hida%20no%20Sato%20Takayama), el pueblo-museo al aire libre a las afueras: treinta granjas de tejado de paja
    traídas de toda la región y remontadas, incluidas varias *gasshō-zukuri* como las de
    [Shirakawa-gō](#shirakawa-go). Si el tiempo estropea el plan de mañana, esto lo salva. Y para andar de verdad, el
    **sendero del castillo de Matsukura** sube al mirador desde el que se ve el valle entero.
