body: >-
  El edificio ya es la historia: una **escuela primaria de los años treinta** al pie de [Kiyomizu-dera](https://www.google.com/maps/search/?api=1&query=Kiyomizu-dera%20Kyoto),
  cerrada por falta de niños —el barrio se vació— y reconvertida en hotel conservando la escalera, los
  pasillos y el gimnasio. La azotea mira por encima de los tejados de Higashiyama hacia la **pagoda de
  Yasaka** y la ciudad entera.


  Es el mejor sitio de [Kioto](#kioto) para ver ponerse el sol, y por eso **hay que reservar con días**. Las
  mesas del borde se agotan primero. Si no hay hueco, el **Bar KOHAKU**, a cinco minutos, es más
  pequeño, sin vistas y con mejor coctelería.
