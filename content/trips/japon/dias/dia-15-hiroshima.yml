traslados:
  - desde: "Kioto"
    hasta: "Hiroshima"
    medio: "Sanyō Shinkansen *Nozomi*"
    duracion: "1 h 40"
    hora: "salir 07:30"
    nota: "**¥11.600.** Saliendo a esa hora cabe parar en **Himeji** y seguir: el castillo se ve desde el andén."
blocks:
  - block: Mañana
    time: "08:00–10:30"
    title: El Shinkansen al oeste
    body: >-
      Hora y cuarenta desde Kioto por el Sanyō Shinkansen, el tramo bueno para leerse la ficha de
      Hiroshima: el parque se anda mucho mejor sabiendo lo que se mira.

      **Y cabe una parada por el camino.** El Shinkansen para en Himeji, a una hora de Kioto, y el
      castillo está a quince minutos andando en línea recta desde la estación. Saliendo a las 07:30
      se está en él a las 09:00, se ve en dos horas largas y se llega a Hiroshima hacia la una, con la
      tarde entera para el parque. Cuesta madrugar una hora y una consigna.
    window:
      label: El tercer envío de maletas
      body: >-
        **Hoy salen las maletas grandes hacia Tokio.** Quedan dos noches fuera, y cargar con ellas
        hasta Miyajima y luego cuatro horas de tren no tiene sentido. Ver [takkyūbin](#takkyubin).
    ver:
      - nombre: Castillo de Himeji
        maps: Himeji Castle
        nota: "El mejor conservado de Japón y el opuesto de Matsumoto: blanco, de prestigio y sobre una colina."
        lat: 34.8393313
        lon: 134.6940200
      - ficha: matsumoto-jo
        nota: Los dos supervivientes de verdad, para compararlos con el de hace dos semanas.
  - block: Mediodía
    time: "11:00–13:00"
    title: La cúpula, y el eje
    body: >-
      Se entra por la cúpula y se baja hacia el sur, que es como está pensado el recorrido. Aquí hay
      que hacer **una sola cosa y hacerla bien**: colocarse delante del cenotafio en el punto exacto
      desde el que el arco enmarca la llama y, al fondo, la ruina.
    window:
      label: El detalle que se pasa por alto
      body: >-
        Buscad el epitafio del cenotafio y fijaos en que **no tiene sujeto**: es lo que más se
        discute del parque y se entiende mejor teniéndolo delante.
    ver:
      - ficha: hiroshima
        nota: Quién levantó la cúpula, por qué sigue en pie y por qué se decidió no arreglarla.
      - nombre: Cúpula de la Bomba Atómica
        maps: Atomic Bomb Dome Hiroshima
        nota: La bomba estalló casi encima y los muros aguantaron. Solo se refuerza, no se restaura.
        lat: 34.3954661
        lon: 132.4535245
      - nombre: Cenotafio de las víctimas
        maps: Cenotaph for the A-bomb Victims Hiroshima
        nota: "El eje de Kenzō Tange: arco, llama y ruina alineados desde un solo punto."
        lat: 34.3929718
        lon: 132.4525711
  - block: Tarde
    time: "13:00–16:00"
    title: El museo
    body: >-
      El Museo Memorial de la Paz son objetos y testimonios en primera persona, casi sin texto. Es
      duro, está hecho sin sensacionalismo y se sale en silencio. Dos avisos: **hora y media larga
      como mínimo**, y no encadenarlo con nada; por eso el bloque siguiente es un paseo.
    ver:
      - nombre: Museo Memorial de la Paz
        maps: Hiroshima Peace Memorial Museum
        nota: Renovado entero en 2019. Un triciclo, un uniforme, una sombra en un escalón.
        lat: 34.3918121
        lon: 132.4521048
      - nombre: Monumento a los Niños
        maps: Children's Peace Monument Hiroshima
        nota: Por Sadako Sasaki y sus mil grullas. Llegan millones cada año, en vitrinas alrededor.
        lat: 34.3941363
        lon: 132.4527566
  - block: Atardecer
    time: "16:00–18:00"
    title: La ciudad que está viva
    body: >-
      **Hiroshima es una ciudad de un millón doscientos mil habitantes**, no un cementerio. Dos
      maneras de comprobarlo antes de cenar, y las dos cuestan cero:

      - Buscad las **placas de los árboles supervivientes**, los *hibakujumoku*: hay varias en el
        propio parque y cambian la manera de mirar el sitio.
      - Y **volved en tranvía** aunque no haga falta: algunos de los vagones que circulan hoy estaban
        aquí en 1945.
    ver:
      - nombre: Shukkei-en
        maps: Shukkeien Garden Hiroshima
        nota: Jardín de 1620 arrasado y replantado, con un ginkgo superviviente. El contrapeso al parque.
        lat: 34.4003377
        lon: 132.4674494
  - block: Noche
    time: "noche"
    title: Okonomimura
    body: >-
      A cenar al edificio de las planchas: se elige puesto, se sienta uno a la barra y el cocinero lo
      monta delante. Pedid el de aquí, que **no tiene nada que ver con el de Osaka** —ver
      [el okonomiyaki](#okonomiyaki)— y, si hay, ostras: noviembre es el arranque de su temporada.
    comer:
      - comida: okonomimura
        nota: Veinticinco planchas en cuatro plantas. Sentaos donde haya clientela local.
      - comida: hassho
        nota: La alternativa si se quiere una sola casa y no la lotería del puesto. Pedidlo crujiente.
      - comida: step1-hiroshima
        nota: Para seguir después. Abre de 20:00 a 5:00 todos los días, en Nagarekawa.
alt:
  label: Si te desmarcas
  body: >-
    **Shukkei-en** sin prisa, en vez del tranvía: casi nadie y un ginkgo superviviente dentro. Y el
    **Museo de Arte Contemporáneo**, en la colina de Hijiyama, con una colección construida a propósito
    alrededor de la idea de la reconstrucción.
