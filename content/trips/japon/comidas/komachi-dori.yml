quePedir: >-
  Un ***senbei*** de arroz recién asado a la brasa, del tamaño de un plato, y **boniato asado** si hace frío — en noviembre lo hará.
body: >-
  Cuatrocientos metros de tiendas y puestos entre la estación y el gran santuario, y la manera clásica de hacer Kamakura: se come de pie mientras se sube. En noviembre huele todo el rato a **boniato asado en piedras**, que es uno de los olores del otoño japonés.


  La especialidad local es el ***shirasu***, angula diminuta cruda o hervida sobre arroz, que llega del mar de enfrente y solo se come fresquísima: **fuera de la costa no existe**, y en Kamakura la sirven a doscientos metros de donde se pesca.
