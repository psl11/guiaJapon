epithet: >-
  El cuadrante noroeste no sale en ninguna lista de imprescindibles, y precisamente por eso es donde
  mejor se ve la ciudad funcionando sin público. Tiene los mejores jardines de Edo que quedan, una
  escuela de Frank Lloyd Wright, una catedral de acero y el último tranvía.
sections:
  - heading: Una estación con dos lados y los nombres cambiados
    body: |
      Hasta principios del siglo XX esto era **marisma**. Lo hizo el tren: hoy pasan por aquí ocho
      líneas y **dos millones y medio de viajeros al día**, lo que pone a Ikebukuro en el podio
      mundial junto a [Shinjuku](#shinjuku) y [Shibuya](#shibuya). Su estación tiene fama de laberinto y de estar diseñada
      para que la gente choque en ángulo recto.

      El barrio vive partido por las vías, y ahí está la broma que resume el sitio: los dos grandes
      almacenes que se miran de acera a acera son **Tōbu** y **Seibu** — que significan,
      respectivamente, **«este» y «oeste»**. El Tōbu está al **oeste** de las vías y el Seibu al
      **este**. Nadie lo ha arreglado en un siglo.

      El este es la zona comercial y de manga; entre las chicas fans del *anime* y del *visual kei*
      esto es lo que [Akihabara](#akihabara) para el otro público, con sus propias tiendas y sus **butler cafés**,
      la versión con mayordomos de los *maid cafés*. El oeste, más tranquilo, tiene la parte que
      merece el viaje.
  - heading: Los jardines, que son los mejores que quedan
    body: |
      Aquí está la razón real para venir. Tres jardines de la época de Edo, todos a pocas paradas:

      - [**Rikugi-en**](https://www.google.com/maps/search/?api=1&query=Rikugien%20Garden%20Tokyo), en Komagome: probablemente **el jardín de paseo más bonito de Tokio**. Lo trazó
        en 1702 un consejero del shōgun para **reproducir ochenta y ocho escenas de poemas clásicos**
        — cada recodo del camino está donde está por un verso. En temporada de otoño hace
        **iluminación nocturna**, y es de las pocas de Tokio que merecen la pena.
      - [**Kyū Furukawa**](https://www.google.com/maps/search/?api=1&query=Kyu-Furukawa%20Gardens%20Tokyo), al lado: una mansión occidental de 1917 con **rosaleda inglesa delante y
        jardín japonés detrás**, en la misma parcela y sin mezclarse. La casa la firmó Josiah Conder,
        el arquitecto británico que formó a la primera generación de arquitectos japoneses.
      - [**Koishikawa Kōrakuen**](https://www.google.com/maps/search/?api=1&query=Koishikawa%20Korakuen%20Garden%20Tokyo), junto al Tokyo Dome: de 1629, con un puente rojo de piedra copiado de
        un paisaje chino, y con la mala suerte de tener una montaña rusa asomando por encima de la
        tapia. Es más raro y más bonito de lo que suena.
  - heading: Lo que no sale en las listas
    body: |
      - **El tranvía Toden Arakawa**, que los vecinos llaman ***chin-chin densha*** por su campanilla.
        Es **la última línea de tranvía de Tokio**: un solo vagón que cruza los barrios del norte por
        detrás de las casas, entre tendederos, rosaledas y pasos a nivel, durante una hora de punta a
        punta y por poco más de dos euros. Es la mejor manera que existe de ver Tokio sin que la
        ciudad se dé cuenta.
      - [**Jiyū Gakuen Myōnichikan**](https://www.google.com/maps/search/?api=1&query=Jiyu%20Gakuen%20Myonichikan%20Tokyo), «la casa del mañana» — una escuela de **Frank Lloyd Wright**
        (1921), levantada mientras construía el Hotel Imperial, con sus ventanas geométricas, los
        techos bajos y el mobiliario hexagonal original. Se visita, y **sirven té en el salón central**.
      - **Catedral de Santa María**, en Bunkyō — **Kenzō Tange**, 1964: ocho paredes de hormigón que
        suben curvándose hasta cerrar en una **cruz de luz** en el techo, todo forrado por fuera de
        **acero inoxidable**. Es hermana del gimnasio de Yoyogi y del parque de [Hiroshima](#hiroshima), del mismo
        año, y no la conoce nadie. Entrada libre.
      - **Universidad Rikkyō** — fundada como St Paul's School por un misionero episcopaliano en 1874,
        con un patio de hiedra que parece de Nueva Inglaterra. En el terremoto de 1923 se le cayó
        **una de las dos torres de la puerta** y decidieron no reconstruirla: la puerta sigue
        asimétrica, en memoria de los muertos.
      - [**Bunkyō Civic Center**](https://www.google.com/maps/search/?api=1&query=Bunkyo%20Civic%20Center%20Tokyo) — la planta 25 de un edificio administrativo, **gratis**, con
        probablemente **la mejor vista despejada del Fuji al atardecer** de todo Tokio. No lo pisa ni
        un turista.
      - [**Kagurazaka**](https://www.google.com/maps/search/?api=1&query=Kagurazaka%20Tokyo) — callejones empedrados en cuesta entre Iidabashi y Shinjuku, con herencia
        francesa —hay liceo, panaderías y bistrós— y **geishas todavía en activo** en unas pocas casas
        de té. Es el barrio más europeo de Tokio y el menos obvio.
curiosidades:
  - >-
    Los dos grandes almacenes de Ikebukuro se llaman **Tōbu («este») y Seibu («oeste»)** — y el Tōbu
    está al oeste de las vías, el Seibu al este. Lleva así un siglo.
  - >-
    El [**Rikugi-en**](https://www.google.com/maps/search/?api=1&query=Rikugien%20Garden%20Tokyo) se diseñó en 1702 para reproducir **ochenta y ocho escenas de poemas clásicos
    japoneses**. Hay que saberlo para entender por qué cada recodo del camino está donde está.
  - >-
    Tokio conserva **una sola línea de tranvía**, el Toden Arakawa, al que los vecinos llaman
    *chin-chin densha*, «el tren tilín-tilín». Cruza el norte de la ciudad por detrás de las casas
    durante una hora entera.
