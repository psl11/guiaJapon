body: >-
  **Bib Gourmand desde la guía de Tokio de 2026.** Lo lleva un cocinero al que todo el mundo llama
  Haru-chan, y su ramen es el contrario del *tonkotsu* espeso: un caldo transparente de cerdo y
  sardina seca, con cebolleta, nori y unas flores de *fu* (gluten de trigo) flotando en la grasa.


  Los fideos se aplastan para que queden gruesos y blandos, y el lomo se asa y luego se termina dentro
  de la sopa, que es lo que lo deja tan tierno. **Abre todos los días de 11:00 a 21:00**, que es raro
  en Ginza, y por eso sirve igual para el mediodía del día 20 que para una noche de llegada tarde.
