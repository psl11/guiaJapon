body: >-
  El mercado de antigüedades al aire libre más grande de Japón: unos doscientos cincuenta
  anticuarios montados en la explanada del Tokyo International Forum, a un minuto de la estación de
  Yūrakuchō. Cerámica, vajilla vieja, kimonos, grabados, herramienta, chatarrería fina. **No es un
  mercadillo de souvenirs**, es donde compran los propios anticuarios de Tokio.


  Lo que lo hace difícil es que **solo abre dos días al mes**, y el reel del que sale esto se
  equivoca al explicar cuáles: dice «primer sábado y tercer domingo», pero el calendario oficial de
  2026 no sigue esa regla. En noviembre son el **7 y el 23**. El 23 es el día del Fuji, con recogida
  contratada en Shin-Fuji a las 8:30, así que queda uno: el sábado 7, que es el día 2.


  Y ahí está la pega, dicha sin adornos: **el día 2 ya está lleno y va en la otra punta**. Su
  geografía es Asakusa, Ueno y Yanaka, todo al noreste, mientras que Yūrakuchō está al sur, junto a
  Ginza. Meterlo obliga a quitar algo — el candidato natural es el Museo Nacional, que ocupa dos
  horas del mediodía. A cambio, desde el hotel de Akihabara son dos paradas de Yamanote, y el jet lag
  juega a favor: a las nueve de la mañana ya lleváis cuatro horas despiertos.
