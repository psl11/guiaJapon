body: >-
  Abrió en 1964 y sigue haciendo lo mismo: *dandanmen*, el fideo picante de Sichuan pasado por
  Tokio, con la sopa de sésamo y guindilla y el picante a elegir. El plato de la casa lleva una
  chuleta de cerdo frita encima. Es una barra de veinticuatro asientos donde se come en un cuarto
  de hora, y con el cuenco el arroz no se cobra.


  Está aquí como **plan B de [Ginza Hachigō](#ginza-hachigo)**, a cinco minutos andando. Hachigō se
  reserva y tiene seis asientos. Hashigo no se reserva, abre todos los días y entre semana sirve hasta las
  cinco de la madrugada. Si no queda hueco en TableCheck, la comida del día 20 se resuelve aquí sin
  cola. **Llevad efectivo**: no acepta tarjeta ni pago con el móvil.
