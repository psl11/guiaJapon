title: El *JR Pass*
verdict: prescindible
verdictLabel: Prescindible — en las dos mitades
lede: >-
  El pase que todas las guías dan por hecho, y que en este viaje **no sale a cuenta para nadie**: ni
  para los tres que hacen los veintiún días ni para el cuarto, que se va el 14. Las dos cuentas están
  abajo, tramo por tramo, y ninguna de las dos está reñida.
ledger:
  - label: Cuesta
    body: |
      Tres duraciones, y las tres **subieron el 1 de octubre de 2026** por canal extranjero:

      - **7 días** — de ¥50.000 a **¥53.000**
      - **14 días** — de ¥80.000 a **¥84.000**
      - **21 días** — de ¥100.000 a **¥105.000**

      La tienda online oficial de JR mantiene el precio anterior una temporada, así que al comprar
      conviene mirar los dos canales. Da igual: la cuenta sale que no incluso al precio viejo, que es
      la forma honesta de hacerla.
  - label: Qué compra, y qué no
    body: >-
      Trenes JR de larga distancia. Y aquí está el problema de este itinerario en concreto: **la mitad
      de sus tramos largos no son JR**. El tren y el autobús de Alpico a [Kamikōchi](#kamikochi), el
      autobús de Hirayu a [Takayama](#takayama), el de [Shirakawa-gō](#shirakawa-go) y el de
      [Kanazawa](#kanazawa) van todos por su cuenta, igual que el Spacia de Tōbu a [Nikkō](#nikko) y
      el Skyliner de Keisei a Narita. Y **el metro de Tokio tampoco es JR**, ni Tokyo Metro ni Toei,
      así que los trayectos de cada día quedan fuera en cualquier caso.


      El **Nozomi** merece línea aparte porque medio internet lo cuenta mal. Desde 2023 sí se puede
      coger con pase, pero **pagando un suplemento de unos ¥4.960 por sección**. O se paga eso encima
      del pase, o se va en Hikari y Sakura: media hora más en cada trayecto largo y un transbordo en
      Shin-Ōsaka en el [Hiroshima](#hiroshima)–Tokio del día 16, que pasa de cuatro horas a cinco.
  - label: La cuenta de los tres · 21 días
    body: |
      Sumando en billete suelto **todo** lo que sí es JR en los veintiún días —del monorraíl de Haneda
      al Kodama del [Fuji](#fuji), pasando por el Azusa a Matsumoto, el Kagayaki de Kanazawa, Kamakura,
      el Nozomi a [Kioto](#kioto), [Osaka](#osaka), Hiroshima, [Miyajima](#miyajima) y la vuelta—:
      **¥83.890**.

      Parece que ahora sí gana el pase, y no gana ninguno, porque ese gasto **está repartido a lo
      largo de tres semanas** y un pase solo cubre días consecutivos. Lo que cubriría cada uno en su
      mejor ventana posible:

      - **7 días**, del 16 al 22 (el bucle del oeste entero) — ¥47.980. Pierde por 2.020, o por 5.020
        al precio de hoy.
      - **14 días**, del 10 al 23 — ¥75.520. Pierde por 4.480, o por 8.480.
      - **21 días**, el viaje completo — ¥83.890. Pierde por 16.110, o por 21.110.

      Y la razón de fondo, que no se arregla moviendo la ventana: los dos billetes gordos son
      Kanazawa–Tokio el 12 y Hiroshima–Tokio el 21, y **están a nueve días uno del otro**. No hay pase
      de siete que los coja juntos.
  - label: La cuenta del cuarto · 13 días
    body: >-
      Aquí ni se acerca, porque **su viaje entero suma menos que medio pase**. Contando los cinco días
      en solitario del 2 al 6 —que también cuentan, y suelen olvidarse—, su gasto elegible en trece
      días es de **¥25.470**, y su mejor ventana de siete, del 8 al 14, cubriría **¥23.250**. Contra
      ¥50.000 pierde por veintiséis mil setecientos; contra los ¥53.000 de hoy, por casi treinta mil.


      No es apretado ni discutible, y tiene una explicación de una línea: sus tres días más caros de
      transporte son los autobuses de los Alpes, que el pase no toca, y sale del país por Narita en un
      Keisei que tampoco.
  - label: El único escenario donde casi gana
    body: >-
      Existe, y conviene conocerlo para descartarlo con conocimiento en vez de por fe. Un pase de 7
      días del 18 al 24 pierde por 5.290 tal y como está escrito el viaje. Pero si a los tres se les
      reescriben dos días **para alimentar el pase** —Nikkō por JR vía Utsunomiya en lugar del Spacia
      directo, y parada de verdad en Himeji el día 15, que con pase es gratis y suelta cuesta unos
      ¥3.400 más—, esa misma ventana pasa a valer unos ¥52.200 en billetes.


      Y ahí es donde se ve lo que hay: **gana por 2.200 al precio viejo y vuelve a perder por 800 al de
      hoy**. Se pagan cincuenta mil yenes para ahorrar dos mil, yendo en trenes peores y habiendo
      cambiado dos días del viaje para que la cuenta salga. Un empate no es motivo para atarse a un
      pase.
  - label: Veredicto
    body: >-
      **No lo compréis, ninguno de los dos grupos.** Billetes sueltos y una **tarjeta IC**: se compran
      en máquina en dos minutos, permiten reservar asiento —conviene en el Azusa por las vistas y en el
      tramo del Fuji— y dejan coger el Nozomi sin suplementos ni cálculos.


      De los pases regionales, dos merecen una línea antes de cerrar el asunto. El **Hokuriku Arch
      Pass** ya no: **subió de ¥30.000 a ¥35.000 el 14 de marzo de 2026** y con esa subida dejó de
      empatar. El que sí se acerca es el **Kansai-Hiroshima Area Pass** (¥17.000, cinco días), que cae
      justo sobre los días 12 a 16 e incluye el Nozomi entre Shin-Ōsaka y Hiroshima y el ferry de la
      isla: cubriría unos ¥14.600, o unos ¥18.000 si de verdad paráis en Himeji. **La vuelta a Tokio
      del día 16 se paga aparte**, que es lo que le impide ganar de calle. Es el único que llega a
      empatar, y solo para los tres.


      Y el pase que de verdad haría falta aquí no es de tren: el **Alps Crossing Ticket** de
      [Alpico](https://www.alpico.co.jp/en/alps-crossing/) encadena Matsumoto, Kamikōchi, Hirayu y
      Takayama en un billete, que es exactamente el tramo que ningún pase de JR toca. **Falta
      confirmar su precio de noviembre** antes de recomendarlo.
curiosidades:
  - >-
    El pase de 7 días **pasó de ¥29.650 a ¥50.000 en octubre de 2023** — casi el doble de golpe. Buena
    parte de los consejos que circulan por internet son anteriores a esa subida y ya no valen.
  - >-
    El suplemento del Nozomi va **por secciones y no por kilómetros**: son unos ¥4.960 de Tokio a
    Kioto, casi **un diez por ciento del pase de siete días** por un solo trayecto de dos horas y
    cuarto.
