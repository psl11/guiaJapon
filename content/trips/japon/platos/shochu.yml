queEs: >-
  El **destilado** japonés, que no hay que confundir con el sake: se hace de boniato, cebada, arroz o azúcar moreno, ronda los **25 grados** y se bebe rebajado. Frío con agua (*mizuwari*), con agua caliente (*oyuwari*) o con soda. En invierno, el *oyuwari* de boniato es una de las cosas más reconfortantes que existen.
historia: >-
  Es **más antiguo que el sake destilado** y viene del sur: llegó desde Ryūkyū —Okinawa— en el siglo XVI y arraigó en Kyūshū, donde el clima no permitía hacer buen sake. Durante siglos fue la bebida barata de los campesinos del sur y del proletariado urbano, con una reputación tan mala que hasta los años noventa no se le tomó en serio. Hoy hay *shōchū* de una sola destilación que se venden como un single malt.
dondeMejor: "Kyūshū · pero está en todas las izakayas del país"
picante: "—"
veg: "**Sí**"
body: >-
  Es la bebida que los japoneses beben cuando cenan y los extranjeros no piden porque no la conocen. En una izakaya, pedir *imo-jōchū* (de boniato) *oyuwari* es una manera rápida de que el camarero os mire distinto.


  También es la base del ***chūhai***, el combinado de lata que llena las neveras de los konbini: *shōchū*, soda y sabor de fruta, entre el 3 y el 9 por ciento. El de limón es el estándar y cuesta lo mismo que un refresco.
