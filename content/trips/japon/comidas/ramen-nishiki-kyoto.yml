body: >-
  Casi todo el ramen de Japón se sostiene sobre hueso de cerdo o soja. Este va de **besugo**: un
  caldo de *tai* delicado y limpio, en Higashiyama, que es justo donde el día 13 pasa la tarde
  camino de Gion. Abre de once a tres y de seis a nueve, y cierra los lunes; el día 13 es miércoles.


  Quien lo recomienda insiste en un detalle práctico que en Kioto vale oro: **entró a las doce en
  punto sin cola**, mientras media ciudad hace dos horas de espera en los sitios que circulan por
  vídeo.


  La casa tiene una segunda sede, *Nishiki Sui*, en Kiyomotochō, que abrió en febrero de 2026 como
  **el primer restaurante de Japón dedicado por completo al ramen de matcha**: cuatro caldos, todos
  con té verde, incluido uno que mezcla matcha con el mismo besugo y otro con yuzu. Es una rareza
  reciente y está a diez minutos de la primera.
