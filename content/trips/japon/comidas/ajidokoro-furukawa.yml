body: >-
  Mientras Taki busca Itomori en la biblioteca, sus dos amigos se sientan en el banco de la puerta
  de una tienda de comidas a comerse una brocheta de *gohei mochi*. La tienda es esta, pasada la
  plaza del Okoshi Daiko, a la derecha, y el banco sigue bajo el alero. La gente se sienta a hacer la
  misma foto.


  El *gohei mochi* es arroz machacado y aplastado sobre una paleta de madera, a la brasa y untado de
  una salsa dulce de miso. Se parece al *mitarashi dango*, pero en una sola pieza plana. Dentro sirven
  comidas de la zona: buey de Hida sobre hoja de magnolia, curri de buey y *ramen* de Furukawa.


  Los listados no se ponen de acuerdo en el horario, y el cierre es irregular. Japonismo recoge
  además la teoría de que la brocheta del dibujo es la de otra casa del pueblo, Okadaya, que no hemos
  podido localizar.
