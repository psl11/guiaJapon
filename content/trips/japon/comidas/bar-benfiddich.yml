quePedir: >-
  Decir qué os apetece y dejarle hacer. Si queréis su firma: el ***Benfiddich***, con ajenjo que él mismo cultiva.
body: >-
  Hiroyasu Kayama **cultiva sus propias plantas** en la granja familiar de Saitama, las macera, las destila y las muele con mortero delante de vosotros. No hay carta: se le dice qué apetece y él construye. Es de los pocos bares del mundo donde ves majar una raíz antes de que acabe en la copa.


  Está en un **noveno piso sin rótulo** de Nishi-Shinjuku, lo cual forma parte del asunto. Y queda a un paseo del hotel de la última semana — es exactamente el tipo de noche que no tiene sentido intentar con jet lag y sí lo tiene el día 20.
