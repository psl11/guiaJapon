body: >-
  Shabu-shabu y sukiyaki de wagyu negro a discreción, con sushi *edomae* incluido si se paga la
  mejora, y un caldo dorado de bonito rallado al momento que es lo que la casa pone por delante.
  Ronda los 6.800 yenes más mil por el sushi libre; la bebida va aparte desde 450.


  Está junto al santuario de Ohatsu Tenjin, a un paso de Higashi-Umeda. Eso lo deja **fuera del
  recorrido del día 14**, que va todo por el sur —castillo, Kuromon, Shinsekai, Dōtonbori—, pero con
  un matiz que lo salva: si se va en el tren normal desde Kioto en vez de en Shinkansen, se llega
  precisamente a Osaka-Umeda. Es lo primero que hay al bajar.


  Tiene personal que habla varios idiomas y salas amplias, que con cuatro personas y un menú a
  discreción no es un detalle menor.
