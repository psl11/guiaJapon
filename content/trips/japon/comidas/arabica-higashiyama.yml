body: >-
  El café que puso a [Kioto](#kioto) en el mapa del café de especialidad, y probablemente el mejor *latte* de
  Japón. El local es minúsculo, blanco y con un ventanal que enmarca **la pagoda de Yasaka** — de ahí
  la cola, que a media mañana da la vuelta a la esquina y aun así avanza en diez minutos porque la
  barra va como un reloj.


  Tuestan grano propio y tienen finca en Hawái, lo que explica que sea uno de los pocos sitios donde
  el café en Japón compite con el de cualquier capital europea. Si la cola de Higashiyama espanta,
  la sucursal de **Fujii Daimaru**, en el centro, sirve exactamente lo mismo sin espera y sin vistas.
