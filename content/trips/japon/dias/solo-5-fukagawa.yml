blocks:
  - block: Mañana
    time: "09:00–12:00"
    title: Fukagawa, de donde salió Bashō
    body: >-
      Al otro lado del Sumida está **Fukagawa**, el sitio con más literatura por metro cuadrado de
      Tokio: aquí vivió **Matsuo Bashō** en su cabaña junto al río, y **de aquí salió en 1689** a andar
      los dos mil cuatrocientos kilómetros del *Oku no Hosomichi*. Se ven el museo pequeño y la
      estatua junto al río, y al lado, el jardín Kiyosumi Teien.
    window:
      label: Por qué hoy
      body: >-
        Porque es lo contrario de todo lo que viene después: una semana de cambiar de cama casi cada
        noche, trenes con hora y un grupo que coordinar, frente a un barrio de canales donde no hay nada que coger. Y
        porque **cierra el hilo literario** que la guía lleva abierto desde
        [los libros](#japon-cine-libros): mañana empieza el viaje que Bashō haría al revés.
    ver:
      - ficha: ryogoku
        nota: El barrio del sumo, de al lado, con el museo Edo-Tokio y el templo del *goma*.
      - nombre: Museo Bashō
        maps: Basho Museum Koto Tokyo
        nota: Pequeño, junto a donde estuvo la cabaña del poeta.
        lat: 35.6861290
        lon: 139.7940920
      - nombre: Estatua de Bashō
        maps: Matsuo Basho statue Sumida River Terrace Koto
        nota: Mirando al río. Gira al atardecer.
        lat: 35.6837769
        lon: 139.7939490
      - nombre: Kiyosumi Teien
        maps: Kiyosumi Teien Garden Tokyo
        nota: "El estanque de Iwasaki, el de Mitsubishi: **piedras traídas en barco de todo Japón** y un camino que cruza el agua a ras."
        lat: 35.6799810
        lon: 139.7977865
    comer:
      - comida: koffee-mameya-kakeru
        elegido: true
        nota: "El curso de café, con reserva por web: un grano, cuatro extracciones. Abre a las 11:00: coge el primer turno, y a las 12:00, andando hacia Ningyōchō."
      - comida: mikawa-zezankyo
        nota: "Tempura con estrella en Monzen-Nakachō, **nueve sitios** y reserva con semanas. El capricho del viaje en solitario."
  - block: Mediodía
    time: "12:00–13:15"
    title: Ningyōchō, y el cambio de hotel
    body: >-
      Del café al hotel no hace falta coger el metro en Kiyosumi. Se cruza el Sumida por el puente
      Kiyosu y al otro lado empieza **Ningyōchō**, «la calle de las muñecas», que debe el nombre a
      los teatros de marionetas y de kabuki que tuvo en Edo. Es una de las propuestas de
      [Japonismo](https://japonismo.com/blog/paseo-ningyocho-tokio) para un Tokio menos obvio. Se baja
      por la Amazake Yokochō, cuatrocientos metros de tiendas viejas hasta la estación de Hamachō, con
      el santuario Suitengū a un lado. Y en el 1-7 de Ningyōchō nació en 1886 Tanizaki, el de *El
      elogio de la sombra*: es el mismo hilo literario de la mañana, al otro lado del río.


      De Hamachō, dos paradas hasta Iwamotochō, la maleta del Super Hotel y diez minutos andando
      desde Kanda-Sudachō hasta el hotel del grupo. Deja la maleta aunque no haya habitación —siempre
      la guardan— y resuelve lo práctico antes de que lleguen: comprar lo que falte, el
      **takkyūbin** si vas a mandar equipaje a los Alpes, y **recargar la tarjeta IC**.
    window:
      label: Un apunte de dinero
      body: >-
        Cuatro noches en dos hoteles distintos son **dos reservas**, y las dos salen de tu bolsillo, no
        del bote común. Tenlo separado desde el principio para que las cuentas del grupo no se enreden.
    ver:
      - nombre: Amazake Yokochō
        maps: Amazake Yokocho Ningyocho
        nota: "Cuatrocientos metros entre las estaciones de Ningyōchō y Hamachō. El nombre es de una tienda de *amazake* de la era Meiji."
      - nombre: Suitengū
        maps: Suitengu Shrine Nihonbashi
        nota: "El santuario al que van a rezar las embarazadas de Tokio, a un lado de la calle."
      - nombre: "Donde nació Tanizaki"
        maps: "谷崎潤一郎生誕の地 人形町"
        nota: "Ningyōchō 1-7-10, junto a la estación: una placa, y el autor de *El elogio de la sombra*."
  - block: Tarde
    time: "13:45–16:15"
    title: El jardín de los crisantemos
    body: >-
      Después del relevo, come algo cerca del hotel y coge la Toei Shinjuku en Iwamotochō: va directa
      a Shinjuku-sanchōme, y a cinco minutos está **Shinjuku Gyoen**, el jardín de *El jardín de las
      palabras* de Shinkai. Hasta el 15 de noviembre monta su **exposición imperial de crisantemos**
      bajo pabellones de madera, y dentro, mirando al estanque, hay un Starbucks donde sentarse. Los
      arces del Momijiyama aún estarán verdes: su semana es la última del mes.


      Las librerías de Jinbōchō y el jazz del Park Hyatt, que antes iban hoy, se adelantaron al
      [miércoles](#solo-3-ginza). A las cuatro y cuarto, al metro de la puerta Shinjuku.
    window:
      label: O nada de esto
      body: >-
        Hoy también es legítimo no hacer nada. Llevas cuatro días andando y mañana empiezan ocho más,
        con tres personas que acaban de bajarse de un vuelo de veinte horas. **Guardar fuerzas es una
        opción con argumento.**
    ver:
      - nombre: Shinjuku Gyoen
        maps: Shinjuku Gyoen National Garden
        nota: "Crisantemos imperiales del 1 al 15 de noviembre. ¥500; hasta las 16:30, última entrada a las 16:00."
      - nombre: Starbucks de Shinjuku Gyoen
        maps: Starbucks Coffee Shinjuku Gyoen
        nota: Dentro del jardín, mirando al estanque. Se entra con la entrada del jardín.
  - block: Atardecer
    time: "16:45–18:45"
    title: El museo que no sale en ninguna lista, y la estación encendida
    body: >-
      La Marunouchi deja en Tokio, y enfrente de la salida sur está el edificio KITTE, la antigua
      central de Correos. En sus plantas segunda y tercera está el **Intermediatheque**, la
      recomendación de tu familia: las colecciones de la Universidad de Tokio en vitrinas de madera
      antiguas. Esqueletos, minerales, maquetas, animales disecados. Es gratis y, en sus palabras, «no
      hay ni un turista». Los viernes abre hasta las ocho, que es lo que lo trae a hoy.


      Antes de irte, se sube a la sexta planta del mismo edificio, al **KITTE Garden**. A estas horas
      ya es de noche, y el edificio de ladrillo de la estación está encendido ahí debajo, con los
      trenes entrando y saliendo alrededor. A las siete menos cuarto, al tren: Haneda queda a media
      hora larga.
    window:
      label: Horarios
      body: >-
        **El Intermediatheque abre de 11:00 a 18:00, y los viernes y sábados hasta las 20:00**; cierra
        los lunes. **La azotea es gratis**, pero se cierra con mal tiempo: si llueve, la estación se ve
        igual de bien desde la ventana de la planta.
    ver:
      - ficha: marunouchi
        nota: La antigua oficina de Correos, el Intermediatheque y lo demás alrededor de la estación.
      - nombre: Intermediatheque
        maps: Intermediatheque Tokyo
        nota: Las colecciones de la Universidad de Tokio, gratis, en las plantas 2 y 3 de KITTE.
      - nombre: KITTE Garden
        maps: KITTE Garden Marunouchi
        nota: La azotea de la sexta planta, con la estación de Tokio iluminada a tus pies.
  - block: Noche
    time: "19:00–21:30"
    title: A Haneda, a por los otros tres
    body: >-
      El **CA 421** aterriza en **Haneda a las 19:50**, y vas a buscarlos. Llegadas internacionales,
      en la Terminal 3: entre inmigración y maletas, saldrán hacia las nueve menos cuarto, molidos,
      con ocho husos encima y sin cenar. Si llegas con tiempo, en la cuarta planta de la misma terminal
      hay una réplica de una calle de Edo y una terraza desde la que se ven despegar los aviones.


      Lleva encima desde mediodía la segunda copia del Zelda, que es el primer regalo del viaje: hoy
      no vuelves al hotel antes de Haneda. La vuelta la llevas tú,
      que ya te sabes el camino: monorraíl hasta Hamamatsuchō y la Yamanote
      hacia el norte, y en el hotel sobre las 21:30. A partir de aquí manda [el Día 1](#dia-1-vuelo)
      y esta sección se acaba.


      Lo mejor que puedes hacer por ellos es tener localizado **dónde se cena tarde y cerca**, porque a
      esa hora decidir es lo último que apetece. Y contarles lo justo: mañana el viaje empieza de cero
      para los cuatro.
    window:
      label: Antes de salir del hotel
      body: >-
        **Mira el vuelo en la web de Haneda o en la de Air China**: si viene con retraso, sales más
        tarde. Y lleva la tarjeta IC cargada para enseñarles a pasar el torno, que es lo primero que
        van a hacer en Japón.
