blocks:
  - block: Mañana
    time: "09:30–11:15"
    title: El Museo Nacional, y hoy sin pagar
    body: >-
      Hoy **el Tokyo National Museum es gratis**, como el de Arte Occidental, el de Ciencias y el de
      Arte Moderno, los cuatro en el parque de Ueno. Hora y media no da para el museo entero, así que
      la jugada es **una sola sala** y verla bien: la **galería de los Tesoros del Hōryū-ji**.
    window:
      label: Por qué esta sala y no el museo
      body: >-
        Porque el Honkan pide tres horas y hoy tienes hora y media. Y porque, con **Nara fuera del
        itinerario del grupo**, estas son las piezas del Hōryū-ji —el conjunto de madera más antiguo
        del mundo— sin bajar a Nara a por ellas. Un premio de consolación mejor que el premio.
    ver:
      - ficha: ueno
        nota: Por qué el parque es un escudo contra los demonios, y qué hay en cada museo.
      - nombre: Galería de los Tesoros del Hōryū-ji
        maps: Gallery of Horyuji Treasures Tokyo National Museum
        nota: "Edificio de **Yoshio Taniguchi**: cuarenta y ocho budas de bronce del siglo VII en penumbra, cada uno con su luz."
        lat: 35.7186648
        lon: 139.7740864
  - block: Mediodía
    time: "12:00–13:00"
    title: Llegar pronto a la explanada oeste
    body: >-
      El Meiji Jingū celebra hoy su **Gran Festival de Otoño**: hay **exposición de crisantemos**, la
      flor imperial cultivada en formas que tardan un año, y artes marciales y música de corte a lo
      largo del día.

      Hay que llegar con hora de margen, porque el sitio del yabusame **se llena y cierran el acceso
      cuando revienta**. Se ve de pie, gratis, sin entrada. Cómete algo antes: dentro no vas a querer
      moverte.
    window:
      label: El error que comete todo el mundo
      body: >-
        Bajarse en **Harajuku**. El yabusame es en la **explanada oeste** y la estación buena es
        **Yoyogi**; desde Harajuku son quince minutos más de bosque y llegas sin hueco en primera fila.
    ver:
      - ficha: meiji-jingu
        nota: El santuario de un emperador, dentro de un bosque plantado a mano.
  - block: Tarde
    time: "13:00–14:30"
    title: Yabusame, tiro con arco a caballo
    body: >-
      A las **13:00** empieza: un **rito por la paz** hacia las 13:10 y, a las **13:15**, el tambor de
      salida. Los arqueros bajan una pista larga **al galope**, con traje de caza del período Kamakura,
      y disparan a **tres blancos sucesivos a su izquierda** sin tocar las riendas.

      No es una competición: es un **rito sintoísta**, disparos ofrecidos a los dioses por la paz, la
      cosecha y la salud. Cuando un blanco revienta, la grada entera responde.
    window:
      label: Para la cámara
      body: >-
        Con un 35 mm fijo no vas a congelar al caballo: **no lo intentes**. La foto de este día no es
        el galope, es el rito alrededor del galope — los arqueros esperando turno, los trajes, las caras
        contra la cuerda.
  - block: Atardecer
    time: "15:00–18:00"
    title: Omotesandō, la calle de los arquitectos
    body: >-
      Cuando se deshaga el gentío, el bosque se queda tranquilo: es el momento de ver los crisantemos
      sin cola. Al salir por el sur, **Omotesandō**, que para quinta visita es mejor plan que Shibuya:
      un kilómetro de avenida con edificios de **Andō, Kuma, SANAA, Itō y Herzog & de Meuron**. Al
      final de la avenida, si quieres rematar dentro, el Museo Nezu.
    window:
      label: Ventana óptima
      body: >-
        Las fachadas son casi todas de vidrio y metal: **funcionan a última hora**, cuando se encienden
        desde dentro. El Nezu cierra a las 17:00, así que entra antes y deja la avenida para la caída.
    ver:
      - ficha: harajuku
        nota: Edificio por edificio, qué hay en el catálogo de arquitectura de Omotesandō.
      - nombre: Museo Nezu
        maps: Nezu Museum Tokyo
        nota: Arte asiático en un edificio de Kuma y, detrás, un jardín con estanque y casas de té.
        lat: 35.6622429
        lon: 139.7172555
      - nombre: "Ippodo Aoyama"
        maps: "Ippodo Tea Aoyama Store Tokyo"
        nota: "El matcha, camino del Nezu: la tienda grande de Ippodo. Hasta las 18:00, y una lata por persona."
    comer:
      - comida: henrys-burger-harajuku
        nota: La comida que no has hecho. Wagyu A5 a la plancha, abre todos los días de once a ocho.
      - comida: menchirashi-harajuku
        nota: "El udon a la carbonara, en la Cat Street. **Los martes cierra a las 16:30**: ve primero."
      - comida: harajuku-gyoza-lou
        nota: Gyōza a trescientos yenes la ración, en veinte minutos y en Meiji-dōri.
  - block: Noche
    time: "18:00–19:30"
    title: El kissa donde está prohibido hablar
    body: >-
      Bajando Omotesandō se llega a Shibuya, y ahí está el remate del día: un café de música maestra
      de **1926**, con las butacas atornilladas **mirando a los altavoces** y un programa impreso de lo
      que va a sonar. **No se habla**: ni conversación, ni móvil, ni cámara. A tres minutos del cruce
      más ruidoso del mundo.
    dim: true
    window:
      label: Por qué cierra bien el día
      body: >-
        Porque llevas desde las nueve y media de pie y con gente. El Lion es lo contrario y **no te deja
        hacer nada**, que es justo lo que hace falta antes de volver a Shimbashi al Sky Spa.
    comer:
      - comida: meikyoku-kissa-lion
        nota: Un café solo, que es lo que da derecho a la butaca. Se paga al salir.
