body: >-
  *[Onigiri](#onigiri)* grandes, de arroz Koshihikari de Niigata y con el relleno de borde a borde,
  en el sótano del Takashimaya de Nihonbashi. Lo lleva un cocinero salido de una casa antigua del
  gremio, y la marca ha crecido a diez locales —Haneda, Kamakura, Kobe— así que esto es una sede,
  no la casa madre.


  Encaja donde el día 10 ya pasa: Nihonbashi está a un paso del Palacio Imperial, y un *depachika*
  es exactamente el sitio donde comprar comida para llevar sin perder una hora. **Abre a las once
  entre semana**, y el día 10 es domingo, así que conviene confirmar el horario de festivo.


  Frente a [Bongo](#onigiri-bongo), que es la barra mítica con cola de horas en Ōtsuka, esto es la
  versión que se resuelve en cinco minutos. Ninguna de las dos es la de Asakusa; para esa,
  [Yadoroku](#onigiri-yadoroku).
