title: Tres vinilos para traerse de Japón
area: Tokio · el miércoles 4 en Shibuya y el viernes 6 de paso
note: "Bebop, Lupin y un Blue Note japonés · sin tiradas limitadas · y en cabina en el avión"
body: |-
  Tres discos para alguien a quien le pierden el anime y el jazz, de los que cualquier coleccionista
  querría tener y sin pelearse con tiradas limitadas ni precios de subasta. Los tres se encuentran
  en [la noche de vinilos del miércoles 4](#solo-3-ginza), entre
  [Tower Vinyl](#tower-vinyl-shibuya) y [HMV record shop](#hmv-record-shop-shibuya), y el viernes 6
  caen de paso la tienda de jazz de [Disk Union en Ochanomizu](#disk-union-jazztokyo) y su tienda
  de anime en Shinjuku.

  1. **Seatbelts, *Cowboy Bebop* (1998).** La banda sonora original, la de *Tank!*: el sitio
     exacto donde se cruzan el anime y el jazz, con Yoko Kanno y su banda. La edición en vinilo
     que no es de tirada limitada es el doble LP de Milan, de 2020. Las japonesas de 2023 (*Tank!
     Gold* y la caja de once discos) fueron de primera tirada limitada: si aparece *Tank! Gold* a
     su precio, es la que tiene gracia traerse; si no, no merece la pena perseguirla.
  2. **Yuji Ohno, *Lupin III Original Soundtrack* (1978).** El otro gran disco de jazz del anime:
     la banda sonora de la segunda serie, con el *Theme from Lupin III* que conoce todo el mundo,
     grabada por Ohno con su You & Explosion Band. Ohno murió en mayo, con 84 años, y por los 55
     años de *Lupin* Nippon Columbia lo ha reeditado en vinilo rojo transparente el 21 de octubre,
     a ¥5.000 más impuestos. Está recién salido cuando llegas, y es edición japonesa.
  3. **Sonny Clark, *Cool Struttin'* (1958), en edición japonesa.** El disco de Blue Note que
     adoptó Japón: entre 1991 y 2009 vendió aquí 179.000 copias, frente a 38.000 en Estados Unidos.
     Por eso sus ediciones japonesas abundan, están cuidadas y se encuentran de segunda mano a
     precio normal, mejor con su ***obi***, la faja de papel con el título en japonés. Es la compra
     de jazz que solo tiene sentido hacer aquí.

  Si alguno ya lo tienes, el suplente es *Scenery* (1976) de Ryo Fukui, el trío de piano de
  Sapporo que se ha vuelto de culto: en Tower está la reedición de We Release Jazz por ¥4.990.

  **Y uno que no: Expedition 33.** La banda sonora de *Clair Obscur*, de Lorien Testard, la edita
  Laced Records, un sello británico: el doble LP salió a £36. No tiene edición japonesa, así que en
  Tokio sería un importado y más caro. Se pide desde casa.

  **Al comprar**

  - **El *obi*, entero.** Sin él, una edición japonesa pierde buena parte de lo que vale.
  - **El estado va por separado**: 盤 es el disco y ジャケ, la funda. Mira las dos notas.
  - **El martes 3 es el día del disco japonés** (レコードの日): a medianoche salen ediciones
    limitadas en vinilo. El miércoles todavía queda algo en las estanterías.
  - **El *tax-free***, desde el 1 de noviembre, se paga entero y se devuelve en la aduana de salida,
    como el reloj del miércoles. Pregunta en caja: las tiendas pequeñas no siempre lo hacen.
  - **La vuelta a casa.** Compras el 4 y vuelas el 14, con los Alpes por medio. Mándalos por
    [takkyūbin](#takkyubin) al [Candeo Roppongi](#candeo-roppongi), donde duermes desde el 12
    —avisa al hotel de que llega un paquete—, y en el avión, en cabina y de pie. En la maleta
    facturada se doblan o se parten.
