body: >-
  Japonés de manual y de barrio, en el sitio exacto donde termina el paseo del día 4. Sirve **guisos
  tradicionales y *sukiyaki*** en raciones generosas —lo que aquí es casi una rareza— y compra el
  género en las tiendas *gourmet* de **Nihonbashi**, que es el barrio de los comercios centenarios de
  Tokio: la casa del té, la del alga, la de los cuchillos.


  Su mejor momento es **el menú del mediodía**, con una relación calidad-precio que sorprende para la
  zona. Y tiene un valor añadido de contexto: se come mirando el barrio que fue el **kilómetro cero**
  de todas las carreteras de Japón, hoy aplastado por una autopista — que es exactamente la historia
  que cuenta ese tramo del día.
