title: Arashiyama, y un bosque que está protegido por el ruido que hace
image:
  src: img/fichas/arashiyama.webp
  alt: "El bosque de bambú de Arashiyama visto desde abajo, con los troncos altísimos convergiendo hacia la luz."
  credit: "Pablo Sánchez"
epithet: >-
  El extremo oeste de Kioto: un río, un puente que se llama «el que cruza la luna», el jardín más
  antiguo de Japón conservado tal como se diseñó, y una arboleda de bambú que el Ministerio de Medio
  Ambiente protege oficialmente **por su sonido**.
sections:
  - heading: El bosque, y la trampa del bosque
    body: |
      El ***Chikurin***, el bambusal, son unos cuatrocientos metros de camino entre cañas de veinte
      metros que se cierran arriba y filtran la luz en verde. Está en la lista de los cien paisajes
      sonoros de Japón que el Ministerio de Medio Ambiente publicó en 1996: lo que se protege no es
      la vista, es el crujido del bambú rozándose con el viento.

      Y ahí está el problema, dicho sin rodeos: **de día no se oye nada**, porque hay miles de
      personas hablando. El bosque es corto, estrecho y está entre las cosas más fotografiadas del
      planeta. Solo hay una forma de que funcione: estar allí al amanecer. Está abierto siempre,
      no se paga, y a las siete de la mañana se puede caminar solo y oírlo. A las diez es una
      estación de metro en hora punta.

      A cincuenta metros, sin cola y sin nadie, está [**Ōkōchi Sansō**](https://www.google.com/maps/search/?api=1&query=Okochi%20Sanso%20Villa%20Kyoto), la villa y el jardín que se construyó
      **Ōkōchi Denjirō**, la gran estrella del cine de samuráis mudo japonés, y que le llevó treinta
      años. Se paga entrada, incluye té y dulce, tiene la vista más abierta del valle y está vacía.
      Es el metro cuadrado de silencio más barato de [Kioto](#kioto).
  - heading: Tenryū-ji y el jardín que no se ha movido
    body: |
      El templo principal de Arashiyama lo fundó en **1339** el shōgun Ashikaga Takauji, y no por
      devoción: fue para apaciguar el espíritu del emperador Go-Daigo, al que acababa de derrocar
      y que había muerto en el exilio. En Japón, al enemigo temido se le construye un templo.

      Los edificios ardieron ocho veces y son reconstrucciones del XIX, pero **el jardín es el
      original**: el Sōgen-chi, diseñado por el monje Musō Sōseki en el siglo XIV, es el
      jardín de Japón que mejor conserva su trazado inicial. Su técnica se llama
      *shakkei*, «paisaje prestado»: las montañas de Arashiyama no están en el jardín, pero están
      compuestas *dentro* de él — quítalas y el jardín no funciona. Es Patrimonio de la Humanidad.

      El truco de horarios: **Tenryū-ji abre a las 8:30** y tiene una puerta trasera que da
      directamente al bambusal. Se entra al jardín al abrir y se sale por detrás al bosque antes de
      que llegue el grueso de los autobuses.
  - heading: El río, los monos y el pueblo de detrás
    body: |
      - [**Togetsukyō**](https://www.google.com/maps/search/?api=1&query=Togetsukyo%20Bridge%20Arashiyama), «el puente que cruza la luna» — el nombre se lo puso un emperador del siglo
        XIII al ver la luna moverse sobre él. Es la postal del sitio y en otoño tiene la ladera
        entera encendida detrás.
      - [**Iwatayama**](https://www.google.com/maps/search/?api=1&query=Arashiyama%20Monkey%20Park%20Iwatayama) — un parque de **macacos japoneses en libertad** en lo alto de una colina, a
        unos veinte minutos de subida desde el puente. Los monos andan sueltos y **las jaulas son
        para las personas**: se les da de comer desde dentro de una caseta. Arriba, la panorámica más
        completa de Kioto que se puede tener sin drone.
      - [**Saga-Toriimoto**](https://www.google.com/maps/search/?api=1&query=Saga%20Toriimoto%20Preserved%20Street%20Kyoto) — subiendo desde el bambusal, un distrito histórico protegido de casas de
        campesinos y comerciantes con **muy poca gente**, que acaba en [**Adashino Nenbutsu-ji**](https://www.google.com/maps/search/?api=1&query=Adashino%20Nenbutsuji%20Kyoto): un
        templo con **ocho mil estatuillas de piedra** recogidas de tumbas sin nombre de todo Kioto.
        Es de los sitios más extraños y menos visitados de la ciudad.
      - [**Kimono Forest**](https://www.google.com/maps/search/?api=1&query=Kimono%20Forest%20Arashiyama) — en la estación del tranvía **Randen**, seiscientos cilindros de acrílico
        con estampados de kimono de Kioto, **iluminados por dentro al anochecer**. Dura cinco
        minutos y está justo donde se coge el tren.
  - heading: Cómo se llega y cuándo
    body: |
      Desde la estación de Kioto, **línea JR San-in hasta Saga-Arashiyama**: unos 15 minutos. La otra
      vía es el tranvía Randen desde Shijō-Ōmiya, más lento y más bonito, que deja en el Kimono
      Forest.

      Arashiyama es el **puesto número 7 de la lista nacional de mejores sitios para el momiji**, y su
      punto es la segunda quincena de noviembre — más tarde de lo que casi todo el mundo cree, y
      justo después de las fechas de este viaje (ver [el momiji](#momiji)). En esos días hay color de
      verdad, y también trenes llenos y un puente impracticable. Repetimos el consejo porque es el único que
      funciona: primer tren de la mañana. A las dos de la tarde ya se ha perdido.
curiosidades:
  - >-
    El bambusal de Arashiyama está en la lista de los **cien paisajes sonoros de Japón**: lo que se
    protege oficialmente es **el ruido del bambú con el viento**, no la vista. De día hay tanta gente
    que no se oye — por eso solo funciona al amanecer.
  - >-
    El jardín de [**Tenryū-ji**](https://www.google.com/maps/search/?api=1&query=Tenryuji%20Temple%20Arashiyama%20Kyoto) es el que **mejor conserva su diseño original** de todo Japón: lo
    trazó Musō Sōseki en el siglo XIV usando las montañas de fondo como parte de la composición
    (*shakkei*, «paisaje prestado»). El templo lo fundó Takauji para **apaciguar al emperador que
    había derrocado**.
  - >-
    En el parque de monos de [Iwatayama](https://www.google.com/maps/search/?api=1&query=Arashiyama%20Monkey%20Park%20Iwatayama) **las jaulas son para las personas**: los macacos andan
    sueltos y se les da de comer desde dentro de una caseta.
