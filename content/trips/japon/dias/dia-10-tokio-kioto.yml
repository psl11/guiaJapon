eyebrow: El plan · Día 10 · dom 15 nov
title: Dos horas y cuarto, y *la otra capital*
dek: >-
  El día bisagra del viaje. Se sale de Tokio por el viejo Tōkaidō y se llega a la ciudad que fue
  capital durante mil años, justo cuando empieza su mejor quincena. Hoy no hay agenda: hay que
  aterrizar.
traslados:
  - desde: "Tokio"
    hasta: "Kioto"
    medio: "Tōkaidō Shinkansen *Nozomi*"
    duracion: "2 h 15"
    hora: "salir 09:00"
    nota: "**¥13.850.** Pedid **ventanilla E**: es el lado del Fuji, que aparece a los cuarenta minutos."
blocks:
  - block: Mañana
    time: "09:00–11:30"
    title: El Nozomi por el Tōkaidō
    body: >-
      Dos horas y cuarto de Tokio a Kioto por la **línea de tren de alta velocidad más transitada del
      mundo**, que va calcada sobre el viejo Tōkaidō, la carretera que unía Edo con la capital
      imperial y que Hiroshige recorrió estación a estación en sus cincuenta y tres estampas. Se sale
      de una ciudad de mil seiscientos años menos y se llega a la que mandaba antes.

      Hoy es **domingo**, así que reservad asiento la víspera. Y pedid **ventanilla E**: es el lado
      del [Fuji](#fuji), que aparece a la derecha unos cuarenta minutos después de salir, entre
      Shin-Fuji y Mishima. Con suerte y cielo limpio, es el mejor peaje de un billete de tren.
    window:
      label: El tercer envío de maletas
      body: >-
        **Sale esta mañana desde el hotel de Tokio al de Kioto**, por [takkyūbin](#takkyubin), y
        llega mañana. Se viaja con lo de una noche. Es el mismo movimiento que se hará al revés
        dentro de una semana — y entonces habrá que acordarse de que el hotel de vuelta a Tokio
        **no es este**.
  - block: Mediodía
    time: "12:00–15:00"
    title: Entender la retícula antes de andarla
    body: >-
      No se empieza por lo grande. Con la tarde entera y las maletas en camino, lo que funciona es
      **orientarse**: Kioto es una retícula del año 794 copiada de Chang'an, la capital china, y en
      cuanto se entiende que las calles van norte-sur y este-oeste y que muchas se llaman por su
      número —*Shijō* es «cuarta avenida», *Sanjō* la tercera—, la ciudad deja de ser un laberinto y
      se convierte en un tablero. Ver [Kioto](#kioto).

      Un primer paseo que cumple: el mercado de [**Nishiki**](https://www.google.com/maps/search/?api=1&query=Nishiki%20Market%20Kyoto),
      cinco manzanas cubiertas de puestos donde se come andando, y de ahí al río **Kamo** al
      atardecer, que es donde se sienta media ciudad a mirar el agua.
  - block: Tarde
    time: "15:00–17:00"
    title: Una pagoda a diez minutos de la estación
    body: >-
      Si queda luz, [**Tō-ji**](https://www.google.com/maps/search/?api=1&query=Toji%20Temple%20Kyoto).
      Su pagoda de cinco pisos tiene **cincuenta y cinco metros y es la más alta de Japón**, se ve
      desde el tren al entrar y está a un paseo de la estación. Es del año 796 —o sea, de la fundación
      misma de la ciudad— y a última hora el recinto se queda casi vacío. Buena manera de que el
      primer templo del tramo no sea uno con cola.
    window:
      label: Mirad las aperturas nocturnas
      body: >-
        A partir de mediados de noviembre los templos de Kioto montan el ***raitoappu***: abren de
        noche e iluminan los jardines, y es una de las cosas que justifica venir en esta quincena y no
        en otra. **Las fechas las publica cada templo por su cuenta y no coinciden**, así que se
        miran hoy, con los tres días por delante, y se encaja una en el plan. El Kiyomizu-dera y el
        Kōdai-ji son los dos más agradecidos.
  - block: Noche
    time: "noche"
    title: La cocina de una capital sin mar
    body: >-
      Kioto está a una hora de la costa y su cocina se construyó tierra adentro: de ahí el
      ***kaiseki***, que nació aquí de la ceremonia del té, y el tofu, que por las aguas subterráneas
      de la ciudad tiene fama de ser el mejor del país. El *yudōfu*, hervido en caldo de alga delante
      de uno, es plato de invierno y de templo.

      Y la regla de oro para los tres días: **las casas buenas son tres o cuatro veces más baratas al
      mediodía**, así que la alta cocina se reserva para un almuerzo y no para una cena.
alt:
  label: Si te desmarcas
  body: >-
    El Shinkansen no es la única forma de bajar, y hay una que convierte el trayecto en el plan del
    día: parar en **Nagoya** y desviarse una hora hasta el santuario de **Ise** —el más sagrado de
    Japón, dedicado a Amaterasu, que se **derriba y se reconstruye entero cada veinte años** desde
    hace trece siglos— o hasta **Himeji**, ya pasado Kioto, cuyo castillo blanco es el que Matsumoto
    no es: el más grande, el más fotografiado y el que nunca fue atacado.

    Y si lo que apetece es lo contrario —no moverse—, una tarde en Kioto sin plan es de las mejores
    del viaje: se elige una calle norte-sur y se anda hasta que se acaba.
