body: >-
  Uno de los mercados matinales más antiguos del país: empezó en el siglo XVII como mercado de arroz y morera y hoy son puestos de campesinas de la montaña vendiendo lo suyo a lo largo del río. **Abre a las siete** — que es exactamente la hora a la que estaréis despiertos.


  El ***mitarashi dango*** de Takayama es distinto del de todas partes: aquí es **salado**, no dulce, y se asa a la brasa hasta que la soja se caramela. Cuesta cien yenes y es el mejor desayuno posible antes de meterse en Sanmachi.
