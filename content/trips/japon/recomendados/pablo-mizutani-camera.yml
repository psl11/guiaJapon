body: |-
  Pese al nombre, lo que se viene a buscar no son cámaras: es una de las tiendas de relojes
  japoneses de segunda mano más queridas de Tokio, con **Seiko, Grand Seiko y Citizen** vintage y
  *neo-vintage* a precios que todavía no son de coleccionista. El dueño conoce cada pieza y la
  explica. Se ha hecho famosa en redes y a veces hay una pequeña cola en la puerta.

  Tiene que ser el día 2, y no a la vuelta de los Alpes, por el calendario: **cierra los jueves**,
  que es el día que se llega de Kanazawa, y el viernes y el sábado de esa semana van a Shibuya y a
  Kamakura. El día 2, en cambio, termina el museo de [Ueno](#ueno) y baja a Ameyoko, y la
  tienda está en esa misma calle.

  **Lo que se busca:** un **King Seiko 45KS** o un **Grand Seiko 61GS**, en acero, por debajo de
  unos ¥230.000. Qué es cada uno y por qué, en [lo que vale la pena traerse](#compras).

  **En qué fijarse, por orden**

  1. **Que la referencia cuadre.** Está grabada en la tapa: las cuatro primeras cifras son el
     movimiento y las cuatro últimas, la caja. Un 61GS es 6145-8000 o 6146-8000; un 45KS, 4500-7000
     o 4502-7000. Si no casan, alguien ha mezclado piezas.
  2. **El número de serie.** La primera cifra es el año y la segunda, el mes. Tiene que caer dentro
     de los años del modelo: de 1968 en adelante en el 61GS, de 1968 a 1971 en el 45KS.
  3. **La esfera, original.** Una esfera repintada (*ridan*) es lo que más valor quita, y las hay
     muy bien hechas. Una pátina uniforme o algo de sol en la esfera es normal en un reloj de
     cincuenta años; manchas en un solo lado o letras borrosas, no.
  4. **Las agujas y la corona**, las de origen y con el logotipo. Una corona genérica es mala
     señal.
  5. **La caja, con las aristas vivas.** Miradla de lado a la luz: los biseles tienen que ser planos
     y con filo. Si están redondeados, la han pulido de más, y eso no tiene vuelta atrás.
  6. **El emblema de la tapa**, completo y sin gastar.
  7. **Que funcione, y cómo.** Si tienen cronocomparador, que os enseñen la marcha. En el 45KS, dad
     cuerda y mirad que la corona va suave.

  **Lo que hay que preguntar**

  - 「オーバーホール済みですか？いつですか？」 — ¿Está revisado? ¿Cuándo?
  - 「文字盤はオリジナルですか？」 — ¿La esfera es la original?
  - 「ケースは研磨されていますか？」 — ¿Han pulido la caja?
  - 「保証はありますか？何か月ですか？」 — ¿Tiene garantía? ¿De cuántos meses?
  - 「タイムグラファーで見せてもらえますか？」 — ¿Me lo enseña en el cronocomparador?
  - 「カードは使えますか？」 — ¿Aceptan tarjeta?

  **Tres reglas**

  - **Sin revisión y sin garantía, no**, aunque sea más barato. Un reloj de esta edad necesita
    taller, y las piezas de Grand Seiko vintage escasean.
  - **No compréis el primero que veáis.** Mirad dos o tres, también en Nakano Broadway, y decide al
    final.
  - **No es sumergible.** Ni ducha ni lluvia fuerte, y una revisión cada pocos años en un taller que
    conozca el calibre.
