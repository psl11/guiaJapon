title: Kamakura, el gobierno *de los guerreros*
lead: >-
  En 1185 **Minamoto no Yoritomo** ganó la guerra y tomó una decisión que marcó los setecientos años
  siguientes: no se mudó a la capital. Dejó al emperador en Kioto con su corte, sus poemas y su
  legitimidad divina intactos, y montó su propio gobierno a cuatrocientos kilómetros, en un pueblo de
  pescadores cerrado por montañas y abierto al mar. Desde entonces y hasta 1868, Japón tuvo dos
  cabezas: una que reinaba y otra que mandaba.
body: |
  El invento se llamó ***bakufu***, literalmente «gobierno de la tienda de campaña» — el nombre lo
  dice todo: una administración militar, provisional en teoría, que duró siete siglos. Yoritomo se
  hizo nombrar *shōgun* en 1192 y organizó el país en una red de vasallos guerreros. Kamakura
  eligió su emplazamiento por lo mismo que hoy la hace bonita: montañas por tres lados y mar por el
  cuarto, con siete pasos estrechos excavados en la roca como únicas entradas.

  Los guerreros necesitaban una espiritualidad a su medida, y la encontraron en el **zen**, recién
  importado de la China Song. Encajaba como un guante: nada de sutras interminables ni de liturgia
  cortesana, sino disciplina, meditación y una relación directa y sin adornos con la muerte. Los dos
  grandes monasterios zen del país se fundaron aquí — [**Kenchō-ji**](https://www.google.com/maps/search/?api=1&query=Kenchoji%20Temple%20Kamakura) en 1253 y [**Engaku-ji**](https://www.google.com/maps/search/?api=1&query=Engakuji%20Temple%20Kamakura) en 1282 —
  y con el zen vinieron en el mismo paquete la ceremonia del té, la caligrafía, los jardines de
  piedra y la cocina vegetariana de templo. Casi todo lo que hoy se considera «estética japonesa»
  entró por esta puerta.

  Y entonces llegaron los mongoles. **Kublai Kan**, que ya tenía China entera, mandó una flota en
  1274 y otra mucho mayor en 1281, la segunda con unos cuatro mil barcos. Las dos veces, un
  tifón las deshizo en la bahía.

  > A aquellos dos tifones se les llamó ***kamikaze***, «viento divino»: la prueba, para los
  > japoneses de entonces, de que los kami protegían el archipiélago. Seis siglos y medio después,
  > el Imperio le puso ese nombre a otra cosa.

  La victoria salió cara. No hubo botín que repartir entre los vasallos que habían pagado la defensa,
  el descontento se comió al régimen, y en **1333** el shogunato de Kamakura cayó. La ciudad se fue
  vaciando y se quedó como está: un pueblo con demasiados templos para su tamaño.
connect:
  label: Lo veréis sobre el terreno
  body: |
    El **día 5 entero** es este acto. [**Engaku-ji**](https://www.google.com/maps/search/?api=1&query=Engakuji%20Temple%20Kamakura) se fundó para honrar a los caídos de las
    invasiones mongolas —y aquí está el detalle zen: de los dos bandos, japoneses y mongoles por
    igual—. [**Kenchō-ji**](https://www.google.com/maps/search/?api=1&query=Kenchoji%20Temple%20Kamakura) es el monasterio zen más antiguo del país. Y [**Tsurugaoka Hachimangū**](https://www.google.com/maps/search/?api=1&query=Tsurugaoka%20Hachimangu%20Kamakura) es
    el santuario del clan Minamoto, el centro político de aquel Japón: su avenida de acceso se
    estrecha a propósito para que parezca más larga de lo que es.

    El **Gran Buda de Kōtoku-in**, de 1252, es de esta época exacta. Se fundió cuando Kamakura
    mandaba, y sigue sentado donde lo pusieron.
