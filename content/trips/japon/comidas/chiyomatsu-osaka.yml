body: >-
  Un *[tonkatsu](#tonkatsu)* de cinco centímetros de grosor sobre arroz, cocinado a baja temperatura
  para que el interior aguante ese calibre sin secarse, y rematado con huevo y cebolla en salsa dulce
  de soja. La casa la abrió un exluchador de sumo, lo que explica bastante bien el tamaño de las
  raciones.


  Está en Sennichimae, a un paso del mercado de [Kuromon](#kuromon), o sea dentro del bloque que el
  día 14 dedica a comer de doce a tres. **La cola ronda la hora** porque el local tiene poquísimos
  asientos; hay salida por la puerta de atrás, que es pedir el *katsu sando* para llevar.


  Y una advertencia que sale de quienes lo han comido: el «especial» son cuatrocientos cincuenta
  gramos de cerdo y se hace largo, con la carne más dura que la del normal. El de mil doscientos
  cincuenta yenes es el que hay que pedir.
