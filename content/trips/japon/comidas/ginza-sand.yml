body: >-
  Una ventanilla de *katsu sando* —filete rebozado entre dos rebanadas de pan de molde sin corteza—
  en una bocacalle de Ginza 7-chōme. No tiene ni una silla: se pide, se espera mientras fríen y se
  lleva en su caja. La carta es corta y gira en torno al rebozado: cerdo con sal o con salsa, carne
  picada, anguila, tortilla y una croqueta de maíz.


  El horario es de bar, no de cafetería. **Entre semana no abre hasta las cinco de la tarde** y
  sigue de madrugada; los sábados abre a mediodía y cierra los domingos y festivos. El día 20, que
  es miércoles, cae justo al volver de Nihonbashi y antes de bajar al metro de Ginza camino de
  teamLab. No es una comida: es un sándwich a medias para seguir andando.
