body: >-
  La monta Kentarō Nakahara, que es quien lleva *Sumibi Yakiniku Nakahara*, uno de los asadores de
  carbón con más nombre de Tokio. La idea es sencilla y cara de hacer: **carne de wagyu A5 picada
  gruesa**, aplastada contra la plancha al pedirla para que se forme costra, y un pan dulce que
  aguanta la grasa. Sale por entre mil y dos mil yenes, que para lo que hay dentro es poco.


  Está en Jingūmae 6, a un paso de la [Cat Street](#harajuku), justo en el tramo que el día 9 recorre
  entre las once y la una. Abre de once a ocho todos los días, así que no hay que cuadrar nada:
  quedan cinco o diez taburetes en la calle y unos veinte asientos en la planta de arriba, y se entra
  sin reserva.


  La versión grande, la *Henry's Monster*, lleva diez hamburguesas apiladas y cuesta 6.480 yenes. Es
  un desafío de carta, no un plato; se nombra porque circula en vídeo y conviene saber que existe
  para no pedirla por error.
