body: >-
  La única coctelería de Kioto en **Asia's 50 Best Bars**, escondida detrás de una puerta sin rótulo con estética de bar clandestino de los años veinte. Podría ser un tópico y no lo es: la carta gira sobre **producto de Kioto** —yuzu, pimienta *sanshō*, matcha, *shiso*— y sobre destilados japoneses.


  Kioto se acuesta pronto y tiene fama de no tener vida nocturna. Es medio cierto y este es el argumento en contra: con tres noches en la ciudad, una merece acabar aquí.
