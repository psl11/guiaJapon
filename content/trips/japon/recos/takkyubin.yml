title: Mandar las maletas por delante
area: Antes de subir a la montaña
note: "takkyūbin · unos pocos miles de ¥ por bulto"
body: >-
  El servicio que hace viable este itinerario. El ***takkyūbin*** es mensajería de equipaje de hotel
  a hotel: se entrega la maleta en recepción, se rellena un formulario y **al día siguiente está en
  el destino**. Cuesta unos pocos miles de yenes por bulto y es de una fiabilidad que no existe en
  Europa.


  Para vosotros importa en un punto concreto: **antes de subir a Kamikōchi**. Allí no hay coches ni
  ascensores y las sendas se hacen con mochila; lo que no quepa en una pequeña se manda desde
  **Matsumoto** al hotel siguiente. El grupo lo manda a [Takayama](#takayama); en tu caso, según cómo acabe el
  vuelo, a Tokio.


  **Y ojo con la dirección del último salto.** Las cinco primeras noches se duermen en
  [Akihabara](#akihabara) y las cinco últimas en [Shinjuku](#shinjuku): la maleta que se manda desde
  Kansai de vuelta a Tokio va **al segundo hotel**, no al primero. Escrito parece obvio; rellenando
  el albarán en piloto automático con la reserva vieja delante, menos.


  Se pide **en recepción la noche anterior**, no la mañana de salir: los plazos son de un día.
