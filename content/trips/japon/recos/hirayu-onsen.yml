title: La noche de Hirayu Onsen
area: Hirayu Onsen · noche del 12
status: pendiente
note: "Sustituye a Kamikōchi, que estaba completo"
body: >-
  **La noche de dentro del valle no pudo ser.** Kamikōchi tiene una docena escasa de alojamientos,
  todos estacionales, sus reservas abren en enero y la del 12 de noviembre es de las últimas que se
  venden en toda la temporada: cuando se preguntó, estaban vendidas. No es un descuido, es la
  aritmética del sitio.


  La alternativa buena está a **veinticinco minutos en autobús**, al otro lado del túnel:
  [**Hirayu Onsen**](https://www.google.com/maps/search/?api=1&query=Hirayu%20Onsen%20Takayama), el
  pueblo termal donde arranca la carretera del valle. Tiene posadas de verdad —el Hirayukan y el
  Okuhida Onsen Yamano Hotel son los dos nombres que se repiten—, casi todas con **media pensión y
  *rotenburo*** al aire libre, y cuesta bastante menos que dormir arriba. Y está en el nudo de
  carreteras: de aquí salen los autobuses a Takayama y a Matsumoto, que es justo lo que hace falta
  al día siguiente.


  Lo que se pierde conviene decirlo sin adornos: **el amanecer en el estanque Taishō**. Esa
  fotografía —escarcha, niebla levantándose del agua, el Hotaka nevado reflejado y nadie— exige
  salir andando del hotel a las seis, y desde Hirayu se entra al valle **a la hora del primer
  autobús**. El porqué entero está en [dormir en el valle](#dormir-en-kamikochi).


  A cambio se gana el baño termal, que dentro del valle no había. **Reservad ya**: son pocas casas,
  es la última semana buena del año y el mismo cuello de botella que dejó fuera a Kamikōchi aprieta
  aquí abajo.
