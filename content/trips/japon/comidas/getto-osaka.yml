body: >-
  El *dashimaki tamago* es la tortilla enrollada empapada en caldo que se come en toda Japón; la
  gracia de esta casa es que la sirve con la yema todavía líquida en el centro y la acompaña de
  ternera guisada en salsa dulce y picante, en formato menú del día.


  Lo interesante para este viaje es dónde está: a siete minutos de Tanimachi-4-chōme, que es la
  parada del **castillo de Osaka**. El día 14 hace el castillo de 9:30 a 12:00 y come a partir de las
  doce, así que este sitio cae justo en la costura entre los dos bloques y ahorra el viaje al
  mercado si alguien prefiere sentarse.


  Abre de 11:30 a 14:30 y por la noche de seis a once, **y cierra los domingos**. El día 14 es
  jueves.
