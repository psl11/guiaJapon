kicker: Historia de Japón · acto quinto de seis
title: Meiji, el país que decidió *cambiar de golpe*
lead: >-
  El 8 de julio de **1853** aparecieron en la bahía de Edo cuatro buques de guerra estadounidenses al
  mando del comodoro **Matthew Perry**. Eran de vapor, iban pintados de negro y sus cañones
  superaban en alcance a todo lo que Japón tenía. El mensaje era simple: abrid los puertos. Los
  llamaron ***kurofune***, los barcos negros, y con ellos se acabaron doscientos cincuenta años de
  puerta cerrada. El pánico fue tal que el shogunato levantó a toda prisa, en mitad de la bahía,
  unas islas artificiales con baterías de cañones para defender la ciudad. Se llamaron ***daiba***,
  «baterías» — y de ahí viene el nombre del barrio de centros comerciales que hoy ocupa su sitio:
  **Odaiba**.
body: |
  Lo que siguió no fue una colonización sino algo mucho más raro: **una élite que decide desmontarse
  a sí misma antes de que la desmonten**. Quince años de crisis, guerra civil y humillación
  diplomática después, en **1868** un grupo de samuráis jóvenes derribó al shogunato, devolvió
  formalmente el poder al emperador —un adolescente que tomó el nombre de **Meiji**— y trasladó la
  corte de [Kioto](#kioto) a Edo, que pasó a llamarse **Tōkyō**, «capital del este».

  Y entonces hicieron algo asombroso. Los samuráis que habían hecho la revolución **abolieron la
  clase samurái**: prohibieron el moño y las dos espadas, sustituyeron los estipendios por bonos y
  montaron un ejército de reclutas. Mandaron misiones a Europa y América a copiar sistemáticamente lo
  mejor de cada sitio: el ejército de Prusia, la marina de Gran Bretaña, el código civil de Francia,
  la escuela de Estados Unidos. El lema oficial era ***bunmei kaika***, «civilización e ilustración»,
  y en cuarenta años el país pasó del arcabuz al acorazado.

  > En **1853** Japón no tenía un solo barco de vapor. En **1905** hundió a la flota rusa del
  > Báltico en el estrecho de Tsushima. Cincuenta y dos años.

  El precio fue una identidad partida en dos que todavía se nota. En la misma década se levantaban
  edificios de ladrillo rojo con reloj y se decretaba la separación forzosa de kami y budas
  —***shinbutsu bunri***, 1868—, que rompió por ley aquella convivencia de mil trescientos años y
  convirtió al shintō en religión de Estado. Muchos templos budistas perdieron entonces sus imágenes,
  y el sincretismo que hoy parece natural fue en realidad reconstruido después.

  Cuando el emperador Meiji murió en 1912, se le hizo lo que aquí se le hace a alguien que sobrecoge:
  **convertirlo en kami**. Su santuario se terminó en 1920.
connect:
  label: Lo veréis sobre el terreno
  body: |
    [**Meiji Jingū**](#meiji-jingu), el día 3, es exactamente esto. Y su detalle bueno no es el santuario sino el
    bosque: los **cien mil árboles** que lo rodean fueron **donados por ciudadanos de todo el país**
    y plantados a mano en los años veinte, con un plan forestal diseñado para que en un siglo
    pareciera un bosque primario. Funcionó. Lo que parece naturaleza antigua en el centro de Tokio es
    un proyecto de ingeniería de hace cien años — muy Meiji.

    A doscientos metros, [**Omotesandō**](https://www.google.com/maps/search/?api=1&query=Omotesando%20Tokyo) se trazó como avenida de acceso al santuario y hoy es la
    calle donde los arquitectos japoneses construyen sus tiendas: el mismo gesto de mirar afuera y
    hacerlo propio, un siglo después.
