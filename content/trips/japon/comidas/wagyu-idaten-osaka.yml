quePedir: "La caja de wagyu **de vaca**, que es la carne que anuncian. Va sobre arroz, en *jūbako* lacada."
body: >-
  Wagyu A5 laminado sobre arroz y servido en *jūbako*, la caja lacada de varios pisos que se usa en
  las comidas de celebración. La casa abrió en julio de 2023 y está a un minuto de la salida de
  Namba, en una segunda planta.


  El detalle que manda es el horario: **solo abre a mediodía, de 11:30 a 14:30, y cierra la comanda a
  las dos**. El día 14 tiene ese hueco ocupado por [Kuromon](#kuromon), a seiscientos metros; o esta
  caja sustituye al mercado, o no cabe. No aceptan reservas, así que además hay que contar la cola
  dentro de una ventana de tres horas.


  El vídeo que lo trae anuncia también turno de noche. **No aparece en la ficha de reservas de la
  casa**, que solo publica el de mediodía, así que no lo doy por bueno.
