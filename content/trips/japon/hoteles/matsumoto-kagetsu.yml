nota: Abrió en 1887 — es el hotel más antiguo de Matsumoto.
body: >-
  Lleva abierto desde **1887** y es el hotel más viejo de la ciudad, lo que en Japón significa que
  atravesó la era Meiji, dos guerras y el terremoto: casi nada de eso queda en pie. Su dirección
  postal es *Nawate-dōri*, la calle de las ranas que bordea el río Metoba, así que se sale por la
  puerta y ya se está en el paseo.


  El interior va en la clave local, que es el **mingei** —el movimiento de artesanía popular que
  tiene en Matsumoto su capital—: madera oscura, muebles de oficio y lámparas de papel, más cerca de
  una casa de campo señorial que de un lobby. Tiene además baño común de estilo termal, que después
  de un día de tren se agradece.


  Frente al Nunoya cambia dos cosas. Está **seis minutos del [castillo](#matsumoto-jo) en vez de
  once**, que es su ventaja real; y baja a 8,4 —aunque sobre 1.955 reseñas, una muestra siete veces
  mayor—. A cambio, la estación queda dos minutos más lejos.
