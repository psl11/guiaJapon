body: >-
  La guía ya avisa de que la fianza de una tarjeta IC normal **solo se devuelve en Haneda, no en
  Narita**. Esta es la salida a ese callejón: la Welcome Suica **no lleva fianza**, así que no hay
  nada que reclamar al irse. Se compra en máquinas dedicadas de las terminales 1 y 2·3 de Narita y en
  los mostradores del JR East Travel Service Center.


  Dura **veintiocho días desde el primer uso**, que cubre de sobra los veintiuno del viaje y también
  los veinticinco del cuarto viajero. La contrapartida está en el aviso de arriba y es real: donde la
  Suica normal devuelve los quinientos yenes del depósito y el saldo restante menos doscientos veinte
  de comisión, esta **no devuelve nada**.


  De ahí sale la única regla práctica: recargarla en tramos cortos según se acabe, y no meterle diez
  mil yenes el primer día. Para quien vuela desde Narita —que en este grupo es el cuarto viajero el
  día 9— la cuenta sale a favor de la Welcome Suica; para quien sale por Haneda, las dos valen y la
  normal recupera el depósito.
