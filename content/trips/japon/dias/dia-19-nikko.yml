blocks:
  - block: Mañana
    time: "07:00–09:30"
    title: El Spacia desde Asakusa
    body: >-
      El Tōbu Limited Express sale de Asakusa y llega a Nikkō en unas dos horas con asiento reservado.
      Del andén al santuario hay autobús o veinticinco minutos a pie
      cuesta arriba, y andando se pasa por el puente Shinkyō.
    window:
      label: Hoy sí importa el día de la semana
      body: >-
        **Ayer fue festivo**, así que los museos que cierran los lunes **han trasladado su cierre a
        hoy, martes**. A Nikkō le da igual —los santuarios no cierran—, pero es una razón más para que
        hoy toque esto y no museos en Tokio.
  - block: Mediodía
    time: "09:30–13:00"
    title: Convertir a un hombre en dios
    body: >-
      Cuatro cosas, y cada una tiene truco:

      - **El Yōmeimon.** Quinientas tallas en una sola puerta. La llaman «la puerta del atardecer»
      porque uno se queda mirándola hasta que anochece.
      - **El pilar del revés.** Está así a propósito. La perfección invita a la decadencia, así que el
      edificio se deja incompleto adrede.
      - **Los tres monos.** No son una obra suelta: son el segundo de **ocho paneles** sobre las edades
      de la vida, y representan la infancia.
      - **El gato dormido.** Al otro lado del panel hay gorriones. El gato duerme y los pájaros juegan
      sin miedo: la paz de los Tokugawa, tallada en veinte centímetros.
    ver:
      - ficha: nikko
        nota: Por qué el clan más sobrio del país enterró a su fundador bajo laca y oro.
      - nombre: Shinkyō
        maps: Shinkyo Bridge Nikko
        nota: El puente lacado que solo cruzaban el shōgun y los peregrinos imperiales. Se ve entero desde la carretera.
        lat: 36.7533178
        lon: 139.6040375
      - nombre: Tōshōgū
        maps: Nikko Toshogu Shrine
        nota: "El mausoleo de Ieyasu. Tras el gato dormido, **207 escalones** hasta su tumba, que esta sí es sobria."
        lat: 36.7576378
        lon: 139.5991100
      - nombre: Rinnō-ji
        maps: Rinnoji Temple Nikko
        nota: El templo del conjunto, más antiguo y mucho más tranquilo. Queda de paso.
        lat: 36.7547249
        lon: 139.6007590
  - block: Tarde
    time: "13:00–16:00"
    title: El bosque, y una decisión honesta
    body: >-
      Detrás del santuario, la carretera de Irohazaka trepa en zigzag hasta el lago Chūzenji y la
      cascada de Kegon: cincuenta minutos de autobús desde la estación.

      Y aquí hay que ser honesto: **la parte alta de Nikkō tiene su momiji a finales de octubre**, así
      que a estas alturas de noviembre el color de arriba ya ha pasado. Abajo, en la zona del
      santuario, queda algo. Si el día va justo, el santuario vale por sí solo y la montaña puede
      dejarse.
    ver:
      - nombre: Irohazaka
        maps: Irohazaka Winding Road Nikko
        nota: Cuarenta y ocho curvas de horquilla, una por sílaba del viejo silabario.
      - nombre: Cascada de Kegon
        maps: Kegon Falls Nikko
        nota: Noventa y siete metros de caída junto al lago Chūzenji, con ascensor hasta el pie.
      - ficha: momiji
        nota: Por qué el color baja por la ladera, y por qué Nikkō no se adelantó al día 9.
  - block: Noche
    time: "noche"
    title: Vuelta con el último Spacia
    body: >-
      Se vuelve a Asakusa, el barrio de la primera mañana del viaje, y cerrar aquí diecinueve días
      después tiene su cosa. Se cena por el barrio.
    ver:
      - nombre: Hoppy-dōri
        maps: Hoppy Street Asakusa Tokyo
        nota: Croquetas y bares al aire libre, a diez minutos de la estación de Asakusa.
    comer:
      - comida: "sugita-asakusa"
        nota: "Tonkatsu con Bib Gourmand desde 2019, una parada al sur. Última comanda a las 20:15."
alt:
  label: Si te desmarcas
  body: >-
    En Nikkō, saltarse el [Tōshōgū](https://www.google.com/maps/search/?api=1&query=Nikko%20Toshogu%20Shrine) —herejía— y hacer el [**Rinnō-ji**](https://www.google.com/maps/search/?api=1&query=Rinnoji%20Temple%20Nikko) y el **Futarasan**, más antiguos,
    mucho más sobrios y sin nadie; o el paseo por la garganta de Kanmangafuchi, donde hay
    setenta estatuas de Jizō alineadas junto al río de las que se dice que nunca sale la misma
    cuenta dos veces.

    Y si a estas alturas del viaje el cuerpo no pide dos horas de tren, este es buen día para
    quedarse en Tokio: los jardines clásicos —el **Rikugi-en**, el **Koishikawa Kōrakuen**— están en
    su mejor semana y abren de noche. Los museos de [Ueno](#ueno), en cambio, no: hoy cierran por
    el traslado del festivo. Es el último hueco grande antes del vuelo.
