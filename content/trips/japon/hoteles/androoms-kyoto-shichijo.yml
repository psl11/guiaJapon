body: >-
  Esta cama la elige la estación, y no es una comodidad genérica: **tres de las cuatro mañanas de
  Kioto arrancan en ella**. El Sagano hacia Arashiyama a las siete, el JR Nara hacia Fushimi Inari a
  las 6:45 y el Nozomi a Hiroshima a las 7:30 salen todos de aquí, y la vuelta tarde de Osaka acaba
  en el mismo andén. El hotel está en el lado norte, el de la salida Karasuma, que es el de los
  trenes locales y la terminal de autobuses hacia Higashiyama. Cuatrocientos metros: se sale del
  vestíbulo y se está en la puerta.


  Lo que se paga son las noches. [Kioto](#kioto) se cena y se pasea en el centro —Nishiki, Pontochō,
  Gion con los faroles— y desde aquí eso son **dos paradas de metro** por la línea Karasuma, o un
  taxi de diez minutos que entre tres no es nada. Se aceptó a sabiendas: con días que empiezan a
  las seis, la noche de Kioto es corta de todas formas. Y el barrio tiene una carta que el plan del
  día 11 ya usaba sin saberlo: [Men-ya Inoichi](#menya-inoichi), el ramen con Bib Gourmand, está en
  la misma manzana, en Ebisunochō.


  El hotel es de la cadena Solare, de estética contemporánea y habitaciones compactas, con **baño
  grande y sauna gratis** para los huéspedes, lavandería y bicis de alquiler. Se eligió por delante
  de los business veteranos de enfrente de la estación por el edificio y por la cama: la triple son
  dos individuales y un sofá cama, y no dos semidobles de 120 cm para tres personas.


  Y la logística de maletas, que aquí tiene dos fechas. Las grandes llegan por
  [takkyūbin](#takkyubin) el martes 17, enviadas desde el Candeo la mañana del lunes. Salen hacia
  Tokio el viernes 20, y como el tren es a las 7:30 **hay que dejarlas en recepción la noche
  anterior con el envío ya tramitado**: el recogedor pasa después de que os hayáis ido. Se pregunta
  al hacer el check-in el lunes y queda resuelto.
