      - nombre: "Reloj de Wakō"
        maps: "Wako Clock Tower Ginza"
        nota: "La torre del cruce de 4-chōme que Godzilla arranca en 1954, y que vuelve a caer en *Godzilla Minus One*."
        lat: 35.6715697
        lon: 139.7650504
      - nombre: "Plaza de Godzilla de Hibiya"
        maps: "Hibiya Godzilla Square"
        nota: "La estatua de tres metros de *Shin Godzilla*, a diez minutos de Ginza."
        lat: 35.6736606
        lon: 139.7603621
    comer:
      - comida: tonkatsu-marushichi-ginza
        elegido: true
        nota: El *katsudon* con el filete a la brasa. Sin reserva y última comanda a las 14:30.
      - comida: ginza-hachigo
        nota: Un solo ramen, setenta cuencos al día y seis asientos. Se reserva en TableCheck.
      - comida: shinamen-hashigo-ginza
        nota: El plan B si Hachigō está lleno. Dandanmen desde 1964, sin reserva y solo efectivo.
      - comida: ippudo-ginza
        nota: El de Pablo en Ginza. Ramen de Hakata sin reserva, a dos manzanas del Kabuki-za.
      - comida: ginza-sushi-banya-kai
        nota: "*Omakase* de veintidós pases por menos de sesenta euros. Turno de 12:00 a 14:30."
      - comida: maru-ginza
        nota: "*Kaiseki* joven con menú de mediodía de unos diez euros."
      - comida: "ginza-haru-chan-ramen"
        nota: "Ramen de sal con Bib Gourmand 2026, en 3-chōme. Sin reserva y abierto de corrido."
  - block: Tarde
    time: "13:45–14:45"
    title: Un jardín de agua salada
    body: >-
      Diez minutos andando desde Ginza hacia el mar está Hama-rikyū, el antiguo coto de caza de los
      Tokugawa. En medio del estanque hay una casa de té a la que se llega por tres puentes de madera,
      donde sirven *matcha* batido y un dulce mirando el agua. Es el último sitio tranquilo del viaje
      y está en su mejor semana del año.


      Se sale hacia Shiodome, a cinco minutos de la estación de la **Yurikamome**: el tren sin
      conductor que da la vuelta por la bahía y Odaiba hasta Shin-Toyosu, a un minuto de teamLab. Son
      unos treinta minutos, así que hay que subir antes de las tres para llegar a las 15:30.
    window:
      label: Por fin, el momiji de la ciudad
      body: >-
        **El pico de la hoja roja en Tokio va del 20 de noviembre al 5 de diciembre**, así que hoy
        estáis dentro: por esto se guardó la ciudad para el final. Ver [el momiji](#momiji).
    ver:
      - nombre: Hama-rikyū
        maps: Hamarikyu Gardens Tokyo
        nota: El único estanque de Tokio de agua de mar, que sube y baja con la marea.
        lat: 35.6601760
        lon: 139.7638239
  - block: Tarde
    time: "15:30–17:30"
    title: teamLab Planets, con hora
    body: >-
      **Las entradas son para las 15:30**, y es la hora de entrada: llegad un poco antes. En
      **teamLab Planets** se anda descalzo por salas a oscuras con el agua por las rodillas y la luz
      proyectada encima. Conviene ir con pantalón que se pueda remangar hasta el muslo; hay taquillas
      para los zapatos y las bolsas. Es espectáculo digital y no arte antiguo, y a tres primerizos les
      va a parecer lo más japonés del viaje aunque no lo sea en absoluto.


      A la salida ya es de noche. Se vuelve a Ginza en la Yūrakuchō desde Toyosu, a diez minutos
      andando, que para en Ginza-itchōme, a un minuto del hotel.
    ver:
      - nombre: teamLab Planets
        maps: teamLab Planets TOKYO Toyosu
        nota: "**Entradas compradas** para el miércoles 25 a las 15:30. A un minuto de Shin-Toyosu (Yurikamome) y a diez de Toyosu (Yūrakuchō)."
        lat: 35.648884
        lon: 139.790024
  - block: Noche
    time: "noche"
    title: La última noche entera, en Ginza
    body: >-
      De vuelta en Ginza, la última noche entera se resuelve a pie desde el hotel: un *katsu sando*
      de la ventanilla de Ginza Sand, que abre a las cinco, *oden* de pie en 7-chōme o los *izakaya*
      bajo las vías de Yūrakuchō.


      Si queda cuerda, Nihonbashi de noche, a quince minutos andando: el puente del que se medían las
      distancias del [Tōkaidō](#kioto) que bajasteis en tren, y que hoy vive humillado bajo una
      autopista de hormigón levantada para los Juegos del 64.
    ver:
      - nombre: Nihonbashi
        maps: Nihonbashi Bridge Tokyo
        nota: El kilómetro cero del país, bajo una autopista. El siglo XX japonés en una imagen.
        lat: 35.6840677
        lon: 139.7745029
      - nombre: Gādo-shita de Yūrakuchō
        maps: Yurakucho Gado-shita izakaya Tokyo
        nota: "*Izakaya* bajo las vías del tren, llenos de oficinistas."
    comer:
      - comida: ore-no-dashi
        elegido: true
        nota: "*Oden* por piezas y de pie en Ginza 7-chōme, a precio de barra."
      - comida: ginza-sand
        nota: "*Katsu sando* para llevar, sin sillas. Abre a las 17:00 entre semana: no antes."
      - comida: bar-high-five
        nota: La última copa, en la escuela de coctelería de Ginza. Sin carta, y conviene reservar.
alt:
  label: Si te desmarcas
  body: >-
    Con teamLab a las 15:30 salieron de la tarde la tienda Pokémon de Tokyo Midtown Yaesu y la
    avenida de ginkgos de Meiji Jingū Gaien, que amarillea justo hacia el 25: está a media hora, y
    es la carta para quien no entre en teamLab.


    Si teamLab ya lo tienes visto, hoy es miércoles y no cierra nada, así que la carta está entera.
    El [**Museo Nezu**](https://www.google.com/maps/search/?api=1&query=Nezu%20Museum%20Tokyo) es la
    mejor opción y hoy sí abre —cierra los lunes—: un edificio de Kengo Kuma con un jardín en cuesta
    que no parece Tokio, y que en la última semana de noviembre tiene sus propios arces.


    Y sin moverse del mediodía, el **Kabuki-za de Ginza** vende *hitomakumi*, entradas de un solo acto, en taquilla y para
    el mismo día, por unos pocos euros. Entras, ves cuarenta minutos de kabuki desde el cuarto piso y
    te vas. Es exactamente la dosis correcta la primera vez.


    Y si el domingo os quedasteis con ganas del Rikugi-en, esta noche estrena su iluminación: del 25
    de noviembre al 6 de diciembre, de 18:00 a 20:30, y este año con proyecciones nuevas en el
    almacén y en el bosque de bambú. La entrada anticipada cuesta ¥1.000, y desde Ginza se llega en
    media hora.