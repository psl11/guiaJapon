epithet: >-
  El barrio del manga, el anime y las máquinas recreativas no nació de ninguna subcultura: nació de
  un mercado negro de componentes de radio bajo las vías del tren. Toda su historia posterior —la
  electrónica, los videojuegos, el otaku— es la consecuencia lógica de aquello. Y es donde dormís
  los cinco primeros días, que es una elección rara y deliberada.
sections:
  - heading: De la radio al anime, en línea recta
    body: |
      En la posguerra, estudiantes de ingeniería montaron bajo el viaducto de Akihabara un mercadillo
      de **piezas sueltas de radio**: resistencias, válvulas, bobinas. Se compraban para montarse un
      receptor en casa, porque comprar uno entero era imposible.

      De vender componentes se pasó a vender electrodomésticos, de ahí a la informática doméstica de
      los ochenta, de ahí a los videojuegos, y de los videojuegos al manga y al anime que los
      alimentaban. Nada de esto fue planificado: **es una cadena de sesenta años que empieza en una
      caja de resistencias**.

      Y lo mejor es que el primer eslabón **sigue ahí**. Bajo las vías, en el **Radio Center**, hay
      todavía un laberinto de puestos de un metro cuadrado vendiendo condensadores y cables a
      ingenieros de barba blanca. Es lo más raro y lo más auténtico del barrio.
  - heading: Por qué se duerme aquí, y no en Shinjuku
    body: |
      La respuesta corta es que **el argumento de Shinjuku vale menos justo cuando pega el jet lag**.
      Lo que Shinjuku tiene y esto no es la noche: cocina hasta las tres, callejones, bares. Y los
      cinco primeros días os vais a despertar a las cinco de la mañana y estaréis fundidos a las
      nueve de la noche, así que esa ventaja se desperdicia entera. La ganáis a la vuelta, del 22 al
      26, cuando el cuerpo ya está hecho y encima es pico de hoja roja.

      Lo que sí se gana aquí, en cambio, se gana desde el primer día:

      - **La estación es legible.** Lleva Yamanote, Keihin-Tōhoku, la Sōbu amarilla, la Hibiya y el
        Tsukuba Express, y aun así no tiene pérdida. Shinjuku tiene más de doscientas salidas y es
        la más confusa de Japón: cruzarla dos veces al día durante cinco días con jet lag es un
        peaje que nadie cuenta hasta que lo paga.
      - **El Tokio viejo está al lado.** El [Sensō-ji](#sensoji) a diez minutos —que es la mañana
        mejor planificada del viaje, el templo vacío al amanecer—, [Ueno](#ueno) a dos paradas,
        [Yanaka](#yanaka) a cuatro, [Ryōgoku](#ryogoku) directo por la Sōbu, [Ginza](#ginza) directo
        por la Hibiya y Jinbōchō andando. Desde Shinjuku, todo eso es media hora más.
      - **De noche está tranquilo y sale más barato**, que en un viaje de tres semanas no es un
        detalle menor.

      El precio a pagar son dos cosas, las dos pequeñas: **se cena antes** —a las diez esto está
      cerrado y hay que bajar a Kanda o a Ueno— y el día que se sube a los Alpes hay que llegar a
      Shinjuku con las maletas, veinte minutos de Sōbu directa.
  - heading: Lo que merece la pena, y lo que no
    body: |
      Las siete plantas de figuritas se agotan rápido. Esto no:

      - [**Super Potato**](https://www.google.com/maps/search/?api=1&query=Super%20Potato%20Akihabara%20Tokyo) — cuatro plantas de videojuegos retro, con **salón recreativo en la última**
        donde se juega a máquinas de los ochenta con monedas de cien yenes. Si os criasteis con una
        NES, este es vuestro sitio.
      - [**3331 Arts Chiyoda**](https://www.google.com/maps/search/?api=1&query=3331%20Arts%20Chiyoda%20Tokyo) — un **instituto abandonado reconvertido en centro de arte
        contemporáneo**: las aulas son galerías y talleres, y hay café y azotea. Gratis casi todo.
      - [**Origami Kaikan**](https://www.google.com/maps/search/?api=1&query=Origami%20Kaikan%20Tokyo) — una casa dedicada íntegramente al papel plegado, con taller en activo,
        demostraciones y papel que no se encuentra en ningún otro sitio. El mejor souvenir de Tokio
        por trescientos yenes.
      - [**Yushima Seidō**](https://www.google.com/maps/search/?api=1&query=Yushima%20Seido%20Tokyo) — un templo **confuciano** de laca negra, de 1690, en una ladera arbolada a
        cinco minutos del ruido. No hay nadie nunca. Es la escuela donde se formaron los funcionarios
        del shogunato.
      - [**Kanda Myōjin**](https://www.google.com/maps/search/?api=1&query=Kanda%20Myojin%20Shrine%20Tokyo) — el santuario del barrio, y una rareza estupenda: como protege el distrito
        de la electrónica, aquí **se bendicen ordenadores y se venden amuletos para que no se caiga
        el servidor**. Está consagrado, entre otros, a [Masakado](#masakado).
      - [**Nikolai-dō**](https://www.google.com/maps/search/?api=1&query=Nikolai-do%20Holy%20Resurrection%20Cathedral%20Tokyo) — una **catedral ortodoxa rusa** de 1891 en pleno centro de Tokio, con cúpula
        verde. La levantó un arzobispo que llegó en 1861 como capellán del consulado ruso y se quedó.

      Y a **dos paradas**, en la dirección contraria a todo lo anterior, está
      [Jinbōchō](#jimbocho) y sus ciento treinta librerías de viejo. Akihabara y Jinbōchō son el
      mismo barrio con sesenta años de diferencia: los dos venden papel y cacharros a gente obsesiva.
  - heading: Dónde comer aquí
    body: |
      - **Hachimaki**, en Kanda: de los mejores ***tendon*** de Tokio —cuenco de arroz con
        [tempura](#tempura) encima— en una casa que lleva generaciones con la misma carta corta.
      - Y la ley de la zona: en Akihabara **se come mirando hacia arriba**. Los locales buenos están
        en plantas cuartas y quintas de edificios sin fachada, con el cartel en vertical junto al
        ascensor.
curiosidades:
  - >-
    **Akihabara empezó como un mercado negro de piezas de radio** bajo las vías, en la posguerra.
    Toda la cadena posterior —electrodomésticos, informática, videojuegos, manga— sale de ahí. Los
    puestos de componentes **siguen existiendo** bajo el viaducto.
  - >-
    En el santuario [**Kanda Myōjin**](https://www.google.com/maps/search/?api=1&query=Kanda%20Myojin%20Shrine%20Tokyo) se bendicen **ordenadores y servidores**, y se venden amuletos
    para la seguridad informática. Es el santuario del barrio de la electrónica y hace su trabajo.
  - >-
    En medio de todo esto hay una **catedral ortodoxa rusa** de 1891, la [Nikolai-dō](https://www.google.com/maps/search/?api=1&query=Nikolai-do%20Holy%20Resurrection%20Cathedral%20Tokyo), fundada por un
    capellán del consulado que llegó a Japón en 1861 y ya no se volvió.
