body: >-
  El aviso viene de una cuenta japonesa y va contra la costumbre de todo el mundo: **los KitKat de
  matcha y los dulces que se compran de recuerdo salen a mitad de precio en una drugstore o en una
  tienda de golosinas que en un konbini o en Don Quijote.** El ejemplo que dan es concreto — cerca de
  quinientos yenes en Lawson o Donki, por debajo de trescientos en Matsumoto Kiyoshi o en Okashi no
  Machioka.


  No es un dato que se pueda comprobar desde aquí porque los precios cambian por tienda y por semana,
  pero la lógica se sostiene: el konbini cobra la conveniencia y la drugstore vive de cupones y
  puntos. **Matsumoto Kiyoshi** es la cadena amarilla y rosa que hay en cada calle comercial, así que
  no hay que buscarla.


  El día 17 es el de comprar y es cuando esto cuenta de verdad: con cuatro personas comprando cajas
  de dulces para llevar, la diferencia deja de ser calderilla.
