slug: dia-10-tokio-centro
navLabel: "Día 10 · El centro"
trip: japon
order: 10
eyebrow: El plan · Día 10 · dom 15 nov
title: El agujero en medio de la ciudad, y *una tumba que nadie mueve*
dek: >-
  Primer día de los tres solos, y el único del viaje que se pasa entero en el centro exacto de Tokio.
  Que resulta ser un vacío: ciento quince hectáreas de bosque con foso a las que casi no se entra, y
  alrededor el distrito financiero más caro del país construido sobre lo que fue un castillo.
blocks:
  - block: Mañana
    time: "08:00–09:30"
    title: El santuario de la esquina, en su día grande
    body: >-
      Se empieza andando y sin coger un tren. A diez minutos del hotel está el
      [**Kanda Myōjin**](https://www.google.com/maps/search/?api=1&query=Kanda%20Myojin%20Shrine%20Tokyo),
      el santuario que guarda este trozo de ciudad desde hace mil años y al que las tiendas de
      [Akihabara](#akihabara) llevan los ordenadores a bendecir — hay amuletos para el disco duro, y
      no es una broma para turistas. Dentro está consagrado **Taira no Masakado**, que es el hilo del
      que tira todo el día: dentro de una hora vais a estar de pie delante de su tumba.
    window:
      label: Por qué hoy, y no cualquier domingo
      body: >-
        **Hoy, 15 de noviembre, se celebra el *shichi-go-san***: los niños de siete, cinco y tres años
        van al santuario vestidos de gala. Cae en la fecha exacta y en domingo, así que los patios
        van a estar llenos de críos con kimono y de familias con fotógrafo contratado. Ayer lo
        rozasteis en [Meiji Jingū](#meiji-jingu), que es donde se hace a lo grande; aquí se ve la
        versión de barrio, con veinte familias en vez de doscientas, y se está mucho más cerca.

        No se reserva ni se paga: la única condición es pasarse por la mañana, que es cuando van.
  - block: Mañana
    time: "09:30–12:30"
    title: Ōtemachi, y el castillo que no está
    body: >-
      Dos paradas de metro y se sale entre torres de oficinas, a [**la tumba de
      Masakado**](#masakado): treinta metros cuadrados sin edificar en el suelo más caro del mundo,
      con incienso fresco puesto esta misma mañana. La historia —la cabeza que voló desde Kioto, el
      terremoto, el rayo, la excavadora volcada— está en su ficha y conviene llevarla leída, porque
      el sitio en sí se ve en cinco minutos y lo que impresiona es saber que **una ciudad de catorce
      millones de habitantes lleva un siglo sin atreverse a tocarlo**.

      De ahí se cruza al foso y se entra en el [**Higashi Gyoen**](#marunouchi), el jardín este del
      Palacio Imperial. Es gratis, y dentro está lo único que queda de lo que fue la mayor fortaleza
      del mundo: los muros de piedra ciclópea, la torre de vigilancia **Fujimi-yagura** y, sobre
      todo, el basamento vacío de la torre del homenaje, que ardió en 1657 y que el shogunato decidió
      no reconstruir para gastarse el dinero en rehacer la ciudad. Se sube en dos minutos y desde
      arriba se entiende de golpe qué había aquí. Se sale por Kōkyo Gaien, la explanada de pinos
      negros recortados, a ver el [**Nijūbashi**](https://www.google.com/maps/search/?api=1&query=Nijubashi%20Bridge%20Imperial%20Palace%20Tokyo).
    window:
      label: La única ventana del viaje para entrar
      body: >-
        **Los Jardines del Palacio cierran los lunes y los viernes**, y esa es la razón de que este
        bloque esté hoy y no en la semana de vuelta: el día 20, que es el otro que pasa por aquí, no
        se puede entrar. De los días de Tokio que os quedan, este domingo es el que abre.

        Un aviso de temporada para no esperar lo que no toca: el [pico de la hoja roja en la
        ciudad](#momiji) va del 20 de noviembre al 5 de diciembre, así que los arces del jardín están
        empezando. Lo veréis rojo de verdad al volver, dentro de diez días.
  - block: Mediodía
    time: "12:30–15:00"
    title: Marunouchi, «dentro del círculo»
    body: >-
      El nombre lo dice todo: *maru-no-uchi* es «dentro del recinto», porque este distrito entero
      estaba dentro de los fosos del castillo. Hoy es el barrio de los bancos, y lo que hay que ver
      es gratis y cabe en tres paradas. La [**estación de Tokio**](#marunouchi), de 1914, en ladrillo
      rojo, restaurada en 2012 recuperando las cúpulas que perdió en los bombardeos — asomaos al
      vestíbulo norte a mirar los ocho relieves del zodiaco del techo abovedado. Encima de ella, en
      el edificio KITTE, la
      [**Intermediatheque**](https://www.google.com/maps/search/?api=1&query=Intermediatheque%20Tokyo):
      la colección científica de la Universidad de Tokio —esqueletos de ballena, aves disecadas,
      instrumentos de medición— montada en vitrinas de madera del XIX con criterio de galería. Y a
      cinco minutos, el [**Tokyo International
      Forum**](https://www.google.com/maps/search/?api=1&query=Tokyo%20International%20Forum) de
      Rafael Viñoly, un casco de barco de cristal de sesenta metros puesto del revés.

      Para comer, dos opciones sin salir de aquí: el sótano de alimentación de unos grandes almacenes
      o la **Ramen Street** de la estación, ocho casas de [ramen](#ramen) buenas y una a una de cada
      región, en el sitio con menos alma imaginable.
    window:
      label: Lo que solo pasa en domingo
      body: >-
        En la explanada del Tokyo International Forum se monta el **Ōedo Kottōichi**, el mayor
        mercado de antigüedades al aire libre de Japón: un par de centenares de puestos de cerámica,
        estampas, kimonos usados y cacharrería, a precios que no son de tienda. Se celebra **el
        primer y el tercer domingo de mes**, y hoy es el tercero — pero confirmadlo en su calendario,
        que se publica año a año y algún mes salta por obras en la plaza.

        Y si además está montada la terraza de la avenida **Nakadōri**, que en temporada peatonalizan
        los fines de semana y llenan de mesas entre los olmos, la comida del mediodía se resuelve
        sola y al aire libre.
  - block: Tarde
    time: "15:00–18:00"
    title: Los cuarenta y siete, y la última luz desde una fábrica de cerveza
    body: >-
      Un cuarto de hora hacia el sur, a Shinagawa, y al templo
      [**Sengaku-ji**](#ebisu-meguro): aquí están enterrados en filas, alrededor de su señor, los
      cuarenta y siete *rōnin* del *Chūshingura*. Esperaron casi dos años fingiendo vidas disolutas,
      asaltaron la villa de Kira una noche de diciembre de 1702, le cortaron la cabeza, la trajeron
      hasta esta tumba y luego se entregaron; el shōgun les dejó morir con honor y se hicieron
      seppuku los cuarenta y siete, incluido un chico de quince años. Tres siglos después
      **las tumbas siguen humeando de incienso todos los días**. Es real, no es una leyenda, y es la
      continuación exacta del código que os contaron los templos de [Kamakura](#kamakura-zen).

      Tres paradas de Yamanote y se acaba en **Ebisu**, un barrio que se llama como una marca de
      cerveza que a su vez se llamaba como un dios. En el solar de la antigua fábrica está hoy
      [**Yebisu Garden Place**](#ebisu-meguro), y arriba del todo de su torre de treinta y nueve
      plantas hay **un mirador gratuito que no usa nadie**. Abajo, en el mismo complejo, el mejor
      museo de fotografía del país.
    window:
      label: Ventana óptima
      body: >-
        En noviembre **el sol se pone en Tokio a las cuatro y media**, así que la cuenta es sencilla:
        salir de Sengaku-ji sobre las cuatro deja el mirador de Ebisu justo en el crepúsculo y el
        encendido de la ciudad. Es gratis y no hay que reservar, que es lo contrario de lo que os
        pasó ayer en Shibuya Sky.
  - block: Noche
    time: "noche"
    title: La despedida de Akihabara
    body: >-
      Última noche en este barrio: mañana las maletas salen hacia Kioto y a la vuelta el hotel
      **estará en Shinjuku**, al otro lado de la ciudad. Así que toca cerrar lo que quedara pendiente
      aquí —una planta de una tienda de siete, un *taito* de máquinas recreativas, la calle de las
      piezas sueltas bajo las vías— y cenar cerca, en los callejones de
      [**Kanda**](https://www.google.com/maps/search/?api=1&query=Kanda%20Station%20Tokyo), que están
      a dos paradas y son de oficinistas y no de turistas.

      Y antes de dormir, **la maleta de mañana**: solo lo de una noche, porque el grueso viaja por su
      cuenta. Cómo funciona eso, en [takkyūbin](#takkyubin).
alt:
  label: Si te desmarcas
  body: >-
    Este día es todo tuyo si ya te sabes el centro, porque no hay nada aquí que el grupo no pueda
    hacer sin ti.

    - [**Roppongi**](#roppongi) y su triángulo de museos: el **Mori** en la planta 53, con el mirador
    desde el que sí se ve la Torre de Tokio —cosa que no pasa desde la propia torre—, el **Centro
    Nacional de Arte** de Kurokawa, que no tiene colección permanente y solo salas, y el **Suntory**
    de Kengo Kuma. A quince minutos andando, el
    [**Zōjō-ji**](https://www.google.com/maps/search/?api=1&query=Zojoji%20Temple%20Tokyo): un portal
    de madera del siglo XVII con la torre roja de 1958 asomando justo detrás, que es el mejor resumen
    visual de este país que hay.
    - **El bosque que no es un jardín**: el
    [**National Park for Nature Study**](https://www.google.com/maps/search/?api=1&query=Institute%20for%20Nature%20Study%20Tokyo)
    de Meguro son treinta hectáreas sin domesticar en mitad de la ciudad, con cupo diario de
    visitantes para que no se llene. Es lo que había aquí antes de que hubiera aquí.
    - Y para acabar sin gente,
    [**Nakameguro**](https://www.google.com/maps/search/?api=1&query=Nakameguro%20Tokyo): cafés y
    anticuarios a lo largo del río. Su fama es de primavera, con ochocientos cerezos en cuatro
    kilómetros de orilla, así que en noviembre se pasea sin esquivar a nadie.
