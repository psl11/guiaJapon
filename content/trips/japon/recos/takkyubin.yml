title: Mandar las maletas por delante
area: Un solo envío, el de la montaña
note: "takkyūbin · unos pocos miles de ¥ por bulto"
body: |-
  El servicio que hace viable este itinerario. El ***takkyūbin*** es mensajería de equipaje de hotel
  a hotel: se entrega la maleta en recepción, se rellena un formulario y **al día siguiente está en
  el destino**. Cuesta unos pocos miles de yenes por bulto y es de una fiabilidad que no existe en
  Europa.


  Aquí se usa **una sola vez**, para el único tramo donde la maleta grande no es incómoda, sino
  inviable. El resto del viaje va con vosotros en el tren (oct 2026: el grupo decidió no mandar las
  de Tokio a Kioto ni las de vuelta).


  1. **Matsumoto → Kanazawa**, el domingo 8 por la tarde, al Hotel Forza. Es el importante. El
     lunes se sube a [Kamikōchi](#kamikochi), donde no hay coches ni ascensores y las sendas se
     hacen con mochila; se duerme en Hirayu Onsen y luego en [Takayama](#takayama), y el miércoles
     se llega a [Kanazawa](#kanazawa) de noche, con la maleta ya esperando. Se decidió así en oct
     2026: pasar por Takayama costaba un segundo envío solo para cambiarse de ropa. De Kanazawa a
     Tokio la maleta va con vosotros en el Kagayaki.


  **En el Shinkansen, la medida que manda son 160 cm** sumando largo, ancho y fondo. Por debajo,
  la maleta va arriba sin más. Por encima, en el Tōkaidō y el Sanyō hay que reservar un asiento con
  espacio para equipaje grande, o se cobra un suplemento a bordo. Una maleta facturable de Air China,
  de 158 cm como mucho, queda por debajo.


  **Con quién se manda.** Las dos opciones cuestan prácticamente lo mismo, así que
  manda el tamaño de la maleta y la tienda que quede más cerca:


  - **Yamato (Kuroneko), que es la recomendada.** Es la que gestionan los hoteles, la de todas las
    guías y la que admiten 7-Eleven y FamilyMart, y deja elegir franja de entrega. Entre prefecturas
    vecinas, como de Nagano a Ishikawa, una maleta mediana —hasta 160 cm sumando largo, ancho y
    fondo, y 25 kg— ronda los **¥3.000**; una grande, ¥3.700 hasta 180 cm y ¥4.500 hasta 200. Llevándola vosotros a la tienda, ¥100 menos.

  - **Japan Post (Yu-Pack)**, en Lawson y en correos: ¥3.000 la de 160 cm y ¥3.680 la de 170, que
    es su máximo. Solo compensa si lo único que hay cerca es un Lawson, y una maleta grande no cabe.


  **Avisad al hotel de Kanazawa.** Las maletas llegan el lunes o el martes y vosotros el miércoles
  por la noche: escribid antes al Forza (076-222-7411) para que las guarden a vuestro nombre. En el
  albarán, el nombre de la reserva y la fecha de entrada, 11/11. No hace falta reservar nada con
  Yamato: se manda en el momento.
