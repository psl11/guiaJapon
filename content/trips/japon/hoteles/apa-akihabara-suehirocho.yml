body: >-
  Su ventaja no se ve en el mapa: es la línea Ginza, que desde su portal encadena sin un solo
  transbordo [Ueno](#ueno) y Asakusa el día 2, [Shibuya](#shibuya) el día 3 y [Ginza](#ginza) el
  día 4. **Tres de los cinco días resueltos** sin bajar a otro andén. Lo que se paga por ello son
  cinco minutos más de caminata cada vez que haga falta un tren JR.


  Ser el edificio más nuevo le da las dos notas más altas de la comparación: **4,6 sobre 5 en
  TripAdvisor y 9,5 en limpieza**. En una cadena de business japonesa, que es exactamente lo que
  es, la antigüedad del edificio explica casi toda la distancia entre una estancia buena y una
  mediocre.


  Un detalle del sitio: Suehirochō es de 1930 y pertenece a la línea Ginza, **el primer metro de
  Asia**, inaugurado en 1927 entre Ueno y Asakusa. Se nota al bajar, porque los andenes son más
  estrechos y más bajos que los de cualquier línea moderna.
