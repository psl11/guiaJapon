body: >-
  La idea de la cadena **Ore-no** es divertida y funciona: cocineros de nivel alto, **de pie y a
  precios de barra**, y así se compensa el metro cuadrado de Ginza. Este local se especializa en
  *oden* — el guiso de invierno de piezas cocidas en dashi que en noviembre es exactamente lo que
  apetece a las nueve de la noche.


  Encaja limpio con el **día 4**, que termina en esta zona: se cena de pie, por piezas, gastando lo
  que se quiera, en el barrio más caro de la ciudad. Tiene además algunas mesas y una carta de vinos
  sorprendentemente buena para un sitio así.
