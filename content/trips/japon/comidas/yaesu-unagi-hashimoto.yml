body: >-
  **Entró en la Guía Michelin de Tokio en la edición de 2026**, una de las dieciséis casas que
  estrenaron Bib Gourmand ese año. El cartel de madera de la puerta dice algo así como «come esto y
  no te hará falta medicina», que es lo que pensaba el fundador de la anguila, y el cocinero de hoy es
  la cuarta generación.


  La razón de tenerla en la guía es la geografía: está **a la salida Yaesu de la estación de Tokio**,
  que es por donde pasa el viaje más de una vez sin pararse. Y la anguila de Tokio no es la de Osaka:
  aquí se abre por la espalda, se cuece al vapor y luego se asa, así que queda más tierna y menos
  crujiente.


  **Dos cierres que mandan: miércoles y domingo.** Abre de 11:00 a 13:30 y de 17:00 a 20:00 (el
  sábado, solo a mediodía de 11:30 a 14:00). Ojo: no es la misma casa que el
  [Hashimoto de Edogawabashi](#unagi-hashimoto), aunque compartan nombre y oficio.
