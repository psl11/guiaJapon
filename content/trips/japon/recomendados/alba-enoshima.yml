body: >-
  El día 8 ya termina montado en el Enoden mirando el mar desde el paso a nivel de Kamakura-kōkōmae,
  con **Enoshima al fondo**. Este post propone lo evidente: seguir tres paradas más y cruzar el
  puente a la isla.


  Lo que hay allí, con los números delante. La **Sea Candle**, el faro-mirador, abre de 9:00 a 20:00
  con última entrada a las 19:30 y cuesta **¥300**; hay un pase de día de **¥1.000** que además cubre
  las escaleras mecánicas y el jardín Samuel Cocking. Las **cuevas de Iwaya**, excavadas por el mar y
  recorridas con vela, cuestan ¥500 aparte — pero en noviembre cierran sobre las cuatro, o sea antes
  del atardecer.


  **Y ahí está la decisión.** En noviembre el sol se pone a las 16:40, y ese atardecer el plan actual
  lo gasta en el paso a nivel. Ver la puesta desde sesenta metros de altura en la Sea Candle es la
  alternativa real, y es buena; lo que no cabe es hacer las dos cosas ni añadir las cuevas. De camino,
  entre Kamakura y la isla, quedan la playa de **Shichirigahama**, el santuario **Goryō** y la casa de
  té **Mushinan**, todos en paradas del mismo tren.
