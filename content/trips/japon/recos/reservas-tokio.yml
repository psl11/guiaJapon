title: Lo que hay que sacar con antelación
area: Tokio · antes de salir
status: pendiente
note: "Shibuya Sky · teamLab · el bus de Kamikōchi · el Kodama del Fuji"
body: >-
  Tokio se improvisa casi entero, pero hay cuatro cosas que no:


  [**Shibuya Sky**](https://www.google.com/maps/search/?api=1&query=Shibuya%20Sky%20Tokyo) — la azotea abierta. Se reserva online y **las franjas del atardecer se agotan con
  días de antelación**; la buena es la de las **16:00** (el sol se pone a las 16:40 en noviembre).


  [**teamLab Borderless**](https://www.google.com/maps/search/?api=1&query=teamLab%20Borderless%20Azabudai%20Hills%20Tokyo) — entrada con día y hora, y se llena. Ojo al calendario: cierra el **primer
  y tercer martes** de mes, pero **los lunes abre**, que es cuando os toca.


  **El autobús a Kamikōchi** — los directos desde Matsumoto **se llenan** y se compran online. No es
  un trámite de aeropuerto: es el acceso a un valle sin coches.


  **El Kodama a Shin-Fuji del día 23** — la excursión del [Fuji](#fuji) recoge a las 8:30 y ese lunes
  es **festivo con puente**. Reservad asiento en el de las **07:04 desde Shinagawa**, y pedid
  **ventanilla E**, que es el lado de la montaña. Cuidado al comprar: en Shin-Fuji **solo para el
  Kodama**, así que el buscador ofrecerá primero trenes que no valen.


  Y dos que se comprueban, no se reservan: la cartelera del [**Kabuki-za**](https://www.google.com/maps/search/?api=1&query=Kabukiza%20Theatre%20Ginza%20Tokyo) —las entradas de un acto
  (*hitomakumi*) se venden en taquilla el mismo día— y, si alguien quiere la **subasta de atún de
  [Toyosu](https://www.google.com/maps/search/?api=1&query=Toyosu%20Market%20Tokyo)**, el registro para la sala acristalada, que se hace con semanas de antelación y va por
  sorteo. La pasarela de arriba, en cambio, es libre y no pide nada.
