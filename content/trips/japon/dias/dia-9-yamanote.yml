eyebrow: El plan · Día 9 · sáb 14 nov
title: El adiós, y del bosque de *Meiji* al cruce de Shibuya
dek: >-
  El día se parte en dos a primera hora: uno coge el Skyliner hacia Narita y los otros tres bajan al
  santuario. Y luego, el contraste que define Tokio: un bosque de cien mil árboles plantados a mano
  en el centro de la ciudad y, a quince minutos andando, el cruce peatonal más transitado del
  planeta.
