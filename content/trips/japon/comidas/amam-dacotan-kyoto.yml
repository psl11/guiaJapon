body: >-
  La marca nació en Fukuoka en 2018 y esta es su primera tienda en Kansai. Hornea **unos ciento
  veinte panes distintos** a la vez, hay sala de café en la primera planta y una parte de la carta
  solo existe aquí, hecha con producto de Kioto. Está en Honeyachō, en plena retícula, a un paso de
  Karasuma-Oike.


  Está en la lista *Tabelog 100* de panaderías de la mitad oeste del país en 2026, y su nota en
  Tabelog es un 3,60 con más de ochocientas reseñas — que en esa escala es alto de verdad, no un
  aprobado. Es de los pocos sitios de esta lista donde el sello está comprobado y no es un adorno.


  El detalle que decide la hora: **abre a las ocho y las colas de media mañana pasan de la hora**.
  Hay tique por QR para no hacerlas de pie, y a partir de las tres de la tarde se entra sin más. En
  este viaje los cuatro días de Kioto empiezan lejos del centro —Kiyomizu al amanecer, el bambusal al
  amanecer—, así que el hueco natural no es el desayuno sino la vuelta.
