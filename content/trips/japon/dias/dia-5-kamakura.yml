slug: dia-5-kamakura
navLabel: "Día 5 · Kamakura"
trip: japon
order: 5
eyebrow: El plan · Día 5 · mar 10 nov
title: Kamakura, la capital *de los guerreros*
dek: >-
  Una hora de tren y se cambia de país. Kamakura fue la capital de Japón durante siglo y medio, la de
  los samuráis y no la de los emperadores, y hoy es un pueblo de mar con templos zen entre montañas.
  Se hace de norte a sur, cuesta abajo, y se acaba en la playa.
blocks:
  - block: Mañana
    time: "08:00–11:00"
    title: Kita-Kamakura y los templos zen
    body: >-
      Se baja en la estación **anterior** a Kamakura, Kita-Kamakura, y se hace el pueblo andando hacia
      el sur. Nada más salir está [**Engaku-ji**](#kamakura-zen), fundado en 1282 para honrar a los muertos de las dos
      invasiones mongolas —de los dos bandos, que es lo que lo hace zen— y quince minutos más allá
      **Kenchō-ji**, el templo zen más antiguo del país y el número uno de los Cinco Grandes de
      Kamakura. Ninguno de los dos es un monumento que se visita: son monasterios en activo, con
      monjes barriendo, y se recorren en silencio.
    window:
      label: Ventana óptima
      body: >-
        Al revés que en Tokio, aquí no hay que madrugar por la luz sino **por el orden**: bajando
        desde Kita-Kamakura el día va cuesta abajo, se termina en la costa con el atardecer y no hay
        que volver sobre los pasos. Al revés es el mismo recorrido y una paliza.
  - block: Mediodía
    time: "11:00–13:30"
    title: Hachimangū y la calle de las croquetas
    body: >-
      El camino desemboca en **Tsurugaoka Hachimangū**, el santuario del clan Minamoto y el centro
      político del Japón medieval: una avenida de acceso que va estrechando a propósito para engañar
      al ojo y parecer más larga, y una escalinata con la historia de un asesinato en lo alto —aquí
      mataron al tercer *shōgun* en 1219—. Bajando de vuelta, **Komachi-dōri** es la calle de comer de
      pie: croquetas, *senbei* a la brasa, helado de boniato morado. Es turística sin disimulo y está
      muy bien.
  - block: Tarde
    time: "13:30–16:00"
    title: El Gran Buda, y el templo con vistas
    body: >-
      Lo que todo el mundo viene a ver: el [**Daibutsu de Kōtoku-in**](#daibutsu-kamakura), once metros y media de bronce
      fundido en **1252**, sentado al aire libre. Y ahí está lo bueno: **no fue concebido así**. Tuvo
      su nave de madera durante dos siglos y medio, hasta que **un tsunami se la llevó en 1498** y
      nadie la reconstruyó. Lleva más de quinientos años a la intemperie y por eso funciona — un Buda
      bajo techo es una estatua; este es un paisaje. A diez minutos, **Hasedera**, con su Kannon de
      once cabezas en madera dorada y una terraza con toda la bahía de Sagami enfrente.
    window:
      label: Ventana óptima
      body: >-
        Hasedera **al final y no antes**: su mirador sobre la bahía es el sitio donde conviene estar
        cuando el sol empieza a bajar, y en noviembre eso pasa pronto. Y un apunte de temporada: el
        momiji de Kamakura, como el de Tokio, **llega a finales de mes**. En vuestras fechas los arces
        están virando, no ardiendo.
  - block: Atardecer
    time: "16:00–17:30"
    title: El tranvía a la costa
    body: >-
      Para cerrar, el **Enoden**: un tren de una sola vía y cien años que sale de Kamakura, se mete
      entre las casas —tanto que se ven los tendederos— y de pronto sale al mar. Tres paradas después,
      en **Kamakura-kōkōmae**, hay un paso a nivel frente al Pacífico que cualquier japonés reconoce al
      instante de los créditos de *Slam Dunk*. Se baja, se mira el mar con Enoshima al fondo, y se
      vuelve a Tokio con la última luz.
alt:
  label: Si te desmarcas
  body: >-
    Kamakura tiene más templos de los que caben en un día y los mejores no son los famosos.
    **Hōkoku-ji** es el «templo de bambú»: un bosquecillo de dos mil cañas con una casa de té al
    fondo donde se toma *matcha* sentado mirándolo, y está a quince minutos del centro en la
    dirección en que no va nadie. **Sugimoto-dera**, el templo más antiguo de Kamakura (734), tiene
    unas escaleras de piedra cubiertas de musgo que valen el desvío solas. Y si prefieres andar, el
    **Daibutsu Hiking Course** une Kita-Kamakura con el Gran Buda por el monte: **2,2 km de camino de
    cresta** que arrancan junto a **Jōchi-ji** y llegan al Buda **por detrás**, por dentro del bosque
    en vez de por la carretera. Hay un segundo sendero, el de **Ten'en**, aún menos transitado — en
    ese es posible pasar ratos largos solo en el bosque incluso un fin de semana soleado.
