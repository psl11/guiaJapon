body: >-
  **Bib Gourmand en la guía de Kioto y Osaka**, detrás de una puerta discreta en un edificio de
  oficinas y con el nombre sacado de su propio número de local. Por dentro es madera cálida y un techo
  de casetones que recuerda a las divisiones de la olla de [oden](#oden).


  El cocinero viene de la cocina italiana y se nota en la carta: junto al *daikon* de siempre hay
  queso *caciocavallo* cocido en el caldo. Está a cinco minutos de Pontochō, así que es **la cena
  sentada de la noche del día 12**. **No tiene horario regular** y solo hay barra: hay que reservar y
  preguntar qué noches abre.
