blocks:
  - block: Amanecer
    time: "07:00–09:20"
    title: Los mercados, y el santuario de Mitsuha
    body: >-
      Takayama tiene **dos mercados matinales** y llevan celebrándose desde el periodo Edo: el de
      Miyagawa, en la orilla del río, y el de Jinya-mae, frente a la antigua oficina de gobierno.
      Abren sobre las 6:00 o las 7:00 y recogen a mediodía. No son mercados para turistas: se venden
      encurtidos, verdura de montaña, manzanas de Hida, flores y *mitarashi dango* —bolitas de arroz
      a la brasa con salsa de soja— que se comen andando. El desayuno se hace ahí mismo.


      A las ocho, del mercado al **santuario Hie** (日枝神社), junto a las ruinas del castillo: es el
      otro modelo del santuario de Mitsuha en *Your Name*, con los *torii* rojos en la escalera
      empinada. En la ladera hay carteles de aviso por osos, así que se va ya de día y sin salir del
      camino. Del santuario a la estación hay unos veinticinco minutos, y de paso, *check-out* y las
      mochilas en la recepción del hotel. El sitio, en
      [Maps](https://www.google.com/maps/search/?api=1&query=%E9%A3%9B%E9%A8%A8%E5%B1%B1%E7%8E%8B%E5%AE%AE%E6%97%A5%E6%9E%9D%E7%A5%9E%E7%A4%BE%20%E9%AB%98%E5%B1%B1%E5%B8%82%E5%9F%8E%E5%B1%B1), y la escena, en
      [fotos](https://www.google.com/search?tbm=isch&q=%E6%97%A5%E6%9E%9D%E7%A5%9E%E7%A4%BE%20%E9%AB%98%E5%B1%B1%20%E5%90%9B%E3%81%AE%E5%90%8D%E3%81%AF).
    window:
      label: Ventana óptima
      body: >-
        **Es la única hora en que este pueblo es de los suyos**, y por eso está aquí y no ayer. A las
        diez llegan los autobuses de día desde Nagoya y [Kanazawa](#kanazawa), y hasta las cuatro de
        la tarde Sanmachi es una fila india — que es exactamente lo que visteis ayer. El contraste
        entre las siete y las once de la mañana no lo tiene ningún otro sitio del viaje, y hoy lo
        cogéis por el lado bueno.
    ver:
      - nombre: Mercado de Jinya-mae
        maps: Jinya-mae Morning Market Takayama
        nota: El segundo mercado, en la explanada frente al Takayama Jinya.
        lat: 36.1396447
        lon: 137.2582195
      - nombre: Santuario Hie
        maps: "飛騨山王宮日枝神社 高山"
        nota: "El otro modelo del santuario de Mitsuha en *Your Name*, junto a las ruinas del castillo. A veinticinco minutos de la estación."
    comer:
      - comida: miyagawa-asaichi
        elegido: true
        nota: El de la orilla del río, desde las siete. El *mitarashi dango* de aquí es salado, a la brasa.
  - block: Mañana
    time: "09:58–12:14"
    title: Hida-Furukawa, el pueblo de *Your Name*
    body: |-
      Quince minutos de tren al norte está **Hida-Furukawa**, el pueblo que
      [Japonismo](https://japonismo.com/blog/excursion-bici-hida-furukawa-takayama) recomienda como
      excursión desde Takayama y que hace poca gente: la arquitectura de Sanmachi sin los autobuses,
      con el canal Seto, sus carpas y los almacenes de paredes blancas. Y las calles de *Your Name*,
      que está en [vuestras películas](#peliculas-del-grupo).

      Las escenas no van en la guía porque tienen derechos. Para comparar cada sitio con el dibujo,
      llevad abierto en el móvil el
      [artículo de Japonismo](https://japonismo.com/blog/kimi-no-na-wa-your-name-significado-anime#peregrinacion-por-las-localizaciones-de-your-name),
      que pone las dos imágenes juntas. Cada parada lleva además su enlace a Maps y otro a las fotos
      de la escena que ha subido la gente; donde hay artículo en la Wikipedia, también una foto con
      licencia libre. En la oficina de turismo de la estación dan gratis un mapa de todos los sitios.

      Dos horas y cuarto, en este orden, primero lo que queda lejos:

      1. **9:58 · La estación y la pasarela sobre las vías.** Taki se baja aquí buscando a Mitsuha.
         Desde la pasarela que cruza las vías se ve el andén como en la película, y la parada de
         taxis de delante es donde pregunta por el camino. Si sigue dentro, buscad el cartel de cartón
         de Hidakuro, el buey que anuncia la carne de Hida: también sale en la película.
         [Maps](https://www.google.com/maps/search/?api=1&query=%E9%A3%9B%E9%A8%A8%E5%8F%A4%E5%B7%9D%E9%A7%85) · [fotos de la escena](https://www.google.com/search?tbm=isch&q=%E9%A3%9B%E9%A8%A8%E5%8F%A4%E5%B7%9D%E9%A7%85%20%E5%90%9B%E3%81%AE%E5%90%8D%E3%81%AF%20%E8%B7%A8%E7%B7%9A%E6%A9%8B) · [foto libre](https://en.wikipedia.org/wiki/Hida-Furukawa_Station)
      2. **10:10 · El santuario Keta Wakamiya**, un cuarto de hora cuesta arriba. La escalera de
         piedra, el *torii* y los faroles se reconocen desde abajo, y el camino de subida es donde Taki
         enseña el dibujo de Itomori a dos vecinas.
         [Maps](https://www.google.com/maps/search/?api=1&query=%E6%B0%97%E5%A4%9A%E8%8B%A5%E5%AE%AE%E7%A5%9E%E7%A4%BE%20%E9%A3%9B%E9%A8%A8%E5%B8%82%E5%8F%A4%E5%B7%9D%E7%94%BA) · [fotos de la escena](https://www.google.com/search?tbm=isch&q=%E6%B0%97%E5%A4%9A%E8%8B%A5%E5%AE%AE%E7%A5%9E%E7%A4%BE%20%E5%90%9B%E3%81%AE%E5%90%8D%E3%81%AF) · [foto libre](https://en.wikipedia.org/wiki/Keta_Wakamiya_Shrine)
      3. **10:55 · El *kumihimo* de Ōbora**, una tienda de tintes y kimonos a cinco minutos de la
         estación. Es el cordón trenzado de Mitsuha, y en media hora, en un telar redondo, se hace uno
         de pulsera o de llavero.
         [Maps](https://www.google.com/maps/search/?api=1&query=%E6%9F%93%E3%81%A8%E5%91%89%E6%9C%8D%20%E5%A4%A7%E6%B4%9E%20%E9%A3%9B%E9%A8%A8%E5%B8%82%E5%8F%A4%E5%B7%9D%E7%94%BA%E6%9C%AC%E7%94%BA2-15) · [fotos de la escena](https://www.google.com/search?tbm=isch&q=%E5%90%9B%E3%81%AE%E5%90%8D%E3%81%AF%20%E7%B5%84%E7%B4%90%20%E9%A3%9B%E9%A8%A8%E5%8F%A4%E5%B7%9D)
      4. **11:30 · La biblioteca de Hida**, donde buscan los registros de Itomori. Se entra libre, pero
         para hacer fotos dentro hay que pedir en el mostrador la tarjeta de permiso. Por los diez años
         de la película, según un artículo del 27 de octubre de 2026 que no hemos podido contrastar,
         han vuelto a montar el expositor del estreno, y regalan marcapáginas con los sitios de la película mientras queden: se
         reparten en la oficina de turismo del centro, la
         [Machinaka](https://www.google.com/maps/search/?api=1&query=%E9%A3%9B%E9%A8%A8%E5%8F%A4%E5%B7%9D%E3%81%BE%E3%81%A1%E3%81%AA%E3%81%8B%E8%A6%B3%E5%85%89%E6%A1%88%E5%86%85%E6%89%80) (de 9:00 a
         16:00), y quizá también aquí. Preguntad: 「君の名は。のしおりはありますか？」.
         [Maps](https://www.google.com/maps/search/?api=1&query=%E9%A3%9B%E9%A8%A8%E5%B8%82%E5%9B%B3%E6%9B%B8%E9%A4%A8) · [fotos de la escena](https://www.google.com/search?tbm=isch&q=%E9%A3%9B%E9%A8%A8%E5%B8%82%E5%9B%B3%E6%9B%B8%E9%A4%A8%20%E5%90%9B%E3%81%AE%E5%90%8D%E3%81%AF)
      5. **11:45 · El canal Seto y el *gohei mochi*.** Las carpas delante de los almacenes, la plaza
         de la Matsuri Kaikan y, pasada la plaza a la derecha, el banco de Ajidokoro Furukawa, donde
         se comen la brocheta los amigos de Taki.
         [Maps del canal](https://www.google.com/maps/search/?api=1&query=%E7%80%AC%E6%88%B8%E5%B7%9D%E3%81%A8%E7%99%BD%E5%A3%81%E5%9C%9F%E8%94%B5%E8%A1%97%20%E9%A3%9B%E9%A8%A8%E5%B8%82) · [Maps de Ajidokoro](https://www.google.com/maps/search/?api=1&query=%E5%91%B3%E5%87%A6%E5%8F%A4%E5%B7%9D%20%E9%A3%9B%E9%A8%A8%E5%B8%82%E5%8F%A4%E5%B7%9D%E7%94%BA%E5%A3%B1%E4%B9%8B%E7%94%BA11-3) ·
         [fotos de la escena](https://www.google.com/search?tbm=isch&q=%E5%91%B3%E5%87%A6%E5%8F%A4%E5%B7%9D%20%E5%90%9B%E3%81%AE%E5%90%8D%E3%81%AF%20%E4%BA%94%E5%B9%B3%E9%A4%85)
      6. **12:00 · A la estación**, a ocho minutos. El tren sale a las 12:14.

      Si a las 11:00 no ha empezado el *kumihimo*, se salta: se gana media hora. La parada de autobús donde
      descansan los tres amigos, en Ochiai, queda tres estaciones al norte, en un tramo con pocos
      trenes: no cabe.
    window:
      label: Las carpas, todavía
      body: >-
        **Las carpas siguen en el canal hasta finales de noviembre**; luego las mudan a un estanque,
        porque en invierno el canal sirve para echar la nieve. En 2024 fue el día 30.
    ver:
      - nombre: "Estación de Hida-Furukawa"
        maps: "Hida-Furukawa Station"
        nota: "Donde se baja Taki. El andén de la película se ve desde la pasarela sobre las vías."
      - nombre: "Santuario Keta Wakamiya"
        maps: "Keta Wakamiya Shrine Hida Furukawa"
        nota: "Uno de los modelos del santuario de Mitsuha, y el del festival de Furukawa. A un cuarto de hora de la estación."
      - nombre: "Ōbora, el kumihimo"
        maps: "染と呉服 大洞 飛騨市古川町本町2-15"
        nota: "El cordón de Mitsuha, trenzado por vosotros en media hora. ¥1.800–2.200; de 10:00 a 18:00, cierra los jueves."
      - nombre: "Biblioteca de Hida"
        maps: "飛騨市図書館"
        nota: "Donde buscan Itomori. Fotos con permiso del mostrador."
      - nombre: "Hida-Furukawa, el canal Seto"
        maps: "Seto River Hida Furukawa"
        nota: "Un millar de carpas entre almacenes de paredes blancas, a cinco minutos de la estación."
      - nombre: "Hida Furukawa Matsuri Kaikan"
        maps: "Hida Furukawa Matsuri Kaikan"
        nota: "Las carrozas del festival y sus autómatas, en la plaza del *gohei mochi*. ¥700; de 9:00 a 17:00."
      - nombre: "Sake Watanabe"
        maps: "渡辺酒造店 飛騨古川"
        nota: "Llegó a vender un sake con etiqueta de *kuchikamizake*, el de la película (sin saliva). Tienda de 9:00 a 16:00."
      - nombre: "Velas Mishima"
        maps: "三嶋和ろうそく店 飛騨古川"
        nota: "Velas japonesas hechas a mano desde hace más de 240 años, con el taller a la vista."
    comer:
      - comida: ajidokoro-furukawa
        elegido: true
        nota: "El *gohei mochi* de la película, en el banco de la puerta. La tienda abre a las 8:30."
  - block: Mediodía
    time: "12:30–13:20"
    title: Las mochilas, la galería y el autobús
    body: >-
      El tren deja en Takayama hacia las 12:30. Las mochilas están en el hotel, a cinco minutos, y
      algo de comer para el camino sale de un *konbini*. Si sobra un cuarto de hora, la **Hida Takumi
      & Craft Gallery**, junto a la estación, junta el lacado y la talla de Takayama con el resto de la
      artesanía del valle. Cómo distinguir lo auténtico está en [las compras](#compras).


      El autobús de las 13:20 sale del Nohi Bus Center, pegado a la estación. Son cincuenta minutos, y
      el trayecto merece la ventanilla: se cruza la divisoria por túneles y se sale al otro lado, al
      valle del río Shō.
    window:
      label: Hoy no hay maletas
      body: >-
        **Las maletas grandes ya esperan en el Hotel Forza de Kanazawa**: salieron de Matsumoto por
        [takkyūbin](#takkyubin) el domingo. Hoy se viaja con la mochila de las dos últimas noches, que
        en Shirakawa-gō, por caminos de tierra y con dos autobuses, es justo lo que hace falta.
    ver:
      - nombre: "Hida Takumi & Craft Gallery"
        maps: "飛騨・匠&クラフトギャラリー 高山市天満町5-1-25"
        nota: "Lacado, talla, cerámica y papel del valle, junto a la estación. La lleva el centro público de la industria de Hida. De 9:00 a 17:00."
      - reco: alba-takayama-hokuriku-pass
        nota: El pase regional que cubre estos autobuses, y por qué aun así no sale a cuenta.
  - block: Tarde
    time: "14:10–17:20"
    title: Ogimachi, y por qué los tejados están así
    body: >-
      Tres horas dan para hacerlo en orden, empezando por lo que cierra: la casa Wada por dentro y el
      templo de Myōzen-ji, de camino hacia el puente. Las casas cierran sobre las cinco.


      Luego se sube al **mirador de Shiroyama**, a veinte minutos a pie, para ver el valle entero con
      las granjas alineadas. El sol se pone hacia las 16:40, y se baja a la terminal con las ventanas
      ya encendidas y los autobuses de excursión idos.
    window:
      label: Lo que hay que entrar a ver
      body: >-
        La **casa Wada**, la más grande del pueblo, se visita entera y se sube al desván, que es
        donde está la historia buena: allí se criaban gusanos de seda con el calor del hogar, y
        debajo del suelo se fabricaba salitre para pólvora con la tierra del hogar y los
        excrementos de los gusanos. El valle abastecía en secreto al dominio de Kaga — al que vais
        esta tarde.


        Si sobra tiempo, otras dos se visitan por dentro: la **Kanda**, una rama de los Wada, cuyo
        desván del cuarto piso hace de mirador, y la **Nagase**, de 1890 y cinco plantas contando el
        entresuelo, con instrumental médico de la época Edo en la de abajo.
    ver:
      - ficha: shirakawa-go
        nota: Por qué los tejados van a 45 grados, sin un clavo, y cómo los rehace el pueblo entero.
      - nombre: Mirador de Shiroyama
        maps: Ogimachi Castle Site Observatory Shirakawa-go
        nota: El valle entero con las granjas alineadas. Es *la* foto.
        lat: 36.2629545
        lon: 136.9079634
      - nombre: Casa Wada
        maps: Wada House Shirakawa-go
        nota: La más grande del pueblo, hecha con el dinero del salitre. Se sube al desván.
      - nombre: Casa Kanda
        maps: Kanda House Shirakawa-go
        nota: La rama de los Wada. El desván del cuarto piso es un mirador sobre los tejados.
      - nombre: Casa Nagase
        maps: Nagase House Shirakawa-go
        nota: De 1890, cinco plantas con el entresuelo, y el instrumental de un médico de Edo.
        lat: 36.259924
        lon: 136.9076278
      - nombre: "Myōzen-ji"
        maps: Myozenji Temple Shirakawa-go
        nota: Un templo con el campanario también techado de paja, caso raro.
        lat: 36.2559101
        lon: 136.9065906
  - block: Atardecer
    time: "17:20–19:45"
    title: Bajar a Kanazawa, por Shin-Takaoka
    body: >-
      Hora y media de autobús hasta Shin-Takaoka y un cuarto de hora de Shinkansen hasta
      **Kanazawa**. El cambio de mundo es brusco: de un valle de cien casas a una ciudad de medio
      millón, con mar al lado y marisco serio. Se llega de noche, y antes de ir al hotel merece la
      pena salir por la **salida este** (東口, también rotulada Kenroku-en-guchi, 兼六園口), la del
      Tsuzumi-mon, que iluminado luce más que de día. La oeste, la del puerto, es la otra.
    ver:
      - nombre: Tsuzumi-mon
        maps: Tsuzumi-mon Gate Kanazawa Station
        nota: "La puerta de madera de 2005 bajo la cúpula de cristal: trece metros con forma de tambor de nō."
        lat: 36.5777907
        lon: 136.6491024
      - ficha: kanazawa
        nota: El dominio de Kaga, un millón de *koku* y ninguna guerra. Mañana se anda entera.
  - block: Noche
    time: "20:00"
    title: Marisco del mar del Japón
    body: >-
      Kanazawa está en la otra costa y su cocina lo nota. La temporada del **cangrejo de las nieves**
      abre justo el 6 de noviembre, así que está en su primera semana buena; y hay gamba dulce,
      vieira y *nodoguro*, la perca de garganta negra.


      A esta hora los puestos de Ōmichō ya han cerrado, y se ven mañana por la mañana. Dentro del
      mismo edificio, enfrente del hotel, la barra de sushi de Rekireki abre hasta las diez.


      Si al salir apetece andar, el **santuario Oyama** está a diez minutos: su puerta de 1875 lleva
      arriba vidrieras de colores y se ilumina al anochecer. Las luces se apagan hacia las nueve o las
      diez, así que conviene ir directos desde la cena. Ida y vuelta es media hora, y si no, al hotel,
      que está enfrente.
    ver:
      - nombre: Santuario Oyama
        maps: Oyama Shrine Kanazawa
        nota: La puerta de 1875, mitad japonesa y mitad holandesa, con las vidrieras iluminadas de noche.
    comer:
      - comida: "sushi-rekireki-omicho"
        elegido: true
        nota: "Reservada a las 20:00 para cuatro, solo mesa: el menú se elige allí. Pedid el rollo de *nodoguro*."
alt:
  label: Si te desmarcas
  body: >-
    En Shirakawa-gō, **cruzar el puente colgante y quedarse en la orilla de enfrente**: casi todo el
    mundo se queda en la calle principal y a doscientos metros ya no hay nadie. Al otro lado está
    el [Gasshō-zukuri Minka-en](https://www.google.com/maps/search/?api=1&query=Gassho-zukuri%20Minkaen%20Shirakawa-go),
    el museo al aire libre que cita Japonismo: veinticinco construcciones traídas de pueblos del
    valle que se quedaron vacíos, nueve de ellas protegidas por la prefectura. Unos ¥600. Y si el grupo va con
    prisa, Suganuma, un segundo pueblo *gasshō* diez kilómetros al norte con nueve casas y ningún
    autobús turístico, es lo que Shirakawa-gō era hace treinta años.


    En Takayama, lo que se cayó al meter Furukawa por la mañana. El
    [**Higashiyama Walking Course**](https://www.google.com/maps/search/?api=1&query=Higashiyama%20Walking%20Course%20Takayama):
    hora y media por una docena de templos de la ladera este hasta las ruinas del castillo, que
    termina junto al Hie. Y los dos talleres de Sanmachi que venden lo que hacen:
    [Tozawa](https://www.google.com/maps/search/?api=1&query=%E6%88%B8%E6%B2%A2%E6%BC%86%E5%99%A8%20%E9%AB%98%E5%B1%B1%E5%B8%82%E4%B8%8A%E4%B8%80%E4%B9%8B%E7%94%BA6),
    el del lacado, desde las 8:30, y
    [Tsuda](https://www.google.com/maps/search/?api=1&query=%E6%B4%A5%E7%94%B0%E5%BD%AB%E5%88%BB%20%E9%AB%98%E5%B1%B1%E5%B8%82%E6%9C%AC%E7%94%BA1-10),
    el de la talla, desde las 9:00. Quien no vaya a Furukawa los tiene enteros.
