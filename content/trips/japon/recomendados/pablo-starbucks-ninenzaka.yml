body: >-
  Abrió en 2017 en una casa de madera de dos plantas de hace más de cien años, en plena cuesta de
  Ninenzaka. Por fuera no hay letrero luminoso: el logo va en una cortina *noren*, como en cualquier
  tienda vieja de la calle.


  Lo que lo hace distinto está **en la planta de arriba**. Hay tres salas de tatami con cojines en
  el suelo y un pergamino en cada una, y en ellas el café se toma sentado y descalzo, como en
  cualquier casa japonesa. Pablo subió en noviembre de 2023 y es lo que recomienda: pedir abajo y
  subir. Si las rodillas protestan, en la misma planta hay algún sofá.
