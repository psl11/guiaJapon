body: >-
  **Bib Gourmand en todas las guías de Tokio desde 2019 hasta la de 2026.** Es la escuela vieja del
  tonkatsu: una barra, el cocinero de frente, cerdo de marca y aceite a temperatura más baja de lo
  normal, así que el rebozado queda pálido y la carne jugosa.


  Encaja **la noche del día 19**, la de vuelta de Nikkō: el Spacia deja en Asakusa y Sugita está una
  parada al sur por la Toei Asakusa, o a un cuarto de hora andando. **Cierra los jueves**, abre de
  11:30 a 14:00 y de 17:00 a 20:30, y **la última comanda es a las 20:15** — si el último Spacia se
  retrasa, no llega.
