title: Kamikōchi, el valle sin coches
image:
  src: img/fichas/kamikochi.webp
  alt: "El puente Kappa-bashi sobre el río Azusa en Kamikōchi, con los alerces dorados de octubre y la cordillera Hotaka nevada al fondo."
  credit: "El Kappa-bashi en octubre · lumoplank · CC0"
