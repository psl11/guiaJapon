trip: japon
order: 2
eyebrow: El plan · Día 2 · sáb 7 nov
title: El Tokio *de abajo*, con el jet lag a favor
dek: >-
  La primera mañana es la mejor del viaje y casi nadie la aprovecha. Vais a estar despiertos a las
  cinco sin quererlo: en vez de pelearse con eso, se usa. Sensō-ji vacío al amanecer, el barrio de
  los oficios cuando abre la persiana, y una tarde en el Tokio que sobrevivió a las bombas.
duerme:
  - resol-akihabara
