    comer:
      - comida: sen-ikebukuro
        elegido: true
        nota: "*Tsukemen* de caldo concentrado en una barra con jazz, en el barrio que es su cuna."
      - comida: "nakiryu"
        nota: "El *tantanmen* que fue estrella Michelin, a una parada en Ōtsuka. El domingo, hasta las 15:00."
  - block: Tarde
    time: "15:00–19:00"
    title: El momiji, que ahora sí
    body: >-
      Y aquí está el regalo de haber vuelto. **El pico de la hoja roja en Tokio va del 20 de noviembre
      al 5 de diciembre**, así que estos días caen justo dentro. Los dos jardines de la lista nacional
      quedan de camino a casa, y este año se ven con dos luces distintas. Primero el Rikugi-en, a tres
      paradas de Yamanote, con la última luz del día: su iluminación no empieza hasta el miércoles 25.
      Luego, el Koishikawa Kōrakuen, que abre de noche del 13 al 24 de noviembre, de 18:00 a 21:00,
      con proyecciones en el muro y en el puente de luna llena.


      Entre uno y otro queda la hora del anochecer, y es para **Kagurazaka**, que empieza a cinco
      minutos del Kōrakuen, al otro lado de Iidabashi; del Rikugi-en se llega en diez minutos de la
      línea Namboku. Es la cuesta del antiguo barrio de geishas, y otra de las propuestas de
      [Japonismo](https://japonismo.com/blog/templo-zenkokuji-kagurazaka) para un Tokio menos obvio. A
      media subida está el templo de Bishamonten, guardado por tigres de piedra en lugar de perros.
      Enfrente se abre el callejón empedrado de Hyōgo Yokochō, entre las tapias negras de los
      *ryōtei*. Y arriba, el santuario Akagi, que Kengo Kuma rehízo en cristal y madera en 2010.


      Si solo cabe uno de los dos jardines, la tercera carta está a doce minutos al norte de Komagome:
      **Kyū-Furukawa**, un jardín japonés de arces a los pies de una mansión de piedra con rosaleda,
      que en noviembre todavía tiene rosas. Cierra a las 17:00 y cuesta ¥150.
    ver:
      - ficha: momiji
        nota: El calendario de la hoja roja, y por qué la ciudad se guardó para el final.
      - nombre: Rikugi-en
