body: |
  El día del oeste empieza en el bambusal a las siete porque es cuando se camina solo. Pablo
  recomienda lo contrario: llegar cuando el sol se está poniendo, que es cuando se han ido los grupos
  y queda poca gente, y salir ya de noche por la estación.

  El cambio es darle la vuelta al día entero:

  - **Por la mañana, el noroeste:** el pabellón dorado a las nueve, con la luz de la mañana, que es la
    buena; luego el Ryōan-ji y el Ninna-ji.
  - **A mediodía, el Randen** desde Omuro-Ninnaji hasta Arashiyama, con transbordo en
    Katabiranotsuji: un tranvía pequeño y unos veinticinco minutos.
  - **Por la tarde**, Tenryū-ji y Ōkōchi Sansō, que cierran a las cinco, y el bambusal a la puesta
    de sol.
  - **Al anochecer, el bosque de los kimonos**: unos seiscientos postes de acrílico con tela de
    *kyō-yūzen* dentro, en el andén y los caminos de la estación del Randen. Los diseñó Yasumichi
    Morita en 2013, se iluminan al caer el sol y no se pagan.

  El castillo de Nijō sigue cabiendo: la JR Sagano lo deja a diez minutos desde Saga-Arashiyama.
