title: Una tumba que nadie mueve, y *una tarde a cubierto*
dek: >-
  Primer día de los tres solos, y con lluvia casi todo el día. Se empieza por la cabeza de Masakado
  entre las torres de los bancos, se pasa por el Harry Potter de Akasaka y por la estación de Tokio,
  y la tarde es de compras en Akihabara, con el santuario del barrio para cerrar.
