quePedir: "Los *butaman* del **551 Hōrai** —bollo al vapor relleno de cerdo— y la tarta de queso de **Rikuro**, recién salida."
body: >-
  Lo que un osaqueño se lleva cuando vuelve a casa. **551 Hōrai** abrió en 1945 y sus *butaman* son
  una institución hasta el punto de que las cajas rojas al vapor se reconocen en el tren: doscientos
  yenes la pieza, cuatrocientos sesenta el par. La casa madre está en Ebisubashi-suji, en pleno
  Namba, o sea entre [Kuromon](#kuromon) y Dōtonbori.


  **Rikuro Ojisan** hace la tarta de queso que tiembla, recién horneada y entera por unos mil yenes.
  Aquí conviene contar la otra cara: uno de los posts de Alba sostiene que **está sobrevalorada** y
  que hay mejores en la ciudad. Las dos cosas son verdad a la vez — es un clásico y es una cola larga.


  Completan la ronda los *takoyaki* de **Juhachiban** y el helado de leche de Hokkaidō de **Milky
  Paradise**. Todo esto cae dentro del bloque de mediodía del día 14 sin desviarse: son las mismas
  cuatro manzanas.
