body: >-
  Si este viaje va a tener **una** cena cara, es esta. Ocupa una **antigua fábrica de sake trasladada
  desde el norte de Japón** y reconstruida pieza a pieza, con un jardín tradicional alrededor y la
  Torre de Tokio asomando por encima de los tejados — la combinación es rara y funciona: es
  probablemente el restaurante más bonito de la ciudad.


  La cocina es ***kaiseki*** en torno al tofu, estacional y sin estridencias, servida en salas
  privadas de tatami. Y aquí va el consejo que ahorra dinero: **el menú de mediodía cuesta bastante
  menos** que el de cena y con luz de día el jardín se ve, que es medio motivo de venir.


  Hay que reservar con semanas de antelación, y para cuatro personas conviene hacerlo ya.
