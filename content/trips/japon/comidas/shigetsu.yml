body: >-
  La ***shōjin ryōri*** es la cocina de los monasterios zen y es **la gran tradición vegetariana de Japón**: se construye sobre caldo de kombu y de shiitake en lugar de bonito, y excluye también el ajo y la cebolla, que el budismo consideraba excitantes. No es una adaptación moderna para turistas — lleva ochocientos años funcionando así.


  Shigetsu está **dentro del Tenryū-ji**, el templo del que sale el bosque de bambú, con un jardín de Musō Soseki del siglo XIV al otro lado del papel. Para la persona vegetariana del grupo, esta es probablemente **la mejor comida del viaje entero**, y para el resto no es un sacrificio: es una de las cocinas más refinadas del país.
