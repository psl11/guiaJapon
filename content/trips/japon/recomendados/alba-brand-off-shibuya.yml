body: >-
  Japón es buen sitio para comprar lujo usado por una razón de costumbre: las cosas se cuidan, y
  muchos bolsos de segunda mano llegan con aspecto de recién estrenados. BRAND OFF es una cadena de
  compraventa de marcas, y la tienda de Shibuya, abierta en mayo de 2026, es la grande: **cuatro
  plantas** en la Center Gai, con modelos de hace décadas junto a los actuales. El consejo del vídeo
  es el bueno: mirar y comparar antes de comprar, porque no todas las tiendas del ramo tratan igual
  al cliente.


  Cae en el día 8 porque es el único que pasa por Shibuya, y además por la tarde, en el último día
  de los cuatro. Abre hasta las nueve, así que cabe después de Shibuya Sky y antes de subir a
  Shinjuku a cenar.
