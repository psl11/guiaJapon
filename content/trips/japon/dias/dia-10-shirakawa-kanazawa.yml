slug: dia-10-shirakawa-kanazawa
navLabel: "Día 10 · Shirakawa-gō"
trip: japon
order: 10
eyebrow: El plan · Día 10 · dom 15 nov
title: El valle de los tejados, y *bajar al mar del Japón*
dek: >-
  Día de autobús con una parada larga en medio: un valle aislado donde las casas se construyeron
  para dos metros de nieve y para fabricar pólvora en secreto. Se termina en Kanazawa, que es otra
  cosa completamente distinta.
blocks:
  - block: Mañana
    time: "08:30–09:30"
    title: El autobús a Shirakawa-gō
    body: >-
      Cincuenta minutos desde la estación de autobuses de [Takayama](#takayama), y **hay que reservarlo**: es una
      línea con plazas limitadas que en temporada se llena. No lo cubre el JR Pass. El trayecto ya
      merece la ventanilla — se cruza la divisoria por túneles y se sale al otro lado, al valle del
      río Shō.
    window:
      label: Mandad las maletas
      body: >-
        **Hoy es el segundo envío por [takkyūbin](#takkyubin).** Las maletas grandes salen esta mañana
        del hotel de Takayama hacia el de [Kioto](#kioto) y llegan pasado mañana; se viaja con lo justo. En
        Shirakawa-gō se anda por caminos de tierra y en Kanazawa se llega de noche: cargar con
        equipaje aquí no tiene ningún sentido.
  - block: Mediodía
    time: "09:30–13:30"
    title: Ogimachi, y por qué los tejados están así
    body: >-
      Cuatro horas dan para hacerlo bien. Se sube primero al **mirador de Shiroyama** —veinte minutos
      a pie o un microbús— para ver el valle entero con las granjas alineadas, y luego se baja a
      andarlo. Las casas se llaman *gasshō-zukuri*, «como manos que rezan», y cada decisión
      responde a la nieve: los tejados a 45-60 grados para que resbale, todas orientadas norte-sur
      para que el viento las golpee de canto, y la estructura atada con cuerda de paja, sin un solo
      clavo, porque un armazón atado cede y vuelve. Ver [Shirakawa-gō](#shirakawa-go).
    window:
      label: Lo que hay que entrar a ver
      body: >-
        La **casa Wada**, la más grande del pueblo, se visita entera y se sube al desván, que es
        donde está la historia buena: allí se criaban gusanos de seda con el calor del hogar, y
        debajo del suelo se fabricaba salitre para pólvora con la tierra del hogar y los
        excrementos de los gusanos. El valle abastecía en secreto al dominio de Kaga — al que vais
        esta tarde.
  - block: Tarde
    time: "13:30–17:00"
    title: Bajar a Kanazawa
    body: >-
      Hora y cuarto de autobús hasta **Kanazawa**, y el cambio de mundo es brusco: de un valle de
      cien casas a una ciudad de medio millón, con mar al lado y marisco serio. Se llega con luz
      justa. Si el hotel está cerca de la estación, merece la pena salir a ver el [**Tsuzumi-mon**](https://www.google.com/maps/search/?api=1&query=Tsuzumi-mon%20Gate%20Kanazawa%20Station), la
      puerta de madera de trece metros con forma de tambor de teatro nō bajo la cúpula de cristal —
      es de 2005 y sale en todas las listas de estaciones más bonitas del mundo. Ver
      [Kanazawa](#kanazawa).
    window:
      label: Una carta de hoy, que es domingo 15
      body: >-
        **Hoy se celebra el *shichi-go-san***, el rito en que los niños de siete, cinco y tres años
        van al santuario vestidos de gala. Cae exactamente en esta fecha y en domingo, así que los
        santuarios de Kanazawa —**Oyama-jinja** está a diez minutos del centro— van a estar llenos de
        críos con kimono y padres con cámara. No se reserva: solo hay que pasarse.
  - block: Noche
    time: "noche"
    title: Marisco del mar del Japón
    body: >-
      Kanazawa está en la otra costa y su cocina lo nota. La temporada del **cangrejo de las nieves**
      abre justo el 6 de noviembre, así que está en su primera semana buena; y hay gamba dulce,
      vieira y *kaisendon*, cuencos de arroz cubiertos de sashimi. En el mercado de [**Ōmichō**](https://www.google.com/maps/search/?api=1&query=Omicho%20Market%20Kanazawa)
      —doscientos ochenta años, doscientos puestos— se come de pie en los puestos del fondo y sale por
      una fracción de lo que costaría en Tokio.
alt:
  label: Si te desmarcas
  body: >-
    En Shirakawa-gō, **cruzar el puente colgante y quedarse en la orilla de enfrente**: casi todo el
    mundo se queda en la calle principal y a doscientos metros ya no hay nadie. Y si el grupo va con
    prisa, Suganuma, un segundo pueblo *gasshō* diez kilómetros al norte con nueve casas y ningún
    autobús turístico, es lo que Shirakawa-gō era hace treinta años.
