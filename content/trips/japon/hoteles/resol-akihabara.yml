body: >-
  Cubre las dos primeras noches, que son las que peor se llevan, y lo que compra es la estación.
  Akihabara junta **Yamanote, Chūō-Sōbu, Hibiya y Tsukuba Express** en el mismo edificio a tres
  minutos de la puerta: el día 2 se sale hacia [Ueno](#ueno) y Asakusa por la Hibiya sin cambiar de
  andén, que es exactamente el plan de la primera mañana con ocho husos encima.


  Y tiene una carta que se usa el día 3. Por Iwamotochō, a dos minutos, pasa la Toei Shinjuku:
  **línea directa hasta [Shinjuku](#shinjuku) sin transbordo**, que es de donde sale el Azusa hacia
  la montaña, con las maletas grandes ya camino de Takayama.


  Con 1.428 reseñas es el de muestra más grande de los alojamientos de la guía, y no es una cadena
  de negocios: se nota en el acabado y en la cama. Lo que se le critica de forma consistente es
  **el tamaño de las habitaciones**, que en Tokio es el estándar y no una sorpresa.
