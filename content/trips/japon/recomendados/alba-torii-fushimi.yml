body: >-
  Bajando del [Fushimi Inari](#fushimi-inari), entre los miles de toriis naranjas, hay un señor mayor
  que talla y escribe a mano **toriis pequeños de madera con tu nombre y la fecha**. Lleva décadas
  haciéndolo y es de esas cosas que no salen en ninguna lista porque no tienen dirección: está donde
  está.


  Lo pongo con la advertencia por delante: **no he encontrado el puesto en ninguna fuente ni sé lo que
  cuesta**. Va aquí porque el día 14 empieza precisamente ahí —de 06:45 a 08:45, con la montaña
  vacía— y porque si existe, el momento de verlo es a la bajada, sin prisa y con la luz ya entrada.


  Del mismo post sale un apunte más útil y comprobable: quien suba a las 7:30 en vez de a las 9
  esquiva a los grupos y **puede hacer la ruta alta hasta la cima real del monte Inari**, pasando por
  las cascadas y el mirador de Yotsutsuji. Los últimos diez minutos tienen desnivel y el suelo sin
  asfaltar.
