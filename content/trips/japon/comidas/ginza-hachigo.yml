quePedir: "*Chūka soba*. Solo hacen uno; lo que se elige es si lleva **huevo curado** o todos los aderezos."
body: >-
  Lo lleva Yasushi Matsumura, que dejó una carrera en alta cocina japonesa para hacer ramen, y esta
  es su tercera casa. Hace **un solo plato** —*chūka soba*, el ramen clásico de soja— y **setenta
  cuencos al día** en una barra de seis asientos. Cuesta alrededor de mil quinientos yenes: diez
  euros por algo que se cocina con criterio de restaurante de estrella.


  Y ahí está la corrección que hay que hacerle a la lista de la que sale. **Tuvo una estrella
  Michelin en la guía de 2023, y la perdió en la de 2024** — igual que los otros dos ramen
  estrellados de Tokio, que se quedaron sin ella el mismo año. Sigue siendo el mismo cuenco y el
  mismo cocinero; lo que ya no es cierto es llamarlo «ramen con estrella».


  Desde finales de 2023 **se reserva por internet** en TableCheck, con quinientos yenes de gestión por
  persona. Eso ha eliminado la cola, que era el motivo por el que casi nadie entraba.
