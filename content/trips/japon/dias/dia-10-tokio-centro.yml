blocks:
  - block: Mañana
    time: "09:30–10:30"
    title: La cabeza de Masakado, entre los bancos
    body: >-
      Se sale del metro entre torres de oficinas, a la tumba de Masakado: treinta metros cuadrados sin
      edificar en el suelo más caro del mundo, con incienso fresco de esta misma mañana. Se ve en cinco
      minutos. Lo que impresiona es saber que **una ciudad de catorce millones lleva un siglo sin
      atreverse a tocarlo**, y para eso hay que llevar la ficha leída.


      Después, media hora por Ōtemachi y Marunouchi, el distrito de los bancos levantado dentro de los
      fosos del castillo que ya no está.
    window:
      label: Con lluvia
      body: >-
        Ōtemachi, Marunouchi y la estación de Tokio están **unidos por pasillos subterráneos**: de la
        tumba a la estación se puede ir sin abrir el paraguas. El jardín este del Palacio, que era el
        plan de esta mañana, sale del día por la lluvia; está contado en la alternativa.
    ver:
      - ficha: masakado
        nota: La cabeza que voló desde Kioto, el rayo y la excavadora volcada.
      - ficha: marunouchi
        nota: El mayor castillo del mundo, del que quedan el suelo y las piedras.
      - nombre: "Sede del Yomiuri Shimbun"
        maps: "Yomiuri Shimbun Building Otemachi"
        nota: "El periódico de verdad detrás del de *Tokyo Vice*, a un paseo de la tumba de Masakado."
        lat: 35.6871605
        lon: 139.7641658
  - block: Mañana
    time: "10:45–11:30"
    title: Akasaka, la salida del teatro
    body: >-
      Diez minutos de Chiyoda y se sale por la **3b de Akasaka**, la del teatro donde se representa
      *Harry Potter y el legado maldito*. Al lado, en la planta baja del Akasaka Biz Tower, está la
      Harry Potter Shop Akasaka, que abre a las 11:00.


      Se viene a mirar y, si apetece, a comprar. La otra tienda de Harry Potter del día está en la
      estación de Tokio, una hora después.
    ver:
      - nombre: Harry Potter Shop Akasaka
        maps: Harry Potter Shop Akasaka Biz Tower
        nota: "Planta baja del Akasaka Biz Tower, salida 3b. De 11:00 a 21:00."
        lat: 35.672558
        lon: 139.735168
  - block: Mediodía
    time: "11:45–13:00"
    title: La estación de Tokio, por arriba y por abajo
    body: >-
      Por arriba, el edificio de ladrillo rojo de 1914, con las cúpulas recuperadas en 2012: asomaos
      al vestíbulo norte a mirar los relieves del zodiaco del techo. Enfrente, en la planta baja del
      Marunouchi Building, está el **árbol de Hogwarts** de la Navidad de Marunouchi, con espectáculo de
      luz de 17:00 a 21:00; a mediodía se ve apagado.


      Por abajo, en el lado de Yaesu, el sótano de **Tokyo Station Ichibangai**:

      - **Tokyo Character Street**, un pasillo entero de tiendas de anime y personajes. Desde febrero
      de 2026 tiene la tienda fija de **Harry Potter Mahou Dokoro**, de 10:00 a 20:30.

      - **La Ramen Street**, ocho casas de [ramen](#ramen), una de cada región, por si llueve demasiado
      para comer de pie.
    ver:
      - nombre: Estación de Tokio
        maps: Tokyo Station Marunouchi Building
        nota: Ladrillo rojo de 1914, con las cúpulas recuperadas en 2012. Mirad el techo del vestíbulo norte.
        lat: 35.6811505
        lon: 139.7659765
      - nombre: Árbol de Hogwarts
        maps: Marunouchi Building Marucube Tokyo
        nota: "En la planta baja del Marunouchi Building, del 12 de noviembre al 25 de diciembre. La luz, de 17:00 a 21:00."
      - nombre: Tokyo Character Street
        maps: Tokyo Character Street
        nota: "Sótano de Ichibangai, lado de Yaesu. Con la Harry Potter Mahou Dokoro fija desde febrero de 2026."
      - nombre: "Monumento a Jan Joosten"
        maps: "Jan Joosten Monument Yaesu Tokyo"
        nota: "El holandés que dio nombre a Yaesu, compañero de barco de Adams, en la avenida Yaesu."
        lat: 35.6793984
        lon: 139.7714212
  - block: Comida
    time: "13:00–14:30"
    title: Nihonbashi, onigiri y Pokémon en el mismo edificio
    body: >-
      Diez minutos andando por Yaesu hasta el **Takashimaya de Nihonbashi**. En el sótano se compran
      los onigiri de Konga, que son para llevar, y unas plantas más arriba está el Pokémon Center
      Tokyo DX, el grande de Tokio, pared con pared con el Pokémon Café.
    ver:
      - nombre: Pokémon Center Tokyo DX
        maps: Pokemon Center Tokyo DX Nihonbashi Takashimaya
        nota: En el Takashimaya de Nihonbashi. El Pokémon Café de al lado solo admite reserva.
      - nombre: "Lápida de William Adams"
        maps: "William Adams Residence Site Nihonbashi Muromachi"
        nota: "Donde vivió el inglés del que sale el Blackthorne de *Shōgun*. Una piedra entre dos edificios, en la Anjin-dōri."
        lat: 35.6852915
        lon: 139.7757308
    comer:
      - comida: onigiri-konga-nihonbashi
        elegido: true
        nota: Onigiri para llevar, recomendación de Alba. Sin mesas; con lluvia, comed en la estación.
  - block: Tarde
    time: "15:00–18:00"
    title: Akihabara, de compras
    body: >-
      Tres paradas de la línea Ginza hasta Suehirochō y se sale por el extremo norte de
      [Akihabara](#akihabara). De norte a sur:

      - **Don Quijote**, para el *skincare* y la cosmética, a precio de bazar.

      - **Hareruya 2 Akihabara Tower**, un edificio entero de cartas Pokémon, reabierto en
      febrero de 2026. Para One Piece, Yuyu-Tei y Kaisoku-oh, en el Radio Kaikan.

      - **Iosys y Sofmap**, las dos cadenas de Apple de segunda mano, con el estado de cada aparato en
      la etiqueta.

      - **Yodobashi Akiba**, al final, junto a la estación: Seiko y Casio nuevos y Apple, abierta hasta
      las 22:00.
    window:
      label: Antes de comprar un Apple aquí
      body: >-
        - **Los iPhone japoneses suenan al hacer una foto**, y no se puede quitar.

        - **Los Mac llevan teclado japonés (JIS)**, con teclas cambiadas de sitio. Preguntad por uno con
        teclado US.

        - **Que sea libre (SIM-free)** y no esté atado a una operadora.

        - El *tax-free* se hace con el pasaporte en la caja.
    ver:
      - ficha: akihabara
        nota: El barrio de la electrónica y del manga, y lo que merece la pena de él.
      - nombre: Don Quijote Akihabara
        maps: Don Quijote Akihabara
        nota: Cosmética y *skincare* en varias plantas.
        lat: 35.700665
        lon: 139.771698
      - nombre: Hareruya 2 Akihabara Tower
        maps: Hareruya2 Akihabara Tower
        nota: Cartas Pokémon en un edificio entero, con zona de juego de más de ciento cincuenta plazas.
      - nombre: Iosys Akihabara
        maps: Iosys Akihabara
        nota: iPhone, iPad y Mac usados, con el estado en la etiqueta.
      - nombre: Sofmap Akihabara
        maps: Sofmap Akihabara
        nota: La otra cadena de Mac y PC de segunda mano.
      - nombre: Yodobashi Akiba
        maps: Yodobashi Akiba
        nota: Relojes, Apple y electrónica, junto a la estación. Hasta las 22:00.
        lat: 35.698639
        lon: 139.774612
  - block: Tarde
    time: "18:00–18:30"
    title: El santuario del barrio, al anochecer
    body: >-
      Siete minutos cuesta arriba desde las tiendas. El Kanda Myōjin guarda este trozo de ciudad desde
      hace mil años, las empresas de Akihabara le llevan los ordenadores a bendecir, y dentro está
      consagrado **Taira no Masakado**: el día empieza en su tumba y acaba en su santuario.
    window:
      label: El shichi-go-san, a esta hora
      body: >-
        **Hoy, 15 de noviembre, es el *shichi-go-san***, y los niños de tres, cinco y siete años van al
        santuario vestidos de gala. Van sobre todo por la mañana: a esta hora quedará alguna familia
        rezagada, o ninguna. El recinto está abierto y no se paga.
    ver:
      - nombre: Kanda Myōjin
        maps: Kanda Myojin Shrine Tokyo
        nota: Amuletos para el disco duro, y no es broma para turistas. Consagrado a Masakado.
        lat: 35.7019403
        lon: 139.7677388
  - block: Noche
    time: "noche"
    title: La última noche de esta mitad
    body: >-
      De Akihabara, la Hibiya va **directa a Roppongi** en unos veinte minutos. Y es la última noche
      aquí: mañana se baja a Kioto y a la vuelta el hotel estará en otro barrio, más al este, en Ginza.


      Para cenar, lo que el barrio tiene y no se ve desde la avenida: **Azabu-Jūban**, una parada de
      Ōedo o un cuarto de hora cuesta abajo, calle comercial de toda la vida con confiterías viejas y
      barras pequeñas en mitad del distrito más caro de la ciudad.


      Y antes de dormir, **la maleta cerrada**: mañana viaja con vosotros en el Nozomi de las 9:09.
    ver:
      - nombre: Azabu-Jūban
        maps: Azabu Juban Tokyo
        nota: Calle comercial de toda la vida, con confiterías viejas, a un paseo del hotel.
        lat: 35.6567021
        lon: 139.7361025
      - nombre: "Santuario Hikawa de Azabu"
        maps: "Azabu Hikawa Shrine Tokyo"
        nota: "El santuario de Rei: Azabu-Jūban es el barrio de *Sailor Moon*."
        lat: 35.6528917
        lon: 139.7310419
    comer:
      - comida: azabu-kuroshari
        elegido: true
        nota: Omakase de arroz teñido de negro con carbón, en Azabu-Jūban. Turnos de 18:00 y 20:00.
      - comida: sushiya-ebisu-azabu
        nota: Seis barras de sushi del barrio, como pista sin comprobar. Siempre con reserva.
alt:
  label: Si te desmarcas
  body: >-
    **El plan que había para un domingo seco**, y que la lluvia se llevó: el jardín este del Palacio
    (el Higashi Gyoen), gratis y con el basamento vacío de la torre del homenaje, que solo abre este
    día de la semana de Tokio porque cierra lunes y viernes; el **Sengaku-ji**, con las tumbas de los
    cuarenta y siete rōnin, que cuenta la ficha de [Ebisu y Meguro](#ebisu-meguro); y el atardecer en
    el mirador gratuito de Yebisu Garden Place, o en el de [Roppongi Hills](#pablo-tokyo-city-view)
    si el cielo sale limpio.


    Y si el día es tuyo:

    - [**Roppongi**](#roppongi) y su triángulo de museos: el **Mori** en la planta 53, con el mirador
    desde el que sí se ve la Torre de Tokio —cosa que no pasa desde la propia torre—, el **Centro
    Nacional de Arte** de Kurokawa, que no tiene colección permanente y solo salas, y el **Suntory**
    de Kengo Kuma. A quince minutos andando, el
    [**Zōjō-ji**](https://www.google.com/maps/search/?api=1&query=Zojoji%20Temple%20Tokyo): un portal
    de madera del siglo XVII con la torre roja de 1958 asomando justo detrás, que es el mejor resumen
    visual de este país que hay.

    - **El bosque que no es un jardín**: el
    [**National Park for Nature Study**](https://www.google.com/maps/search/?api=1&query=Institute%20for%20Nature%20Study%20Tokyo)
    de Meguro son treinta hectáreas sin domesticar en mitad de la ciudad, con cupo diario de
    visitantes para que no se llene. Es lo que había aquí antes de que hubiera aquí.

    - Y para acabar sin gente,
    [**Nakameguro**](https://www.google.com/maps/search/?api=1&query=Nakameguro%20Tokyo): cafés y
    anticuarios a lo largo del río. Su fama es de primavera, con ochocientos cerezos en cuatro
    kilómetros de orilla, así que en noviembre se pasea sin esquivar a nadie.
