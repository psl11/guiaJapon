body: >-
  En 2016 **fue el primer restaurante de ramen del mundo en recibir una estrella Michelin**, y ese
  dato es histórico y no caduca aunque la estrella sí se haya ido. Su plato es un *shōyu soba* con
  aroma de trufa negra: la salsa se hace con soja cruda madurada dos años y el caldo lleva *dashi* de
  marisco o de ternera.


  Se mudó de Sugamo a Yoyogi-Uehara y hoy está en un sótano de Nishihara, a dos paradas de
  [Shibuya](#shibuya) por la Chiyoda — o sea, alcanzable el día 9 sin desviarse mucho de la Yamanote.
  **Se reserva por internet**, en la plataforma OMAKASE.


  Merece la pena entender qué se paga aquí: no es un ramen de barrio a mil yenes, es un plato de
  autor con producto caro dentro. Quien busque el ramen de siempre lo tiene mejor —y más barato— en
  cualquiera de las otras casas de esta guía.
