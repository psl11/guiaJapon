body: >-
  La *Dreamination* enciende cada invierno el centro de Hiroshima: los jardines que corren por el
  medio del bulevar de la Paz y las calles comerciales peatonales de alrededor, con figuras de luz
  que este año siguen el tema del «país de los cuentos». Es gratis y se pasea de noche.


  Pablo la recuerda de otro noviembre, y con razón: en 2025 se encendió el 17 de noviembre. **En
  2026 la web oficial la retrasa al 4 de diciembre**, así que esta vez se pierde por dos semanas. Va
  aquí para que nadie la busque esa noche.
