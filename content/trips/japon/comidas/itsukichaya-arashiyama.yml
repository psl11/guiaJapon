body: >-
  La casa está en la isla que queda entre los dos brazos del río Katsura, con el puente Togetsukyō
  enfrente. Sirve *obanzai* —la cocina de diario de Kioto, verdura de temporada en muchos cuencos
  pequeños— en un menú único que cambia con la estación, por unos cuatro mil yenes.


  Hay que reservar por internet, y aquí está el dato que caduca: **las mesas con vista al río se
  agotan con semanas o meses de antelación**, mientras que las de jardín salen con menos. Estamos en
  agosto y el día 12 es el 17 de noviembre, así que el momento de decidirlo es ahora y no en octubre.
  Se elige vista al reservar. Y **solo aceptan efectivo**.


  Encaja donde el día ya pasa: la mañana del 13 es el bambusal al amanecer y el
  [Tenryū-ji](#arashiyama) hasta mediodía, y de ahí se cruza la ciudad al noroeste. Comer en la isla
  antes de cruzar cierra la mañana de Arashiyama sin desviarse un metro.
