note: "Ya no hay que reservar cama, pero sí mirar dos autobuses"
body: >-
  **La noche dentro del valle no pudo ser.** Kamikōchi tiene una docena escasa de alojamientos, todos
  estacionales, sus reservas abren en enero y las últimas noches de la temporada se venden con meses
  de antelación: cuando se preguntó, estaban vendidas. No fue un descuido, es la aritmética del sitio
  — el porqué entero está en [dormir en el valle](#dormir-en-kamikochi).


  Lo bueno es que la solución **quita trabajo en vez de añadirlo**. Al no dormir arriba desaparece la
  reserva más frágil del viaje: se entra por la mañana desde Matsumoto, se recorre el valle de punta
  a punta con las once horas de luz que da noviembre, y se sale por la tarde a dormir a
  [Takayama](#takayama), que tiene camas de sobra. Un solo hotel donde antes había dos, y ninguno
  estacional.


  **Lo que sí hay que mirar, y es lo único frágil que queda, son dos autobuses.** El último de
  Kamikōchi a Hirayu sale a las **17:30** y llega a las 17:55; el último de Hirayu a Takayama sale
  también a las **17:30**. Es decir: quien coge el último de arriba se queda tirado abajo, en un
  pueblo donde no tiene reserva. La combinación buena es salir del valle sobre las **16:00** y coger
  el de las 17:30, que deja en Takayama a las 18:31 — con una hora larga en medio para el baño
  termal de Hirayu, que está en la propia terminal.


  Dos avisos más. **Los autobuses directos de Matsumoto al valle se llenan** y se compran online; los
  de Hirayu a Takayama, no —se pagan a bordo y no admiten reserva—. Y **los horarios de noviembre no
  son los de temporada alta**: confirmadlos en la terminal el día que subáis, no el día que bajéis.
