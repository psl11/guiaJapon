  ***Tsukemono*** para probar en el mostrador —los dan a catar—, ***yuba*** (la nata de la leche de soja), y ***tamagoyaki*** recién cortado.
body: >-
  Cuatrocientos metros cubiertos con **más de cien puestos**, funcionando como mercado desde hace cuatro siglos y conocido como «la cocina de Kioto». No es un mercado de restaurantes disfrazado: sigue habiendo casas que llevan cinco generaciones vendiendo **una sola cosa** —un encurtido, un tofu, un cuchillo—.


  Y explica de un vistazo **por qué Kioto cocina distinto**: la ciudad está tierra adentro, el pescado llegaba mal, y la carta se construyó sobre verdura, soja y encurtido. El *yuba* y el tofu de aquí no son guarnición: son el producto principal, con casas que llevan cinco generaciones haciendo solo eso.
