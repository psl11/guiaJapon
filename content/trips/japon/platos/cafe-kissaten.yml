queEs: >-
  Dos culturas del café que conviven sin mezclarse. El ***kissaten*** es el café antiguo: tueste oscuro, filtrado a mano por manga de franela, taza de porcelana, silencio y **derecho a quedarse dos horas**. La tercera ola es lo contrario: tueste claro, origen único, acidez, y un barista que te cuenta la finca.
historia: >-
  El primer café de Japón abrió en **Ueno en 1888** y quebró en cuatro años. Los *kissaten* explotaron en los años veinte y volvieron a explotar en la posguerra, cuando eran de las pocas cosas que un japonés podía permitirse: por el precio de un café tenías **calefacción, música y un sitio donde estar**, que en las casas de entonces no había. De ahí salieron los *jazz kissa*, con sus paredes de discos y su prohibición de hablar.
dondeMejor: "Tokio y Kioto para el kissaten · Kiyosumi-Shirakawa y Jinbōchō para la tercera ola"
picante: "—"
body: >-
  Merece la pena hacer los dos, porque no compiten: son dos ideas opuestas de para qué sirve un café. En un [kissaten](#cafe-de-lambre) el café es la excusa para sentarse; en [Glitch](#glitch-coffee) o en [Koffee Mameya](#koffee-mameya-kakeru), el café es el objeto de estudio.


  **Y dentro del kissaten hay un subgénero que es el más puro de todos: el café de escucha.** Nació de
  una carencia — un disco costaba una fortuna y en las casas no había equipo, así que se pagaba un café
  por el derecho a sentarse delante de unos altavoces buenos. De ahí salen dos ramas: el ***meikyoku
  kissa*** («café de música maestra»), de clásica, y el ***jazz kissa***. En los dos la regla es literal:
  **no se habla**. Las butacas miran a los altavoces como en un cine, hay programa impreso o pila de
  vinilos, y el móvil y la cámara sobran.


  Quedan pocos y son lo más silencioso que se puede pisar en Japón. Los dos mayores: el
  [**Lion**](#meikyoku-kissa-lion) de Shibuya, de **1926**, y [**Chigusa**](#chigusa) en Yokohama, de
  **1933**, el jazz kissa más antiguo del país — bombardeado con su colección entera en 1945 y
  reconstruido disco a disco. Para lo contrario, un kissaten de barrio sin solemnidad, está
  [**Sabouru**](#sabouru) en Jinbōchō: el mismo dueño desde 1955.


  Un dato práctico y contraintuitivo: **el café de máquina del konbini está bien**. Cien yenes, se compra el vaso en caja y se sirve uno mismo. No es tercera ola, pero es mejor que el café de la mayoría de bares de España, y a las siete de la mañana camino de un tren es exactamente lo que hace falta.
