title: Efectivo, tarjetas y el cajero del 7-Eleven
area: Todo el viaje
note: "Los cajeros que funcionan son los del konbini"
body: >-
  Japón es más de efectivo de lo que su fama tecnológica sugiere: las tarjetas funcionan en hoteles,
  grandes almacenes y cadenas, pero **muchos sitios pequeños, templos, mercados y algún autobús
  siguen siendo solo billetes**. Hay que llevar encima más efectivo del que uno llevaría en Europa —
  y no pasa nada, porque es un país donde llevarlo es seguro.


  **El truco práctico:** no todos los cajeros aceptan tarjetas extranjeras, pero **los de 7-Eleven
  (Seven Bank) sí, y están abiertos casi siempre** — hay uno cada pocas calles. Los de correos
  también, con horario más restringido. Los de los bancos japoneses, a menudo no.


  El **IVA es del 10 %** y suele venir incluido en el precio mostrado. **No se dan propinas** en
  ningún sitio: ni en restaurantes, ni en taxis, ni al portero. Intentarlo genera una situación
  incómoda para todos.
