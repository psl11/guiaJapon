title: Del bosque de *Meiji* al cruce de Shibuya
dek: >-
  El último día entero de los cuatro, y el contraste que define Tokio: un bosque de cien mil árboles plantados a mano
  en el centro de la ciudad y, a quince minutos andando, el cruce peatonal más transitado del
  planeta.
