quePedir: "El *omurice* de hamburguesa con **doble queso** y demiglás. Es lo que pide casi toda la sala."
body: >-
  *Omurice* —arroz con kétchup envuelto en tortilla— en la versión que se ha hecho viral: la tortilla
  se abre en la mesa y se derrama sobre el arroz, con demiglás y una hamburguesa rellena de queso
  encima. Está en un sótano de Udagawachō, en pleno [Shibuya](#shibuya).


  El problema es de horario, no de comida. **Abre a las once y la cola pasa de la hora en punta**, y
  el día 9 tiene Harajuku de diez a una y Shibuya de tres a cinco: la hora buena para entrar aquí
  cae justo en medio de la mañana de Harajuku. O se sacrifica esa mañana, o se acepta esperar. Con
  Henry's Burger y Menchirashi a diez minutos en la misma jornada, esta es la tercera opción, no la
  primera.


  Un detalle que se paga caro si se ignora: **no aceptan efectivo**. Solo tarjeta o pago por móvil.
