blocks:
  - block: Amanecer
    time: "07:30–09:30"
    title: La subida, y por qué no hay coches
    body: |-
      Hoy no se madruga tanto. **El autobús está comprado**: el de las **08:40** desde
      Shin-Shimashima, que llega a Kamikōchi a las 09:45. Lo reservó Alba para los cuatro, y para
      subir basta con enseñar al conductor el email de confirmación en el móvil.


      **Antes del tren, la comida del día**: en los *konbini* de al lado de la estación de Matsumoto,
      onigiri, sándwiches o un bentō, y agua. Arriba no hay fuentes, y a una semana del cierre del
      valle los pocos sitios de comer de la terminal recortan horario.


      Las dos maneras de subir son de Alpico, la compañía de transporte de la prefectura:

      - **Tren y autobús, que es la que se usa.** El trenecito de la línea Kamikōchi sale del andén 7
        de la estación de Matsumoto y en treinta minutos deja en Shin-Shimashima. Allí espera el
        autobús de Alpico al valle, que tarda una hora más. Hay que coger el tren que llegue a
        Shin-Shimashima con margen antes de las 08:40: miradlo la víspera en el horario de Alpico.
        La terminal de autobuses está pegada a la estación, y al salir por el torno ya está
        delante. Tren y autobús son de la misma compañía y el horario está hecho para
        enlazar, pero Alpico no garantiza que el autobús espere si el tren se retrasa. Si se
        pierde, el billete se cambia a otro autobús por unos cien yenes, siempre que quede sitio.
      - **El directo**, la *National Park Liner*, que sale de la terminal de autobuses de Matsumoto
        y no de la estación. Solo hay dos al día, a las 05:30 y a las 10:15: uno sale de noche
        cerrada y el otro deja arriba al mediodía, con el día ya medio perdido.

      Desde 2025 **todos los asientos de estos autobuses se reservan**, y eso incluye el de
      transbordo en Shin-Shimashima: el vuestro ya lo está. La venta abre un mes antes y los horarios y el enlace a la
      reserva están en la [web de Alpico](https://visit-nagano.alpico.co.jp/timetable/kamikochi-matsumoto).
      El valle cierra el 15 de noviembre y estos horarios valen hasta ese día.

      En Nakanoyu **se acaba el mundo motorizado**: de ahí para arriba solo suben autobuses y taxis,
      y dentro del valle lo único que se oye es el río.


      **No os bajéis en la terminal, sino antes**: el autobús entra al valle por la única carretera,
      que pasa junto al estanque Taishō, y para allí hacia las 09:30. Decídselo al conductor al
      subir, *«Taishō-ike de orimasu»*. Desde ahí todo el día es a pie y río arriba, y no hace falta
      ningún autobús hasta el de la tarde.
    window:
      label: Las maletas ya van por delante
      body: >-
        **Esto se resuelve el día anterior, no hoy.** Las maletas grandes salieron ayer por
        [takkyūbin](#takkyubin) desde Matsumoto hacia el hotel de Kanazawa, y no se ven hasta el
        miércoles. Hoy y mañana se va con mochila pequeña. Y para dormir en un ryokan no hace falta
        más: **el yukata, las toallas y el jabón los pone la casa**.
  - block: Mañana
    time: "09:30–11:15"
    title: Del estanque Taishō al Kappabashi, río arriba
    body: >-
      Se empieza por el **estanque Taishō**, con la luz de la mañana y, con suerte, la niebla todavía
      pegada al agua. Desde ahí se vuelve andando **río arriba**, una hora y media larga por la
      orilla, y es el paisaje más fotografiado del valle, con razón. A mitad de camino, el desvío
      al estanque Tashiro, y al final el Kappabashi, el puente colgante que es el centro del valle,
      a cinco minutos de la terminal.
    ver:
      - ficha: kamikochi
        nota: Por qué el fondo es llano a 1.500 metros, el agua tan transparente y el valle cierra el 15.
      - nombre: "Estanque Taishō"
        maps: Taisho Pond Kamikochi
        nota: "Lo abrió el monte Yake en 1915 al represar el río: los troncos muertos siguen en pie en el agua."
        lat: 36.2287261
        lon: 137.6186512
      - nombre: Estanque Tashiro
        maps: Tashiro Pond Kamikochi
        nota: Pequeño, de hierba y agua quieta, a mitad de camino. El desvío está mal señalizado.
        lat: 36.2357143
        lon: 137.6245487
      - nombre: Relieve de Walter Weston
        maps: Weston Relief Kamikochi
        nota: El misionero inglés que subía estas montañas por gusto y les dio el nombre de «Alpes».
        lat: 36.2470302
        lon: 137.6266555
      - nombre: Kappabashi
        maps: Kappa Bridge Kamikochi
        nota: "La postal de hace un siglo: el Azusa sobre grava clara y la pared del Hotaka, a 3.190 m."
        lat: 36.2488436
        lon: 137.6378366
  - block: Mediodía
    time: "11:15–12:00"
    title: Comer en la orilla
    body: >-
      La comida viene de Matsumoto en la mochila. Dentro del valle solo se come en los hoteles y en
      el par de cafeterías de la terminal, y en noviembre recogen pronto. Lo que hace todo el mundo
      aquí es **comérsela en una orilla**, a la vista del Hotaka nevado y sin una mesa alrededor, y
      es mejor plan que cualquier comedor.
  - block: Tarde
    time: "12:00–16:30"
    title: El estanque Myōjin, y volver a la terminal
    body: >-
      La tarde es la otra mitad del valle: del Kappabashi, **una hora por la orilla hasta el estanque
      Myōjin**, que casi nadie pisa porque queda al otro lado del puente, y otra de vuelta. Se puede
      ir por una orilla y volver por la otra. Se está de nuevo en el puente hacia las tres, con hora
      y media de margen para sentarse, hacer fotos o alargar el paseo.


      Tokusawa y Dakesawa no caben: llevan la tarde entera. Están, con lo que no conviene hacer en
      noviembre, en [las rutas por nivel](#senderismo-alpes).
    window:
      label: Ventana óptima
      body: >-
        Hacia las tres y media el sol entra rasante por el hueco del río y pone las cumbres en
        naranja, y a esa hora estaréis de vuelta en el Kappabashi, que es donde mejor se ve el
        Hotaka. A las **cuatro y media es de noche** y la temperatura se desploma en cuanto el sol cae
        tras la pared. Guantes en la mochila: operar una cámara con los dedos desnudos a esa hora dura
        poco.


        Se coge **el autobús de las 16:30** en la terminal, y no el último. A las 17:30 es noche
        cerrada, se va después de siete horas en el valle y, como no hay reserva, si llega lleno no
        queda otro detrás.
    ver:
      - nombre: "Estanque Myōjin"
        maps: Myojin Pond Kamikochi
        nota: El santuario Hotaka-jinja Okumiya, del kami que da nombre al valle. Entrada pequeña, y se está solo.
        lat: 36.2540049
        lon: 137.6640105
      - nombre: Tokusawa
        maps: Tokusawa Kamikochi
        nota: "Nivel medio: una hora más allá de Myōjin, por bosque llano. Con la llegada de las 09:30 no cabe."
      - nombre: Dakesawa
        maps: Dakesawa Hut Kamikochi
        nota: "Algo técnico: 2 h 30 de subida hasta 2.170 m. Solo con la senda seca; el refugio ya está cerrado."
  - block: Noche
    time: "17:00–19:00"
    title: Hirayu, y meterse en el agua
    body: >-
      Veinticinco minutos de autobús por el túnel y se sale del parque en **Hirayu Onsen**, el
      pueblo termal donde arranca la carretera del valle, con aguas que brotan desde el siglo XVI.


      Después de casi siete horas andando a mil quinientos metros y con la temperatura bajo cero fuera, un
      *rotenburo* al aire libre no es un extra del día: es el final que justifica el resto.
      Y a diferencia de un baño de paso, aquí se puede entrar antes de cenar y otra vez después, y la
      habitación tiene su propia bañera termal para cuando apetezca.


      Las dieciséis pozas de [Hirayu no Mori](https://www.hirayunomori.co.jp/), la casa de baños de
      al lado, están abiertas también a quien no duerme allí: ¥700, de 10:00 a 21:00, con la última
      entrada a las 20:30. Según quien ha ido **admite tatuajes sin taparlos**, aunque su web no lo
      dice. Al llegar por la tarde, pasad a preguntarlo en recepción.
    window:
      label: La cama está puesta, y el autobús no
      body: >-
        La cama de esta noche es el **Sanzōan**, el *bettei* de la casa de baños del pueblo: seis
        habitaciones, agua termal dentro de cada una y las dieciséis pozas de la casa madre al lado.
        La cena se sirve en la habitación y a hora fija, así que la hora de llegada importa.


        El autobús de las 16:30 deja en Hirayu antes de las cinco, con tiempo para un primer baño
        antes de cenar. Si se escapa, sale otro cada media hora hasta las 17:30, pero no más tarde:
        quedarse dentro del valle no es una opción, porque no hay dónde dormir.
    ver:
      - ficha: onsen
        nota: El protocolo en orden, la diferencia entre onsen y *rotenburo*, y qué pasa con los tatuajes.
      - nombre: Hirayu no Mori
        maps: Hirayu no Mori Takayama
        nota: "La casa de baños madre del Sanzōan, con dieciséis pozas. Abierta a todos por ¥700 y, al parecer, admite tatuajes."
        lat: 36.1891557
        lon: 137.5513313
  - block: Noche
    time: "desde las 19:00"
    title: Cena de montaña, y silencio
    body: >-
      La cena de una posada de Okuhida es lo que la montaña da, y esta se sirve en la propia
      habitación: **buey de Hida** a la plancha de barro —que aquí no es una etiqueta de restaurante
      turístico sino la ganadería del valle de al lado—, sashimi, soba y lo que dé la temporada. Si
      cae el **hōba miso**, miso a la brasa sobre una hoja de magnolio, ese es el plato de la
      comarca.


      Después no hay nada que hacer, y ese es el plan. Once horas de puerta a puerta, un baño más
      antes de dormir y mañana sin prisa.
alt:
  label: Si te desmarcas
  body: >-
    Si el parte da mal tiempo, el valle pierde casi todo su sentido —lo que se viene a ver son las
    cumbres— y hay una salida elegante: quedarse en **Hirayu y su valle de Okuhida**, que es una
    concentración de aguas termales al pie del paso, y subir el **teleférico de Shinhotaka**. Es el
    único de Japón con cabina de dos pisos, sube a 2.156 metros en dos tramos y deja en un mirador
    sobre los Alpes del Norte. Con nubes bajas se sale por encima de ellas, que es justo lo que no
    puede hacerse desde el fondo del valle. Desde la estación de arriba, una hora larga de senda por
    el bosque lleva al refugio Nishiho, que abre todo el año; con nieve, solo con cadenas en las botas.


    Y a mitad de camino del estanque Taishō, apartado del sendero principal, está el estanque
    **Tashiro**: mucho más pequeño, rodeado de hierba y con la niebla enganchada al agua a primera
    hora. Casi todo el mundo pasa de largo porque el desvío no está señalizado con ganas.
