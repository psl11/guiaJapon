body: >-
  Casi todos los puestos de *[takoyaki](#takoyaki)* de Osaka pican el tentáculo en dados. Aquí meten
  **un pulpito entero en cada bola**, lo que cambia la textura por completo: en vez de un tropiezo
  blando dentro de la masa, hay algo que se mastica.


  Está en el propio canal de [Dōtonbori](#osaka), abre de once de la mañana a diez de la noche
  todos los días del año y se pide en la máquina de tiques de la entrada. **Cierran en cuanto se
  acaba el género**, así que a última hora puede no quedar.


  De los tres acabados, la sal de roca es la que deja saber al bicho; la salsa dulce tapa. Encaja en
  el bloque de noche del día 14 sin desviarse un metro, porque está literalmente en la calle por la
  que se pasa.
