blocks:
  - block: Amanecer
    time: "06:00"
    title: Sensō-ji antes de que exista nadie
    body: >-
      El templo más visitado de Japón recibe treinta millones de personas al año, y a las seis de la
      mañana no hay ninguna: el recinto no cierra de noche. Se cruza el Kaminarimon bajo su farol
      gigante, se recorre la Nakamise con las persianas bajadas y se llega a la escalinata con la
      ciudad en silencio. **El salón principal abre a las 6:30** de octubre a marzo, así que hay media
      hora de recinto para vosotros solos.
    window:
      label: Ventana óptima
      body: >-
        Aquí el desfase horario cambia de bando. El cuerpo cree que son las diez de la noche y os va a
        despertar a las cinco hagáis lo que hagáis; **el sol sale sobre las 6:10** y a las nueve esto
        es una romería. Es la única mañana del viaje en que madrugar no cuesta nada.
    ver:
      - ficha: sensoji
        nota: Por qué el templo es de 1945 y lo antiguo de verdad es el santuario de al lado.
      - nombre: Asakusa-jinja
        maps: Asakusa Shrine Tokyo
        nota: El santuario de 1649, lo único original del recinto. A treinta metros a la derecha del salón.
        lat: 35.7148087
        lon: 139.7974977
    comer:
      - comida: onigiri-yadoroku
        elegido: true
        nota: Para el hambre rara de después del templo. Abre temprano y está a cinco minutos.
  - block: Mañana
    time: "08:00–11:00"
    title: Asakusa despierta y la calle de los cuchillos
    body: >-
      Vuelta a la Nakamise dos horas después, para verla convertida en otra cosa: suben las persianas,
      salen los ***ningyō-yaki*** del molde y el templo se llena de gente rezando de camino al trabajo.
      A diez minutos andando está Kappabashi, la calle de los cuchillos y la vajilla. No se vuelve
      en el viaje: si algo gusta, se compra hoy, y lo que pese viaja por
      [takkyūbin](#takkyubin) hasta el último hotel.


      Y hoy, sábado 7, es el **primer día del gallo** del año. Un cuarto de hora al norte de
      Kappabashi, el santuario Ōtori celebra su *tori no ichi*, el mercado de los ***kumade***: rastrillos
      de bambú cargados de amuletos que los comerciantes compran para «rastrillar» la suerte del año
      siguiente. Cuando se cierra una venta, el puesto entero da palmas a coro. Dura las veinticuatro
      horas, así que a media mañana ya está en marcha. Se recorre la calle de puestos y se vuelve, sin
      hacer la cola para rezar, que hoy es larga.


      A diez minutos andando empieza lo que fue **Yoshiwara**, el barrio de placer de Edo durante
      casi tres siglos, cerrado en 1958 con la ley contra la prostitución. Quedan el santuario de
      Yoshiwara y, en la antigua entrada, el Mikaeri-yanagi, «el sauce de mirar atrás», donde los
      clientes se volvían a mirar al salir. Hiroshige juntó los dos sitios en una de sus *Cien vistas
      de Edo*: un gato en la ventana de una cortesana mirando pasar a la gente que vuelve del mercado
      del gallo. Las calles de alrededor siguen siendo barrio rojo, hoy de *soaplands*.
    window:
      label: Por qué las dos visitas
      body: >-
        Son **dos sitios distintos** con el mismo nombre. A las seis es un templo; a las nueve es un
        mercado con un templo dentro.
    ver:
      - nombre: Mirador del Centro Cultural
        maps: Asakusa Culture Tourist Information Center
        nota: "Edificio de Kengo Kuma con ascensor gratis a la octava planta: la Nakamise entera y el Skytree."
        lat: 35.7106419
        lon: 139.7965189
      - nombre: Kappabashi
        maps: Kappabashi Kitchen Town Tokyo
        nota: Cuchillos, palillos, vajilla y comida de plástico. Lo que guste, se compra hoy.
        lat: 35.7142517
        lon: 139.7888894
      - nombre: Kama-asa
        maps: Kama-asa Shoten Kappabashi
        nota: "Cuchillos desde 1908: graban el nombre en la hoja gratis. De 10:00 a 17:30. Luego, a la maleta facturada."
      - reco: alba-zen-craft-asakusa
        nota: Tallarse los palillos, en el camino entre el templo y Kappabashi.
      - nombre: Sumida Riverwalk
        maps: Sumida River Walk Asakusa
        nota: "La pasarela sobre el río junto al puente del tren, la de *Rental Family*. A cinco minutos del templo."
      - nombre: "Tori no ichi del santuario Ōtori"
        maps: "Otori Shrine Asakusa Tori no Ichi"
        nota: "Solo hoy y el 19: el mercado de los rastrillos de la suerte, abierto las 24 horas."
      - nombre: "Yoshiwara y el Mikaeri-yanagi"
        maps: "Mikaeri Yanagi Senzoku Taito Tokyo"
        nota: "El sauce de la entrada del antiguo barrio de placer, a diez minutos del santuario Ōtori."
    comer:
      - comida: nakamise
        elegido: true
        nota: El *ningyō-yaki* recién hecho. Los puestos abren hacia las 9:30.
      - comida: asakusa-ruta-callejera
        nota: Melonpan, anguila y croqueta en una sola manzana. Abren a las 10:00.
      - comida: umezono
        nota: El *anmitsu* de un salón de 1854, a un paso de la Nakamise.
  - block: Mediodía
    time: "11:30–15:00"
    title: Ueno, y el museo que explica el país
    body: >-
      En metro hasta **Ueno**, el parque grande de la ciudad. Dentro está el Museo Nacional de Tokio,
      el más antiguo y completo de Japón: armaduras, espadas, biombos y cerámica. Dos horas en el
      edificio principal, el Honkan, bastan. A la salida, Ameyoko, el mercado que nació de un mercado
      negro de posguerra bajo las vías del tren. En esa misma calle está Mizutani Camera, la tienda de
      relojes: el sábado cierra a las 16:30, así que se entra antes de coger el tren a Yanaka.
    window:
      label: Por qué hoy y no el lunes
      body: >-
        Porque **el lunes cierra**, como casi todos los museos de Japón. Todo lo que tenga taquilla y
        horario tiene que caer hoy o mañana.
    ver:
      - ficha: ueno
        nota: Por qué el parque es un escudo contra los demonios, y qué hay en cada museo.
      - nombre: Museo Nacional de Tokio
        maps: Tokyo National Museum
        nota: El Honkan, dos horas. Cierra los lunes.
        lat: 35.7190448
        lon: 139.7759676
      - reco: pablo-mizutani-camera
        nota: Seiko vintage en Ameyoko, de camino. Hoy cierra a las 16:30, así que antes de Yanaka.
      - nombre: "Estatua de Saigō Takamori"
        maps: "Saigo Takamori Statue Ueno Park"
        nota: "El hombre del que sale el Katsumoto de *El último samurái*, con su perro, a la entrada sur del parque."
        lat: 35.7118642
        lon: 139.7741678
    comer:
      - comida: asakusa-hirayama
        elegido: true
        nota: Si se come antes de salir de Asakusa. Soba *juwari* con Bib Gourmand, y hay que reservar.
      - comida: "tompachitei"
        nota: "Si se come ya en Ueno. Tonkatsu en manteca con Bib Gourmand, a cinco minutos del parque. Abre a las 11:30."
  - block: Tarde
    time: "15:00–17:00"
    title: Yanaka, el barrio que no ardió
    body: >-
      Tokio se arrasó dos veces en un siglo —el terremoto de 1923 y las bombas de 1945— y por eso casi
      no tiene casco antiguo. Yanaka se libró de las dos: casas bajas de madera, setenta templos, un
      cementerio con cerezos y gatos. Se baja a la [**Yanaka Ginza**](https://www.google.com/maps/search/?api=1&query=Yanaka%20Ginza%20Tokyo)
      por la «escalera del sol poniente», pero lo mejor está en las calles de al lado.
    window:
      label: Ventana óptima
      body: >-
        **En noviembre el sol se pone a las 16:40.** Yanaka a las cuatro, con el sol bajo entre las
        casas y las tiendas encendiéndose, es el momento. A las cinco ya es de noche.
    ver:
      - ficha: yanaka
        nota: Por qué hay setenta templos en un barrio, y quién está enterrado en el cementerio.
      - nombre: Museo Asakura de Escultura
        maps: Asakura Museum of Sculpture Tokyo
        nota: Casa, estudio y patio de agua del escultor, descalzos. Cierra lunes y viernes; el sábado abre.
        lat: 35.7268258
        lon: 139.7685379
      - nombre: Tennō-ji
        maps: Tennoji Temple Yanaka Tokyo
        nota: Un Buda de cobre de 1690 al aire libre, junto a la entrada del cementerio.
        lat: 35.7267469
        lon: 139.7712420
      - nombre: Nezu-jinja
        maps: Nezu Shrine Tokyo
        nota: "Un túnel de torii rojos en miniatura: el Fushimi Inari de bolsillo, sin cola."
        lat: 35.7199731
        lon: 139.7606625
    comer:
      - comida: kayaba-coffee
        elegido: true
        nota: El *tamago sando* de un *kissaten* de 1938, en la esquina del cementerio.
  - block: Noche
    time: "noche"
    title: La primera cena de verdad
    body: >-
      Hoy no hay que volver a ninguna parte: el día entero ha pasado en esta mitad de la ciudad. Tres
      opciones a un paso del hotel, y a la cama pronto, que mañana también amanece temprano.


      Y entre la cena y la cama, si queda cuerda, una hora en un *maid café*, que es Akihabara en estado puro. Lo propone
      Pablo, que fue a [Maidreamin](#pablo-maidreamin) y se lo pasó en grande: el sábado abre hasta las
      once.
    ver:
      - reco: pablo-maidreamin
        nota: Una hora de canciones y conjuros sobre la comida, por ¥880 y una consumición por cabeza.
      - nombre: Akihabara Gachapon Kaikan
        maps: "秋葉原ガチャポン会館 外神田3-15-5"
        nota: "Unas quinientas máquinas de cápsulas en un bajo, para entrar a mirar. Cierra a las 20:00: antes de cenar."
        lat: 35.701893
        lon: 139.771317
      - nombre: "Yodobashi Akiba, Plakoro"
        maps: "Yodobashi Akiba"
        nota: "Plakoro, el juego de dados Pokémon: las seis cajas de inicio a ¥990, cajas de exploración y, si ya han salido, Dragonite y Altaria. Plan B, el día 17 en Ikebukuro."
        lat: 35.698639
        lon: 139.774612
    comer:
      - comida: ameyoko
        elegido: true
        nota: Barras al aire libre bajo las vías desde las cinco. Se cena de pie y picando.
      - comida: mimasuya
        nota: La izakaya más antigua de Tokio, de 1905, una parada al sur. Mejor reservar.
      - comida: tonkatsu-marugo
        nota: Bib Gourmand a cuatro minutos del hotel. El sábado abre de 17:00 a 20:00, con cola antes.
alt:
  label: Si te desmarcas
  body: >-
    El Museo Nacional ya lo has hecho. Tres cambios con más recorrido:

    - **El Museo Nacional de Ciencias**, al lado del Honkan. Tiene a **Hachikō disecado** y una sala
    de historia natural japonesa que no visita nadie.

    - **El [mercado de antigüedades de Ōedo](#alba-oedo-antique-market)**, en Yūrakuchō, si hoy no
    llueve. Solo abre dos días al mes y hoy es uno: doscientos cincuenta anticuarios al aire libre,
    de nueve a cuatro. Cuesta el Honkan entero y dos paradas de Yamanote.

    - **Cruzar el río a [Ryōgoku](#ryogoku)**, el barrio del sumo. El Museo Edo-Tokyo cuenta la ciudad
    de madera que se quemó —comprueba si ya reabrió de su reforma—. Los establos de luchadores, en
    cambio, estarán vacíos: en noviembre se mudan a Fukuoka para el torneo de Kyūshū, que empieza
    mañana.

    - **Dos paradas más allá por la Sōbu, Kameido**, otra propuesta de
    [Japonismo](https://japonismo.com/blog/tokio-diferente) para un Tokio menos obvio. El santuario
    Kameido Tenjin, con sus puentes de tambor y la Skytree detrás, monta su exposición de
    crisantemos del 25 de octubre al 23 de noviembre, y a la salida de la estación está Kameido
    Gyoza, que en la carta solo tiene eso.