  - block: Noche
    time: "desde las 18:30"
    title: La pequeña Seúl, y los callejones de Shinjuku
    body: >-
      La última noche de los cuatro, y se hace andando de norte a sur. Empieza una parada más allá de
      Shinjuku, en **Shin-Ōkubo**, el barrio coreano de Tokio y la cuenta pendiente de Pablo desde
      hace cuatro viajes. La Yamanote llega directa desde Shibuya en diez minutos. Allí se cena
      barbacoa coreana, que resuelve el problema de esta noche: es de los pocos sitios donde los
      cuatro os sentáis a la misma mesa. Reservad, que en viernes se llena.


      Después, diez minutos a pie hacia el sur, y se entra en [Kabukichō](#kabukicho) por arriba: la
      [torre de Kabukichō](#kabukicho-tower), de 2023, con su patio de comidas de neón en la segunda
      planta, la cabeza de Godzilla asomada al cine y, al otro lado de la avenida, el laberinto de
      [Golden Gai](#golden-gai), casi trescientos bares diminutos de dos plantas, cada uno con su
      tema.


      Aviso para un grupo de cuatro: **en Golden Gai no cabéis juntos en casi ningún sitio**, así que
      la noche va por turnos o de pie. Varios bares cobran cubierto, está anunciado en la puerta y no
      es una estafa.


      Si hay que elegir uno donde quepáis los cuatro y que tenga personalidad, que sea **Albatross
      G**: tres plantas estrechas, lámparas de araña y cuadros hasta el techo. Cobra ¥500 de cubierto
      con algo de picar, tiene carta en inglés y está acostumbrado a que entre gente de fuera. Id
      pronto, antes de las nueve, y pedid sitio arriba para cuatro.


      Para volver se cruza al otro lado de la estación, y por el camino queda
      [Omoide Yokochō](#omoide-yokocho): dos pasillos de barras de seis taburetes bajo faroles rojos,
      para un último pincho de [yakitori](#yakitori) al humo antes del tren. Y el último paseo lo
      propone Pablo: bajar hasta la salida sur, donde está encendida hasta medianoche la
      [Minami Lumi](#pablo-minami-lumi), las luces de Navidad de la estación, de camino a la Ōedo.


      **Mirad el último tren antes de la tercera copa**: es la diferencia entre veinte minutos de
      vuelta y un taxi de cuatro o cinco mil yenes. Mañana uno sale a las ocho hacia Narita.
