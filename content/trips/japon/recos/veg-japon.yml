title: "Vegetariano en Japón: el problema no es la carne, es el caldo"
area: "Todo el viaje"
note: "La frase que hay que aprenderse está abajo"
body: >-
  Japón es **más difícil de lo que parece** para alguien vegetariano, y por una razón que no se ve: el ***dashi***. Es el caldo base de la cocina japonesa entera y se hace con *kombu* (alga) **y katsuobushi**, virutas de bonito seco ahumado, o con *niboshi*, sardinillas secas. Está debajo de casi todo, es transparente, y —esto es lo importante— **mucha gente en Japón no lo considera «pescado»**. Un camarero puede decir con toda honestidad que un plato no lleva pescado y estar sirviendo caldo de bonito.


  Los platos que engañan, por orden de frecuencia: **la sopa de miso** (casi siempre lleva), **la salsa de mojar de la soba fría**, **la salsa del tempura**, el *agedashi tōfu*, la sopa clara de cualquier menú *teishoku*, el *chawanmushi* y buena parte de las verduras guisadas. Es decir: **justo los platos que parecen vegetales**.


  **La frase que hay que llevar aprendida** no es «soy vegetariano». Es esta:
  
  > ***Sakana no dashi wa haitte imasu ka?*** — ¿lleva caldo de pescado?
  
  Y una segunda para pedirlo: ***Katsuo-dashi nashi de onegai shimasu*** — sin caldo de bonito, por favor.


  Lo que **no** funciona es decir *niku wa dame desu* («no como carne»). En japonés *niku* significa específicamente **vaca, cerdo y pollo**: quien lo oiga puede servir pescado sin ninguna mala intención, porque para él eso no es carne.


  Y ahora lo bueno, que es bastante. **Tres cosas hacen este viaje perfectamente viable:**
  
  - **La [shōjin ryōri](#shojin-ryori)**, la cocina de los monasterios zen: cien por cien vegetal, con caldo de kombu y shiitake, sin ajo ni cebolla. En Kioto hay tres sitios de nivel distinto —[Shigetsu](#shigetsu), [Izusen](#izusen-daijiin) y [Ajiro](#ajiro), con estrella Michelin— y en Kamakura está el [Hachi-no-ki](#hachi-no-ki). No es un apaño: es alta cocina.
  - **La palabra ***puranto-beesu*** (プラントベース, «plant-based»)**, que es hoy el marcador más fiable en una carta moderna. Más fiable que «vegetariano», que en Japón se interpreta de mil maneras.
  - **La red de seguridad**: [T's TanTan](#ts-tantan) es enteramente vegano y está **dentro de la estación de Tokio**, por donde este viaje pasa una y otra vez. Y la cadena CoCo Ichibanya tiene una base de curry vegetariana declarada, disponible en todo el país.


  Dos trucos de mesa que valen más que cualquier lista. En un [yakitori](#yakitori), pedir todo ***shio*** (sal) en vez de ***tare*** (salsa) convierte media carta de verduras a la brasa en apta, porque **la *tare* lleva base de pollo**. Y para las noches en que ya no queda paciencia, la ***depachika*** de unos grandes almacenes resuelve una cena entera leyendo etiquetas — [la de Isetan](#depachika-isetan) tiene la ficha.
