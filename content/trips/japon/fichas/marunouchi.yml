epithet: >-
  En el centro geográfico de la mayor aglomeración urbana del planeta hay ciento quince hectáreas de
  bosque rodeadas de foso a las que no se puede entrar. Todo Tokio se organiza alrededor de un vacío
  — y ese vacío es lo que queda del castillo más grande que se construyó nunca.
sections:
  - heading: El castillo que ya no está
    body: |
      Lo empezó **Ōta Dōkan en 1457**, cuando esto era una aldea de pescadores; lo heredó
      **Tokugawa Ieyasu en 1590** y lo convirtió, en las décadas siguientes, en **la mayor fortaleza
      del mundo**: un sistema de fosos en espiral de dieciséis kilómetros de perímetro que envolvía
      lo que hoy son la estación de Tokio y medio Marunouchi.

      De aquello queda **el suelo y las piedras**. La torre del homenaje ardió en el
      [gran incendio de 1657](#acto-4-edo) y **nunca se reconstruyó** — el shogunato decidió que el
      dinero estaba mejor en reconstruir la ciudad que en levantar otra torre, y en su lugar hay hoy
      un basamento de piedra vacío al que se sube en dos minutos. Es probablemente el mejor sitio de
      Tokio para entender de golpe qué fue esta ciudad.

      El palacio actual es de los años sesenta —el de Meiji ardió en los bombardeos de 1945— y las
      residencias imperiales, de los noventa. **No se entra**, salvo en visitas guiadas gratuitas que
      se piden por internet con pasaporte, o los dos días al año que abren el [**Nijūbashi**](https://www.google.com/maps/search/?api=1&query=Nijubashi%20Bridge%20Imperial%20Palace%20Tokyo) al
      público.
  - heading: Lo que sí se pisa
    body: |
      - [**Higashi Gyoen**](https://www.google.com/maps/search/?api=1&query=Imperial%20Palace%20East%20Gardens%20Tokyo), el jardín este: **gratis**, abierto casi todos los días, y dentro está el
        basamento de la torre, los muros ciclópeos y la **Fujimi-yagura**, una de las tres torres de
        vigilancia que sobrevivieron. Se recorre en una hora y no hay casi nadie.
      - **Kitanomaru-kōen**, al norte, con el **Museo Nacional de Arte Moderno** —la mejor colección
        de pintura japonesa del siglo XX— y el **Nippon Budōkan**, octogonal en homenaje a un pabellón
        de Hōryū-ji y con la silueta inspirada en el Fuji. Aquí **tocaron los Beatles en 1966**, los
        primeros de una lista larguísima.
      - **Kōkyo Gaien**, la explanada de pinos negros recortados frente al [**Nijūbashi**](https://www.google.com/maps/search/?api=1&query=Nijubashi%20Bridge%20Imperial%20Palace%20Tokyo), el puente de
        dos arcos que sale en todas las fotos. Es terreno ganado: hasta 1899 lo ocupaban las mansiones
        de los vasallos de máxima confianza del shōgun.
  - heading: Marunouchi, «dentro del círculo»
    body: |
      El nombre lo dice: *maru-no-uchi* es **«dentro del recinto»**, porque todo esto estaba dentro de
      los fosos del castillo. Los Mitsubishi lo compraron entero en 1890 cuando era un descampado
      militar, y hoy es el distrito financiero.

      Lo que hay que ver está en dos edificios y es gratis:

      - La **estación de Tokio**, de 1914, en ladrillo rojo estilo Ámsterdam, **restaurada en 2012**
        recuperando las cúpulas que perdió en 1945. Desde el vestíbulo norte se ve el techo abovedado
        con los relieves de los ocho signos del zodiaco.
      - El [**Tokyo International Forum**](https://www.google.com/maps/search/?api=1&query=Tokyo%20International%20Forum), de **Rafael Viñoly**: un casco de barco de cristal y acero de
        sesenta metros puesto del revés, con pasarelas por las que se sube y se cruza. Se entra libre
        y es de los mejores interiores de la ciudad.
  - heading: Lo que no sale en las listas
    body: |
      - [**Intermediatheque**](https://www.google.com/maps/search/?api=1&query=Intermediatheque%20Tokyo) — encima de la estación, en el edificio **KITTE** (la antigua oficina
        central de correos). Es la **colección científica de la Universidad de Tokio** montada por un
        diseñador con criterio de galería: esqueletos de ballena, minerales, instrumentos de medición,
        aves disecadas, todo en vitrinas de madera del siglo XIX y con luz de museo antiguo.
        **Gratis**, y es de lo mejor de Tokio.
      - [**Old Imperial Bar**](https://www.google.com/maps/search/?api=1&query=Old%20Imperial%20Bar%20Imperial%20Hotel%20Tokyo) — en el Hotel Imperial, es **lo único que queda del hotel que levantó
        Frank Lloyd Wright** en Tokio y que aguantó en pie el terremoto de 1923 **el día después de
        inaugurarse**. Se conservan el ladrillo perforado y la piedra de Ōya tallada. Pedid el cóctel
        **«Mount Fuji»**, que lleva en la carta desde 1924.
      - **El laberinto subterráneo** — desde la puerta Ōte-mon hasta el parque de Hibiya se puede
        cruzar **todo el distrito sin salir a la superficie**, por una red de pasadizos comerciales
        que enlaza las estaciones de los dos lados de las vías. Es feo, es fascinante y salva un día
        de lluvia.
      - **T's TanTan** — dentro de la estación: [ramen](#ramen) **cien por cien vegano** y muy bueno, en el
        sitio con menos alma imaginable.
      - Y a cinco minutos, [la tumba de Masakado](#masakado): la lápida que nadie se atreve a mover.
curiosidades:
  - >-
    La torre del castillo de Edo **ardió en 1657 y nunca se reconstruyó**: el shogunato prefirió gastar
    el dinero en rehacer la ciudad. Su basamento de piedra sigue vacío en medio del jardín, y se sube
    en dos minutos.
  - >-
    **Marunouchi significa «dentro del círculo»** — dentro de los fosos del castillo. Era un descampado
    militar hasta que Mitsubishi lo compró entero en 1890.
  - >-
    Se puede cruzar todo el distrito, **de la puerta del Palacio al parque de Hibiya, sin salir a la
    superficie**: la red de pasadizos subterráneos enlaza las estaciones de los dos lados de las vías.
