blocks:
  - block: Mañana
    time: "09:00–12:00"
    title: El Azusa sube al interior
    body: >-
      Salida de [**Shinjuku**](#shinjuku) en el limited express **Azusa** —desde el hotel de
      [Akihabara](#akihabara) va directa la Chūō-Sōbu amarilla, sin transbordo, pero es tren de
      cercanías y conviene salir con margen—, dos horas y media largas subiendo por la
      cuenca de Kōfu y el lago Suwa entre montañas que se van poniendo serias. El tren lleva el nombre
      del río Azusa, el mismo que veréis mañana bajando por [Kamikōchi](#kamikochi): sube a buscar su
      nacimiento. Es el primer tren de verdad del
      viaje —los de Tokio son metro con otro nombre— y conviene hacerlo bien: asiento reservado en el
      lado izquierdo para las vistas, un *ekiben* comprado en la estación y comido a bordo, que
      es una institución nacional y no una merienda.
    window:
      label: La cuenta del JR Pass, aquí
      body: >-
        Este billete cuesta unos **¥6.620** en asiento libre. Sumado a Kamakura y a los traslados del
        aeropuerto, vuestro gasto total en JR ronda los ¥21.000 — frente a los ¥50.000 que
        cuesta el JR Pass de 7 días, que además ni cubriría los 8 del viaje. No compréis el pase:
        billetes sueltos, y el metro de Tokio no es JR de todas formas.
  - block: Mediodía
    time: "12:30–15:00"
    title: Matsumoto-jō, uno de los doce que quedan
    body: >-
      De los cientos de castillos que tuvo Japón, **solo doce conservan su torre del homenaje
      original**: el resto son reconstrucciones de hormigón de los años sesenta. Este es uno de los
      doce, es Tesoro Nacional y es el más antiguo de cinco plantas del país —su torre se levantó
      hacia 1594—. Lo llaman [**Karasu-jō**](#matsumoto-jo), el castillo cuervo, por su laca negra. Por dentro se
      sube por escaleras de madera casi verticales, en calcetines, con las troneras para arcabuces a
      la altura de la cara; y por fuera se refleja entero en el foso, con los Alpes detrás.
    window:
      label: Por qué importa que sea original
      body: >-
        Porque se nota, y porque explica el resto del viaje. Una reconstrucción de hormigón tiene
        ascensor y vitrinas; esta tiene **escalones de sesenta centímetros y techos bajos** que
        obligan a subir agachado, y se entiende de golpe que un castillo japonés no era un palacio
        sino una máquina de guerra en madera. Es la mejor lección de historia que da este viaje, y se
        aprende con las rodillas.
  - block: Tarde
    time: "15:00–17:00"
    title: Nakamachi, Nawate y las ranas
    body: >-
      Dos calles a la orilla del río Metoba, y las dos merecen. [**Nakamachi**](https://www.google.com/maps/search/?api=1&query=Nakamachi%20Street%20Matsumoto) es la calle de los
      almacenes ***kura***: muros blancos con enrejado negro de rombos, antiguos depósitos de
      comerciantes de sake reconvertidos en talleres de artesanía y cafés. Enfrente, [**Nawate-dōri**](https://www.google.com/maps/search/?api=1&query=Nawate%20Street%20Matsumoto),
      un pasaje estrecho junto al agua tomado por ranas: estatuas, tiendas, un santuario ranil.
      La broma tiene raíz — el río estaba lleno de ranas hasta que se contaminó, y el barrio las
      adoptó como emblema al limpiarlo.
  - block: Noche
    time: "noche"
    title: Soba, caballo y sake de montaña
    body: >-
      Nagano es tierra de *[**soba**](#soba)*: aquí el trigo sarraceno crece donde el arroz no, y el fideo se
      come frío con salsa aparte incluso en noviembre. La otra especialidad local es más difícil de
      vender y conviene decirla sin rodeos: el ***basashi***, sashimi de carne de caballo, que en
      Matsumoto es tan normal como el jamón en Teruel. Nadie está obligado. Y para acompañar, sake de
      la prefectura, que es de los mejores del país por el agua de deshielo.
    window:
      label: Antes de dormir
      body: >-
        **Esto ya debería estar resuelto desde ayer.** Mañana se sube a Kamikōchi, donde no hay
        coches ni ascensores y el equipaje es un estorbo, y **se duerme en [Takayama](#takayama) sin
        volver a pasar por aquí**: las maletas grandes salieron esta mañana de Tokio por
        ***takkyūbin*** y os esperan allí. A Matsumoto se llega con lo de una noche.

        Si por lo que sea no salieron, se manda **hoy mismo desde el hotel de Matsumoto** — pero
        entonces llegan un día tarde y mañana se duerme sin ellas. Es el único punto del viaje donde
        el equipaje no admite improvisación.
alt:
  label: Si te desmarcas
  body: >-
    Matsumoto tiene una carta que casi nadie juega: es **la ciudad natal de Yayoi Kusama**, y el
    Museo de Arte de Matsumoto guarda la mayor colección permanente de su obra fuera de Tokio —
    con las máquinas expendedoras de la entrada forradas de lunares, por si hacía falta la señal.
    Está a diez minutos andando del castillo y abre los miércoles. La otra opción va en dirección
    contraria: [**Asama Onsen**](https://www.google.com/maps/search/?api=1&query=Asama%20Onsen%20Matsumoto), en las afueras, es un balneario de mil trescientos años con baños
    públicos donde no hay un solo extranjero — y llegar a Kamikōchi mañana con las piernas ya
    descansadas no es mala idea.
