kicker: Decisión de dinero · día 3
title: Subir a *Shibuya Sky*
verdict: merece
verdictLabel: Merece la pena
lede: >-
  Hay miradores gratis en Tokio y son buenos. Este se paga, y aun así es el que hay que hacer — por
  una diferencia concreta: no tiene cristal.
ledger:
  - label: Cuesta
    body: >-
      En torno a **¥2.500-3.000** por persona reservando online (algo más en taquilla, si queda). Para
      cuatro, unos 70-80 €.
  - label: Qué compra
    body: >-
      Una **azotea abierta a 230 metros**, sin cristal entre la cámara y el aire — que es justo lo que
      arruina las fotos en los miradores acristalados—, con el cruce de [Shibuya](#shibuya) en vertical debajo, la
      ciudad de 360 grados y **el Fuji recortado al oeste** los días claros. En noviembre el aire es el
      más transparente del año y se ve muchísimos más días que en verano.
  - label: La alternativa
    body: >-
      Gratis y digna: el **mirador del Edificio del Gobierno Metropolitano** en [Shinjuku](#shinjuku), a 202 metros
      y sin pagar un yen. También el **Starbucks del Tsutaya**, que da la vista clásica del cruce por
      el precio de un café. Las dos son **detrás de un cristal**.
  - label: Veredicto
    body: >-
      **Merece la pena, con dos condiciones**: reservar la franja de las **16:00** —el sol se pone a
      las 16:40 y así entra la última luz, el crepúsculo y el encendido en una sola visita— y aceptar
      que si el día amanece cerrado, el Fuji no aparece. Con un fotógrafo en el grupo, la azotea
      abierta lo justifica sola.
