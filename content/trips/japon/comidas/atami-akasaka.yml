body: >-
  Ocho asientos, todos de barra, y un solo menú al mediodía: cinco pases que van creciendo hasta una
  hamburguesa de wagyu negro cien por cien **asada sobre leña**, sin ligantes, y un helado de leche
  para cerrar. Cuesta unos 7.800 yenes, que para una hamburguesa suena a disparate hasta que se ve
  que no se está pagando una hamburguesa sino un menú de barra.


  Está en Akasaka-Mitsuke, a tres minutos del metro y a un salto del hotel de Roppongi, y aparece en
  la selección **Japan's Best Wagyu de 2026 en el puesto ocho**, que es un sello comprobable y no una
  frase de vídeo.


  El horario es el filtro: **solo mediodía, en tres turnos —11:00, 12:00 y 13:00— y solo con
  reserva**. Con ocho plazas por turno, esto se decide con semanas, no con días.
