title: Los *kami*, el arroz y la corte
lead: >-
  Antes que nada estaba el **shintō**, que no es exactamente una religión: no tiene fundador, ni libro
  sagrado, ni dogma, ni siquiera una palabra propia para «fe». Tiene kami — una cosa que se
  traduce mal como «dioses» y que significa más bien *lo que sobrecoge*: una cascada, una roca
  enorme, un ciprés de mil años, un emperador muerto, el mar. Donde hay un kami se pone una cuerda de
  paja y una puerta, y eso es un santuario.
body: |
  En el año **538** llegó de Corea el budismo, con sus escrituras, su clero y su iconografía, y
  aquí ocurrió lo que define a este país: no sustituyó a nada. Después de un siglo de tensiones
  cortesanas, las dos cosas se repartieron el trabajo y convivieron durante mil trescientos años bajo
  el nombre de *shinbutsu-shūgō*, la fusión de kami y budas. La regla práctica que todavía se cumple:
  el shintō lleva la vida y el budismo la muerte. Uno se casa en un santuario y se entierra en un
  templo, y a nadie le parece contradictorio — igual que nadie ve problema en añadir una boda de
  iglesia cristiana por lo bonita.

  Con el budismo llegó el aparato del Estado chino: escritura, burocracia, urbanismo en cuadrícula.
  Japón estrenó capitales fijas, primero [**Nara**](#nara) (710) y luego **Heian-kyō** (794), la actual [Kioto](#kioto),
  donde la corte se encerró tres siglos y medio a hacer algo insólito: inventar una estética.
  Mientras los guerreros se repartían las provincias, un puñado de nobles ociosos afinaron hasta el
  absurdo el arte de mezclar colores de kimono, escribir en papel perfumado y sentir la tristeza de
  las cosas que se acaban — el *mono no aware*, que sigue siendo la clave emocional de la
  cultura japonesa y la razón de que aquí se celebre la flor del cerezo *porque* dura una semana.

  > De aquella corte salió, hacia el año 1010, el ***Genji monogatari*** de Murasaki Shikibu:
  > mil páginas sobre el amor y el paso del tiempo, escritas por una dama de compañía, y considerada
  > la primera novela de la historia.

  Aquel refinamiento tenía el defecto de mirarse el ombligo. Mientras la capital pulía versos, en las
  provincias crecían familias de terratenientes armados que cobraban impuestos y resolvían disputas
  con la espada. Cuando la corte quiso frenarlos, ya era tarde: dos de esos clanes, **Taira** y
  Minamoto, se destrozaron en una guerra que acabó en 1185 y que arrancó a Japón de manos de los
  poetas para ponerlo en las de los soldados. Eso es el acto siguiente.
connect:
  label: Lo veréis sobre el terreno
  body: |
    El día 2 y el día 3 son este acto, sin que lo parezca. [**Sensō-ji**](#sensoji) en Asakusa es un templo
    *budista* —fundado, dice la leyenda, en el 628, cuando dos pescadores sacaron del río Sumida una
    estatuilla de Kannon— y [**Meiji Jingū**](#meiji-jingu) es un santuario *shintō*. Los visitaréis con un día de
    diferencia y a simple vista se distinguen: uno tiene incienso, un salón oscuro y una pagoda; el
    otro, un torii, grava y sacerdotes de blanco.

    Y hay un gesto que lo resume: en el santuario **se aplaude** y en el templo no. Dos veces
    inclinarse, dos palmadas para llamar la atención del kami, una inclinación más. Delante de un
    Buda, solo las manos juntas y silencio.
