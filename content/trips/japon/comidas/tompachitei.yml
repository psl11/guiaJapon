quePedir: >-
  El ***rōsu katsu*** grueso. Lo fríen despacio en manteca, a fuego suave, y sale con la corteza
  dorada y el centro todavía rosado.
body: >-
  **Bib Gourmand nueve años seguidos**, en un callejón detrás de Ameyoko. Lo lleva la tercera
  generación de la familia, que se crio en este mismo trozo de Ueno y aprendió el oficio también en
  Europa. Cerdo nacional de un carnicero de confianza, manteca al cien por cien y fuego bajo.


  Cae justo en el **mediodía del día 2**, que es el de Ueno: está a cinco minutos del parque y abre a
  las 11:30. **Solo da comidas** (11:30–14:30) y **cierra los lunes**; los festivos abre.
