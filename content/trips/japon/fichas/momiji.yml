title: El momiji, y dónde cae cada día del viaje
image:
  src: img/fichas/momiji.webp
  alt: "Arces enrojecidos y pinos reflejados en el estanque de un jardín japonés en pleno otoño."
  credit: "Pablo Sánchez"
epithet: >-
  Japón sigue el avance del otoño como aquí se sigue el tiempo, con partes diarios y mapas. Y estas
  tres semanas lo cruzan entero: empiezan por encima del color, en una montaña ya pelada, y terminan
  justo dentro del pico de la ciudad. Conviene saber en qué punto está cada día.
sections:
  - heading: Una tradición de mil años
    body: |
      El ***kōyō*** (紅葉) es el enrojecimiento de las hojas; ***momiji*** es la misma palabra leída de
      otra forma y también el nombre del arce japonés. Y no es una moda de folleto: en el
      ***Man'yōshū***, la antología poética del siglo VIII, ya se celebra; y en el ***Genji***, del
      XI, los nobles de Heian salen a pasear bajo las hojas. Es decir, **los japoneses llevan mil
      doscientos años haciendo esto**.

      Con Edo bajó de clase: primero los shōgun y los samuráis, luego los comerciantes y el pueblo.
      Se cuenta que el shōgun **Tokugawa Yoshimune** plantó cerezos y arces en el parque de
      **Asukayama** para que la gente tuviera dónde ir. Y en Meiji, con el ferrocarril, la gente
      empezó a **viajar por el país** persiguiendo el color — que es exactamente lo que se sigue
      haciendo hoy.
  - heading: El frente de la hoja roja
    body: |
      Existe un ***kōyō zensen***, un «frente» del color que se publica y se sigue como la
      meteorología. Avanza en dos direcciones a la vez: **de norte a sur** —empieza en Hokkaidō en
      septiembre y termina en Kyūshū en diciembre— y **de arriba abajo**, de las cumbres a las
      ciudades.

      Ese doble movimiento es la clave de vuestro viaje. En un mismo país y en la misma semana, el
      otoño puede haber terminado a mil quinientos metros y no haber empezado a nivel del mar.
  - heading: Dónde caéis vosotros
    body: |
      Sin adornos, porque más vale saberlo:

      - [**Kamikōchi**](#kamikochi): su momento es **octubre**. Cuando lleguéis, el 12 de noviembre, los alerces
        estarán pelados. La ironía es que el **estanque Taishō y el puente Kappa** figuran en la lista
        oficial de los **veinte mejores lugares de Japón** para ver el color — y los vais a ver justo
        después.
      - **Tokio y Kamakura, en la ida**: el pico va del **20 de noviembre al 5 de diciembre**, y los
        días 2 a 5 caen del 7 al 10. Dos semanas antes: los arces virando, no ardiendo.
      - [**Kioto**](#kioto), del 16 al 19: su punto es **la segunda quincena**, así que llegáis justo al empezar
        la buena racha, y las **aperturas nocturnas** (*raitoappu*) de los templos ya habrán arrancado.
      - **Y Tokio otra vez, del 21 al 26 — que es la lotería.** Al volver caéis **de lleno dentro del
        pico**. La célebre avenida de ginkgos de [**Meiji Jingū Gaien**](https://www.google.com/maps/search/?api=1&query=Meiji%20Jingu%20Gaien%20Ginkgo%20Avenue%20Tokyo)
        —el número uno de casi todas las listas nacionales— amarillea hacia el **25 de noviembre** y
        **su festival cae del 23 al 30**: ciento cuarenta y seis árboles en trescientos metros, justo
        en vuestros días. Y el [**Rikugi-en**](https://www.google.com/maps/search/?api=1&query=Rikugien%20Garden%20Tokyo) y el [**Koishikawa Kōrakuen**](https://www.google.com/maps/search/?api=1&query=Koishikawa%20Korakuen%20Garden%20Tokyo), con iluminación nocturna.

      Es decir: el viaje reparte **las dos versiones del otoño japonés**. La de altura al principio
      —Kamikōchi pelado y nevado, sin nadie, con las cumbres blancas y el aire más transparente del
      año— y **la de ciudad al final, en su mejor semana**. Quien se baje el día 13 se queda con la
      primera, que no es la peor: es la que no sale en las postales y la que casi nadie ve.
  - heading: El caso raro de Nikkō
    body: |
      Todo lo anterior vale para el llano. En **la montaña el color se adelanta**, y eso convierte a
      [**Nikkō**](#nikko) en el caso más torcido del viaje: concentra **tres de los veinte mejores
      lugares del país** para el momiji —la cascada Ryūzu, Irohazaka y el distrito de Yumoto— y su
      momento es **de mediados de octubre a primeros de noviembre**.

      Es decir: **cuando aterrizáis, el 6 de noviembre, Nikkō está en su punto** — y cuando os toca ir,
      el día 19, ya ha pasado. La parte alta, la del lago Chūzenji y las cuarenta y ocho curvas de
      [Irohazaka](https://www.google.com/maps/search/?api=1&query=Irohazaka%20Winding%20Road%20Nikko), estará apagada. Abajo, en la zona del [Tōshōgū](https://www.google.com/maps/search/?api=1&query=Nikko%20Toshogu%20Shrine), todavía queda algo.

      Hay dos maneras de leer esto. La primera es asumirlo: **el santuario vale por sí solo**, es
      Patrimonio de la Humanidad y no depende de las hojas. La segunda es aprovechar que hay días
      comodín y **moverlo a la primera semana** — si alguien quiere Nikkō en color, hay que hacerlo
      pronto, no tarde.
  - heading: Si aun así queréis buscarlo
    body: |
      Lo que más color puede tener en vuestras fechas son los **jardines clásicos de Tokio**, que
      viran antes que la calle: el **Rikugien** y el [**Koishikawa Kōrakuen**](https://www.google.com/maps/search/?api=1&query=Koishikawa%20Korakuen%20Garden%20Tokyo), los dos en el top diez
      nacional y los dos con **iluminación nocturna** en temporada — comprobad las fechas, porque
      suelen arrancar hacia mediados de mes.

      Y hay una carta que sí cae de lleno en vuestra semana y que casi nadie tiene fichada:
      [**Shinjuku Gyoen**](https://www.google.com/maps/search/?api=1&query=Shinjuku%20Gyoen%20National%20Garden), a quince minutos andando de donde dormís. A principios de noviembre monta
      su **exposición de crisantemos** —el *kiku*, la flor imperial, presentada en estructuras
      entrenadas durante meses: cascadas de una sola planta con cientos de flores, ejemplares
      individuales de treinta centímetros de diámetro—. Es una tradición de la casa imperial que se
      abre al público unos días al año, entra en la entrada normal del jardín (**¥500**) y coincide
      exactamente con las fechas. De todo lo de esta ficha, es lo único que está **garantizado**.

      Los otros dos sitios de Tokio que salen en la lista nacional de los veinte mejores están más
      lejos pero funcionan en fechas tempranas porque **son de ginkgo, no de arce**: el
      [**Shōwa Kinen Kōen**](https://www.google.com/maps/search/?api=1&query=Showa%20Kinen%20Park%20Tachikawa) de Tachikawa (puesto 6) y la avenida **Kōshū Kaidō** de Hachiōji (puesto
      14), cuatro kilómetros de ginkgos amarillos. Los dos, a unos cuarenta minutos en tren.

      Y una advertencia útil: el ginkgo (***ichō***) y el arce (***momiji***) **no van a la vez**. El
      ginkgo amarillea más tarde. Si en una foto veis oro y rojo juntos, es de finales de mes.
curiosidades:
  - >-
    El **estanque Taishō y el puente Kappa de Kamikōchi** están en la lista oficial de los **veinte
    mejores lugares de Japón para el momiji**. Vais a dormir allí tres semanas después de su mejor
    momento — y a cambio, casi solos.
  - >-
    Japón publica un ***kōyō zensen***, un frente del color, como quien publica el parte del tiempo.
    Avanza de norte a sur y de las cumbres al mar, y tarda **casi tres meses** en cruzar el país.
  - >-
    Se dice que el shōgun **Tokugawa Yoshimune** mandó plantar cerezos y arces en el parque de
    Asukayama para que el pueblo de Edo tuviera dónde ir a ver las estaciones. Fue, en la práctica,
    uno de los primeros parques públicos pensados como tales.
