body: >-
  Tonkatsu en Ginza a ciento setenta metros de la boca de Higashi-Ginza, que es la parada del
  [Kabuki-za](#ginza). Su firma es un *katsudon* que no se hace como el clásico: en vez de cocer el
  filete rebozado en caldo y cerrarlo con huevo, aquí pasa antes por la brasa.


  Dos datos que condicionan el día. **No aceptan reservas** —se entra por orden de llegada— y el
  turno de comida es de once a tres, con última comanda a las 14:30. El día 20 pasa por Ginza entre
  las 11:30 y las dos de la tarde, así que encaja sin tocar nada, pero llegando pronto.


  Por la noche vuelve a abrir de cinco a ocho, con última comanda a las 19:30, que en Tokio es
  temprano. Si la idea es cenar aquí, hay que contarlo: no es un sitio al que se llegue a las nueve.
