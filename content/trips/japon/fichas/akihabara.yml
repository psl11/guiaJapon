title: Akihabara, que empezó vendiendo piezas de radio
image:
  src: img/fichas/akihabara.webp
  alt: "La calle principal de Akihabara con las fachadas cubiertas de carteles y neones de electrónica."
  credit: "Vasconium · CC BY-SA 2.0"
