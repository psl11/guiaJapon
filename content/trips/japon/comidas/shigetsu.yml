quePedir: >-
  El menú de tres bandejas, que es el intermedio. Llega todo a la vez, en laca, sentados en tatami mirando al jardín.
body: >-
  La ***shōjin ryōri*** es la cocina de los monasterios zen y **la más refinada que se come sentado en un tatami**: caldo de kombu y de shiitake, nada de ajo ni cebolla —el budismo los consideraba excitantes— y una técnica de la soja que tardó siglos en afinarse. No es una adaptación moderna para turistas: lleva ochocientos años funcionando igual.


  Lo que lo hace irrepetible es dónde se come: **dentro del Tenryū-ji**, el templo del que sale el bosque de bambú, con un jardín de Musō Sōseki del siglo XIV al otro lado del papel de arroz. Se entra por el recinto, se descalza uno y se come mirando a un Patrimonio de la Humanidad. **Solo sirve a mediodía**, así que o entra en el plan del día 13 o no entra.
