title: Los jazz kissa, cómo se escucha y dónde
area: Tokio, Yokohama, Kamakura y Kioto
note: "Silencio, caras enteras y una consumición · unos 400 en todo el país"
body: |-
  El *jazz kissa* es un café donde lo que se hace es escuchar discos: dos altavoces enormes, las
  sillas mirando hacia ellos y un dueño que elige la música. Es un invento japonés, y un reportaje
  reciente de *National Geographic* lo cuenta de punta a punta. El primero, el Blackbird, abrió en
  1929 junto a la Universidad de Tokio. Con la guerra se prohibió el jazz, que volvió en los
  cincuenta con los discos de los militares estadounidenses. Como los discos importados costaban
  una fortuna, el dueño hacía de maestro. *Moanin'* de Art Blakey y su gira de enero de 1961
  dispararon la moda, que pasó de ochocientos locales. Hoy quedan unos cuatrocientos, y Murakami
  escribió sus tres primeras novelas mientras regentaba el suyo, el Peter Cat, entre 1974 y 1981.

  **Cómo se entra**

  - **Una consumición y a escuchar.** La mayoría pone caras enteras de vinilo, no temas sueltos.
  - **Se mira lo que hacen los demás.** En los estrictos no se habla; en otros, en voz baja. Los
    japoneses lo llaman *kūki o yomu*, «leer el aire».
  - **Si quieres pedir un disco**, antes de que empiece la cara que suena.
  - **El móvil y las fotos, con permiso**, y sin flash.

  **Los que caen en el viaje**

  - **[Masako](https://www.google.com/maps/search/?api=1&query=Jazz%20Kissa%20Masako%20Shimokitazawa)**,
    en Shimokitazawa, de 1953: Mingus y Mal Waldron pasaron por allí. Cerró con la reforma del
    barrio y lo reabrió en 2020 Moeko Hayashi, que pincha los discos de la fundadora. Primer piso
    de Kitazawa 2-31-2; de 12:00 a 22:00, y en 2023 cerraba los jueves. Es la opción de escucha
    del miércoles 4, a dos paradas de Shibuya.
  - **[Eagle (いーぐる)](https://www.google.com/maps/search/?api=1&query=%E3%81%84%E3%83%BC%E3%81%90%E3%82%8B%20%E5%9B%9B%E8%B0%B7)**,
    en Yotsuya, de 1967. Lo abrió el crítico Masahiro Goto, y no se habla hasta las seis de la
    tarde, cuando pasa a ser un bar tranquilo. Es la alternativa de disco al directo del Pit Inn
    el jueves 5.
  - **El Eigakan**, en un callejón de Bunkyō, de 1978, con altavoces de bocina que su dueño hizo a
    mano en madera de fresno; **el Silencio**, en Nerima, que sirve alcohol; y **el Tónlist**, con
    jazz actual por unos Tannoy clásicos. Los tres, si se busca más.
  - **[Chigusa](#chigusa) y [Downbeat](#downbeat)**, en Noge, Yokohama: el más antiguo que sigue
    abierto, de 1933, y el de 1956, empapelado con páginas de la revista que le da nombre.
  - **El [Milk Hall](#milk-hall)** de Kamakura, el martes 3.
  - **En Kioto, para los tres**: el Yamatoya, de 1970, con estanterías de vinilo del suelo al techo,
    donde se reunían los estudiantes contra la guerra de Vietnam; y el Jazz in Rokudenashi,
    cavernoso y punk, donde se charla y se fuma con Monk de fondo.
  - **Y el clásico**: el [Lion](#meikyoku-kissa-lion) de Shibuya, de 1926, que es lo mismo con
    música clásica.

  **Lo que ya no**: el Dug de Shinjuku, que abrió en 1967 el fundador del Dig y que el reportaje
  todavía cita, cerró el 27 de junio de 2026 porque derriban el edificio. Y el Basie de Ichinoseki,
  el de mejor sonido del país según otros dueños de kissa, no abre al público desde la pandemia.
