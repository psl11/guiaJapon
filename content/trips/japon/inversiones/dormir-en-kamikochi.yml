kicker: Decisión de dinero · día 7
title: Dormir *dentro* de Kamikōchi
verdict: imprescindible
verdictLabel: Imprescindible
lede: >-
  Se puede hacer Kamikōchi en el día desde Matsumoto o desde Hirayu, y sale más barato. Pero entonces
  el viaje pierde exactamente aquello por lo que sube a la montaña.
ledger:
  - label: Cuesta
    body: >-
      Los hoteles del valle son **caros para lo que ofrecen** —son casas de montaña estacionales, no
      hoteles de ciudad— y suelen ir con **media pensión**, que en realidad conviene porque allí no hay
      otra cosa. Bastante más que una noche en Matsumoto.
  - label: Qué compra
    body: >-
      **Las dos horas que nadie más tiene.** Los autobuses entran a media mañana y salen a media tarde:
      quien duerme fuera solo ve el valle en su franja concurrida y con la luz peor. Dormir dentro
      compra **el atardecer, la noche sin una sola farola y, sobre todo, el amanecer** — que en
      noviembre significa escarcha, niebla levantándose del agua y el Hotaka nevado reflejado en el
      estanque Taishō, sin viento y sin nadie.


      Es, con diferencia, la mejor fotografía posible de las tres semanas.
  - label: La alternativa
    body: >-
      [**Hirayu Onsen**](https://www.google.com/maps/search/?api=1&query=Hirayu%20Onsen%20Takayama), montaña abajo, a unos veinticinco minutos en autobús: pueblo termal, más barato
      y con más camas. Sirve para entrar al valle al día siguiente… pero **a la hora del primer
      autobús**, que es bastante después del amanecer.
  - label: Veredicto
    body: >-
      **Imprescindible, y es lo primero que hay que reservar del viaje.** Aquí sí va el dinero: subir a
      un valle cerrado al tráfico para verlo en su horario de autobuses es pagar el viaje y quedarse
      con la parte mala. Y ojo, que no es solo dinero — **el Shirakabaso cierra el 14 de noviembre** y
      sus reservas abrieron en enero.
curiosidades:
  - >-
    El valle **cierra el 15 de noviembre** y los hoteles cierran antes que la carretera. Dormís allí
    dos noches antes del cierre de temporada: sois de los últimos huéspedes del año.
