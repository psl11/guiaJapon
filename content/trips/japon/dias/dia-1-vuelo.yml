title: Barcelona — Tokio, *ocho husos* al este
dek: >-
  El día que no existe del todo: se sale de Barcelona por la mañana y se aterriza en Tokio de noche,
  con el calendario intacto y el cuerpo ocho horas por detrás. Lo único que hay que hacer hoy es
  llegar al hotel y no cenar a las tres de la madrugada.
blocks:
  - block: El vuelo
    time: "todo el día"
    title: Ocho horas de ventaja
    body: >-
      Japón va **ocho horas por delante** de Barcelona en noviembre. Volando al este eso significa que
      el día se come a sí mismo: se despega por la mañana, se vuela unas quince horas con una escala, y
      se aterriza a las **19:00 del mismo viernes**. En el reloj del cuerpo son las once de la mañana.
      Por eso nadie va a tener sueño al llegar, y por eso mañana os despertaréis a las cinco sin
      despertador — un fastidio en cualquier viaje y **un regalo en este**, como se verá.
    window:
      label: Qué hacer en el avión
      body: >-
        La regla que funciona: **poner el reloj en hora japonesa al despegar** y comer y dormir según
        ese horario, no según el hambre. Y si vuestro vuelo cruza el amanecer, mejor no dormir las
        últimas horas: llegar cansado a las siete de la tarde es exactamente lo que os conviene para
        caer rendidos a las once y amanecer sincronizados.
  - block: Llegada
    time: "19:00"
    title: Del aeropuerto a Shinjuku
    body: >-
      Trámite de entrada, dinero y datos —los tres primeros movimientos— y al hotel. De **Narita** al
      centro se tarda entre 60 y 90 minutos; de **Haneda**, la mitad. A esa hora ya no hay luz que
      aprovechar ni ganas de agenda: el plan es dejar las maletas en **Shinjuku**, que es la base de
      estos cinco primeros días, y salir a la calle diez minutos.
    window:
      label: Por qué no forzar la primera noche
      body: >-
        Es tentador salir a por el primer bol de ramen a las diez de la noche, y de hecho se puede: en
        Shinjuku hay cocina hasta la madrugada. Pero mañana el cuerpo os va a levantar de madrugada
        queráis o no, y la primera mañana es la mejor de las cinco. **Cenad algo cerca y a dormir
        pronto.** Ya habrá noches.
  - block: Noche
    time: "primera noche"
    title: Diez minutos de Shinjuku
    dim: true
    body: >-
      Si queda cuerpo para algo, que sea el paseo corto: **salir de la estación por la boca este y
      mirar arriba**. Las pantallas, el gato tridimensional de Shinjuku, la marea de gente a las diez
      de la noche de un viernes. Para tres de vosotros es la primera imagen de Japón, y conviene que
      sea esta y no el techo de una habitación de hotel — quince minutos bastan.
alt:
  label: Si te desmarcas
  body: >-
    Ya conoces la llegada, así que el margen está en el aeropuerto: si acabáis en **Narita**, el
    Skyliner es rápido pero el **Narita Express** deja directamente en Shinjuku sin transbordo con
    cuatro maletas, que a esa hora vale más que los diez minutos de diferencia. Y si el vuelo llega
    con adelanto, la **terminal de Haneda** tiene una réplica de calle de Edo en la planta cuarta que
    se ve en veinte minutos y que a los otros tres les va a hacer más gracia de la que parece.
