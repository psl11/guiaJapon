body: >-
  Abrió en 2020 con una idea concreta: mezclar el *udon* blando de Fukuoka con el elástico de Sanuki.
  **Nada está precocido** —se amasa, se corta y se hierve al pedirlo—, que es lo que explica la
  textura y también la espera.


  Está en Sendagaya, a un paso de [Harajuku](#harajuku), o sea dentro del radio del día 9. Y el
  horario recorta: de martes a viernes abre a mediodía y por la noche, **el sábado solo a mediodía,
  de 11:30 a 15:30, y domingos y lunes cierra**. El día 9 es sábado, así que hay una única ventana.


  **Solo efectivo.** Ni tarjeta ni móvil, que en un barrio como este descoloca a mucha gente.
