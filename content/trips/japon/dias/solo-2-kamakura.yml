eyebrow: En solitario · mar 3 nov · festivo
title: Kamakura *con la familia*, por el lado que no va el grupo
dek: >-
  Hoy no vas solo: es el Día de la Cultura, festivo nacional, y la familia que vive en Tokio te
  lleva a su Kamakura. Empieza por el este, por tres templos de colina que el grupo no pisará el
  sábado 14 en el [día 9](#dia-9-kamakura), y acaba en el mar. Los otros tres harán el recorrido
  clásico de norte a sur; tú haces el de quien vive aquí.
