queEs: >-
  Ciruela ***ume*** verde —que en realidad es más albaricoque que ciruela— macerada en alcohol con azúcar durante meses. Sale un licor **dulce, ácido y de unos 12 grados**, que se bebe con hielo, con soda o caliente en invierno. Es la puerta de entrada más fácil a la bebida japonesa.
historia: >-
  Es sobre todo **una bebida casera**: durante generaciones, cada casa japonesa preparaba su tarro en junio, cuando sale la *ume* verde, y lo abría al año siguiente. Todavía se vende la ciruela en cajas en junio con el azúcar de roca al lado. Hasta 1962 hacerlo en casa era técnicamente ilegal —la ley de impuestos sobre el alcohol— y el Estado acabó cediendo porque no había manera de impedirlo.
dondeMejor: "En cualquier sitio · y en las casas antiguas, con el suyo propio"
picante: "—"
body: >-
  Es la bebida que resuelve la mesa cuando no todo el mundo bebe igual: dulce, floja y con hielo, funciona para quien no quiere sake ni cerveza. Y la ciruela del fondo del vaso se come.


  Si veis un izakaya con un tarro grande de cristal detrás de la barra, con la fruta dentro y una etiqueta escrita a mano con una fecha, es **su *umeshu* de la casa** y merece pedirse. La fecha es el año en que lo pusieron.
