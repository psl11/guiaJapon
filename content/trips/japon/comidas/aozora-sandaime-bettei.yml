body: >-
  Ocho asientos de barra en el primer piso de un edificio del mercado exterior, con el cocinero
  delante y el pescado de esa mañana. Es el anexo, el *bettei*, de Aozora Sandaime, otra casa de
  sushi de Tsukiji, y a mediodía tiene un menú corto que permite sentarse a una barra de verdad sin
  pagar lo de la noche.


  **Pablo comió aquí y le encantó.** El problema es el día. Tsukiji toca el miércoles 25, y Yahoo!
  Travel e Hitosara dan el miércoles como cierre semanal, mientras que Hot Pepper y Retty solo dicen
  lunes. Antes de contar con él, mirad la reserva en Tabelog para ese día: si deja reservar, abre.
