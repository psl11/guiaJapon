body: >-
  La barra clásica del desayuno de sushi, y **el aviso que importa: ya no está en Tsukiji**. Cuando
  la lonja mayorista se mudó a **Toyosu en 2018**, Daiwa Sushi y su eterno rival Sushi Dai se
  mudaron con ella. Quien vaya al mercado exterior de Tsukiji buscándolas se lleva el chasco.


  Aquí se desayuna pescado que ha pasado por la subasta esa misma madrugada, sentado en una barra de
  una docena de plazas, con los cortes puestos delante uno a uno. La cola de Daiwa siempre ha sido
  **más corta y más rápida que la de Sushi Dai**, que es su principal argumento a las siete de la
  mañana.


  Encaje honesto con vuestro plan: **esto es otro madrugón y otro sitio**. Toyosu no cae de camino a
  nada, y vuestro día de mercado es Tsukiji. Va aquí como la alternativa del que se desmarca.
