body: >-
  **Disk Union** es la cadena de segunda mano de Tokio, y tiene una costumbre que conviene saber
  antes de entrar: no hace tiendas grandes, sino una por género, repartidas por Shinjuku,
  Ochanomizu y Shibuya. Esta es la de jazz de Ochanomizu, en un primer piso con la entrada a pie de
  calle: vinilo nuevo y usado, CD, libros y revistas, y solo jazz.


  Cae a diez minutos de [Jinbōchō](#jimbocho), cerca de la estación de Ochanomizu, y es el sitio
  donde buscar las ediciones japonesas de los clásicos y el jazz japonés de los setenta. El horario
  cambia según la tienda: míralo en su web antes de ir.
