title: El día de comprar, que en Tokio *es una disciplina*
dek: >-
  Un domingo entero sin agenda, con las maletas grandes de vuelta y la lista de regalos por hacer.
  Se compra en un solo barrio que el viaje todavía no ha pisado, y la tarde es para los jardines.
