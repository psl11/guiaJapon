body: >-
  Metido en un callejón de [Ebisu](#ebisu-meguro), abierto en **2010** y desde entonces el sitio de Tokio para la absenta. Local diminuto, luz de otro siglo y una carta que rota. Entró de nuevo en la lista de **Asia's 50 Best Bars en el número 53** de la edición de 2026.


  Es más informal que los templos de Ginza: se puede entrar sin ceremonia, se puede charlar y no hace falta saber qué se quiere. Buen primer bar de una noche que siga por el barrio.
