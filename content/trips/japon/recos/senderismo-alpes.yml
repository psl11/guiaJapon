title: Andar por los Alpes, de menos a más
area: Kamikōchi, Okuhida, Takayama y Shirakawa-gō · días 4 a 6
note: "Del paseo llano a una subida de dos horas y media · con el track para el reloj · ninguna cumbre en noviembre"
body: |-
  En noviembre los Alpes ya son invierno por arriba. Los refugios de altura cierran a primeros de
  mes y las cumbres de tres mil metros piden crampones y oficio, así que todo lo de esta tarjeta se
  queda por debajo de los 2.400 metros y en sendas marcadas. Va ordenado de menos a más, y cada
  ruta lleva un track de Wikiloc o AllTrails para seguirla en el reloj (cómo, al final). En
  Kamikōchi, las distancias y los tiempos son los de la
  [guía de sendas oficial](https://www.kamikochi-vc.or.jp/watch-walk/course-guide) del centro de
  visitantes.

  **Para todos, llano o casi**

  - **Kamikōchi, del estanque Taishō al Kappabashi.** Unos cuatro kilómetros y hora y veinte por el
    sendero de naturaleza, que es la tarde del [día 4](#dia-4-kamikochi). Entre Tashiro y el Taishō
    se elige entre dos variantes: la del río, mirando al Yakedake, y la del bosque, por pasarelas.
    Track: [AllTrails, Kamikochi Walking Tour](https://www.alltrails.com/trail/japan/nagano/kamikochi-walking-tour),
    con más de doscientas reseñas, que sigue del Taishō hasta Myōjin y vale también para la mañana.
  - **Kamikōchi, del Kappabashi al estanque Myōjin.** Tres kilómetros y una hora por sentido, sin
    cuestas. Se puede ir por una orilla y volver por la otra, que es la vuelta circular de 7,7
    kilómetros de [AllTrails](https://www.alltrails.com/trail/japan/nagano/myojin-ike-pond-loop), la
    ruta mejor valorada del valle, con casi mil reseñas.
  - **El salto de Hirayu.** Sesenta y cuatro metros de caída, de la lista de los cien saltos de agua
    de Japón, a unos veinte o treinta minutos andando desde la terminal de autobuses de Hirayu. Cabe
    la mañana del día 5, antes del desayuno. El último tramo hasta el salto, 1,4 kilómetros ida y
    vuelta, en [AllTrails](https://www.alltrails.com/trail/japan/gifu/hirayu-otaki-falls-trail).
  - **El Higashiyama Walking Course de Takayama** (unos 3,5 kilómetros y hora y media entre
    templos), con el [mapa oficial](https://www.japan.travel/en/au/news-blog/higashiyama-walking-course-in-takayama/)
    de la oficina de turismo de Japón y track en
    [Wikiloc](https://www.wikiloc.com/walking-trails/higashiyama-walking-course-26329656), y **el
    mirador de Shiroyama** en Shirakawa-gō (veinte minutos de subida señalizada, o cinco en el
    microbús de pago que sale del pueblo; no hace falta track). El primero es la alternativa del
    día 5, si os quedáis en Takayama por la tarde; el segundo está en el 6.

  **Nivel medio**

  - **Del Kappabashi a Tokusawa.** Unos 7 kilómetros por sentido y dos horas, por bosque llano: la
    pradera donde arrancan las rutas a las cumbres. Es largo más que duro, de 13 a 14 kilómetros ida
    y vuelta. Con el autobús que tenéis, que llega a las 09:45, ya no cabe el día 4 sin perder la
    tarde del estanque Taishō: es para quien prefiera andar a ver los dos tramos del río. El refugio de Tokusawa cierra a primeros de
    noviembre, así que comida y agua van encima. Track:
    [Wikiloc, de Kamikōchi a Tokusawa](https://www.wikiloc.com/hiking-trails/kamikochi-a-tokusawa-japon-174723603),
    en español.
  - **El castillo de Matsukura, en Takayama.** Un kilómetro de sendero desde Hida no Sato, media
    hora de subida, hasta las ruinas de un castillo de montaña a 857 metros con la ciudad y los Alpes
    delante. No hay un track publicado que merezca la pena, pero el sendero sale señalizado junto a
    Hida no Sato, y el Ayuntamiento de Takayama tiene un
    [mapa del castillo](https://www.city.takayama.lg.jp/kurashi/1000021/1000119/1000847/1000954/1000964.html)
    con el acceso.

  **Algo más técnico, solo con la senda seca**

  - **Dakesawa, en Kamikōchi.** Dos horas y media de subida y dos de bajada desde el Kappabashi, unos
    650 metros de desnivel por bosque y pedrera hasta los 2.170 metros, debajo de la pared de los
    Hotaka. El refugio cierra el 3 de noviembre, así que el día 9 no hay nadie arriba. Sustituye al
    paseo de Myōjin de la mañana, y si en la pedrera hay hielo o nieve, se da la vuelta. Track:
    [Wikiloc, Kamikōchi–refugio Dakesawa](https://www.wikiloc.com/hiking-trails/kamikochi-refugio-dakesawa-146851827).
  - **Shinhotaka y el refugio Nishiho.** El teleférico sube a 2.156 metros en dos tramos, y desde la
    estación de arriba una senda de bosque y piedra lleva en una o dos horas, según el paso, al
    refugio Nishiho, a 2.367 metros, que abre todo el año. Con nieve hacen falta cadenas para las
    botas. Sin ellas, el mirador de la estación ya vale el viaje. Es el plan B del día 4 si el valle
    amanece cerrado. Track:
    [AllTrails](https://www.alltrails.com/trail/japan/nagano/nishi-hotakaguchi-nishiho-sanso-kamikochi),
    que sigue del refugio hasta Kamikōchi: vosotros, hasta el refugio y vuelta por donde se ha
    subido.

  **Lo que no, en estas fechas:** el Yarigatake, los Hotaka, la cresta del Dokuhyō por encima del
  refugio Nishiho y el Yakedake, que es un volcán activo y cuya senda por el lado de Kamikōchi,
  además, está cerrada desde junio por desprendimientos. En noviembre son alta montaña invernal.

  **Antes de salir**

  - **Osos.** En estos bosques hay osos negros y 2026 lleva récord de avistamientos en el país: id
    juntos, con un cascabel o hablando, y sin salir de la senda.
  - **Luz.** Anochece hacia las 16:40 y en el fondo del valle antes. Lo de subir, que esté abajo a
    las tres.
  - **Frío y calzado.** Bajo cero a primera hora, guantes y botas con suela de montaña, que en
    Dakesawa y Tokusawa el barro y la escarcha resbalan. Más en [el equipaje](#equipaje).

  **El track en el Apple Watch**

  1. **Wikiloc, en el iPhone y en el reloj.** Seguir una ruta y mandarla al reloj es de Wikiloc
     Premium, que tiene catorce días de prueba gratis: activada hacia el 1 de noviembre, cubre del 8
     al 11. Si no se quiere pagar después, hay que cancelarla antes de que acabe.
  2. **En el hotel, con wifi**, se abre cada enlace en la app, se guarda la ruta y se deja disponible
     sin conexión. En Kamikōchi la cobertura va y viene, y sin eso el mapa sale en blanco.
  3. **En la senda**, «Seguir ruta» y al reloj: avisa cuando uno se sale del trazado.
  4. **Y de respaldo**, el [mapa oficial de sendas de Kamikōchi](https://www.kamikochi.or.jp/learn/parkmap/)
     descargado en el móvil, por si el reloj se queda sin batería con el frío.

  Los de AllTrails se abren en su propia app. En el Apple Watch funciona acompañando al
  iPhone, que tiene que ir en el bolsillo, y los mapas sin conexión son de su versión de pago.


  Son rutas que ha subido gente que las hizo, no trazados oficiales: el camino señalizado manda
  sobre el track. Y donde el track va más allá de lo que propone esta tarjeta, se da la vuelta
  donde dice la tarjeta.
