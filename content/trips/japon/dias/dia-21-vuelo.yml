slug: dia-21-vuelo
navLabel: "Día 21 · Vuelo"
trip: japon
order: 21
eyebrow: El plan · Día 21 · jue 26 nov
title: El último día, que *dura hasta las nueve*
dek: >-
  El vuelo sale a las 21:00, así que hoy no es un día de aeropuerto: son ocho horas útiles de ciudad
  con la maleta ya cerrada. Solo hay que resolver dónde dejarla.
blocks:
  - block: Mañana
    time: "09:00–10:00"
    title: "Lo primero: soltar el equipaje"
    body: >-
      Tres opciones, de mejor a peor: **dejarlo en el hotel** después del *check-out* —casi todos lo
      guardan hasta la tarde y es gratis—; las **consignas de estación**, que se pagan con la tarjeta
      IC y en [Shinjuku](#shinjuku) o Tokio hay a cientos, aunque las grandes se llenan pronto; o **mandarlo al
      aeropuerto por [takkyūbin](#takkyubin)** el día anterior, que es la opción cómoda si sobra
      presupuesto.

      Con las manos libres, el día empieza de verdad.
  - block: Mediodía
    time: "10:00–15:00"
    title: Las últimas compras, y lo que falte
    body: >-
      Es el día de rematar la lista: el ***depachika*** de [Ginza](#ginza) para la comida que se lleva
      a casa —té, dulces, encurtidos envasados—, la papelería, y lo que se vio hace dos semanas y no
      se compró. Aviso de aduana: **la fruta fresca y las plantas no pasan**, y algunos productos
      cárnicos tampoco.

      Y si sobra tiempo, algo tranquilo y cerca: el jardín [**Hama-rikyū**](https://www.google.com/maps/search/?api=1&query=Hamarikyu%20Gardens%20Tokyo), que está a un paso de
      Ginza, tiene una casa de té sobre un estanque de agua salada y **de su embarcadero sale el
      ferry por el Sumida**.
  - block: Tarde
    time: "15:00–18:00"
    title: Al aeropuerto
    body: >-
      Contad **hora y media larga** desde el centro, más el margen del aeropuerto. Desde Shinjuku, el
      **Narita Express** va directo; a Haneda es la mitad de tiempo. Con vuelo a las 21:00, salir del
      centro a las 17:00 es cómodo y a las 18:00 es justo.
    window:
      label: Antes de pasar el control
      body: >-
        Dos trámites de última hora: **devolver la tarjeta IC** si es física y se quiere recuperar la
        fianza —**solo se puede en Haneda, no en Narita**—, y **el tax-free**, que este año podría
        haber cambiado al reembolso en aeropuerto: si es así, las compras tienen que ir **sin abrir**
        y hay mostrador antes del control. Ver [dinero](#dinero).
  - block: Noche
    time: "21:00"
    title: Ocho husos al oeste
    dim: true
    body: >-
      Veintiún días, nueve camas, dos mares y una montaña que puede que se dejara ver. Volando al
      oeste el día se estira: se despega de noche y se aterriza en Barcelona **el mismo día 26**, con
      el desfase ahora en contra y una semana de sueño desordenado por delante.

      Y queda pendiente lo que no cupo — que en Japón es siempre casi todo. Por eso se vuelve.
alt:
  label: Si te desmarcas
  body: >-
    Si el vuelo sale de **Haneda** en vez de Narita, el día gana dos horas y el aeropuerto tiene
    premio: en la **Terminal 3 hay una réplica de una calle de Edo** en la cuarta planta, con puestos
    y farolillos, y una terraza al aire libre desde la que se ven despegar los aviones. Es la mejor
    espera de aeropuerto de Asia.
