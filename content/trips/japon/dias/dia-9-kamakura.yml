eyebrow: El plan · Día 9 · sáb 14 nov
title: El adiós, y Kamakura, la capital *de los guerreros*
dek: >-
  El día se parte en dos a primera hora: uno coge el Skyliner hacia Narita y los otros tres el tren
  hacia el mar. Una hora de tren y se cambia de país. Kamakura fue la capital de Japón durante siglo y medio, la de
  los samuráis y no la de los emperadores, y hoy es un pueblo de mar con templos zen entre montañas.
  Se hace de norte a sur, cuesta abajo, y se acaba en la playa.
