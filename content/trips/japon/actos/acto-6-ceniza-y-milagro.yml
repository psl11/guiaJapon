kicker: Historia de Japón · acto sexto de seis
title: Ceniza y milagro — *el Tokio que pisáis*
lead: >-
  Hay una pregunta que se hace todo el que llega por primera vez: por qué una ciudad con mil años de
  historia **no tiene casco antiguo**. La respuesta son dos fechas. El 1 de septiembre de 1923,
  el gran terremoto de Kantō y los incendios que lo siguieron mataron a más de cien mil personas y
  arrasaron media ciudad. Y la noche del 9 al 10 de marzo de 1945, trescientos B-29 la volvieron
  a quemar.
body: |
  Aquel bombardeo incendiario sobre una ciudad de madera y papel es, con toda probabilidad, **la
  noche más letal de la historia de la guerra aérea**: en torno a cien mil muertos en unas horas y
  un millón de personas sin casa. Tokio se rehízo entera después de 1945, deprisa y sin plan, y por
  eso es la ciudad que es: un tejido bajo y denso, sin centro monumental, donde lo antiguo aparece a
  parches y por accidente.

  Lo que vino después tiene pocos precedentes. Con la constitución de 1947 —que en su artículo 9
  renuncia a la guerra—, la industria protegida y una tasa de ahorro brutal, Japón creció a más del
  9 % anual durante casi veinte años. El país que se había rendido en 1945 organizó los **Juegos
  Olímpicos de 1964**, y diez días antes de la ceremonia inauguró el Tōkaidō Shinkansen: el
  primer tren de alta velocidad del mundo, a 210 km/h, cuando en Europa no existía nada parecido.
  Aquellos Juegos fueron la carta de reingreso, y dejaron su manifiesto construido: el Gimnasio
  Nacional de Yoyogi de Kenzō Tange, con una cubierta de acero suspendida como la de un puente
  colgante — la prueba de que el país podía hacer algo que no había hecho nadie. Sigue en pie, y se
  volvió a usar en los Juegos de 2020.

  > En 1989 el valor del suelo del Palacio Imperial de Tokio se estimaba —sobre el papel— por encima
  > del de **todo el estado de California**.

  Aquella burbuja reventó en 1991 y dio paso a lo que aquí llaman las **décadas perdidas**: treinta
  años de crecimiento plano, deflación y una población que empezó a encoger. El Japón que vais a ver
  es el de después de todo eso — más tranquilo y menos triunfal que el de los ochenta, todavía
  extraordinariamente rico en lo cotidiano, y peleándose con una demografía que se le va de las
  manos. Es también, y no es casualidad, un país que cuida obsesivamente lo que funciona: el tren
  puntual al segundo, la calle sin una colilla, el [konbini](#konbini) abierto a las cuatro de la mañana con
  comida decente.
connect:
  label: Lo veréis sobre el terreno
  body: |
    [**Yanaka**](#yanaka), el día 2, es la excepción que prueba la regla: uno de los poquísimos barrios que se
    libró **de las dos catástrofes**, y por eso conserva casas bajas, callejones y un cementerio
    precioso. Pasear por Yanaka es ver lo que era el resto de la ciudad antes de que ardiera dos
    veces.

    Y el contraste está a media hora de metro: desde la azotea de [**Shibuya Sky**](https://www.google.com/maps/search/?api=1&query=Shibuya%20Sky%20Tokyo), el día 3, se ve
    hasta el horizonte la ciudad que se levantó después de 1945 — sin un solo edificio anterior a esa
    fecha en kilómetros a la redonda.
