title: Lo que hay que sacar con antelación
area: Tokio · antes de salir
status: pendiente
note: "Shibuya Sky · teamLab · el bus de Kamikōchi"
body: >-
  Tokio se improvisa casi entero, pero hay tres cosas que no:


  **Shibuya Sky** — la azotea abierta. Se reserva online y **las franjas del atardecer se agotan con
  días de antelación**; la buena es la de las **16:00** (el sol se pone a las 16:40 en noviembre).


  **teamLab Borderless** — entrada con día y hora, y se llena. Ojo al calendario: cierra el **primer
  y tercer martes** de mes, pero **los lunes abre**, que es cuando os toca.


  **El autobús a Kamikōchi** — los directos desde Matsumoto **se llenan** y se compran online. No es
  un trámite de aeropuerto: es el acceso a un valle sin coches.


  Y dos que se comprueban, no se reservan: la cartelera del **Kabuki-za** —las entradas de un acto
  (*hitomakumi*) se venden en taquilla el mismo día— y, si alguien quiere la **subasta de atún de
  Toyosu**, el registro para la sala acristalada, que se hace con semanas de antelación y va por
  sorteo. La pasarela de arriba, en cambio, es libre y no pide nada.
