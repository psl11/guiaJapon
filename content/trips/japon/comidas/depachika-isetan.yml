quePedir: >-
  Componer una cena: encurtidos, ensaladas, *inari-zushi*, una caja de wagashi y algo de la pastelería francesa, que en Japón está al nivel de París.
body: >-
  La ***depachika*** —el sótano de comida de unos grandes almacenes— es una de las mejores invenciones gastronómicas de Japón y la de **Isetan** es la que todo el mundo cita: dos plantas de mostradores, cada uno de una sola cosa, con productores que llevan tres generaciones vendiendo un solo encurtido.


  Tiene dos usos prácticos en este viaje. Uno, **cena de habitación decente** cuando no queda cuerpo. Dos, y más importante: es donde se compra el ***ekiben*** bueno antes de un tren largo, en vez del de la estación.
