slug: dia-20-tsukiji-ginza
navLabel: "Día 20 · Tsukiji y Ginza"
trip: japon
order: 20
eyebrow: El plan · Día 20 · mié 25 nov
title: El último día entero, y *la semana en que la ciudad se pone roja*
dek: >-
  Mañana solo hay medio día antes del vuelo, así que este es el último completo — y cae dentro de la
  quincena buena del [momiji](#momiji) de Tokio, que es la razón aritmética de haber guardado la
  ciudad para el final. Un mercado, un sótano de grandes almacenes y un jardín de agua salada.
blocks:
  - block: Mañana
    time: "09:00–11:30"
    title: Tsukiji, que hoy sí
    body: >-
      El mercado mayorista se mudó a [Toyosu](https://www.google.com/maps/search/?api=1&query=Toyosu%20Market%20Tokyo) en 2018, pero [**el mercado exterior de Tsukiji se quedó**](#tsukiji)
      —cuatrocientos puestos de pescaderos, cuchilleros, tiendas de alga y barras de desayuno— y es
      donde de verdad se come. *Tamagoyaki* en pincho, ostras abiertas al momento, atún a la brasa,
      *dashimaki*: se desayuna de pie y a base de picar. Y no se compra nada en el primer puesto: se
      da una vuelta entera y luego se decide.
    window:
      label: Ventana óptima
      body: >-
        Doble motivo para que sea hoy y a esta hora. **Tsukiji cierra los domingos**, así que de
        vuestros tres días de Tokio este es el único que encaja. Y dentro del día, la franja es
        estrecha: antes de las 9:00 la prioridad la tienen los compradores profesionales y no es
        vuestro sitio; a partir de las 13:00 empieza a cerrar y a las 15:00 no queda nada. Entre
        las nueve y las once y media está todo abierto y aún se puede andar.
  - block: Mediodía
    time: "11:30–14:00"
    title: Ginza, y el Japón que se mira a sí mismo
    body: >-
      Se sube andando desde el mercado a **Ginza**, que es la respuesta japonesa a la avenida de lujo
      y no se parece a ninguna: aquí los grandes almacenes son instituciones y hay que bajar al sótano.
      El *depachika* —la planta de alimentación bajo los *depāto*, en el [Mitsukoshi](https://www.google.com/maps/search/?api=1&query=Ginza%20Mitsukoshi%20Tokyo) o el
      Matsuya— es uno de los espectáculos de esta ciudad: dos mil metros cuadrados de comida
      presentada como joyería, con melones de cien euros y mostradores de *[wagashi](#wagashi)* que parecen un
      muestrario de estaciones. Se prueba, se compra la comida de mañana en el tren, y no se paga
      entrada por nada de esto.
    window:
      label: Por qué el depachika
      body: >-
        Porque es el sitio donde mejor se entiende de golpe la relación de este país con la comida:
        el envoltorio, la estacionalidad, la obsesión por el producto perfecto. Y porque hoy es el
        último día con tiendas abiertas y calma para mirar — **mañana esto mismo se hace con prisa y
        con la maleta ya cerrada**. De aquí sale además el mejor *ekiben* posible para un tren, y
        conviene saberlo antes de que llegue el del aeropuerto.
  - block: Tarde
    time: "14:00–16:30"
    title: Un jardín de agua salada, y el kilómetro cero
    body: >-
      Diez minutos andando desde Ginza hacia el mar está
      [**Hama-rikyū**](https://www.google.com/maps/search/?api=1&query=Hamarikyu%20Gardens%20Tokyo), que
      era el coto de caza de los Tokugawa y hoy es un jardín rodeado de rascacielos. Tiene una
      particularidad que no tiene ningún otro de la ciudad: **su estanque es de agua de mar y sube y
      baja con la marea**, porque está conectado con la bahía por una compuerta. En medio hay una
      casa de té a la que se llega por tres puentes de madera, y donde por unos pocos cientos de
      yenes sirven *matcha* batido y un dulce mirando el agua. Es el último sitio tranquilo del
      viaje y está en su mejor semana del año.

      Y de vuelta hacia el norte, quince minutos, se cierra el paseo en
      [**Nihonbashi**](https://www.google.com/maps/search/?api=1&query=Nihonbashi%20Bridge%20Tokyo): el
      puente que era el kilómetro cero de todas las carreteras del país —de él se medían las
      distancias del [Tōkaidō](#kioto) que bajasteis en tren— y que hoy vive humillado bajo una
      autopista de hormigón levantada para los Juegos del 64. Es una imagen que cuenta el siglo XX
      japonés mejor que un museo.
    window:
      label: Por fin, el momiji de la ciudad
      body: >-
        Aquí se cobra la apuesta que ordena el itinerario entero. **El pico de la hoja roja en Tokio
        va del 20 de noviembre al 5 de diciembre**, así que hoy estáis dentro: es exactamente por
        esto por lo que la ciudad se guardó para el final en vez de gastarla en la primera semana.
        Ver [el momiji](#momiji).

        Y hoy justamente amarillea la avenida de ginkgos de
        [**Meiji Jingū Gaien**](https://www.google.com/maps/search/?api=1&query=Meiji%20Jingu%20Gaien%20Ginkgo%20Avenue%20Tokyo),
        que va con su calendario propio y cae hacia el 25. Son ciento cuarenta y seis árboles en
        trescientos metros y está a media hora de aquí: si alguien quiere cambiar Nihonbashi por eso,
        hoy es el día exacto y no otro.
  - block: Noche
    time: "noche"
    title: Luz artificial
    body: >-
      Para cerrar la última noche entera, algo que solo funciona de noche:
      [**teamLab Borderless**](https://www.google.com/maps/search/?api=1&query=teamLab%20Borderless%20Azabudai%20Hills%20Tokyo), en Azabudai Hills. Salas sin mapa donde las obras se salen de una
      habitación y entran en la siguiente, y donde uno acaba descalzo en un estanque de luz. Es
      espectáculo digital y no arte antiguo, y a tres primerizos les va a parecer lo más japonés del
      viaje aunque no lo sea en absoluto. **Hay que comprar la entrada con días de antelación** y ojo
      con el calendario: **cierra el primer y el tercer martes de mes**, lo cual hoy no estorba, pero
      la entrada se compra con fecha y hora y no se cambia.
alt:
  label: Si te desmarcas
  body: >-
    Si teamLab ya lo tienes visto, hoy es miércoles y no cierra nada, así que la carta está entera.
    El [**Museo Nezu**](https://www.google.com/maps/search/?api=1&query=Nezu%20Museum%20Tokyo) es la
    mejor opción y hoy sí abre —cierra los lunes—: un edificio de Kengo Kuma con un jardín en cuesta
    que no parece Tokio, y que en la última semana de noviembre tiene sus propios arces.

    Y sin moverse del mediodía, el **Kabuki-za de Ginza** vende *hitomakumi*, entradas de un solo acto, en taquilla y para
    el mismo día, por unos pocos euros. Entras, ves cuarenta minutos de kabuki desde el cuarto piso y
    te vas. Es exactamente la dosis correcta la primera vez.