title: Lo que hay que sacar con antelación
area: Tokio · antes de salir
status: reservado
note: "Shibuya Sky · teamLab Planets · el bus de Kamikōchi · el Kodama del Fuji, todo comprado"
body: >-
  Tokio se improvisa casi entero, pero hay cuatro cosas que no:


  [**Shibuya Sky**](https://www.google.com/maps/search/?api=1&query=Shibuya%20Sky%20Tokyo) — la azotea abierta. **Comprado**: los sofás de
  [THE ROOF](#pablo-the-roof-shibuya-sky) para los cuatro, entrada de 14:35 a 14:50 del viernes 13
  y sofá de 15:00 a 15:50. Las entradas salen a las 0:00 de Japón catorce días antes, y el turno de
  las 16:00 se agotó en pocos minutos.


  [**teamLab Planets**](https://www.google.com/maps/search/?api=1&query=teamLab%20Planets%20TOKYO%20Toyosu) — **comprado** para el miércoles 25: el de Toyosu, el del agua, en vez del Borderless de Azabudai. Entrada con día y hora; se anda descalzo
  por agua hasta las rodillas, así que pantalón que se remangue.


  **El autobús a Kamikōchi** — los directos desde Matsumoto **se llenan** y se compran online. No es
  un trámite de aeropuerto: es el acceso a un valle sin coches. **Ya está comprado**: el de las
  08:40 desde Shin-Shimashima el lunes 9, para los cuatro, a nombre de Alba.


  **El Kodama a Shin-Fuji del 23 de noviembre** — la excursión del [Fuji](#fuji) recoge a las 8:30 y ese lunes
  es **festivo con puente**. **Comprado** en SmartEX: el de las **07:04 desde Shinagawa**, reserva
  2000, para los tres. Con la misma cuenta están comprados los otros cuatro Shinkansen de la
  segunda mitad: Tokio–Kioto, Kioto–Himeji, Himeji–Hiroshima e Hiroshima–Tokio.


  Y dos que se comprueban, no se reservan: la cartelera del [**Kabuki-za**](https://www.google.com/maps/search/?api=1&query=Kabukiza%20Theatre%20Ginza%20Tokyo) —las entradas de un acto
  (*hitomakumi*) se venden en taquilla el mismo día— y, si alguien quiere la **subasta de atún de
  [Toyosu](https://www.google.com/maps/search/?api=1&query=Toyosu%20Market%20Tokyo)**, el registro para la sala acristalada, que se hace con semanas de antelación y va por
  sorteo. La pasarela de arriba, en cambio, es libre y no pide nada.
