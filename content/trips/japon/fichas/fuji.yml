epithet: >-
  Es el símbolo del país, se ve desde Tokio en un día limpio y la mitad de quien va a buscarlo vuelve
  sin haberlo visto. No es mala suerte: es meteorología, y se puede jugar a favor si se entiende
  cómo funciona.
sections:
  - heading: Una montaña que fabrica sus propias nubes
    body: |
      El Fuji tiene **3.776 metros** y está solo: no forma parte de ninguna cordillera, se levanta
      aislado sobre una llanura. Eso, que es lo que le da la silueta perfecta, es también lo que lo
      esconde. El aire húmedo del Pacífico choca contra el cono, sube, se enfría y condensa en la
      propia cumbre: la montaña se envuelve en una nube que ella misma ha fabricado.

      De ahí las dos reglas que deciden la visita:

      - **El invierno es la buena estación.** De noviembre a febrero el aire es seco y transparente
        y el Fuji se ve **muchos más días** que en verano, cuando está tapado casi siempre. Vais en la
        mejor ventana del año.
      - **La mañana es la buena hora.** La nubosidad crece según avanza el día. Un Fuji despejado a
        las ocho puede haber desaparecido a la una. **Cuanto más temprano, mejor.**

      Y una consecuencia práctica: en noviembre **ya está nevado**, que es como sale en las estampas.
  - heading: Es un volcán, y sigue activo
    body: |
      No está extinguido: está **dormido**. Su última erupción fue la *Hōei*, en 1707, y fue
      lo bastante grande como para dejar quince centímetros de ceniza en Edo, a cien kilómetros —
      abrió además un cráter secundario en la ladera sureste que se ve desde abajo. Sigue vigilado, y
      el gobierno metropolitano tiene planes de evacuación de Tokio por caída de ceniza.

      La montaña es **sagrada** desde antes de que nadie la subiera: fue objeto de peregrinación desde
      el siglo XII y estuvo prohibida a las mujeres hasta 1868. La primera occidental que subió lo
      hizo a escondidas en 1867 — era Lady Fanny Parkes, la mujer del embajador británico.

      Y la temporada de ascenso es **julio y agosto**, nada más. En noviembre la montaña no se
      sube: se mira.
  - heading: Desde dónde se mira
    body: |
      - **Chūreitō**, la pagoda de cinco pisos sobre Fujiyoshida: **cuatrocientos escalones** y arriba
        la composición pagoda-más-montaña que es la imagen del país. En noviembre, con arces rojos
        delante.
      - **La orilla norte del lago Kawaguchi**, para el reflejo. Solo funciona **sin viento**, y eso
        pasa sobre todo a primera hora.
      - **El teleférico Kachi-Kachi**, tres minutos hasta un mirador sobre el lago.
      - **Los dos lagos pequeños del oeste.** De los cinco lagos de la falda norte, el *Fuji Goko*,
        el Kawaguchi es el de más color y el que todo el mundo visita. Más allá quedan el **Shōji**,
        diminuto y casi sin construir, y el **Motosu**: desde su orilla noroeste se hizo en 1935 la
        foto de Okada Kōyō que lleva el reverso del billete de mil yenes de 2004, que sigue en
        circulación. Al mirador se sube en media hora por una senda empinada.
      - **Desde el Shinkansen**, en el tramo entre Shizuoka y Mishima, y sobre todo al pasar por
        **Shin-Fuji**. El truco del asiento: la numeración va fija al vagón, así que **el E de clase
        turista —el D en Green Car— cae del lado de la montaña en los dos sentidos**. Saliendo de
        Tokio es el lado derecho.
      - **Desde el propio Tokio**: el mirador del [**Gobierno Metropolitano**](https://www.google.com/maps/search/?api=1&query=Tokyo%20Metropolitan%20Government%20Building) en
        [Shinjuku](#shinjuku), [Shibuya Sky](#shibuya) y el [**Bunkyō Civic Center**](https://www.google.com/maps/search/?api=1&query=Bunkyo%20Civic%20Center%20Tokyo) lo enmarcan al
        oeste en los días limpios de invierno.
  - heading: La montaña por debajo
    body: |
      Lo que se ve desde lejos es un cono; lo que se pisa alrededor es una colada. En **864** el Fuji
      tuvo la erupción *Jōgan*, que bajó por la falda norte, represó y partió en dos un lago y se
      enfrió formando **tubos de lava** huecos. De ahí salen tres cosas que la excursión del
      [día 18](#dia-18-fuji) recorre en una tarde:

      - **La cueva de hielo de Narusawa y la de viento de Fugaku**, dos de esos tubos. Se mantienen
        cerca de cero grados todo el año, y antes de que existiera la refrigeración se usaron como
        almacén de semillas y de huevos de gusano de seda.
      - **Aokigahara**, el bosque que creció encima de la colada. Tiene una reputación que se le ha
        quedado pegada y una realidad geológica más interesante: raíces que no pueden hundirse
        porque debajo hay roca, así que crecen a lo ancho y en superficie.
      - **Las cataratas Shiraito**, en la falda suroeste: **ciento cincuenta metros de ancho** de
        agua que no baja de ningún río, sino que **sale directamente de la pared de roca**. Es el
        deshielo del Fuji, filtrado durante años por la lava porosa, aflorando de golpe.
  - heading: Por donde se subía antes, y por donde se sube ahora
    body: |
      Al pie de la montaña, en Fujiyoshida, el **Kitaguchi Hongū Fuji Sengen** es el santuario de la
      vertiente norte, dedicado a Konohanasakuya-hime, la diosa del Fuji y de los volcanes. De aquí
      salía la ruta Yoshida a la cumbre, a pie desde unos novecientos metros. El *torii* de madera de la
      entrada es de los más grandes del país, de casi dieciocho metros. El recinto está
      metido en un bosque de *sugi*, la criptomeria japonesa, con un cedro que llaman «de mil años».
      *National Geographic* lo recomienda a última hora de la tarde, cuando se han ido los grupos.

      Hoy casi nadie sube desde abajo: la carretera de pago **Fuji Subaru Line** lleva en coche hasta
      la **quinta estación**, a 2.300 metros, que es donde empieza la ascensión en verano.
      Fuera de temporada está casi vacía y con las tiendas cerradas. Desde ella sale el
      **Ochūdō**, una senda que bordea la ladera unos cuatro kilómetros con la cima a un lado y, más
      abajo, los alerces amarillos. Cierra cuando llega el hielo, y la fecha se retrasa cada año: el
      22 de noviembre en 2023, el 26 en 2024 y el 1 de diciembre en 2025.
  - heading: Lo que no sale en las listas
    body: |
      - **Oshino Hakkai** — ocho estanques alimentados por agua de deshielo del Fuji filtrada durante
        **ochenta años** por la roca volcánica. Son transparentes hasta ocho metros de fondo y están
        en un pueblo de casas de paja. Muy fotografiado y aun así impresionante.
      - **Arakurayama Sengen**, el parque de la pagoda, tiene además **650 cerezos** — que en
        noviembre no florecen, pero sí dan hoja roja.
      - **El santuario Fujisan Hongū Sengen Taisha**, en Fujinomiya: el principal de los mil trescientos
        santuarios dedicados a la montaña, y el propietario legal de todo lo que hay **por encima de
        la cota 3.360 metros** — la cumbre del Fuji es **propiedad privada de un santuario**, y lo
        confirmó el Tribunal Supremo japonés en 1974.
curiosidades:
  - >-
    **La cumbre del Fuji es propiedad privada.** Todo lo que está por encima de los 3.360 metros
    pertenece al santuario Sengen Taisha, y el Tribunal Supremo japonés se lo reconoció en 1974.
  - >-
    La montaña **fabrica la nube que la tapa**: el aire húmedo choca contra el cono aislado, sube y
    condensa en la cumbre. Por eso se ve mucho más en invierno y mucho más a primera hora.
  - >-
    Su última erupción, en **1707**, dejó **quince centímetros de ceniza en Edo** a cien kilómetros de
    distancia. No está extinguido, está dormido — y Tokio tiene plan de evacuación por caída de
    ceniza.
