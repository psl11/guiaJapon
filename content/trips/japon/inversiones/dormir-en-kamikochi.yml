navLabel: "Dormir en el valle"
trip: japon
order: 3
kicker: Decisión de dinero · día 7
title: Dormir *dentro* de Kamikōchi
verdict: imprescindible
verdictLabel: Imprescindible, pero completo
lede: >-
  El análisis daba que sí sin discusión, y aun así esta es la única decisión del viaje que no se pudo
  tomar: cuando se preguntó, no quedaban camas. Queda aquí porque explica qué se pierde.
ledger:
  - label: Cuesta
    body: >-
      Los hoteles del valle son **caros para lo que ofrecen** —son casas de montaña estacionales, no
      hoteles de ciudad— y suelen ir con **media pensión**, que en realidad conviene porque allí no hay
      otra cosa. Bastante más que una noche en Matsumoto.
  - label: Qué compra
    body: >-
      **Las dos horas que nadie más tiene.** Los autobuses entran a media mañana y salen a media tarde:
      quien duerme fuera solo ve el valle en su franja concurrida y con la luz peor. Dormir dentro
      compra **el atardecer, la noche sin una sola farola y, sobre todo, el amanecer** — que en
      noviembre significa escarcha, niebla levantándose del agua y el Hotaka nevado reflejado en el
      estanque Taishō, sin viento y sin nadie.


      Es, con diferencia, la mejor fotografía posible de las tres semanas.
  - label: Lo que hay en su lugar
    body: >-
      [**Hirayu Onsen**](#hirayu-onsen), montaña abajo, a unos veinticinco minutos en autobús: pueblo
      termal, más barato y con más camas. Se entra al valle **a la hora del primer autobús**, que es
      bastante después del amanecer, y se sale con el último. A cambio da dos cosas que dentro no
      había: **un baño termal al aire libre** después de andar todo el día, y quedarse a dormir en el
      nudo de carreteras desde el que al día siguiente se sale tanto hacia Takayama como hacia
      Matsumoto.
  - label: Veredicto
    body: >-
      **El razonamiento sigue en pie: si se puede, se duerme dentro.** Subir a un valle cerrado al
      tráfico para verlo en su horario de autobuses es pagar el viaje y quedarse con la parte mala.
      Lo que falló no fue la decisión sino el calendario — **las reservas de la temporada abren en
      enero y el Shirakabaso cierra el 14 de noviembre**, así que las últimas noches buenas del año
      se venden con muchos meses de antelación. Para quien lea esto a tiempo, la conclusión es una
      sola: **es lo primero que hay que reservar del viaje, antes que los vuelos**.
curiosidades:
  - >-
    El valle **cierra el 15 de noviembre** y los hoteles cierran antes que la carretera. La noche del
    12 era de las últimas que se vendían en toda la temporada — literalmente, de las últimas.
