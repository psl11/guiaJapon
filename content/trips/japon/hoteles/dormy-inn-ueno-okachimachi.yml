body: >-
  **Esto es el Candeo de Shimbashi, pero con agua de verdad.** Lo que enganchó allí era el Sky Spa: la
  planta alta, el baño al aire libre y la sauna. Aquí está lo mismo —**baños en la planta 12, con parte
  exterior, baño frío y sauna**— y encima el agua es **termal natural**, no calentada. Abren de las
  **15:00 a las 10:00 del día siguiente** (la sauna cierra de 01:00 a 05:00), así que llegues a la hora
  que llegues, hay baño.


  Y la costumbre de la casa, que es marca de la cadena: el ***yonaki soba***, un cuenco de ramen
  **gratis** que sirven a partir de las nueve y media de la noche en el vestíbulo. Suena a anécdota y
  es exactamente lo que quieres el día que aterrizas a las diez y media de la mañana con ocho husos
  encima.


  **Por qué Ueno y no Shimbashi, esta vez.** Los cuatro días piden tres salidas y Ueno las gana todas:
  es **la terminal del Skyliner** que te trae de Narita, tiene la Yamanote a Ikebukuro para
  [Kawagoe](#solo-4-kawagoe) en quince minutos, y el Keihin-Tōhoku directo a
  [Yokohama](#solo-3-yokohama). Encima, **los museos nacionales que el día 3 abren gratis están a
  cinco minutos andando** — y el hotel del grupo, en Akihabara, está **a una parada**: el cambio del
  día 6 es un trayecto de tres minutos con la maleta.


  **A verificar al reservar:** que la habitación sea de no fumadores (la cadena aún tiene plantas de
  fumadores) y si hay **restricción por tatuajes** en el baño, que en onsen de hotel suele ser laxa
  pero conviene preguntar. Y ojo: son **cuatro noches que van por tu cuenta**, fuera del bote del
  grupo.
