    duracion: "1 h"
    hora: "el de las 07:04"
    nota: "**En Shin-Fuji solo para el Kodama** — ni Nozomi ni Hikari. Llega a las 08:03 y la recogida es a las 08:30."
  - desde: "Shin-Fuji"
