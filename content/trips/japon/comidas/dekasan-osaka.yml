body: >-
  Sandwichería diminuta en Kawarayamachi. El *tamago sando* japonés —pan de molde sin corteza y una
  tortilla gruesa y esponjosa dentro— es un clásico de konbini que aquí se hace en versión de
  restaurante; y además tienen uno de entraña, que es mucho menos común.


  El horario manda: **abre de once a cuatro y nada más**, así que solo entra en el bloque de mediodía
  del día 14, compitiendo directamente con el mercado. Y la cola va de veinte a cuarenta y cinco
  minutos incluso pidiendo para llevar, porque el local tiene poquísimo sitio.


  Puesto al lado de las otras opciones de ese mediodía, esta es la de picar andando: se pide, se
  espera y se come por la calle camino de [Shinsekai](#osaka).
