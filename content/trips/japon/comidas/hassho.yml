body: >-
  Si Okonomimura es el zoco, esto es la casa. Trabajan la crepe más fina que casi nadie, usan col orgánica y dejan el fideo crujiente por abajo, que es exactamente donde se separa un okonomiyaki bueno de uno correcto.


  Merece la pena si vais a comer okonomiyaki una sola vez en Hiroshima y no queréis jugárselo a la lotería de elegir puesto.
