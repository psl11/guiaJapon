quePedir: >-
  El ***tantanmen*** dorado, que es el que sostiene la casa: sésamo, soja y un picante que se puede graduar.
body: >-
  Esto no es una recomendación gastronómica, es **infraestructura**. En Japón el problema vegetariano no es la carne visible sino el ***dashi***, el caldo de bonito seco que hay debajo de casi todo —la sopa de miso, la salsa de la soba fría, la del tempura— y que muchos cocineros no consideran «pescado». T's TanTan está **enteramente libre de él**, y está dentro de la estación de Tokio, que es el sitio por donde este viaje pasa una y otra vez.


  El *tantanmen* de sésamo es bueno por derecho propio, no «bueno para ser vegano». Pero lo que de verdad vale es saber que existe: cuando llevéis tres días preguntando por el caldo y estéis cansados, aquí no hay que preguntar nada.
