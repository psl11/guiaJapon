quePedir: >-
  Los pimientos rellenos de queso envueltos en bacon, el tomate con bacon y las patatas de Hokkaidō con mantequilla. Y **pedid todo *shio*** si hay alguien que no come carne.
body: >-
  Un [yakitori](#yakitori) de barrio con el volumen a tope, humo, taburetes pegados y clientela mezclada de vecinos y visitantes. Nada de aquí es refinado; todo está bien hecho y sale barato, que en Nakameguro tiene mérito.


  El detalle útil: en un yakitori se puede pedir ***shio*** (sal) o ***tare*** (salsa), y **la *tare* casi siempre lleva base de pollo**. Pedir todo *shio* convierte media carta de verduras en apta. Es el truco que más veces vais a usar en este viaje.
