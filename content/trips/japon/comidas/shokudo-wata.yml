body: >-
  **Una de las dieciséis casas nuevas de la guía de Tokio de 2026**, y la única de esa lista en
  Shinjuku. El cocinero viene de la cocina japonesa formal y abrió esto como lo contrario: una
  *izakaya* para entrar a diario, donde cada plato pequeño está hecho con el cuidado de un *kappō*.


  Es la alternativa con mesa a los callejones del día 9: Omoide Yokochō y Golden Gai son para picar
  de pie, y aquí se cena sentado a diez minutos andando. **Cierra los domingos**; el sábado abre de
  17:30 a 22:00, y con cuatro personas conviene reservar.
