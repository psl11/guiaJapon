quePedir: >-
  El **okonomiyaki de Hiroshima**, que es otra cosa que el de Osaka: **por capas y con fideos dentro**, no mezclado. Sentaos en la barra, sobre la plancha.
body: >-
  Un edificio de cuatro plantas con **unos veinticinco puestos** dentro, cada uno con su plancha, su dueño y su versión. Nació de los carritos de posguerra que se juntaron en un solar: el okonomiyaki de Hiroshima es literalmente una comida de la reconstrucción, hecha para llenar con poca harina.


  La diferencia con el de Osaka es estructural y merece explicarse: el de Osaka **se mezcla** en un bol y se echa a la plancha; el de Hiroshima **se construye por capas** —crepe finísima, montaña de col, fideos, huevo— y se voltea entero. Elegir puesto es lotería; la regla es sentarse donde haya clientela local.
