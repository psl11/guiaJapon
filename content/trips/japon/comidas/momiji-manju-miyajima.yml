body: >-
  El dulce de [Miyajima](#miyajima) y de toda la provincia: un bizcocho con forma de hoja de arce
  relleno de pasta de judía dulce. Lo inventó hacia 1906 el pastelero Takatsu Tsunesuke para la
  posada Iwasō de la isla, y le puso el nombre del **Momiji-dani**, el valle de los arces que hay
  detrás del santuario y que en noviembre es exactamente lo que su nombre dice.


  El relleno clásico es *koshian*, la pasta de judía roja colada, pero hoy los hay de *tsubuan*, judía
  blanca, castaña, matcha, queso, chocolate y crema. En la calle comercial de la isla se ven las
  máquinas haciéndolos a la vista, que es media gracia del asunto. Sobre qué es un
  [wagashi](#wagashi) y de qué está hecho, la ficha lo cuenta.


  Y lo que hay que pedir no es el normal sino el ***age-momiji***: el mismo bizcocho **rebozado y
  frito, servido en un palo**. Está crujiente por fuera y caliente por dentro, y a diferencia del
  otro **no se puede llevar de recuerdo** porque en dos horas ya no es lo mismo. Es de comer subiendo.
