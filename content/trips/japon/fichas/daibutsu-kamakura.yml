epithet: >-
  Once metros y medio de bronce sentados al aire libre desde hace más de setecientos años. Y esa es
  la clave: no se hizo para estar a la intemperie — un tsunami se llevó su templo en 1498 y nadie lo
  volvió a levantar.
sections:
  - heading: La estatua
    body: |
      Se fundió en **1252**, en plena época de Kamakura, cuando la ciudad era la capital efectiva del
      país. Mide **11,3 metros** con el pedestal y pesa en torno a **121 toneladas** de bronce.
      Representa a **Amida** —el Buda de la Tierra Pura, no el Buda histórico— con las manos en el
      mudra de la meditación, y no está fundido de una pieza: se hizo por **planchas soldadas en
      capas horizontales**, y las juntas se ven perfectamente si uno se acerca.

      Por unos pocos yenes se puede **entrar dentro** y comprobar que está hueco: se ven las costuras
      por el revés y las marcas de los moldes. Es una visita de tres minutos que cambia cómo se mira
      la estatua desde fuera.
  - heading: El templo que se llevó el mar
    body: |
      El Daibutsu **no fue concebido a la intemperie**. Tuvo su nave de madera, el *Daibutsu-den*, y
      la perdió más de una vez: a tifones en el siglo XIV, y definitivamente a un **tsunami en
      1498**, que arrasó el edificio y dejó la estatua en pie. Después de aquello nadie la
      reconstruyó, y así lleva **más de quinientos años**.

      Es el mejor accidente de la historia del arte japonés. Un Buda bajo techo, en penumbra, entre
      columnas, es una imagen de culto; este, sentado al aire con el bosque detrás y el cielo encima,
      es otra cosa. Si os fijáis en la base, todavía se ven los **pilares de piedra** sobre los que
      apoyaba la nave desaparecida.
  - heading: Cómo mirarlo
    body: |
      Un detalle en el que casi nadie repara: **la cabeza es desproporcionadamente grande** respecto
      al cuerpo, y el torso se inclina hacia delante. No es un error. Está calculado para el
      **escorzo** de quien lo mira de pie y de cerca, desde abajo — desde ahí las proporciones se
      corrigen y la mirada del Buda cae exactamente sobre el espectador. Visto de lejos, o en foto de
      frente, la cabeza parece enorme; visto donde hay que verlo, es perfecta.
curiosidades:
  - >-
    El Gran Buda **no se hizo para estar al aire libre**. Tuvo su nave de madera hasta que un
    **tsunami se la llevó en 1498**; nadie la reconstruyó, y lleva más de cinco siglos a la
    intemperie. En la base aún se ven los pilares de piedra que la sostenían.
  - >-
    Está **hueco y se puede entrar** por unos pocos yenes: dentro se ven las costuras de las planchas
    de bronce soldadas en capas y las marcas de los moldes de 1252.
  - >-
    **La cabeza es demasiado grande a propósito.** Las proporciones están deformadas para corregir el
    escorzo de quien lo mira de pie y desde cerca — que es como hay que mirarlo.
