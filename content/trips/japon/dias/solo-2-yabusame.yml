eyebrow: En solitario · mar 3 nov · festivo
title: El día que el calendario *regala*
dek: >-
  De los cuatro días sueltos, este es el que no se elige: es **Bunka no Hi**, el Día de la Cultura, y
  trae dos cosas que solo pasan hoy. Por la mañana, los museos nacionales abren gratis —los cuatro
  grandes, juntos en el parque de Ueno—. Por la tarde, el Meiji Jingū saca los caballos.
duerme:
  - candeo-shimbashi
traslados:
  - desde: "Shimbashi"
    hasta: "Ueno"
    medio: "JR Yamanote"
    duracion: "~12 min"
    hora: "salir 09:00"
    nota: "Los cuatro museos que hoy abren gratis están en el parque de Ueno."
  - desde: "Ueno"
    hasta: "Yoyogi"
    medio: "JR Yamanote"
    duracion: "~25 min"
    hora: "salir 11:30"
    nota: "**Yoyogi, no Harajuku.** El yabusame es en la explanada oeste y por Harajuku se entra por el otro extremo del bosque."
blocks:
  - block: Mañana
    time: "09:30–11:15"
    title: El Museo Nacional, y hoy sin pagar
    body: >-
      Hoy **el Tokyo National Museum es gratis** —como el de Arte Occidental, el de Ciencias y el de
      Arte Moderno—, y los tienes los cuatro juntos en el parque de Ueno. Con hora y media
      no se ve el museo entero, así que la jugada es ir a **una sola sala** y verla bien: la **galería de
      los Tesoros del Hōryū-ji**.

      Es un edificio aparte, de **Yoshio Taniguchi** (el mismo que rehízo el MoMA), y dentro guarda
      **cuarenta y ocho estatuillas budistas de bronce del siglo VII** que el templo Hōryū-ji de Nara
      cedió a la casa imperial en 1878. Están en una penumbra casi total, alineadas en vitrinas negras,
      cada una con su punto de luz. Es una de las mejores salas de museo del mundo y casi nadie que
      visita Tokio por primera vez llega a ella.
    window:
      label: Por qué esta sala y no el museo
      body: >-
        Porque el Honkan pide tres horas y hoy tienes hora y media. Y porque, con **Nara fuera del
        itinerario del grupo**, esta sala es lo más cerca que vas a estar del Japón del siglo VII en todo
        el viaje: son las piezas del Hōryū-ji —el conjunto de madera más antiguo del mundo— sin tener
        que bajar a Nara a por ellas. Es un premio de consolación que resulta ser mejor que el premio.
  - block: Mediodía
    time: "12:00–13:00"
    title: Llegar pronto a la explanada oeste
    body: >-
      El Meiji Jingū celebra hoy su **Gran Festival de Otoño**, y el bosque está distinto: hay
      **exposición de crisantemos** —la flor imperial, cultivada en formas que tardan un año— y
      demostraciones de artes marciales y música de corte a lo largo del día.

      Pero hay que llegar con hora de margen, porque el sitio del yabusame **se llena y cierran el
      acceso cuando revienta**. Se ve de pie, gratis, sin entrada ni reserva. Cómete algo antes: dentro
      no vas a querer moverte.
    window:
      label: El error que comete todo el mundo
      body: >-
        Bajarse en **Harajuku**. El yabusame es en la **explanada oeste** y la estación buena es
        **Yoyogi**; desde Harajuku son quince minutos más de bosque y llegas cuando ya no hay hueco en
        primera fila.
  - block: Tarde
    time: "13:00–14:30"
    title: Yabusame, tiro con arco a caballo
    body: >-
      A las **13:00** empieza. Primero un **rito por la paz** hacia las 13:10, y a las **13:15 suena el
      tambor de salida**. Entonces los arqueros bajan una pista larga **al galope**, con traje de caza
      del período Kamakura, y disparan a **tres blancos sucesivos a su izquierda** sin tocar las riendas.

      No es una competición ni un espectáculo: es un **rito sintoísta**. Los arqueros no compiten por
      puntería, ofrecen los disparos a los dioses pidiendo paz, buena cosecha y salud. Cuando un blanco
      revienta, la grada entera responde.
    window:
      label: Para la cámara
      body: >-
        Con un 35 mm fijo no vas a congelar al caballo pasando: **no lo intentes**. Lo que sí tienes es
        todo lo demás — los arqueros esperando turno, los trajes, las caras de la gente apretada contra
        la cuerda, el humo del tambor. La foto de este día no es el galope, es el rito alrededor del
        galope.
  - block: Atardecer
    time: "15:00–18:00"
    title: Omotesandō, la calle de los arquitectos
    body: >-
      Cuando se deshaga el gentío, el bosque del Meiji Jingū se queda tranquilo otra vez: es el momento
      de andarlo despacio y ver los crisantemos sin cola. Y al salir por el sur tienes **Omotesandō**,
      que para quinta visita es mejor plan que Shibuya: en un kilómetro de avenida hay edificios de
      **Tadao Andō, Kengo Kuma, SANAA, Toyo Itō y Herzog & de Meuron** —la Prada de burbujas de cristal
      es de estos últimos—. Es un catálogo de arquitectura japonesa contemporánea a pie de calle, gratis
      y sin cola.

      Si quieres rematar dentro, el **Museo Nezu** está al final de la avenida: colección de arte
      asiático en un edificio de Kuma y, detrás, **un jardín con estanque y casas de té** que no espera
      nadie en mitad de Aoyama.
    window:
      label: Ventana óptima
      body: >-
        Las fachadas de Omotesandō son casi todas de vidrio y metal: **funcionan a última hora**, cuando
        el sol entra bajo y se encienden desde dentro. A mediodía son planas. El Nezu cierra a las 17:00,
        así que si lo quieres, entra antes y deja la avenida para la caída.
  - block: Noche
    time: "18:00–19:30"
    title: El kissa donde está prohibido hablar
    body: >-
      Bajando Omotesandō se llega a Shibuya, y ahí está el remate del día: el [**Meikyoku Kissa
      Lion**](#meikyoku-kissa-lion), de **1926**. Es un *café de música maestra* — el género que nació
      cuando oír una sinfonía costaba más que un sueldo y la única manera era pagar un café en un local
      con equipo. Las butacas están atornilladas **mirando a los altavoces**, como en un cine; hay un
      programa impreso de lo que va a sonar; la luz es de vela.

      Y **no se habla**: ni conversación, ni móvil, ni cámara. Se pide en voz baja, se sienta uno y se
      escucha. A tres minutos del cruce más ruidoso del mundo.
    dim: true
    window:
      label: Por qué cierra bien el día
      body: >-
        Porque llevas desde las nueve y media de pie y con gente: museo, gentío del festival, caballos,
        avenida. El Lion es lo contrario de todo eso y **no te deja hacer nada** —ni mirar el móvil ni
        hablar—, que es justo lo que hace falta antes de volver a Shimbashi al Sky Spa. Deja la cámara guardada:
        aquí está prohibida, y esa es media gracia del sitio.
