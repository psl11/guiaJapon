title: Wagashi y matcha
queEs: >-
  El dulce japonés tradicional, casi siempre a base de **pasta de judía roja** (*anko*), arroz
  glutinoso y azúcar. Poco graso, poco dulce para el paladar europeo, y **diseñado para acompañar la
  amargura del té matcha**: los dos se inventaron el uno para el otro.
historia: >-
  Su rasgo más japonés es que **cambian con la estación**: forma, color y nombre siguen al
  calendario, y un maestro pastelero cambia la carta seis o siete veces al año. En noviembre tocan
  los de arce y castaña. Comprar un *wagashi* fuera de temporada se considera, sencillamente, un
  error.
dondeMejor: >-
  En el ***depachika*** de unos grandes almacenes se ven cien a la vez, presentados como joyería. Y
  en cualquier jardín con casa de té: se paga un billete y traen matcha batido con su dulce.
picante: "—"
veg: "Sí, casi todos. Alguno lleva gelatina animal, pero es raro."
body: >-
  Si solo se prueba uno: ***dorayaki*** (dos bizcochitos con anko en medio) o ***taiyaki*** (el mismo
  relleno en forma de pez, recién hecho y caliente). Y el matcha se bebe en dos o tres tragos, no a
  sorbitos.
