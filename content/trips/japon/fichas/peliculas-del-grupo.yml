title: Vuestras películas, sobre el mapa
epithet: >-
  Las películas, series y animes que os trajeron hasta aquí —y otros que seguro conocéis—, cruzados
  con el itinerario: **dónde se rodaron, qué día pasáis por delante** y qué hay de verdad detrás de
  cada una. Cuando algo no pisa la ruta, también se dice.
sections:
  - heading: Rodadas donde vais a estar
    body: |
      - ***Lost in Translation*** (Coppola, 2003). El bar es el [New York Bar](#new-york-bar) del
        Park Hyatt, que reabrió en diciembre de 2025 tras diecinueve meses de obras y dejó la planta
        52 como estaba. El karaoke es el **Karaoke-kan de Udagawachō**, en Shibuya, y las salas 601 y
        602 se pueden reservar: está en el [día 9](#dia-9-yamanote). La excursión de Charlotte a
        Kioto son las piedras del estanque del jardín del Heian Jingū y una puerta que se suele dar por
        la del Nanzen-ji, al norte del Shōren-in que se visita de noche el [día 13](#dia-13-kioto-este). Y el anuncio que
        rueda Bob es de [whisky](#whisky-japones) Suntory.
      - ***A todo gas: Tokyo Drift*** (Lin, 2006). El cruce de [Shibuya](#shibuya), el mismo día 9.
        Japón no da permisos para cortar un espacio público, así que lo rodaron sin permiso: según
        el director, tenían unos veinte minutos antes de que llegara la policía.
      - ***Tokyo Vice*** (HBO, 2022-2024). Sale de las memorias de Jake Adelstein, el primer
        periodista no japonés del Yomiuri, que cubrió la *yakuza* desde el club de prensa de la
        policía; una investigación de *The Hollywood Reporter* puso en duda parte de lo que cuenta.
        El primer episodio lo dirigió Michael Mann, y se rodó en Tokio de verdad:
        - **La primera escena** es en el puente Hijiribashi, sobre el río Kanda en Ochanomizu, a una
          parada del hotel de Akihabara y a un paseo de Jinbōchō, la tarde del
          [viernes 6](#solo-5-fukagawa).
        - **El periódico y la policía.** El *Meichō Shimbun* de la serie es el Yomiuri, con la sede
          en Ōtemachi, a un paseo de la tumba de Masakado. La jefatura de la Policía Metropolitana
          está frente a la puerta Sakurada del palacio. Las dos caen en la mañana del día 10.
        - **Kabukichō y Golden Gai** son reales, los de la noche del día 9. En el segundo episodio
          sale el Don Quijote de la esquina con Yasukuni-dōri y la calle de la cabeza de
          **Godzilla**, que asoma sobre el cine Tōhō y que veréis de camino a cenar.
        - El vestíbulo del hotel Okura de Toranomon, el de 1962 reconstruido tal cual en el edificio
          nuevo, está a diez minutos de Roppongi.
        - En la segunda temporada cortaron entera una calle de **Akasaka**, al lado de Roppongi, algo
          que no había conseguido nunca una producción occidental: seis meses de negociación. Lo
          normal era rodar en Yokohama disfrazándola de Kabukichō, y el productor se negó. Los
          interiores, eso sí, se hicieron en los estudios Tōhō.
      - ***Lobezno inmortal*** (Mangold, 2013). El funeral y el arranque de la persecución son en el
        **Zōjō-ji**, el templo de los Tokugawa junto a la Torre de Tokio, a un cuarto de hora de
        Roppongi (está en la alternativa del [día 10](#dia-10-tokio-centro)). La persecución sigue
        por la Chūō-dōri de [Akihabara](#akihabara), la del primer hotel. Logan y Mariko se bajan
        del tren en la estación de Fukuyama, donde para casi todo Shinkansen del día 15, y el pueblo de
        pescadores que hace de Nagasaki es Tomonoura, media hora al sur. El *love hotel* era la
        torre de cápsulas Nakagin de Kurokawa, en Ginza, derribada en 2022.
      - ***Solo se vive dos veces*** (Gilbert, 1967). La escuela de ninjas de Tiger Tanaka es el
        castillo de Himeji, la parada del [día 15](#dia-15-hiroshima). La sede de Osato Chemicals
        es el **hotel New Otani** por fuera, en Kioichō, cerca de Akasaka.
      - ***El último samurái*** (Zwick, 2003). Casi todo se rodó en Nueva Zelanda, y el Ginza de 1877
        era un decorado de Warner en Los Ángeles. Lo japonés es el **Engyō-ji**, en el monte Shosha
        de Himeji, un templo que no había dejado rodar a nadie. Queda a más de media hora en autobús y
        teleférico de la estación, así que no cabe en la parada del día 15.
  - heading: El anime, y los sitios reales detrás del dibujo
    body: |
      - ***Your Name*** (Shinkai, 2016). El lago de Itomori se suele dar por calcado del **lago
        Suwa**, que es el que se ve por la ventanilla izquierda del Azusa el
        [día 3](#dia-3-matsumoto). El pueblo es Hida-Furukawa: su estación es donde se baja Taki
        buscando a Mitsuha, a quince minutos en tren de [Takayama](#takayama). En Tokio, la escalera
        del final es la del **santuario Suga**, en Yotsuya, a tres paradas de Shinjuku por la
        Marunouchi y siete minutos a pie. La cita de Taki con Okudera-senpai es en el Salon de Thé Rond, el café de la
        segunda planta del Centro Nacional de Arte de [Roppongi](#roppongi), donde dormís cuatro
        noches. Entrar al edificio es gratis.
      - ***Akira*** (Ōtomo, 1988). Neo-Tokio va a celebrar los Juegos Olímpicos de **2020**, y bajo
        el cartel de la cuenta atrás alguien ha pintado 「中止だ中止」, «que lo cancelen». En
        febrero de 2020 se convirtió en etiqueta en redes, y los Juegos se aplazaron a 2021. Lo de
        que la película «predijo la pandemia» es un bulo: no sale ninguna. El estadio de aquellos
        Juegos, de Kengo Kuma, está junto a los jardines exteriores del Meiji Jingū; el día 9 pasáis
        por el gimnasio de Tange de los de 1964.
      - ***Evangelion*** (Anno, 1995). Tokio-3 es Hakone, que tiene tiendas y máquinas expendedoras
        de Eva por todo el pueblo. **No está en la ruta**: el Fuji del día 18 se ve por la cara
        norte y Hakone queda al otro lado. Lo que sí pisáis es Ikebukuro, el
        [día 17](#dia-17-compras): la tienda oficial, Evangelion Store Tokyo-01, lleva en la segunda
        planta del P'Parco desde 2014.
      - ***Death Note*** (2006). Light estudia en la universidad Tōō, que es una parodia de la de
        Tokio. Las guías de peregrinaje sitúan bajo la estación de [Shinjuku](#shinjuku) el pasillo
        donde se cita con Raye Penber, en el episodio 5.
      - ***Shin-chan***. Vive en Kasukabe, en Saitama, y la ciudad lo tiene empadronado: en 2004 dio
        a la familia Nohara tarjetas de residente con la dirección Futaba-chō 904. El Spacia a
        Nikkō para en la estación de Kasukabe el [día 19](#dia-19-nikko).
      - ***Captain Tsubasa*** (*Oliver y Benji*). Su autor, Yōichi Takahashi, se crio en Yotsugi, en
        el este de Tokio. La estación de la línea Keisei Oshiage está forrada con el anime desde
        2023 y hay nueve estatuas de bronce por el barrio. El tren de Narita del primer día en
        solitario [pasa por ella](#solo-1-narita). Y para un español, el dato: en *Road to 2002*,
        Tsubasa ficha por el **FC Barcelona**, con Rivaldo de mentor.
      - ***Doraemon***. Su autor, Fujiko F. Fujio, nació en Takaoka, a quince minutos de
        [Kanazawa](#kanazawa) en Shinkansen, donde un tranvía de la línea Man'yōsen va pintado de
        Doraemon. El Kagayaki del día 7 no para allí y no cabe en el plan. El museo del autor está
        en Kawasaki, también fuera de ruta.
      - ***Ghost in the Shell*** (Oshii, 1995). **Esta no la vais a pisar.** New Port City es una
        ciudad inventada, dibujada sobre las calles de Hong Kong, y la versión de 2017 se rodó en
        Wellington y Hong Kong.
  - heading: La historia de verdad detrás de la serie
    body: |
      - ***Shōgun*** (FX, 2024; novela de Clavell, 1975). Es la que más pisáis.
        - **Toranaga está inspirado en Tokugawa Ieyasu**, y el mausoleo de Ieyasu es el Tōshōgū de [Nikkō](#nikko), el
          día 19.
        - **Blackthorne sale de William Adams**, el inglés que Ieyasu hizo samurái con el nombre de Miura
          Anjin. Le dio casa en Edo, y una lápida de 1951 la señala en Nihonbashi Muromachi, en la
          calle que todavía se llama Anjin-dōri. Su compañero de barco, el holandés Jan Joosten, es
          el que dio nombre a **Yaesu**, la salida de la estación de Tokio: los japoneses le
          llamaban Yayōsu. Las dos cosas caen en el mediodía del día 10, junto a
          [Marunouchi](#marunouchi).
        - **La Osaka de la serie es el castillo de [Osaka](#osaka)**, el del día 14. Mariko sale de Hosokawa
          Gracia, que en 1600 se negó a quedarse de rehén en ese castillo y murió por ello: como su fe
          le prohibía el suicidio, hizo que un criado la matara. Donde
          estaba la casa de su familia hay hoy una catedral católica, con su estatua, a diez minutos
          del parque.
        - La batalla hacia la que va toda la serie es **Sekigahara**, en octubre de 1600. El Nozomi
          del [día 11](#dia-11-tokio-kioto) pasa junto al campo, entre Gifu-Hashima y Maibara, que
          es de los tramos de la línea que más nievan.
        - La serie se rodó en Columbia Británica, en Canadá.
      - ***El último samurái***, otra vez. **Katsumoto está inspirado en Saigō Takamori**, que
        encabezó la rebelión de Satsuma en 1877 y se quitó la vida al perderla. Doce años después
        lo indultaron, y en 1898 le pusieron una estatua con su perro en el parque de
        [Ueno](#ueno): la veréis el [día 2](#dia-2-shitamachi), a la entrada sur.
      - ***Silencio*** (Scorsese, 2016; novela de Endō, 1966). Se rodó en Taiwán y pasa en Nagasaki,
        que no está en la ruta. Pero los *fumi-e*, las imágenes de Cristo y de la Virgen que se
        obligaba a pisar para descubrir a los cristianos, se guardaban en el almacén del magistrado
        de Nagasaki. Desde la posguerra están en el **Museo Nacional de Tokio**, el del día 2 y el
        del martes 3, declarados bien cultural en 1977. No siempre están expuestos.
        Y en Tokio queda el sitio de la **Kirishitan Yashiki**, la cárcel de Edo para cristianos
        donde acabó sus días Giuseppe Chiara, el jesuita del que sale el Rodrigues de la novela.
        Está en Bunkyō, junto a Myōgadani, a una parada de metro del Kōrakuen del día 17.
      - ***Pachinko*** (Apple TV+, 2022-2024; novela de Min Jin Lee, 2017). Sunja llega a
        **Ikaino**, el barrio coreano de Osaka, que hoy es Ikuno y la Korea Town de Tsuruhashi. Está
        a dos paradas de la línea circular desde el castillo, el día 14. La serie se rodó en Corea y
        en Vancouver. Y las salas de *pachinko* que veréis por Dōtonbori son la otra mitad de la
        historia: se suele citar que en torno al 80 % son de coreanos de Japón, los *zainichi*.
  - heading: Otras películas que pisáis, aunque no estaban en la lista
    body: |
      Van en el orden del viaje, porque pasáis por delante de todas.

      - ***Kill Bill*** (Tarantino, 2003) copió el Gonpachi de Nishi-Azabu para su Casa de las
        Hojas Azules. Está en la noche del [día 7](#dia-7-kanazawa-tokio).
      - ***Hachikō*** tiene dos películas: la japonesa de 1987 y ***Siempre a tu lado, Hachiko***
        (Hallström, 2009), con Richard Gere, que pasa en Estados Unidos y se rodó en Rhode Island.
        El perro de verdad esperaba a un profesor de la Universidad de Tokio junto a la estación de
        Shibuya, donde está su estatua del día 9. Disecado, se conserva en el Museo Nacional de la
        Naturaleza y la Ciencia, en el mismo parque de Ueno del día 2.
      - En ese mismo cruce, el Shibuya vacío de ***Alice in Borderland*** (Netflix, 2020) no es
        Shibuya: es un decorado al aire libre en Ashikaga, a más de cien kilómetros, y casi todo lo
        que se ve alrededor es ordenador.
      - Los baños de ***Perfect Days*** (Wenders, 2023) son del proyecto Tokyo Toilet, que encargó
        baños públicos a arquitectos famosos por todo Shibuya. El de Tadao Andō, en el parque de
        Jingū-dōri, es de esa serie y queda a una calle de la Cat Street del día 9.
      - ***Godzilla***, que es de Tōhō, está por todas partes:
        - Su cabeza asoma sobre el cine Tōhō de Kabukichō, la noche del día 9.
        - ***Shin Godzilla*** (2016) acaba en la estación de Tokio, con dos Shinkansen cargados de
          explosivos lanzados contra sus patas. Es la estación de ladrillo del día 10.
        - En el ***Godzilla*** original, de 1954, arranca de un zarpazo la torre del reloj de Wakō,
          en el cruce de Ginza 4-chōme. En ***Godzilla Minus One*** (2023) vuelve a arrasar Ginza,
          en 1947. Es el cruce del [día 20](#dia-20-tsukiji-ginza), y a diez minutos, en Hibiya, está
          la estatua de tres metros de la plaza de Godzilla, con el diseño de *Shin Godzilla*.
      - ***47 Ronin*** (Rinsch, 2013), la de Keanu Reeves, es el *Chūshingura* con magia y bestias,
        rodado en Budapest y en Inglaterra. Los cuarenta y siete de verdad están enterrados en el
        Sengaku-ji del día 10.
      - ***Bullet Train*** (Leitch, 2022) cuenta un Shinkansen de Tokio a Kioto, que es exactamente
        el Nozomi del día 11. El tren era un decorado montado por piezas en un plató de Sony, en Los
        Ángeles.
      - ***Rashōmon*** (Kurosawa, 1950) se rodó en un decorado, pero la puerta existió: la Rajōmon,
        la entrada sur de la Kioto antigua. Donde estuvo queda un pilar de piedra en un parquecito, a
        un cuarto de hora andando del Tō-ji de la tarde del día 11. Hay una maqueta de la puerta
        junto a la estación de Kioto.
      - ***Memorias de una geisha*** (Marshall, 2005) rodó la carrera de Chiyo entre los torii de
        [Fushimi Inari](#fushimi-inari), el amanecer del día 14, y usó la pagoda del Kiyomizu-dera
        para marcar cada cambio de estación, la del amanecer del día 13.
      - ***Black Rain*** (Ridley Scott, 1989), con Michael Douglas, se rodó en Osaka: Dōtonbori, el
        puente Ebisubashi del Glico, Kyōbashi y el mercado central. No les dejaron rodar en Dōtonbori
        la persecución de motos bajo la lluvia, y la hicieron en una calle de Jūsō vestida para
        parecerlo. Es la noche del [día 14](#dia-14-osaka).
      - Himeji, la parada del día 15, es también el castillo de ***Kagemusha*** (1980) y de
        ***Ran*** (1985), de Kurosawa.
      - ***Hiroshima mon amour*** (Resnais, 1959) se rodó en el Parque de la Paz y en la galería
        comercial de Hondōri, trece años después de la bomba. Es la [Hiroshima](#hiroshima) del
        día 15.
      - ***Jiro Dreams of Sushi*** (2011) es el Sukiyabashi Jiro, en un sótano de Ginza. Solo se
        reserva a través del conserje de un hotel, y salió de la Guía Michelin justo por eso, por no
        estar abierto al público. El día 20 pasáis por delante, y no entráis.
  - heading: Más anime en la ruta
    body: |
      - ***Kimetsu no Yaiba*** (*Guardianes de la noche*). Tanjirō se cruza por primera vez con Muzan
        en el Asakusa de la era Taishō, en el episodio 7. Es el barrio de la primera mañana, el día 2.
      - ***Jujutsu Kaisen***. El «incidente de Shibuya» pasa en la estación y alrededor del cruce,
        los del día 9. El andén donde sellan a Gojō es el de la línea Fukutoshin, el más hondo de la
        estación.
      - ***Sailor Moon***. Pasa en Azabu-Jūban, el barrio de la cena de la última noche del día 10.
        El santuario Hikawa de Rei existe, en Azabu, y la Torre de Tokio sale al fondo de media
        serie.
      - ***En este rincón del mundo*** (Katabuchi, 2016) dibuja calle por calle el barrio de Nakajima
        de Hiroshima tal como era antes de la bomba. Ese barrio es hoy el Parque de la Paz del
        día 15, y el museo le ha dedicado una exposición con escenas de la película.
      - ***La colina de las amapolas*** (Ghibli, 2011) pasa en el Yokohama de 1963, en el barrio alto
        de Yamate y su puerto. Es el barranco del [martes 4 en solitario](#solo-3-yokohama), y el
        mirador del parque Minato-no-Mieru-Oka es el sitio desde el que mirarlo.
      - Y para comprar de todo esto, la **Tokyo Character Street**: treinta tiendas de personajes en
        el sótano de la salida Yaesu de la estación de Tokio. Hay una de Ghibli, un Pokémon Center
        pequeño y una Jump Shop con *One Piece*. Os pilla al bajar del Kagayaki el día 7, al otro
        lado de la estación de la tienda del matcha.
  - heading: Las que no salen en el mapa
    body: >-
      ***Origen*** (Nolan, 2010) rodó unos días en Tokio en 2009, pero lo que queda en pantalla no se
      puede visitar. El helicóptero despega de una azotea con la Torre de Tokio de fondo y aterriza
      segundos después en Farnborough, en Inglaterra. El castillo de Saito era un decorado en un
      plató de Warner. Junto a *Ghost in the Shell* y *Evangelion*, son las tres de vuestra lista
      que no tienen un sitio en este viaje.


      Para las películas japonesas que conviene ver antes, y los libros, está
      [la ficha de cine y libros](#japon-cine-libros).
curiosidades:
  - >-
    Cuando la policía cortó el rodaje de ***Tokyo Drift*** en Shibuya, un miembro del equipo se
    presentó como el director para que se lo llevaran a él y no a Justin Lin. Pasó la noche en el
    calabozo.
  - >-
    La dirección de Shin-chan en Kasukabe, **Futaba-chō 904**, es doble juego: Futaba viene de
    Futabasha, la editorial, y 9-0-4 se lee *ku-re-yon*, «crayon», como el título original de la
    serie.
  - >-
    En el rodaje de ***Solo se vive dos veces*** en Himeji, unos extras dañaron los muros del
    castillo y la comisión japonesa de bienes culturales suspendió el rodaje durante un tiempo. El
    castillo es Patrimonio de la Humanidad desde 1993.
