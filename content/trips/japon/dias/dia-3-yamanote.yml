slug: dia-3-yamanote
navLabel: "Día 3 · Meiji y Shibuya"
trip: japon
order: 3
eyebrow: El plan · Día 3 · dom 8 nov
title: Del bosque de *Meiji* al cruce de Shibuya
dek: >-
  El día del contraste que define Tokio: un bosque de cien mil árboles plantados a mano en el centro
  de la ciudad, y a quince minutos andando, el cruce peatonal más transitado del planeta. Y es
  domingo, que aquí no es un detalle del calendario sino parte del plan.
blocks:
  - block: Amanecer
    time: "06:30"
    title: Meiji Jingū al abrir
    body: >-
      El santuario [**abre al amanecer y cierra al atardecer**](#meiji-jingu), sin horario fijo: sigue al sol. Entrar
      con los primeros es cruzar el **torii de ciprés** de doce metros y recorrer un kilómetro de
      grava bajo un bosque de **cien mil árboles donados de todo el país** en los años veinte —un
      bosque enteramente plantado por el hombre que hoy parece primario— hasta un santuario donde a
      esa hora solo hay sacerdotes barriendo. Es el sitio más silencioso del centro de Tokio y solo lo
      es una hora al día.
    window:
      label: Ventana óptima
      body: >-
        Segundo y último madrugón fácil: el cuerpo todavía va desfasado, pero mañana ya no. Y hay un
        premio de domingo: es **el día de las bodas sintoístas**, así que a media mañana hay
        posibilidades reales de cruzarse con una **procesión nupcial** —novia de *shiromuku* blanco
        bajo un parasol rojo, sacerdotes delante— atravesando el patio. No se puede reservar ni
        garantizar: solo estar allí un domingo.
  - block: Mañana
    time: "10:00–13:00"
    title: Harajuku, Omotesandō y las dos aceras
    body: >-
      Se sale del bosque y a doscientos metros está **Takeshita-dōri**, la calle de la moda
      adolescente: estrecha, gritona, saturada, con crepes y tiendas de disfraces. Un domingo está
      imposible, y verla así es justamente el punto. La antídoto está a la vuelta: **Omotesandō**, la
      avenida arbolada donde media docena de arquitectos con Pritzker se han construido una tienda
      —Itō, Sejima, Kuma, Herzog & de Meuron— y que se recorre mirando fachadas, no escaparates.
      Doscientos metros separan la cultura pop más ruidosa del país de su arquitectura más seria.
    window:
      label: Por qué en domingo
      body: >-
        Porque Harajuku en domingo **es otra cosa**: es el día en que la gente se viste para venir. Un
        martes por la tarde es una calle comercial estrecha; un domingo es el fenómeno que os han
        contado. Si el gentío agobia, la salida siempre está a la vuelta de la esquina — literalmente.
  - block: Tarde
    time: "15:00–17:00"
    title: El cruce, y la ciudad desde arriba
    body: >-
      [**Shibuya**: el cruce](#shibuya) donde tres mil personas atraviesan a la vez sin rozarse, y la estatua de
      **Hachikō**, el perro que esperó a su dueño nueve años en esa puerta. Verlo desde la calle está
      bien; verlo desde arriba lo explica. Para eso, **Shibuya Sky**, la azotea abierta de la torre
      Scramble Square, con la ciudad de 360 grados y —si el aire está limpio— el **Fuji** recortado al
      oeste.
    window:
      label: Ventana óptima
      body: >-
        Aquí hay que **reservar con antelación y elegir la franja del atardecer**, que en noviembre es
        temprana: el sol se pone hacia las **16:40**. La entrada ideal es sobre las 16:00, para coger
        la última luz sobre el Fuji, el crepúsculo y el encendido de la ciudad en una sola visita. Y
        noviembre juega a favor en algo concreto: **el aire de invierno es el más transparente del
        año** y el Fuji se ve muchísimos más días que en verano.
  - block: Noche
    time: "noche"
    title: Los callejones de Shinjuku
    body: >-
      Cena a diez minutos en tren, en casa: **Omoide Yokochō**, el «callejón de los recuerdos», dos
      pasillos de posguerra con barras de seis taburetes donde se cena *yakitori* al humo; y al lado,
      el laberinto de **Golden Gai**, doscientos bares diminutos de dos plantas, cada uno con su tema
      y muchos con asiento para seis. Aviso para un grupo de cuatro: **no cabéis en casi ningún sitio
      a la vez**, y algunos bares cobran cubierto. Es parte del trato.
alt:
  label: Si te desmarcas
  body: >-
    Meiji y Shibuya te los sabes. Tres desvíos que se hacen desde aquí mismo: el **Museo Nezu** —un
    edificio de Kengo Kuma con un jardín que no parece Tokio— está a diez minutos de Omotesandō y
    abre los domingos; **Shimokitazawa**, dos paradas al oeste, es el barrio de segunda mano, discos y
    teatro pequeño donde va la gente de esta ciudad cuando no quiere turistas; y **Daikanyama** con la
    librería **Tsutaya**, que es probablemente el mejor sitio del mundo para pasar dos horas sin hacer
    nada. Si el grupo va a Shibuya Sky, cualquiera de los tres cabe justo antes.
