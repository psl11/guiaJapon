blocks:
  - block: El vuelo
    time: "la noche anterior y todo el día"
    title: Ocho horas de ventaja, y la cuenta que sorprende
    body: >-
      Japón va **ocho horas por delante** de España en noviembre, y eso hace que la aritmética
      engañe. Los billetes del grupo lo demuestran: salen de Madrid el jueves 5 a las 17:30, no el
      6, porque el trayecto —Air China, con casi cuatro horas de escala en Pekín— se come un día
      entero. Aterrizan en Haneda a las 19:50 del viernes 6. Ver [los vuelos](#vuelos).


      Quien compre todavía tiene ahí el aviso: **para llegar el 6 por la tarde hay que salir el 5**.
      Un vuelo que despegue el viernes por la mañana aterriza el sábado y corre el itinerario un día.


      La consecuencia de volar al este es que **el día se come a sí mismo**: se despega de noche, se
      cruza el amanecer en algún punto sobre Asia y se llega con el calendario intacto pero con el
      cuerpo ocho husos por detrás. Y de ahí sale el efecto que sí importa: mañana os vais a
      despertar a las cinco sin despertador. En cualquier otro viaje eso es un fastidio; en este es
      un regalo, como se verá el día 2.
    window:
      label: Qué se puede controlar en el avión, y qué no
      body: >-
        Con eso, tres cosas que sí funcionan:

        - **Poner el reloj en hora japonesa al despegar**, para dejar de calcular.

        - **Dormir en el tramo que corresponda a la noche japonesa**, aunque en la cabina sea de día. Si
        cae una bandeja en esa franja, se puede pedir que la guarden.

        - **No dormir las dos últimas horas.** Es cuando entra la tentación, y es la que se paga mañana.
  - block: Llegada
    time: "19:50"
    title: Del aeropuerto a Akihabara
    body: >-
      Trámite de entrada, dinero y datos —los tres primeros movimientos— y al hotel. A la salida de
      aduanas os espera el cuarto, que lleva desde el lunes en Japón y viene a buscaros: él lleva el
      camino. **Haneda** juega
      a favor: está dentro de la ciudad, a unos cuarenta minutos del centro, frente a la hora y media
      larga de Narita. Aun así, con cola de inmigración y maletas, de la puerta del avión a la del
      hotel se va a las nueve y media o las diez. Un solo transbordo: monorraíl hasta Hamamatsuchō y
      la Yamanote hacia el norte, o el Keikyū hasta Shinagawa y la misma Yamanote. Luego, maletas en
      Akihabara, la base de estas dos primeras noches, y a cenar algo cerca.
    window:
      label: Por qué no forzar la primera noche
      body: >-
        Es tentador salir a por el primer bol de [ramen](#ramen) a las once, pero **Akihabara cierra
        pronto**: es un distrito de tiendas y a las diez la calle está vacía y las persianas bajadas —
        justo lo que interesa esta noche—. Dos direcciones seguras a esa hora: los callejones de Kanda,
        una parada al sur, o el [konbini](#konbini) de la esquina, que la primera noche no es rendirse
        sino sentido común.


        Y ahí parar. Mañana el cuerpo os va a levantar de madrugada, y Sensō-ji vacío al amanecer solo
        funciona si os habéis acostado. Quedan veinte noches.
    ver:
      - ficha: akihabara
        nota: Por qué el barrio del anime empezó vendiendo piezas de radio, y por qué se duerme aquí.
      - nombre: Callejones de Kanda
        maps: Kanda Station Tokyo
        nota: Izakayas bajo las vías, abiertas hasta tarde. Una parada al sur del hotel.
        lat: 35.6944731
