blocks:
  - block: Mañana
    time: "10:00–12:30"
    title: La casa Asakura, y Daikanyama alrededor
    body: >-
      Se empieza por la **antigua casa Asakura**, a la hora en que abre. La levantó en 1919 Asakura
      Torajirō, que presidió la asamblea de Tokio, y es Bien Cultural Importante: una casa de madera de
      la era Taishō, con sus salas de tatami abiertas sobre un jardín en pendiente que baja hacia el
      río Meguro. Es pequeña y se ve en tres cuartos de hora. Tu familia va cada otoño; los arces de
      Tokio no enrojecen del todo hasta finales de mes, así que el 4 los pillarás empezando.


      Al salir, Daikanyama es justo lo que te han dicho: calles cortas, tiendas pequeñas y casi nada
      de cadena. Enfrente de la casa está **Hillside Terrace**, el conjunto que Fumihiko Maki fue
      construyendo a lo largo de veinte años, y a cinco minutos la librería de Tsutaya. Las tiendas
      abren hacia las 11:00, así que el orden sale solo. Y para bajar al metro, cuesta abajo hasta el
      río Meguro: en la orilla está la **Starbucks Reserve Roastery**, el tostadero de Kengo Kuma, a
      diez minutos de la estación de Naka-Meguro. Junto a la estación queda también
      [Wagyumafia](#wagyumafia-cutlet-sandwich), la del sándwich de 125 euros, que los miércoles
      cierra: hoy no hay peligro.
    window:
      label: Horarios
      body: >-
        **La casa Asakura abre de 10:00 a 16:30 de noviembre a febrero** (última entrada media hora
        antes), cierra los lunes y la entrada es simbólica, unos ¥100. Está a cinco minutos de la
        estación de Daikanyama.
    ver:
      - nombre: Antigua casa Asakura
        maps: Former Asakura Residence Daikanyama
        nota: Casa de 1919 con jardín en ladera. Bien Cultural Importante, y casi siempre vacía.
      - nombre: Hillside Terrace
        maps: Hillside Terrace Daikanyama
        nota: Tiendas, galerías y cafés en edificios bajos de Fumihiko Maki, frente a la casa.
      - nombre: Daikanyama T-Site
        maps: Daikanyama T-Site
        nota: La librería de Tsutaya, en tres pabellones unidos por un pasillo de revistas.
      - nombre: "Starbucks Reserve Roastery"
        maps: "Starbucks Reserve Roastery Tokyo Nakameguro"
        nota: "El tostadero de cuatro plantas de Kengo Kuma, junto al río Meguro, de camino al metro."
  - block: Mediodía
    time: "13:00–14:30"
    title: Comer en Ginza, con la familia
    body: >-
      La Hibiya vuelve directa a Ginza en veinte minutos, para estar a la una. Lo que tu familia quiere intentar es
      **Hachigō**: un solo plato, seis asientos y setenta cuencos al día. Si no hay sitio, ellos tienen
      su plan B, un tempura rápido que conocen, y a cinco minutos queda también el de la guía, Shinamen
      Hashigo.


      Después, Ginza a vuestro paso: el barrio lo conocen ellos. Lo que no vas a ver es la avenida
      cortada al tráfico, que solo se peatonaliza los fines de semana y festivos.
    window:
      label: La reserva se abre el sábado 31, a la 1:00 de la mañana en España
      body: >-
        Hachigō reserva solo por TableCheck, con ¥500 de gestión por persona, y **abre cada sábado a
        las 9:00 de Japón los turnos de martes a domingo de la semana siguiente**. Para el miércoles 4,
        eso es el **sábado 31 de octubre a la 1:00** hora peninsular. Con seis taburetes en barra, un
        grupo solo se sienta junto si coge varios sitios del mismo turno: el de las 13:00. Cierra los lunes.
    ver:
      - ficha: ginza
        nota: Por qué el barrio se llama como una casa de la moneda.
    comer:
      - comida: ginza-hachigo
        elegido: true
        nota: El *chūka soba* de Matsumura, que tuvo estrella en 2023. Con reserva del sábado anterior.
      - comida: shinamen-hashigo-ginza
        nota: "Si Hachigō no sale: *dandanmen* desde 1964, sin reserva y solo efectivo."
  - block: Media tarde
    time: "14:30–15:45"
    title: El encargo de tu padre
    body: >-
      Antes de dejar Ginza, la misión: el **Seiko Presage HCC005J**, el de esfera de esmalte blanco
      que homenajea al Laurel de 1913, el primer reloj de pulsera japonés. La tienda es **Seiko Dream
      Square**, en el 4-chōme, a un paso de la torre del reloj de Wakō: es la casa de la propia marca,
      con varias plantas ordenadas por colecciones, Presage incluida, y vende los modelos que Seiko reserva a
      sus tiendas «Global Brand Core Shop», que es el caso de este. Las tiendas de Grand Seiko de
      Ginza no sirven: son otra marca de la casa.


      Con el reloj en la bolsa, a diez minutos por la Chūō-dōri hacia el 7-chōme, está el edificio de
      Onitsuka Tiger dedicado a la línea Nippon Made, la hecha a mano en Japón, junto a la tienda
      grande de la marca. Por qué esa y qué más compensa traerse está en [las compras](#compras).
    window:
      label: Cómo comprarlo sin sorpresas
      body: >-
        - **No lo tiene cualquiera.** Salió el 5 de septiembre de 2026 y solo lo venden las «Core
        Shop». Escribe antes a Seiko Dream Square con el modelo y pide que te lo guarden: en japonés,
        「HCC005Jの取り置きをお願いできますか」. Abre de 11:00 a 19:00.

        - **Si no lo tienen**, el plan B es The Clock House, una cadena de relojerías con la misma
        certificación y varias tiendas en Tokio, que lo vende también por internet. Pregunta en cuál
        hay stock antes de cruzar la ciudad.

        - **Precio: ¥179.300 con impuestos.** Lleva el pasaporte.

        - **El tax-free cambia el 1 de noviembre.** Desde ese día se paga el precio entero en la
        tienda y el 10 % se devuelve al salir del país, cuando la aduana ve el reloj. O sea: el sábado
        14, en Narita, en el equipaje de mano y con el tique. Puede haber comisión por el reembolso.

        - **Y al llegar a Barcelona, se declara.** Pasa de los 430 euros que se pueden traer sin
        pagar en avión, así que toca el IVA del 21 % más un arancel pequeño. Aun así sale por debajo
        de los 1.430 euros a los que se vende en Europa.
    ver:
      - nombre: Seiko Dream Square
        maps: Seiko Dream Square Ginza 4-4-10
        nota: "Ginza 4-4-10. La tienda de la propia marca, con los modelos de «Core Shop»."
      - nombre: The Clock House
        maps: The Clock House Tokyo Seiko
        nota: El plan B, con certificación «Core Shop» y tiendas en Tokio. Llama antes.
      - nombre: "Onitsuka Tiger Ginza, Nippon Made"
        maps: "Onitsuka Tiger Ginza NIPPON MADE"
        nota: "Ginza 7-chōme, junto a la tienda grande. La línea hecha a mano en Japón, desde las 11:00."
  - block: Tarde
    time: "15:45–17:30"
    title: El museo que no sale en ninguna lista, y la azotea
    body: >-
      De Ginza a Marunouchi son quince minutos andando, hasta el edificio KITTE, la antigua central de
      Correos frente a la estación. En sus plantas segunda y tercera está el **Intermediatheque**, la
      recomendación de tu familia: las colecciones de la Universidad de Tokio en vitrinas de madera
      antiguas. Esqueletos, minerales, maquetas, animales disecados. Es gratis y, en sus palabras, «no
      hay ni un turista».


      Al cerrar, se sube a la sexta planta del mismo edificio, al **KITTE Garden**. El sol se pone hacia
      las 16:40 y, en cuanto oscurece, el edificio de ladrillo de la estación se enciende ahí debajo,
      con los trenes entrando y saliendo alrededor.
    window:
      label: Horarios
      body: >-
        **El Intermediatheque abre de 11:00 a 18:00** (viernes y sábados hasta las 20:00) y cierra los
        lunes. **La azotea es gratis**, pero se cierra con mal tiempo: si llueve, la estación se ve
        igual de bien desde la ventana de la planta.
    ver:
      - ficha: marunouchi
        nota: La antigua oficina de Correos, el Intermediatheque y lo demás alrededor de la estación.
      - nombre: Intermediatheque
        maps: Intermediatheque Tokyo
        nota: Las colecciones de la Universidad de Tokio, gratis, en las plantas 2 y 3 de KITTE.
        lat: 35.6800322
        lon: 139.7645340
      - nombre: KITTE Garden
        maps: KITTE Garden Marunouchi
        nota: La azotea de la sexta planta, con la estación de Tokio iluminada a tus pies.
  - block: Noche
    time: "18:00–21:30"
    title: Vinilos en Shibuya
    body: >-
      Shibuya tiene la mayor concentración de tiendas de discos de la ciudad, y esta noche es para
      ellas. Qué buscar y por qué traerlo de aquí está en [los cuatro vinilos](#vinilos).


      Se empieza por lo grande: [Tower Vinyl](#tower-vinyl-shibuya), la sexta planta de Tower
      Records, con lo nuevo y lo usado juntos y abierta hasta las diez. Es donde buscar primero el
      *Cowboy Bebop*, y el *Scenery* de Ryo Fukui. Después, a cinco minutos por Udagawachō,
      [HMV record shop](#hmv-record-shop-shibuya), que es la parada de la segunda mano japonesa y
      cierra a las nueve. Se cena entre una y otra. Y si queda un rato antes de las nueve, en la sexta
      planta del Parco, a cinco minutos, está Nintendo TOKYO, la tienda de la propia marca.


      A las nueve y cuarto, Yamanote a Akihabara: en **Yodobashi Akiba**, junto a la estación y
      abierta hasta las 22:00, pide que te aparten las dos copias del Zelda que sale mañana. Y
      después, el onsen del [Super Hotel Premier](#super-hotel-premier-akihabara), que esta noche ya
      es tu cama.
    window:
      label: Ayer fue el día del disco
      body: >-
        El martes 3 es la ***Record no Hi***, el día del disco japonés: a medianoche salen a la venta
        las ediciones limitadas en vinilo de ese día, más de cien entre el 3 de noviembre y el 5 de
        diciembre. Hoy todavía queda algo en las estanterías; pregunta por ellas como レコードの日.
    ver:
      - nombre: Tower Vinyl Shibuya
        maps: Tower Records Shibuya
        nota: "Sexta planta. Más de cien mil discos, nuevos y usados, de 11:00 a 22:00."
      - nombre: HMV record shop Shibuya
        maps: HMV record shop Shibuya Udagawacho
        nota: "Udagawachō 36-2. La segunda mano japonesa, con su *obi*. De 11:00 a 21:00."
      - nombre: Nintendo TOKYO
        maps: Nintendo TOKYO Shibuya Parco
        nota: "Sexta planta del Parco, de 10:00 a 21:00. Lo que Nintendo solo vende en sus tiendas."
      - nombre: Yodobashi Akiba
        maps: Yodobashi Akiba
        nota: "Hasta las 22:00: los dos Zelda de mañana, apartados."
    comer:
      - comida: shogun-burger
        elegido: true
        nota: "La cena, en la sede de Shibuya: tu hamburguesa de siempre, abierta hasta las diez como mínimo."
      - comida: meikyoku-kissa-lion
        nota: "Un café entre tienda y tienda, en el salón de 1926 donde se escucha clásica y no se habla."
alt:
  label: Lo que se ha caído, y por qué
  body: >-
    Este día era **Yokohama**: el jardín Sankeien por la mañana, el barrio alto de los extranjeros y la
    terminal de Ōsanbashi al atardecer. Se cayó por la fecha y por la comida. Los arces de Sankeien
    tienen su mejor momento de mediados de noviembre a mediados de diciembre, así que el 4 eran verdes,
    y una mañana en Ginza no deja sitio para ir y volver con calma.


    De Yokohama quedó un tiempo el jazz de noche, y lo han desplazado los vinilos. Sigue ahí si
    prefieres escuchar discos a comprarlos: el Keihin-Tōhoku va de Tokio a Sakuragichō en unos
    cuarenta minutos y vuelve directo hasta Akihabara, y a tres minutos de esa estación, en el
    barrio de Noge, están [Chigusa](#chigusa), el primer *jazz kissa* del país, abierto hasta las
    22:00, y [Downbeat](#downbeat), el de 1956.
