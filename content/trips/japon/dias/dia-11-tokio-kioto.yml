blocks:
  - block: Mañana
    time: "09:09–11:30"
    title: El Nozomi por el Tōkaidō
    body: >-
      Dos horas y cuarto de Tokio a Kioto por la **línea de alta velocidad más transitada del
      mundo**, calcada sobre el viejo Tōkaidō, la carretera que unía Edo con la capital imperial y
      que Hiroshige recorrió estación a estación en sus cincuenta y tres estampas.


      Se baja en **lunes**, que es media ventaja: el Nozomi de media mañana va bastante más vacío que
      el del domingo, aunque conviene reservar igual. El [Fuji](#fuji) asoma por el lado E entre
      Mishima y Shin-Fuji, unos cuarenta minutos después de salir. Los asientos comprados son del
      lado A, así que toca levantarse y verlo desde la ventanilla de la puerta, al final del vagón.
    window:
      label: Las maletas, en el Nozomi
      body: >-
        **Esta vez no hay envío: las maletas van con vosotros.** Hasta 160 cm sumando largo, ancho y
        fondo caben en el portaequipajes de arriba. Por encima, el Tōkaidō Shinkansen exige asiento
        con espacio para equipaje grande, y las vuestras rondan los 172 cm: por eso este tren y los
        tres de la vuelta van reservados con ese tipo de asiento, la última fila del coche según la
        marcha. Sin él, ¥1.000 por maleta.
    comer:
      - comida: kurasu-kyoto
        elegido: true
        nota: El primer café al bajar del tren, a dos minutos de la estación y con la maleta al lado.
    ver:
      - nombre: "Sekigahara, por la ventanilla"
        maps: "Sekigahara Battlefield"
        nota: "Entre Gifu-Hashima y Maibara: el campo de la batalla de 1600 hacia la que va *Shōgun*."
        lat: 35.3704513
        lon: 136.4616148
  - block: Mediodía
    time: "11:30–13:30"
    title: Soltar las maletas y comer
    body: >-
      La entrada en el hotel es a las 15:00, pero no hace falta esperarla: **las maletas se dejan en
      recepción al bajar del tren**, que está a cinco minutos por la salida Karasuma, y el *check-in*
      se hace a la vuelta, hacia las seis.


      Se come en el centro, en Shimogyō, y de paso se aprende la regla de la ciudad: las calles van
      norte-sur y este-oeste y muchas se llaman por su número —*Shijō* es «cuarta avenida»—. En cuanto
      se entiende, Kioto deja de ser un laberinto. Del ramen a la Keihan de Gion-Shijō hay un paseo.
    ver:
      - ficha: kioto
        nota: La retícula del 794 copiada de Chang'an, y por qué la ciudad se libró de la bomba.
    comer:
      - comida: menya-inoichi
        elegido: true
        nota: Ramen de *dashi* de pescado con Bib Gourmand nueve guías seguidas, por menos de diez euros.
      - comida: ippudo-kyoto-porta
        nota: El ramen de siempre de Pablo, en la propia estación, nada más bajar del tren.
      - comida: sugari-kyoto
        nota: El plan B si Inoichi tiene cola. *Tsukemen* de caldo espeso cerca de Karasuma, y se entra donde haya hueco.
      - comida: amam-dacotan-kyoto
        nota: Ciento veinte panes junto a Karasuma-Oike, para llevar algo a la montaña.
  - block: Tarde
    time: "14:00–15:30"
    title: Tōfuku-ji, el puente sobre los arces
    body: >-
      Tres paradas de Keihan hacia el sur y se llega al **Tōfuku-ji**, uno de los cinco grandes
      monasterios zen de Kioto. Se viene por una sola cosa: el **Tsūten-kyō**, un puente de madera
      cubierto tendido sobre una vaguada llena de arces, desde el que las copas se ven por encima.
      Una hora basta.


      Va hoy, y no otro día, porque cierra a media tarde y comparte línea con Fushimi Inari: de la
      estación de JR Tōfukuji a la de Inari hay una parada.
    window:
      label: El color, este año
      body: >-
        El Tōfuku-ji suele estar en su punto a mediados de noviembre, pero la primera previsión de 2026
        retrasa los arces de Kioto hasta principios de diciembre: puede que lo pilléis empezando. En
        temporada el templo cambia el horario y el precio del puente, así que miradlo la víspera en su
        web. Es de los más llenos de Kioto en otoño, y a primera hora de la tarde **contad con cola
        para cruzar el puente**.
    ver:
      - nombre: Tōfuku-ji
        maps: Tofukuji Temple Kyoto
        nota: El puente Tsūten-kyō sobre la vaguada de arces, a una parada de Fushimi Inari.
        lat: 34.977444
        lon: 135.773529
  - block: Tarde
    time: "15:45–17:45"
    title: Los diez mil torii, subidos con luz y bajados de noche
    body: >-
      **Fushimi Inari no cierra nunca**: es una montaña con un santuario, abierta las veinticuatro
      horas y gratis. Por eso se puede elegir la hora, y la mejor para estos días es la del final de la
      tarde. Se sube con luz para ver el bermellón, se llega al mirador de **Yotsutsuji** hacia la
      puesta de sol, sobre las 16:45, con Kioto entera abajo, y se baja ya de noche.


      Abajo, a las cuatro, todavía hay gente. A partir de Yotsutsuji desaparece, y al anochecer se van
      los grupos y se encienden los faroles del camino: es cuando el túnel se queda casi para
      vosotros.
    window:
      label: Hasta dónde subir, y con qué luz bajar
      body: >-
        La cima está a dos horas y media ida y vuelta y **no tiene vistas**: el bosque se cierra.
        Yotsutsuji, a unos cuarenta minutos, es el punto de rendimiento decreciente. Bajad por el ramal
        de la derecha, que pasa por el estanque y por los santuarios pequeños donde la gente deja torii
        en miniatura. Por encima de Yotsutsuji hay tramos casi sin luz: llevad la linterna del móvil.
    ver:
      - ficha: fushimi-inari
        nota: Cada torii es una factura, con el donante y la fecha escritos por detrás. Se leen al bajar.
      - reco: alba-torii-fushimi
        nota: Un torii en miniatura con vuestro nombre, en una mesa de la bajada. A esa hora puede haber recogido.
  - block: Cena
    time: "18:30"
    title: La cocina de una capital sin mar
    body: >-
      Kioto está a una hora de la costa y su cocina se construyó tierra adentro: de ahí el
      ***kaiseki***, que nació aquí de la ceremonia del té, y el tofu, que por las aguas subterráneas
      de la ciudad tiene fama de ser el mejor del país.


      Y la regla de oro para los tres días: **las casas buenas son tres o cuatro veces más baratas al
      mediodía**, así que la alta cocina se reserva para un almuerzo y no para una cena. Hoy se cena
      después del *check-in* y sin alargarse, que el templo de la noche cierra la entrada a las 21:00.
    comer:
      - comida: tai-sushi
        elegido: true
        nota: Barra de barrio al norte de Shijō, sin ceremonia y con cola. Se deja uno llevar.
      - comida: kyoto-cinco-de-nakagyo
        nota: Cinco direcciones de cena, solo como pista. Sin verificar horarios.
  - block: Noche
    time: "19:30–21:00"
    title: Una pagoda a quince minutos del hotel, *iluminada*
    body: >-
      El Tō-ji se ve desde el tren al entrar en Kioto, y se deja para la noche. En otoño abre de
      noche con el ***raitoappu***: los arces del recinto iluminados y la pagoda de cinco pisos
      reflejada en el estanque. De noche se entra además al Kondō y al Kōdō, la sala de las
      veintiuna estatuas que forman un mandala en tres dimensiones. Este año se abre también la
      parte de atrás del altar y se puede rodear entero.

      - **Fechas:** del 31 de octubre al 13 de diciembre, todas las noches.

      - **Horario:** de 18:00 a 21:30, con última entrada a las 21:00.

      - **Precio:** ¥1.000, sin reserva. Es una entrada aparte de la de día.

      - **Lo que no entra:** la pagoda por dentro, que solo abre de día. De noche se mira desde
      fuera.


      Está a quince minutos andando del hotel, así que se vuelve a pie.
    window:
      label: Las otras noches con luz
      body: >-
        Las fechas de 2026 ya se saben. El castillo de Nijō es mañana, en el
        [día 12](#dia-12-kioto-oeste). Kōdai-ji y Shōren-in caen dentro del
        [día 13](#dia-13-kioto-este). La de Kiyomizu-dera empieza cuando ya os habéis ido.
    ver:
      - nombre: Tō-ji
        maps: Toji Temple Kyoto
        nota: La pagoda de madera más alta de Japón, cincuenta y cinco metros, en un templo del año 796.
        lat: 34.9806311
        lon: 135.7477192
      - nombre: "Sitio de la puerta Rajōmon"
        maps: "Rajomon Gate Site Kyoto"
        nota: "Un pilar de piedra donde estuvo la puerta de *Rashōmon*, a un cuarto de hora andando del Tō-ji."
        lat: 34.9793228
        lon: 135.7426316
alt:
  label: Si te desmarcas
  body: >-
    El Shinkansen no es la única forma de bajar, y hay una que convierte el trayecto en el plan del
    día: parar en **Nagoya** y desviarse una hora hasta el santuario de **Ise** —el más sagrado de
    Japón, dedicado a Amaterasu, que se **derriba y se reconstruye entero cada veinte años** desde
    hace trece siglos— o hasta **Himeji**, ya pasado Kioto, cuyo castillo blanco es el que Matsumoto
    no es: el más grande, el más fotografiado y el que nunca fue atacado.


    Y si lo que apetece es lo contrario —no moverse—, una tarde en Kioto sin plan es de las mejores
    del viaje: se elige una calle norte-sur y se anda hasta que se acaba.
