title: El día de comprar, que en Tokio *es una disciplina*
dek: >-
  Un domingo entero sin agenda, con las maletas grandes de vuelta y quince días de lista mental
  acumulada. En esta ciudad comprar no es un trámite: hay barrios enteros dedicados a una sola cosa.
