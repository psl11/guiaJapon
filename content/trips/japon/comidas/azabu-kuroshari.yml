body: >-
  Aquí el reclamo es el arroz, y es una rareza de verdad: el *shari* va **teñido de negro con carbón
  activo hecho de cáscara de palma triturada**, y sin azúcar blanco. No es una ocurrencia de un
  cocinero — lo desarrolló durante seis años una empresa de cosmética y alimentación, con el
  argumento de que el carbón fija metales pesados del pescado. Se lo cree quien quiera; el plato
  existe y no se parece a ningún otro *[sushi](#sushi)* que vayáis a ver.


  El formato es cerrado: quince asientos, veinte pases con diez *nigiri* dentro, y dos turnos, de
  18:00 a 19:45 y de 20:00 a 22:00. Está en Azabu-Jūban, a un paseo del hotel de Roppongi, así que
  encaja en cualquiera de las cuatro noches de esa tanda sin coger un tren.


  Y el dato que decide: **son 27.500 yenes por persona**, unos ciento sesenta y cinco euros. Es, con
  diferencia, la comida más cara que aparece en esta guía. Va aquí porque es un sitio real y
  singular, no porque cuadre con el presupuesto de nadie.
