body: >-
  Udon hecho en la casa siguiendo la regla de los tres «recién»: **amasado, cortado y hervido al
  momento**. Lo que lo puso en circulación no es eso, sino un plato que no debería funcionar y
  funciona — el udon a la carbonara, con yema y pimienta, a novecientos cincuenta yenes.


  Está a ciento cincuenta metros de [Henry's Burger](#henrys-burger-harajuku), en un callejón que
  sale de la Cat Street, o sea dentro del mismo tramo del día 9. Abre de 11:30 a 21:30 salvo los
  martes, que cierra a las 16:30; el día 9 es sábado, así que da igual.


  La cola es la pega y es constante, no de fin de semana: hay gente esperando prácticamente siempre.
  Quien lo recomienda esperó cuarenta y cinco minutos en la cena y le puso un siete sobre diez —
  merece probarlo, no merece media hora larga de pie. Con dos sitios buenos a la misma distancia, la
  decisión razonable es mirar la cola y elegir.
