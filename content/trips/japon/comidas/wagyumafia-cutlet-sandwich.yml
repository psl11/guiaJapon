quePedir: "**Mirad el precio antes de señalar en la carta.** El de *chateaubriand* de Kobe es el de las fotos, y el que pasa de los veinte mil yenes."
body: >-
  Un mostrador pequeño, casi para llevar, que hace una sola cosa:
  sándwiches de *katsu* de wagyu, la carne rebozada en panko y frita, entre dos rebanadas de pan de
  molde. La carta va por cortes y sube deprisa. El de arriba, el de *chateaubriand* de Kobe, está
  entre los sándwiches más caros del mundo.


  **Pablo compró uno por error**, de 125 euros, para disgusto de su novia. Y aun así lo recomienda,
  sabiendo lo que se pide.
