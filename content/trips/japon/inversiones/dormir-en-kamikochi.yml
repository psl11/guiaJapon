navLabel: "Dormir en el valle"
trip: japon
order: 3
kicker: Decisión de dinero · día 4
title: Dormir *dentro* de Kamikōchi
verdict: imprescindible
verdictLabel: Imprescindible, pero completo
lede: >-
  El análisis daba que sí sin discusión, y aun así esta es la única decisión del viaje que no se pudo
  tomar: cuando se preguntó, no quedaban camas. Queda aquí porque explica qué se pierde.
ledger:
  - label: Cuesta
    body: >-
      Los hoteles del valle son **caros para lo que ofrecen** —son casas de montaña estacionales, no
      hoteles de ciudad— y suelen ir con **media pensión**, que en realidad conviene porque allí no hay
      otra cosa. Bastante más que una noche en Matsumoto.
  - label: Qué compra
    body: >-
      **Las dos horas que nadie más tiene.** Los autobuses entran a media mañana y salen a media tarde:
      quien duerme fuera solo ve el valle en su franja concurrida y con la luz peor. Dormir dentro
      compra **el atardecer, la noche sin una sola farola y, sobre todo, el amanecer** — que en
      noviembre significa escarcha, niebla levantándose del agua y el Hotaka nevado reflejado en el
      estanque Taishō, sin viento y sin nadie.


      Es, con diferencia, la mejor fotografía posible de las tres semanas.
  - label: Lo que hay en su lugar
    body: >-
      **El valle en el día y la noche en Hirayu Onsen**, veinticinco minutos montaña abajo. Ver
      [cómo queda](#kamikochi-en-el-dia). Se pierde la franja tranquila del amanecer y se gana un
      pueblo termal con posadas de verdad, abiertas todo el año, donde reservar no es una hazaña. Y
      se gana algo que dentro del valle no había: **un onsen**. Es peor plan y bastante menos
      frágil.
  - label: Veredicto
    body: >-
      **El razonamiento sigue en pie: si se puede, se duerme dentro.** Lo que falló no fue la
      decisión sino el calendario — **las reservas de la temporada abren en enero y el Shirakabaso
      cierra el 14 de noviembre**, así que las últimas noches buenas del año se venden con muchos
      meses de antelación. Para quien lea esto a tiempo, la conclusión es una sola: **es lo primero
      que hay que reservar del viaje, antes que los vuelos**.


      Dicho eso, y ya sin la venda: **la versión de un día no es un desastre**. Las sendas son
      llanas, once horas de luz dan para el valle entero de punta a punta y la jornada acaba en un
      *rotenburo* con la temperatura bajo cero. Se pierde una hora irrepetible —el amanecer en el
      Taishō— y no se pierde el sitio.
curiosidades:
  - >-
    El valle **cierra el 15 de noviembre** y los hoteles cierran antes que la carretera. Sus últimas
    noches de temporada son, por eso mismo, **de las primeras que se agotan**: se venden desde enero.
