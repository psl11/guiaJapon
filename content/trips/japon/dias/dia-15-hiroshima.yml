slug: dia-15-hiroshima
navLabel: "Día 15 · Hiroshima"
trip: japon
order: 15
eyebrow: El plan · Día 15 · vie 20 nov
title: Hiroshima, y la ruina que se decidió *no arreglar*
dek: >-
  Dos horas de Shinkansen y el día más difícil del viaje. No es un día de monumentos: es un día de
  entender una decisión —qué se conserva y qué se rehace— y de comprobar que la ciudad de alrededor
  está muy viva.
blocks:
  - block: Mañana
    time: "08:00–10:30"
    title: El Shinkansen al oeste
    body: >-
      Hora y cuarenta desde [Kioto](#kioto) por el Sanyō Shinkansen. Es el tramo largo del viaje y el mejor
      para leer con antelación lo que viene: la [ficha de Hiroshima](#hiroshima) conviene llevarla
      hecha, porque el parque se anda mucho mejor sabiendo lo que se mira.
    window:
      label: El tercer envío de maletas
      body: >-
        **Hoy salen las maletas grandes hacia Tokio.** Quedan dos noches fuera —Hiroshima y la vuelta—
        y cargar con equipaje hasta [Miyajima](#miyajima) y luego cuatro horas de tren no tiene sentido. Ver
        [takkyūbin](#takkyubin).
  - block: Mediodía
    time: "11:00–13:00"
    title: La cúpula, y el eje
    body: >-
      Se entra por la cúpula y se baja hacia el sur, que es como está pensado el recorrido. Lo que
      hay que hacer aquí es **una sola cosa y hacerla bien**: colocarse en el punto exacto delante del
      cenotafio desde el que **el arco enmarca la llama y, al fondo, la ruina**. Están alineados a
      propósito y el efecto solo aparece desde ahí.

      El porqué de todo esto —quién la construyó, por qué sigue en pie y por qué se decidió no
      arreglarla— está en [la ficha de Hiroshima](#hiroshima), y merece leerse en el tren.
    window:
      label: El detalle que se pasa por alto
      body: >-
        Buscad el epitafio del cenotafio y fijaos en que **no tiene sujeto**: es lo que más se
        discute del parque y se entiende mejor teniéndolo delante.
  - block: Tarde
    time: "13:00–16:00"
    title: El museo
    body: >-
      El **Museo Memorial de la Paz** se renovó entero en 2019 y hoy apenas usa texto: son objetos y
      testimonios en primera persona. Es **duro**, está hecho sin sensacionalismo y sin señalar
      culpables, y se sale en silencio.

      Dos avisos prácticos que importan más de lo que parecen: **hora y media larga como mínimo**, y
      **no encadenarlo con nada**. Hace falta una hora de calle después, y por eso el bloque siguiente
      es un paseo.

      Fuera, el **Monumento a los Niños**, por **Sadako Sasaki**. Llegan millones de grullas de papel
      cada año desde colegios de todo el mundo y se exponen en vitrinas alrededor.
  - block: Atardecer
    time: "16:00–18:00"
    title: La ciudad que está viva
    body: >-
      Y ahora lo importante: **Hiroshima es una ciudad de un millón doscientos mil habitantes**, no un
      cementerio. Dos maneras de comprobarlo antes de cenar, y las dos cuestan cero:

      - Buscad las **placas de los árboles supervivientes** —los *hibakujumoku*—, que hay varias en el
        propio parque. Son fáciles de pasar por alto y cambian la manera de mirar el sitio.
      - Y **volved en tranvía** aunque no haga falta: algunos de los vagones que circulan hoy estaban
        aquí en 1945. [La ficha](#hiroshima) cuenta cuáles.
  - block: Noche
    time: "noche"
    title: Okonomi-mura
    body: >-
      A cenar a [**Okonomi-mura**](https://www.google.com/maps/search/?api=1&query=Okonomimura%20Hiroshima),
      un edificio con más de veinte planchas apiladas en varias plantas: se elige puesto, se sienta uno
      a la barra y el cocinero lo monta delante. Pedid el de aquí, que **no tiene nada que ver con el
      de Osaka** —ver [el okonomiyaki](#okonomiyaki)— y, si hay, **ostras**: noviembre es el arranque
      de su temporada.
alt:
  label: Si te desmarcas
  body: >-
    [**Shukkei-en**](https://www.google.com/maps/search/?api=1&query=Shukkeien%20Garden%20Hiroshima), un jardín de 1620 arrasado por la bomba y replantado, con un ginkgo superviviente
    dentro y casi nadie: es el contrapeso exacto al parque, a diez minutos andando. Y el **Museo de
    Arte Contemporáneo**, en la colina de Hijiyama, con una colección construida a propósito alrededor
    de la idea de la reconstrucción.
