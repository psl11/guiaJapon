quePedir: >-
  ***Zaru soba*** fría —sí, en noviembre: es como se juzga el fideo— y ***sobayu***, el agua de cocción que se bebe al final con lo que queda de salsa.
body: >-
  Nagano se llamaba **Shinshū** y su soba tiene nombre propio por una razón de agronomía: aquí el arroz no crecía bien y el trigo sarraceno sí, así que la montaña comió *soba* durante siglos mientras la llanura comía arroz. Es de los pocos casos en que un plato japonés nace de la pobreza y acaba siendo el prestigioso.


  Matsumoto está lleno de casas pequeñas alrededor de **Nakamachi**, la calle de almacenes blancos y negros. Buscad las que muelen a la vista y las que cierran cuando se acaba la masa: las dos señales valen más que cualquier lista.
