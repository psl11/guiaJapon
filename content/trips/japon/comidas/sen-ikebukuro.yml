body: >-
  Esto no es ramen sino *[tsukemen](#tsukemen)*: el fideo va aparte y se moja en un caldo mucho más
  concentrado. El de la casa mezcla hueso de cerdo y de pollo con cuatro *dashi* de pescado, y el
  fideo, de trigo de Hokkaidō, se puede pedir frío o recién escurrido. Las tres raciones cuestan lo
  mismo.


  La sala es de barra, con diseño negro y jazz de fondo, y se pide en máquina. Es de las cosas que
  explican por qué el *tsukemen* de Ikebukuro tiene fama propia: el barrio es su cuna.


  Y el pero, dicho claro: **Ikebukuro no aparece en ningún día de este viaje**. Está al noroeste de
  la Yamanote y ninguna jornada pasa cerca. Va en la guía por si alguien se desmarca una tarde, no
  porque encaje.
