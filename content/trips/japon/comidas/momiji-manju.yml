quePedir: >-
  Uno **recién salido del molde**, todavía caliente, y si lo encontráis, la versión ***age-momiji***: el mismo dulce rebozado y frito.
body: >-
  Un bizcochito **con forma de hoja de arce** relleno de pasta de judía, inventado en la isla hacia 1906 y hoy el souvenir comestible de media prefectura. La gracia no es comprarlo en caja: es comerlo **recién hecho**, saliendo de las máquinas de molde que los puestos tienen a la vista de la calle.


  Y la coincidencia es buena: estáis en Miyajima el 21 de noviembre, con los arces de verdad girando a rojo en el **valle de Momiji-dani**, que es el que da nombre al dulce.
