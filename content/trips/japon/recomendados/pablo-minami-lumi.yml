body: |
  La Shinjuku Minami Lumi enciende unas 275.000 luces en seis edificios alrededor de la salida sur
  de la estación: la plaza del pingüino de Suica, junto a las barreras Shin-Minami de JR, la torre
  JR Shinjuku Miraina, los grandes almacenes Takashimaya Times Square y el paseo de Southern Terrace,
  entre otros. Suena la misma música en todos.

  Este año tiene un motivo propio: el pingüino de la tarjeta Suica se retira en marzo de 2027, y
  le han puesto un pasillo de flores con una puerta para hacerse la foto despidiéndolo.

  La recomienda Pablo como último paseo de la noche del viernes 13. Está encendida hasta
  medianoche y queda de camino a la línea Ōedo, que es la que lleva de vuelta a Roppongi.
