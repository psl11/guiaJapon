blocks:
  - block: Amanecer
    time: "07:00–09:00"
    title: Los mercados, antes de que llegue nadie
    body: >-
      Takayama tiene **dos mercados matinales** y llevan celebrándose desde el periodo Edo: el de
      Miyagawa, en la orilla del río, y el de Jinya-mae, frente a la antigua oficina de gobierno.
      Abren sobre las 6:00 o las 7:00 y recogen a mediodía. No son mercados para turistas: se venden
      encurtidos, verdura de montaña, manzanas de Hida, flores y *mitarashi dango* —bolitas de arroz
      a la brasa con salsa de soja— que se comen andando.


      El autobús no sale hasta la una y veinte, así que hoy no hay prisa: el desayuno se hace ahí
      mismo.
    window:
      label: Ventana óptima
      body: >-
        **Es la única hora en que este pueblo es de los suyos**, y por eso está aquí y no ayer. A las
        diez llegan los autobuses de día desde Nagoya y [Kanazawa](#kanazawa), y hasta las cuatro de
        la tarde Sanmachi es una fila india — que es exactamente lo que visteis ayer. El contraste
        entre las siete y las once de la mañana no lo tiene ningún otro sitio del viaje, y hoy lo
        cogéis por el lado bueno.
    ver:
      - nombre: Mercado de Jinya-mae
        maps: Jinya-mae Morning Market Takayama
        nota: El segundo mercado, en la explanada frente al Takayama Jinya de ayer.
        lat: 36.1396447
        lon: 137.2582195
    comer:
      - comida: miyagawa-asaichi
        elegido: true
        nota: El de la orilla del río, desde las siete. El *mitarashi dango* de aquí es salado, a la brasa.
  - block: Mañana
    time: "09:30–13:20"
    title: La ladera de los templos, y el autobús de mediodía
    body: >-
      Los autobuses de la mañana a Shirakawa-gō se agotaron, y eso devuelve a Takayama lo que ayer se
      cambió por Furukawa: el **Higashiyama Walking Course**, por la ladera este. Es hora y media
      entre una docena de templos hasta las ruinas del castillo, y a esta hora se anda casi en
      solitario.


      Después, *check-out*, algo de comer cerca de la estación y el autobús de las 13:20, que sale
      del Nohi Bus Center, pegado a ella. Son cincuenta minutos, y el trayecto merece la ventanilla:
      se cruza la divisoria por túneles y se sale al otro lado, al valle del río Shō.
    window:
      label: Mandad las maletas
      body: >-
        **Hoy es el segundo envío por [takkyūbin](#takkyubin)**, y se pide en recepción anoche, no
        esta mañana con los mercados abiertos. Las maletas grandes salen del hotel de Takayama hacia
        el de **Tokio** y llegan mañana, a la vez que vosotros. En Shirakawa-gō se anda por caminos de
        tierra y en Kanazawa se llega de noche: cargar con equipaje aquí no tiene ningún sentido.
    ver:
      - nombre: Higashiyama Walking Course
        maps: Higashiyama Walking Course Takayama
        nota: Una docena de templos por la ladera este, hasta las ruinas del castillo. Hora y media.
      - reco: alba-takayama-hokuriku-pass
        nota: El pase regional que cubre estos autobuses, y por qué aun así no sale a cuenta.
  - block: Tarde
    time: "14:10–17:20"
    title: Ogimachi, y por qué los tejados están así
    body: >-
      Tres horas dan para hacerlo en orden, empezando por lo que cierra: la casa Wada por dentro y el
      templo de Myōzen-ji, de camino hacia el puente. Las casas cierran sobre las cinco.


      Luego se sube al **mirador de Shiroyama**, a veinte minutos a pie, para ver el valle entero con
      las granjas alineadas. El sol se pone hacia las 16:40, y se baja a la terminal con las ventanas
      ya encendidas y los autobuses de excursión idos.
    window:
      label: Lo que hay que entrar a ver
      body: >-
        La **casa Wada**, la más grande del pueblo, se visita entera y se sube al desván, que es
        donde está la historia buena: allí se criaban gusanos de seda con el calor del hogar, y
        debajo del suelo se fabricaba salitre para pólvora con la tierra del hogar y los
        excrementos de los gusanos. El valle abastecía en secreto al dominio de Kaga — al que vais
        esta tarde.


        Si sobra tiempo, otras dos se visitan por dentro: la **Kanda**, una rama de los Wada, cuyo
        desván del cuarto piso hace de mirador, y la **Nagase**, de 1890 y cinco plantas contando el
        entresuelo, con instrumental médico de la época Edo en la de abajo.
    ver:
      - ficha: shirakawa-go
        nota: Por qué los tejados van a 45 grados, sin un clavo, y cómo los rehace el pueblo entero.
      - nombre: Mirador de Shiroyama
        maps: Ogimachi Castle Site Observatory Shirakawa-go
        nota: El valle entero con las granjas alineadas. Es *la* foto.
        lat: 36.2629545
        lon: 136.9079634
      - nombre: Casa Wada
        maps: Wada House Shirakawa-go
        nota: La más grande del pueblo, hecha con el dinero del salitre. Se sube al desván.
      - nombre: Casa Kanda
        maps: Kanda House Shirakawa-go
        nota: La rama de los Wada. El desván del cuarto piso es un mirador sobre los tejados.
      - nombre: Casa Nagase
        maps: Nagase House Shirakawa-go
        nota: De 1890, cinco plantas con el entresuelo, y el instrumental de un médico de Edo.
        lat: 36.259924
        lon: 136.9076278
      - nombre: "Myōzen-ji"
        maps: Myozenji Temple Shirakawa-go
        nota: Un templo con el campanario también techado de paja, caso raro.
        lat: 36.2559101
        lon: 136.9065906
  - block: Atardecer
    time: "17:20–19:45"
    title: Bajar a Kanazawa, por Shin-Takaoka
    body: >-
      Hora y media de autobús hasta Shin-Takaoka y un cuarto de hora de Shinkansen hasta
      **Kanazawa**. El cambio de mundo es brusco: de un valle de cien casas a una ciudad de medio
      millón, con mar al lado y marisco serio. Se llega de noche, y antes de ir al hotel merece la
      pena salir por la puerta de delante, que iluminada luce más que de día.
    ver:
      - nombre: Tsuzumi-mon
        maps: Tsuzumi-mon Gate Kanazawa Station
        nota: "La puerta de madera de 2005 bajo la cúpula de cristal: trece metros con forma de tambor de nō."
        lat: 36.5777907
        lon: 136.6491024
      - ficha: kanazawa
        nota: El dominio de Kaga, un millón de *koku* y ninguna guerra. Mañana se anda entera.
  - block: Noche
    time: "20:00"
    title: Marisco del mar del Japón
    body: >-
      Kanazawa está en la otra costa y su cocina lo nota. La temporada del **cangrejo de las nieves**
      abre justo el 6 de noviembre, así que está en su primera semana buena; y hay gamba dulce,
      vieira y *nodoguro*, la perca de garganta negra.


      A esta hora los puestos de Ōmichō ya han cerrado, y se ven mañana por la mañana. Dentro del
      mismo edificio, enfrente del hotel, la barra de sushi de Rekireki abre hasta las diez.


      Si al salir apetece andar, el **santuario Oyama** está a diez minutos: su puerta de 1875 lleva
      arriba vidrieras de colores y se ilumina al anochecer. Las luces se apagan hacia las nueve o las
      diez, así que conviene ir directos desde la cena. Ida y vuelta es media hora, y si no, al hotel,
      que está enfrente.
    ver:
      - nombre: Santuario Oyama
        maps: Oyama Shrine Kanazawa
        nota: La puerta de 1875, mitad japonesa y mitad holandesa, con las vidrieras iluminadas de noche.
    comer:
      - comida: "sushi-rekireki-omicho"
        elegido: true
        nota: "Reservada a las 20:00 para cuatro, solo mesa: el menú se elige allí. Pedid el rollo de *nodoguro*."
alt:
  label: Si te desmarcas
  body: >-
    En Shirakawa-gō, **cruzar el puente colgante y quedarse en la orilla de enfrente**: casi todo el
    mundo se queda en la calle principal y a doscientos metros ya no hay nadie. Al otro lado está
    el [Gasshō-zukuri Minka-en](https://www.google.com/maps/search/?api=1&query=Gassho-zukuri%20Minkaen%20Shirakawa-go),
    el museo al aire libre que cita Japonismo: veinticinco construcciones traídas de pueblos del
    valle que se quedaron vacíos, nueve de ellas protegidas por la prefectura. Unos ¥600. Y si el grupo va con
    prisa, Suganuma, un segundo pueblo *gasshō* diez kilómetros al norte con nueve casas y ningún
    autobús turístico, es lo que Shirakawa-gō era hace treinta años.
