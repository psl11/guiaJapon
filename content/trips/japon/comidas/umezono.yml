body: >-
  Abierta en **1854**, quince años antes de que Tokio se llamara Tokio. Inventaron aquí el ***awa-zenzai***, y siguen haciendo el repertorio entero del ***kanmidokoro***, el salón de dulces japonés: *anmitsu*, *zenzai*, *kuzumochi*, todo con el mismo azúcar negro de Okinawa.


  El ***kanten*** —la gelatina de alga que sostiene el *anmitsu*— es la razón por la que la repostería japonesa tradicional es casi toda apta: en Japón nunca se usó gelatina animal porque nunca hizo falta.
