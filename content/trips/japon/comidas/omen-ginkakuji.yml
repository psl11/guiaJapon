quePedir: >-
  El ***omen***: udon grueso servido frío o caliente **con siete verduras de temporada en un plato aparte** y sésamo tostado, que se echan al gusto.
body: >-
  Su plato es una idea sencilla y buenísima: el fideo por un lado, el caldo por otro y **un plato de verduras de temporada cortadas finas** —berenjena, jengibre, espinaca, alga, sésamo— para que cada uno construya su cuenco. Se come muy bien y, por una vez, es un plato japonés tradicional donde la verdura es el protagonista y no el adorno.


  Está a dos minutos del [**Ginkaku-ji**](#higashiyama), al principio del Paseo del Filósofo, que en la tercera semana de noviembre es uno de los sitios con más arce rojo de Kioto. Comer aquí y salir a andar es el plan del día 12.
