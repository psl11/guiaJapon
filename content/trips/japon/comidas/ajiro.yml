  El menú de temporada. En noviembre giran sobre setas, castaña, caqui y raíces.
body: >-
  **Una estrella Michelin haciendo únicamente *shōjin ryōri***, que es una rareza incluso en Kioto. Llevan generaciones cocinando para los monjes de Daitoku-ji —esa es literalmente su clientela original— y de ahí sale una carta que trabaja la soja, la raíz y la seta con la precisión que otros dedican al pescado.


  Si el viaje se permite **una** comida cara, esta compite de tú a tú con el kaiseki y cuesta bastante menos. Y va a sorprender: casi nadie espera que una carta sin un solo producto animal sea la que más le haga pensar en toda Kioto.
