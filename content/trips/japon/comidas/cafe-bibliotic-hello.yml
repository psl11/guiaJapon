  Café y **tarta del día**, y sentarse arriba, donde están los libros.
body: >-
  Una ***machiya*** —casa de madera tradicional de Kioto, estrecha y larguísima— convertida en café de dos alturas con las paredes forradas de libros de arte y unos plataneros enormes en la entrada. Es de los sitios que explican por qué Kioto no es un museo: la casa tiene doscientos años y dentro hay gente trabajando con el portátil.


  Lo pongo como plan de tarde de lluvia, que en noviembre es un escenario probable: se entra por un pasillo entre plataneros, se pide arriba y se pierde la hora.
