title: La tarjeta IC, y por qué no hace falta más
area: Tokio y todo el tramo
note: "Suica o Pasmo · el metro NO es JR"
body: >-
  Lo primero al llegar: una **tarjeta IC** —**Suica** o **Pasmo**, da igual cuál—. Es una tarjeta
  recargable que vale para **metro, trenes JR y privados, muchos autobuses**, taquillas de
  consigna y para pagar en el konbini. Se recarga en cualquier máquina y se acabaron los billetes
  sueltos. También se puede llevar en el móvil.


  El detalle que confunde a todo el mundo: **el metro de Tokio no es JR**. Son dos redes distintas
  (Tokyo Metro y Toei, más las privadas), y ningún pase de JR las cubre. Con la IC card eso da
  exactamente igual, porque pasa por todos los tornos.


  Dos apuntes sobre la tarjeta física. Lleva una **fianza** que se devuelve al entregarla — pero
  **eso solo se puede hacer en Haneda, no en Narita**, así que si voláis por Narita, dadla por
  amortizada o quedáosla de recuerdo. Y desde hace un par de años la venta de tarjetas físicas ha
  estado restringida a ratos: **lo más seguro es cargar la Suica en el móvil** nada más aterrizar,
  que además se recarga con tarjeta extranjera y no caduca.


  **La otra cosa que hay que saber de Tokio: el último tren.** Aquí no hay metro nocturno. La red se
  para **entre las 00:00 y la 1:00** y no vuelve a arrancar hasta las cinco de la mañana, y a partir
  de esa hora la única salida es un taxi caro o aguantar hasta el amanecer — que es exactamente por
  lo que existen los karaokes de 24 horas y los baños públicos abiertos toda la noche. La noche de
  Golden Gai del día 3 hay que mirarla con esto delante: **la última copa la marca el reloj de la
  estación**, no las ganas.


  Para las distancias largas del tramo —Kamakura, Matsumoto— se compran **billetes sueltos**, con
  asiento reservado en el Azusa. Ver la ficha de inversión del **JR Pass**: en este viaje no sale a
  cuenta.
