title: El valle de los tejados, y *bajar al mar del Japón*
dek: >-
  Día de autobús con una parada larga en medio: un valle aislado donde las casas se construyeron
  para dos metros de nieve y para fabricar pólvora en secreto. Se termina en Kanazawa, que es otra
  cosa completamente distinta.
