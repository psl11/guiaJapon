slug: dia-20-flexible
navLabel: "Día 20 · Comodín"
trip: japon
order: 20
eyebrow: El plan · Día 20 · mié 25 nov
title: El día comodín, que *no es un día perdido*
dek: >-
  El único día del viaje sin plan asignado, y está puesto a propósito. Sirve para el Fuji si el 23
  salió nublado, para lo que se quedó fuera en Tokio, o para no hacer nada — que después de veinte
  días también es una opción legítima.
blocks:
  - block: Amanecer
    time: "06:30"
    title: La segunda oportunidad del Fuji
    body: >-
      Primera lectura del día: **si el 23 estuvo tapado y hoy amanece limpio, hoy se va al Fuji**. Es
      exactamente para esto que hay dos días marcados. Se mira la cámara en directo del lago, se
      comprueba si se ve la montaña desde el mirador del [Gobierno Metropolitano](https://www.google.com/maps/search/?api=1&query=Tokyo%20Metropolitan%20Government%20Building), y se decide antes de
      las siete. Todo lo demás está en [el día 18](#dia-18-fuji) y en [la ficha del Fuji](#fuji).
  - block: Mañana
    time: "09:00–13:00"
    title: "Si el Fuji ya está hecho: la lista de pendientes"
    body: >-
      A estas alturas del viaje cada uno tiene la suya. Las tres que suelen quedar colgando:

      - **Los museos de [Ueno](#ueno)**, si el 23 se fue al lago: el **Museo Nacional de Tokio** es el
        más completo del país y dos horas en el edificio principal bastan.
      - **[Ryōgoku](#ryogoku)** y el barrio del sumo, con *chanko-nabe* de mediodía en un antiguo
        *dōjō*.
      - **[El Palacio y Marunouchi](#marunouchi)**: el jardín este es gratis, y el
        [**Intermediatheque**](https://www.google.com/maps/search/?api=1&query=Intermediatheque%20Tokyo), encima de la estación, es de lo mejor de la ciudad y también gratis.
    window:
      label: Hoy es miércoles
      body: >-
        Y eso resuelve el problema del principio de semana: **lo que cerró el lunes por ser lunes, y
        lo que cerró ayer por el traslado del festivo, hoy está todo abierto**. Es el mejor día de la
        semana que os queda para cualquier cosa con taquilla.
  - block: Tarde
    time: "14:00–17:00"
    title: El momiji, en su mejor semana
    body: >-
      Hoy es **25 de noviembre** y estáis dentro del pico de la hoja roja en Tokio. Dos sitios que hoy
      están en su punto exacto:

      - La avenida de ginkgos de [**Meiji Jingū Gaien**](https://www.google.com/maps/search/?api=1&query=Meiji%20Jingu%20Gaien%20Ginkgo%20Avenue%20Tokyo), que amarillea justo ahora y tiene su festival
        del **23 al 30 de noviembre**: ciento cuarenta y seis árboles en trescientos metros, con
        puestos de comida debajo. Es el número uno de casi todas las listas nacionales.
      - [**Rikugi-en**](https://www.google.com/maps/search/?api=1&query=Rikugien%20Garden%20Tokyo) o [**Koishikawa Kōrakuen**](https://www.google.com/maps/search/?api=1&query=Koishikawa%20Korakuen%20Garden%20Tokyo), con **iluminación nocturna** en temporada.

      Ver [el momiji](#momiji). Los que se fueron el día 13 se lo perdieron por una semana.
  - block: Noche
    time: "noche"
    title: La última cena de verdad
    body: >-
      Mañana es día de aeropuerto, así que esta es la última noche útil. Es el momento de gastarse lo
      que quede: una barra de [sushi](#sushi) con *omakase*, el **Tōfuya Ukai** con reserva, o lo contrario —
      [**Omoide Yokochō**](https://www.google.com/maps/search/?api=1&query=Omoide%20Yokocho%20Shinjuku%20Tokyo) y sus barras de seis taburetes, que después de veinte días probablemente
      apetezca más. Ver [Shinjuku](#shinjuku).
alt:
  label: Si te desmarcas
  body: >-
    Un día entero libre en Tokio es la ocasión de las cosas raras: el **tranvía Toden Arakawa** de
    punta a punta —una hora cruzando el norte por detrás de las casas—, la catedral de acero de
    **Tange**, la escuela de **Frank Lloyd Wright** o [**Kagurazaka**](https://www.google.com/maps/search/?api=1&query=Kagurazaka%20Tokyo) y sus callejones con geishas. Está
    todo en [Ikebukuro y el norte](#ikebukuro). Y si el cuerpo pide parar: un ***sentō*** de barrio y
    tres horas sin hacer nada.
