slug: dia-21-vuelo
navLabel: "Día 21 · Vuelo"
trip: japon
order: 21
eyebrow: El plan · Día 21 · jue 26 nov
title: El último día, que *dura hasta las nueve*
dek: >-
  El vuelo sale a las 21:00, así que hoy no es un día de aeropuerto: son ocho horas útiles de ciudad
  con la maleta ya cerrada. Solo hay que resolver dónde dejarla.
traslados:
  - desde: "El hotel"
    hasta: "Haneda T3"
    medio: "Toei Asakusa y Keikyū, sin transbordo"
    duracion: "30–45 min"
    hora: "salir 17:00–18:00"
    nota: "El vuelo sale a las 21:00. Aquí **sí se devuelve la fianza de la tarjeta IC**: es el único aeropuerto donde se puede."
blocks:
  - block: Mañana
    time: "09:00–10:00"
    title: "Lo primero: soltar el equipaje"
    body: >-
      Tres opciones, de mejor a peor:

      - **Dejarlo en el hotel** después del *check-out*. Casi todos lo guardan hasta la tarde y es gratis.
      - **Las consignas de estación**, que se pagan con la tarjeta IC. En Tokio Estación o en
      Asakusa hay a cientos, pero las grandes se llenan pronto.
      - **Mandarlo al aeropuerto** por [takkyūbin](#takkyubin) el día anterior. Es la opción cómoda si
      sobra presupuesto.
  - block: Mediodía
    time: "10:00–15:00"
    title: Las últimas compras, y lo que falte
    body: >-
      Mañana sin plan y sin cruzar la ciudad: las compras grandes se hicieron el domingo, así que lo
      que falte se remata cerca del hotel. Aviso de aduana: la fruta fresca y las plantas no pasan, y
      algunos productos cárnicos tampoco.

      Y si sobra tiempo, algo tranquilo y **en el camino a Haneda**: un jardín pegado a Daimon, parada
      de la Toei Asakusa, que se recorre en media hora con la maleta al lado.
    ver:
      - nombre: Kyū Shiba Rikyū
        maps: Kyu Shiba Rikyu Garden Tokyo
        nota: Un jardín pequeño del siglo XVII junto a Daimon, en la línea del aeropuerto.
        lat: 35.6549216
        lon: 139.7586742
    comer:
      - comida: onigiri-konga-nihonbashi
        nota: "*Onigiri* grandes para el avión, en el Takashimaya de Nihonbashi, parada de la línea del aeropuerto. Hoy abre a las 11:00."
  - block: Tarde
    time: "15:00–18:00"
    title: Al aeropuerto
    body: >-
      El vuelo sale de **Haneda**, así que el traslado es corto: de treinta a cuarenta y cinco
      minutos desde el hotel, porque la Toei Asakusa sigue por la Keikyū hasta la terminal sin
      transbordo. No es la hora y media de Narita. Con salida a las
      21:00, dejar el centro entre las 17:00 y las 18:00 es cómodo; a las 18:30 ya es justo. Ver
      [los vuelos](#vuelos).
    ver:
      - nombre: Edo Kōji, Terminal 3
        maps: Edo Koji Haneda Airport Terminal 3
        nota: Una calle de Edo con puestos y farolillos en la cuarta planta, y la terraza de los aviones.
    window:
      label: Antes de pasar el control
      body: >-
        Dos trámites de última hora, y el primero **esta vez sí se puede hacer**: la fianza de la
        tarjeta IC física solo se devuelve en Haneda, y de Haneda salís — hay mostrador en la
        terminal. El segundo es el tax-free, que este año podría haber cambiado al reembolso en
        aeropuerto: si es así, las compras tienen que ir sin abrir y el mostrador está antes del
        control. Ver [dinero](#dinero).
  - block: Noche
    time: "21:00"
    title: Ocho husos al oeste
    dim: true
    body: >-
      Veintiún días, nueve camas, dos mares y una montaña que puede que se dejara ver. Volando al
      oeste el día se estira, pero no tanto como parece: se despega de Haneda a las nueve, se hace
      escala en Pekín de madrugada y **se aterriza en Madrid a las 07:20 del viernes 27**, con el
      desfase ahora en contra y una semana de sueño desordenado por delante. Ver
      [los vuelos](#vuelos).

      Y queda pendiente lo que no cupo — que en Japón es siempre casi todo. Por eso se vuelve.
alt:
  label: Si te desmarcas
  body: >-
    Que el vuelo salga de **Haneda** juega a favor dos veces: está dentro de la ciudad, así que el
    traslado son cuarenta minutos y no hora y media, y el aeropuerto tiene premio. En la Terminal 3
    hay una réplica de una calle de Edo en la cuarta planta, con puestos y farolillos, y una terraza
    al aire libre desde la que se ven despegar los aviones. Es la mejor espera de aeropuerto de Asia,
    así que **no vayáis justos: id sobrados y gastadlo allí**.

    Y es también el único sitio donde **se devuelve la fianza de la tarjeta IC**. El que salió por
    Narita hace trece días no pudo; vosotros sí.
