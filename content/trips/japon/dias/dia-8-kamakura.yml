blocks:
  - block: Mañana
    time: "08:00–11:00"
    title: Kita-Kamakura y los templos zen
    body: >-
      Se baja en la estación **anterior** a Kamakura, Kita-Kamakura, y se hace el pueblo andando hacia
      el sur. Nada más salir está Engaku-ji y, quince minutos más allá, Kenchō-ji. Ninguno de los dos
      es un monumento que se visita: son monasterios en activo, con monjes barriendo, y se recorren
      en silencio.
    window:
      label: Ventana óptima
      body: >-
        Al revés que en Tokio, aquí no hay que madrugar por la luz sino **por el orden**: bajando
        desde Kita-Kamakura el día va cuesta abajo, se termina en la costa con el atardecer y no hay
        que volver sobre los pasos. Al revés es el mismo recorrido y una paliza.
    ver:
      - ficha: kamakura-zen
        nota: Por qué Engaku-ji reza por los mongoles, y el ginkgo del asesino del Hachimangū.
      - nombre: Engaku-ji
        maps: Engakuji Temple Kamakura
        nota: A la salida misma de la estación. La campana de 1301 y el té del Butsunichi-an.
        lat: 35.3379364
        lon: 139.5478197
      - nombre: Kenchō-ji
        maps: Kenchoji Temple Kamakura
        nota: El monasterio zen más antiguo de Japón, de 1253, con los edificios en un solo eje.
        lat: 35.3324455
        lon: 139.5575336
    comer:
      - comida: hachi-no-ki
        nota: La cocina del monasterio, junto a la puerta de Kenchō-ji. Hay soba suelta a precio normal.
  - block: Mediodía
    time: "11:00–13:30"
    title: Hachimangū y la calle de las croquetas
    body: >-
      El camino desemboca en Tsurugaoka Hachimangū, el santuario del clan Minamoto y el centro
      político del Japón medieval. Bajando de vuelta, Komachi-dōri es la calle de comer de pie:
      croquetas, *senbei* a la brasa, helado de boniato morado. Es turística sin disimulo y está
      muy bien.
    ver:
      - nombre: Tsurugaoka Hachimangū
        maps: Tsurugaoka Hachimangu Kamakura
        nota: La avenida que se estrecha para parecer más larga, y la escalinata donde mataron al tercer *shōgun*.
        lat: 35.3251836
        lon: 139.5561787
      - reco: alba-palillos-grabados
        nota: Palillos con el nombre grabado al momento, en la calle comercial.
    comer:
      - comida: komachi-dori
        nota: De pie y subiendo. El *shirasu* de la bahía sobre arroz, que fuera de la costa no existe.
  - block: Tarde
    time: "13:30–16:00"
    title: El Gran Buda, y el templo con vistas
    body: >-
      Lo que todo el mundo viene a ver: el Daibutsu de Kōtoku-in, **once metros y medio** de bronce
      de 1252 sentados al aire libre desde que un tsunami se llevó su nave en 1498. A diez minutos,
      Hasedera, con su Kannon de once cabezas —la mayor talla de madera de Japón, nueve metros
      cubiertos de pan de oro— y una terraza con toda la bahía de Sagami enfrente. Según su leyenda,
      la imagen es una de dos gemelas talladas en el año 721: a esta la echaron al mar y apareció en
      esta playa quince años después.
    window:
      label: Ventana óptima
      body: >-
        Hasedera **al final y no antes**: su mirador sobre la bahía es el sitio donde conviene estar
        cuando el sol empieza a bajar, y en noviembre eso pasa pronto. Y un apunte de temporada: el
        [momiji](#momiji) de Kamakura, como el de Tokio, llega a finales de mes. En vuestras fechas los
        arces están virando, no ardiendo.
    ver:
      - ficha: daibutsu-kamakura
        nota: Hueco por dentro y con la cabeza grande a propósito. Se entra por unos pocos yenes.
      - nombre: Hasedera
        maps: Hasedera Temple Kamakura
        nota: El Kannon de nueve metros y la terraza sobre la bahía, para cuando baja el sol.
        lat: 35.3122687
        lon: 139.5333092
  - block: Atardecer
    time: "16:00–17:30"
    title: El tranvía a la costa
    body: >-
      Para cerrar, el **Enoden**: un tren de una sola vía y más de cien años que sale de Kamakura, se
      mete entre las casas —tanto que se ven los tendederos— y de pronto sale al mar. Tres paradas
      después, en Kamakura-kōkōmae, se baja, se mira el mar con Enoshima al fondo, y se vuelve a Tokio
      con la última luz.
    ver:
      - nombre: Kamakura-kōkōmae
        maps: Kamakurakokomae Station
        nota: El paso a nivel frente al Pacífico de los créditos de *Slam Dunk*.
        lat: 35.3067209
        lon: 139.5007098
      - reco: alba-enoshima
        nota: "Tres paradas más de Enoden, si sobra luz. Ojo: las cuevas de Iwaya cierran hacia las 16:00."
alt:
  label: Si te desmarcas
  body: >-
    Kamakura tiene más templos de los que caben en un día, y los mejores no son los famosos.

    - [**Hōkoku-ji**](https://www.google.com/maps/search/?api=1&query=Hokokuji%20Kamakura), el «templo
    de bambú»: **dos mil cañas** y una casa de té al fondo donde se toma matcha sentado, mirándolo.
    Quince minutos del centro, en la dirección en que no va nadie.
    - [**Sugimoto-dera**](https://www.google.com/maps/search/?api=1&query=Sugimotodera%20Kamakura), el
    templo **más antiguo de Kamakura** (año 734). Las escaleras de piedra cubiertas de musgo ya
    valen el desvío. Dentro, en una sala negra de hollín y forrada de pegatinas de peregrinos, hay
    **tres Kannon de más de mil años**.