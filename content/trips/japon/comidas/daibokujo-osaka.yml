body: >-
  Wagyu —y ternera de Kobe en los cursos altos— en sukiyaki y shabu-shabu **a discreción**, en una
  sala amplia a tres minutos de Namba. Es de las pocas direcciones de esta lista pensada para grupos:
  tiene sofás y mesas grandes, que en Osaka centro no abunda.


  Los precios que circulan son tres cursos, de 5.478 a 13.200 yenes según se suba de wagyu negro a
  Kobe con cangrejo. **Vienen del vídeo, no de la casa**: no los he encontrado publicados en ninguna
  fuente propia, así que valen como orden de magnitud y no como carta.


  Lo mismo con el horario de once a once que se anuncia: no está confirmado. Antes de contar con esta
  cena para el día 14 conviene una llamada o una reserva por internet.
