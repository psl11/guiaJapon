slug: dia-18-fuji
navLabel: "Día 18 · El Fuji"
trip: japon
order: 18
eyebrow: El plan · Día 18 · lun 23 nov · festivo
title: El Fuji, con *guía y furgoneta*
dek: >-
  El único día del viaje que va contratado de principio a fin: diez horas dando la vuelta a la
  montaña en vehículo privado y en español, con [Turismo Victoria](https://turismovictoria.com). Eso
  quita la parte incómoda —los tres transbordos y la decisión meteorológica de las seis de la
  mañana— y deja una sola obligación: **estar en Shin-Fuji a las 8:30**.
duerme:
  - apa-asakusa-kaminarimon
  - koko-ginza-1chome
traslados:
  - desde: "El hotel"
    hasta: "Shinagawa"
    medio: "Toei Asakusa, hacia Haneda o Misakiguchi"
    duracion: "12–25 min"
    hora: "salir 06:30"
  - desde: "Shinagawa"
