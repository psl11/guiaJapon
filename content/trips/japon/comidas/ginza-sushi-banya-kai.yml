body: >-
  Un *omakase* de veintidós pases en Ginza por 9.570 yenes. Puesto al lado del
  [Azabu Kuro-Shari](#azabu-kuroshari), que cobra 27.500 por veinte, se entiende por qué circula: es
  la misma idea —barra, sin carta, el chef manda— a un tercio de precio y en el barrio donde eso
  normalmente cuesta el triple.


  Está en la séptima planta de un edificio de Ginza 1-chōme y abre en dos turnos, de doce a dos y
  media y de cinco a diez y media. **El día 20 pasa por Ginza al mediodía**, así que cabe en el turno
  de comida sin tocar el plan, y también como cena del último día entero.


  Lo que no es: una barra de las de dos estrellas y lista de espera. Es una *sushi izakaya* —hay
  sashimi, platos calientes y bastante sake— que además hace *omakase*. Bien entendido, eso es
  justamente lo que la hace útil para cuatro personas.
