title: Lo que vale la pena traerse de Japón, y lo que no
area: Tokio · repartido por los días que ya tienes
note: "Zapatillas, un cuchillo, un Zelda viejo, un reloj vintage, la Ricoh del encargo · la consola no · y la cuenta de la aduana"
body: |-
  Lo que ya está en el plan, cada cosa en su día: [el Seiko de tu padre](#solo-3-ginza) el
  miércoles 4 en Ginza, [los dos Zelda](#solo-4-kawagoe) el jueves 5, [el matcha](#matcha) con el
  grupo el 12 y el 13, y [los vinilos](#vinilos) el miércoles por la noche. Lo que añadiría, por lo
  que ya te has traído otras veces:

  - **Onitsuka Tiger, la línea Nippon Made.** Es la que tiene gracia comprar aquí: los modelos de
    piel japonesa que terminan a mano, uno a uno, en Japón. Y el resto de la marca, a precio de
    aquí: el Mexico 66 normal se vende entre ¥14.300 y ¥16.500. En Ginza 7-chōme,
    junto a la tienda grande, hay desde 2023 un edificio solo para Nippon Made, a diez minutos de
    Seiko Dream Square: el miércoles 4, al salir del reloj. Y en Omotesandō está la tienda más grande
    de la marca, por la que el grupo pasa el viernes 13.
  - **Un cuchillo de cocina, en Kappabashi**, el sábado 7 con el grupo. En Kama-asa, desde 1908,
    graban el nombre en la hoja gratis al comprarlo. Abre de 10:00 a 17:30. Va en la maleta
    facturada: en cabina no pasa.
  - **Un Zelda de los de antes, en Super Potato.** Tres plantas de juegos y consolas retro en su
    caja japonesa en Akihabara (Sotokanda 1-11-2), y arriba una sala de recreativas viejas a ¥100 la
    partida. Abre todos los días de 11:00 a 20:00. Tiene gracia por lo mismo que el *Cowboy Bebop*:
    si aparece, el *Ocarina of Time* de Nintendo 64 en su caja japonesa, al lado del nuevo.
  - **Nintendo TOKYO**, la tienda de la propia Nintendo, en la sexta planta del Parco de Shibuya, de
    10:00 a 21:00, con productos que solo se venden en sus tiendas oficiales. Cae en la noche de los
    vinilos.

  **El reloj vintage: un 45KS o un 61GS.** Son las dos piezas que buscas, y las dos son de la época
  dorada de Seiko, cuando Grand Seiko y King Seiko competían entre sí con las mismas máquinas de
  alta frecuencia, 36.000 alternancias por hora. Las dos tienen caja de acero de 36–37 mm, tamaño de
  época, y aristas vivas si nadie las ha pulido de más.

  - **King Seiko 45KS** (1968–1971; referencias 4500-7000 sin fecha y 4502-7000 con fecha). Es de
    cuerda manual, fino y de vestir. Por dentro es el 45GS que te gustó, con otra firma en la esfera
    y por una fracción de su precio: el 45GS de acero ya pasa de ¥240.000.
  - **Grand Seiko 61GS** (desde 1968; 6145-8000 con fecha y 6146-8000 con día y fecha). Es el primer
    automático japonés de alta frecuencia, el que se lleva a diario. En subasta, uno revisado se
    vende por ¥108.000–200.000; en tienda, con revisión y garantía, cuenta con pagar más. Los V.F.A.
    (6185) son otra liga: uno se vendió por ¥1.824.000.

  Tu tope son unos ¥230.000, y caben los dos. El sitio es [Mizutani Camera](#pablo-mizutani-camera),
  el sábado 7 en Ameyoko, y su tarjeta tiene todo lo que hay que mirar y preguntar. Para comparar
  antes, Nakano Broadway, a cinco minutos de Shinjuku por la Chūō: Jackroad, que tiene taller,
  Carese, Belle Monde e Ippuukishi. Cuadra el jueves 5, antes del Pit Inn.

  **El encargo de la Ricoh GR IV**, normal o Monochrome, nueva o usada. Ricoh solo la vende a su
  precio por sorteo (¥190.620 la normal y ¥283.800 la Monochrome), con resultados después del
  viaje, así que lo realista es la tienda. Precios de octubre de 2026, a unos 175,5 ¥ por euro:

  - **GR IV:** nueva, ¥226.800–234.700 (≈ 1.290–1.340 €); usada, ¥220.000–235.000. En Europa,
    1.449,99 €: se ahorra poco.
  - **GR IV Monochrome:** nueva, desde unos ¥282.700 (≈ 1.610 €); usada, hacia ¥242.000 (≈ 1.380 €).
    En Europa, 1.899,99 €: aquí es donde compensa.

  El sitio es la misma tarde de Nakano: **Fujiya Camera**, al lado de Nakano Broadway, es donde se
  vio la Monochrome usada a ¥242.000. Si no hay, **Map Camera** en Shinjuku, camino del Pit Inn.
  Las usadas son piezas sueltas y vuelan: mira el stock en sus webs la víspera. Antes de pagar,
  dos cosas:

  - **El idioma del menú.** No se ha podido confirmar si la versión japonesa trae español;
    enciéndela en la tienda y míralo.
  - **La garantía.** La de Ricoh nueva puede valer solo en Japón; en una usada, la de la tienda.

  **La consola, no.** La Switch 2 que venden las tiendas japonesas es la versión «solo para Japón»:
  está solo en japonés y solo funciona con cuentas de Nintendo japonesas. Desde el 25 de mayo cuesta
  ¥59.980. La versión en varios idiomas (¥69.980) solo se vende en la tienda online de Nintendo. Los
  juegos sí valen, porque los cartuchos no tienen región.

  **Las cuentas**

  - **El *tax-free***, desde el 1 de noviembre, se paga entero en la tienda y el 10 % se devuelve al
    salir, cuando la aduana ve lo comprado. Hace falta gastar al menos ¥5.000 en la misma tienda y el
    mismo día, y llevar el pasaporte. Lo que quieras reembolsar va en el equipaje de mano el sábado
    14 en Narita: llega con tiempo, porque el mostrador cierra una hora antes del vuelo.
  - **La aduana de vuelta.** Volando, cada viajero puede traer sin pagar hasta 430 € en compras, y
    un objeto que pase de esa cifra no se puede partir: el Seiko paga entero el IVA del 21 % y su
    arancel. Del alcohol, un litro de licor fuerte; si cae un whisky japonés, que sea uno.
  - **El sitio en la maleta.** Las cajas de zapatillas, los discos y el cuchillo abultan. Lo que no
    quepa puede ir por [takkyūbin](#takkyubin) al hotel de Roppongi, como los vinilos.
