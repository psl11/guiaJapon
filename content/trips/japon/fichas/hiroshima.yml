title: Hiroshima, y la ruina que se decidió no arreglar
image:
  src: img/fichas/hiroshima.webp
  alt: "La Cúpula de la Bomba Atómica de Hiroshima, con la estructura metálica desnuda, bajo un cielo azul."
  credit: "Oilstreet · CC BY 2.5"
