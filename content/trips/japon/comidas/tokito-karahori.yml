body: >-
  Una barra diminuta en el barrio de Karahori, en un callejón residencial, llevada por dos personas
  que hablan poco inglés. Viene del mismo grupo que *myneighbor*, que es una casa con nombre en
  Osaka, y hace bocadillos: uno de wagyu y otro de tortilla, entre 1.700 y 3.500 yenes.


  El detalle que decide si se come o no: **del de wagyu hacen unas pocas unidades al día**, así que o
  se llega pronto o se queda uno con el de tortilla. **Solo aceptan efectivo.**


  Karahori queda entre el castillo y Namba, así que geográficamente cabe en el mediodía del día 14,
  pero compite con [Kuromon](#kuromon) y con las otras dos barras de la lista. Con un solo día en
  Osaka, esto es una elección, no un añadido.
