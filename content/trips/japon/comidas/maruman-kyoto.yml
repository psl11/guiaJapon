body: >-
  Una barra de sushi en Shijō con unas pocas mesas, llevada por un matrimonio: él en la tabla, ella
  en la sala. Abre de cinco de la tarde a la una de la madrugada todos los días, que es un horario
  largo y raro en Kioto, donde casi todo cierra pronto.


  Lo que lo puso en circulación es una anécdota: **el vídeo dice que allí no se puede grabar**. No he
  encontrado esa norma escrita en ninguna parte, así que no la doy por confirmada — pero si es
  cierta, la conclusión práctica es la misma que en cualquier barra pequeña de Japón: se entra, se
  come y se guarda el móvil.


  Teléfono 075-221-0927. Con cuatro personas en un local de este tamaño, avisar antes no es una
  formalidad.
