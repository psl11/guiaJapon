body: >-
  Ramen enteramente vegano en una ciudad donde el caldo por defecto es de cerdo o de pollo. El suyo va sobre **leche de soja y sésamo**, que da una textura densa parecida al *tonkotsu* sin nada de hueso — es el truco que usa media cocina vegana japonesa y aquí lo hacen bien.


  Es el complemento barato y sin ceremonia de las *shōjin* de esta lista: no todas las cenas de Kioto pueden ser un templo con reserva.
