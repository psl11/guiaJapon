body: >-
  Un mostrador en mitad de Sanmachi que sirve el buey de Hida como *nigiri*, apenas soasado y
  sobre una galleta de arroz (*senbei*) que hace de plato y se come con lo demás. Es la otra manera
  de probar la carne, cruda casi del todo, y por eso tiene sentido antes de las brochetas de la
  comida, que van a la brasa.


  Se pide en el mostrador y se come de pie en la calle. Las tandas más completas se acaban pronto.
  No aceptan tarjeta: llevad efectivo.
