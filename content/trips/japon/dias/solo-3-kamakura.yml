title: Kamakura *en miércoles*, y el bambú que no sale en el plan
dek: >-
  Los otros tres harán Kamakura el sábado 14, la mañana en que tú vuelas. Tú la haces hoy, entre
  semana y sin la marea de Tokio encima. El recorrido es el mismo, de norte a sur y cuesta abajo
  hasta el mar, y está contado parada a parada en el [día 9](#dia-9-kamakura). Aquí va lo que cambia
  por ir solo y en miércoles: sobra tiempo para un templo que el grupo no pisa.
