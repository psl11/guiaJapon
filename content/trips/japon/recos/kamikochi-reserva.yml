note: "LO PRIMERO · el hotel cierra el 14 de noviembre"
body: >-
  **Es la reserva más frágil de todo el viaje y la única sin plan B.** El valle es estacional: cierra
  el **15 de noviembre** y sus hoteles cierran antes —el **Shirakabaso, el día 14**, o sea al día
  siguiente de que os vayáis—. Además **las reservas de cada temporada abren a mediados de enero**,
  así que llevan meses abiertas.


  Son pocas camas, en la última semana buena del año, y si no hay sitio no existe alternativa dentro
  del valle: lo más cercano queda montaña abajo, en **Hirayu**, y eso rompería el amanecer en el
  estanque Taishō, que es la razón de subir. Escribid al **Shirakabaso** y al **Gosenjaku** en
  paralelo y quedaos con el que conteste. Confirmad además que **operan hasta esas fechas en 2026**.
