body: >-
  Lo que decide esta cama es la distancia a la terminal de autobuses, que se usa dos veces en menos
  de veinticuatro horas: se llega desde Hirayu por la mañana y **se sale hacia
  [Shirakawa-gō](#shirakawa-go) a las ocho y media del día siguiente**, después de los mercados. Con
  la estación y la terminal a cinco minutos, ninguna de las dos cosas obliga a madrugar de más ni a
  cargar con nada.


  Tiene baño público con sauna, abierto de seis a diez y de tres de la tarde a medianoche, que son
  las dos franjas que este día concreto pide: el pueblo se vacía a las cinco y no hay nada que hacer
  después de cenar. No es agua termal como la de anoche —eso se quedó en el valle—, pero después del
  Higashiyama entero cuenta igual.


  Es un hotel nuevo y con una manía simpática: **se llama Gift porque el nombre lo eligieron a
  votación** entre vecinos, huéspedes y plantilla, y montan actividades con gente del pueblo una vez
  al mes. Son ciento dos habitaciones, así que de casa de huéspedes no tiene nada; la gracia está en
  que aquí las maletas grandes llevan un día esperando y todo lo demás se resuelve andando.
