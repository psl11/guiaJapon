body: >-
  Un *yakatabune* —el barco de recreo tradicional de la bahía de Tokio— con una barra de sushi de
  ocho asientos y diez metros de ciprés macizo dentro. La carta la supervisa **Sushi Murayama, que
  tiene una estrella Michelin en Ginza**, así que el sello aquí sí está verificado.


  Se sale del embarcadero de Higashi-Shinagawa, a un minuto de Tennōzu Isle. Las salidas van por
  turnos: cena a las cinco y a las ocho y media de lunes, jueves, viernes y sábado, **y comida solo
  los domingos y festivos**, con encuentro a las once. Cierra martes y miércoles.


  De los días de Tokio que quedan, el domingo 22 —el día de comprar— es el único que cuadra con el
  turno de comida. Es caro: unos veintisiete mil quinientos yenes según el vídeo, cifra que la casa
  no publica abiertamente. Va aquí como capricho documentado, no como plan.
