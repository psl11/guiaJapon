slug: dia-3-yamanote
navLabel: "Día 3 · Meiji y Shibuya"
trip: japon
order: 3
eyebrow: El plan · Día 3 · dom 8 nov
title: Del bosque de *Meiji* al cruce de Shibuya
dek: >-
  El día del contraste que define Tokio: un bosque de cien mil árboles plantados a mano en el centro
  de la ciudad, y a quince minutos andando, el cruce peatonal más transitado del planeta. Y es
  domingo, que aquí no es un detalle del calendario sino parte del plan.
blocks:
  - block: Amanecer
    time: "06:30"
    title: Meiji Jingū al abrir
    body: >-
      El santuario [**abre al amanecer y cierra al atardecer**](#meiji-jingu), sin horario fijo: sigue al sol. Entrar
      con los primeros es cruzar el **torii de ciprés** de doce metros y recorrer un kilómetro de
      grava bajo un bosque de **cien mil árboles donados de todo el país** en los años veinte —un
      bosque enteramente plantado por el hombre que hoy parece primario— hasta un santuario donde a
      esa hora solo hay sacerdotes barriendo. Es el sitio más silencioso del centro de Tokio y solo lo
      es una hora al día.
    window:
      label: Ventana óptima
      body: >-
        Segundo y último madrugón fácil: el cuerpo todavía va desfasado, pero mañana ya no. Y hay un
        premio de domingo: es **el día de las bodas sintoístas**, así que a media mañana hay
        posibilidades reales de cruzarse con una **procesión nupcial** —novia de *shiromuku* blanco
        bajo un parasol rojo, sacerdotes delante— atravesando el patio.

        Y este domingo concreto trae una segunda carta. El **15 de noviembre** se celebra el
        ***shichi-go-san***, el rito en que los niños de **siete, cinco y tres años** van al santuario
        vestidos de gala tradicional — y Meiji Jingū es *el* sitio donde se hace en Tokio. Como el 15
        cae en domingo, **las familias reparten las visitas por los fines de semana de alrededor**, así
        que el día 8 hay bastantes números de encontrarse el patio lleno de críos de tres años con
        kimono y cara de circunstancias. Ninguna de las dos cosas se puede reservar: solo estar allí.
  - block: Mañana
    time: "10:00–13:00"
    title: Harajuku, Omotesandō y las dos aceras
    body: >-
      Se sale del bosque y a doscientos metros está [**Takeshita-dōri**](https://www.google.com/maps/search/?api=1&query=Takeshita%20Street%20Harajuku%20Tokyo), la calle de la moda
      adolescente: estrecha, gritona, saturada, con crepes y tiendas de disfraces. Un domingo está
      imposible, y verla así es justamente el punto. El antídoto está a la vuelta: [**Omotesandō**](https://www.google.com/maps/search/?api=1&query=Omotesando%20Tokyo), la
      avenida arbolada donde media docena de arquitectos con Pritzker se han construido una tienda
      —Itō, Sejima, Kuma, Herzog & de Meuron— y que se recorre mirando fachadas, no escaparates.
      Doscientos metros separan la cultura pop más ruidosa del país de su arquitectura más seria.

      Y entre el bosque y el gentío queda el **parque Yoyogi**, que fue la **villa olímpica de 1964**
      antes de ser parque. De aquellos Juegos sobrevive, en su borde, el **Gimnasio Nacional de
      Yoyogi** de **Kenzō Tange**: una cubierta de acero **suspendida como un puente colgante**, que en
      su día fue una proeza de ingeniería y que volvió a usarse en los Juegos de 2020. Es el edificio
      que mejor cuenta el Japón que se reinventó después de la guerra, y está de camino.
    window:
      label: Por qué en domingo, y dónde mirar
      body: >-
        Porque [Harajuku](#harajuku) en domingo **es otra cosa**: es el día en que la gente se viste para venir. Y
        el sitio exacto es el [**Jingū-bashi**](https://www.google.com/maps/search/?api=1&query=Jingubashi%20Harajuku%20Tokyo), el puentecito entre la estación de Harajuku y la
        entrada del santuario: ahí es donde se concentran. Los géneros tienen nombre propio y se
        distinguen a la vista — ***cosplay*** (personaje de anime o videojuego), ***Gothic Lolita***
        (gótico y muñeca a la vez), ***Visual Kei*** (maquillaje y pelo de banda de rock),
        ***Decora*** (color y cien accesorios encima). Se mira, y **se pide permiso antes de
        fotografiar**: van vestidos para que se les vea, no para que se les persiga.
  - block: Tarde
    time: "15:00–17:00"
    title: El cruce, y la ciudad desde arriba
    body: >-
      Se baja a Shibuya por **[Cat Street](#shibuya)**, un pasadizo peatonal y curvo que evita las
      avenidas: veinte minutos entre tiendas pequeñas, y sus curvas son las del **río Shibuya**, que
      corre entubado justo debajo. Al final, [**el cruce**](#shibuya) donde tres mil personas atraviesan a la vez sin rozarse, y la estatua de
      [**Hachikō**](https://www.google.com/maps/search/?api=1&query=Hachiko%20Statue%20Shibuya%20Tokyo), el perro que esperó a su dueño nueve años en esa puerta. Verlo desde la calle está
      bien; verlo desde arriba lo explica. Para eso, [**Shibuya Sky**](https://www.google.com/maps/search/?api=1&query=Shibuya%20Sky%20Tokyo), la azotea abierta de la torre
      Scramble Square, con la ciudad de 360 grados y —si el aire está limpio— el **Fuji** recortado al
      oeste.
    window:
      label: Ventana óptima
      body: >-
        Aquí hay que **reservar con antelación y elegir la franja del atardecer**, que en noviembre es
        temprana: el sol se pone hacia las **16:40**. La entrada ideal es sobre las 16:00, para coger
        la última luz sobre el Fuji, el crepúsculo y el encendido de la ciudad en una sola visita. Y
        noviembre juega a favor en algo concreto: **el aire de invierno es el más transparente del
        año** y el Fuji se ve muchísimos más días que en verano.
  - block: Noche
    time: "noche"
    title: Los callejones de Shinjuku
    body: >-
      Cena a diez minutos en tren, en casa: [**Omoide Yokochō**](https://www.google.com/maps/search/?api=1&query=Omoide%20Yokocho%20Shinjuku%20Tokyo), el «callejón de los recuerdos», dos
      pasillos de posguerra iluminados por cientos de ***akachōchin***, los faroles rojos de papel,
      con barras de seis taburetes donde se cena *[yakitori](#yakitori)* al humo. Su otro nombre, el que usa la
      gente, es **Shomben Yokochō** — «el callejón de las meadas», por lo que era antes de que
      hubiera baños. Y al lado,
      el laberinto de [**Golden Gai**](https://www.google.com/maps/search/?api=1&query=Golden%20Gai%20Shinjuku%20Tokyo), doscientos bares diminutos de dos plantas, cada uno con su tema
      y muchos con asiento para seis. Aviso para un grupo de cuatro: **no cabéis en casi ningún sitio
      a la vez**, y algunos bares cobran cubierto. Es parte del trato.
alt:
  label: Si te desmarcas
  body: >-
    Meiji y Shibuya te los sabes. Tres desvíos que se hacen desde aquí mismo: el [**Museo Nezu**](https://www.google.com/maps/search/?api=1&query=Nezu%20Museum%20Tokyo) —un
    edificio de Kengo Kuma con un jardín que no parece Tokio— está a diez minutos de [Omotesandō](https://www.google.com/maps/search/?api=1&query=Omotesando%20Tokyo) y
    abre los domingos; [**Shimokitazawa**](https://www.google.com/maps/search/?api=1&query=Shimokitazawa%20Tokyo), dos paradas al oeste, es el barrio de segunda mano, discos y
    teatro pequeño donde va la gente de esta ciudad cuando no quiere turistas; y [**Daikanyama**](https://www.google.com/maps/search/?api=1&query=Daikanyama%20Tokyo) con la
    [librería **Tsutaya**](#daikanyama-tsutaya), que es probablemente el mejor sitio del mundo para
    pasar dos horas sin hacer nada. Y si prefieres algo pequeño y muy tuyo: el [**Museo Ōta**](https://www.google.com/maps/search/?api=1&query=Ota%20Memorial%20Museum%20of%20Art%20Tokyo), entre
    [Takeshita-dōri](https://www.google.com/maps/search/?api=1&query=Takeshita%20Street%20Harajuku%20Tokyo) y [Omotesandō](https://www.google.com/maps/search/?api=1&query=Omotesando%20Tokyo), dedicado **solo a grabados *ukiyo-e***, con exposición rotatoria y
    apenas dos salas — se ve en cuarenta minutos y es donde se entiende de dónde salió la mitad de la
    pintura europea del XIX. Si el grupo va a [Shibuya Sky](https://www.google.com/maps/search/?api=1&query=Shibuya%20Sky%20Tokyo), cualquiera de los tres cabe justo antes.
