slug: dia-17-compras
navLabel: "Día 17 · Compras"
trip: japon
order: 17
eyebrow: El plan · Día 17 · dom 22 nov
title: El día de comprar, que en Tokio *es una disciplina*
dek: >-
  Un domingo entero sin agenda, con las maletas grandes de vuelta y quince días de lista mental
  acumulada. En esta ciudad comprar no es un trámite: hay barrios enteros dedicados a una sola cosa.
blocks:
  - block: Mañana
    time: "10:00–13:00"
    title: Cada cosa tiene su barrio
    body: >-
      La regla de Tokio es que **lo específico se compra en el sitio específico**, no en un centro
      comercial. Según lo que se busque:

      - **Cuchillos y cocina** → **Kappabashi**, la calle donde se abastecen los restaurantes de la
        ciudad. Acero forjado, moldes, vajilla y los escaparates de comida de plástico. Es la mejor
        compra posible del viaje si alguien cocina.
      - **Papelería y escritura** → **Ginza**: el **Itōya**, doce plantas dedicadas solo a papel,
        plumas y cuadernos.
      - **Electrónica, manga y figuras** → [Akihabara](#akihabara).
      - **Segunda mano de marca** → [**Shimokitazawa**](https://www.google.com/maps/search/?api=1&query=Shimokitazawa%20Tokyo) y [**Nakameguro**](https://www.google.com/maps/search/?api=1&query=Nakameguro%20Tokyo).
      - **Té, dulces y comida buena** → el ***depachika*** de cualquier gran almacén, en [Ginza](#ginza).
    window:
      label: El tax-free, que este año cambia
      body: >-
        Recordad el pasaporte: hay exención de IVA en compras de **más de ¥5.000 en un mismo día y
        una misma tienda**. Y ojo, que Japón tiene aprobado cambiar el sistema en noviembre de
        2026, pasando del descuento en tienda al reembolso en el aeropuerto. Comprobadlo al llegar
        — está en [la ficha de dinero](#dinero).
  - block: Mediodía
    time: "13:00–15:00"
    title: Que sea domingo juega a favor
    body: >-
      Dos cosas pasan solo hoy. **Harajuku en domingo es el fenómeno**, no una calle comercial: en el
      [**Jingū-bashi**](https://www.google.com/maps/search/?api=1&query=Jingubashi%20Harajuku%20Tokyo) se concentran los disfraces, y junto a la entrada de Yoyogi-kōen bailan las
      bandas de rockabilly con tupé que llevan cuarenta años en el mismo sitio. Ver
      [Harajuku](#harajuku).

      Y **el lago del parque de Ueno y las calles de Ginza se peatonalizan** los domingos por la
      tarde: la avenida principal, sin coches, con sillas en mitad de la calzada.
  - block: Tarde
    time: "15:00–18:00"
    title: El momiji, que ahora sí
    body: >-
      Y aquí está el regalo de haber vuelto. **El pico de la hoja roja en Tokio va del 20 de noviembre
      al 5 de diciembre**, así que estos días caen justo dentro. Los dos jardines de la lista nacional
      están a media hora: el [**Rikugi-en**](https://www.google.com/maps/search/?api=1&query=Rikugien%20Garden%20Tokyo), diseñado en 1702 para reproducir ochenta y ocho escenas
      de poemas clásicos, y el [**Koishikawa Kōrakuen**](https://www.google.com/maps/search/?api=1&query=Koishikawa%20Korakuen%20Garden%20Tokyo). Los dos hacen iluminación nocturna en
      temporada. Ver [el momiji](#momiji).
  - block: Noche
    time: "noche"
    title: La cena que no se improvisa
    body: >-
      Quedan cuatro noches y es buen momento para gastar una en algo reservado. El **Tōfuya Ukai**, al
      pie de la Torre de Tokio, sirve *kaiseki* de tofu en una antigua fábrica de sake trasladada
      desde el norte, con jardín; hay que reservar con antelación. O el New York Bar del Park
      Hyatt, que es el de *Lost in Translation*, con jazz en directo — ver
      [la sección de salir](#new-york-bar).
alt:
  label: Si te desmarcas
  body: >-
    Un domingo es el mejor día para **[Jinbōchō](#jimbocho)**… salvo que muchas de sus ciento treinta
    librerías de viejo cierran precisamente en domingo. Comprobadlo. La alternativa segura es
    Nakano Broadway, cuatro plantas de manga, figuras y relojes de segunda mano al oeste de
    [Shinjuku](#shinjuku), que es lo que era Akihabara antes de volverse turístico.
