title: El Japón que ya habéis visto sin saberlo
epithet: >-
  Casi todo lo que este viaje pisa ha sido antes una novela o un plano. Esto es lo que conviene leer
  y ver **antes** —no para tachar referencias, sino para llegar sabiendo mirar—, y el sitio exacto
  del itinerario donde cada relato sigue en pie.
sections:
  - heading: Las cuatro que caen encima del itinerario
    body: |
      No son las mejores películas japonesas de la historia: son las que **ocurren donde vais a estar**.

      - [***El pabellón de oro***](https://www.goodreads.com/book/show/62798.The_Temple_of_the_Golden_Pavilion) (Mishima, 1956) — la
        novela que hay que leer **antes del día 13**. Parte de un hecho real: en 1950 un novicio
        quemó el [Kinkaku-ji](#kinkakuji) hasta los cimientos. Mishima le construye una mente y la
        pregunta que sale es incómoda: si algo es insoportablemente bello, ¿qué se hace con ello? El
        pabellón que veréis es una **reconstrucción de 1955** — estaréis mirando la respuesta.
      - [***Drive My Car***](https://www.filmaffinity.com/es/film281888.html) (Hamaguchi, 2021) — tres horas sobre un actor viudo que
        ensaya a Chéjov en **Hiroshima**, con un Saab rojo cruzando la ciudad. Sale de un cuento de
        Murakami y ganó el Óscar. Lo importante para vosotros: **enseña la Hiroshima cotidiana**, la
        que existe fuera del Parque de la Paz, que es exactamente lo que el [día 15](#hiroshima)
        cuesta ver.
      - [***Perfect Days***](https://www.filmaffinity.com/es/film683705.html) (Wenders, 2023) — un hombre limpia baños públicos en
        Tokio, escucha casetes y fotografía árboles. Transcurre en **Asakusa y a la orilla del
        Sumida**, o sea a diez minutos del hotel de la primera semana, y es la mejor película que
        existe sobre **la parte de Japón que este viaje va a rozar sin querer**: la rutina.
      - [***Lost in Translation***](https://www.filmaffinity.com/es/film587836.html) (Coppola, 2003) — el [New York
        Bar](#new-york-bar) del Park Hyatt, el karaoke, el insomnio del jet lag. Es un tópico
        merecido: **ningún otro plano ha explicado mejor la primera semana en Tokio**, que es
        literalmente lo que os va a pasar el día 2 a las cinco de la mañana.
  - heading: El canon, y por qué importa el orden
    body: |
      Si solo entran tres películas japonesas en el avión, que sean estas y en este orden:

      1. [***Cuentos de Tokio***](https://www.filmaffinity.com/es/film911508.html) (Ozu, 1953) — unos padres mayores visitan a sus
         hijos en Tokio y estorban. No pasa nada más. Está sistemáticamente en las listas de las
         mejores películas jamás hechas, y su método —la **cámara a la altura de alguien sentado en
         el tatami**, sin moverse nunca— es la lección práctica de este viaje: en Japón se mira desde
         abajo y desde quieto.
      2. [***Rashomon***](https://www.filmaffinity.com/es/film164638.html) (Kurosawa, 1950) — cuatro versiones del mismo crimen, todas
         creíbles, ninguna comprobable. Ganó el León de Oro en Venecia y con él **Occidente
         descubrió que existía el cine japonés**. Dio nombre a un concepto que hoy se usa en
         psicología y en derecho.
      3. [***Los siete samuráis***](https://www.filmaffinity.com/es/film168398.html) (Kurosawa, 1954) — tres horas y media que
         inventaron la estructura de «reclutar al equipo» que después copiaron *Los siete
         magníficos*, *Ocean's Eleven* y media taquilla del mundo. Va, además, del final real del
         mundo que cuenta [el acto tercero](#acto-3-sengoku).
  - heading: Ghibli, que es más que dibujos
    body: |
      - [***El viaje de Chihiro***](https://www.filmaffinity.com/es/film759533.html) (Miyazaki, 2001) — la mejor introducción posible
        al [sintoísmo](#santuario-o-templo) que existe: los *kami* de cada cosa, la impureza que se
        lava, el nombre que da poder. **La casa de baños del filme viene de los onsen reales** — y
        vais a dormir en uno. Verla antes convierte el [baño](#onsen) en otra experiencia.
      - [***La tumba de las luciérnagas***](https://www.filmaffinity.com/es/film582716.html) (Takahata, 1988) — dos hermanos
        sobreviviendo al bombardeo incendiario de Kobe. Es una de las películas más duras jamás
        hechas y **la única forma honesta de llegar a [Hiroshima](#hiroshima)** sin que el día 15 os
        pille de sorpresa. Aviso: no es para verla la noche antes de nada.
  - heading: Los libros, por lo que enseñan a mirar
    body: |
      - [***El elogio de la sombra***](https://www.goodreads.com/book/show/34473.In_Praise_of_Shadows) (Tanizaki, 1933) —
        **sesenta páginas y el libro más útil de esta lista.** Un ensayo sobre por qué la belleza
        japonesa vive en la penumbra: el oro de un biombo pensado para brillar con una vela, la laca
        que solo funciona en sombra, el retrete de madera. Después de leerlo, los interiores de
        [Kioto](#kioto) dejan de parecer oscuros y pasan a estar bien iluminados.
      - [***País de nieve***](https://www.goodreads.com/book/show/216983403-snow-country-by-kawabata-yasunari-author-paperback) (Kawabata, 1948) — un hombre de Tokio
        viaja en tren a un balneario de montaña a ver a una geisha rural. Kawabata fue el **primer
        Nobel japonés** y esta es su obra maestra. El tren que cruza el túnel hacia la nieve es
        exactamente el trayecto emocional de vuestros [días 6 y 7](#kamikochi).
      - [***Tokio blues***](https://www.goodreads.com/book/show/11297.Norwegian_Wood) (Murakami, 1987) — el que lo hizo famoso y
        el más convencional que escribió: un campus, dos mujeres, el Tokio de 1969. Vale como
        callejero sentimental de [Shinjuku](#shinjuku) y del oeste de la ciudad.
      - [***Kokoro***](https://www.goodreads.com/book/show/762476.Kokoro) (Sōseki, 1914) — el libro sobre **el precio
        de la era Meiji**: un joven, un viejo maestro y un secreto, en el momento exacto en que
        Japón dejó de ser una cosa y pasó a ser otra. Es el acompañamiento del [acto quinto](#acto-5-meiji).
      - [***Sendas de Oku***](https://www.goodreads.com/book/show/175626.The_Narrow_Road_to_the_Deep_North_and_Other_Travel_Sketches) (Bashō, 1702) — el
        cuaderno del poeta que se fue andando al norte en 1689. **Es el libro de viajes fundacional
        de Japón** y sigue funcionando: mezcla caminata, haiku y desengaño en dosis pequeñas. Ideal
        para leer a trozos en los trenes.
      - [***Hiroshima***](https://www.goodreads.com/book/show/27323.Hiroshima) (John Hersey, 1946) — el reportaje que
        ocupó un número entero de *The New Yorker* y contó la bomba a través de **seis
        supervivientes con nombre y apellidos**. Cambió el periodismo. Leedlo antes del día 15, no
        después.
curiosidades:
  - >-
    ***Rashomon*** estuvo a punto de no llegar a Venecia: el estudio la consideraba un fracaso
    incomprensible y fue **una italiana afincada en Japón, Giuliana Stramigioli**, quien insistió en
    mandarla al festival. Ganó, y el cine japonés existió para el mundo.
  - >-
    Ozu está enterrado en Kita-Kamakura con **una sola palabra en la lápida: 無**, *mu*, «nada» o
    «vacío». Está en el Engaku-ji, o sea **en la parada del [día 5](#kamakura-zen)**.
  - >-
    Mishima terminó *El pabellón de oro* investigando el caso de verdad: **entrevistó al monje
    incendiario en el psiquiátrico**. Catorce años después se suicidó por *seppuku* tras un intento
    de golpe de Estado, que es la otra mitad de por qué su nombre incomoda en Japón.
  - >-
    La casa de baños de *El viaje de Chihiro* se atribuye popularmente al **Dōgo Onsen de Matsuyama**
    y al pueblo taiwanés de Jiufen; Ghibli **nunca lo ha confirmado** y Miyazaki ha dicho que es una
    mezcla. Los dos sitios cobran entrada gracias a ello.
