kicker: Tokio · para el que ya se lo sabe
title: Cuarenta cosas de Tokio que no salen en la lista de nadie
epithet: >-
  Esta ficha no es para el grupo: es para el que va por quinta vez y ya ha hecho Sensō-ji, Shibuya y
  Meiji Jingū cuatro veces. Está sacada de los «author picks» de la Rough Guide y del rastreo de su
  texto entero, y sirve para una cosa: **tener de dónde elegir cuando los otros tres estén haciendo
  el clásico que a ti ya no te dice nada**.
sections:
  - heading: Miradores gratis, que son cuatro
    body: |
      - **Gobierno Metropolitano de Shinjuku** — 202 m, dos torres, abierto hasta tarde, **gratis**.
        Ver [Shinjuku](#shinjuku).
      - **Centro Turístico de Asakusa** (Kengo Kuma) — octava planta, ascensor libre, con la Nakamise
        en línea recta bajo los pies. Ver [Sensō-ji](#sensoji).
      - **Torre Yebisu** — planta 39, en Ebisu, dentro del complejo comercial. Ver
        [Ebisu](#ebisu-meguro).
      - **Bunkyō Civic Center** — planta 25, junto a Kōrakuen, con la mejor vista despejada del
        **Fuji al atardecer** de todo Tokio. Es un edificio administrativo y no lo pisa ningún
        turista.
  - heading: Museos que casi nadie hace
    body: |
      - **Intermediatheque**, en Marunouchi, encima de la estación de Tokio: la colección científica
        de la Universidad de Tokio —esqueletos, minerales, instrumentos, aves disecadas— montada por
        un diseñador con criterio de galería, en vitrinas de madera antiguas. **Gratis.** Es de lo
        mejor de la ciudad y está a dos minutos del Shinkansen.
      - **Tokyo Photographic Art Museum**, Ebisu: el museo público de fotografía más importante del
        país, tres exposiciones a la vez.
      - **Museo Asakura de Escultura**, Yanaka: la casa-estudio-jardín de un escultor, intacta.
      - **Museo Ōta**, Harajuku: solo grabados *ukiyo-e*, rotando. Cuarenta minutos.
      - **Museo Yamatane**, Ebisu: *nihonga*, la pintura japonesa moderna que no se ve fuera.
      - **Museo del Sumo**, Ryōgoku: pequeño y **gratuito**.
      - **Suginami Animation Museum**, al oeste: la historia del anime, **gratis**, con cabinas para
        montar tu propia animación.
      - **Museo Ghibli**, Mitaka: entrada **por sorteo y con meses de antelación**, y no se puede
        comprar en la puerta. Si os apetece, hay que moverlo antes de salir de casa.
  - heading: Edificios que valen el viaje solos
    body: |
      - **Catedral de Santa María**, Bunkyō: **Kenzō Tange**, 1964, forrada de acero inoxidable, con
        planta de cruz y un interior de hormigón desnudo que sube en cuatro paredes curvas hasta una
        cruz de luz. Es hermana del gimnasio de Yoyogi y del parque de Hiroshima, del mismo año — y
        casi nadie la conoce.
      - **Jiyū Gakuen Myōnichikan**, Ikebukuro: una escuela de **Frank Lloyd Wright** (1921), de las
        pocas obras suyas que quedan en Japón. Se visita, y sirven té en el salón.
      - **Old Imperial Bar**, en el Hotel Imperial: lo único que sobrevive del **hotel que Wright
        construyó en Tokio** y que aguantó el terremoto de 1923 el día siguiente de inaugurarse. Se
        conservan el ladrillo y la piedra tallada. Pedid el cóctel «Mount Fuji», que lleva ahí desde
        1924.
      - **Nikolai-dō**, Ochanomizu: catedral ortodoxa rusa de 1891.
      - **Tokyo International Forum**, Yūrakuchō: un casco de barco de cristal y acero puesto del
        revés, de Rafael Viñoly. Se entra gratis y se sube por las pasarelas.
  - heading: Rarezas que solo existen aquí
    body: |
      - **El tranvía Toden Arakawa**, que los locales llaman ***chin-chin densha*** por su campanilla:
        **la última línea de tranvía de Tokio**, un vagón que cruza los barrios del norte por detrás
        de las casas, entre tendederos y rosaledas. Una hora de punta a punta por poco más de dos
        euros. Es la mejor manera que existe de ver Tokio siendo Tokio.
      - **Komparu-yu**, en pleno **Ginza**: una casa de baños de barrio de 1863, con azulejos y mural,
        metida entre las boutiques de lujo. Cuesta lo que cuesta un café.
      - **Super Potato**, Akihabara: recreativos de los ochenta que siguen tragando monedas.
      - **Fukagawa Fudō-dō**, Kiyosumi: ceremonias con **tambores y fuego** varias veces al día, con
        el sacerdote lanzando llamas mientras retumban los taiko. Gratis, y sobrecogedor.
      - **Hōzōmon de noche**: el recinto de Sensō-ji no cierra, y a las once de la noche está
        iluminado y absolutamente vacío.
      - **Kagurazaka**, entre Iidabashi y Shinjuku: callejones empedrados en cuesta, herencia
        francesa —hay liceo francés y panaderías— y **todavía quedan geishas en activo**.
  - heading: Jardines, por si el momiji flojea
    body: |
      Los cinco que la Rough Guide da por buenos: **Hama Rikyū** (antiguo cazadero de patos del
      shōgun, con una casa de té sobre un estanque de agua salada que sube y baja con la marea, y a la
      que se llega **en ferry desde Asakusa**), **Higashi Gyoen** (el jardín este del Palacio, gratis),
      **el jardín interior de Meiji Jingū**, el **National Park for Nature Study** (bosque sin
      domesticar, con cupo de visitantes) y **Shinjuku Gyoen**.

      Y para el color de noviembre, los del norte: **Rikugi-en** —diseñado para reproducir
      **ochenta y ocho escenas de poemas clásicos**, con iluminación nocturna en temporada—,
      **Kyū Furukawa** (jardín japonés y rosaleda occidental de la misma casa) y
      **Koishikawa Kōrakuen**.
  - heading: Comer y beber donde come el que vive aquí
    body: |
      - **Sasa-no-yuki**, Ueno: **solo tofu**, desde el periodo Edo, en una docena de formas.
      - **Yoshiba**, Ryōgoku: chanko-nabe **dentro de un antiguo dōjō de sumo**, con el ring en medio
        del comedor.
      - **Hachimaki**, Kanda: de los mejores ***tendon*** de Tokio.
      - **T's Tantan**, dentro de la estación de Tokio: ramen **cien por cien vegano** y muy bueno,
        en el sitio con menos alma imaginable.
      - **Sometarō**, Asakusa: *okonomiyaki* en una casa de madera donde te lo haces tú, sentado en
        el suelo.
      - **Buri**, Ebisu: *cup sake* casi congelado, treinta variedades, de pie.
      - **Iroha**, Meguro: sushi bueno y barato de verdad, sin cola de turistas.
      - **Meguro Cinema**: cine de reestrenos y sesiones dobles, con programación de culto.
      - **Karaoke-kan de Shibuya**: es **el karaoke de *Lost in Translation***, y las salas que salen
        en la película están señalizadas.
curiosidades:
  - >-
    El **Old Imperial Bar** conserva los muros del hotel que **Frank Lloyd Wright** levantó en Tokio
    y que **aguantó en pie el gran terremoto de 1923 al día siguiente de inaugurarse**. El cóctel
    «Mount Fuji» lleva en su carta desde 1924.
  - >-
    Tokio conserva **una sola línea de tranvía**, el Toden Arakawa. Los vecinos lo llaman
    *chin-chin densha*, «el tren tilín-tilín», por la campanilla — y cruza por detrás de las casas
    del norte de la ciudad durante una hora entera.
  - >-
    El **Rikugi-en** se diseñó para reproducir **ochenta y ocho escenas de poemas clásicos
    japoneses**. Hay que saberlo para entender por qué cada recodo del camino está donde está.
