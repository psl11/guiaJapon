title: Dos horas y cuarto, y *la otra capital*
dek: >-
  El día bisagra del viaje. Se sale de Tokio por el viejo Tōkaidō y se llega a la ciudad que fue
  capital durante mil años, justo cuando empieza su mejor quincena. Y la tarde baja al sur, por
  una sola línea de tren: el puente de los arces del Tōfuku-ji y los torii de Fushimi Inari,
  subidos con luz y bajados de noche.
