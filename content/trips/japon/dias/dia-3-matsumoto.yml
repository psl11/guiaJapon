blocks:
  - block: Mañana
    time: "09:00–12:00"
    title: El Azusa sube al interior
    body: >-
      Desde [Shinjuku](#shinjuku), dos horas y media largas en el **Azusa**, subiendo por la cuenca
      de Kōfu y el lago Suwa entre montañas que se van poniendo serias. El tren lleva el nombre del
      río que veréis mañana en [Kamikōchi](#kamikochi): sube a buscar su nacimiento. Es el primer
      tren de verdad del viaje y conviene hacerlo bien: las maletas detrás de la última fila del coche y, como mucho, un
      tentempié, que la comida es soba al llegar.
    window:
      label: La cuenta del JR Pass, aquí
      body: >-
        Este billete cuesta **¥6.730** con asiento reservado. Sumado a Kamakura y a los traslados del
        aeropuerto, vuestro gasto total en JR ronda los ¥21.000 — frente a los ¥50.000 que
        cuesta el JR Pass de 7 días, que además solo cubre siete de los veintiún días. No compréis el pase:
        billetes sueltos, y el metro de Tokio no es JR de todas formas.
    ver:
      - nombre: "Lago Suwa"
        maps: "Lake Suwa Nagano"
        nota: "Por la ventanilla izquierda: el lago que se suele dar como modelo del de Itomori, en *Your Name*."
        lat: 36.0492617
        lon: 138.0853146
  - block: Mediodía
    time: "11:40–15:00"
    title: Soba, y Matsumoto-jō, uno de los doce que quedan
    body: >-
      Primero el ryokan, doce minutos andando desde la estación: la habitación no está hasta la tarde,
      pero las maletas se quedan en recepción. Y a dos pasos, en Nakamachi, la comida es *[**soba**](#soba)*, en
      la casa que se vea con la masa a la vista; Nomugi y Kobayashi quedan abajo como referencia.


      Al castillo se va andando, en un cuarto de hora. Primero por fuera, desde el foso, donde se refleja entero
      con los Alpes detrás; luego por dentro, en calcetines, por escaleras de madera casi verticales
      y con las troneras para arcabuces a la altura de la cara.
    window:
      label: Por qué importa que sea original
      body: >-
        Porque se nota, y porque explica el resto del viaje. Una reconstrucción de hormigón tiene
        ascensor y vitrinas; esta tiene **escalones de sesenta centímetros y techos bajos** que
        obligan a subir agachado, y se entiende de golpe que un castillo japonés no era un palacio
        sino una máquina de guerra en madera. Se aprende con las rodillas.
    ver:
      - ficha: matsumoto-jo
        nota: Por qué solo quedan doce torres originales, y la terraza para ver la luna que se le añadió en paz.
    comer:
      - comida: soba-matsumoto
        elegido: true
        nota: La que se vea al pasar por Nakamachi, mejor si muele a la vista. Sin reserva.
      - comida: nomugi-matsumoto
        nota: Doce asientos y cola el domingo; cierra cuando se acaba la masa.
      - comida: kobayashi-soba-matsumoto
        nota: El plan B, de corrido hasta las ocho y solo en efectivo.
  - block: Tarde
    time: "15:00–17:00"
    title: Nakamachi, Nawate y las ranas
    body: >-
      Bajando del castillo, dos calles enfrentadas a la orilla del río Metoba: primero Nawate-dōri,
      el pasaje de las ranas, que termina en la puerta del santuario Yohashira, y al otro lado del
      puente Nakamachi, la de los almacenes, que es también la calle del ryokan.


      Y al final, a cinco o diez minutos hacia el este, el **Museo de Arte de Matsumoto**, porque esta
      es la ciudad natal de Yayoi Kusama: nació aquí en 1929. En la puerta están sus flores gigantes
      de colores, el *Gen no Hana*, y dentro hasta la máquina expendedora va forrada de lunares. Por
      fuera se ve gratis y en un momento. La colección de Kusama de dentro deja entrar hasta las 16:30.
    ver:
      - nombre: Nawate-dōri
        maps: Nawate Street Matsumoto
        nota: "Pasaje junto al río tomado por ranas: el barrio las adoptó como emblema cuando limpió el agua."
        lat: 36.2346128
        lon: 137.9719918
      - nombre: Nakamachi
        maps: Nakamachi Street Matsumoto
        nota: Almacenes ***kura*** de muro blanco y rombos negros, antiguos depósitos de sake hoy talleres y cafés.
      - nombre: Santuario Yohashira
        maps: Yohashira Shrine Matsumoto
        nota: "De 1879, con cuatro dioses a la vez: el de los deseos, al final de Nawate. Gratis y abierto siempre."
        lat: 36.235062
        lon: 137.97084
      - nombre: Museo de Arte de Matsumoto
        maps: "Matsumoto City Museum of Art"
        nota: "Las flores gigantes de Kusama en la puerta. De 9:00 a 17:00, última entrada a las 16:30; cierra los lunes."
  - block: Noche
    time: "noche"
    title: Caballo y sake de montaña
    body: >-
      La especialidad local es difícil de vender y conviene decirla sin rodeos: el ***basashi***,
      sashimi de carne de caballo. La cena es en **Shinmiyoshi**, reservada a las 19:30, a cinco
      minutos de la estación y a diez andando del ryokan. Nadie está obligado: hay cazuela y parrilla.
      Y para acompañar, sake de la prefectura, que es de los mejores del país por el agua de deshielo.


      De camino a la cena, el encargo de Pablo Sánchez: el *Diccionario de combinaciones de colores*
      de Sanzo Wada (配色事典, de Seigensha; ISBN 978-4-86152-247-5, ¥1.650), un libro de bolsillo.
      Está en **Maruzen**, la librería más grande del centro, a tres minutos de la estación y a otros
      tantos de Shinmiyoshi. Abre hasta las 20:00, así que basta con salir del ryokan hacia las siete.
      Si no lo tienen, el plan B es Mirai-ya, en el Aeon Mall, a quince o veinte minutos al este de la
      estación y abierto hasta las 21:00: cabe entre Nakamachi y la cena, antes de que oscurezca.
    window:
      label: Antes de dormir
      body: >-
        Mañana se sube a Kamikōchi, donde no hay coches ni ascensores y el equipaje es un estorbo,
        y se duerme en Hirayu Onsen sin volver a pasar por aquí. Así que **las maletas grandes salen
        hoy de Matsumoto** por [takkyūbin](#takkyubin) directas al Hotel Forza de
        [Kanazawa](#kanazawa), que las guarda hasta el miércoles 11. Son dos noches con mochila, Hirayu
        y Takayama, a cambio de un solo envío; de Kanazawa a Tokio ya viajan con vosotros en el tren.


        El ryokan tiene dos habitaciones: preguntad al llegar si lo gestionan ellos. Si no, lo
        admite cualquier *konbini* con el cartel de Yamato —7-Eleven y FamilyMart—, y en Nakamachi
        hay varios a cinco minutos. Esta tarde, no mañana a las seis.
    ver:
      - nombre: Maruzen Matsumoto
        maps: "丸善 松本店"
        nota: "Fukashi 1-3-11, plantas B1 a 2F. De 10:00 a 20:00; 0263-31-8171. Llamad al llegar para que os lo guarden."
      - nombre: "Mirai-ya, en el Aeon Mall"
        maps: "未来屋書店 松本店 イオンモール松本"
        nota: "El plan B: planta 1 del edificio Sora Niwa. Hasta las 21:00; 070-1598-6576."
    comer:
      - comida: shinmiyoshi-matsumoto
        elegido: true
        nota: "**Reservada** a las 19:30 para cuatro. Pedid el *basashi* variado."
alt:
  label: Si te desmarcas
  body: >-
    Si la puerta del museo os sabe a poco, dentro está **la mayor colección permanente de Kusama
    fuera de Tokio**, de sus primeros cuadros a las series más recientes, y pide una hora entera:
    se puede cambiar por Nakamachi. Cierra los lunes, no hoy. La otra opción va en dirección
    contraria: [**Asama Onsen**](https://www.google.com/maps/search/?api=1&query=Asama%20Onsen%20Matsumoto), en las afueras, es un balneario de mil trescientos años con baños
    públicos donde no hay un solo extranjero — y llegar a Kamikōchi mañana con las piernas ya
    descansadas no es mala idea.


    Y la excursión que propone Japonismo: la **granja de wasabi de Daiō**, en Azumino, a media hora
    en tren por la línea Ōito hasta Hotaka y otra media andando desde la estación. Son campos de
    wasabi cultivado en agua corriente bajo toldos negros, y al lado siguen los tres molinos de agua
    que Kurosawa levantó en 1990 para el último episodio de *Sueños*. Abre todos los días; en
    noviembre, hasta las 16:30 o las 17:00 según la fuente, así que hay que salir pronto.


    Lo que no cabe, hacia el sur: el valle de Kiso y sus pueblos de postas de la Nakasendō, que
    piden un día y una noche. Está contado en [el mapa del viaje](#el-mapa-del-viaje).
