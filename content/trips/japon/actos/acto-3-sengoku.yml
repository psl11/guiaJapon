title: El siglo de la guerra, y *los castillos*
lead: >-
  En 1467 una disputa sucesoria encendió la **guerra Ōnin**, que quemó Kioto durante once años y dejó
  al shogunato sin autoridad real. Lo que vino después se llama *Sengoku*, «los estados
  combatientes»: siglo y medio en que Japón dejó de existir como país y pasó a ser un tablero de
  unos doscientos señores de la guerra —los daimyō— peleando todos contra todos.
body: |
  El caos hizo dos cosas buenas para el viajero de hoy. La primera: **los castillos**. Mientras hubo
  guerra permanente hubo que construir fortalezas, y la arquitectura militar japonesa evolucionó a
  toda velocidad de la empalizada de montaña a la máquina de piedra y madera con foso, laberinto de
  patios y torre del homenaje.

  La segunda fue un accidente. En **1543** un junco chino con tres portugueses a bordo encalló en la
  isla de Tanegashima, y los náufragos llevaban arcabuces. En diez años los herreros
  japoneses fabricaban mejores copias que los originales, y en veinte el arma había cambiado la
  guerra y, con ella, la arquitectura: se acabaron los muros altos y finos, llegaron los taludes
  ciclópeos en talud y las troneras —cuadradas para arcabuz, triangulares para arco— abiertas a
  la altura del pecho.

  La reunificación la hicieron tres hombres a los que todo japonés conoce por un dicho sobre qué
  haría cada uno con un pájaro que no canta. **Oda Nobunaga**, el brutal, lo mataría; Toyotomi
  Hideyoshi, el astuto que empezó de campesino, lo convencería de cantar; Tokugawa Ieyasu, el
  paciente, esperaría a que cantase.

  > Ieyasu esperó. Ganó la batalla de **Sekigahara en 1600**, se hizo nombrar shōgun en 1603 y su
  > familia gobernó Japón los siguientes 265 años.

  Del millar largo de castillos que llegó a haber, la mayoría fueron demolidos por decreto en el
  siglo XVII —una fortaleza por provincia y ni una más—, y de los que sobrevivieron, casi todos
  ardieron en 1945 y se rehicieron en hormigón en los años sesenta. **Solo doce conservan su torre
  del homenaje original.** Uno de ellos os espera el día 6.
connect:
  label: Lo veréis sobre el terreno
  body: |
    El de **Matsumoto**, el día 6. Y lo interesante no es que sea de los doce originales, sino que
    todo este siglo se toca allí con las manos: se sube a gatas por escaleras que no permiten cargar
    con una lanza, se agacha uno bajo techos hechos para que un intruso no pueda erguirse, y se
    asoma por unas troneras que están a la altura exacta de la cara — algunas cuadradas y otras
    triangulares, porque no disparaba lo mismo por unas que por otras.

    Es decir: un castillo japonés **no era una residencia fortificada, era un arma en la que se
    vivía**, y este se construyó en el momento preciso en que las armas de fuego acababan de cambiar
    lo que había que defender. Los detalles del edificio, en [su ficha](#matsumoto-jo).
