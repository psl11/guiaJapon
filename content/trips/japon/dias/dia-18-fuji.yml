blocks:
  - block: Amanecer
    time: "06:30–08:05"
    title: Bajar a Shinagawa y coger un Kodama
    body: >-
      La recogida no es en Kawaguchiko sino en **Shin-Fuji**, en la vertiente sur. Toei Asakusa hasta
      Shinagawa y de ahí una hora de Kodama: el de las 07:04 llega a las 08:03, con media hora de
      colchón. El anterior, a las 06:37, deja allí a las 07:34. Ronda los **¥5.200** sin reserva.
    window:
      label: El error que se paga caro
      body: >-
        **En Shin-Fuji solo para el Kodama**: el buscador de billetes hay que forzarlo o se acaba
        comprando un Nozomi que pasa de largo. Hoy es **festivo con puente**, así que asiento
        reservado, y ya puestos **el asiento E**, que es el del lado del Fuji en los dos sentidos.
  - block: Mañana
    time: "08:30–13:00"
    title: La cara norte, que es la de la postal
    body: >-
      Se empieza por la pagoda Chūreitō sobre Fujiyoshida, casi cuatrocientos escalones hasta la
      imagen del país. Después, los lagos de la falda norte y la aldea de Iyashi no Sato, junto al
      lago Saiko.
    window:
      label: Lo que la furgoneta resuelve
      body: >-
        Estos sitios no se conectan bien en transporte público: autobuses de una o dos frecuencias por
        hora que no encajan entre sí. **Por libre se hacen dos, tres como mucho.** Es exactamente lo
        que se está comprando.
    ver:
      - ficha: fuji
        nota: Por qué la montaña fabrica su propia nube, y desde dónde se deja ver.
      - nombre: Pagoda Chūreitō
        maps: Chureito Pagoda Fujiyoshida
        nota: "Es de **1963** y es un monumento a los caídos, no un templo antiguo: alguien eligió muy bien el sitio."
      - nombre: Lago Kawaguchi
        maps: Lake Kawaguchi Fujikawaguchiko
        nota: El reflejo del Fuji solo sale sin viento, y eso pasa sobre todo a primera hora.
      - nombre: Iyashi no Sato
        maps: Saiko Iyashi no Sato Nenba
        nota: Aldea de casas de paja reconstruida como museo tras el desprendimiento de 1966.
  - block: Mediodía
    time: "13:00–14:30"
    title: Comer en el pueblo
    body: >-
      La comida va incluida y en esta zona significa **hōtō**, el plato de Yamanashi: fideos anchos de
      trigo cocidos dentro de un caldo espeso de miso con calabaza, taro y verdura de invierno, en su
      olla de hierro. La masa se cuece en el caldo y lo espesa: comida de montaña de noviembre.
  - block: Tarde
    time: "14:30–18:30"
    title: Debajo de la lava
    body: >-
      La tarde va por el subsuelo, por la colada de la erupción *Jōgan* de 864: dos cuevas que son
      tubos de lava, el bosque que creció encima y, al final, las cataratas Shiraito.
    window:
      label: Cómo ir vestido
      body: >-
        Las cuevas se andan **agachado y por suelo mojado**, con escaleras metálicas, techo bajo y
        hielo, y en Shiraito se moja el que se acerca. Suela que agarre y una capa impermeable.
    ver:
      - nombre: Cueva de hielo de Narusawa
        maps: Narusawa Ice Cave
        nota: Un tubo de lava cerca de cero grados todo el año, que sirvió de nevera natural.
      - nombre: Cueva de viento de Fugaku
        maps: Fugaku Wind Cave
        nota: Otro tubo de la misma colada, donde se guardaban semillas y huevos de gusano de seda.
      - nombre: Aokigahara
        maps: Aokigahara Forest
        nota: "Bosque sobre roca: las raíces no pueden hundirse y crecen a lo ancho. Se recorre por pasarela."
      - nombre: Cataratas Shiraito
        maps: Shiraito Falls Fujinomiya
        nota: Ciento cincuenta metros de ancho de agua que sale de la pared de roca, no de un río.
  - block: Noche
    time: "18:30–20:30"
    title: La vuelta
    body: >-
      La excursión termina donde empezó y el Kodama deja en Tokio en poco más de una hora. Hotel sobre
      las ocho y media, sin haber mirado un mapa en toda la jornada.
    window:
      label: Confirmad la hora de fin
      body: >-
        Diez horas desde las 8:30 dan las **18:30**, pero depende del tráfico de un festivo.
        **Preguntadlo el día antes por WhatsApp** y mirad el último Kodama con margen.
alt:
  label: Si te desmarcas
  body: >-
    Hoy no hay desmarque: está contratado y pagado, y el punto de encuentro está a hora y media de
    Tokio. Lo que sí conviene es saber **qué se está dejando fuera**, porque la excursión cubre la
    falda y no la ciudad.

    Que hoy sea el ***Kinrō Kansha no Hi***, festivo nacional del trabajo, tiene un efecto útil en
    Tokio que hoy no se aprovecha: **los museos que cierran los lunes hoy abren** y trasladan su
    cierre al **martes 24**. Como mañana toca [Nikkō](#nikko), no molesta — pero si alguien se
    plantea saltarse la excursión, este es el mejor lunes del año para el Museo Nacional de
    [Ueno](#ueno) y el Nezu.

    Y la otra cara de la montaña, para otro viaje: **Hakone**, con su circuito de tren de montaña,
    funicular, teleférico sobre un valle volcánico humeante y barco por el lago Ashi. Tiene onsen de
    verdad y funciona aunque el Fuji esté tapado, porque el plan no es la montaña sino el recorrido.
