body: >-
  Pequeño, silencioso y a dos minutos de la estación, que es exactamente donde hace falta un café
  decente. Trabajan **por rotación de tostadores** —japoneses y extranjeros—, así que el filtrado
  cambia cada pocos días y se puede probar el mapa del café japonés sin moverse de un taburete.


  Es el sitio para el primer café al bajar del tren, con la maleta todavía al lado, antes de decidir
  nada. Y para el último, si el tren de vuelta sale tarde.
