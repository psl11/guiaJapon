title: Tsukiji, el mercado exterior
epithet: >-
  El gran mercado mayorista se mudó a Toyosu en 2018 y mucha gente dio Tsukiji por muerto. Se
  equivocaban: lo que se fue fue la subasta; lo que se quedó —cuatrocientos puestos de comer y de
  comprar— es justo la parte a la que puede ir uno.
sections:
  - heading: Por qué existe, y por qué se mudó
    body: |
      El mercado de pescado de Tokio estaba en [**Nihonbashi**](https://www.google.com/maps/search/?api=1&query=Nihonbashi%20Bridge%20Tokyo) desde el siglo XVII, hasta que el **gran
      terremoto de 1923** lo destruyó. Se trasladó entonces a unos terrenos ganados al mar en la bahía
      —*Tsukiji* significa literalmente «tierra construida»— y allí creció hasta ser el mayor mercado
      de pescado del mundo, con sus subastas de atún de madrugada.

      En **octubre de 2018** el mayorista se mudó otra vez, ahora a [**Toyosu**](https://www.google.com/maps/search/?api=1&query=Toyosu%20Market%20Tokyo), un edificio moderno y
      cerrado donde las subastas se ven desde una pasarela acristalada. Pero el **mercado exterior**
      —el *jōgai shijō*, las calles de tiendas que habían crecido alrededor para servir a los
      profesionales— **no se movió**. Y ahí sigue: unos cuatrocientos puestos de pescaderos,
      cuchilleros, alga, encurtidos, cerámica y barras donde se desayuna de pie.
  - heading: Qué se come, de pie
    body: |
      Aquí no se viene a sentarse: se pica de puesto en puesto. Los clásicos: ***tamagoyaki*** en
      pincho —la tortilla dulce en capas, caliente, por unos pocos cientos de yenes—, **ostras
      abiertas al momento**, **atún a la brasa**, brochetas de vieira, *dashimaki*, y los cuchillos de
      **acero forjado** que son la mejor compra posible del viaje si alguien cocina en casa.

      La regla del mercado: **una vuelta entera antes de comprar nada**. Y llevar efectivo, aunque
      cada vez más puestos aceptan tarjeta.
  - heading: El calendario manda, y no es el vuestro
    body: |
      Tsukiji no abre según le conviene al visitante: **sigue el calendario del mercado central de
      Tokio**, y eso tiene consecuencias que sorprenden a mucha gente.

      Cierra **los domingos** y los **festivos**, y además **algunos miércoles** que se deciden mes a
      mes según cómo caiga el calendario de subastas — no hay una regla fija, se publica. Como el
      grueso de los puestos vive de los profesionales que compran aquí para sus restaurantes,
      **cuando no hay lonja, no hay motivo para abrir**. En la práctica: si en un viaje corto solo
      hay un hueco y cae en domingo, se pierde el mercado entero.

      Por eso este día cae donde cae en el itinerario — el porqué exacto, con la hora, está en el
      [plan del día 4](#dia-4-tsukiji-ginza).

      Y una precisión que evita un malentendido caro: **la famosa subasta del atún no está aquí**.
      Se fue a [**Toyosu**](https://www.google.com/maps/search/?api=1&query=Toyosu%20Market%20Tokyo) con el mayorista, es otro barrio, hay que estar sobre las **5:30** y la
      sala acristalada desde la que se ve requiere **registro previo**. Son dos planes distintos y no
      caben en la misma mañana.
  - heading: Dos paradas a cinco minutos que no hace nadie
    body: |
      El mercado se agota en hora y media. Lo que hay alrededor sostiene el resto de la mañana:

      - [**Tsukiji Hongan-ji**](https://www.google.com/maps/search/?api=1&query=Tsukiji%20Hongwanji%20Temple%20Tokyo), a dos manzanas, es **el templo budista más raro de Tokio**: por fuera
        parece un banco europeo coronado por un tejado del sur de Asia. No es un capricho. Lo
        reconstruyó en **1934** el arquitecto **Itō Chūta** después del terremoto, y eligió a
        propósito el **estilo de la India antigua** para devolver al budismo japonés la forma del
        sitio del que salió. Dentro es al revés: madera, un altar dorado tallado hasta el delirio y
        sitio para mil personas. Tiene además **órgano de tubos** y da conciertos gratis a mediodía
        algunos días del mes.
      - [**Tsukudashima**](https://www.google.com/maps/search/?api=1&query=Tsukishima%20Tsukuda%20Tokyo), cruzando el río, es un pueblo de casas de madera de tres calles escondido
        entre torres de apartamentos, con un puente rojo diminuto sobre una dársena. Lo fundó en
        **1613** un grupo de pescadores de [Osaka](#osaka) a los que el shōgun trasladó aquí, y de su cocina
        salió una palabra que se usa en todo Japón: el ***tsukudani***, alga y pescado conservados
        en soja dulce, se llama así **por esta isla**. Es también uno de los sitios donde mejor se
        come el ***monjayaki***, el primo líquido del [okonomiyaki](#okonomiyaki).

curiosidades:
  - >-
    **Tsukiji significa «tierra construida»**: son terrenos ganados al mar. El mercado acabó aquí
    porque el **terremoto de 1923** destruyó el de [Nihonbashi](https://www.google.com/maps/search/?api=1&query=Nihonbashi%20Bridge%20Tokyo), donde estaba desde el siglo XVII.
  - >-
    Lo que se mudó a Toyosu en 2018 fue **el mayorista y sus subastas**, no el mercado exterior. Las
    cuatrocientas tiendas y barras que interesan al visitante **siguen en Tsukiji**.
  - >-
    **Cierra los domingos.** Es el dato que reordena una visita a Tokio de fin de semana, y el motivo
    de que aquí caiga en lunes — el día en que cierran los museos.
