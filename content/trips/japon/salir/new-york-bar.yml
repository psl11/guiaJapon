body: >-
  Es **el bar de *Lost in Translation***. La barra donde Bill Murray mira el vacío, el ventanal con
  [Shinjuku](#shinjuku) desplegado cincuenta y dos plantas más abajo, el jazz en directo al fondo: está todo tal
  cual, y sigue siendo un buen bar además de un decorado. La propia Rough Guide lo lista como el
  sitio «para aspirantes a Bill Murray», que es una manera elegante de admitir por qué va todo el
  mundo.


  Dos avisos que ahorran disgustos. **Hay cargo de entrada por la música**, y **se perdona si cenas
  allí**: si el grupo tiene una noche de gastar, esta es. Y hay código de vestimenta —nada de
  chanclas ni pantalón corto—, que en un viaje de mochila conviene tener presente antes de salir del
  hotel.


  El truco de fotógrafo: la mesa buena es la de la esquina noreste, con la torre del Gobierno
  Metropolitano a la izquierda. Y si el cielo está limpio —en noviembre lo está— se ve el **Fuji**
  al atardecer desde el mismo ventanal, antes de que encienda la ciudad.
