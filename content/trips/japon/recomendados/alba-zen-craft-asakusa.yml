body: >-
  Un taller a unos pasos del [Sensō-ji](#sensoji) donde se hacen los propios palillos: se les da
  forma, se lijan y se acaban con color o grabado. Está en la décima planta de un edificio de
  Asakusa 1-chōme, o sea dentro del recorrido que el día 2 hace entre el templo y Kappabashi.


  Encaja bien con la forma de ese día, que es la única mañana del viaje en que el jet lag regala
  cuatro horas: el templo a las seis, Asakusa despierta a las ocho, y esto después, cuando ya no
  aporta madrugar.


  Es la versión de Tokio de lo mismo que hay en [Kawagoe](#alba-wood-works-kawagoe), y conviene
  elegir una: dos talleres de palillos en un viaje son uno de más. Este gana en logística —cae en el
  camino de todos— y el de Kawagoe gana en precio y en tienda.
