slug: dia-7-kanazawa-tokio
navLabel: "Día 7 · Kanazawa"
trip: japon
order: 7
eyebrow: El plan · Día 7 · jue 12 nov
title: Las cuerdas del jardín, y el tren *de vuelta*
dek: >-
  Kanazawa entera en una mañana larga —el jardín a las siete, dos barrios y una casa por dentro— y
  por la tarde el Shinkansen que cierra el arco de la montaña. Se vuelve a Tokio, que es donde el
  grupo se despide pasado mañana.
blocks:
  - block: Amanecer
    time: "07:00–09:00"
    title: Kenroku-en con el yukitsuri
    body: >-
      **El Kenroku-en abre a las 7:00** —antes que casi nada en Japón— y esa hora vale doble hoy: es
      uno de los **Tres Grandes Jardines** del país y a esa hora lo tenéis con los jardineros dentro y
      nadie más. De dónde sale su nombre y qué seis cosas hay que buscar mientras se anda, en
      [la ficha de Kanazawa](#kanazawa) — vale la pena llevarlo leído, porque el jardín está diseñado
      para que se vean por turnos y no de golpe.
    window:
      label: Ventana óptima
      body: >-
        **A partir del 1 de noviembre los jardineros montan el *yukitsuri***: postes altos junto a los
        pinos de los que cuelgan decenas de cuerdas en abanico, atadas rama a rama para que la nieve
        no las parta. Llegáis en la segunda semana, así que lo veréis **montado o montándose, con los
        jardineros trabajando** — que es todavía mejor. Es la imagen de la ciudad y solo existe entre
        noviembre y marzo.
  - block: Mañana
    time: "09:00–12:00"
    title: Un barrio de té, otro de samuráis y un cilindro de cristal
    body: >-
      Dos barrios enteros, a quince minutos andando el uno del otro. **En los dos hay que entrar en
      una casa**, que es donde está la diferencia: por fuera son fachadas; por dentro, cómo se vivía.

      - La **Shima**, en [Higashi Chaya](#kanazawa): una casa de té del siglo XIX intacta.
      - La **casa Nomura**, en
        [Nagamachi](https://www.google.com/maps/search/?api=1&query=Nagamachi%20Samurai%20District%20Kanazawa),
        el barrio de los samuráis. Sus tapias de barro estarán ya envueltas en esteras de paja contra
        el hielo.
      - Y el **Museo del Siglo XXI de Arte Contemporáneo**, el cilindro de cristal de SANAA con la
        piscina de Leandro Erlich. Cierra los lunes y hoy es jueves, así que esta vez sí entra.
  - block: Mediodía
    time: "12:00–14:00"
    title: El ekiben del mar del Japón
    body: >-
      Kanazawa vive de una de las mejores lonjas del país y eso se nota en su estación: sus
      ***ekiben*** son de marisco, no de pollo frito. Comprad uno para el tren y comedlo a bordo, que
      es lo que hace todo el mundo y no un apaño — ver [konbini y ekiben](#konbini). Antes, si queda
      hueco, el mercado de **Ōmichō**: trescientos años de puestos de pescado bajo techo, y las barras
      del fondo sirven *kaisendon* a mediodía.
  - block: Tarde
    time: "14:00–17:00"
    title: Dos horas y media, y se acaba la montaña
    body: >-
      El **Hokuriku Shinkansen** deja en Tokio en dos horas y media largas, cruzando por debajo de la
      misma cordillera que se ha estado mirando desde abajo cuatro días. Es el trayecto que cierra el
      arco: se sale del mar del Japón, se pasa por Nagano y se entra en la llanura del Kantō, que a
      partir de aquí ya no se abandona hasta Kioto.

      **Reservad asiento**: el Kagayaki, que es el rápido, **no lleva vagones libres** — no es que se
      llenen, es que no existen.
    window:
      label: Las maletas, otra vez por delante
      body: >-
        **Esta mañana sale el segundo envío por [takkyūbin](#takkyubin)**, desde el hotel de Kanazawa
        al de Tokio. Y ojo con un detalle que se hace mal en piloto automático: **el hotel de Tokio de
        estas tres noches no es el mismo del final del viaje**. Mirad la reserva de esta semana, no la
        de la última.
  - block: Noche
    time: "noche"
    title: Volver a una ciudad que ya se conoce
    body: >-
      Llegar a Tokio por segunda vez no se parece en nada a llegar la primera: ya sabéis leer el
      metro, ya tenéis la tarjeta cargada y ya no os pilla de sorpresa la escala de la estación. Es la
      noche para lo que en la primera vuelta daba pereza organizar — una barra de ocho asientos en un
      *yokochō*, una izakaya con reserva — porque mañana no hay que madrugar para coger nada.

      Y hay una cuenta que conviene hacer esta noche: **le quedan a uno de vosotros dos días**. Ver
      [los vuelos](#vuelos).
alt:
  label: Si te desmarcas
  body: >-
    En Kanazawa, el **Museo D. T. Suzuki**: un pabellón mínimo de hormigón y agua dedicado al
    filósofo que explicó el zen a Occidente, con una sala vacía para sentarse frente a un estanque.
    Se ve en cuarenta minutos y no hay nadie.

    Y si preferís cortar la mañana y salir antes, el Shinkansen de Kanazawa para en **Nagano** por el
    camino: el **Zenkō-ji** está a diez minutos de la estación, es uno de los templos más importantes
    del país y guarda la que dicen que es la primera imagen budista que llegó a Japón — que nadie ha
    visto, porque es un *hibutsu*, un buda oculto que no se muestra jamás. Se puede bajar, verlo y
    coger el siguiente tren.
