quePedir: >-
  ***Ningyō-yaki*** recién hecho —bizcochito relleno de judía dulce— y ***age-manjū***, el mismo dulce pero frito.
body: >-
  Doscientos cincuenta metros de puestos entre la puerta del Trueno y el templo, y **una de las calles comerciales más antiguas del país**: hay licencias aquí que llevan en la misma familia desde el siglo XVIII, cuando el shogunato concedió el derecho a barrer el recinto a cambio de poder vender en él.


  La trampa es la hora. Si hacéis el [Sensō-ji](#sensoji) al amanecer, como manda el día 2, **estará todo cerrado y el templo vacío** — que es infinitamente mejor. Los puestos son para la vuelta, a media mañana, con el *ningyō-yaki* saliendo caliente del molde.
