title: El mapa del viaje — veintiún días en tres arcos
epithet: >-
  Antes de entrar en los sitios conviene ver la forma del conjunto, porque este viaje no es una línea
  recta: son dos bucles que salen de Tokio y vuelven a Tokio. Uno sube a la montaña y otro baja al
  oeste, y entre los dos está la despedida. Entenderlo ahorra la mitad de las dudas logísticas.
sections:
  - heading: Los tres arcos
    body: |
      **Arco uno · la montaña, casi de entrada (días 1-9).** Dos días en [Tokio](#barrios-de-tokio)
      para posar el desfase horario y arriba: Matsumoto, [**Kamikōchi**](#kamikochi) —un valle sin
      coches que cierra el 15 de noviembre—, [Takayama](#takayama), [Shirakawa-gō](#shirakawa-go) y
      [Kanazawa](#kanazawa). Se cambia de cama casi cada noche y el equipaje se resuelve mandándolo
      por delante. Se vuelve a Tokio por el Hokuriku Shinkansen, y los dos últimos días del arco son
      la Yamanote, con la última noche de los cuatro en Shinjuku, y el sábado de la despedida, que los
      tres que siguen pasan en [Kamakura](#kamakura-zen). El cuarto ya la habrá visto por su cuenta.

      **Y ahí, en Tokio, el grupo se parte:** uno vuela a Barcelona el **sábado 14 desde Narita** y
      los otros tres siguen hasta el 26. Que la despedida caiga en un hotel de la capital y no en una
      parada de autobús de montaña es la razón de que el viaje tenga esta forma y no otra.

      **Arco dos · el oeste (días 10-16).** Empieza con un rodeo que no lo parece: **un domingo entero
      en el centro de Tokio** —el Palacio, [Marunouchi](#marunouchi) y el sur de la Yamanote— y se
      baja el lunes. Luego [Kioto](#kioto) cuatro noches, con [Osaka](#osaka) de excursión, y
      [Hiroshima](#hiroshima) y [Miyajima](#miyajima) al final. Es el tramo que casi todo el mundo
      cree que es Japón, y llega justo cuando el color entra en su mejor quincena.

      **Arco tres · Tokio otra vez (días 17-21).** Cinco días de ciudad al final y no al principio,
      que es donde valen más: **el pico de la hoja roja en Tokio va del 20 de noviembre al 5 de
      diciembre**. Compras, la excursión guiada al [Fuji](#fuji), la Yamanote y el
      [Tsukiji](#tsukiji).
  - heading: Lo que cuesta moverse
    body: |
      De Kioto para abajo todo va en línea recta sobre el viejo **Tōkaidō**, la carretera de Edo a
      Kioto, que hoy es la línea de Shinkansen más transitada del mundo. Los Alpes y Hida, en cambio,
      se hacen en autobús: allí arriba no llega el tren rápido.

      - **Shinjuku → Matsumoto**: 2 h 30 en el limited express *Azusa*
      - **Matsumoto → Kamikōchi**: 2 h · **Kamikōchi → Hirayu → [Takayama](#takayama)**: 1 h 30, y
        con una trampa de horarios que conviene leer antes
      - **Takayama → [Shirakawa-gō](#shirakawa-go)**: 50 min ·
        **Shirakawa-gō → [Kanazawa](#kanazawa)**: 1 h 15
      - **Kanazawa → Tokio**: 2 h 30 en el **Hokuriku Shinkansen**, directo y sin vagón libre
      - **Tokio → [Kioto](#kioto)**: 2 h 15 en Nozomi · **Kioto → [Osaka](#osaka)**: 30-45 min
      - **Kioto → [Hiroshima](#hiroshima)**: 1 h 40 · **Hiroshima → [Miyajima](#miyajima)**: 40 min
        contando el ferry · **Hiroshima → Tokio**: 4 h
      - **Tokio → [Nikkō](#nikko)**: 2 h, ida y vuelta en el día · **Tokio → Shin-Fuji**: 1 h en
        Kodama, para la excursión del [Fuji](#fuji) · **Tokio → Narita**: 36 min en Skyliner

      El detalle que cambia la cuenta: **el JR Pass solo cubre el Nozomi pagando un suplemento
      aparte**. Y los autobuses de los Alpes y de Hida no son JR: se pagan con pase o sin él. La
      aritmética completa, para los tres y para el cuarto por separado, está en
      [el JR Pass](#jr-pass).
  - heading: Las tres cosas que hay que cerrar antes de salir
    body: |
      Casi todo este viaje se improvisa bien. Tres cosas no:

      1. **Los autobuses de Kamikōchi.** Los directos desde Matsumoto se llenan y se compran por
         internet; y los dos de la bajada tienen una trampa de horarios que puede dejaros tirados.
         Está explicado en [Kamikōchi en el día](#kamikochi-en-el-dia).
      2. **Shibuya Sky y teamLab**, cuyas franjas buenas se agotan con días de antelación. Ver
         [qué hay que reservar](#reservas-tokio).

      Todo lo demás —trenes, museos, restaurantes— se resuelve sobre la marcha o con un día de
      antelación, con dos excepciones que no son reservas sino avisos: **el Kagayaki de Kanazawa a
      Tokio no lleva vagones libres**, y conviene reservar el Nozomi de bajada. Y el equipaje tiene su
      propia solución, que aquí se usa tres veces: ver
      [mandar las maletas por delante](#takkyubin).
  - heading: Lo que este viaje no ve, y por qué
    body: |
      Un itinerario se define tanto por lo que mete como por lo que deja fuera, y estas son las
      renuncias — dichas sin adornos, para que nadie llegue pensando que se le olvidó a alguien.

      - **El monte Kōya (Kōyasan).** La renuncia que más duele. Es el complejo monástico del budismo
        Shingon: se duerme **dentro de un templo**, se cena [shōjin ryōri](#shojin-ryori) y se
        recorre de noche el **Okunoin**, un cementerio de doscientas mil tumbas entre cedros de
        cuarenta metros. Cuesta **dos días desde Osaka** y esos dos días solo pueden salir de Kioto o
        de Hiroshima. Es el primer candidato si algún día hay un viaje de veinticinco días.
      - **Naoshima y las islas del arte.** Museos de Tadao Andō y la calabaza de Yayoi Kusama en el
        mar interior. Son **dos días con ferry** y un cambio de tema tan grande que rompe el hilo del
        viaje. Va en la lista del siguiente.
      - **Hokkaidō y Okinawa.** No son un desvío: son otro país y otro clima. En noviembre Hokkaidō
        ya está en invierno y Okinawa es subtropical. **Cualquiera de los dos es un viaje entero.**
      - **Ise Jingū**, el santuario más sagrado del sintoísmo, que se **derriba y se reconstruye
        idéntico cada veinte años**. Está mal comunicado desde todo y pide un día entero para ver
        algo que, deliberadamente, casi no se deja ver.
      - **Uji**, a veinte minutos de Kioto: el **Byōdō-in** que sale en la moneda de diez yenes y la
        denominación de origen del [té japonés](#te-japones). Es la mejor media jornada suelta que
        hay, y sigue viva como alternativa: es la carta del día 14 para quien prefiera cambiar
        [Osaka](#osaka) por algo más callado.
      - **Nara.** Estuvo dentro y salió, y no por falta de sitio: el Gran Buda del Tōdai-ji es de
        primera división y estaba a cuarenta y cinco minutos. Pero un día de Kansai se cambió por
        [un domingo en el centro de Tokio](#dia-10-tokio-centro) —el Palacio, la tumba de
        [Masakado](#masakado), los cuarenta y siete rōnin—, que era lo único del itinerario anterior
        que se quedaba escrito y sin visitar. El precio de esa decisión son mil doscientos ciervos
        que nadie va a echar de menos.
      - **El valle de Kiso y la Nakasendō.** Es de los valles más remotos de los Alpes, entre los
        montes Kiso y los Akaishi, y entrar en él es cruzar a otro Japón. Por aquí pasaba la
        Nakasendō, uno de los cinco caminos de Edo y uno de los dos que unían Kioto con la capital
        del shōgun, organizada en sesenta y nueve pueblos de postas. Hiroshige y Eisen grabaron sus
        estaciones, y varios pueblos siguen pareciendo sacados de aquellas estampas. Se puede
        recorrer sin andar, pero vale la pena hacer uno de los tramos restaurados:
        - **De Yabuhara a Narai-juku**, el menos concurrido: unos siete kilómetros de bosque cerrado
          por el paso de Torii. Yabuhara es un pueblo rural sin prisa, y en Narai casi todas las
          casas conservan la arquitectura de Edo.
        - **De Magome a Tsumago**, el famoso, más llevadero y con aldeas por el camino.

        Pide dormir allí, en un *minshuku* con cena tradicional y futón, y eso es un día que el viaje
        no tiene: Narai queda a una hora larga al sur de [Matsumoto](#matsumoto-jo), en dirección
        contraria a la montaña.
      - **El Tōhoku del otoño.** El reportaje de *National Geographic* sobre el otoño en el interior
        de Honshū que trajo Pablo, que por las fechas que da es de 2021, recorre la ruta del Fuji a
        Nikkō y después sigue hacia el norte. Eso último es otro viaje entero:
        - **Aizu-Wakamatsu**, poco visitada y con pasado samurái: el castillo Tsuruga, casas de
          samuráis de Edo y el jardín Oyakuen. Está a los pies del monte Bandai, el «Fuji de Aizu»
          por su cono perfecto, que entró en erupción en 1888 y dejó los lagos y senderos de
          Urabandai, lo mejor de la zona en otoño.
        - **Yamadera**, desde la ciudad de Yamagata: el templo que fundó Jikaku Daishi en 860 en lo
          alto de una montaña, cuando aquello era la frontera con los *emishi*, los pobladores
          originales del noreste de Honshū. Se suben más de mil escalones por el bosque, entre rocas
          raras, pabellones y tumbas cubiertas de musgo, se cruza la puerta Niōmon y arriba está la
          sala Godaidō, un mirador sobre el valle del río Tachiya. Allí escribió Bashō
          閑さや岩にしみ入る蝉の声: «Silencio. / La voz de las cigarras / se mete en la roca».
        - **Ginzan Onsen**, sobre una antigua mina de plata: una calle de *ryokan* de madera con
          farolas de gas y gente paseando en *yukata*, como a principios del siglo XX. Pide dormir
          allí.
        - **Dewa Sanzan**, las tres montañas del *shugendō*, la religión de las montañas que mezcla
          budismo y sintoísmo. Cada una tiene un santuario en la cima y una etapa de la vida: Haguro
          (414 m), el nacimiento; Gassan (1.984 m), la muerte; y Yudono (1.504 m), el renacimiento.
          Los *yamabushi*, sus monjes vestidos de blanco, hacen a pie la peregrinación entre las
          tres. En otoño la nieve ya no lo permite, pero a Haguro y a Yudono se llega por carretera.
          En Yudono se sube desde el aparcamiento, se entra descalzo y un monje entrega una figura
          de papel con un conjuro que hay que pasarse por todo el cuerpo para purificarse. Lo que
          pasa dentro no se puede contar. Bashō lo cumplió en su haiku: 語られぬ湯殿にぬらす袂かな,
          «De Yudono no se habla. / Se me moja la manga».

        Allí el color llega en octubre, así que en estas fechas también llegaríais tarde. La
        literatura que hay detrás de todo esto está en [los libros](#japon-cine-libros).
      - **El día comodín.** El itinerario anterior tenía uno al final, sin asignar, y se lo comió el
        traslado de vuelta desde Kanazawa. El de Kansai se gastó en lo de arriba. **Ya no queda
        ninguno**: de aquí en adelante, meter algo obliga a quitar algo.
      - **La noche dentro de Kamikōchi**, que no se descartó: se intentó y estaba vendida. Es la
        única renuncia de esta lista que no fue una decisión. Ver
        [dormir en el valle](#dormir-en-kamikochi).
      - **Kioto en sí.** La renuncia interna: aun con cuatro noches, Kioto tiene para más. Lo que se
        sacrifica son los templos del norte —Daitoku-ji, el Ryōan-ji— y el Paseo del Filósofo con
        calma. Va compensado con [Kamikōchi](#kamikochi), que tiene fecha de caducidad y Kioto no.

curiosidades:
  - >-
    El trayecto **Tokio–Osaka** es la línea de alta velocidad **más transitada del planeta**: sale un
    tren cada pocos minutos y su retraso medio anual se mide **en segundos**.
  - >-
    El **Tōkaidō** que sigue el Shinkansen es la misma ruta que Hiroshige grabó en 1833 en sus
    *Cincuenta y tres estaciones*: las paradas del tren de alta velocidad son, casi una por una,
    **las antiguas postas donde se cambiaba de caballo**.
  - >-
    Estas tres semanas caben en un país **del tamaño de Alemania** — pero con el **73 % de su
    superficie en montaña**, que es exactamente la razón de que todo el mundo viva y viaje por la
    misma franja costera, y de que subir a Kamikōchi cambie tanto el viaje.
