badge: "Bib Gourmand · fue estrella Michelin de 2017 a 2023"
quePedir: >-
  El ***tantanmen***: pasta de sésamo, miso de carne y aceite de guindilla, con un picante que no
  tapa el caldo. Si no apetece picante, el *shōyu*, con caldo de pollo entero y ostra.
body: >-
  Fue el **segundo ramen de Japón con estrella Michelin**, en 2017, y la tuvo hasta que la guía de
  2024 pasó los ramen con estrella de Tokio al Bib Gourmand. Así que sigue siendo exactamente lo mismo
  —el matrimonio que lo abrió, el mismo cuenco— y ahora con la distinción que le corresponde a un
  plato de menos de diez euros.


  Cae en el **día 17**, el de Ikebukuro: Ōtsuka es la parada siguiente de la Yamanote. **Cierra los
  martes**; el domingo abre de 11:30 a 15:00 y de 18:00 a 21:00, así que el corte de mediodía hay que
  calcularlo con la cola, que suele ser de media hora larga. Para el que se va el 14 encaja mejor **la vuelta de Kawagoe del jueves 5**: se pasa por Ikebukuro y el turno de cena empieza a las 18:00.
