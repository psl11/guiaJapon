body: >-
  Es el mejor nudo de transporte de los dos candidatos, y en Tokio eso es lo que decide un hotel. La
  estación de Akihabara concentra **Yamanote, Chūō-Sōbu, Hibiya y Tsukuba Express** en el mismo
  edificio, a tres minutos andando: el día 4 se baja a [Tsukiji](#tsukiji) por la Hibiya en once
  minutos sin cambiar de andén, y el día 5 la salida hacia Kamakura pasa por la estación de Tokio,
  que son cuatro minutos de Yamanote.


  Y tiene una carta que el otro no. Por Iwamotochō, a dos minutos, pasa la Toei Shinjuku: **línea
  directa hasta [Shinjuku](#shinjuku) sin transbordo**, que es donde se duerme la segunda mitad del
  viaje.


  Con 1.428 reseñas es el de muestra más grande de los cuatro que se compararon, y no es una cadena
  de negocios: se nota en el acabado y en la cama. Lo que se le critica de forma consistente es
  **el tamaño de las habitaciones**, que en Tokio es el estándar y no una sorpresa.
