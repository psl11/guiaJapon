body: >-
  El escalón de arriba de la cocina vegetariana japonesa: **una estrella Michelin haciendo únicamente *shōjin ryōri***, sin ninguna concesión y sin ningún producto animal. Llevan generaciones sirviendo a los monjes de Daitoku-ji y esa es literalmente su clientela original.


  Merece decirlo claro porque cambia el viaje: en Japón un vegetariano suele comer *a pesar de* la carta. Aquí, y en las dos *shōjin* de arriba, **come mejor que nadie en la mesa**. Si hay que gastar una comida cara del viaje en un sitio, este es un candidato serio.
