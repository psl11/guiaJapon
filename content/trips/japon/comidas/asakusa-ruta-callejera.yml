body: >-
  Cuatro paradas de calle alrededor del [Sensō-ji](#sensoji), todas a cinco minutos andando unas de
  otras y todas abriendo a las diez, que es exactamente la hora en la que el día 2 vuelve a Asakusa
  para verlo convertido en mercado:

  - **Asakusa Kagetsudō** (Asakusa 2-7-13) — el *melonpan* gigante, trescientos yenes, y setecientos
  si se pide relleno de helado de vainilla o matcha. **Hornea hasta que se acaba**, así que a última
  hora puede no quedar.
  - **Asakusa Unana** (2-7-21) — cuenco de anguila a la brasa a precio de puesto, de 10:00 a 17:15 y
  hasta las 18:15 los fines de semana. Es lo que se ve en los vídeos de comida callejera del templo.
  - **Asakusa Menchi** (2-3-3) — la croqueta frita de carne picada de ternera y cerdo, de 10:00 a
  19:00.
  - **Tokyo Curry Pan** — el pan relleno de curry y frito, la otra institución del barrio.


  Después de comer, **Kappabashi está a diez minutos** y es donde el día ya iba: la calle de los
  cuchillos y la vajilla. La ruta entera cabe entre el templo y esa calle sin dar un rodeo.
