title: El matcha, dónde comprarlo y cuál para qué
area: Tokio, antes del 14 · y Kioto para los que siguen
note: "Ippodo · una lata por persona y tienda"
body: |
  **Lo primero, porque cambia el plan: hay escasez.** Desde 2025 la hoja con la que se hace el
  matcha (*tencha*) no llega para la demanda, y las casas buenas **limitan la venta a una lata por
  persona**. Ippodo lo aplica en Tokio, y a principios de 2026 las tiendas de té de Ueno seguían
  igual. No es para alarmarse —en Kioto hay más existencias—, pero sí para no dejarlo al último día
  y para repartir las compras entre tiendas.

  **Dos matchas distintos, para dos usos distintos:**

  - **Para tomar solo, batido con agua (el «ceremonial»).** La referencia es **Ippodo**, casa de
    Kioto desde 1717. El **Sayaka** es el equilibrado y el más vendido; el **Ummon**, el de arriba
    de la gama. Desde el 1 de octubre de 2026, en su web japonesa, la caja de 20 g de Sayaka cuesta
    ¥3.024 y la de Ummon, ¥5.400 (antes, ¥4.320).
  - **Para latte con leche y hielo.** No hace falta el caro: la leche tapa los matices finos y lo
    que se busca es un amargor que aguante. **El Ikuyo de Ippodo** es el que la propia casa recomienda
    para latte: la caja de 20 g cuesta ¥1.512, y la bolsa de 100 g costaba ¥6.000 en octubre de
    2025 (el precio nuevo no se ha podido confirmar). Si en la etiqueta pone menos de ¥7.560, la
    bolsa sale más barata por gramo que la caja. Y el de supermercado que ya conoces sigue siendo buena
    compra: el **matcha de Ito En (お〜いお茶 抹茶)**, 30 g por unos ¥864 de precio de referencia. En
    cualquier supermercado, el que pone 「お点前用」 suele ir de ¥120 a ¥300 los diez gramos.

  **Los precios de arriba ya son los nuevos.** La casa anunció el 1 de septiembre de 2026 una
  revisión de precios y de formatos para octubre y noviembre, la segunda en un año, por la cosecha
  de 2026. El matcha subió el 1 de octubre; lo de noviembre es el formato y el contenido de los
  *bancha*, no el matcha.

  **Dónde: dos veces los cuatro juntos, en dos tiendas distintas.**

  - **Los cuatro, el jueves 12: Ippodo Shin-Marunouchi.** Es la compra del grupo, y la única
    tarde en que coinciden las dos cosas: estáis los cuatro y venís sin maletas, que viajan por
    *takkyūbin*. El Kagayaki de Kanazawa entra en la estación de Tokio hacia las 16:30 y la tienda
    está en el sótano del edificio Shin-Marunouchi, a dos minutos por la salida Marunouchi. **De
    11:00 a 21:00** (domingos y festivos, hasta las 20:00). Con el límite de una lata por persona,
    cuatro personas son cuatro latas. Está en [el día 7](#dia-7-kanazawa-tokio).
  - **Los cuatro, el viernes 13: Ippodo Aoyama**, la tienda grande, abierta en agosto de 2025.
    Segunda planta del 4-23-6 de Minami-Aoyama, a ocho minutos de la salida A5 de Omotesandō, hacia
    el Museo Nezu. **De 10:00 a 18:00, cierra los lunes.** Tiene salón de té con reserva. Cae en
    [la mañana de Omotesandō](#dia-8-yamanote), y como es otra tienda, son otras cuatro latas.

  **Y para los tres que siguen, si queréis más:** la casa madre de Ippodo está en Teramachi-Nijō, en Kioto, a diez
  minutos al norte de la calle por la que se pasa el [día 13](#dia-13-kioto-este). Es la tienda con
  más existencias de todas.

  Un apunte de conservación: el matcha se oxida rápido. Lata cerrada, en la nevera al llegar, y
  abierta se gasta en un mes.
