  - block: Noche
    time: "primera noche"
    title: Diez minutos de Akihabara
    dim: true
    ruta:
      slug: dia-1-chuo-dori
      desde: { nombre: Hotel Resol, lat: 35.6967393, lon: 139.7739276 }
      hasta: { nombre: Chūō-dōri, lat: 35.6989785, lon: 139.7712548 }
    body: >-
      Si después de cenar queda cuerpo, que sea el paseo corto: **cruzar el río Kanda hasta Chūō-dōri
      y mirar arriba**. No cualquier punto de la avenida, que baja kilómetros hasta Ginza: el tramo de
      Sotokanda, al oeste de la estación, que lleva el mapa de abajo. Ocho plantas de fachada tapadas
      de carteles, personajes de anime del tamaño de un edificio y el zumbido de los salones
      recreativos, de lo poco que sigue abierto. Para tres de vosotros es la primera imagen de Japón.
      Quince minutos bastan, y si no da el cuerpo, mañana a las seis la ciudad sigue ahí.
alt:
  label: Para el que espera
  body: >-
    Si llegas al aeropuerto antes de que salgan, hay espera que aprovechar sin moverse de la
    **Terminal 3**: en la cuarta planta, una réplica de una calle de Edo, con puestos y farolillos,
    y una terraza al aire libre desde la que se ven despegar los aviones. Y si el vuelo se retrasa
    mucho, el monorraíl sigue funcionando hasta cerca de la medianoche.
