title: Los vuelos, ida y vuelta
area: Madrid ⇄ Tokio · Air China vía Pekín
status: reservado
note: "Los cuatro comprados · tres salen por Haneda, uno por Narita"
body: >-
  **Los tres que hacen el viaje entero ya tienen billete**, y sus horarios fijan dos cosas del plan:


  **Ida ·** Air China desde **Madrid**, saliendo el **jueves 5** —no el 6— porque el trayecto se come
  un día entero: **CA 866** MAD 16:40 → Pekín 10:40 del día siguiente, cuatro horas y tres cuartos de
  escala, y **CA 421** Pekín 15:25 → **Haneda 19:50 del viernes 6**. Con el traslado al hotel, en
  Shinjuku sobre las **21:00**.


  **Vuelta ·** **CA 422** Haneda 21:00 del **jueves 26** → Pekín 00:20, **una hora y treinta y cinco
  minutos de escala**, y **CA 907** Pekín 01:55 → Madrid 07:20 del viernes 27.


  Dos consecuencias que conviene tener presentes. La primera, buena: **los cuatro entran por
  Haneda** y los tres largos también salen por ahí — media hora al centro en vez de hora y media, y
  es **el único aeropuerto donde se devuelve la fianza de la tarjeta IC** (ver
  [cómo moverse](#transporte-tokio)). La segunda, para vigilar: la escala de vuelta en Pekín es de
  1 h 35. Da, pero no sobra; conviene confirmar con la aerolínea si el equipaje va facturado hasta
  Madrid o hay que recogerlo en Pekín, porque eso cambia el cálculo por completo.


  **El cuarto billete ya está comprado, y sale por Narita**: **sábado 14 a las 12:10**. Con las ocho
  horas de huso a favor se aterriza en Barcelona ese mismo día, que era la condición.


  Ese horario cambia el final de sus ocho días, y a mejor. Un vuelo de mediodía no se coge desde los
  Alpes esa misma mañana: **la bajada se hace entera el viernes 13**, sin prisa —el valle por la
  mañana, Matsumoto, el Azusa y el Narita Express—, y **se duerme junto al aeropuerto**. El sábado
  solo queda desayunar y facturar. Está contado paso a paso en [el día 8](#dia-8-bajada).


  Dos consecuencias de salir por Narita y no por Haneda. La primera: **la fianza de la tarjeta IC no
  se devuelve allí**, así que o se devuelve antes en Haneda o se guarda la tarjeta para la próxima
  vez (ver [cómo moverse](#transporte-tokio)). La segunda: la maleta grande que se manda desde
  Matsumoto por [takkyūbin](#takkyubin) **no va a Takayama con las de los demás** — va al aeropuerto o
  al hotel de esa noche.
