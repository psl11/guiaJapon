quePedir: >-
  Una ración **a la plancha** y otra **hervida**, con brotes de soja y cerveza. No hay más carta.
body: >-
  Seis platos en la carta y cuatro de ellos son *gyōza*. Cuestan poco más de trescientos yenes la ración de seis y salen a un ritmo industrial en un local estrecho con la cocina a la vista. Es lo contrario de una experiencia: es un sitio donde comer bien en veinte minutos por cinco euros en el barrio más caro de Tokio.


  Lo pongo aquí por el día 3, que es largo y caro si uno se deja llevar por Omotesandō: comer por cinco euros en el barrio más caro de Tokio deja el presupuesto entero para la cena.
