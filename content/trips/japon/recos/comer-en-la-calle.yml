title: "Comer de pie: mercados, yokochō y cómo elegir puesto"
area: "Todo el viaje"
note: "Japón casi no tiene street food — tiene otras cinco cosas"
body: >-
  Conviene decirlo de entrada porque rompe una expectativa: **Japón no es un país de comida callejera**. Vender comida en la vía pública está muy regulado y comer andando está mal visto —se come **de pie y quieto, junto al puesto donde lo compraste**—. Lo que hay, en cambio, son cinco formatos propios que hacen el mismo trabajo y mejor:


  **1 · Los mercados.** [Nishiki](#nishiki) en Kioto, [Kuromon](#kuromon) en Osaka, [Ōmichō](#omicho) en Kanazawa, el [matinal de Miyagawa](#miyagawa-asaichi) en Takayama y el exterior de [Tsukiji](#tsukiji) en Tokio. Son la versión japonesa de comer en la calle: puesto especializado, se come ahí mismo, de pie.
  
  **2 · Los *yokochō*.** Callejones de posguerra con barras de seis taburetes: [Omoide Yokochō](#shinjuku) en Shinjuku, [Ameyoko](#ameyoko) en Ueno, los de Kanda. Nacieron como mercado negro y siguen siendo el sitio con más densidad de cocina por metro cuadrado del país.
  
  **3 · Las ***depachika***.** El sótano de los grandes almacenes: dos plantas de mostradores monográficos. [Isetan](#depachika-isetan) es la referencia.
  
  **4 · Las calles de peregrinación.** [Nakamise](#nakamise) en Asakusa, [Komachi-dōri](#komachi-dori) en Kamakura, la subida al Itsukushima en [Miyajima](#momiji-manju). Puestos con licencias de siglos, todos de dulce y fritura.
  
  **5 · El [konbini](#konbini).** Que no es un fracaso: en Japón es una categoría de comida por derecho propio.


  **Cómo elegir puesto**, que en Japón funciona distinto que en el sudeste asiático:
  
  - **Una sola cosa en la carta.** El buen puesto japonés hace *una* cosa y lleva treinta años haciéndola. Si la carta tiene doce platos y fotos en cuatro idiomas, es para vosotros y no para ellos.
  - **La cola es de japoneses, y no habla.** Una cola larga y silenciosa de gente sola es la mejor señal que existe.
  - **Máquina de tickets a la entrada.** Es señal de rotación alta y precio honesto: el dueño no quiere perder tiempo cobrando. Se pide en la máquina, se da el ticket y se espera.
  - **Se ve cocinar.** Plancha, brasa o freidora a la vista, y el producto crudo al lado.
  - **Cierra cuando se acaba.** Los carteles de *urikire* («agotado») a media tarde son el mejor certificado de calidad de Japón.


  Y dos normas que no son consejo sino etiqueta: **no se come andando** y **la basura te la llevas puesta**. En Japón casi no hay papeleras en la calle —se quitaron tras el atentado del metro de 1995— así que se come junto al puesto, se devuelve el palillo o el vaso allí mismo, y lo que sobra viaja en la mochila hasta el hotel o el konbini.
