title: La isla que *era el dios*, y cuatro horas de vuelta
dek: >-
  Una mañana en una isla donde el santuario está construido sobre el agua porque pisar tierra era
  profanarla, y por la tarde el tren largo de vuelta a Tokio. Hoy la marea manda más que el reloj.
