body: >-
  Es la tienda grande de la marca, la que más mercancía tiene del país, en la segunda planta del
  centro comercial de Sunshine City. En la misma planta, pegado a la tienda, está **Pikachu
  Sweets**, el mostrador del Pokémon Café: bebidas y dulces con forma de Pokémon, para llevar y sin
  reserva.


  Pablo fue con Ade en noviembre de 2023, y es de los Pokémon Center más chulos de Japón. Para que
  nadie se confunda: el Pokémon Café de verdad, con mesa, menú y reserva, no es este mostrador, sino
  el de Nihonbashi.
