slug: japon
title: Japón, *bajando* del otoño
eyebrow: Tokio · Kamakura · Matsumoto · Kamikōchi — 6 a 13 de noviembre de 2026
heroMeta: 8 días · cuatro viajeros, tres de ellos por primera vez
quote: >-
  En Japón, el otoño no llega: baja. Empieza en las cumbres a finales de septiembre y tarda dos meses
  en alcanzar los arces de la ciudad.
quoteAttr: El *kōyō zensen*, el «frente de la hoja roja», que los periódicos publican como si fuera el tiempo
lede: >-
  Esta guía se escribe desde una posición rara: es el **quinto viaje** de uno y el **primero** de los
  otros tres. Así que hace dos cosas a la vez. Cuenta los clásicos —los de verdad, los que hay que ver
  la primera vez— como si nadie los hubiera contado antes; y al lado, en voz baja, deja las salidas
  laterales para quien ya los conoce y prefiere el desvío. Ninguna de las dos sobra.
relato:
  navLabel: Los lugares
  anchor: japon
  overline: Y ahora, los sitios
  title: Los lugares, *uno a uno*
  dek: >-
    A partir de aquí, una ficha por sitio, **agrupadas por ciudad y en el mismo orden en que el viaje
    las va encontrando**: Tokio, Kamakura, los Alpes, Hida, Kioto, Osaka, Hiroshima y la vuelta a
    Tokio. No son listados de qué ver: son el porqué de cada sitio —lo que hay que mirar, a qué hora
    y qué historia lleva detrás—, para leerlas la víspera y no delante del monumento.
historia:
  navLabel: La historia
  anchor: historia
  overline: Y por debajo de todo
  title: Mil quinientos años, *en seis actos*
  dek: >-
    Cierra la guía lo que la sostiene por debajo. Seis capítulos que se leen del tirón, de los
    primeros kami a las décadas perdidas, y que explican por qué un torii es una frontera, un
    castillo es un arma y una hoja roja es una tradición de mil años. Cada acto termina señalando
    dónde se toca con las manos durante el viaje.
rationale: >-
  El grupo viaja veintiún días de punta a punta del país. Este itinerario cubre **los ocho primeros**,
  que son los que hacemos juntos los cuatro: Tokio a fondo, un salto a Kamakura, y luego el giro que
  cambia el viaje — subir a los **Alpes japoneses** cuando el resto de las guías te mandan a Kioto.

  Y el giro tiene fecha de caducidad literal. **Kamikōchi cierra el 15 de noviembre**: la carretera se
  corta hasta abril y el valle se queda solo con la nieve. Dormimos allí el 12, tres días antes del
  cierre, con la hoja ya caída, las cumbres del Hotaka blancas y prácticamente nadie. No es la postal
  dorada de octubre; es algo mejor y más difícil de contar.

  Lo demás sale de esa decisión. Tokio primero porque es donde el desfase horario se paga barato y
  donde tres primerizos necesitan aterrizar de verdad. Matsumoto como bisagra —su castillo negro es el
  mejor conservado del país— y como último sitio con estación de tren antes de la montaña. El regreso,
  por el mismo hilo pero al revés, para coger un vuelo de noche que aterriza en Barcelona a mediodía.
