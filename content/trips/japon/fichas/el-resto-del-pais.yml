kicker: Japón · lo que este viaje no toca
title: El resto del país — y por qué no está en los ocho días
epithet: >-
  Estos ocho días no van a Kioto. Ni a Nara, ni a Hiroshima, ni a Osaka — y no es un olvido: es el
  precio de subir a los Alpes. Pero esta parte de la guía hace falta igual, porque el viaje del
  grupo **no termina el día 13**: son veintiún días de punta a punta del país, y los otros trece
  pasan justamente por aquí.
sections:
  - heading: Para quién es esta parte
    body: |
      Tiene **dos lectores distintos**, y por eso está escrita con el mismo detalle que el resto.

      **Los tres que siguen.** Cuando el vuelo de vuelta se lleve a uno el día 13, el grupo continúa
      casi dos semanas más, y su ruta está en estas fichas en el mismo orden en que van a hacerla:
      del cruce de Hirayu siguen al **oeste** —[**Takayama**](#takayama), [**Shirakawa-gō**](#shirakawa-go), [**Kanazawa**](#kanazawa)— y de
      ahí bajan a [**Kioto**](#kioto), [**Nara**](#nara), [**Osaka**](#osaka), [**Hiroshima**](#hiroshima) y [**Miyajima**](#miyajima). Conviene llevarlas
      leídas antes de separarse: es más fácil preguntar dudas al que ya ha estado cuatro veces
      mientras se le tiene delante.

      **El que se baja antes.** Para él solo hay una ventana, y está **por delante**: el vuelo de
      regreso es el 13 y el 14 hay que estar en Barcelona, así que lo que se añada se añade al
      principio. Llegar unos días antes del 6 y hacer el Kansai por libre es, además, la opción que
      mejor funciona: **el jet lag se paga una sola vez** y se llega a Tokio ya rodado.

      Y hay un tercer uso, más callado: [**Nikkō**](#nikko). Es la única de estas fichas que cabe dentro de los
      ocho días como excursión desde Tokio — y en la primera semana de noviembre tiene un argumento
      que Kioto todavía no tiene.
  - heading: Lo que cuesta llegar
    body: |
      De Kioto para abajo todo va en línea recta sobre el viejo **Tōkaidō**, la carretera de Edo a
      Kioto, que hoy es la línea de Shinkansen más transitada del mundo. Los Alpes, en cambio, se
      hacen en autobús: allí arriba no llega el tren rápido.

      - **Hirayu → Takayama**: 1 h en autobús · **Takayama → Shirakawa-gō**: 50 min
      - **Shirakawa-gō → Kanazawa**: 1 h 15 · **Kanazawa → Kioto**: 2 h 15
      - **Tokio → Kioto**: 2 h 15 (Nozomi) / 2 h 40 (Hikari)
      - **Kioto → Nara**: 45 min · **Kioto → Osaka**: 15 min
      - **Osaka → Hiroshima**: 1 h 25 · **Hiroshima → Miyajima**: 40 min con el ferry
      - **Tokio → Nikkō**: 2 h, y es ida y vuelta en el día

      El detalle que cambia la cuenta: **el JR Pass no cubre el Nozomi**, el más rápido. Con pase se
      va en Hikari y se pierden veinticinco minutos por trayecto — ver [el JR Pass](#jr-pass).
      Y los autobuses de la zona de los Alpes **no son JR**: se pagan aparte con pase o sin él.
  - heading: El orden que tiene sentido
    body: |
      Si al final hay días por delante, el reparto que menos tiempo tira es **de oeste a este**:
      volar a **Osaka (Kansai)** en vez de a Tokio y subir por el Tōkaidō, terminando en la ciudad
      donde empieza el día 1 del grupo. Se ahorra un trayecto entero de ida y no se deshace camino.

      Con ese esquema, la cuenta mínima honesta es:

      - **Kioto, tres días.** Con dos se ve; con tres se entiende. Es la única ciudad de esta lista
        que no admite prisa.
      - **Nara, medio día** desde Kioto. **Osaka, una noche** — es ciudad de cenar, no de ver.
      - **Hiroshima y Miyajima, un día entero** con noche en la isla si se puede.
      - **Nikkō** no entra en ese circuito: cae al **norte de Tokio**, en la dirección contraria. Su
        sitio natural es **el último día antes del 6**, ya en Tokio y de ida y vuelta en la jornada.

      Cinco o seis días, y Nikkō de propina. Menos de cuatro convierte el Kansai en una lista de
      fotos.
curiosidades:
  - >-
    El trayecto **Tokio–Osaka** es la línea de alta velocidad **más transitada del planeta**: sale un
    tren cada pocos minutos y su retraso medio anual se mide **en segundos**.
  - >-
    El **Tōkaidō** que sigue el Shinkansen es la misma ruta que Hiroshige grabó en 1833 en sus
    *Cincuenta y tres estaciones*: las paradas del tren de alta velocidad son, casi una por una,
    **las antiguas postas donde se cambiaba de caballo**.
  - >-
    Los ocho días de esta guía y las dos semanas que vienen después caben en un país **del tamaño de
    Alemania** — pero con el **73 % de su superficie en montaña**, que es exactamente la razón de que
    todo el mundo viva y viaje por la misma franja costera.
