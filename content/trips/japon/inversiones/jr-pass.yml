title: El *JR Pass*
verdict: prescindible
verdictLabel: Prescindible — y por mucho
lede: >-
  El pase que todas las guías dan por hecho, y que en este viaje **no sale a cuenta ni en su mejor
  ventana**. La cuenta está hecha abajo, tramo por tramo, y no está reñida.
ledger:
  - label: Cuesta
    body: >-
      **¥50.000** el pase ordinario de 7 días — y **¥53.000 a partir del 1 de octubre de 2026** si se
      compra por canal extranjero. Hay de 14 y 21 días, pero cuestan ¥80.000 y ¥100.000: para
      amortizarlos habría que vivir dentro de un shinkansen.
  - label: Qué compra, y qué no
    body: >-
      Trenes JR de larga distancia. Y aquí está el problema de este itinerario en concreto: **la mitad
      de sus tramos largos no son JR**. El tren y el autobús de Alpico a [Kamikōchi](#kamikochi), el
      autobús de Hirayu a [Takayama](#takayama), el de [Shirakawa-gō](#shirakawa-go) y el de
      [Kanazawa](#kanazawa) van todos por su cuenta. Y **el metro de Tokio tampoco es JR**, ni Tokyo
      Metro ni Toei, así que los trayectos de cada día quedan fuera en cualquier caso.


      Tampoco cubre el **Nozomi**, el shinkansen más rápido: con pase hay que ir en Hikari o Sakura y
      se pierden unos veinticinco minutos por trayecto largo.
  - label: La cuenta de las tres semanas
    body: >-
      Sumando en billete suelto lo que **sí** es JR en los veintiún días: aeropuerto → Tokio
      (~¥3.250), [Shinjuku](#shinjuku) → Matsumoto (~¥6.620), Kanazawa → Tokio (~¥14.380), Tokio →
      [Kioto](#kioto) (~¥13.850), Kamakura ida y vuelta (~¥1.880), Kioto → [Osaka](#osaka) ida y
      vuelta (~¥1.140), Kioto → [Nara](#nara) ida y vuelta (~¥1.500), Kioto →
      [Hiroshima](#hiroshima) (~¥11.600), [Miyajima](#miyajima) ida y vuelta (~¥840), Hiroshima →
      Tokio (~¥19.000), el Kodama del [Fuji](#fuji) (~¥10.400) y Tokio → aeropuerto (~¥3.250).
      **Total: unos ¥88.000.**


      Parece que ahora sí gana el pase, y sigue sin ganarlo: **está repartido a lo largo de tres
      semanas** y un pase solo cubre siete días seguidos. Su mejor ventana posible es **del día 10 al
      16** —Tokio → Kioto, Nara, Osaka, Hiroshima, Miyajima y la vuelta a Tokio—, y esos siete días
      suman **unos ¥49.000**. Se queda a mil yenes del pase, yendo además en trenes más lentos, porque
      el Nozomi no entra: hay que ir en Hikari y perder media hora en cada tramo largo.
  - label: Veredicto
    body: >-
      **No lo compréis.** Ni para los nueve primeros días ni para los veintiuno. Billetes sueltos y una
      **tarjeta IC**: se compran en máquina en dos minutos, permiten reservar asiento —conviene en el
      Azusa por las vistas y en el tramo del Fuji— y dejan usar el Nozomi.


      Y una alternativa que ahora sí merece una cuenta: el **Hokuriku Arch Pass** (~¥30.000, 7 días)
      cubre exactamente **Tokio–Kanazawa–Kioto–Osaka por la ruta del norte**, que con la forma nueva
      del viaje es justo lo que se hace entre el día 7 y el 13. Los tramos que cubriría suman unos
      ¥31.000, así que sale empatado — y **no llega a Hiroshima**. Empatar no es motivo para atarse a
      un pase, pero conviene saber que existe antes de descartarlo.
curiosidades:
  - >-
    El pase de 7 días **pasó de ¥29.650 a ¥50.000 en octubre de 2023** — casi el doble de golpe. Buena
    parte de los consejos que circulan por internet son anteriores a esa subida y ya no valen.
