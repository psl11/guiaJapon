quePedir: >-
  Si es de calle, la **brocheta a la brasa** de los puestos de Sanmachi. Si es sentado, ***hōba-yaki***: la carne asada sobre una hoja de magnolia con miso.
body: >-
  El **wagyū de Hida** es una de las tres o cuatro carnes con denominación seria de Japón y aquí se vende de todas las formas imaginables, incluidas las turísticas. La que merece la pena de verdad es el ***hōba-yaki***, un plato de campesino de la zona: una hoja seca de magnolia sobre brasa, miso encima y la carne haciéndose en su propio vapor.


  Y hay una versión que casi nadie pide y merece probarse aunque sea por comparar: el ***hōba miso*** a secas —la misma hoja, el mismo miso caramelizándose, pero con setas y verduras de montaña en lugar de carne—. Sale por un tercio del precio y es el plato original: la carne se le añadió cuando Hida empezó a venderla fuera.
