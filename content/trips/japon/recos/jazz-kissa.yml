title: Los jazz kissa, cómo se escucha y dónde
area: Tokio, Yokohama, Kamakura y Kioto
note: "Silencio, caras enteras y una consumición · unos 400 en todo el país"
body: |-
  El *jazz kissa* es un café donde lo que se hace es escuchar discos: dos altavoces enormes, las
  sillas mirando hacia ellos y un dueño que elige la música. Esta tarjeta sale del reportaje de
  *National Geographic* de marzo de 2026 que trajo Pablo, con fotos de Tim Davis. Su autor recorrió
  veintitantos *kissa* de la mano de Katsumasa Kusunose, un antiguo editor de revistas de Shikoku
  que ha visitado más de cuatrocientos y los documenta en Instagram.

  **La historia, en corto**

  - **Es un invento japonés.** El primero, el Blackbird, abrió en 1929 junto a la Universidad de
    Tokio, con el jazz que llegaba en los cruceros a Yokohama. Durante la guerra se prohibió la
    cultura estadounidense, y el jazz volvió en los cincuenta con los discos de los militares de las
    bases de Tokio.
  - **El dueño era el maestro.** Casi ningún músico venía de gira y los discos importados costaban
    una fortuna, así que el *kissa* era la única manera de oírlos y su dueño hacía de *sensei*.
  - **El *boom*.** *Moanin'*, de Art Blakey and the Jazz Messengers, y su gira de enero de 1961
    dispararon la moda: llegó a haber más de ochocientos. Murakami escribió sus tres primeras
    novelas mientras regentaba el suyo, el Peter Cat, entre 1974 y 1981.
  - **El silencio.** El fotógrafo Hozumi Nakadaira abrió el Dig en 1961 con una norma de silencio
    absoluto: bajaba las luces y tapaba las ventanas con cinta. La policía llegó a presentarse con
    luxómetros y a preguntar si los clientes estaban dormidos. «No, están escuchando. Miren cómo
    mueven los pies», le contestaron.
  - **La conversación.** En 1967 el mismo Nakadaira abrió el Dug, donde sí se hablaba. Para
    entonces muchos *kissa* se habían llenado de estudiantes contra la guerra de Vietnam, que veían
    en los músicos negros un icono de los derechos civiles; *Strange Fruit*, de Billie Holiday, se
    hizo famosa en Japón.
  - **La caída y la vuelta.** Con los equipos de música en casa fueron cerrando. Hoy quedan unos
    cuatrocientos, y en la última década se han vuelto a llenar de coleccionistas jóvenes y de
    aficionados a la alta fidelidad. Moeko Hayashi, del Masako, dice que los turistas suelen
    entender el protocolo mejor que muchos japoneses, porque lo han aprendido en internet.

  **Cómo se entra**

  - **Una consumición y a escuchar.** La mayoría pone caras enteras de vinilo, no temas sueltos.
    Los clásicos pinchan jazz de los cincuenta y sesenta; otros lo mezclan con música brasileña,
    *chanson* e incluso tango.
  - **Se mira lo que hacen los demás.** En los estrictos no se habla; en otros, en voz baja. Los
    japoneses lo llaman *kūki o yomu*, «leer el aire». Unos solo sirven café o té y otros, alcohol.
  - **Si quieres pedir un disco**, antes de que empiece la cara que suena.
  - **El móvil y las fotos, con permiso**, y sin flash.
  - **Y si algo te eriza la piel**, la palabra es *tori hada*, «piel de gallina».

  **Los que caen en el viaje**

  - **[Masako](https://www.google.com/maps/search/?api=1&query=Jazz%20Kissa%20Masako%20Shimokitazawa)**,
    en Shimokitazawa, de 1953: Mingus y Mal Waldron pasaron por allí en sus giras. Lleva el nombre
    de su fundadora, Masako Okuda. Moeko Hayashi lo descubrió de adolescente en los ochenta, por el
    jazz a todo volumen y las torres de manga, y lo reabrió en 2020 con los discos y los cuadros de
    la fundadora. Se sube por una escalera estrecha hasta una puerta sin ventanas; dentro hay
    madera, cortinas de cuentas, un cuadro de Alice Coltrane y una carta que pide hablar en voz baja.
    Ella pincha de 12:00 a 22:00, seis días a la semana; en 2023 cerraba los jueves. Primer piso de
    Kitazawa 2-31-2. Es la opción de escucha del miércoles 4, a dos paradas de Shibuya.
  - **[Eagle (いーぐる)](https://www.google.com/maps/search/?api=1&query=%E3%81%84%E3%83%BC%E3%81%90%E3%82%8B%20%E5%9B%9B%E8%B0%B7)**,
    en Yotsuya, de 1967, todo madera. Lo abrió el crítico Masahiro Goto, que prepara las sesiones a
    mano en cuadernos, con temas de cuatro discos relacionados, como las cuatro viñetas de un manga.
    Hasta publicó un libro con el método, que según él «no vendió nada». No se habla hasta las seis
    de la tarde, cuando pasa a ser un bar tranquilo. Es la alternativa de disco al directo del Pit
    Inn el jueves 5.
  - **[Chigusa](#chigusa) y [Downbeat](#downbeat)**, en Noge, Yokohama. Chigusa, de 1933, es el más
    antiguo que sigue abierto. El Downbeat, de 1956, lo lleva Shuhei Yoshihisa: una barra con humo
    al fondo y una sala de escucha con altavoces de cine, del bebop al jazz de hoy, empapelada con
    páginas amarillentas de la revista que le da nombre.
  - **El [Milk Hall](#milk-hall)** de Kamakura, el martes 3.
  - **En Kioto, para los tres**: el Yamatoya, que abrió Tadafumi Kumashiro en 1970 y sigue llevando
    él, con interiores de la era Shōwa, vinilo del suelo al techo y café hecho con agua de
    manantial; allí se reunían los estudiantes contra la guerra de Vietnam y contra las bases de
    Okinawa. Y el Jazz in Rokudenashi, cavernoso y punk, donde el batería Naohisa Yokota pone a
    Monk mientras se charla entre cigarrillos y whisky.
  - **Y el clásico**: el [Lion](#meikyoku-kissa-lion) de Shibuya, de 1926, que es lo mismo con
    música clásica.

  **Más, si se busca**

  - **El Eigakan**, en un callejón de Bunkyō. Lo abrieron en 1978 Yoshida Masahiro y Kinuko
    Watanabe; él hizo a mano los altavoces de bocina, en fresno japonés, y el amplificador de
    válvulas. Compara escuchar jazz allí con «una experiencia religiosa».
  - **El Silencio**, en Nerima: un *kissa* de barrio, con altavoces JBL de mediados del siglo
    pasado, que también sirve alcohol.
  - **El Tónlist**, luminoso, con jazz actual por unos Tannoy clásicos y perritos calientes a la
    islandesa (*tónlist* es «música» en islandés). Su dueño, Yuya Uno, diseña coches de día. Al
    autor del reportaje le pareció de lo mejor que oyó en Japón.
  - **El Genius**, que abrió en 1970 Shoichi Suzuki, ayudante de Nakadaira en el Dig y el primero
    que pinchó allí *A Love Supreme*. Suzuki murió dos meses después de la visita: conviene mirar si
    sigue abierto.
  - **El Callas Tokyo**, del luthier Isao Izutsu, donde André 3000 presentó su disco de flauta de
    2023.
  - **Para el rock, Slow Hand**, que según el reportaje solo pincha Eric Clapton de 1968 a 1972. No
    se ha podido confirmar ni la dirección ni el horario. Es un *ongaku kissa*, el mismo invento
    para el rock, la clásica o la música brasileña.
  - **Fuera de Tokio**: el Jazz Spot Candy de Miyoko Hayashi, en Chiba, para Keith Jarrett y
    Coltrane; y el Thee Coffee, uno de nueva generación en un pueblo al norte de Kioto, que tuesta
    su café y pincha jazz de vanguardia.

  **Lo que ya no**

  - **El Dug** de Shinjuku, que el reportaje todavía cita, cerró el 27 de junio de 2026 porque
    derriban el edificio.
  - **El Basie**, en Ichinoseki, a cuatro horas al norte de Tokio, el de mejor sonido del país según
    otros dueños. Shoji Sugawara convirtió en 1970 un almacén familiar, y fue el propio Count Basie,
    que lo visitó en 1980, quien le puso el apodo de «Swifty». Elvin Jones tocó allí cada Año Nuevo
    durante una década, ante dos altavoces del tamaño de un frigorífico hechos a medida en los
    setenta. Está cerrado desde la pandemia y solo abrió para el reportaje.

  **Para antes del viaje**

  - **El libro de Kusunose**, *Jazz Kissa*, de gran formato, y su consejo: un *kissa* no se conoce
    en una visita, sino yendo a diario durante una semana. Él lo hizo en el Mozu, de 1955.
  - ***A Century in Sound***, la serie documental de Nick Dwyer, que lleva una década filmando
    *kissa* y hace de guía para los angloparlantes: llevó a Jacinda Ardern y a Roman Coppola.
  - **Por qué funciona**, según un estudio de 2022 en *Brain Sciences*: escuchar en grupo
    sincroniza a quienes escuchan y difumina la distancia entre uno y los demás.
