body: >-
  El ***kushikatsu*** —brocheta rebozada y frita— nació en **Shinsekai** en 1929 como comida de jornalero, y Daruma es la casa que lo formalizó. Se pide de una en una, se moja en un bote comunitario de salsa y **no se moja dos veces**: hay repollo crudo gratis en la mesa para usar de cuchara si hace falta más salsa.


  Shinsekai es el barrio que Osaka construyó en 1912 imitando a París y Coney Island a la vez, se quedó congelado y hoy es lo más parecido que queda al Japón de posguerra. Con la torre Tsūtenkaku encendida encima, es una cena con más carácter que la de Dōtonbori.
