epithet: >-
  Los Maeda fueron el segundo clan más rico de Japón, justo detrás de los Tokugawa. Y en un país
  donde el shōgun eliminaba a quien pudiera hacerle sombra, eso era una sentencia. Su estrategia
  para sobrevivir dos siglos y medio fue asombrosa: **gastarse la fortuna en arte, jardines y
  artesanos** en vez de en armas, para parecer inofensivos. Kanazawa es lo que quedó.
sections:
  - heading: Un millón de kokus, y ninguna guerra
    body: |
      El dominio de **Kaga** producía más de **un millón de *koku*** de arroz —la unidad con la que
      se medía la riqueza feudal: un koku es lo que come una persona en un año—, y era el único que
      se acercaba a la casa Tokugawa. Cualquier señal de rearme habría significado el fin.

      Así que los Maeda hicieron lo contrario de rearmarse. Invitaron a maestros de la **ceremonia
      del té**, del **teatro nō**, de la **laca**, del **tinte** y del **oro batido**; montaron
      talleres, pagaron escuelas y convirtieron su capital en un centro cultural del que el shogunato
      no podía sospechar nada. Fue una **política exterior disfrazada de mecenazgo**, y funcionó
      durante catorce generaciones.

      El resultado se palpa: Kanazawa tiene todavía **el 99 % de la producción japonesa de pan de
      oro** —el que cubre el [Kinkaku-ji](#kinkakuji) y media Nikkō sale de aquí—, y una escena de
      artesanía viva que no se parece a la de ninguna otra ciudad de su tamaño. Se puede comprar
      helado cubierto de oro, que es una horterada estupenda y muy fotogénica.

      Y como [Kioto](#kioto), **no fue bombardeada en 1945**. Los barrios están enteros.
  - heading: Kenroku-en, y las cuerdas de noviembre
    body: |
      El [**Kenroku-en**](https://www.google.com/maps/search/?api=1&query=Kenrokuen%20Garden%20Kanazawa) es uno de los **Tres Grandes Jardines de Japón** —con el Kairaku-en de Mito y
      el Kōraku-en de Okayama—, y su nombre significa «el jardín de las seis cualidades»: según un
      tratado chino, un jardín perfecto debe reunir seis virtudes que se contradicen por parejas
      —amplitud y recogimiento, artificio y antigüedad, agua y panorama— y este las tiene las seis.
      Tardó **ciento setenta años** en construirse.

      Y las fechas del viaje caen de una manera afortunada. **A partir del 1 de noviembre**
      los jardineros empiezan a montar el ***yukitsuri***: postes altos junto a los pinos de los que
      cuelgan **decenas de cuerdas en abanico**, atadas una a una a las ramas, para que el peso de la
      nieve no las parta. Es un trabajo que dura hasta mediados de diciembre y que convierte el
      jardín en una escultura de conos de cuerda — la imagen más reconocible de Kanazawa. **En
      noviembre se ve montándose o ya montado.**

      Al lado está el **castillo**, del que quedan sobre todo las puertas y unos almacenes largos de
      teja blanca de plomo, y la **Gyokusen'inmaru**, un jardín pequeño con iluminación nocturna los
      fines de semana.
  - heading: Los tres barrios enteros
    body: |
      - [**Higashi Chaya**](https://www.google.com/maps/search/?api=1&query=Higashi%20Chaya%20District%20Kanazawa) — el barrio de casas de té, con celosías de madera rojiza y dos plantas,
        de lo mejor conservado del país. Se puede entrar en la **Shima**, una casa de té del siglo
        XIX intacta, y en la **Kaikarō**, con una escalera lacada en rojo y una sala **forrada de pan
        de oro**. Aquí sí quedan *geiko* en activo.
      - [**Nagamachi**](https://www.google.com/maps/search/?api=1&query=Nagamachi%20Samurai%20District%20Kanazawa) — el barrio de residencias de samuráis de rango medio, con callejones de tapias
        de barro que **en invierno se envuelven en esteras de paja** para protegerlas del hielo. Se
        visita la **casa Nomura** y su jardín diminuto.
      - [**Ōmichō**](https://www.google.com/maps/search/?api=1&query=Omicho%20Market%20Kanazawa) — el mercado, doscientos ochenta años, doscientos puestos. Kanazawa está en el mar
        del Japón y su marisco es serio: **cangrejo de las nieves** (la temporada abre justo el **6
        de noviembre**), gamba dulce, vieira, y los ***kaisendon***, cuencos de arroz cubiertos de
        sashimi, que se comen de pie en los puestos del fondo.

      Y una pieza que descoloca en medio de tanto Edo: el **Museo del Siglo XXI de Arte
      Contemporáneo**, un cilindro de cristal de **SANAA** —Sejima y Nishizawa, premio Pritzker— sin
      fachada principal ni parte de atrás, con la **piscina de Leandro Erlich** en la que se puede
      caminar por debajo del agua. Es gratuito por fuera y una de las mejores obras de arquitectura
      japonesa reciente.
  - heading: Cómo se llega, y cuánto pide
    body: |
      Desde **Tokio, 2 h 30** en el **Shinkansen Hokuriku**, que llega directo. Desde [Shirakawa-gō](#shirakawa-go),
      autobús de 1 h 15. Desde Kioto u [Osaka](#osaka), unas 2 h 15 por la línea de la costa.

      La estación merece la parada por sí misma: el *[**Tsuzumi-mon**](https://www.google.com/maps/search/?api=1&query=Tsuzumi-mon%20Gate%20Kanazawa%20Station)*, una puerta de madera de trece
      metros con forma de **tambor de teatro nō**, bajo una cúpula de cristal y aluminio. Es de 2005
      y aparece en todas las listas de estaciones más bonitas del mundo — otra vez la misma idea, la
      ciudad presentándose por su artesanía.

      **Un día completo** cubre el jardín y los tres barrios sin agobio; **dos** permiten meter el
      museo y comer con calma en [Ōmichō](https://www.google.com/maps/search/?api=1&query=Omicho%20Market%20Kanazawa).
curiosidades:
  - >-
    Los **Maeda** eran el segundo clan más rico de Japón y sobrevivieron a los Tokugawa
    **gastándose la fortuna en artesanos y jardines en lugar de en armas**, para no parecer una
    amenaza. Kanazawa entera es el resultado de esa estrategia.
  - >-
    De aquí sale el **99 % del pan de oro de Japón** — el del Kinkaku-ji, el de [Nikkō](#nikko) y el de los
    altares budistas de todo el país.
  - >-
    **A partir del 1 de noviembre** el [Kenroku-en](https://www.google.com/maps/search/?api=1&query=Kenrokuen%20Garden%20Kanazawa) se llena de ***yukitsuri***: conos de cuerdas
    atadas rama a rama para que la nieve no parta los pinos. Es la estampa de la ciudad y solo existe
    en invierno.
