      - nombre: "Kyū-Furukawa"
        maps: "Kyu-Furukawa Gardens Tokyo"
        nota: "Jardín japonés con arces bajo una mansión con rosaleda, que en noviembre aún tiene rosas. ¥150."
    comer:
