body: >-
  Confitería de **1726** en pleno Gion, con la tienda delante y una sala de té detrás que da a un jardín diminuto. El ***kuzukiri*** que sirven es casi una demostración de física: fideos translúcidos de almidón de kudzu, cortados a cuchillo, que llegan en un cuenco lacado con hielo y **pierden la textura en veinte minutos** — por eso no se puede llevar.


  Es de las cosas de Kioto que no existen en ningún otro sitio y que casi nadie que no sea japonés pide. Va con [matcha](#wagashi) espeso.
