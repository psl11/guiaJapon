title: Harajuku, donde la calle más gritona da a la avenida más seria
epithet: >-
  Aquí pasa algo que no ocurre en ninguna otra ciudad: la calle donde los adolescentes japoneses
  inventan la moda del año que viene y la avenida donde media docena de premios Pritzker se han
  construido una tienda están **a doscientos metros la una de la otra**. Y las dos se recorren
  mirando, no comprando.
sections:
  - heading: Takeshita-dōri, y por qué el domingo
    body: |
      Trescientos cincuenta metros de calle peatonal estrecha saliendo de la salida norte de la
      estación, saturada de tiendas de ropa, crepes, algodón de azúcar y *idol shops*. Un martes por
      la tarde es una calle comercial cualquiera; **un domingo es el fenómeno**.

      El sitio exacto donde mirar es el [**Jingū-bashi**](https://www.google.com/maps/search/?api=1&query=Jingubashi%20Harajuku%20Tokyo), el puentecito entre la estación y la entrada
      del santuario: ahí se concentran los disfraces, y tienen género con nombre propio —
      ***cosplay*** (personaje de anime o videojuego), ***Gothic Lolita*** (gótico y muñeca a la vez,
      con sus propias subfamilias), ***Visual Kei*** (maquillaje y pelo de banda de rock),
      ***Decora*** (color y cien accesorios encima). Cada año nacen más.

      La norma, que aquí importa: **se pide permiso antes de fotografiar**. Van vestidos para que se
      les vea, no para que se les persiga.
  - heading: Omotesandō, el catálogo de arquitectura
    body: |
      La avenida se trazó en los años veinte como **camino de acceso a [Meiji Jingū](#meiji-jingu)** —de
      ahí el nombre, «el acceso principal»— y está arbolada con ginkgos que amarillean a finales de
      noviembre. Hoy es donde las firmas de lujo se construyen edificios en vez de escaparates, y se
      recorre mirando hacia arriba:

      - **Prada Aoyama**, de **Herzog & de Meuron**: una retícula de rombos de cristal, unos planos y
        otros abombados, que deforma lo que se ve dentro y fuera.
      - **Tōkyū Plaza Omotesandō**, de **Hiroshi Nakamura**: la entrada es un embudo de espejos que
        multiplica a quien sube por la escalera mecánica. En la azotea hay un jardín público y gratis.
      - **Dior Omotesandō**, de **SANAA**, con una fachada de acrílico ondulado que parece tela.
      - Y el **Omotesandō Hills** de **Tadao Andō**, que en vez de plantas tiene **una rampa continua
        en espiral** con la misma pendiente que la calle de fuera.
  - heading: Y en medio, lo tranquilo
    body: |
      - [**Cat Street**](https://www.google.com/maps/search/?api=1&query=Cat%20Street%20Harajuku%20Tokyo) — el pasadizo curvo y peatonal que baja hacia [Shibuya](#shibuya) entre tiendas
        pequeñas y cafés. Sus curvas son las del **río Shibuya**, entubado justo debajo.
      - **Ura-Harajuku** — «el Harajuku de detrás»: el enjambre de callejuelas al norte de [Omotesandō](https://www.google.com/maps/search/?api=1&query=Omotesando%20Tokyo)
        donde están las marcas pequeñas y donde nació el *streetwear* japonés de los noventa.
      - **Yoyogi-kōen** — el parque grande, que fue **villa olímpica en 1964** y antes barrio de
        oficiales estadounidenses. Los domingos se llena de bandas de rockabilly con tupé bailando
        junto a la entrada, que llevan haciéndolo cuarenta años.
  - heading: Lo que no sale en las listas
    body: |
      - **Museo Ōta de arte ukiyo-e** — dos salas pequeñas dedicadas **solo a grabados**, con
        exposición rotatoria cada mes y una colección de doce mil estampas. Se ve en cuarenta minutos,
        hay que descalzarse, y es donde se entiende de dónde salió media pintura europea del XIX. A
        cien metros de [Takeshita-dōri](https://www.google.com/maps/search/?api=1&query=Takeshita%20Street%20Harajuku%20Tokyo) y no entra nadie.
      - [**Museo Nezu**](https://www.google.com/maps/search/?api=1&query=Nezu%20Museum%20Tokyo) — un edificio de **Kengo Kuma** con un alero larguísimo de bambú, arte asiático
        dentro y, detrás, **un jardín con estanque y casas de té** que no parece Tokio. Cierra los
        lunes.
      - **Design Festa Gallery** — un edificio cubierto de tuberías rojas donde cualquiera puede
        alquilar una sala por días. Lo que cuelga cambia cada semana y va de lo genial a lo
        infumable. Gratis.
      - [**Gimnasio Nacional de Yoyogi**](https://www.google.com/maps/search/?api=1&query=Yoyogi%20National%20Gymnasium%20Tokyo) — la obra maestra de **Kenzō Tange** para 1964, con la cubierta
        **suspendida como un puente colgante**. Se ve por fuera y es de los edificios más importantes
        del siglo XX japonés. Ver el [acto 6](#acto-6-ceniza-y-milagro).
curiosidades:
  - >-
    **Omotesandō significa «el acceso principal»**: se trazó en los años veinte como avenida de
    entrada a Meiji Jingū. Que hoy sea la calle de las tiendas de lujo es una casualidad histórica.
  - >-
    **Cat Street sigue el cauce de un río**. El Shibuya-gawa corre entubado justo debajo, y la calle
    heredó exactamente sus curvas — media Tokio está construida así, sobre agua tapada.
  - >-
    Los domingos, junto a la entrada de Yoyogi-kōen, bailan **bandas de rockabilly con tupé** que
    llevan cuarenta años haciendo lo mismo en el mismo sitio.
