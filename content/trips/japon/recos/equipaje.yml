title: Noviembre son dos climas en un viaje
area: Antes de volar
note: "Capas · y algo de verdad para la montaña"
body: >-
  Este viaje pasa de una ciudad templada a un valle de alta montaña en cuarenta y ocho horas, y hay
  que ir preparado para las dos cosas.


  **Tokio en noviembre** es agradable: entre **10 y 17 °C**, días secos y soleados, y **el sol se pone
  a las 16:40** — se anochece pronto y refresca de golpe. Con capas y una chaqueta cortavientos se
  cubre todo. Se anda muchísimo: el calzado es la decisión importante.


  **Kamikōchi es otra cosa**: **5-10 °C de día, bajo cero de noche**, escarcha al amanecer y
  posibilidad de nieve. Ahí hacen falta **capa térmica, plumas o forro grueso, gorro y guantes** —
  y los guantes no son un detalle si se quiere manejar la cámara al amanecer.


  Dos apuntes más: en los templos y en los ryokan **se descalza uno constantemente**, así que
  calcetines decentes y zapatos fáciles de quitar; y conviene dejar **hueco en la maleta**, porque de
  Kappabashi y del depachika se vuelve cargado.
