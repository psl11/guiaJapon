slug: dia-14-nara
navLabel: "Día 14 · Nara"
trip: japon
order: 14
eyebrow: El plan · Día 14 · jue 19 nov
title: Nara, la capital *anterior*
dek: >-
  Cuarenta y cinco minutos al sur y ciento cincuenta años atrás. Un buda de bronce de quince metros
  dentro de uno de los edificios de madera más grandes del mundo, y mil doscientos ciervos sueltos
  que llevan trece siglos siendo mensajeros de los dioses.
blocks:
  - block: Mañana
    time: "08:00–10:00"
    title: Bajar antes que los autobuses
    body: >-
      Cuarenta y cinco minutos desde Kioto por la línea JR Nara, y conviene coger uno temprano. El
      parque abre a todas horas —no tiene puertas— pero el **Tōdai-ji abre a las 7:30** y las dos
      primeras horas son otro sitio: los autobuses de día llegan a media mañana desde Kioto y desde
      Osaka, y a partir de ahí el Gran Buda se ve por encima de doscientas cabezas.
    window:
      label: Ventana óptima
      body: >-
        La misma regla que en todo el viaje, y aquí más: **entre las ocho y las diez el parque es de
        los ciervos**. Además, en noviembre los arces del **Nara-kōen** y del jardín Isuien están en
        su punto —Nara va con el mismo calendario que Kioto— y a esa hora hay niebla baja entre los
        troncos.
  - block: Mediodía
    time: "10:00–13:00"
    title: El buda que casi arruina al país
    body: >-
      El **Daibutsu del Tōdai-ji** son quince metros de bronce fundidos en el **752**, y su historia
      es de contabilidad: consumió buena parte del cobre disponible en Japón y estuvo cerca de dejar
      al Estado sin metal. El emperador Shōmu lo encargó como respuesta a una epidemia de viruela y a
      una serie de rebeliones — un buda como política sanitaria. Ver [Nara](#nara).

      El edificio que lo guarda, el *Daibutsuden*, es una reconstrucción del siglo XVIII **a dos
      tercios del tamaño original** y aun así sigue siendo uno de los edificios de madera más grandes
      del planeta. Conviene saberlo al entrar: lo que impresiona es la copia pequeña.

      Y de camino, el **Kasuga Taisha** y sus tres mil linternas —de piedra por el bosque, de bronce
      colgando de los aleros—, donadas una a una por fieles durante ochocientos años.
  - block: Tarde
    time: "13:00–16:30"
    title: Los ciervos, que no son mascotas
    body: >-
      Hay unos **mil doscientos sueltos** y no son una atracción municipal: son **animales salvajes
      protegidos** desde que la tradición hizo del ciervo el mensajero del kami Takemikazuchi, que
      según la leyenda llegó a Nara montado en uno blanco. Durante siglos matar uno se castigó con la
      muerte.

      Lo que sí es cierto y sorprende: **se inclinan para pedir galletas**. No es folclore ni un
      truco de guía, es un comportamiento aprendido de generación en generación con los *shika
      senbei* que se venden en los puestos. Y el aviso correspondiente: en cuanto ven el paquete
      pierden los modales, así que se compran las galletas cuando ya se van a dar, no antes.
  - block: Noche
    time: "noche"
    title: Vuelta a Kioto, y la última noche
    body: >-
      Se vuelve con luz de tarde y queda la última noche en Kioto, que es el momento de gastar el
      *raitoappu* si no se ha usado antes: los templos iluminados de finales de noviembre son
      exactamente lo que se viene a ver en estas fechas y mañana ya se sale hacia el oeste.

      Y si el cuerpo pide algo más corto, [**Pontochō**](https://www.google.com/maps/search/?api=1&query=Pontocho%20Alley%20Kyoto):
      un callejón de un metro y medio de ancho junto al río, con farolillos y barras de seis
      taburetes. Es la imagen que la gente tiene de Kioto de noche, y por una vez la imagen es cierta.
alt:
  label: Si te desmarcas
  body: >-
    Si Nara sale por descarte —hay quien prefiere no ver otro templo—, este es el día para **el
    tercer Kioto**, el que no cabe en los dos anteriores: el **Nanzen-ji** y su acueducto de ladrillo
    de la era Meiji cruzando el recinto, el **Sanjūsangendō** con sus **mil una estatuas de Kannon**
    alineadas en una sala de ciento veinte metros, o el **Fushimi Inari por arriba**, subiendo el
    monte entero hasta donde se acaban las visitas y empiezan los altares pequeños.

    Y una alternativa que no es un templo: **Uji**, a veinte minutos, de donde sale el mejor té verde
    del país y donde está el **Byōdō-in**, el pabellón del Fénix — el edificio que sale en la moneda
    de diez yenes y uno de los pocos que sobrevivió entero desde el siglo XI.
