  label: Comparativa de rutas
body: >-
  Para ir de Kioto a Osaka hay dos trenes y la diferencia de tiempo no compensa la de precio. El
  **Special Rapid de la línea JR Kioto** tarda veintiocho minutos y cuesta **580 yenes**; el
  Shinkansen tarda entre trece y quince y cuesta **1.450** sin reservar. Son trece minutos a cambio
  de ochocientos setenta yenes, y además el Shinkansen deja en Shin-Ōsaka, no en Osaka, así que hay
  que transbordar de todos modos.


  Con cuatro personas y un viaje de ida y vuelta el mismo día, la diferencia son casi siete mil
  yenes. Es de los pocos ahorros de este viaje que no cuestan nada: el tren normal sale cada pocos
  minutos y no necesita reserva.


  El vídeo propone además el *Kyo-train Garaku* de Hankyu, un tren temático con vagones por
  estaciones y jardín zen dentro, por 410 yenes. Es cierto y es bonito, pero **solo circula fines de
  semana y festivos**, y el día de Osaka es jueves. No se puede coger.
