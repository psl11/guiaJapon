body: >-
  **Abierta en 1905** y considerada la izakaya más antigua de la ciudad, en un edificio de madera que se libró del terremoto y de las bombas. No hay carta en inglés, no hay concesiones y no falta nada: se pide señalando, se bebe sake caliente y se cena en mesas compartidas con oficinistas de Kanda que llevan viniendo veinte años.


  Para vosotros tiene una ventaja tonta y enorme: **está a una parada del hotel**. Es el sitio al que ir la noche que no queráis pensar, y es exactamente lo que la gente busca cuando dice «un izakaya de verdad».
