body: >-
  Napolitana hecha con técnica italiana y despensa japonesa. La casa abrió en 2022 en
  [Ebisu](#ebisu-meguro) y su pizza insignia lleva base de crema de shiitake y, encima, virutas de
  bonito, kombu y soja: los tres pilares del *dashi* puestos sobre una masa fermentada veinticuatro
  horas y cocida en un horno de leña hecho a medida por un alfarero de hornos.


  El cocinero, Yuki Motokura, se formó en Savoy y **entró en la lista de los diez mejores pizzeros
  del mundo en 2023**. Abre todos los días en dos turnos, de 11:30 a 15:00 y de 17:00 a 23:00, y está
  a tres minutos de la estación de Ebisu, o sea a un salto de la tanda de noches de Roppongi.


  Reservar cuesta: se llena con meses. La rendija es la barra, que a veces cae llegando pronto a la
  comida o al final del servicio.
