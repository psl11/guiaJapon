blocks:
  - block: Mañana
    time: "08:30"
    title: Meiji Jingū al abrir
    body: >-
      El santuario **abre al amanecer y cierra al atardecer**: sigue al sol. Entrar con los primeros es
      cruzar el **torii de ciprés** de doce metros y recorrer un kilómetro de grava bajo un bosque
      plantado a mano en los años veinte, hasta un patio donde a esa hora solo hay sacerdotes
      barriendo. Es el sitio más silencioso del centro de Tokio, y solo lo es una hora al día.
    window:
      label: El mejor día del año para estar aquí, y es casualidad
      body: >-
        **El 15 de noviembre se celebra el *shichi-go-san***, el rito en que los niños de siete, cinco
        y tres años van al santuario vestidos de gala, y Meiji Jingū es *el* sitio donde se hace en
        Tokio. Las familias no esperan al día exacto: van durante todo noviembre, y hoy, viernes 13,
        es el arranque del fin de semana grande. Habrá críos de tres años con kimono y cara de
        circunstancias, y familias con fotógrafo contratado. El sábado los tres que siguen verán la
        versión de Kamakura, y el domingo la de barrio.


        Con suerte, además, **una boda sintoísta**: una novia de *shiromuku* blanco bajo un parasol
        rojo cruzando el patio. Son sobre todo de fin de semana, pero las hay entre semana. Nada de
        esto se reserva: solo estar allí.


        Y en el camino de entrada, la exposición de crisantemos que el santuario monta desde 1926 para
        su gran fiesta, la del 3 de noviembre, cumpleaños del emperador Meiji. En 2024 fue del 25 de
        octubre al 23 de noviembre; si se repite, hoy está en su sitio.
    ver:
      - ficha: meiji-jingu
        nota: El bosque diseñado a ciento cincuenta años vista para parecer primario.
      - nombre: Meiji Jingū Gyoen
        maps: Meiji Jingu Gyoen Tokyo
        nota: El jardín de pago dentro del recinto. En noviembre no va casi nadie.
        lat: 35.6739613
        lon: 139.7004851
  - block: Mañana
    time: "10:00–13:00"
    title: Harajuku, Omotesandō y las dos aceras
    body: >-
      Se sale del bosque y a doscientos metros está Takeshita-dōri, la calle de la moda adolescente:
      estrecha, gritona, imposible a cualquier hora, y verla así es justamente el punto. El antídoto está a la
      vuelta: Omotesandō, la avenida donde media docena de arquitectos con Pritzker se han construido
      una tienda, y que se recorre mirando fachadas, no escaparates. Doscientos metros separan la
      cultura pop más ruidosa del país de su arquitectura más seria.


      Entre el bosque y el gentío queda el **parque Yoyogi**, villa olímpica de 1964, con el gimnasio
      de Kenzō Tange en su borde. Comer cae aquí: los cuatro de abajo los trajo Alba y están en el
      mismo kilómetro. La forma sensata de elegir es mirar las colas. Comed hacia las 12:30: a las
      14:00 hay que salir hacia Shibuya Sky.
    window:
      label: Dónde mirar, y qué esperar en viernes
      body: >-
        Harajuku en fin de semana **es otra cosa**: es cuando la gente se viste para venir, y se
        concentran en el Jingū-bashi. Hoy es viernes, así que habrá bastante menos que en sábado. Cada estilo tiene nombre propio y se distingue a la vista; los
        cuatro que vais a ver están en la ficha.


        Una norma, no un dato: **se pide permiso antes de fotografiar**. Van vestidos para que se les
        vea, no para que se les persiga.
    ver:
      - ficha: harajuku
        nota: Los cuatro estilos del Jingū-bashi y el catálogo de edificios de Omotesandō.
      - nombre: Jingū-bashi
        maps: Jingubashi Harajuku Tokyo
        nota: El puentecito entre la estación y el santuario, donde se concentran los disfraces.
        lat: 35.6697179
        lon: 139.7024123
      - nombre: Takeshita-dōri
        maps: Takeshita Street Harajuku Tokyo
        nota: Trescientos cincuenta metros de crepes, disfraces e *idol shops*.
        lat: 35.6711612
        lon: 139.7049553
      - nombre: Omotesandō
        maps: Omotesando Tokyo
        nota: Prada de Herzog & de Meuron, Dior de SANAA y la rampa en espiral de Andō.
        lat: 35.6672683
        lon: 139.7079259
      - nombre: Gimnasio Nacional de Yoyogi
        maps: Yoyogi National Gymnasium Tokyo
        nota: La cubierta colgante de Tange para 1964. Se ve por fuera, y está de camino.
        lat: 35.6670580
        lon: 139.6997785
    comer:
      - comida: henrys-burger-harajuku
        elegido: true
        nota: Wagyu A5 aplastado a la plancha, sin reserva. Abre todos los días de once a ocho.
      - comida: menchirashi-harajuku
        nota: El udon a la carbonara, a ciento cincuenta metros. Cola casi siempre.
      - comida: udonya-shimbori
        nota: "Udon de Fukuoka y Sanuki. Abre a mediodía y por la noche, y **solo efectivo**."
      - comida: yamacho-harajuku
        nota: Udon hirviendo en cazuela de barro, por mil yenes. Solo mediodía; el domingo cierra.
  - block: Tarde
    time: "14:00–18:00"
    title: La ciudad desde arriba, y el cruce
    body: >-
      Se baja a Shibuya por **Cat Street**, un pasadizo peatonal y curvo que evita las avenidas: veinte
      minutos entre tiendas pequeñas, y sus curvas son las del río Shibuya, entubado justo debajo. A
      las 14:35 se sube a Shibuya Sky, con la ciudad a 360 grados y, si el aire está limpio, el Fuji
      al oeste. Se baja ya de noche al cruce donde tres mil personas atraviesan a la vez sin rozarse,
      con las pantallas encendidas, y a la estatua de Hachikō. Verlo desde arriba antes lo explica.
      Luego, BRAND OFF, la tienda de bolsos de segunda mano de la Center Gai, que abre hasta las nueve.
    window:
      label: Comprado
      body: >-
        **Entrada a Shibuya Sky de 14:35 a 14:50 y sofá de THE ROOF de 15:00 a 15:50**, los cuatro,
        con el *Standard Set*: dos copas y algo de picar por cabeza, ¥28.000 en total. Se compró el 29
        de octubre a las 16:00 de España, en cuanto abrió la venta, y aun así el turno de las 16:00 se
        agotó en pocos minutos. Los recomienda Pablo, que los probó en noviembre de 2023.


        **La entrada vale para toda la tarde**: al acabar el sofá no os echan. Quedaos arriba de pie
        para la puesta de sol, hacia las 16:35, y el encendido de la ciudad. El aire de noviembre es
        el más transparente del año.


        Se entra en la planta 14 con el QR de cada uno, que lleva su nombre y puede pedirse el
        pasaporte. A las 15:00, a la barra de la azotea con el correo de la reserva. Se cancela desde
        «Mi página» de Webket hasta el jueves 12, y si cierran la azotea por mal tiempo, también ese
        día.
