body: >-
  Un ***kissaten*** de **1938** en una casa de madera de dos plantas que sobrevivió a lo que no sobrevivió casi nada de esta ciudad. Cerró en 2006 al morir la dueña y **el barrio se organizó para reabrirlo**: hoy lo lleva una fundación de conservación del patrimonio de Yanaka. Se conservó el mostrador, los taburetes y la escalera imposible que sube al tatami de arriba.


  El *kissaten* es el antepasado del café de especialidad japonés y su lógica es la contraria: aquí el café no es el objeto de estudio, es la excusa para sentarse una hora. Pedid arriba, en el suelo, si hay sitio.
