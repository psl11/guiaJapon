title: Takayama, el pueblo que pagó *en carpinteros*
dek: >-
  Se empieza en el agua y se termina en un pueblo de montaña: baño de amanecer en
  [Hirayu](#kamikochi-en-el-dia), una hora de autobús y tres calles de casas de madera negra
  intactas, con la mejor historia fiscal de Japón detrás. Por la tarde, el pueblo de *Your Name*, a
  quince minutos en tren. Y por la noche, Takayama vacío.
