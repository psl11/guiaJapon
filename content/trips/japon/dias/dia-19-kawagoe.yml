title: La pequeña Edo, y *la única habitación* que queda del castillo
dek: >-
  Una hora al norte de Ginza, sin madrugar y sin reservas: la calle de almacenes de barro negro de
  Kawagoe, un templo que guarda salas del castillo de Edo y un túnel de tablillas de los deseos.
  Ocupa el sitio de Nikkō, que se canceló dos días antes por cansancio y por ganas de algo más
  tranquilo.
