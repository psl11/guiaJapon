quePedir: "El **Shiromaru**, el caldo blanco de siempre, o el **Akamaru**, con su bola de miso especiado y aceite de ajo. Y los fideos duros, *katamen*."
body: >-
  Ippudo abrió en 1985 en Fukuoka, la ciudad del *tonkotsu*, el caldo de hueso de cerdo hervido
  hasta quedar blanco y espeso, y hoy tiene locales por todo Japón y medio mundo. Es el ramen de
  cadena que no falla: el mismo cuenco en todas partes, fideos finos al punto que se pida y
  *kaedama*, una segunda ración de fideos para el caldo que sobra, a la manera de Hakata.


  Es **el de siempre de Pablo**, que no pasa por la estación de Kioto sin parar aquí. Está en Porta,
  bajo la plaza de la estación, nada más salir por el lado de Karasuma, así que sirve para comer al
  bajar del Shinkansen sin buscar nada. En Tokio, el suyo es [el de Ginza](#ippudo-ginza).
