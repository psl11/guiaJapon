body: >-
  Una tortilla hecha con cinco huevos, cremosa por dentro, entre dos rebanadas de pan integral
  tostado con gouda y mayonesa de la casa. Está en Zushi, a dos minutos de la estación de
  Zushi-Hayama y a trece minutos en tren de [Kamakura](#kamakura-zen), o sea razonablemente cerca del
  día 9.


  Durante meses esta ficha explicaba por qué no se iba: **cierra lunes y viernes**, y Kamakura caía
  en viernes. En octubre de 2026 Kamakura pasó al sábado 14 y el sitio se volvió viable. Solo abre de
  once a tres, así que es una comida y no una cena, y obliga a salir de Kamakura y volver: una parada
  de JR hasta Zushi y unos minutos andando.
