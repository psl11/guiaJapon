title: Los vuelos, ida y vuelta
area: Barcelona ⇄ Tokio
status: pendiente
note: "Ida 6 nov con el grupo · vuelta la noche del 13"
body: >-
  **La ida** es sencilla: llegar a Tokio el **6 de noviembre** a tiempo del check-in con el grupo. La
  vuelta tiene una condición dura —**estar en Barcelona el 14**, a poder ser a mediodía— y una
  solución elegante.


  Las salidas de Tokio hacia Barcelona se concentran **entre las 21:00 y medianoche** y tardan unas
  veintiuna horas con una escala (Turkish vía Estambul, Qatar vía Doha). Con las **ocho horas** que
  se ganan de huso, un vuelo nocturno del **13** aterriza **la mañana del 14**. Es decir: se puede
  amanecer en Kamikōchi, bajar del valle y volar esa misma noche **sin perder el día 13**.


  Y una advertencia: **noviembre es temporada alta de kōyō**. Cuanto antes, mejor precio.
