slug: dia-12-kioto-oeste
navLabel: "Día 12 · Kioto oeste"
trip: japon
order: 12
eyebrow: El plan · Día 12 · mar 17 nov
title: El bambú al amanecer, y *el pabellón dorado*
dek: >-
  Los dos extremos de [Kioto](#kioto) en un día, y los dos con el mismo problema: son las cosas más
  fotografiadas del país. La diferencia entre un buen recuerdo y una decepción está entera en la
  hora a la que se llega.
blocks:
  - block: Amanecer
    time: "07:00–09:00"
    title: El bambusal, cuando se oye
    body: >-
      Quince minutos de tren desde la estación de Kioto hasta Saga-Arashiyama, y hay que estar aquí
      **con la primera luz**. Cuatrocientos metros de camino entre cañas de veinte metros.

      El consejo es raro y es el bueno: **parad y callaos un minuto**. Lo que está protegido aquí
      oficialmente no es la vista, es el sonido —y a las diez de la mañana no se oye nada porque hay
      mil personas hablando. Ver [Arashiyama](#arashiyama).
    window:
      label: Ventana óptima
      body: >-
        **A las siete se camina solo; a las diez es una estación de metro en hora punta.** No hay
        término medio, y por eso este día empieza antes que ningún otro de Kioto.
  - block: Mañana
    time: "09:00–12:00"
    title: Tenryū-ji, la villa vacía y el río
    body: >-
      **Tenryū-ji abre a las 8:30** y tiene una puerta trasera que da directamente al bambusal, así
      que el truco es hacerlo al revés que todo el mundo: **primero el jardín, y se sale por detrás
      al bosque** antes de que lleguen los autobuses.

      Al lado, [**Ōkōchi Sansō**](https://www.google.com/maps/search/?api=1&query=Okochi%20Sanso%20Villa%20Kyoto):
      la entrada incluye **té y dulce** y sirve para lo que aquí hace falta: sentarse. Ver
      [Arashiyama](#arashiyama). Después, el puente Togetsukyō. Lo que
      son y de dónde vienen, en [Arashiyama](#arashiyama).

      **Y aquí hay una decisión que tomar, y es la razón por la que este día es martes y no
      miércoles.** Donde termina la villa arranca **Saga-Toriimoto**, una calle conservada que sube
      hacia el monte Atago y que en veinticinco minutos andando lleva a dos templos que no se parecen
      a nada: el [**Adashino Nenbutsu-ji**](#alba-adashino-nenbutsuji), con ocho mil budas de piedra
      puestos por los viajeros que morían en el camino, y el
      [**Otagi Nenbutsu-ji**](#alba-otagi-nenbutsuji), con mil doscientas figuras de los discípulos
      del Buda talladas por aficionados de todo el país en los años ochenta —una con raqueta de
      tenis, otra con cámara de fotos—. De paso quedan el Giō-ji y el Jōjakkō-ji.

      Cuesta unas dos horas con la subida, y en noviembre **el sol se pone a las 16:40**. Quien suba
      llega al noroeste con tiempo para el pabellón dorado y el Ryōan-ji, pero no para los tres:
      **el Ninna-ji es lo que se paga**. Los dos templos cierran los miércoles, así que esta puerta
      solo existe hoy.

      Y para comer antes de cruzar la ciudad, [**Itsukichaya**](#itsukichaya-arashiyama) está en la
      isla que queda entre los dos brazos del río, con el Togetsukyō delante. **Es solo con reserva
      por internet**, y las mesas al agua se agotan con meses, así que o se decide ahora o no hay.
  - block: Mediodía
    time: "12:00–14:30"
    title: Cruzar la ciudad al noroeste
    body: >-
      Kioto tiene el transporte como punto flaco —**el metro son dos líneas en cruz** y casi todo va
      en autobús urbano, que en temporada va lleno—. Este traslado es el peor del día: conviene
      hacerlo comiendo, o coger un taxi entre cuatro, que sale a cuenta.
  - block: Tarde
    time: "14:30–17:00"
    title: El sendero de la capa de seda
    body: >-
      Tres templos en una línea, y los tres del mismo tirón:

      - El **pabellón dorado**. El que se ve es de 1955: el original lo quemó un monje en 1950, y de
      aquello sacó Mishima *El pabellón de oro*.
      - El [**Ryōan-ji**](https://www.google.com/maps/search/?api=1&query=Ryoanji%20Kyoto) y sus quince
      rocas, de las que **nunca se ven las quince a la vez**.
      - El [**Ninna-ji**](https://www.google.com/maps/search/?api=1&query=Ninnaji%20Kyoto), del año 888,
      con su palacio imperial y su pagoda. Aquí ya no queda nadie.
    window:
      label: Ventana óptima
      body: >-
        El pabellón mira al este, así que **la luz buena es la de la mañana**; por la tarde va a
        contraluz. A cambio, a las cuatro de la tarde hay la mitad de gente. Si la foto importa más
        que la calma, hay que invertir el día entero y empezar por aquí.
  - block: Noche
    time: "noche"
    title: Pontochō
    body: >-
      De vuelta al centro, **Pontochō** es un callejón de cuatrocientos metros paralelo al río Kamo,
      ancho como un pasillo, con farolillos y restaurantes a los dos lados — muchos con terraza
      volada sobre el agua en verano. Es turístico y sigue siendo bonito. Y a dos calles está
      [**Nishiki**](https://www.google.com/maps/search/?api=1&query=Nishiki%20Market%20Kyoto) de noche, con los puestos cerrados y las persianas pintadas.
alt:
  label: Si te desmarcas
  body: >-
    Arashiyama tiene tres desvíos que casi nadie hace:

    - [**Iwatayama**](https://www.google.com/maps/search/?api=1&query=Iwatayama%20Monkey%20Park%20Kyoto),
    el parque de macacos de lo alto de la colina. **Las jaulas son para las personas.** Y desde
    arriba se ve Kioto entero.
    - [**Saga-Toriimoto**](https://www.google.com/maps/search/?api=1&query=Saga%20Toriimoto%20Kyoto),
    un distrito histórico protegido que se sube desde el bambusal. Acaba en el
    [**Adashino Nenbutsu-ji**](https://www.google.com/maps/search/?api=1&query=Adashino%20Nenbutsuji%20Kyoto)
    y sus **ocho mil estatuillas** de piedra, recogidas de tumbas sin nombre.
    - El [**Kimono Forest**](https://www.google.com/maps/search/?api=1&query=Kimono%20Forest%20Arashiyama)
    de la estación del tranvía Randen: seiscientos cilindros con estampados de kimono, iluminados
    por dentro al anochecer.