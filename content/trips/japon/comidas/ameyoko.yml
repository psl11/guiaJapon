quePedir: >-
  Ir de pie y picar: brochetas, ostras abiertas al momento, fruta cortada, y una cerveza de la máquina.
body: >-
  Cuatrocientos metros de puestos apiñados **bajo las vías de la Yamanote**, herencia directa del mercado negro que se montó aquí después de la guerra — el nombre viene de *ameya*, «tienda de caramelos», que era lo que se vendía cuando no había otra cosa. Sigue siendo el sitio de Tokio donde más se grita.


  A partir de las cinco, cuando ya es de noche, media calle se convierte en **barras al aire libre**: cajas de plástico por asiento, plancha, y gente saliendo del trabajo. Es el cierre natural del día 2 y está a dos paradas del hotel.
