blocks:
  - block: Mañana
    time: "10:00–12:00"
    title: Los dos monasterios, en día laborable
    body: >-
      Engaku-ji a la salida de la estación y Kenchō-ji quince minutos más abajo, como harán los otros
      tres. La diferencia de venir un miércoles es que hay pocos visitantes, y se recorren a tu ritmo
      y sin grupos de excursión delante.
    window:
      label: Los tesoros, por dos días
      body: >-
        Una vez al año, alrededor del Día de la Cultura, los dos templos airean sus tesoros
        (*hōmotsu kazeire*) y Engaku-ji enseña el Shariden, el único edificio de Kamakura que es Tesoro
        Nacional. En 2026, según las webs de turismo de Kamakura, es **del 31 de octubre al 2 de
        noviembre**: llegas dos días tarde. Los templos aún no lo han confirmado, así que si cambiara
        de fechas, vale la pena mirarlo.
    ver:
      - ficha: kamakura-zen
        nota: La historia de los dos monasterios, para leerla en el tren.
      - nombre: Engaku-ji
        maps: Engakuji Temple Kamakura
        nota: Fundado en 1282 por los caídos de las dos invasiones mongolas, de los dos bandos.
        lat: 35.3379364
        lon: 139.5478197
      - nombre: Kenchō-ji
        maps: Kenchoji Temple Kamakura
        nota: El dragón pintado en el techo de la sala del Dharma, y el jardín de detrás.
        lat: 35.3324455
        lon: 139.5575336
  - block: Mediodía
    time: "12:00–14:00"
    title: El Hachimangū, y luego hacia donde no va nadie
    body: >-
      Pasa por el Hachimangū y por Komachi-dōri a comer de pie, como el grupo. Después, en vez de ir
      directo al Buda, desvíate media hora andando hacia el este: Hōkoku-ji, el templo del bambú.
      **Dos mil cañas** detrás del templo y una casa de té donde se toma matcha sentado, mirándolas.
      Es el sitio de Kamakura que más cambia entre un sábado y un miércoles, y por eso es tuyo y no
      del grupo.
    ver:
      - nombre: Tsurugaoka Hachimangū
        maps: Tsurugaoka Hachimangu Kamakura
        nota: El santuario de los Minamoto, de paso hacia el este.
        lat: 35.3251836
        lon: 139.5561787
      - nombre: Hōkoku-ji
        maps: Hokokuji Kamakura
        nota: El bosque de bambú con casa de té. Para volver a la estación, autobús desde Jōmyōji.
        lat: 35.3195248
        lon: 139.5689009
    comer:
      - comida: komachi-dori
        nota: La calle de comer de pie, entre el santuario y la estación. Entre semana se anda.
      - comida: aratama-katsutei
        nota: "Si prefieres sentarte: tonkatsu al pie de Komachi-dōri, abierto todo el día."
  - block: Tarde
    time: "14:30–16:15"
    title: El Buda y la terraza sobre la bahía
    body: >-
      De vuelta a la estación de Kamakura, el Enoden hasta Hase: el Daibutsu primero y Hasedera
      después, para que su terraza te pille con el sol bajando.
    ver:
      - ficha: daibutsu-kamakura
        nota: Once metros y medio de bronce al aire libre. Se entra dentro por unos pocos yenes.
      - nombre: Hasedera
        maps: Hasedera Temple Kamakura
        nota: El Kannon de madera de nueve metros y la bahía de Sagami enfrente.
        lat: 35.3122687
        lon: 139.5333092
  - block: Atardecer
    time: "16:15–17:30"
    title: El mar, y la primera noche en Akihabara
    body: >-
      Tres paradas más de Enoden hasta Kamakura-kōkōmae, el paso a nivel frente al mar, para ver
      ponerse el sol detrás de Enoshima. Después, vuelta a Akihabara, primera noche en el
      [Super Hotel Premier](#super-hotel-premier-akihabara) y su onsen.
    ver:
      - nombre: Kamakura-kōkōmae
        maps: Kamakurakokomae Station
        nota: El paso a nivel de *Slam Dunk*, con el Pacífico detrás.
        lat: 35.3067209
        lon: 139.5007098
