body: >-
  Está en **Nakamachi**, que no es una dirección cualquiera: es la calle de los *kura*, los almacenes
  de muros blancos encalados y entramado negro que levantaron los comerciantes de Matsumoto después
  del incendio de 1888 porque no ardían. El ryokan ocupa uno de ellos, y esa fachada de la foto es
  literalmente el motivo por el que la calle se visita.


  Por dentro es lo que promete: tatami, futón y madera. Las reseñas —275, con un 9,3 que es la nota
  más alta de las cuatro fichas de esta guía— repiten dos cosas, **el desayuno y el trato de los
  dueños**, que es exactamente lo que se va a buscar a un ryokan y lo que un hotel de cadena no da.


  Para el día 6 encaja bien: doce minutos andando desde la estación con la maleta, y otros once
  hasta el [castillo](#matsumoto-jo). Y como al día siguiente se sube a [Kamikōchi](#kamikochi),
  dormir una noche a la japonesa antes de la montaña tiene su lógica de guion.
