kicker: Historia de Japón · acto cuarto de seis
title: Edo, *doscientos cincuenta años* con la puerta cerrada
lead: >-
  Los Tokugawa heredaron un país agotado de guerra y lo estabilizaron con un método drástico:
  **cerrarlo**. Entre 1633 y 1639 una serie de edictos prohibieron a los extranjeros entrar, a los
  japoneses salir —bajo pena de muerte— y a nadie construir barcos capaces de alta mar. El
  cristianismo quedó proscrito. Japón se desconectó del mundo durante dos siglos y medio, y esa
  es la razón de que hoy sea tan distinto de todo lo demás.
body: |
  La rendija fue **Dejima**, un islote artificial en forma de abanico en el puerto de Nagasaki donde
  se toleró a un puñado de holandeses —los únicos europeos que aceptaron comerciar sin predicar—.
  Por esa grieta de doscientos metros entró todo el conocimiento occidental de dos siglos: se le
  llamó *rangaku*, «estudios holandeses», y de ahí salió la anatomía, la astronomía y la
  artillería que le harían falta al país cuando el mundo volviera a llamar a la puerta.

  Mientras tanto **Edo** —el nombre de Tokio hasta 1868— se convirtió en un fenómeno urbano sin
  precedentes. El shogunato obligaba a cada daimyō a mantener residencia en la capital y a pasar en
  ella un año de cada dos, dejando allí a su familia como rehén de hecho: el sistema del
  *sankin-kōtai*. Aquel ir y venir permanente de cortejos señoriales creó las grandes carreteras,
  las posadas, y una ciudad que hacia 1721 rondaba el millón de habitantes — probablemente la más
  poblada del mundo, cuando Londres tenía la mitad.

  Y era una ciudad de madera y papel que ardía sin parar. Los incendios eran tan frecuentes que se
  les llamaba con sorna ***las flores de Edo***; el de 1657 se llevó por delante buena parte de la
  ciudad y la torre del castillo, que nunca se reconstruyó.

  De aquel millón de personas encerradas salió una cultura urbana de una vitalidad enorme: el
  ***ukiyo-e***, las «estampas del mundo flotante», que retrataban actores, cortesanas y paisajes
  para un público de comerciantes; el kabuki, ruidoso y popular, frente al nō aristocrático; los
  puestos callejeros de donde salieron el [sushi](#sushi) y el [tempura](#tempura) como comida rápida. Casi todo lo que
  hoy se vende como «Japón tradicional» es en realidad esto: cultura de ciudad, burguesa y bastante
  reciente.

  > Cuando Hokusai publicó su gran ola hacia 1831, Japón llevaba dos siglos sin dejar salir a nadie
  > a navegar en serio. Aquella ola no la vio nadie desde un barco.
connect:
  label: Lo veréis sobre el terreno
  body: |
    Casi todo el día 4. [**Nihonbashi**](https://www.google.com/maps/search/?api=1&query=Nihonbashi%20Bridge%20Tokyo) era el kilómetro cero de las cinco grandes carreteras del
    país: todas las distancias de Japón se medían desde ese puente, y hoy vive aplastado bajo una
    autopista de hormigón de los años sesenta — una imagen que cuenta el siglo XX japonés mejor que
    cualquier museo. Los **fosos y los muros ciclópeos** del Palacio Imperial son lo que queda del
    castillo de Edo, la mayor fortaleza del mundo en su día; y arriba, donde debería estar la torre,
    no hay nada: la que ardió en 1657.

    En Ginza, el [**Kabuki-za**](https://www.google.com/maps/search/?api=1&query=Kabukiza%20Theatre%20Ginza%20Tokyo) sigue programando a diario y vende entradas de un solo acto en
    taquilla. Y **Asakusa** —el día 2— era el barrio del ocio de Edo: el templo, los teatros y el
    distrito de placer, todo junto.
