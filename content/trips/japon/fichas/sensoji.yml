epithet: >-
  El templo más antiguo de Tokio, fundado —dice la leyenda— por dos pescadores en el año 628, y hoy
  el más visitado de Japón. La gracia no está en el edificio, que es de hormigón: está en la hora a
  la que se llega.
sections:
  - heading: Dos pescadores y una estatuilla
    body: |
      La historia fundacional es del año **628**: dos hermanos pescadores sacaron del río Sumida, en
      sus redes, una pequeña imagen de **Kannon**, la deidad budista de la misericordia. Su señor
      hizo de su casa un templo para guardarla, y de ahí creció todo. La imagen sigue oficialmente
      ahí y **nadie la ha visto nunca**: es un *hibutsu*, un «buda oculto» que no se muestra jamás,
      ni siquiera cuando se saca en procesión una réplica.

      Se entra por el [**Kaminarimon**](https://www.google.com/maps/search/?api=1&query=Kaminarimon%20Asakusa%20Tokyo), la «puerta del trueno», con su farol rojo colgando en el
      centro: cuatro metros de alto y **unos 670 kilos**. Detrás, los doscientos metros de la
      **Nakamise-dōri**, una de las calles comerciales más antiguas del país, con puestos de
      *sembei* tostados a la vista y *ningyō-yaki* saliendo del molde.
  - heading: Lo que es de verdad antiguo
    body: |
      Conviene saberlo para mirar bien: **el templo que veis no es antiguo**. Sensō-ji ardió en el
      bombardeo de marzo de 1945 y lo que hay hoy es una reconstrucción de posguerra en hormigón —el
      tejado del salón principal se rehízo hace poco con **tejas de titanio**, más ligeras y a prueba
      de terremotos—. Es un edificio del siglo XX con mil cuatrocientos años de culto encima.

      Pero al lado sí hay algo original, y casi nadie se para: el [**Asakusa-jinja**](https://www.google.com/maps/search/?api=1&query=Asakusa%20Shrine%20Tokyo), un **santuario
      shintō** dedicado a los dos hermanos pescadores y a su señor —los tres hombres del mito—,
      levantado por el shōgun **Tokugawa Iemitsu hacia 1649**. Sobrevivió a los incendios, al
      terremoto de 1923 y a las bombas. Es decir: **el edificio de verdad viejo del recinto es el
      santuario, no el templo**, y está a treinta metros a la derecha del salón principal. Ahí, además,
      se aplaude.
  - heading: Asakusa, más allá del templo
    body: |
      El templo es la excusa; el barrio es lo que se queda. Tres cosas a cinco minutos que no salen
      en las listas:

      - **El Centro Cultural y Turístico**, justo enfrente del [Kaminarimon](https://www.google.com/maps/search/?api=1&query=Kaminarimon%20Asakusa%20Tokyo). Parece una oficina y no lo
        es: lo diseñó **Kengo Kuma** apilando ocho «casitas» de madera una encima de otra, y tiene
        **ascensor gratuito hasta la octava planta**, con una terraza desde la que se ve la [Nakamise](https://www.google.com/maps/search/?api=1&query=Nakamise-dori%20Asakusa%20Tokyo)
        entera en línea recta, con el templo al fondo y el Skytree a la izquierda. Es **el mejor
        mirador gratis de Tokio** y está a treinta metros de la puerta.
      - **El Asahi Beer Hall**, al otro lado del río, de **Philippe Starck**. Encima lleva una
        escultura dorada que se supone que es una llama y que todo el mundo, sin excepción, llama
        ***kin no unko***: «la caca de oro». Se ve desde el puente [**Azuma-bashi**](https://www.google.com/maps/search/?api=1&query=Azumabashi%20Bridge%20Tokyo) y es, sin ninguna
        ironía, uno de los edificios más queridos de la ciudad.
      - **Rokku**, al oeste del templo. Cuando en los años cuarenta del siglo XIX el shogunato
        **desterró el kabuki del centro de Edo**, los teatros acabaron aquí — y durante el siglo
        siguiente **casi todo lo que Japón inventó en entretenimiento popular empezó en estas
        manzanas**: el cine, el cabaret, el estriptis. Hoy quedan salas viejas, *pachinko* y la
        [**Hoppy-dōri**](https://www.google.com/maps/search/?api=1&query=Hoppy%20Street%20Asakusa%20Tokyo), una calle de bares al aire libre bautizada por una bebida de posguerra que
        imitaba la cerveza cuando la cerveza era inalcanzable.

      Y una manera mejor de llegar o de irse: **el ferry por el río Sumida**, que sale del
      embarcadero de al lado. Baja hasta Hinode en unos cuarenta minutos, o hasta [**Odaiba**](#odaiba) en los
      barcos **Himiko** y **Hotaluna**, con forma de nave espacial — los diseñó **Leiji Matsumoto**,
      el autor de *Galaxy Express 999*. Cuesta poco más que el metro y se ve la ciudad desde el agua,
      que es como se veía Edo.
  - heading: A qué hora
    body: |
      Sensō-ji recibe unos treinta millones de visitantes al año y a media mañana la [Nakamise](https://www.google.com/maps/search/?api=1&query=Nakamise-dori%20Asakusa%20Tokyo) es una
      cinta transportadora de gente. La solución no es evitarlo, es **madrugar**: **el recinto está
      abierto de noche y de día**; lo único que cierra es el salón principal, y **en invierno abre a
      las 6:30** (de octubre a marzo; a las 6:00 el resto del año). Así que a las seis de la mañana se
      puede recorrer todo con las persianas bajadas y sin nadie, y esperar media hora al Kannon. Y luego
      volver a las nueve, cuando abre, para ver el mismo sitio convertido en un mercado. Son dos
      lugares distintos con el mismo nombre.
  - heading: Lo que no sale en las listas
    body: |
      - **El recinto de noche.** No cierra. A las once de la noche la puerta Hōzōmon y la pagoda están
        iluminadas y **no hay absolutamente nadie**: es la otra visita, y es gratis.
      - **Sometarō** — una casa de madera donde se come *[okonomiyaki](#okonomiyaki)* **sentado en el suelo y
        haciéndolo uno mismo** en la plancha de la mesa. Llevan así desde 1937 y te explican cómo se
        hace si es la primera vez.
      - **Hanayashiki** — **el parque de atracciones más antiguo de Japón**, de **1853**, encajado
        entre las casas a dos calles del templo. Montañas rusas destartaladas (destartaladas pero
        seguras, esto es Japón) y una casa del terror. Es absurdo y encantador.
      - **Alquilar un kimono** — hay tiendas en casi todas las calles del barrio; se paga por horas,
        peinado incluido. Aquí no es disfraz: la mitad de la gente que se ve con kimono en la [Nakamise](https://www.google.com/maps/search/?api=1&query=Nakamise-dori%20Asakusa%20Tokyo)
        lo lleva alquilado, japoneses incluidos.
curiosidades:
  - >-
    La imagen de Kannon que da origen al templo es un ***hibutsu***, un «buda oculto»: lleva
    catorce siglos guardada y **nunca se muestra al público**, ni siquiera a los monjes. Lo que se
    saca en las procesiones es una copia.
  - >-
    El edificio verdaderamente antiguo del recinto no es el templo sino el [**Asakusa-jinja**](https://www.google.com/maps/search/?api=1&query=Asakusa%20Shrine%20Tokyo), el
    santuario de 1649 dedicado a los dos pescadores que sacaron la estatuilla del río. Sobrevivió a
    los incendios de Edo, al terremoto de 1923 y a los bombardeos de 1945.
  - >-
    El farol del [**Kaminarimon**](https://www.google.com/maps/search/?api=1&query=Kaminarimon%20Asakusa%20Tokyo) pesa unos **670 kilos**. Se sustituye cada diez años, y en la base,
    si os agacháis a mirar, hay un dragón tallado en madera.
