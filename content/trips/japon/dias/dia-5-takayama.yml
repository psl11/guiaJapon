eyebrow: El plan · Día 5 · mar 10 nov
title: Takayama, el pueblo que pagó *en carpinteros*
dek: >-
  Se empieza con una cascada helada y se termina en un pueblo de montaña: el salto de
  [Hirayu](#kamikochi-en-el-dia) al amanecer, una hora de autobús y tres calles de casas de madera negra
  intactas, con la mejor historia fiscal de Japón detrás. Por la tarde, las carrozas del festival. Y
  por la noche, Takayama vacío.
duerme:
  - gift-takayama
traslados:
  - desde: "Hirayu Onsen"
    hasta: "Takayama"
    medio: "Autobús Nōhi"
    duracion: "1 h"
    hora: "09:30"
    nota: "Sale de la terminal de Hirayu a las 9:30 y llega a las 10:31; los hay a y media cada hora. **¥1.600 en efectivo**: a bordo no se paga con tarjeta IC. Horario de Nōhi de diciembre de 2025: el de noviembre puede moverse unos minutos."
blocks:
  - block: Amanecer
    time: "07:00–09:30"
    title: La cascada antes del desayuno, y bajar
    body: >-
      Hoy la mañana no es de baño sino de paseo: a las siete se sale a pie hacia el **salto de
      Hirayu**, sesenta y cuatro metros de caída a veinte o treinta minutos de la terminal, con el
      bosque todavía con escarcha. Fotos, y de vuelta a las ocho y media para el desayuno japonés de
      la casa —arroz, pescado, encurtidos, sopa de miso—; pedid esa hora al llegar la víspera,
      porque en un ryokan el desayuno va por turnos. Y a la terminal, que está en el mismo pueblo.


      Una hora de autobús hasta [Takayama](#takayama), bajando el valle del río. Se llega a media
      mañana, todavía con la mochila: las maletas grandes esperan en Kanazawa.
    window:
      label: Lo que se gana durmiendo aquí
      body: >-
        Ayer se podía haber seguido hasta Takayama con el último autobús y ahorrarse una cama. No se
        hace por esto: **el baño de antes de cenar y el de después son dos, y de paso solo cabe
        uno**, además de una mañana en la montaña para ver la cascada. Lo que aquí se compra no es el
        sitio, es el tiempo.
    ver:
      - nombre: Salto de Hirayu
        maps: Hirayu Otaki Falls
        nota: "Sesenta y cuatro metros de caída, a veinte o treinta minutos andando de la terminal. Salir a las siete y volver a las ocho y media."
  - block: Mañana
    time: "10:30–12:30"
    title: Sanmachi, las bolas de cedro y el Jinya
    body: >-
      Tres calles de casas de comerciantes intactas, con canales de agua a los lados: se andan en una
      hora larga. El juego es **mirar hacia arriba**, a las bolas de ramas de cedro que cuelgan sobre
      las puertas.


      A esta hora ya han llegado los autobuses de día desde Nagoya y Kanazawa, así que Sanmachi va
      llena. **No es un problema, es un aplazamiento**: mañana al amanecer el pueblo vuelve a ser de
      los suyos y esa es la hora que se ha reservado para los mercados.


      Hay **seis destilerías en tres calles** y casi todas dejan catar, pero con dos basta y un vasito
      en cada una: Kawashiri, la más tradicional, y Funasaka, la grande. No hace falta reservar ni
      tour: se entra, se cata y se compra si gusta.


      Antes de comer, a cinco minutos, el **Takayama Jinya**: la visita que casi nadie hace y la que
      mejor se recuerda. Entrad.
    window:
      label: Cómo se cata sin acabar el día torcido
      body: >-
        Las destilerías abren de **10:00 a 16:00** y muchas cierran el catado a media tarde. Casi
        todas cobran unos ¥300 por una tanda de tres o cuatro vasitos, y algunas regalan el vaso
        de cerámica. Empezad por las secas y subid hacia las dulces, no al revés — y con dos
        casas hay de sobra: el sake de Hida ronda los 16 grados y queda el resto del día.
    ver:
      - ficha: takayama
        nota: Los carpinteros que pagaban el tributo, y qué dice el color de la bola de cedro.
      - nombre: Sanmachi Suji
