body: >-
  El dato improbable: **una de las mejores coctelerías de Asia está en Nara**, una ciudad de trescientos mil habitantes que casi todo el mundo visita en cuatro horas y abandona antes de cenar. Michito Kaneko ganó el campeonato mundial de coctelería en 2015 y montó esto en su ciudad.


  Lo incluyo con una advertencia honesta: **solo tiene sentido si dormís en Nara**, y el itinerario no lo prevé. Queda como argumento por si alguien se plantea una noche extra en el desvío de Kioto.
