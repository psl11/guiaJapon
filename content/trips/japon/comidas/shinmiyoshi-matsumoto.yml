quePedir: >-
  El plato variado de ***basashi*** —el *sakura sashimi*, con cortes magros y veteados— y, si
  apetece algo caliente, el ***sakura nabe***, caballo en cazuela con miso.
body: >-
  En Matsumoto el **caballo** es tan normal como el jamón en Teruel, y aquí es lo único que se
  sirve: unos noventa platos por la noche, del *basashi* crudo a la parrilla, la cazuela y el
  *shabu-shabu*. El «bar» del nombre es la versión nueva de una casa que lleva años en el mismo
  oficio, y se nota en el ambiente: ruidoso, de barra y de sake de Nagano.


  Para quien no se atreva con el crudo, la cazuela y la parrilla son la puerta de entrada. Y si
  alguien no quiere caballo de ninguna forma, que no le obligue nadie: la carta tiene acompañamientos.
