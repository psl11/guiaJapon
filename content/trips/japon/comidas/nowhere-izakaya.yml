body: >-
  La respuesta a la pregunta que va a salir tres veces en este viaje: **dónde cena bien alguien que no come pescado en un país donde el caldo básico es de pescado**. Aquí toda la carta es vegana y, lo que importa, **está construida sobre los clásicos del izakaya** en vez de huirles: el *karaage*, el katsu, la ensaladilla, el edamame. No es comida de dieta, es comida de bar hecha sin animal.


  Está en **Mukōjima**, cruzando el Sumida desde Asakusa, en un Tokio de casas bajas que casi nadie pisa. Vais a acabar cenando con la Skytree encendida por encima de los tejados.
