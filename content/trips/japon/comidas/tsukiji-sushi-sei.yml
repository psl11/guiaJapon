body: >-
  **Pablo fue con Sergio en 2017 y fue épico.** Fueron al **Shinkan**, el edificio nuevo, no a la
  casa madre: Sushi Sei **abrió en Tsukiji en 1889** y es la matriz de un grupo que tiene varias
  barras a un par de calles. No es un sitio de mercado con taburetes — es una barra formal, con
  mostrador de madera y silencio.


  *Edomae* significa literalmente **«delante de Edo»**, la bahía de Tokio: el sushi nació aquí como
  comida rápida de puesto callejero en el siglo XIX, con el pescado marinado o hervido porque no había
  hielo. Lo que hace una barra de este nivel es seguir aplicando esas técnicas —el curado, el
  *nikiri*, el arroz a temperatura de cuerpo— cuando ya no hacen falta.


  **Un detalle al reservar:** el **honten** (la casa madre) y el **Shinkan** están a un par de calles
  y no son lo mismo de precio ni de ambiente. El de Pablo es el Shinkan, en la planta baja del
  4-13-5, pared con pared con [Yakiuo Ishikawa](#yakiuo-ishikawa), y abre todos los días, también el
  miércoles de Tsukiji.
