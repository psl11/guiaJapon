body: >-
  Una tortilla hecha con cinco huevos, cremosa por dentro, entre dos rebanadas de pan integral
  tostado con gouda y mayonesa de la casa. Está en Zushi, a dos minutos de la estación de
  Zushi-Hayama y a trece minutos en tren de [Kamakura](#kamakura-zen), o sea razonablemente cerca del
  día 8.


  Y aquí se acaba: **cierra lunes y viernes, y el día de Kamakura es viernes 13 de noviembre**.
  Tampoco vale colarlo otro día, porque solo abre de once a tres y ningún otro día del viaje pasa por
  la península de Miura.


  Lo dejo escrito con la fecha delante para que no haya que volver a mirarlo. Si alguna vez el
  itinerario cambia y Kamakura cae en sábado o domingo, este sitio se vuelve viable.
