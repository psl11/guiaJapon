body: >-
  Un *yatai* —puesto de comida al aire libre— junto a las vías, en Hachiōji, donde se cena
  *[ramen](#ramen)* viendo pasar los trenes. Caldo de soja oscuro sin llegar a salado, fideo fino,
  espinaca y una tapa de *chāshū*, por novecientos cincuenta yenes. Abre de seis a once de la noche,
  **cierra domingos y lunes, y también si llueve**. Solo efectivo.


  Está aquí porque **lo trajeron dos posts distintos y sin relación entre ellos**, uno japonés y otro
  coreano, y esa coincidencia es la mejor señal que da esta lista entera: casi todo lo demás llegó una
  sola vez.


  Y aun así hay que decir lo que hay: **Hachiōji está a una hora larga del centro de Tokio**, al
  fondo de la línea Chūō, y ningún día de este viaje pasa ni cerca. Ir y volver son dos horas y media
  por un cuenco de ramen. Va en la guía porque es el mejor descarte de la lista, no porque yo lo
  recomiende.
