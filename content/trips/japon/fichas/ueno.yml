epithet: >-
  El gran parque de Tokio no nació como parque sino como escudo: un templo colocado a propósito en la
  esquina nordeste del castillo de Edo, que es por donde la cosmología china dice que entran los
  demonios.
sections:
  - heading: Un templo contra los demonios
    body: |
      En la geomancia que Japón heredó de China, el **nordeste es el *kimon***, la «puerta del
      demonio»: la dirección por la que entra la desgracia. Cuando los Tokugawa levantaron su
      castillo, el segundo shōgun, **Hidetada**, mandó fundar en esa esquina exacta el templo de
      **Kan'ei-ji**, para blindarla. Llegó a ser un complejo enorme, templo funerario de la dinastía,
      con más de treinta edificios.

      De todo aquello queda muy poco, y por un motivo: en **1868**, durante la guerra que acabó con
      el shogunato, los últimos leales al shōgun —el **Shōgitai**— se atrincheraron aquí y fueron
      aniquilados en una tarde. El fuego se llevó el templo. Cinco años después, en **1873**, el
      terreno arrasado se convirtió en **uno de los primeros parques públicos de Japón**.
  - heading: Lo que hay dentro
    body: |
      El parque concentra la mayor densidad de museos del país. El principal es el **Museo Nacional
      de Tokio**, el más antiguo y grande de Japón: espadas, armaduras, biombos, cerámica y estatuaria
      budista en una colección que se puede recorrer en dos horas si uno se ciñe al edificio
      principal, el **Honkan**. Al lado, el **Museo de Naturaleza y Ciencia** y el **Museo Nacional de
      Arte Occidental**, este en un **edificio de Le Corbusier** que es Patrimonio Mundial.

      Y en el extremo sur, el **estanque de Shinobazu**, cubierto de lotos gigantes que en noviembre
      están secos y en pie — un campo de tallos marrones que tiene su propia belleza áspera. En su
      isleta hay un santuario a **Benzaiten**, la única de los siete dioses de la fortuna que es mujer.
  - heading: Ameyoko, el mercado negro
    body: |
      Y un apunte que descoloca a quien conoce Tokio: **Ueno es una de las tres únicas estaciones de
      la ciudad con parada de Shinkansen** —las otras dos son Tokio y Shinagawa—. Por aquí salen los
      trenes hacia el norte, que es lo que fue siempre esta puerta de la ciudad: por donde se entraba
      desde Tōhoku.

      Pegado al parque, bajo las vías del tren, está [**Ameyoko**](https://www.google.com/maps/search/?api=1&query=Ameyoko%20Market%20Ueno%20Tokyo): una calle de puestos que gritan los
      precios, con pescado seco, especias, zapatillas y fruta. Nació literalmente como **mercado negro
      de posguerra** —hay quien dice que el nombre viene de *ame*, caramelo, y quien lo atribuye a
      *American*, por los productos del ejército de ocupación que se vendían aquí—. Es de los pocos
      sitios de Tokio donde se regatea un poco y donde nadie habla en voz baja.

      Para comer sin salir del barrio, un sitio con historia: [**Sasa-no-yuki**](https://www.google.com/maps/search/?api=1&query=Sasanoyuki%20Negishi%20Tokyo), abierto desde el
      periodo Edo y dedicado **solo al tofu**, servido en una docena de preparaciones distintas. Es
      el mejor argumento contra la idea de que el tofu es aburrido, y funciona además como comida
      vegetariana de verdad en una ciudad donde no abunda.
curiosidades:
  - >-
    El parque de Ueno existe porque el **nordeste es la dirección maldita**: los Tokugawa plantaron
    ahí el templo Kan'ei-ji para blindar la esquina por la que, según la geomancia china, entran los
    demonios al castillo.
  - >-
    En 1868 los últimos partidarios del shōgun se atrincheraron aquí y ardió el templo entero. Cinco
    años después el solar se convirtió en **uno de los primeros parques públicos del país** (1873).
  - >-
    El **Museo Nacional de Arte Occidental** ocupa un edificio de **Le Corbusier** y es Patrimonio
    Mundial de la UNESCO — el único del arquitecto en Asia.
