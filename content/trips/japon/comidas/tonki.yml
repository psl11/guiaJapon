body: >-
  Una de las mejores *[tonkatsu](#tonkatsu)* de Tokio, en una casa que lleva desde antes de la guerra haciendo una
  sola cosa. Lo que hay que pedir son **los asientos de barra**, que son los codiciados: desde ahí se
  ve la coreografía entera del equipo —empanar, freír, escurrir, cortar— ejecutada con una precisión
  que ya es medio espectáculo.


  Está en Meguro, fuera de cualquier ruta turística, y esa es parte de la gracia: se cena rodeado de
  clientela del barrio. Desde la estación se baja por Meguro-dōri, se toma el primer callejón a la
  izquierda y se buscan unas ***noren*** blancas sobre puertas correderas — no hay más señal.
