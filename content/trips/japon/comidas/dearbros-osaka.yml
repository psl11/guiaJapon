body: >-
  *Omurice* en unas treinta versiones distintas, en Sennichimae, a medio camino entre Namba y
  Dōtonbori. La de la casa lleva wagyu y *kakuni* —panceta guisada hasta deshacerse— con salsa
  teriyaki, y cuesta 2.460 yenes.


  Lo que la hace útil en este viaje no es la carta sino el reloj: **abre de diez de la mañana a
  medianoche, sin cerrar entre servicios y todos los días**. El día 14 es el más apretado de Osaka
  —Fushimi Inari al amanecer, castillo, Kuromon, Shinsekai y Dōtonbori de noche— y este es el único
  sitio de la lista que se deja meter en cualquier hueco que sobre.


  Tiene pocos asientos y cola en punta, que es el precio de estar donde está.
