slug: dia-4-kamikochi
navLabel: "Día 4 · Kamikōchi"
trip: japon
order: 4
eyebrow: El plan · Día 4 · lun 9 nov
title: Kamikōchi, *de una sentada*
dek: >-
  El día más largo del viaje y el que más paga. Un valle a mil quinientos metros donde los coches
  están prohibidos desde 1975, recorrido de punta a punta en una sola jornada, y al final un baño
  termal al otro lado del túnel antes de bajar a dormir a [Takayama](#takayama).
blocks:
  - block: Amanecer
    time: "06:30–08:30"
    title: La subida, y por qué no hay coches
    body: >-
      Se sale de Matsumoto pronto, y hoy eso no cuesta nada: con el desfase horario a favor el cuerpo
      lleva tres días despertándose antes de que suene el despertador. Dos tramos —el trenecito de la
      línea Kamikōchi hasta Shin-Shimashima y luego el autobús—, o el directo si cuadra el horario.

      Y en algún punto del ascenso, en Nakanoyu, **se acaba el mundo motorizado**. Los vehículos
      particulares [llevan prohibidos desde 1975](#kamikochi). Por eso este valle no se parece a
      ningún otro sitio accesible de Japón: hay hoteles, restaurantes y gente, y aun así lo único que
      se oye es el río.
    window:
      label: Las maletas ya están en Takayama
      body: >-
        **Esto se resuelve el día anterior, no hoy.** Las maletas grandes salen por
        [takkyūbin](#takkyubin) desde el hotel de Tokio y esperan en el de Takayama; aquí arriba se
        anda con mochila pequeña y se duerme esta noche con lo que llegó por delante. En un valle sin
        coches ni ascensores, cargar con equipaje no es incómodo: es inviable.
  - block: Mañana
    time: "08:30–12:00"
    title: Kappabashi y el río Azusa
    body: >-
      El centro del valle es un puente colgante de madera, el [**Kappabashi**](https://www.google.com/maps/search/?api=1&query=Kappa%20Bridge%20Kamikochi),
      y la postal es la misma desde hace un siglo: el **río Azusa** corriendo transparente sobre grava
      clara, y detrás la pared del Hotaka, con el Okuhotaka en 3.190 metros. El agua viene de deshielo
      y baja a unos pocos grados; se ve el fondo entero. Desde aquí se camina en las dos direcciones
      por sendas llanas, sin desnivel y sin técnica: es alta montaña sin ser montañismo.

      Con el día entero por delante, la mañana es para ir **río arriba**, hasta el **estanque
      Myōjin** y su santuario Hotaka-jinja Okumiya. Una hora de sendero llano, y una orilla que casi
      nadie pisa porque queda al otro lado del puente: se paga una entrada pequeña y se está solo. Por
      el camino está el relieve de **Walter Weston**, el misionero británico que a finales del XIX
      convenció a los japoneses de que sus montañas podían subirse por gusto y no por peregrinación.
      De él viene la palabra «Alpes japoneses».
  - block: Mediodía
    time: "12:00–13:00"
    title: Comer donde no hay nada
    body: >-
      Dentro del valle solo se come en los hoteles y en el par de cafeterías de la terminal, y a la
      una ya están recogiendo. Lo razonable es lo que hace todo el mundo aquí: **comprar el almuerzo
      abajo y comérselo en una orilla**. Comer a la vista del Hotaka nevado, sin una mesa alrededor,
      es mejor plan que cualquier comedor.
  - block: Tarde
    time: "13:00–16:00"
    title: Río abajo, hasta el estanque Taishō
    body: >-
      El paseo esencial va **río abajo** hasta el estanque Taishō, una hora larga por la orilla. El
      estanque no existía hace cien años: lo creó la erupción del monte Yake en 1915, que represó el
      Azusa y ahogó un bosque entero — y por eso del agua siguen saliendo troncos muertos en pie,
      pelados, con las cumbres reflejadas detrás. Es el paisaje más fotografiado del valle y con
      razón.
    window:
      label: Ventana óptima
      body: >-
        **Esta tarde es la mejor luz del día y no hay una segunda oportunidad**, así que no la
        gastéis volviendo sobre lo andado. Hacia las tres y media el sol entra rasante por el hueco
        del río y pone las cumbres en naranja; a las **cuatro y media es de noche** y la temperatura
        se desploma en cuanto cae tras la pared. Guantes en la mochila: operar una cámara con los
        dedos desnudos a esa hora dura poco.
  - block: Tarde
    time: "16:00–17:30"
    title: El baño de Hirayu, con el reloj puesto
    body: >-
      Veinticinco minutos de autobús por el túnel y se sale del parque en
      [**Hirayu Onsen**](https://www.google.com/maps/search/?api=1&query=Hirayu%20Onsen%20Takayama),
      el pueblo termal donde arranca la carretera del valle. Sus aguas llevan brotando desde el siglo
      XVI y el baño público está **en la propia terminal de autobuses**, así que no hay que ir a
      ninguna parte: se entra con la mochila, se paga poco y se sale a coger el siguiente. Después de
      siete horas andando a mil quinientos metros y con la temperatura bajo cero fuera, un
      *[rotenburo](#onsen)* al aire libre es la mejor hora del día.
    window:
      label: La trampa de los dos últimos autobuses
      body: >-
        Leed esto dos veces, porque los horarios están puestos para engañar. **El último autobús de
        Kamikōchi a Hirayu sale a las 17:30 y llega a las 17:55 — y el último de Hirayu a Takayama
        sale también a las 17:30.** Es decir: quien coge el último de arriba se queda tirado abajo.

        La combinación que funciona es salir del valle sobre las **16:00**, plantarse en Hirayu a las
        16:25 y coger el de las **17:30**, que deja en Takayama a las 18:31. Da para una hora larga
        de baño y para nada más. **Confirmad los horarios exactos de noviembre en la terminal al
        subir**, no al bajar: todo el día cuelga de estos dos autobuses.
  - block: Noche
    time: "desde las 18:30"
    title: Bajar a Takayama
    body: >-
      Se llega de noche a un pueblo de montaña con las maletas ya esperando en el hotel, y eso —
      después de trece horas de puerta a puerta — es exactamente lo que se necesita. Lo de
      [Takayama](#takayama) empieza mañana al amanecer, así que hoy toca cenar cerca y poco más.
      Buscad **hōba miso**, que se hace a la mesa sobre una hoja de magnolia, o el **buey de Hida**,
      que aquí no es una etiqueta de restaurante turístico sino la ganadería del valle.
alt:
  label: Si te desmarcas
  body: >-
    Si el parte da mal tiempo, el valle pierde casi todo su sentido —lo que se viene a ver son las
    cumbres— y hay una salida elegante: quedarse en **Hirayu y su valle de Okuhida**, que es una
    concentración de aguas termales al pie del paso, y subir el **teleférico de Shinhotaka**. Es el
    único de Japón con cabina de dos pisos, sube a 2.156 metros en dos tramos y deja en un mirador
    sobre los Alpes del Norte. Con nubes bajas se sale por encima de ellas, que es justo lo que no
    puede hacerse desde el fondo del valle.

    Y a mitad de camino del estanque Taishō, apartado del sendero principal, está el estanque
    **Tashiro**: mucho más pequeño, rodeado de hierba y con la niebla enganchada al agua a primera
    hora. Casi todo el mundo pasa de largo porque el desvío no está señalizado con ganas.
