body: >-
  Va aquí porque **contradice a la guía**, y esconderlo sería peor. Un cocinero español afincado en
  Japón sostiene que Omoide Yokochō no es ningún referente gastronómico sino una trampa para
  turistas: cuatro fotos y a comer a otro sitio. Propone en su lugar Torikizoku, la cadena de
  *yakitori* donde todo el menú vale lo mismo.


  El plan del día 9 lo manda ahí a cenar, y sigue mandándolo, por una razón que no es la comida: esos
  dos pasillos de barras bajo faroles rojos son lo que queda del mercado negro de posguerra, y verlos
  es parte de entender [Shinjuku](#shinjuku). Nadie ha dicho que se coma mejor ahí que en el barrio.


  Lo útil del aviso es la advertencia de al lado: **si en esa zona alguien os aborda en la calle para
  llevaros a un local, es un** *kyakuhiki* **y hay que decir que no**. Un sitio bueno no necesita
  salir a pescar clientes. El cubierto anunciado en la puerta de los bares de Golden Gai es otra cosa
  y sí es legítimo.
