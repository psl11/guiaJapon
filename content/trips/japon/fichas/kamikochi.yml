epithet: >-
  Un valle glaciar a mil quinientos metros con las paredes del Hotaka encima y un río de agua de
  deshielo por el medio. Los coches privados están prohibidos desde 1975, y del 16 de noviembre al
  16 de abril no entra nadie: la carretera se cierra y el valle se queda solo.
sections:
  - heading: Lo que significa «sin coches»
    body: |
      Kamikōchi es el corazón del **Parque Nacional Chūbu-Sangaku** y desde 1975 está cerrado al
      tráfico particular: se entra en autobús o en taxi desde Sawando o Hirayu, y punto. No hay
      aparcamientos, no hay carretera de paso, no hay ruido de motor de fondo. Es lo que hace que un
      sitio con hoteles, restaurantes y miles de visitantes al día siga sonando a río y a viento.

      Y hay una segunda restricción, más radical: **la temporada**. El valle abre a mediados de
      abril y cierra el 15 de noviembre; al día siguiente se corta la carretera y no se vuelve a
      abrir hasta la primavera. Cinco meses al año Kamikōchi no existe para nadie.
  - heading: Por qué se anda llano a mil quinientos metros
    body: |
      Hay una rareza geográfica que explica todo lo demás: **Kamikōchi es alta montaña sin ser
      montañismo**. Once kilómetros de sendero prácticamente sin desnivel, encajados entre paredes
      de tres mil metros. Eso no es normal, y tiene dos causas encadenadas.

      La primera es el **hielo**. El valle lo excavó un glaciar durante la última glaciación, y un
      valle glaciar no tiene forma de uve como los de río: tiene forma de artesa, con el fondo
      ancho y plano y las paredes casi verticales. La segunda es el volcán. El monte Yake
      —que sigue activo y todavía humea— lleva milenios rellenando ese fondo con material de sus
      erupciones, hasta dejarlo liso como una pista.

      De ahí sale también el color del agua. El **Azusa** no baja de lluvia sino de nieve fundida
      filtrada por roca volcánica: sale del subsuelo ya limpia, a unos cinco o seis grados
      todo el año, y por eso se ve el fondo de grava como si no hubiera agua encima. Es agua tan
      pobre en nutrientes que apenas cría algas — de ahí la transparencia.

      El día 4 lo recorréis entero: [ver el plan](#dia-4-kamikochi).
  - heading: Un misionero inglés y la palabra «Alpes»
    body: |
      A finales del XIX, un misionero británico llamado **Walter Weston** empezó a subir estas
      montañas por gusto —no en peregrinación, que era la única razón japonesa para hacerlo— y
      escribió un libro que popularizó la idea. De él viene que a esta cordillera se la llame «los
      Alpes japoneses», y en buena medida que el montañismo exista aquí como afición. Hay un
      relieve conmemorativo en el sendero, y cada primera semana de junio se celebra una
      ceremonia en su honor.
  - heading: "Dormir dentro: por qué no pudo ser"
    body: |
      El valle tiene una docena escasa de alojamientos, todos estacionales, y cierran incluso antes
      que la carretera: varios el 10, el Shirakabaso el 14 de noviembre. Las últimas noches de la
      temporada son, por tanto, **de las primeras que se venden** — y las reservas abren en enero
      para el año entero. Cuando se preguntó, estaban vendidas.

      No hay término medio, porque **no hay pueblo**: dentro del valle no existe el «bajamos al hotel
      del centro», existe el hotel del valle o veinticinco minutos de autobús hasta
      [Hirayu](https://www.google.com/maps/search/?api=1&query=Hirayu%20Onsen%20Takayama). Así que el
      plan es el otro: **entrar y salir en el día**, aprovechando que las sendas son llanas y que en
      una jornada larga cabe el valle entero de punta a punta.

      Lo que cuesta en concreto —el atardecer, la noche sin una sola farola y sobre todo el amanecer
      en el estanque Taishō— está desglosado en [dormir en el valle](#dormir-en-kamikochi). Y cómo
      queda el día resultante, en el [día 4](#dia-4-kamikochi).
curiosidades:
  - >-
    **El valle cierra el 15 de noviembre y no vuelve a abrir hasta el 16 de abril.** Cinco meses al
    año la carretera está cortada y Kamikōchi se queda solo con la nieve. Entráis seis días antes de
    que eche el cierre.
  - >-
    El nombre significa **«el lugar por donde bajaron los dioses»**: se escribía *kamikōchi* con el
    carácter de *kami*, por el kami **Hotakami**, que según la tradición descendió a estas cumbres.
    El santuario que hay en el estanque Myōjin sigue siendo suyo.
  - >-
    A esta cordillera se la llama **«los Alpes japoneses»** por un misionero británico, **Walter
    Weston**, que a finales del XIX empezó a subirlas por deporte y no por peregrinación. Tiene un
    relieve en el sendero.
