quePedir: >-
  Un **filtrado escandinavo** por la mañana; si volvéis de noche, se transforma en bar de cócteles.
body: >-
  Sucursal tokiota de un café de **Oslo** que abrió aquí en 2012 y que ayudó a instalar el tueste claro nórdico en la ciudad. Muebles daneses de los cincuenta originales, todos a la venta, y **abre a las siete de la mañana**: es de los poquísimos sitios buenos donde desayunar de verdad antes de que Tokio arranque.


  Y ahí está su encaje: el día 3 empieza en [**Meiji Jingū**](#meiji-jingu), que hay que hacer temprano y que queda al otro lado del parque de Yoyogi. Café a las siete, bosque a las ocho.
