queEs: >-
  Todo el té japonés es **té verde**, de la misma planta, y lo que los separa es el cultivo y el tueste. ***Sencha***, el de diario, hojas al sol. ***Gyokuro***, el caro, **cultivado tres semanas a la sombra** para que la hoja produzca más aminoácidos y menos amargor. ***Matcha***, hoja de sombra molida a piedra. ***Hōjicha***, hoja tostada, tan poco amarga que se da a los niños. ***Genmaicha***, con arroz tostado.
historia: >-
  El té llegó con los monjes zen en el siglo XII y durante siglos fue medicina y liturgia antes que bebida. La revolución llegó en **1738**, cuando Nagatani Sōen inventó en Uji el método del *sencha* —vaporizar la hoja en vez de tostarla— y convirtió el té en algo que podía beber cualquiera. Casi todo el té verde que se bebe hoy en el mundo desciende de aquello.
dondeMejor: "Uji, junto a Kioto · y las casas de té de Kioto y Kanazawa"
picante: "—"
veg: "**Sí, siempre**"
body: >-
  El detalle que cambia la taza: **la temperatura del agua**. El *sencha* se hace a unos 70-80 °C y el *gyokuro* a **50-60 °C**, casi tibia. Con agua hirviendo, que es lo que hace todo el mundo en España, sale amargo y el té bueno sabe peor que el malo. En las casas de té os lo servirán a su temperatura; en el hotel, dejad enfriar.


  Kioto es su ciudad porque **Uji está a quince minutos en tren** y lleva ochocientos años siendo la denominación de origen del té japonés. El *gyokuro* de Uji bien servido no sabe a lo que en Europa llamamos té verde: sabe a caldo, dulce y espeso, más cerca de un consomé que de una infusión.
