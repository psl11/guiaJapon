  Las ***hotcakes*** —tortitas gruesas con mantequilla, la receta no ha cambiado desde los años treinta— o el sándwich de tortilla.
body: >-
  Abierto en **1932** y prácticamente intacto: barra de madera, tazas gruesas, camareros de chaleco y una carta de desayuno que en Japón se llama *morning* y que consiste en café, tostada y huevo por menos de mil yenes.


  Kioto es la ciudad japonesa con más ***kissaten*** por habitante y esa no es una casualidad turística: aquí hay universidad desde hace un siglo, y los cafés fueron durante décadas la sala de estar de los estudiantes. Este es el más céntrico de los buenos.
