body: >-
  El **café mejor clasificado de Japón** en la lista mundial de 2026 —número 24, por delante del tokiota Koffee Mameya Kakeru— y trabajan grano de nivel de campeonato: lotes raros, seleccionados uno a uno, del tipo que normalmente solo se ve en concursos.


  Osaka tiene fama de ciudad que come y bebe barato, y este es el contraargumento fino. Cae bien a primera hora del día 14, antes de que el plan se convierta en comer de pie por Dōtonbori.
