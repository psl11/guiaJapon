body: >-
  Japón sigue funcionando con efectivo en más sitios de los que uno espera, y el consejo que circula
  es bueno: **los cajeros de Seven Bank, dentro de los 7-Eleven, son los que mejor tratan a una
  tarjeta extranjera**. Están abiertos las veinticuatro horas, tienen menú en varios idiomas y hay
  uno en prácticamente cada una de las más de veintiún mil tiendas del país.


  Pero el titular de «sin comisión» hay que matizarlo, y esta es la corrección que justifica la
  ficha: **la comisión de cero es para Mastercard, Maestro y Cirrus**. Con Visa cobran ciento diez
  yenes si se sacan menos de diez mil y doscientos veinte si se sacan más. A eso se suma siempre lo
  que cobre el banco de casa.


  De ahí sale la regla práctica: **si alguien lleva Mastercard, que sea esa la que saque el efectivo
  de todos**, y en pocas retiradas grandes en vez de muchas pequeñas. Cambiar euros en el aeropuerto
  o en las casas de cambio de la calle sale peor en casi todos los casos.
