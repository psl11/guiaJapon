title: Sake (nihonshu)
queEs: >-
  Arroz fermentado. Ni un licor ni un vino de arroz: técnicamente es **una cerveza** —el almidón se
  convierte en azúcar por un moho, el *kōji*, y luego en alcohol—, aunque no se parezca a ninguna.
  Ronda los 15-16 grados.
historia: >-
  En Japón se llama ***nihonshu***; «sake» a secas significa cualquier bebida alcohólica, así que
  pedir «sake» en una barra es como pedir «alcohol». La calidad se mide por **cuánto se ha pulido el
  grano**: *junmai* (sin alcohol añadido), *ginjō* (pulido al 60 %), *daiginjō* (al 50 % o más) — a
  más pulido, más limpio y aromático.
dondeMejor: >-
  **Nagano** es una de las grandes prefecturas sakeras del país, por el agua de deshielo de los
  Alpes: en Matsumoto se bebe local y bueno. Frío o templado según el sake — el caliente no es
  sinónimo de malo, pero muchas veces lo esconde.
veg: "Sí."
body: >-
  Si os ponen delante una cajita de madera (*masu*) con un vaso dentro y os lo llenan hasta rebosar,
  no es un error: se llama ***mokkiri*** y es un gesto de generosidad. Se bebe primero del vaso sin
  levantarlo, y luego lo del *masu*.
