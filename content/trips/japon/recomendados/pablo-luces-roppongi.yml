body: >-
  La avenida de Keyakizaka baja desde Roppongi Hills con cuatrocientos metros de olmos japoneses
  cubiertos de luces blancas y azules, cerca de un millón de LED, con la Torre de Tokio asomando al
  fondo. Este año se encienden el 5 de noviembre, así que las cuatro noches del grupo en Roppongi,
  del 12 al 15, caen enteras dentro.


  Desde el 13 de noviembre se suman las luces del jardín Mōri y de la plaza 66, dentro de Roppongi
  Hills. Tokyo Midtown, a diez minutos andando, monta las suyas; en 2025 las encendió el 14 de
  noviembre, y las fechas de 2026 aún no están publicadas.


  Lo recomienda Pablo, que las vio en otro noviembre: se pasean al volver al hotel, sin más plan.
