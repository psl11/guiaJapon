blocks:
  - block: Mañana
    time: "09:00–12:00"
    title: Fukagawa, de donde salió Bashō
    body: >-
      Al otro lado del Sumida está **Fukagawa**, el sitio con más literatura por metro cuadrado de
      Tokio: aquí vivió **Matsuo Bashō** en su cabaña junto al río, y **de aquí salió en 1689** a andar
      los dos mil cuatrocientos kilómetros del *Oku no Hosomichi*. Se ven el museo pequeño y la
      estatua junto al río, y al lado, el jardín Kiyosumi Teien.
    window:
      label: Por qué hoy
      body: >-
        Porque es lo contrario de todo lo que viene después: una semana de cambiar de cama casi cada
        noche, trenes con hora y un grupo que coordinar, frente a un barrio de canales donde no hay nada que coger. Y
        porque **cierra el hilo literario** que la guía lleva abierto desde
        [los libros](#japon-cine-libros): mañana empieza el viaje que Bashō haría al revés.
    ver:
      - ficha: ryogoku
        nota: El barrio del sumo, de al lado, con el museo Edo-Tokio y el templo del *goma*.
      - nombre: Museo Bashō
        maps: Basho Museum Koto Tokyo
        nota: Pequeño, junto a donde estuvo la cabaña del poeta.
        lat: 35.6861290
        lon: 139.7940920
      - nombre: Estatua de Bashō
        maps: Matsuo Basho statue Sumida River Terrace Koto
        nota: Mirando al río. Gira al atardecer.
        lat: 35.6837769
        lon: 139.7939490
      - nombre: Kiyosumi Teien
        maps: Kiyosumi Teien Garden Tokyo
        nota: "El estanque de Iwasaki, el de Mitsubishi: **piedras traídas en barco de todo Japón** y un camino que cruza el agua a ras."
        lat: 35.6799810
        lon: 139.7977865
    comer:
      - comida: koffee-mameya-kakeru
        elegido: true
        nota: "El curso de café, con reserva por web: un grano, cuatro extracciones. Abre a las 11:00: coge el primer turno, y a las 12:30 al hotel."
      - comida: mikawa-zezankyo
        nota: "Tempura con estrella en Monzen-Nakachō, **nueve sitios** y reserva con semanas. El capricho del viaje en solitario."
  - block: Mediodía
    time: "~12:30"
    title: El cambio de hotel
    body: >-
      Diez minutos andando desde Kanda-Sudachō y ya estás en el hotel del grupo, **sin coger un solo
      tren**. Deja la maleta aunque no haya habitación —siempre la guardan— y resuelve lo práctico antes
      de que lleguen: comprar lo que falte, el **takkyūbin** si vas a mandar equipaje a los Alpes, y
      **recargar la tarjeta IC**.
    dim: true
    window:
      label: Un apunte de dinero
      body: >-
        Cuatro noches en dos hoteles distintos son **dos reservas**, y las dos salen de tu bolsillo, no
        del bote común. Tenlo separado desde el principio para que las cuentas del grupo no se enreden.
  - block: Tarde
    time: "14:00–16:30"
    title: Lo que te quedara pendiente
    body: >-
      La tarde es puro comodín, y el mejor uso está a un paseo de Akihabara: **Jinbōchō**, el barrio de
      las librerías de viejo, con [su ficha](#jimbocho) y su hilera de kissaten.

      Si te apetece más aire libre, el **valle de Todoroki**, al otro lado de la ciudad.
    window:
      label: O nada de esto
      body: >-
        Hoy también es legítimo no hacer nada. Llevas cuatro días andando y mañana empiezan ocho más,
        con tres personas que acaban de bajarse de un vuelo de veinte horas. **Guardar fuerzas es una
        opción con argumento.**
    ver:
      - nombre: Jinbōchō
        maps: Jimbocho Book Town Tokyo
        nota: Ciento treinta librerías de viejo. Casi todo cierra los domingos; hoy es viernes.
        lat: 35.6953570
        lon: 139.7597837
      - nombre: Valle de Todoroki
        maps: Todoroki Valley Setagaya
        nota: El único barranco de Tokio, en Setagaya, al otro lado de la ciudad.
        lat: 35.6051987
        lon: 139.6456467
      - nombre: "Puente Hijiribashi"
        maps: "Hijiribashi Bridge Ochanomizu"
        nota: "La primera escena de *Tokyo Vice*, sobre el río Kanda, a un paseo de Jinbōchō."
        lat: 35.6997231
        lon: 139.7655029
    comer:
      - comida: sabouru
        elegido: true
        nota: "Kissaten de **1955** con el mismo maestro desde entonces. *Pizza toast* y café. Cierra domingos: hoy sí."
      - comida: glitch-coffee
        nota: El café de tueste claro del barrio, entre las librerías.
  - block: Atardecer
    time: "17:00–18:15"
    title: Un cóctel en la planta 52, a la hora en que no se paga entrada
    body: >-
      Antes de ir a por ellos, la escena de *Lost in Translation*: el [New York Bar](#new-york-bar),
      en lo alto del Park Hyatt, que reabrió en diciembre de 2025 y dejó el bar como estaba. Abre a
      las 17:00, cuando el ventanal todavía tiene la última luz y Shinjuku se va encendiendo debajo; si
      el día está limpio, el Fuji sale recortado al oeste. Un cóctel en la barra y, a las seis y
      cuarto, al tren: Haneda queda a cincuenta minutos.

      Lo que no tendrás es el jazz: la música en directo empieza a las 18:30, a la vez que la entrada,
      y el grupo con cantante sale a las 19:15. Si lo quieres entero, cámbialo por el
      [Pit Inn](#shinjuku-pit-inn) del jueves por la noche y ven aquí a esa hora.
    window:
      label: Lo que cuesta
      body: >-
        Los precios llevan el impuesto y a la cuenta se le suma un **15 % de servicio**. Desde las
        18:30 se cobra además una **entrada de ¥3.300 por persona**. No se reserva y hay que tener 20
        años.

        - **Un cóctel antes de las 18:30**: de ¥2.640 en adelante en la carta, unos **¥3.000-4.000
        con el servicio** (18-24 €).

        - **Un cóctel con el jazz**, a partir de las 18:30: unos **¥6.300** (38 €). Dos, unos ¥9.400.

        - **Cenar en el New York Grill**, al lado: el menú de la casa, de cuatro o cinco platos, ronda
        los **¥26.000-30.000** por persona; con tres copas de vino, ¥30.360 con todo incluido (unos
        180 €). Se reserva en TableCheck, y hoy no cabe: sería el jueves, en lugar del ramen de Ōtsuka.
    ver:
      - nombre: New York Bar
        maps: New York Bar Park Hyatt Tokyo
        nota: "Planta 52 del Park Hyatt. Abre a las 17:00; desde las 18:30, ¥3.300 de entrada."
  - block: Noche
    time: "19:00–21:30"
    title: A Haneda, a por los otros tres
    body: >-
      El **CA 421** aterriza en **Haneda a las 19:50**, y vas a buscarlos. Llegadas internacionales,
      en la Terminal 3: entre inmigración y maletas, saldrán hacia las nueve menos cuarto, molidos,
      con ocho husos encima y sin cenar. Si llegas con tiempo, en la cuarta planta de la misma terminal
      hay una réplica de una calle de Edo y una terraza desde la que se ven despegar los aviones.

      Lleva encima desde mediodía la segunda copia del Zelda, que es el primer regalo del viaje: hoy
      no vuelves al hotel antes de Haneda. La vuelta la llevas tú,
      que ya te sabes el camino: monorraíl hasta Hamamatsuchō y la Yamanote
      hacia el norte, y en el hotel sobre las 21:30. A partir de aquí manda [el Día 1](#dia-1-vuelo)
      y esta sección se acaba.

      Lo mejor que puedes hacer por ellos es tener localizado **dónde se cena tarde y cerca**, porque a
      esa hora decidir es lo último que apetece. Y contarles lo justo: mañana el viaje empieza de cero
      para los cuatro.
    window:
      label: Antes de salir del hotel
      body: >-
        **Mira el vuelo en la web de Haneda o en la de Air China**: si viene con retraso, sales más
        tarde. Y lleva la tarjeta IC cargada para enseñarles a pasar el torno, que es lo primero que
        van a hacer en Japón.
