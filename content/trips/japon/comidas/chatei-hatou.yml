quePedir: >-
  Cualquier **filtrado por nel** (la manga de franela) y mirar cómo lo hacen. El *café au lait* se sirve en dos jarras.
body: >-
  A dos minutos del cruce más fotografiado del planeta y en las antípodas de él: madera oscura, silencio, una colección de tazas de porcelana europea y un barista que calienta cada taza, mide, vierte en espiral y tarda seis minutos en servir un café. Se filtra por ***nel***, una manga de franela que hay que lavar y guardar en agua — es el método más incómodo que existe y da la taza más limpia.


  Es la mejor respuesta posible al día 3, que es el día de las multitudes: se sale de Shibuya, se suben dos calles y el volumen del mundo baja de golpe.
