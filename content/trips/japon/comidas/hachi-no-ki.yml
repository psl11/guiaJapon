body: >-
  El ***shōjin ryōri*** es la cocina de los monasterios zen, y responde a un precepto muy concreto:
  **no matar**. Nada de carne ni de pescado —tampoco el caldo de bonito que lleva casi todo lo demás
  en este país—, ni ajo ni cebolla, que se consideran excitantes. Lo que queda es tofu de todas las
  texturas imaginables, verdura de montaña, algas, sésamo y una obsesión por **usar el ingrediente
  entero**, piel y tallo incluidos.


  Comerlo aquí tiene sentido porque **Kamakura es donde el zen entró en Japón**: se come al lado de
  Kenchō-ji, el monasterio más antiguo del país, la misma cocina que se sirve dentro. Los menús se
  presentan en bandejas de laca con cinco o seis platillos, y salen caros — pero también hay
  **soba y udon sueltos** a precio normal para quien solo quiera probar el sitio.


  Es, además, la respuesta a una pregunta que va a salir en el viaje: dónde come bien alguien que no
  come carne en un país donde el pescado está en el caldo de todo.
