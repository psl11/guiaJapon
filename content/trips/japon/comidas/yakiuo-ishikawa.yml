quePedir: "El menú de mediodía de *yakiuo*, con atún y pescado del día para asar en la mesa."
body: >-
  La idea del *yakiniku* aplicada al pescado: los cortes llegan crudos y se asan en la mesa. En la
  temporada pasada, el menú de mediodía llevaba dos piezas de *chūtoro*, dos de carrillera de atún y
  dos a elección de la casa.


  **Pablo comió aquí y le encantó.** Está en la planta baja, pared con pared con el Shinkan de
  [Sushi Sei](#tsukiji-sushi-sei), donde comió con Sergio en 2017, y solo cierra los lunes: el
  miércoles 25 abre.
