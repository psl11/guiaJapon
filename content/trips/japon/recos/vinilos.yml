title: Bebop y tres vinilos que suenan a Japón
area: Tokio · comprados el martes 3 en Shibuya · el Sakura de Yokota, todavía no
note: "Bebop, jazz japonés, city pop y YMO · sin tiradas limitadas · en cabina en el avión"
body: |-
  *Cowboy Bebop*, porque tiene gracia traerlo de Japón, y tres discos que trasladan a Japón al
  ponerlos en casa, sin pelearse con tiradas limitadas ni precios de subasta. Ya están comprados: el
  martes 3, entre [Tower Vinyl](#tower-vinyl-shibuya) y Amazon. Para lo que falte quedan la segunda
  mano de [HMV record shop](#hmv-record-shop-shibuya), la tienda de jazz de
  [Disk Union en Ochanomizu](#disk-union-jazztokyo) y su
  [tienda de anime en Shinjuku](#disk-union-anison-shinjuku).

  1. **Seatbelts, *Cowboy Bebop* (1998).** La banda sonora original, la de *Tank!*: el sitio
     exacto donde se cruzan el anime y el jazz, con Yoko Kanno y su banda. La edición en vinilo
     que no es de tirada limitada es el doble LP de Milan, de 2020. Las japonesas de 2023 (*Tank!
     Gold* y la caja de once discos) fueron de primera tirada limitada: si aparece *Tank! Gold* a
     su precio, es la que tiene gracia traerse; si no, no merece la pena perseguirla.
     [Ver la portada](https://www.discogs.com/search/?type=master&q=Seatbelts+Cowboy+Bebop).
  2. **Ryo Fukui, *Scenery* (1976).** El jazz que suena a Japón: un trío de piano de Sapporo, el
     primer disco de Fukui, olvidado durante décadas y hoy de culto. Es para escuchar de noche,
     despacio, como en un *jazz kissa*. En Tower está la reedición de We Release Jazz por ¥4.990.
     [Ver la portada](https://www.discogs.com/search/?type=master&q=Ryo+Fukui+Scenery).
  3. **Tatsuro Yamashita, *For You* (1982).** El Tokio de los ochenta en un disco: el *city pop*,
     el pop urbano japonés, con la portada de Eizin Suzuki. La reedición de 2023 fue de tirada
     limitada, pero el original de 1982 (RAL-8801) abunda de segunda mano y se ve a la venta desde
     unos ¥8.500. Mejor con su ***obi***, la faja de papel con el título en japonés.
     [Ver la portada](https://www.discogs.com/search/?type=master&q=Tatsuro+Yamashita+For+You).
  4. **Yellow Magic Orchestra, *Solid State Survivor* (1979).** El Japón futurista: el disco de
     *Rydeen* y *Technopolis*, con Haruomi Hosono, Yukihiro Takahashi y Ryuichi Sakamoto, que puso a
     Tokio en el mapa de la música electrónica. La edición japonesa original abunda de segunda mano
     y no es cara: mejor con su *obi*.
     [Ver la portada](https://www.discogs.com/search/?type=master&q=Yellow+Magic+Orchestra+Solid+State+Survivor).

  Los cuatro van juntos: Bebop para el anime, Fukui para el jazz, Yamashita para la ciudad y YMO
  para el Japón que venía. Si sobra sitio, dos suplentes: el ambient de Hiroshi Yoshimura, *Green*
  (1986) o *Music for Nine Post Cards* (1982), los dos con reedición normal; y el *Lupin III* de
  1978 de Yuji Ohno, que murió en mayo y que Nippon Columbia reeditó el 21 de octubre a ¥5.000 más
  impuestos.

  **Y el que falta: Susumu Yokota, *Sakura* (1999).** Venía en tu lista, no en esta, y es el disco más
  vendido de Yokota, el de la música electrónica japonesa más tranquila. El sello británico Lo
  Recordings lo reeditó en 2025 en doble vinilo azul, dentro de su serie *Skintone Edition*: en una
  tienda inglesa ya está agotado, y en otras de Europa se vende por unos 44-46 €. En Tokio es un
  importado, así que se busca en las tiendas de música electrónica: las de música de club de Disk
  Union, con una en Shinjuku-sanchōme a un paso del [Pit Inn](#shinjuku-pit-inn), y Technique, en
  Shibuya. Si no aparece, desde casa sale más barato.

  **Y uno que no: Expedition 33.** La banda sonora de *Clair Obscur*, de Lorien Testard, la edita
  Laced Records, un sello británico: el doble LP salió a £36. No tiene edición japonesa, así que en
  Tokio sería un importado y más caro. Se pide desde casa.

  **Al comprar**

  - **El *obi*, entero.** Sin él, una edición japonesa pierde buena parte de lo que vale.
  - **El estado va por separado**: 盤 es el disco y ジャケ, la funda. Mira las dos notas.
  - **El martes 3 es el día del disco japonés** (レコードの日): a medianoche salen ediciones
    limitadas en vinilo. El miércoles todavía queda algo en las estanterías.
  - **El *tax-free***, desde el 1 de noviembre, se paga entero y se devuelve en la aduana de salida,
    como el reloj de tu padre. Pregunta en caja: las tiendas pequeñas no siempre lo hacen.
  - **La vuelta a casa.** Los compraste el 3 y vuelas el 14, con los Alpes por medio. Mándalos por
    [takkyūbin](#takkyubin) al [Candeo Roppongi](#candeo-roppongi), donde duermes desde el 12
    —avisa al hotel de que llega un paquete—, y en el avión, en cabina y de pie. En la maleta
    facturada se doblan o se parten.
