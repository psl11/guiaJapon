body: |
  El mirador de la torre Mori, en la planta 52, es un anillo de cristal a unos 250 metros sobre el
  mar. Mira a toda la ciudad y tiene a la Torre de Tokio de frente, cosa que no puede ofrecer la
  propia torre. Hacia el oeste, a unos cien kilómetros, queda el Fuji. Pablo ha subido en varios
  viajes a intentar verlo y lo recomienda.

  - **Cuándo:** con los cuatro no hay hueco con luz de día. El jueves 12 llegáis de noche, el
    viernes salís a las ocho y cuarto y el mirador abre a las diez, y el sábado os separáis. Queda el domingo
    15 para los tres: al atardecer, en lugar del mirador de Ebisu, si el cielo está limpio. A esa hora el
    Fuji, si sale, sale recortado en negro contra el cielo naranja.
  - **Cuánto:** ¥2.600 el domingo, que cuenta como fin de semana. Entre semana son ¥2.400.
  - **La azotea:** el Sky Deck, la terraza abierta de arriba, se pagaba aparte, y las fuentes no
    coinciden en si sigue abriendo. Preguntad en taquilla.

  Al bajar, la avenida de Keyakizaka ya está encendida, y la cena de Azabu-Jūban queda a un paseo cuesta
  abajo.
