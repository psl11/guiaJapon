queEs: >-
  Lager clara y muy seca —Asahi, Kirin, Sapporo, Yebisu—, servida **muy fría y con dos dedos de espuma** que aquí se consideran obligatorios. La *nama biiru* (de barril) es el estándar. Y desde hace quince años, una escena de cerveza artesana pequeña pero muy buena.
historia: >-
  La cerveza la trajeron los holandeses a Nagasaki, pero la industria arranca en **Hokkaidō en 1876** con Sapporo, montada por el gobierno Meiji con un técnico que había ido a formarse a Alemania. La estrella de la etiqueta de Sapporo es la **Estrella del Norte**, el emblema de la agencia de colonización de Hokkaidō: es literalmente una marca de la política colonial japonesa del XIX.
dondeMejor: "Sapporo, en Hokkaidō · y las *beer halls* de Ginza y Yebisu"
picante: "—"
veg: "**Sí**"
body: >-
  La costumbre que hay que conocer: en una cena de grupo, **la primera ronda es cerveza para todos** —*toriaezu nama*, «de momento, una de barril»— y se brinda antes de que nadie beba. Nadie toca su vaso hasta el *kanpai*. A partir de la segunda ronda, cada uno lo suyo.


  Y una que sorprende: **no se llena uno su propio vaso**. Se sirve a los demás y alguien te sirve a ti; si tu vaso está lleno, es que alguien está pendiente. Levantar un poco el vaso mientras te sirven es la manera de dar las gracias sin hablar.
