body: >-
  Doce asientos y un solo plato que importa. Abre a las 11:30 y **cierra cuando se acaba la masa**,
  así que el domingo hay cola desde antes de abrir. Cierra los martes y los miércoles. Es la
  referencia si el día sale con tiempo; si la cola es larga, cualquier casa de Nakamachi que muela a
  la vista vale igual.
