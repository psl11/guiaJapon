body: >-
  Una lista de cinco cenas en Kioto que llega con dirección exacta y poco más. **Va aquí como pista,
  no como recomendación verificada**: a diferencia del resto de fichas de esta guía, no he
  comprobado horarios, precios ni si siguen abiertos. Sirve para tener nombres a mano si una noche
  se cae el plan.

  - **Muni** — izakaya. Zaimokuchō 186, 2ª planta, Nakagyō.
  - **Oni Tofu** — tofu. Suhamachō 647-2, Shimogyō.
  - **Kobe Beef Kisshokichi** — teppanyaki. Kamiōsakachō 521, 8ª planta, Nakagyō.
  - **Yakiniku Genshu Goshu** — yakiniku. Tanaka Monzenchō 103, Sakyō.
  - **Pontochō Kiraku** — shabu-shabu y sukiyaki. Kashiwayachō 169-2, Nakagyō.


  De los cinco, el de Pontochō es el que mejor encaja con el itinerario: **el día 12 termina
  precisamente ahí**, y en esa misma calle está [GANSAN](#gansan-pontocho), que sí está comprobado y
  tiene reservados al río.
