body: >-
  El [sushi](#sushi) de referencia de [Kioto](#kioto) según quien vive allí, y no es un sitio de guía: barra estrecha,
  sin decoración y con cola en la puerta casi siempre. Kioto **no tiene mar** —está a una hora de la
  costa— y por eso su tradición no es el sushi sino el pescado curado y prensado, el *saba-zushi*.
  Que aun así haya una barra a este nivel dice bastante de la ciudad.


  La regla es la de siempre en las barras buenas: **dejarse llevar**, no pedir de carta y no
  preguntar el precio hasta el final. Se sale por bastante menos de lo que costaría lo equivalente en
  Tokio.
