slug: japon
title: Japón, *bajando* del otoño
eyebrow: Tokio · los Alpes · Hida · Kioto · Hiroshima — 6 a 26 de noviembre de 2026
heroMeta: 21 días · cuatro viajeros, tres de ellos por primera vez
heroImage:
  src: img/hero/portada-ancha.webp
  srcAlta: img/hero/portada-alta.webp
  alt: >-
    Ilustración: un Blastoise vestido de samurái, con hachimaki y shuriken, ante el monte Fuji, un
    torii sobre el agua y arces rojos. Arriba, la caligrafía 日本の旅, «viaje a Japón»
quote: >-
  En Japón, el otoño no llega: baja. Empieza en las cumbres a finales de septiembre y tarda dos meses
  en alcanzar los arces de la ciudad.
quoteAttr: El *kōyō zensen*, el «frente de la hoja roja», que los periódicos publican como si fuera el tiempo
lede: >-
  Tres semanas en un bucle: Tokio, los Alpes japoneses, Hida, Kioto, Hiroshima y vuelta a Tokio a
  cerrar. Y una guía escrita desde una posición rara, porque para uno de los cuatro es el **quinto
  viaje** y para los otros tres el **primero**. Así que hace dos cosas a la vez: cuenta los clásicos
  —los de verdad, los que hay que ver la primera vez— como si nadie los hubiera contado antes; y al
  lado, en voz baja, deja las salidas laterales para quien ya los conoce. Ninguna de las dos sobra.
relato:
  navLabel: Los lugares
  anchor: japon
  overline: Y ahora, los sitios
  title: Los lugares, *uno a uno*
  dek: >-
    A partir de aquí, una ficha por sitio, **agrupadas por ciudad y en el mismo orden en que el viaje
    las va encontrando**: Tokio, Kamakura, los Alpes, Hida, Kioto, Osaka, Hiroshima y la vuelta a
    Tokio. No son listados de qué ver: son el porqué de cada sitio —lo que hay que mirar, a qué hora
    y qué historia lleva detrás—, para leerlas la víspera y no delante del monumento.
historia:
  navLabel: La historia
  anchor: historia
  overline: Y por debajo de todo
  title: Mil quinientos años, *en seis actos*
  dek: >-
    Cierra la guía lo que la sostiene por debajo. Seis capítulos que se leen del tirón, de los
    primeros kami a las décadas perdidas, y que explican por qué un torii es una frontera, un
    castillo es un arma y una hoja roja es una tradición de mil años. Cada acto termina señalando
    dónde se toca con las manos durante el viaje.
rationale: >-
  **Veintiún días en dos bucles**, no en línea recta: los dos salen de Tokio y vuelven a Tokio, uno
  hacia la montaña y otro hacia el oeste, y entre los dos está la despedida. Dos noches de Tokio al
  principio, tres en medio y cinco al final, **en dos barrios distintos y a propósito**
  —[Akihabara](#akihabara) mientras se sube y se baja de los Alpes, [Shinjuku](#shinjuku) al
  cerrar—, y once noches de mudanza casi diaria repartidas entre los dos arcos.

  El giro que hace este viaje distinto de los demás está al principio, y tiene fecha de caducidad
  literal: **Kamikōchi cierra el 15 de noviembre**. La carretera se corta hasta abril y el valle se
  queda solo con la nieve. Se entra el 9, seis días antes del cierre, con la hoja ya caída, las
  cumbres del Hotaka blancas y prácticamente nadie. No es la postal dorada de octubre; es algo mejor
  y más difícil de contar. Casi ninguna guía manda a los Alpes cuando puede mandarte a Kioto.

  Lo demás sale de dos decisiones. La primera: **la montaña va delante**, casi de entrada, porque el
  cuarto viajero vuelve a España el 14 y así se lleva el tramo que de verdad distingue al viaje —y
  porque una despedida en un hotel de Tokio es mejor que una en un cruce de carreteras a mil
  quinientos metros. La segunda: **Tokio se guarda para el final**, que no es relleno sino
  aritmética — el pico de la hoja roja en la ciudad va del **20 de noviembre al 5 de diciembre**, así
  que los cinco últimos días caen justo dentro y los tres barrios grandes se ven en su mejor semana.

  En medio, lo que queda de camino y casi nadie hace: Matsumoto y su castillo negro, el mejor
  conservado del país; Hida y Kanazawa; y luego Kioto con tiempo de verdad, Nara, y el oeste hasta
  Hiroshima.

  Y una advertencia sobre esta guía: **el grupo se parte el 14 de noviembre**, la novena jornada.
  Uno vuela a Barcelona desde Narita esa mañana y los otros tres siguen hasta el 26. Aquí está
  contado el viaje entero, porque una guía que se acabara a mitad no le serviría a nadie.
