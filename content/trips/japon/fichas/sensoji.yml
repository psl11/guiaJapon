kicker: Tokio · el templo más antiguo
title: Sensō-ji y el barrio de Asakusa
epithet: >-
  El templo más antiguo de Tokio, fundado —dice la leyenda— por dos pescadores en el año 628, y hoy
  el más visitado de Japón. La gracia no está en el edificio, que es de hormigón: está en la hora a
  la que se llega.
sections:
  - heading: Dos pescadores y una estatuilla
    body: |
      La historia fundacional es del año **628**: dos hermanos pescadores sacaron del río Sumida, en
      sus redes, una pequeña imagen de **Kannon**, la deidad budista de la misericordia. Su señor
      hizo de su casa un templo para guardarla, y de ahí creció todo. La imagen sigue oficialmente
      ahí y **nadie la ha visto nunca**: es un *hibutsu*, un «buda oculto» que no se muestra jamás,
      ni siquiera cuando se saca en procesión una réplica.

      Se entra por el **Kaminarimon**, la «puerta del trueno», con su farol rojo colgando en el
      centro: cuatro metros de alto y **unos 670 kilos**. Detrás, los doscientos metros de la
      **Nakamise-dōri**, una de las calles comerciales más antiguas del país, con puestos de
      *sembei* tostados a la vista y *ningyō-yaki* saliendo del molde.
  - heading: Lo que es de verdad antiguo
    body: |
      Conviene saberlo para mirar bien: **el templo que veis no es antiguo**. Sensō-ji ardió en el
      bombardeo de marzo de 1945 y lo que hay hoy es una reconstrucción de posguerra en hormigón —el
      tejado del salón principal se rehízo hace poco con **tejas de titanio**, más ligeras y a prueba
      de terremotos—. Es un edificio del siglo XX con mil cuatrocientos años de culto encima.

      Pero al lado sí hay algo original, y casi nadie se para: el **Asakusa-jinja**, un **santuario
      shintō** dedicado a los dos hermanos pescadores y a su señor —los tres hombres del mito—,
      levantado por el shōgun **Tokugawa Iemitsu hacia 1649**. Sobrevivió a los incendios, al
      terremoto de 1923 y a las bombas. Es decir: **el edificio de verdad viejo del recinto es el
      santuario, no el templo**, y está a treinta metros a la derecha del salón principal. Ahí, además,
      se aplaude.
  - heading: A qué hora
    body: |
      Sensō-ji recibe unos treinta millones de visitantes al año y a media mañana la Nakamise es una
      cinta transportadora de gente. La solución no es evitarlo, es **madrugar**: **el recinto está
      abierto de noche y de día** —solo el salón principal cierra, y abre a las **6:00**—, así que a
      las seis de la mañana se puede recorrer todo con las persianas bajadas y sin nadie. Y luego
      volver a las nueve, cuando abre, para ver el mismo sitio convertido en un mercado. Son dos
      lugares distintos con el mismo nombre.
curiosidades:
  - >-
    La imagen de Kannon que da origen al templo es un ***hibutsu***, un «buda oculto»: lleva
    catorce siglos guardada y **nunca se muestra al público**, ni siquiera a los monjes. Lo que se
    saca en las procesiones es una copia.
  - >-
    El edificio verdaderamente antiguo del recinto no es el templo sino el **Asakusa-jinja**, el
    santuario de 1649 dedicado a los dos pescadores que sacaron la estatuilla del río. Sobrevivió a
    los incendios de Edo, al terremoto de 1923 y a los bombardeos de 1945.
  - >-
    El farol del **Kaminarimon** pesa unos **670 kilos**. Se sustituye cada diez años, y en la base,
    si os agacháis a mirar, hay un dragón tallado en madera.
