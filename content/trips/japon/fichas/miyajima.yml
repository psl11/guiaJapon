title: Miyajima, la isla que era el dios
image:
  src: img/fichas/miyajima.webp
  alt: "El torii flotante de Itsukushima al atardecer, rodeado de agua, con las montañas al fondo."
  credit: "Pablo Sánchez"
epithet: >-
  El santuario de Itsukushima está construido sobre pilotes en el mar por una razón que no es
  estética: **la isla entera se consideraba el kami**, y pisarla era profanarla. Los fieles llegaban
  en barca, cruzaban el torii por agua y entraban al santuario sin tocar tierra sagrada. Todo lo que
  parece un capricho fotogénico es teología.
sections:
  - heading: Un santuario que flota porque no podía tocar el suelo
    body: |
      La isla se llama en realidad **Itsukushima**; *Miyajima* significa «isla-santuario» y es el
      apodo que se le quedó. Fue territorio sagrado desde antes de que hubiera nada construido: la
      montaña, el bosque y la isla eran ya la divinidad, y por eso **estaba prohibido nacer y morir
      en ella**. Las embarazadas y los enfermos graves se trasladaban al continente, y durante siglos
      **no hubo cementerios** — la norma se relajó en el siglo XIX, pero la isla sigue sin
      tanatorios.

      El santuario que hoy se ve lo mandó ampliar en **1168** **Taira no Kiyomori**, el guerrero que
      llegó a mandar sobre el Japón imperial antes de que su clan fuera aniquilado por los Minamoto
      —el mismo pulso que abre el [acto 2](#acto-2-kamakura)—. Lo levantó sobre el agua, con
      pasarelas de tablas separadas a propósito **para que la marea suba entre ellas sin arrancarlas**
      y un escenario de danza *bugaku* al aire libre. Es Patrimonio de la Humanidad desde 1996.
  - heading: El torii, y la marea que decide la visita
    body: |
      El **ō-torii**, la gran puerta bermellón de dieciséis metros en el agua, es probablemente la
      imagen más reproducida de Japón. Ha habido ocho a lo largo de la historia; **el actual es de
      1875**, de alcanfor, y su detalle asombroso es que **no está clavado ni cimentado**: se sostiene
      solo por su propio peso, unas sesenta toneladas, con los pilares apoyados sobre el fondo y las
      patas laterales lastradas con piedras dentro. Terminó una restauración larga en **diciembre de
      2022** y vuelve a estar despejado.

      El dato que ordena el día es otro: **la isla es dos sitios distintos según la marea**.

      - **Marea alta** — el santuario y el torii flotan. Es la postal, y la buena hora es el
        atardecer, cuando se ilumina.
      - **Marea baja** — la bahía se queda seca y **se puede caminar hasta el pie del torii**, tocar
        la madera y ver las monedas que la gente encaja en las grietas. Es otra experiencia, no peor.

      **Se puede tener las dos en un mismo día** si se mira antes la tabla de mareas (la publica el
      propio santuario) y se ordena la jornada en consecuencia. Es el único plan de Japón que
      conviene consultar con un calendario lunar en la mano.
  - heading: El monte Misen, y una llama de mil doscientos años
    body: |
      Detrás del santuario sube el **monte Misen**, 535 metros, por un bosque primario que **no se ha
      talado nunca**. Hay teleférico hasta cerca de la cima y unos veinte minutos finales a pie —
      arriba, la vista del mar interior de Seto salpicado de islas.

      En la subida está el **Reikadō**, la «sala de la llama sagrada», donde arde un fuego que la
      tradición atribuye a **Kūkai (Kōbō Daishi)** hace más de mil doscientos años y que no se ha
      apagado desde entonces. De esa llama se encendió la **Llama de la Paz de Hiroshima**, a treinta
      minutos de aquí. Las dos cosas —la ruina y el fuego antiguo— se miran desde orillas opuestas de
      la misma bahía.

      Miyajima es además uno de los ***Nihon Sankei***, las **tres vistas clásicas de Japón** que
      catalogó un erudito en 1643, junto con Amanohashidate y Matsushima. Es una de esas listas que
      allí se toman muy en serio.
  - heading: Ciervos, arces y una tarta con forma de hoja
    body: |
      - Hay **ciervos sueltos** como en Nara, también considerados mensajeros de los kami — pero aquí
        **está prohibido darles de comer** desde 2008, y son bastante menos agresivos por eso. Aun
        así se comen los mapas: no llevar papeles a mano.
      - El ***Momiji-dani***, el «valle de los arces», es un desfiladero de arces japoneses a la
        entrada del teleférico que **en la segunda quincena de noviembre es de los mejores del oeste
        del país**. Ver la [ficha del momiji](#momiji).
      - De ahí sale el dulce de la isla: los ***momiji manjū***, bizcochitos **con forma de hoja de
        arce** rellenos de pasta de judía roja, crema o chocolate, que se venden calientes recién
        hechos en máquinas a la vista. Es la mejor merienda de Japón por menos de dos euros.
      - Y la especialidad salada: **ostras a la brasa** en los puestos de la calle principal, y
        ***anago-meshi***, congrio de mar sobre arroz, que es el plato clásico de la isla.

      **Cómo se llega**: tren JR desde Hiroshima hasta Miyajimaguchi (25 min) y **ferry, 10
      minutos**. Desde 2023 hay una **tasa de visitante** de 100 yenes que se paga al embarcar.
      Dormir en la isla cambia el sitio por completo: **los últimos ferries se llevan a casi todo el
      mundo** y a partir de las seis de la tarde quedan los ciervos, las farolas y el torii
      iluminado.
curiosidades:
  - >-
    El santuario está construido **sobre el agua porque la isla entera era el kami** y pisarla se
    consideraba profanación. Durante siglos **estuvo prohibido nacer y morir en ella**, y no había
    cementerios.
  - >-
    El gran torii **no está clavado ni cimentado**: se sostiene por su propio peso, unas sesenta
    toneladas, con las patas lastradas con piedras. El actual es de **1875** y salió de restauración
    en diciembre de 2022.
  - >-
    En el monte Misen arde una llama que la tradición atribuye a **Kūkai hace más de 1.200 años** y
    que no se ha apagado nunca. De ella se encendió la **Llama de la Paz de Hiroshima**.
