body: >-
  Dos posts distintos cuentan lo mismo en dos sitios que este viaje pisa: hay tiendas de palillos
  donde **se elige la madera, el grosor y el acabado y te los graban en el momento**, en inglés o en
  japonés, y **el grabado es gratis**. Tardan unos cinco minutos. Una está en la calle comercial de
  Kamakura, que el día 8 recorre camino del Hachimangū; la otra en la de Miyajima, el día 16.


  El detalle que los hace útiles de verdad y no un souvenir más: **muchos son aptos para
  lavavajillas**, cosa rara en la laca japonesa, así que se usan en casa en vez de acabar en un cajón.


  Es la versión rápida de lo mismo que hay en [Kawagoe](#alba-wood-works-kawagoe) y en
  [Asakusa](#alba-zen-craft-asakusa), donde en vez de comprarlos hechos te los tallas tú en media
  hora. Entre las cuatro opciones, la decisión razonable es una y no cuatro.
