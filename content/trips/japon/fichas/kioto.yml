title: Kioto, la ciudad que fue el país
image:
  src: img/fichas/kioto-noche.webp
  alt: "Un callejón empedrado de Kioto de noche, con farolillos encendidos y un muro de piedra con hojas de otoño."
  credit: "Pablo Sánchez"
epithet: >-
  Kioto fue la capital de Japón desde el 794 hasta 1868: **mil setenta y cuatro años**. Todo lo que
  se considera «japonés» —la ceremonia del té, el teatro nō, los jardines secos, la cocina kaiseki,
  las geishas— se inventó o se refinó aquí. No es una ciudad con monumentos: es la ciudad donde se
  fabricó la idea de Japón.
sections:
  - heading: Una retícula china de mil doscientos años
    body: |
      El emperador **Kanmu** fundó la ciudad en el 794 y la llamó *Heian-kyō*, «capital de la paz
      y la tranquilidad». La trazó copiando Chang'an, la capital de la China Tang: una cuadrícula
      perfecta orientada al sur, con el palacio en el norte y una avenida central de ochenta metros
      de ancho.

      Aquella retícula **sigue debajo**. Por eso Kioto es la única ciudad grande de Japón donde uno
      se orienta sin mapa: las calles van norte-sur y este-oeste, y muchas conservan su número
      original —*Shijō* es «cuarta avenida», *Sanjō* la tercera—. Las montañas cierran la ciudad por
      tres lados, que es exactamente lo que buscaba la geomancia china, y también la razón de que en
      verano sea un horno y en invierno un congelador.
  - heading: Por qué sigue en pie
    body: |
      Kioto se ha quemado muchas veces —la guerra **Ōnin** (1467-1477) la arrasó casi entera y buena
      parte de lo que se visita es reconstrucción posterior— pero se libró de lo que borró a las
      demás: los bombardeos de 1945.

      No fue casualidad. Kioto figuraba en la lista corta de objetivos atómicos, y fue retirada de
      ella. La versión más aceptada atribuye el veto al secretario de Guerra **Henry Stimson**, que
      había visitado la ciudad y presionó al presidente Truman hasta sacarla. Se sustituyó por
      Nagasaki. Es un dato que conviene tener en la cabeza al pasear: la ciudad más intacta de
      Japón lo es por una decisión de despacho, y otra ciudad pagó el cambio.
  - heading: Cómo está repartida
    body: |
      Kioto no se recorre entera: se hace por zonas, y cada una pide media jornada.

      - **Higashiyama (este)** — la ladera de [Kiyomizu-dera](https://www.google.com/maps/search/?api=1&query=Kiyomizu-dera%20Kyoto), las cuestas empedradas, [Gion](https://www.google.com/maps/search/?api=1&query=Gion%20Kyoto). Es la
        parte que todo el mundo tiene en la cabeza. Ver [Higashiyama](#higashiyama).
      - **Noroeste** — el **Kinkaku-ji** dorado y el jardín seco del [**Ryōan-ji**](https://www.google.com/maps/search/?api=1&query=Ryoanji%20Temple%20Kyoto), a un autobús largo
        del centro. Ver [Kinkaku-ji](#kinkakuji).
      - **Sur** — **Fushimi Inari** y sus torii, abierto veinticuatro horas. Ver
        [Fushimi Inari](#fushimi-inari).
      - **Oeste** — **Arashiyama**: el bambú, el río, los monos. Ver [Arashiyama](#arashiyama).
      - **Centro** — el mercado de [**Nishiki**](https://www.google.com/maps/search/?api=1&query=Nishiki%20Market%20Kyoto), cinco manzanas cubiertas de puestos, y el
        [**Nijō-jō**](https://www.google.com/maps/search/?api=1&query=Nijo%20Castle%20Kyoto), el castillo de los Tokugawa con los suelos que chirrían a propósito.

      El transporte es el punto flaco: **el metro solo cubre dos líneas en cruz** y casi todo se hace
      en autobús urbano, que en temporada va lleno. Andar y usar taxi para los tramos largos suele
      salir mejor que pelearse con las paradas.
  - heading: Noviembre, el mes imposible
    body: |
      Kioto en noviembre es el **momiji** en su versión más famosa y más masificada del país: la
      segunda quincena es el pico, y templos como [Tōfuku-ji](https://www.google.com/maps/search/?api=1&query=Tofukuji%20Temple%20Kyoto) o [Eikan-dō](https://www.google.com/maps/search/?api=1&query=Eikando%20Zenrinji%20Kyoto) llegan a colas de una hora.
      Ver la [ficha del momiji](#momiji).

      Las dos defensas que funcionan: **madrugar de verdad** —los recintos abren a las 6:00 o las
      8:00 y la primera hora es otra ciudad— y las aperturas nocturnas (*raitoappu*), en las que
      varios templos iluminan el jardín hasta las 21:00. Cuestan un poco más y merecen la pena; la
      lista concreta la publica cada templo en octubre.
  - heading: Lo que se come aquí
    body: |
      Kioto no tiene mar y su cocina se construyó con lo que había tierra adentro, que resultó ser
      mucho: es la **capital gastronómica más refinada del país** y la cuna de dos cosas.

      El ***kaiseki***, la alta cocina por pases, nació aquí de la ceremonia del té y sigue teniendo
      en Kioto sus casas de referencia — carísimas de noche y sorprendentemente accesibles al
      mediodía, que es la regla de oro de comer bien en Japón. Y el tofu, que aquí es materia
      prima seria: por las aguas subterráneas de la ciudad y la calidad de la soja, el *tofu* de
      Kioto tiene fama de ser el mejor de Japón, y hay casas dedicadas solo a él —el *yudōfu*,
      hervido en caldo de alga delante de uno, es plato de invierno y de templo.

      Añadid a eso el ***obanzai*** —la comida casera kiotense de verduras y encurtidos, que se sirve
      en platillos— y el mercado de [**Nishiki**](https://www.google.com/maps/search/?api=1&query=Nishiki%20Market%20Kyoto), cinco manzanas cubiertas donde se come de pie.

      Los sitios concretos, con dirección y precio, están en
      [la sección de gastronomía](#gastronomia): cafés, [sushi](#sushi) y la azotea del atardecer.
curiosidades:
  - >-
    **Kioto fue capital durante 1.074 años** (794-1868) y nunca se le retiró el título formalmente:
    el emperador Meiji «se mudó» a Tokio y no se firmó ningún decreto de traslado. Hay kiotenses que
    todavía lo mencionan.
  - >-
    La ciudad **estuvo en la lista de objetivos de la bomba atómica**. La sacó de ella el secretario
    de Guerra **Henry Stimson**, que la había visitado. En su lugar entró **Nagasaki**.
  - >-
    Las calles se llaman por su número: ***Shijō*** es «cuarta avenida» y ***Sanjō*** la tercera.
    Son los nombres de la retícula del año **794**, copiada de la capital china de Chang'an, y
    siguen sirviendo para orientarse.
