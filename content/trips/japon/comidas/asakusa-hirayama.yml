quePedir: >-
  ***Seiro soba*** fría, para juzgar el fideo desnudo, y probarla **primero con sal** antes de mojarla.
body: >-
  ***Juwari***: cien por cien trigo sarraceno, sin nada de trigo común que ate la masa. Es la versión difícil de la soba —se rompe con mirarla— y la única en la que se huele de verdad el cereal. Muelen el grano ellos, cultivan parte y llevan **tres años seguidos con Bib Gourmand**.


  Encaja donde nada más encaja: el día 2 termina en Asakusa a media mañana y aquí se come a dos minutos de Tawaramachi, sin volver al centro. Reservad — se llena por completo con reservas y cierran cuando se acaba la masa del día.
