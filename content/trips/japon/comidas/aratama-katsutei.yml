body: >-
  Un [tonkatsu](#tonkatsu) de los buenos en el sitio donde más falta hace: a un minuto de la
  estación, al pie de Komachi-dōri, justo donde se cruza el día entre el santuario y el tranvía.
  Usa **cerdo de raza** —de Nasu Kōgen y Kurobuta de Kirishima, según la prensa local— y sirve en
  un edificio de almacén tradicional, con tejado de teja y *noren* blanco en la puerta.


  Lo que lo hace práctico es el horario: **abre de 11:00 a 22:00 sin cerrar a media tarde** y no
  tiene día fijo de descanso. En un sábado de Kamakura, donde las cocinas pequeñas cierran a las
  dos, es la comida que no falla. Es la casa madre de una pequeña cadena que tiene también locales en
  Yokohama.
