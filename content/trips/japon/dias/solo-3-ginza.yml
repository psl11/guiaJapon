blocks:
  - block: Mediodía
    time: "13:00–13:45"
    title: Un ramen de Ippudo, de camino
    body: >-
      Comida rápida y sin pensar: un Ippudo, el que pille de camino. Desde Shimbashi, el de Ginza
      4-chōme queda a un paseo, y de ahí a la estación de Hibiya son unos diez minutos andando; la
      Toei Mita va directa a Jinbōchō. El *katsu sando* que recomendaba tu familia no abre hasta las
      15:00, y no cabe.
    comer:
      - comida: ippudo-ginza
        elegido: true
        nota: "El de 4-chōme, a dos manzanas del Kabuki-za. Cualquier otro Ippudo de camino vale igual."
  - block: Primera tarde
    time: "14:00–15:30"
    title: Jinbōchō, el barrio de los libros viejos
    body: |-
      Las librerías de Kanda que te recomendaron son las de Jinbōchō, el barrio de los libros de viejo,
      con [su ficha](#jimbocho) y su hilera de *kissaten*. Son unas ciento treinta tiendas y casi todas
      cierran hacia las seis, así que van antes que nada. Se empieza por la que cierra antes:

      - **Italia Shobō** (Jinbōchō 2-23): libros en italiano, español y portugués, también antiguos.
        Abre de 10:00 a 17:00 y cierra los fines de semana y los festivos, así que hoy es el día.
      - **Kitazawa** (1902): libros en otras lenguas, sobre todo en inglés, con un rincón pequeño de
        español, francés y alemán.
      - **Isseidō**: la gran librería de libro antiguo, en un edificio de 1931.

      Para la foto, la esquina de **Yaguchi Shoten**, con la fachada forrada de estanterías hacia la
      calle, y los carritos de saldo en la acera. El café, en el Sabouru.
    ver:
      - nombre: Italia Shobō
        maps: "イタリア書房 神保町"
        nota: "Libros en italiano, español y portugués. De 10:00 a 17:00; cierra fines de semana y festivos."
      - nombre: Kitazawa Shoten
        maps: Kitazawa Bookstore Jimbocho
        nota: Libros en otras lenguas desde 1902, sobre todo en inglés, con algo de español.
      - nombre: Isseidō
        maps: Isseido Booksellers Jimbocho
        nota: Libro antiguo japonés y extranjero, en un edificio de 1931.
      - nombre: Yaguchi Shoten
        maps: Yaguchi Shoten Jimbocho
        nota: La esquina con las estanterías en la fachada, la foto del barrio.
    comer:
      - comida: sabouru
        elegido: true
        nota: "Kissaten de **1955** con el mismo maestro desde entonces. Cierra los domingos: hoy, abierto."
      - comida: glitch-coffee
        nota: El café de tueste claro del barrio, entre las librerías.
  - block: Atardecer
    time: "15:30–16:45"
    title: Ochanomizu y el Kanda Myōjin, con la última luz
    body: >-
      Del cruce de Jinbōchō se sube andando por la Meidai-dōri, unos diez minutos, hasta Ochanomizu.
      Primero, la cúpula verde de la **Nikolai-dō**, la catedral ortodoxa de 1891. Enseguida, el
      **puente Hijiribashi**, sobre el río Kanda: es el de la primera escena de *Tokyo Vice*, y la foto
      clásica del barrio. Espera a que el metro rojo de la Marunouchi salga del túnel y cruce el río
      por debajo de los trenes amarillos y naranjas de la JR.


      Al otro lado del puente está el **Yushima Seidō**, el templo de Confucio, y a tres minutos el
      **Kanda Myōjin**, el santuario de Akihabara, que bendice ordenadores. El sol se pone a las
      16:40, y la puerta bermellón con los farolillos encendiéndose es la foto de la tarde. Para bajar,
      la antigua estación de ladrillo de Manseibashi, hoy **mAAch ecute**: arriba hay una plataforma de
      cristal entre las vías de la Chūō, con los trenes pasando a los dos lados. De ahí a la estación
      de Akihabara son cinco minutos.
    ver:
      - ficha: akihabara
        nota: El barrio de al lado, con el santuario de los ordenadores y la catedral rusa.
      - nombre: Nikolai-dō
        maps: Nikolai-do Holy Resurrection Cathedral Tokyo
        nota: La catedral ortodoxa de 1891, con su cúpula verde.
      - nombre: Puente Hijiribashi
        maps: Hijiribashi Bridge Ochanomizu
        nota: "La primera escena de *Tokyo Vice*, y el metro rojo cruzando el río."
        lat: 35.6997231
        lon: 139.7655029
      - nombre: Yushima Seidō
        maps: Yushima Seido Tokyo
        nota: El templo de Confucio, al otro lado del puente.
      - nombre: Kanda Myōjin
        maps: Kanda Myojin Shrine Tokyo
        nota: El santuario que bendice ordenadores, con la puerta bermellón al atardecer.
        lat: 35.7019403
        lon: 139.7677388
      - nombre: mAAch ecute Kanda Manseibashi
        maps: mAAch ecute Kanda Manseibashi
        nota: La estación de ladrillo de Manseibashi hecha tiendas, con trenes a los dos lados.
  - block: Vuelta
    time: "16:55–18:15"
    title: La maleta, la habitación y el onsen
    body: >-
      La maleta va justo antes de la habitación: JR de Akihabara a Shimbashi, ocho minutos, se saca de
      la taquilla y se vuelve por la misma línea. De la estación al
      [Super Hotel](#super-hotel-premier-akihabara) son siete u ocho minutos a pie.


      El onsen abre a las 15:00, y da tiempo a un baño corto antes de cambiarse; por la tarde, la
      bebida es gratis. Para el New York Bar hay código de vestimenta: nada de pantalón corto ni
      chanclas.
    dim: true
  - block: Primera noche
    time: "18:30–19:20"
    title: Kagurazaka, con los farolillos encendidos
    body: >-
      La otra recomendación de tu familia. Kagurazaka es la cuesta del antiguo barrio de geishas, y le
      llaman el barrio francés por el Institut français, a un paso de Iidabashi, y por el liceo
      francés que tuvo al lado hasta 2012. De aquello quedan las *crêperies*, como Le Bretagne, y las
      panaderías.


      De noche es cuando mejor está. A media subida, el templo de Bishamonten, guardado por tigres de
      piedra en lugar de perros. Enfrente se abren los callejones empedrados de Hyōgo Yokochō y
      Kakurenbo Yokochō, entre las tapias negras de los *ryōtei* y con los farolillos encendidos. Y
      arriba, el santuario Akagi, que Kengo Kuma rehízo en cristal y madera en 2010. La estación de
      Ushigome-Kagurazaka queda en lo alto de la cuesta.
    ver:
      - nombre: Kagurazaka
        maps: Kagurazaka Hyogo Yokocho Tokyo
        nota: La cuesta de las geishas, mejor de noche, con Hyōgo Yokochō a la luz de los farolillos.
      - nombre: Bishamonten Zenkoku-ji
        maps: Zenkokuji Bishamonten Kagurazaka
        nota: Tigres de piedra en lugar de perros, a media cuesta.
      - nombre: Akagi Jinja
        maps: Akagi Jinja Kagurazaka
        nota: El santuario de cristal y madera de Kengo Kuma, de 2010.
      - nombre: Le Bretagne
        maps: Le Bretagne Kagurazaka
        nota: La crêperie del barrio francés, por si apetece una sidra antes de la hamburguesa.
  - block: Noche
    time: "19:45 en adelante"
    title: Jazz y una hamburguesa en la planta 52
    body: >-
      Y la noche, en el [New York Bar](#new-york-bar), el de *Lost in Translation*, con el jazz ya
      empezado y Shinjuku encendido cincuenta y dos plantas más abajo. La cena es la hamburguesa de
      wagyu con queso y una cerveza. El bar cierra a medianoche. Para volver, la Toei Shinjuku sale de
      la estación de Shinjuku, a un cuarto de hora andando, y va directa hasta Iwamotochō.
    window:
      label: Lo que cuesta
      body: >-
        - **Entrada de ¥3.300 por persona** desde las 18:30, cuando empieza la música; el grupo con
        cantante sale hacia las 19:15. Una fuente de 2026 da las 20:30 como hora de inicio: pregúntalo
        al entrar.

        - **La hamburguesa** costaba unos ¥5.000 antes de la reforma, y la Asahi de botella, ¥1.300. No
        se ha podido confirmar que siga en la carta desde que reabrió.

        - **A todo se le suma un 15 % de servicio.** Con la entrada, unos **¥11.000** (63 €).

        - **No se reserva**, y hay que tener 20 años.
    ver:
      - nombre: New York Bar
        maps: New York Bar Park Hyatt Tokyo
        nota: "Planta 52 del Park Hyatt. De 17:00 a medianoche; música desde las 18:30."
alt:
  label: Lo que se ha caído, y por qué
  body: >-
    Este día se había armado para comer con tu familia en Ginza: la casa Asakura en Daikanyama por la
    mañana, Hachigō a la una, el Seiko de tu padre, el Intermediatheque con la azotea de KITTE y una
    noche de vinilos en Shibuya. Lo de Ginza y los discos ya está hecho, porque los dos primeros días
    fueron con ellos: las tiendas de té de Ginza, Seiko y Kamakura. El reloj no estaba, y la búsqueda
    sigue en [las compras](#compras). Los vinilos se compraron el martes, en Tower Vinyl y por Amazon.
    El Intermediatheque, que también te recomendaron, pasa a [la tarde del viernes](#solo-5-fukagawa),
    que es cuando abre hasta las 20:00.


    Antes de todo eso, el día era **Yokohama**, y se cayó por la fecha: los arces de Sankeien no llegan
    a su mejor momento hasta mediados de noviembre. Tu familia lo confirma: fuera del museo del ramen y
    el barrio chino, poco más. Si esta noche prefieres el jazz de disco al directo, el Keihin-Tōhoku va
    de Akihabara a Sakuragichō en unos cuarenta y cinco minutos, y en Noge están [Chigusa](#chigusa),
    el *jazz kissa* más antiguo que sigue abierto, y [Downbeat](#downbeat), el de 1956.
