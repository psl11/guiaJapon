slug: dia-11-kanazawa-kioto
navLabel: "Día 11 · Kanazawa y Kioto"
trip: japon
order: 11
eyebrow: El plan · Día 11 · lun 16 nov
title: Las cuerdas del jardín, y el tren a *la capital*
dek: >-
  Media mañana en Kanazawa y el Shinkansen a Kioto. El jardín de esta mañana tiene una estampa que
  solo existe en invierno y que empezó a montarse hace dos semanas. Y por la tarde empieza el tramo
  que casi todo el mundo cree que es Japón.
blocks:
  - block: Amanecer
    time: "07:00–09:00"
    title: Kenroku-en con el yukitsuri
    body: >-
      **El Kenroku-en abre a las 7:00** —antes que casi nada en Japón— y esa hora vale doble hoy: es
      uno de los **Tres Grandes Jardines** del país y a esa hora lo tenéis con los jardineros dentro y
      nadie más. De dónde sale su nombre y qué seis cosas hay que buscar mientras se anda, en
      [la ficha de Kanazawa](#kanazawa) — vale la pena llevarlo leído, porque el jardín está diseñado
      para que se vean por turnos y no de golpe.
    window:
      label: Ventana óptima
      body: >-
        **A partir del 1 de noviembre los jardineros montan el *yukitsuri***: postes altos junto a los
        pinos de los que cuelgan decenas de cuerdas en abanico, atadas rama a rama para que la nieve
        no las parta. Lleváis dos semanas de ventaja sobre la nieve, así que lo veréis **montado o
        montándose, con los jardineros trabajando** — que es todavía mejor. Es la imagen de la ciudad
        y solo existe entre noviembre y marzo.
  - block: Mañana
    time: "09:00–11:30"
    title: Un barrio de té y otro de samuráis
    body: >-
      Dos barrios enteros, a quince minutos andando el uno del otro. **En los dos hay que entrar en una
      casa**, que es donde está la diferencia: por fuera son fachadas; por dentro, cómo se vivía.

      - La **Shima**, en [Higashi Chaya](#kanazawa): una casa de té del siglo XIX intacta.
      - La **casa Nomura**, en
      [Nagamachi](https://www.google.com/maps/search/?api=1&query=Nagamachi%20Samurai%20District%20Kanazawa),
      el barrio de los samuráis. Sus tapias de barro estarán ya envueltas en esteras de paja contra el
      hielo.
    window:
      label: Aviso de lunes
      body: >-
        El **Museo del Siglo XXI de Arte Contemporáneo** —el cilindro de cristal de SANAA con la
        piscina de Leandro Erlich— cierra los lunes, y hoy es lunes. Con el plan tal como está no
        entra: o se sacrifica anoche al llegar, o se asume que se queda fuera. Lo de fuera del
        edificio, que es la mitad de la gracia, se ve gratis y a cualquier hora.
  - block: Mediodía
    time: "12:00–14:30"
    title: El Shinkansen a Kioto
    body: >-
      Dos horas y cuarto por la línea de la costa. Es un buen tramo para el ***ekiben***: la estación
      de Kanazawa tiene los suyos, de marisco del mar del Japón, y comerse uno mirando el paisaje es
      parte del viaje y no un apaño — ver [konbini y ekiben](#konbini).
  - block: Tarde
    time: "15:00–18:00"
    title: Primer contacto con Kioto
    body: >-
      No se empieza por lo grande. Con media tarde y las maletas recién llegadas, lo que funciona es
      **orientarse**: Kioto es una retícula del año 794 copiada de la capital china, y en cuanto
      se entiende que las calles van norte-sur y este-oeste y que muchas se llaman por su número
      —*Shijō* es «cuarta avenida»—, la ciudad deja de ser un laberinto. Ver [Kioto](#kioto).

      Un primer paseo que cumple: el mercado de [**Nishiki**](https://www.google.com/maps/search/?api=1&query=Nishiki%20Market%20Kyoto), cinco manzanas cubiertas de puestos, y
      de ahí al río **Kamo** al atardecer, que es donde se sienta media ciudad.
  - block: Noche
    time: "noche"
    title: La cocina de una capital sin mar
    body: >-
      Kioto está a una hora de la costa y su cocina se construyó tierra adentro: de ahí el
      ***kaiseki***, que nació aquí de la ceremonia del té, y el tofu, que por las aguas
      subterráneas de la ciudad tiene fama de ser el mejor del país. El *yudōfu*, hervido en
      caldo de alga delante de uno, es plato de invierno y de templo. Y la regla de oro:
      las casas buenas son tres o cuatro veces más baratas al mediodía, así que la alta cocina se
      reserva para un almuerzo, no para esta cena.
alt:
  label: Si te desmarcas
  body: >-
    En Kanazawa, el **Museo D. T. Suzuki**: un pabellón mínimo de hormigón y agua dedicado al
    filósofo que explicó el zen a Occidente, con una sala vacía para sentarse frente a un estanque.
    Se ve en cuarenta minutos y no hay nadie. Y en Kioto, si llegáis con luz, Tō-ji: su pagoda de
    cinco pisos es la más alta de Japón y está a diez minutos andando de la estación, con el jardín
    casi vacío a última hora.
