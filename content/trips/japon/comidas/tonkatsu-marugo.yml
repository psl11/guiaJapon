body: >-
  **Abierto en 1975, Bib Gourmand de la Guía Michelin de Tokio — y a cuatro minutos andando de vuestro
  hotel**, saliendo por la Electric Town de Akihabara. Es de los pocos casos en que la casa buena de un
  plato cae literalmente al lado de donde dormís.

  Lo que hace distinto a Marugo es la técnica: **cortes muy gruesos fritos despacio y a baja
  temperatura**, en vez del rebozado rápido y ardiendo de la mayoría. Sale una pieza que por fuera
  cruje y por dentro sigue rosa. Es tonkatsu de escuela, no de cadena.

  **Dos avisos prácticos que aquí deciden si coméis o no.** El primero: **cierra lunes y martes**, y
  abre en dos turnos cortos —**11:30-14:00 y 17:00-20:00**—. El segundo: **hay cola siempre**. Desde que
  salió en las guías extranjeras no es raro encontrar veinte personas esperando **quince minutos antes
  de abrir**, así que la única manera es plantarse antes de la hora.

  **Cuándo os encaja.** Cualquier noche que estéis en el hotel de Akihabara de miércoles a domingo — y
  muy bien el **viernes 6**, cuando cambias de alojamiento a mediodía y tienes la tarde libre antes de
  que lleguen los otros tres a las nueve y media.
