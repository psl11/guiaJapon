quePedir: "*Niboshi ramen*, el de la casa. Se puede ajustar todo: dureza del fideo, grasa, ajo, sal."
body: >-
  Escondido en una **segunda planta dentro del propio Golden Gai**, por una escalera que no invita a
  nada, y abierto **las veinticuatro horas**. Su ramen es de ***niboshi***: caldo de **sardinas
  secas**, que da un fondo salado, oscuro y ligeramente amargo, muy distinto del tonkotsu cremoso al
  que están acostumbrados casi todos. La primera cucharada descoloca; la quinta engancha.


  Encaja perfecto con el plan de la noche del día 3: los bares de Golden Gai son diminutos y **un
  grupo de cuatro no cabe casi en ninguno**, así que la cena acaba siendo por turnos o de pie. Esto
  resuelve el hambre a cualquier hora, cuesta seis euros y está en el mismo callejón.


  Se pide en la **máquina de tickets** de la entrada y se rellena una hoja marcando la intensidad de
  cada cosa. Si no se sabe qué poner, todo al medio.
