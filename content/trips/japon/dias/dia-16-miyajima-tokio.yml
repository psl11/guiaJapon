slug: dia-16-miyajima-tokio
navLabel: "Día 16 · Miyajima"
trip: japon
order: 16
eyebrow: El plan · Día 16 · sáb 21 nov
title: La isla que *era el dios*, y cuatro horas de vuelta
dek: >-
  Una mañana en una isla donde el santuario está construido sobre el agua porque pisar tierra era
  profanarla, y por la tarde el tren largo de vuelta a Tokio. Hoy la marea manda más que el reloj.
blocks:
  - block: Mañana
    time: "07:30–08:30"
    title: El tren y el ferry
    body: >-
      Tren JR hasta Miyajimaguchi —veinticinco minutos— y **ferry, diez minutos**. Desde 2023 hay una
      tasa de visitante de 100 yenes que se paga al embarcar. Ir pronto tiene premio doble: es
      sábado y a media mañana el ferry va lleno.
    window:
      label: Mirad la tabla de mareas la noche antes
      body: >-
        **La isla es dos sitios distintos según la marea** y hoy solo hay una mañana. Con **marea
        alta**, el santuario y el torii flotan: es la postal. Con **marea baja**, la bahía se queda
        seca y **se camina hasta el pie del torii**, se toca la madera y se ven las monedas encajadas
        en las grietas. Las dos merecen; lo que no merece es enterarse allí. La tabla la publica el
        propio santuario. Ver [Miyajima](#miyajima).
  - block: Mediodía
    time: "08:30–12:00"
    title: Itsukushima, y el porqué de todo
    body: >-
      Se recorre el santuario por las pasarelas —fijaos en que **las tablas están separadas a
      propósito**, para que la marea suba entre ellas— y se sale al escenario de danza. Media hora
      larga. El porqué de que todo esto esté construido sobre el agua, en
      [la ficha de Miyajima](#miyajima).

      A cinco minutos, **Daishō-in**: el templo budista de la isla, en la ladera, con una escalera
      cuyo pasamanos son cientos de ruedas de oración de metal que se van girando al subir —se
      supone que girarlas todas equivale a leer los sutras enteros—. Casi nadie sube y es lo mejor de
      Miyajima después del torii.
  - block: Tarde
    time: "12:00–14:00"
    title: Arces, ostras y una tarta con forma de hoja
    body: >-
      Antes de coger el ferry, tres cosas que se hacen en la misma calle:

      - Subir al [**Momiji-dani**](https://www.google.com/maps/search/?api=1&query=Momijidani%20Park%20Miyajima),
        el valle de los arces, que a día 21 debería estar **en su punto**.
      - Comprar ***momiji manjū*** calientes, recién salidos de las máquinas que se ven trabajar desde
        la calle.
      - Y comer **ostras a la brasa** en un puesto, o ***anago-meshi*** sentado, que es el plato de la
        isla.

      Los **ciervos** de aquí no se alimentan —está prohibido desde 2008— y por eso son bastante menos
      agresivos que los de [Nara](#nara). Aun así se comen los mapas.
  - block: Tarde
    time: "14:30–19:00"
    title: Cuatro horas al este
    body: >-
      Ferry, tren a [Hiroshima](#hiroshima) y **Shinkansen a Tokio: unas cuatro horas**. Es el trayecto más largo
      del viaje y también el más agradecido: se cruza medio país por la costa del mar interior,
      [Osaka](#osaka), [Kioto](#kioto) y el Fuji por la derecha si el día está limpio. Es la ocasión de un *ekiben* de
      Hiroshima —el de ostras es una institución— y de dormir.
    window:
      label: El asiento del Fuji
      body: >-
        Yendo hacia el este, **el Fuji queda a la derecha**, entre Shin-Fuji y Mishima, más o menos a
        cuarenta minutos de Tokio. En noviembre el aire es el más limpio del año y se ve muchos días.
        Asiento E en clase turista, y estar atento a la ventanilla en ese tramo.
  - block: Noche
    time: "noche"
    title: Tokio otra vez, y otro barrio
    body: >-
      Se vuelve a Tokio, pero no a donde se empezó: estos cinco últimos días se duermen en
      [**Shinjuku**](#shinjuku) y no en [Akihabara](#akihabara), y el cambio está pensado. Al
      principio interesaba dormir barato, tranquilo y cerca del Tokio viejo, con el cuerpo pidiendo
      cama a las nueve; ahora el huso ya no molesta, es pico de hoja roja y las noches se
      aprovechan — y Shinjuku es el sitio de Tokio donde eso se nota más. Las maletas grandes
      deberían estar ya esperando aquí. Quedan cinco días sin cambiar de cama, que después de once
      noches de mudanza es un lujo en sí mismo.
alt:
  label: Si te desmarcas
  body: >-
    El **monte Misen**, 535 m, con teleférico y veinte minutos finales a pie: arriba está el mar
    interior salpicado de islas, y en la subida el Reikadō, donde arde un fuego que la tradición
    atribuye a Kūkai hace más de mil doscientos años y del que se encendió la Llama de la Paz de
    Hiroshima. Es una mañana entera, así que obliga a sacrificar el resto de la isla — y merece la
    pena si el día está claro.
