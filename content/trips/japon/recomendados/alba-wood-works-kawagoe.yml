body: >-
  Un taller donde se hacen los propios palillos: se elige la madera, se lija, se les da forma y se
  acaban en media hora larga. **Cuesta 1.650 yenes de taller más la madera**, que va de dos mil a
  cinco mil según la pieza. Se puede entrar sin reservar; si hay gente dan un número y se vuelve.


  El horario es lo que hay que mirar, porque cambia entre semana y fin de semana: **de martes a
  viernes abre a las 12:30 y cierra a las 18:00**, con última entrada a las 17:00. El día de Kawagoe
  de este viaje es jueves, así que la mañana del barrio de los almacenes queda libre y el taller cae
  después de comer, que es exactamente como encaja.


  De todos los recuerdos que traía esta lista —y traía varios: palillos grabados en Kamakura, en
  Miyajima, sellos de estación— este es el único que se hace en vez de comprarse.
