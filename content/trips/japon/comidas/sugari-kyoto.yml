body: >-
  Una puerta pequeña en una casa de madera de Nakagyō y, detrás, diez asientos en barra. La carta
  cabe en una línea: ramen, *tsukemen* y curry. Se elige el plato, el tamaño y uno de los dos
  fideos, todos hechos en casa, y se añade algún topping. El caldo es espeso, de los que se pegan
  al fideo.


  Está aquí como plan B de [Men-ya Inoichi](#menya-inoichi), y no como competencia. El día 11 se
  come por esta zona camino de Nishiki, y los dos tienen cola los días malos. Se mira cuál tiene
  hueco y se entra en ese. Además no se parecen: Inoichi es un *dashi* de pescado transparente y
  Sugari va por el lado contrario.


  Abre de 11:30 a 15:00 y por la noche desde las 18:00. Las fuentes no coinciden en el día de
  cierre: unas dicen domingo y otras no dan ninguno. El día 11 es lunes, así que no afecta.
