body: >-
  La solución al problema clásico de Ginza: comer bien sin pagar precio de Ginza. **Maru** es
  *kaiseki* —la alta cocina japonesa por pases— pero en versión joven: **cocina abierta**, barra
  desde la que se ve trabajar al equipo, y platos que se salen del formalismo sin perder la técnica.


  Y aquí está el truco que conviene interiorizar para todo el viaje: **en Japón el mismo restaurante
  cuesta tres o cuatro veces menos al mediodía**. Los menús de almuerzo de casas serias son de las
  mejores relaciones calidad-precio del planeta, y el de Maru se mueve alrededor de los diez euros.
  La cena en el mismo sitio pasa de los cuarenta.


  Está en un edificio de oficinas y hay que subir en ascensor, que es como está la mitad de la buena
  cocina de esta ciudad: **mirar hacia arriba** en Ginza y en [Shinjuku](#shinjuku) es donde aparecen los sitios.
