body: >-
  La casa es un yakiniku y asador en Namba; la hamburguesa de wagyu que circula en vídeo es una
  colaboración con Gui's Burger y **no está disponible todo el día**. Se sirve de doce a tres, con
  última comanda a las 14:30, y de cinco a siete. A partir de las siete la carta pasa a menú de
  carne y la hamburguesa desaparece.


  Eso la mete con calzador en el día 14: la ventana de tarde se cierra a las siete y el bloque de
  Dōtonbori empieza a las seis, así que hay que llegar pronto o comerla a mediodía en vez de ir a
  [Kuromon](#kuromon).


  Y dos condiciones de la reserva que conviene leer antes de hacerla: **cancelar el mismo día cuesta
  el cien por cien**, y llegar quince minutos tarde equivale a cancelar. Con un día tan cargado como
  el 14, eso es un riesgo real.
