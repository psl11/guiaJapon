body: >-
  Cuatro de los posts de Alba van de esto, y en el fondo son **dos costumbres distintas** que
  conviene no confundir.


  Los ***eki stamps*** son sellos de estación: existen desde 1931, cuando se pusieron en la estación
  de Fukui para animar el turismo interior, y hoy los hay en estaciones, museos, castillos,
  aeropuertos y hasta en algunas tiendas. Cada uno lleva el dibujo de su sitio. **Son gratis.** La
  app *Stamp Quest* los localiza en un mapa, y el cuaderno se compra en Itoya, Loft, Tōkyū Hands o
  Kinokuniya — o se lleva uno de casa.


  El ***goshuin*** es otra cosa: un sello sagrado que se recibe en un templo o un santuario, escrito
  a mano con caligrafía delante de ti, por una donación de entre trescientos y mil yenes. No es un
  recuerdo turístico sino la constancia de una visita, y por eso **no se mezcla con los de estación
  en el mismo cuaderno**. El libro para goshuin se llama *goshuinchō* y se compra en el propio
  templo.


  Un sitio concreto donde hacerlo: el **Daishō-in de Miyajima**, el día 16. Es de los templos con el
  goshuin más trabajado del país, y ese día ya se pasa por allí.
