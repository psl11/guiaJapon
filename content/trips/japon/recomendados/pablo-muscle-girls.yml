body: |
  Las camareras son culturistas y el espectáculo es su fuerza. Sirven los batidos de proteínas con
  jeringuilla y, si se paga aparte, dan una bofetada o una patada en el trasero que manda al cliente
  volando, con aplausos de la sala. Se ha hecho famoso sobre todo entre los turistas extranjeros.

  - **¥6.000 por persona** por ochenta minutos con barra libre, con impuestos y servicio.
  - **Lo demás se paga en «dólares musculares»**, diez por ¥1.000. Con ellos va la bofetada; lo
    que cuesta cada número no está publicado.
  - **Solo para mayores de 18 años.**

  Lo propone Pablo para la penúltima noche de los cuatro.
