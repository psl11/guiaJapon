title: Tempura
queEs: >-
  Verdura y marisco rebozados en una masa finísima de harina y agua **helada** y fritos unos
  segundos. Bien hecha no es grasienta ni tiene sabor a fritura: es un envoltorio transparente y
  crujiente alrededor de un ingrediente que sigue sabiendo a sí mismo.
historia: >-
  La trajeron los **portugueses en el siglo XVI** —de las *témporas*, los días de vigilia en que se
  comía pescado— y los japoneses la afinaron hasta convertirla en otra cosa. Como el sushi, empezó
  siendo **puesto callejero de Edo** y acabó teniendo templos con estrella.
dondeMejor: >-
  En barra, pieza a pieza, según sale de la sartén: la tempura pierde en treinta segundos. A
  mediodía, muchos locales caros sirven el mismo producto en *tendon* (sobre arroz) por una fracción
  del precio de la cena.
picante: "—"
veg: >-
  Perfectamente viable: berenjena, calabaza, boniato, shiitake, *shiso*. **Ojo al aceite compartido**
  con el marisco y a la salsa *tentsuyu*, que lleva dashi — se puede pedir con sal y limón.
body: >-
  Se come con sal (a menudo *matcha* o yuzu) o mojada en *tentsuyu* con rábano rallado. Y de pie en
  una estación, en versión humilde sobre un bol de soba, sigue siendo uno de los mejores almuerzos
  de tres euros del mundo.
