  El **curso de cata**: el mismo grano en cold brew, milk brew, filtrado y espresso, para ver qué hace cada método con el mismo café.
body: >-
  El **número 28 del mundo** en la lista de 2026, y el sitio que inventó en Tokio el formato «curso de café»: no se pide una taza, se reserva una sesión en la que un mismo grano pasa por cuatro extracciones distintas y se prueba en orden. Suena a pedantería y no lo es — es la forma más rápida que existe de entender por qué el mismo café sabe a cuatro cosas.


  Está en **Kiyosumi-Shirakawa**, que es el barrio que Blue Bottle eligió para desembarcar en Japón y que desde entonces concentra tostaderos en naves de almacén junto al río. Combina bien con el jardín Kiyosumi Teien, a cinco minutos.
