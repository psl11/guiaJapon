body: >-
  Shingo Gokan montó un bar **partido en dos**: la planta de calle, *Guzzle*, es ruidosa, informal y se bebe rápido; el sótano, *Sip*, es oscuro, con barra y ceremonia. La misma casa, dos maneras opuestas de beber, y se puede empezar en una y bajar a la otra.


  Es la mejor opción del grupo cuando **no todos queréis lo mismo** — que con cuatro personas pasa siempre. El nombre viene del *Shanghai Grand*, y el hilo de la carta es el trasiego de bebida entre Japón, China y Occidente.
