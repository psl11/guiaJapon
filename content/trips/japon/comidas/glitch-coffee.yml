body: >-
  El sitio que **metió el tueste claro en Tokio** cuando aquí todo se tostaba oscuro por costumbre del *kissaten*. Trabajan orígenes únicos, tuestan tan claro que los cafés salen ácidos y florales —más cerca de un té que de lo que en España se llama café— y lo explican con paciencia si preguntáis.


  Su gracia para vosotros es la ubicación: está en [**Jinbōchō**](#jimbocho), el barrio de las ciento treinta librerías de viejo, **andando desde el hotel de la primera semana**. Café de especialidad y libros usados en la misma manzana es un plan de mañana bastante difícil de mejorar.
