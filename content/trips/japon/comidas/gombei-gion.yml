body: >-
  **Bib Gourmand en la guía de Kioto y Osaka**, en mitad de Gion, con clientela de actores de
  kabuki y de geishas del barrio. Hace el fideo a la manera de Kioto: más blando que en Tokio, pensado
  para empaparse del *dashi* en vez de resistirlo.


  Encaja la **tarde del día 13**, la de Gion, o la cena antes del *raitoappu*: abre seguido de 11:30
  a 20:00. **Cierra los jueves**, y el día 13 es miércoles.
