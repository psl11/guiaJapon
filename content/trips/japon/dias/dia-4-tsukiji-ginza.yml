slug: dia-4-tsukiji-ginza
navLabel: "Día 4 · Tsukiji y Ginza"
trip: japon
order: 4
eyebrow: El plan · Día 4 · lun 9 nov
title: El lunes que *cierra todo* — y lo que abre
dek: >-
  En Japón el lunes es el día de descanso de los museos, y hoy cierran el Museo Nacional, los
  Jardines del Palacio Imperial y Hamarikyū. Lejos de ser el día malo, es el día que se planifica
  al revés: hoy toca justamente lo que no cierra los lunes y sí cerraba ayer.
blocks:
  - block: Mañana
    time: "09:00–11:30"
    title: Tsukiji, que hoy sí
    body: >-
      El mercado mayorista se mudó a Toyosu en 2018, pero [**el mercado exterior de Tsukiji se quedó**](#tsukiji)
      —cuatrocientos puestos de pescaderos, cuchilleros, tiendas de alga y barras de desayuno— y es
      donde de verdad se come. *Tamagoyaki* en pincho, ostras abiertas al momento, atún a la brasa,
      *dashimaki*: se desayuna de pie y a base de picar. Y no se compra nada en el primer puesto: se
      da una vuelta entera y luego se decide.
    window:
      label: Ventana óptima
      body: >-
        Doble motivo para que sea hoy y a esta hora. **Tsukiji cierra los domingos**, así que de
        vuestros tres días de Tokio este es el único que encaja. Y dentro del día, la franja es
        estrecha: antes de las 9:00 la prioridad la tienen los compradores profesionales y no es
        vuestro sitio; **a partir de las 13:00 empieza a cerrar** y a las 15:00 no queda nada. Entre
        las nueve y las once y media está todo abierto y aún se puede andar.
  - block: Mediodía
    time: "11:30–14:00"
    title: Ginza, y el Japón que se mira a sí mismo
    body: >-
      Se sube andando desde el mercado a **Ginza**, que es la respuesta japonesa a la avenida de lujo
      y no se parece a ninguna: aquí los grandes almacenes son instituciones y hay que bajar al sótano.
      El ***depachika*** —la planta de alimentación bajo los *depāto*, en el Mitsukoshi o el
      Matsuya— es uno de los espectáculos de esta ciudad: dos mil metros cuadrados de comida
      presentada como joyería, con melones de cien euros y mostradores de *wagashi* que parecen un
      muestrario de estaciones. Se prueba, se compra la comida de mañana en el tren, y no se paga
      entrada por nada de esto.
    window:
      label: Por qué el depachika
      body: >-
        Porque es el sitio donde mejor se entiende de golpe la relación de este país con la comida —el
        envoltorio, la estacionalidad, la obsesión por el producto perfecto— y porque **está abierto
        un lunes**. Los domingos también, pero los domingos tocaba Harajuku. Bonus para el día 6: de
        aquí sale el mejor ***ekiben*** posible para el tren a Matsumoto.
  - block: Tarde
    time: "14:00–16:30"
    title: El foso del palacio, sin entrar
    body: >-
      Los **Jardines del Palacio Imperial cierran los lunes** —y también los viernes—, así que hoy no
      se entra. Pero lo que hay fuera se anda igual: la **plaza de Kōkyo Gaien** con sus pinos negros
      recortados, el **Nijūbashi** (el puente de dos arcos, la foto clásica) y los fosos de piedra
      ciclópea que son lo único que queda del **castillo de Edo**, que fue la mayor fortaleza del
      mundo. Se cierra el paseo en **Nihonbashi**, el puente que era el kilómetro cero de todas las
      carreteras del país y que hoy vive humillado bajo una autopista de hormigón — una imagen que
      cuenta el siglo XX japonés mejor que un museo.
    window:
      label: Un apunte de temporada
      body: >-
        Aviso honesto para no esperar lo que no toca: [**llegáis dos semanas antes del momiji de
        Tokio**](#momiji). El pico de la hoja roja en la ciudad va del 20 de noviembre al 5 de diciembre, y la
        célebre avenida de ginkgos de **Meiji Jingū Gaien** amarillea hacia el 25. En vuestras fechas
        los arces están empezando y los ginkgos verdean todavía. No es la temporada de postal — es la
        semana anterior, con la mitad de gente.
  - block: Noche
    time: "noche"
    title: Luz artificial
    body: >-
      Para cerrar el día que cierra todo, algo que precisamente abre los lunes y solo funciona de
      noche: **teamLab Borderless**, en Azabudai Hills. Salas sin mapa donde las obras se salen de una
      habitación y entran en la siguiente, y donde uno acaba descalzo en un estanque de luz. Es
      espectáculo digital y no arte antiguo, y a tres primerizos les va a parecer lo más japonés del
      viaje aunque no lo sea en absoluto. **Hay que comprar la entrada con días de antelación** y ojo
      con el calendario: cierra el primer y el tercer martes de mes, pero **los lunes abre**.
alt:
  label: Si te desmarcas
  body: >-
    Si teamLab ya lo tienes visto, el lunes te deja igualmente dos cartas que no cierran: el
    **Museo Nezu de Aoyama** no, ese cierra hoy también — pero el **Kabuki-za de Ginza** vende
    ***makumi***, entradas de un solo acto, en taquilla y para el mismo día por unos pocos euros:
    entras, ves cuarenta minutos de kabuki desde el cuarto piso y te vas, que es exactamente la dosis
    correcta la primera vez. Comprueba la cartelera del mes. Y por la mañana, en vez de Tsukiji:
    **Toyosu** para ver la subasta de atún de verdad desde la pasarela —hay que madrugar de otra
    manera, sobre las 5:30— o el **jardín Kyū-Shiba-rikyū**, junto a Hamamatsuchō, que sí abre los
    lunes y no lo pisa nadie.
