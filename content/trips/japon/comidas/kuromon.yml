body: >-
  Seiscientos metros de mercado cubierto que abastecen a media hostelería de Osaka desde el siglo XIX. A diferencia de [Nishiki](#nishiki) en Kioto, aquí casi todo se come **de pie y al momento**: los puestos tienen plancha, brasa o cuchillo y te lo dan en un palillo.


  Osaka se define a sí misma con la palabra ***kuidaore***, «arruinarse comiendo», y este mercado es el sitio donde la frase deja de ser un eslogan. Con un día solo en la ciudad, esta es la mañana.
