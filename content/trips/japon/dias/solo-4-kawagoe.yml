        nota: "En un edificio de estilo tradicional, en la misma calle del campanario."
  - block: Tarde
    time: "14:00–16:30"
    title: Hikawa, y los túneles de los deseos
    body: >-
      A quince minutos al norte, el **Hikawa Jinja**, santuario de parejas. Si sobra tarde, la
      **Kurazukuri Shiryōkan** o el pequeño museo de la ciudad explican cómo se levantaba un muro de
      esos. Vuelta a Ikebukuro y de ahí a Akihabara; el onsen sigue en su sitio.
    window:
      label: Si prefieres apurar la luz
      body: >-
        La alternativa a Hikawa es quedarse en la calle vieja hasta el atardecer, con los almacenes al
        sol bajo y los faroles encendiéndose. Los excursionistas cogen el tren de las cinco, así que
        **la última hora la tienes casi para ti**.
    ver:
      - nombre: Hikawa Jinja
        maps: Kawagoe Hikawa Shrine
        nota: Un túnel de dos mil *ema*, las tablillas de los deseos. De lo más fotogénico de Kantō.
        lat: 35.9271396
        lon: 139.4887762
  - block: Vuelta
    time: "17:00–19:00"
    title: Dos Zeldas el día que salen, y el ramen de Ōtsuka
    body: >-
      Hoy, jueves 5, sale en Japón el ***Zelda: Ocarina of Time*** nuevo, y hacen falta dos copias: una
      para cada Pablo. La tienda es **Yodobashi Akiba**, junto a la estación de Akihabara y abierta hasta las 22:00:
      si anoche pediste que te las apartaran, se recogen al volver. Su regalo, mientras dure, es un
      llavero de Navi. Y al otro lado de la estación, en el 1-11-2 de Sotokanda, Super Potato vende
      el Zelda de antes: tres plantas de juegos retro en su caja japonesa, hasta las 20:00. Si aparece
      el *Ocarina* de Nintendo 64, es el compañero del nuevo; está en [las compras](#compras).


      Si no las apartaste, no esperes a Akihabara: la vuelta de Kawagoe pasa por Ikebukuro, y a la
      salida este está la tienda central de **Bic Camera**, que da un póster. La segunda copia se
      entrega el viernes por la noche en Haneda. Y antes de volver, una parada de Yamanote hasta
      Ōtsuka para cenar.
    window:
      label: Antes de comprar, tres cosas
      body: >-
        - **Es solo de Switch 2.** No arranca en una Switch normal: comprobad qué consola lleváis.

        - **La caja japonesa no es metálica, y no hay edición especial.** No hay *steelbook* en
        Japón, y la portada de lámina con relieve de la primera tirada se reparte en Europa y Estados
        Unidos, no aquí. Lo que tiene de propio la copia japonesa es la carátula con el título en
        japonés y el regalo de cada tienda, que es un detalle: llavero, póster, posavasos. Si lo que
        se quiere es la caja de lámina, se compra en España.

        - **Precio: ¥8.980 la copia.** El cartucho no tiene región y, según las tiendas que lo venden fuera, trae subtítulos en español. El
        *tax-free* no compensa: son unos ¥800 de devolución por copia, con trámite en la aduana de
        salida.
    ver:
      - nombre: Yodobashi Akiba
        maps: Yodobashi Akiba
        nota: "Junto a la estación de Akihabara, hasta las 22:00. Regala un llavero de Navi mientras dure."
      - nombre: Bic Camera Ikebukuro
