title: Las cinco cosas que de verdad importan
area: Todo el viaje
note: "Nadie espera que lo hagáis perfecto"
body: >-
  A un extranjero se le perdona todo y nadie espera protocolo. Pero hay cinco que cuestan cero y se
  notan:


  **1. Silencio en el transporte.** En el metro y en el tren no se habla por teléfono y las
  conversaciones van en voz baja. Es la norma que más rompe el turista y la que más molesta.


  **2. No se come andando.** Se come donde se compra —de pie junto al puesto— o sentado. Vale para el
  helado y para el pincho de [Tsukiji](#tsukiji).


  **3. Descalzarse.** En templos, ryokan, algunos restaurantes y cualquier sitio con tatami o con
  zapatos amontonados en el umbral. Y las zapatillas del baño **se quedan en el baño**.


  **4. Nada de propinas**, en ningún contexto.


  **5. La basura.** No hay papeleras en la calle, herencia del atentado del metro de 1995: se lleva
  encima hasta el hotel o hasta un [konbini](#konbini). Es lo que explica que las calles estén tan limpias.


  Y con los palillos, dos tabúes de verdad: **no clavarlos verticales en el arroz** ni **pasar comida
  de palillo a palillo** — las dos cosas son gestos de un funeral.
