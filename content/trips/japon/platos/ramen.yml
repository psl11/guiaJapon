title: Ramen
image:
  src: img/platos/ramen.webp
  alt: "Un bol de ramen de caldo claro con huevo marinado a la mitad, alga nori y cebolleta."
  credit: "Pablo Sánchez"
queEs: >-
  Un caldo, unos fideos de trigo alcalino y unos pocos remates: cerdo *chāshū*, huevo marinado,
  brote de bambú, alga. Lo que cambia todo es **el caldo**, y por eso el ramen no es un plato sino
  una familia: **tonkotsu** (hueso de cerdo, blanco y espeso), shōyu (soja, el clásico de Tokio),
  shio (sal, ligero) y miso (de Hokkaidō, contundente).
historia: >-
  No es japonés de origen: llegó de China a finales del XIX y se llamaba *shina [soba](#soba)*, «fideos
  chinos». Se hizo nacional después de la guerra, cuando la harina de trigo de la ayuda americana
  inundó el país y el arroz escaseaba. Es decir, **el plato más identitario del Japón moderno nació
  de una importación y de una posguerra** — y hoy hay quien hace cola dos horas por un bol.
dondeMejor: >-
  Tokio es de **shōyu**, pero se encuentra de todo. Las máquinas de tickets a la entrada son la
  norma: se elige y se paga antes de sentarse.
picante: "Suave (salvo el tantanmen)"
body: >-
  Reglas de la casa: **se sorbe** —hace ruido y está bien—, se come rápido porque los fideos se pasan
  en cinco minutos, y no se pide para compartir. Si el sitio tiene barra y máquina, se cena en quince
  minutos por menos de diez euros.
