quePedir: >-
  Un **café añejo** —tienen granos envejecidos años, algunos de décadas— y, si es verano, el ***blanc et noir***.
body: >-
  Abierto en **1948** y dedicado a una sola idea que casi nadie más defiende: **envejecer el grano verde** durante años antes de tostarlo, como se hace con el vino. Su fundador, Ichirō Sekiguchi, siguió detrás de la barra hasta pasados los cien años. La carta lista añadas.


  Todo aquí es deliberadamente anticuado: la luz baja, el humo que hubo, las tazas elegidas una a una, el sifón. No es un sitio para pasar; es un sitio para sentarse cuarenta minutos en pleno [Ginza](#ginza) y no hacer nada más.
