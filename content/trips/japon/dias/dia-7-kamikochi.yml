slug: dia-7-kamikochi
navLabel: "Día 7 · Kamikōchi"
trip: japon
order: 7
eyebrow: El plan · Día 7 · jue 12 nov
title: Kamikōchi, *tres días* antes de cerrar
dek: >-
  Un valle a mil quinientos metros donde los coches están prohibidos desde 1975, con un río de agua
  de deshielo y las cumbres del Hotaka encima. Llegáis en la última semana de su temporada: el 15 se
  corta la carretera y el valle se queda solo hasta abril.
blocks:
  - block: Mañana
    time: "08:00–11:00"
    title: La subida, y por qué no hay coches
    body: >-
      De Matsumoto se sube en dos tramos: el trenecito de la línea Kamikōchi hasta Shin-Shimashima y
      luego autobús —o el directo, si cuadra el horario.

      Y en algún punto del ascenso, en Nakanoyu, **se acaba el mundo motorizado**. Los vehículos
      particulares [llevan prohibidos desde 1975](#kamikochi). Por eso este valle no se parece a ningún
      otro sitio accesible de Japón.
    window:
      label: Se sube con lo puesto
      body: >-
        Dos avisos. **Los autobuses directos se llenan** y se compran online con antelación. Y este
        año **se duerme fuera del valle**: las camas de dentro estaban vendidas, así que la noche es
        en [Hirayu Onsen](#hirayu-onsen), al otro lado del túnel. Eso tiene una ventaja logística
        —las maletas grandes ya van camino de Takayama y aquí se anda con mochila— y un coste que
        conviene saber desde ahora: **el valle se ve en horario de autobús**, no de huésped.
  - block: Mediodía
    time: "11:00–14:00"
    title: Kappabashi y el río Azusa
    body: >-
      El centro del valle es un puente colgante de madera, el [**Kappabashi**](https://www.google.com/maps/search/?api=1&query=Kappa%20Bridge%20Kamikochi), y la postal es la misma
      desde hace un siglo: el **río Azusa** corriendo transparente sobre grava clara, y detrás la
      pared del Hotaka, con el Okuhotaka en 3.190 metros. El agua viene de deshielo y baja a unos
      pocos grados; se ve el fondo entero. Desde aquí se camina en las dos direcciones por sendas
      llanas, sin desnivel y sin técnica: es alta montaña sin ser montañismo.
  - block: Tarde
    time: "14:00–16:00"
    title: Río abajo, hasta el estanque Taishō
    body: >-
      El paseo esencial va **río abajo** hasta el estanque Taishō, una hora larga por la orilla.
      El estanque no existía hace cien años: lo creó la erupción del monte Yake en 1915, que
      represó el Azusa y ahogó un bosque entero — y por eso del agua siguen saliendo troncos muertos
      en pie, de pie y pelados, con las cumbres reflejadas detrás. Es el paisaje más fotografiado
      del valle y con razón.
    window:
      label: Ventana óptima
      body: >-
        Durmiendo fuera del valle, **esta tarde es la mejor luz que vais a tener aquí**: sobre las
        tres y media el sol entra rasante por el hueco del río y pone las cumbres nevadas en naranja.
        No lo dejéis para mañana. Y contad el regreso con margen: **a las cuatro y media es de
        noche**, la temperatura se desploma en cuanto el sol cae tras la pared y el último autobús a
        Hirayu no espera a nadie — comprobad su hora al llegar, no al volver.
  - block: Noche
    time: "noche"
    title: Bajar a Hirayu, y meterse en el agua
    body: >-
      Veinticinco minutos de autobús por el túnel y se llega a [**Hirayu Onsen**](#hirayu-onsen), el
      pueblo termal que hay al otro lado. Es un sitio pequeño de posadas de madera al pie del paso,
      con [aguas](#onsen) que llevan brotando desde el siglo XVI, y funciona igual que un hotel de
      montaña del valle: cena a hora fija, cocina de la región, baño caliente comunal y poco más que
      hacer. Después de un día entero andando a mil quinientos metros, meterse en un *rotenburo* al
      aire libre con la temperatura bajo cero es el mejor plan del viaje — y es algo que dentro del
      valle no había.
    window:
      label: Lo que os vais a encontrar (sin adornar)
      body: >-
        [**La hoja ya ha pasado.**](#momiji) El oro de los alerces de Kamikōchi es de octubre; a mediados de
        noviembre los árboles están pelados, las mañanas amanecen con escarcha, el día se mueve entre
        **5 y 10 °C** y de noche baja de cero. Puede nevar. Lo que se gana a cambio: las cumbres del
        Hotaka blancas, el aire absolutamente transparente y un valle casi vacío en la semana en
        que todos los demás ya se han ido. Para una cámara es mejor trato que el oro con multitudes.
alt:
  label: Si te desmarcas
  body: >-
    En dirección contraria al estanque, río arriba, hay una hora de sendero llano hasta el
    **estanque Myōjin** y su santuario Hotaka-jinja Okumiya, en una orilla que casi nadie pisa
    porque queda al otro lado del puente: se paga una entrada pequeña y se está solo. Por el camino
    está el relieve de Walter Weston, el misionero británico que a finales del XIX convenció a
    los japoneses de que sus montañas podían subirse por gusto y no por peregrinación — de él viene
    la palabra «Alpes japoneses» y buena parte de que este valle sea hoy un parque nacional. Y a
    mitad de camino del estanque Taishō, apartado del sendero principal, está el estanque
    Tashiro: mucho más pequeño, rodeado de hierba y con la niebla enganchada al agua a primera
    hora. Casi todo el mundo pasa de largo porque el desvío no está señalizado con ganas.
