blocks:
  - block: Mañana
    time: "08:00–09:30"
    title: El santuario de la esquina, en su día grande
    body: >-
      Se empieza cruzando la ciudad en diagonal: la **Hibiya** va de Roppongi a Akihabara sin
      transbordo y de la boca de metro al santuario hay siete minutos cuesta arriba. El Kanda Myōjin
      guarda este trozo de ciudad desde hace mil años, y las tiendas de Akihabara le llevan los
      ordenadores a bendecir. Dentro está consagrado **Taira no Masakado**, el hilo del que tira todo
      el día: dentro de una hora vais a estar delante de su tumba.
    window:
      label: Por qué hoy, y no cualquier domingo
      body: >-
        **Hoy, 15 de noviembre, se celebra el *shichi-go-san***: los niños de siete, cinco y tres años
        van al santuario vestidos de gala, y cae en la fecha exacta y en domingo. Ayer lo rozasteis en
        [Meiji Jingū](#meiji-jingu), que es donde se hace a lo grande; aquí se ve la versión de barrio,
        con veinte familias en vez de doscientas, y mucho más cerca.

        No se reserva ni se paga: la única condición es pasarse por la mañana, que es cuando van.
    ver:
      - nombre: Kanda Myōjin
        maps: Kanda Myojin Shrine Tokyo
        nota: Amuletos para el disco duro, y no es broma para turistas. Consagrado a Masakado.
        lat: 35.7019403
        lon: 139.7677388
      - nombre: Yushima Seidō
        maps: Yushima Seido Tokyo
        nota: Templo confuciano de laca negra, de 1690, a cinco minutos. No hay nadie nunca.
        lat: 35.7004002
        lon: 139.7665903
      - nombre: Nikolai-dō
        maps: Nikolai-do Holy Resurrection Cathedral Tokyo
        nota: Una catedral ortodoxa rusa de 1891 con cúpula verde, en Surugadai.
        lat: 35.6980047
        lon: 139.7655163
      - ficha: akihabara
        nota: El barrio del santuario, y lo que merece la pena de él.
  - block: Mañana
    time: "09:30–12:30"
    title: Ōtemachi, y el castillo que no está
    body: >-
      Dos paradas de metro y se sale entre torres de oficinas, a la tumba de Masakado: treinta metros
      cuadrados sin edificar en el suelo más caro del mundo, con incienso fresco de esta misma mañana.
      Se ve en cinco minutos; lo que impresiona es saber que **una ciudad de catorce millones lleva un
      siglo sin atreverse a tocarlo**, y para eso hay que llevar la ficha leída.

      De ahí se cruza al foso y se entra en el **Higashi Gyoen**, el jardín este del Palacio, gratis:
      muros ciclópeos, la Fujimi-yagura y el basamento vacío de la torre del homenaje, que ardió en
      1657 y no se reconstruyó. Se sube en dos minutos y desde arriba se entiende qué había aquí. Se
      sale por Kōkyo Gaien, la explanada de pinos negros, hasta el Nijūbashi.
    window:
      label: La única ventana del viaje para entrar
      body: >-
        **Los Jardines del Palacio cierran los lunes y los viernes**, y por eso este bloque va hoy y no
        en la semana de vuelta: el día 20, el otro que pasa por aquí, no se puede entrar.

        Y sin esperar lo que no toca: el [pico de la hoja roja en la ciudad](#momiji) va del 20 de
        noviembre al 5 de diciembre, así que los arces están empezando. Rojos de verdad, dentro de diez
        días.
    ver:
      - ficha: masakado
        nota: La cabeza que voló desde Kioto, el rayo y la excavadora volcada.
      - ficha: marunouchi
        nota: El mayor castillo del mundo, del que quedan el suelo y las piedras.
      - nombre: Fujimi-yagura
        maps: Fujimi-yagura Imperial Palace East Gardens Tokyo
        nota: Una de las tres torres de vigilancia que sobrevivieron, dentro del jardín este.
        lat: 35.6841917
        lon: 139.7566017
      - nombre: Nijūbashi
        maps: Nijubashi Bridge Imperial Palace Tokyo
        nota: El puente de dos arcos de todas las fotos, al final de los pinos de Kōkyo Gaien.
        lat: 35.6802215
        lon: 139.7535986
  - block: Mediodía
    time: "12:30–15:00"
    title: Marunouchi, «dentro del círculo»
    body: >-
      *Maru-no-uchi* es «dentro del recinto»: este distrito entero estaba dentro de los fosos del
      castillo. Hoy es el barrio de los bancos, y lo que hay que ver es gratis y cabe en tres paradas:
      la estación de Tokio de 1914 —asomaos al vestíbulo norte a mirar los relieves del zodiaco—, la
      Intermediatheque encima de ella y, a cinco minutos, el Tokyo International Forum.

      Para comer, sin salir de aquí: el sótano de alimentación de unos grandes almacenes o la **Ramen
      Street** de la estación, ocho casas de [ramen](#ramen) buenas, una de cada región, en el sitio
      con menos alma imaginable.
    window:
      label: Lo que solo pasa en fin de semana
      body: >-
        Si está montada la terraza de la avenida **Nakadōri**, que en temporada peatonalizan los
        fines de semana y llenan de mesas entre los olmos, la comida se resuelve sola y al aire libre.
    ver:
      - nombre: Estación de Tokio
        maps: Tokyo Station Marunouchi Building
        nota: Ladrillo rojo de 1914, con las cúpulas recuperadas en 2012. Mirad el techo del vestíbulo norte.
        lat: 35.6811505
        lon: 139.7659765
      - nombre: Intermediatheque
        maps: Intermediatheque Tokyo
        nota: Ballenas, minerales y aves de la Universidad de Tokio en vitrinas del XIX. Gratis.
        lat: 35.6800322
        lon: 139.7645340
      - nombre: Tokyo International Forum
        maps: Tokyo International Forum
        nota: El casco de barco de cristal de Viñoly, puesto del revés. Se entra libre.
        lat: 35.6767901
        lon: 139.7635414
    comer:
      - comida: onigiri-konga-nihonbashi
        nota: Onigiri para llevar en el Takashimaya de Nihonbashi. En domingo, confirmad a qué hora abre.
  - block: Tarde
    time: "15:00–18:00"
    title: Los cuarenta y siete, y la última luz desde una fábrica de cerveza
    body: >-
      Un cuarto de hora hacia el sur, a Shinagawa, y al templo **Sengaku-ji**, donde están enterrados
      en filas, alrededor de su señor, los cuarenta y siete *rōnin* del *Chūshingura*. Tres siglos
      después **las tumbas siguen humeando de incienso todos los días**. Es la continuación exacta del
      código que contaron los templos de [Kamakura](#kamakura-zen).

      Tres paradas de Yamanote y se acaba en **Ebisu**, el barrio que se llama como una cerveza que se
      llamaba como un dios. En el solar de la fábrica está Yebisu Garden Place, con **un mirador
      gratuito que no usa nadie** en lo alto de su torre, y abajo el mejor museo de fotografía del país.
    window:
      label: Ventana óptima
      body: >-
        En noviembre **el sol se pone en Tokio a las cuatro y media**: saliendo de Sengaku-ji sobre las
        cuatro se llega al mirador de Ebisu justo en el crepúsculo. Es gratis y no hay que reservar,
        que es lo contrario de lo que pasó ayer en Shibuya Sky.
    ver:
      - nombre: Sengaku-ji
        maps: Sengakuji Temple Tokyo
        nota: Las cuarenta y siete tumbas de los *rōnin*, con incienso fresco a diario.
        lat: 35.6373043
        lon: 139.7360455
      - ficha: ebisu-meguro
        nota: El Chūshingura entero —la espera de dos años, el asalto, el seppuku— y el barrio de la cerveza.
      - nombre: Mirador de Yebisu Garden Place
        maps: Yebisu Garden Place Tower Tokyo
        nota: Gratis, en lo alto de la torre de treinta y nueve plantas. Para el crepúsculo.
        lat: 35.6420419
        lon: 139.7135595
      - nombre: Museo de Fotografía de Tokio
        maps: Tokyo Photographic Art Museum
        nota: Tres plantas de exposiciones, casi nunca lleno, en el mismo complejo.
        lat: 35.6415430
        lon: 139.7133962
    comer:
      - comida: shodai-ebisu
        nota: El curry udon con mousse de patata. Abre seguido hasta las 21:30; cola casi siempre.
      - comida: pizza-marumo-ebisu
        nota: Napolitana con bonito y kombu, a una manzana. Turno de cena desde las 17:00, con reserva.
  - block: Noche
    time: "noche"
    title: La última noche de esta mitad
    body: >-
      Del mirador de Ebisu a la cama hay **dos paradas de Hibiya**. Y es la última noche aquí: mañana
      las maletas salen hacia Kioto y a la vuelta el hotel estará en otro barrio, más al este: Asakusa
      o Ginza, según la reserva que se quede.

      Para cenar, lo que el barrio tiene y no se ve desde la avenida: **Azabu-Jūban**, una parada de
      Ōedo o un cuarto de hora cuesta abajo, calle comercial de toda la vida con confiterías viejas y
      barras pequeñas en mitad del distrito más caro de la ciudad.

      Y antes de dormir, **la maleta de mañana**: solo lo de una noche, porque el grueso viaja por su
      cuenta. Cómo funciona, en [takkyūbin](#takkyubin).
    ver:
      - nombre: Azabu-Jūban
        maps: Azabu Juban Tokyo
        nota: Calle comercial de toda la vida, con confiterías viejas, a un paseo del hotel.
        lat: 35.6567021
        lon: 139.7361025
    comer:
      - comida: azabu-kuroshari
        nota: Omakase de arroz teñido de negro con carbón, en Azabu-Jūban. Turnos de 18:00 y 20:00.
      - comida: sushiya-ebisu-azabu
        nota: Seis barras de sushi del barrio, como pista sin comprobar. Siempre con reserva.
alt:
  label: Si te desmarcas
  body: >-
    Este día es todo tuyo si ya te sabes el centro, porque no hay nada aquí que el grupo no pueda
    hacer sin ti.

    - [**Roppongi**](#roppongi) y su triángulo de museos: el **Mori** en la planta 53, con el mirador
    desde el que sí se ve la Torre de Tokio —cosa que no pasa desde la propia torre—, el **Centro
    Nacional de Arte** de Kurokawa, que no tiene colección permanente y solo salas, y el **Suntory**
    de Kengo Kuma. A quince minutos andando, el
    [**Zōjō-ji**](https://www.google.com/maps/search/?api=1&query=Zojoji%20Temple%20Tokyo): un portal
    de madera del siglo XVII con la torre roja de 1958 asomando justo detrás, que es el mejor resumen
    visual de este país que hay.
    - **El bosque que no es un jardín**: el
    [**National Park for Nature Study**](https://www.google.com/maps/search/?api=1&query=Institute%20for%20Nature%20Study%20Tokyo)
    de Meguro son treinta hectáreas sin domesticar en mitad de la ciudad, con cupo diario de
    visitantes para que no se llene. Es lo que había aquí antes de que hubiera aquí.
    - Y para acabar sin gente,
    [**Nakameguro**](https://www.google.com/maps/search/?api=1&query=Nakameguro%20Tokyo): cafés y
    anticuarios a lo largo del río. Su fama es de primavera, con ochocientos cerezos en cuatro
    kilómetros de orilla, así que en noviembre se pasea sin esquivar a nadie.
