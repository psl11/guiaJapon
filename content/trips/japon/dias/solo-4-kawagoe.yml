blocks:
  - block: Mañana
    time: "09:30–11:00"
    title: Kita-in, y las tres salas que sobrevivieron
    body: >-
      Del castillo de Edo, el centro del poder Tokugawa durante dos siglos y medio, **no queda nada**:
      lo que no se llevaron los incendios lo remató el terremoto de 1923. Con una excepción, y está
      aquí.

      Cuando Kawagoe se quemó en **1638**, **Tokugawa Iemitsu** mandó desmontar varios pabellones del
      castillo, subirlos por el río y remontarlos en el **Kita-in**. Se entra descalzo: el **kyakuden**,
      con **la sala en la que nació Iemitsu**, y el **shoin**, el tocador de su nodriza **Kasuga no
      Tsubone**, la mujer que gobernó el harén del shōgun. Es **el único sitio del planeta donde se
      entra en una habitación del castillo de Edo**.
    window:
      label: Por qué lo primero
      body: >-
        Abre a las **8:50** y cierra a las **16:30**, a veinte minutos andando de la estación y en
        dirección contraria a la calle de los almacenes. Si lo dejas para después de comer acabas
        corriendo. Entrada **¥400**.

        Y hoy el patio está ocupado: **del 1 al 23 de noviembre el Kita-in acoge el festival de
        crisantemos de Kawagoe**, de 9:00 a 16:00, con las flores en sus estructuras de bambú.
    ver:
      - nombre: Kita-in
        maps: Kitain Temple Kawagoe
        nota: "Además de las salas, un jardín seco y los **538 rakan**, cada uno con una cara distinta."
        lat: 35.9178236
        lon: 139.4889051
  - block: Mediodía
    time: "11:30–14:00"
    title: La calle de los kurazukuri
    body: >-
      Ahora sí, la postal: **Ichiban-gai**, una calle entera de **kurazukuri**, las casas-almacén de los
      comerciantes de Edo, con muros de barro de treinta centímetros, tejas negras y portones de
      hierro. Se construían así **contra el fuego**: tras el incendio de 1893 se reconstruyó con esta
      técnica. Después de comer, el taller de palillos, que abre a las 12:30.
    window:
      label: Ventana óptima
      body: >-
        **Entre semana.** Los fines de semana y festivos Kawagoe se llena de tokiotas; un jueves de
        noviembre la calle es fotografiable de verdad. Los muros negros piden **luz lateral**: mejor
        media mañana o media tarde que el mediodía plano.
    ver:
      - nombre: Toki no Kane
        maps: Toki no Kane Bell Tower Kawagoe
        nota: El campanario da la hora cuatro veces al día. A las 12:00 lo oyes.
        lat: 35.9234837
        lon: 139.4833395
      - nombre: Kashiya Yokochō
        maps: Kashiya Yokocho Kawagoe
        nota: El callejón de los dulces, con caramelo artesano y galleta de boniato, el producto local.
        lat: 35.9250914
        lon: 139.4808048
      - reco: alba-wood-works-kawagoe
        nota: "Tus propios palillos en media hora larga. **Martes a viernes, de 12:30 a 18:00.**"
  - block: Tarde
    time: "14:00–16:30"
    title: Hikawa, y los túneles de los deseos
    body: >-
      A quince minutos al norte, el **Hikawa Jinja**, santuario de parejas. Si sobra tarde, la
      **Kurazukuri Shiryōkan** o el pequeño museo de la ciudad explican cómo se levantaba un muro de
      esos. Vuelta a Ikebukuro y de ahí a Akihabara; el onsen sigue en su sitio.
    window:
      label: Si prefieres apurar la luz
      body: >-
        La alternativa a Hikawa es quedarse en la calle vieja hasta el atardecer, con los almacenes al
        sol bajo y los faroles encendiéndose. Los excursionistas cogen el tren de las cinco, así que
        **la última hora la tienes casi para ti**.
    ver:
      - nombre: Hikawa Jinja
        maps: Kawagoe Hikawa Shrine
        nota: Un túnel de dos mil *ema*, las tablillas de los deseos. De lo más fotogénico de Kantō.
        lat: 35.9271396
        lon: 139.4887762
  - block: Vuelta
    time: "17:00–19:00"
    title: Dos Zeldas el día que salen, y el ramen de Ōtsuka
    body: >-
      Hoy, jueves 5, sale en Japón el ***Zelda: Ocarina of Time*** nuevo, y hacen falta dos copias: una
      para cada Pablo. La vuelta de Kawagoe pasa por Ikebukuro, y a la salida de la estación está la
      tienda central de **Bic Camera**, con planta de videojuegos. Se compran las dos y la segunda se
      entrega el viernes por la noche en Haneda. Después, una parada de Yamanote hasta Ōtsuka para
      cenar.

      Si en Ikebukuro se han agotado, **Yodobashi Akiba**, al lado del hotel, abre hasta las 22:00.
    window:
      label: Antes de comprar, tres cosas
      body: >-
        - **Es solo de Switch 2.** No arranca en una Switch normal: comprobad qué consola lleváis.

        - **La caja japonesa no es metálica.** No hay *steelbook* en Japón, y la portada de lámina
        con relieve de la primera tirada se reparte en Europa y Estados Unidos, no aquí. La versión
        japonesa trae la carátula normal y, mientras duren, los regalos de cada tienda. Si lo que se
        quiere es esa caja, se compra en España.

        - **Precio: ¥8.980 la copia.** El cartucho no tiene región y, según las tiendas que lo venden fuera, trae subtítulos en español. El
        *tax-free* no compensa: son unos ¥800 de devolución por copia, con trámite en la aduana de
        salida.
    ver:
      - nombre: Bic Camera Ikebukuro
        maps: Bic Camera Ikebukuro Honten
        nota: La tienda central de la cadena, a la salida este de la estación. Videojuegos en su planta.
      - nombre: Yodobashi Akiba
        maps: Yodobashi Akiba
        nota: "El plan B, al lado del hotel: un edificio entero de electrónica, abierto hasta las 22:00."
    comer:
      - comida: "nakiryu"
        elegido: true
        nota: "La cena de vuelta: Ōtsuka es una parada después de Ikebukuro. El *tantanmen* que fue estrella Michelin, desde las 18:00."
  - block: Noche
    time: "20:00"
    title: Jazz en directo, en un sótano de Shinjuku
    body: >-
      Si después del ramen de Ōtsuka te queda cuerda, Shinjuku está a un cuarto de hora por la misma
      Yamanote. En Shinjuku-sanchōme, en un sótano desde 1965, está el [Pit Inn](#shinjuku-pit-inn),
      el club donde empezó buena parte del jazz japonés. El pase de noche empieza hacia las 20:00, se
      paga en la puerta y se escucha en silencio. Para volver, el metro Shinjuku de Toei va directo
      hasta Iwamotochō, a tres minutos del hotel.
    dim: true
    window:
      label: Antes de ir
      body: >-
        **Mira la programación de noviembre en su web**: cambia cada mes y hay noches mejores que
        otras. Sin cabeza de cartel no hace falta reservar, y el de noche sale por unos ¥3.000-4.000
        con una consumición.
