title: "Kaiseki"
navLabel: "Kaiseki"
queEs: >-
  El **menú largo de la alta cocina japonesa**: entre ocho y catorce platos pequeños en un orden fijo —aperitivo, sopa clara, sashimi, algo a la brasa, algo al vapor, algo frito, arroz, encurtidos, dulce— cada uno en una vajilla elegida a propósito para ese plato y esa estación.
historia: >-
  La palabra viene de ***kaiseki***, «la piedra en el pecho»: los monjes zen se metían una piedra caliente en el hábito para engañar al hambre durante el ayuno. De ahí pasó a nombrar la **comida ligera que acompañaba la ceremonia del té** en el siglo XVI, y de ahí a lo que hoy es la cocina más cara de Japón. El recorrido entero —de un truco contra el hambre a un menú de trescientos euros— está en la palabra.
dondeMejor: "Kioto · es su ciudad, por el agua blanda, la verdura de montaña y tres siglos de corte"
picante: "—"
veg: "Difícil sin aviso previo · **casi todo se asienta sobre dashi de bonito**. Muchas casas lo adaptan si se avisa **al reservar**, no al llegar; la alternativa segura es la *shōjin ryōri*"
body: >-
  Lo que distingue un *kaiseki* de un menú degustación occidental no es la técnica sino **la sujeción al calendario**: hay platos que solo se sirven una semana al año, y la vajilla, la flor del *tokonoma* y hasta el poema del rollo cambian con ella. En noviembre tocará caqui, castaña, seta *matsutake* si hay suerte, y hoja de arce como decoración comestible.


  Es la comida más cara que se puede hacer en este viaje y hay que decidirlo con cabeza: **si hay que gastar una vez, Kioto es el sitio**. Y si en la mesa hay alguien vegetariano, la conversación honesta es que la *shōjin ryōri* le va a dar una experiencia comparable sin las concesiones.
