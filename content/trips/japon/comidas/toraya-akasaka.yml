body: >-
  Llevan **desde el siglo XVI** haciendo dulces para la corte: primero en Kioto, y desde que el emperador se mudó a Tokio en 1869, también aquí. Su edificio de Akasaka, reconstruido en 2018, es un ejercicio de arquitectura contemporánea que no hace ruido — madera, luz baja y una escalera que baja a una sala de té.


  El ***wagashi*** es la mejor puerta de entrada a la repostería japonesa y **es vegetariano por construcción**: pasta de judía azuki, azúcar y agar-agar de alga en lugar de gelatina. Nada de mantequilla, nada de huevo, nada de animal. Va con el [matcha](#wagashi).
